# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Dependabot Configuration
# تكوين التحديثات التلقائية للمكتبات
# ═══════════════════════════════════════════════════════════════════════════════

version: 2

updates:
  # ─────────────────────────────────────────────────────────────────────────────
  # Python Dependencies (Root)
  # ─────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Aden"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "auto-update"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major updates - review manually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─────────────────────────────────────────────────────────────────────────────
  # Python Services
  # ─────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/apps/services"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Aden"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "services"
    commit-message:
      prefix: "chore(deps)"
    groups:
      services-deps:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "pydantic"
          - "httpx"

  # ─────────────────────────────────────────────────────────────────────────────
  # Node.js Dependencies (Root - Workspaces)
  # ─────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Asia/Aden"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
      - "auto-update"
    commit-message:
      prefix: "chore(deps)"
    groups:
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      next-ecosystem:
        patterns:
          - "next"
          - "eslint-config-next"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─────────────────────────────────────────────────────────────────────────────
  # Flutter/Dart Dependencies
  # ─────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "pub"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Asia/Aden"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "flutter"
      - "mobile"
    commit-message:
      prefix: "chore(deps)"
    groups:
      flutter-core:
        patterns:
          - "flutter_riverpod"
          - "riverpod*"
          - "drift*"
          - "go_router"
        update-types:
          - "minor"
          - "patch"
      ui-packages:
        patterns:
          - "flutter_svg"
          - "cached_network_image"
          - "fl_chart"
          - "google_fonts"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # drift_dev 2.28.1+ needs build/source_gen 3+, incompatible with the
      # retained Freezed/Riverpod 2.x generators. The compatible generator
      # requires drift <2.29. Drift 2.32+ also changes the SQLCipher integration.
      # Revisit together after migration (docs/mobile/FLUTTER_TOOLCHAIN.md).
      - dependency-name: "drift"
        versions: [">=2.29.0"]
      - dependency-name: "drift_dev"
        versions: [">=2.28.1"]
      # 2.6.5 transitively requires freezed_annotation 3.x.
      - dependency-name: "riverpod_generator"
        versions: [">=2.6.5"]

  # ─────────────────────────────────────────────────────────────────────────────
  # GitHub Actions
  # ─────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "Asia/Aden"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker Base Images
  # ─────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/apps/services/vegetation-analysis-service"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/apps/services/crop-intelligence-service"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/apps/services/yolo26-vision-service"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
      - "gpu"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/apps/services/field-management-service"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/apps/services/user-service"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"

  # ─────────────────────────────────────────────────────────────────────────────
  # Infrastructure Docker Images
  # ─────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
      - "infrastructure"
    commit-message:
      prefix: "chore(docker)"
