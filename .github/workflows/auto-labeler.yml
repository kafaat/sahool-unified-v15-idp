# Auto-Labeler - Automatically labels PRs based on changed files
# Uses actions/labeler to classify PRs by area of codebase

name: Auto Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: auto-labeler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply labels based on changed files
        # actions/labeler@v5 is the current stable release. The previous
        # pin to @v6 was invalid — that major version has no registered
        # release tag on the actions/labeler repository, so the runner's
        # "Prepare all required actions" step fails with "An action
        # could not be found at the URI ...tarball/<sha>..." on every PR.
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
