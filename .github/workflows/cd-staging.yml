# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL CD Pipeline - Staging Deployment
# Version: 16.0.0
# Triggers: Push to main branch
# Deployment Order: Starter → Professional → Enterprise (with tests between each)
#
# NOTE: Deployment is skipped when KUBE_CONFIG_STAGING secret is not configured.
#       The workflow will show as successful when intentionally skipped.
# ═══════════════════════════════════════════════════════════════════════════════

name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to deploy'
        required: true
        type: choice
        options:
          - all
          - starter
          - professional
          - enterprise

env:
  ENVIRONMENT: staging
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  KUBERNETES_NAMESPACE: sahool-staging
  HELM_TIMEOUT: 10m

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Pre-deployment Checks
  # ─────────────────────────────────────────────────────────────────────────────
  pre-deploy-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy_starter: ${{ steps.check.outputs.deploy_starter }}
      deploy_professional: ${{ steps.check.outputs.deploy_professional }}
      deploy_enterprise: ${{ steps.check.outputs.deploy_enterprise }}
      kubeconfig_available: ${{ steps.secrets.outputs.kubeconfig_available }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check required secrets
        id: secrets
        run: |
          # Check if kubeconfig is available
          if [ -z "${{ secrets.KUBE_CONFIG_STAGING }}" ]; then
            echo "⚠️ KUBE_CONFIG_STAGING secret is not configured"
            echo "Deployment will be skipped - configure the secret to enable deployments"
            echo "kubeconfig_available=false" >> $GITHUB_OUTPUT
          else
            echo "✅ KUBE_CONFIG_STAGING secret is available"
            echo "kubeconfig_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine deployment scope
        id: check
        run: |
          PACKAGE="${{ github.event.inputs.package || 'all' }}"

          if [ "$PACKAGE" = "all" ] || [ "$PACKAGE" = "starter" ]; then
            echo "deploy_starter=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_starter=false" >> $GITHUB_OUTPUT
          fi

          if [ "$PACKAGE" = "all" ] || [ "$PACKAGE" = "professional" ]; then
            echo "deploy_professional=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_professional=false" >> $GITHUB_OUTPUT
          fi

          if [ "$PACKAGE" = "all" ] || [ "$PACKAGE" = "enterprise" ]; then
            echo "deploy_enterprise=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_enterprise=false" >> $GITHUB_OUTPUT
          fi

      - name: Check Docker images exist
        run: |
          echo "Verifying Docker images are available..."
          # This would check if images with the current SHA exist in the registry
          echo "Images verified for SHA: ${{ github.sha }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Agent Evaluation Gate (Pre-deployment)
  # ─────────────────────────────────────────────────────────────────────────────
  agent-evaluation-gate:
    name: Agent Evaluation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pre-deploy-checks]
    if: needs.pre-deploy-checks.outputs.kubeconfig_available == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # - name: Run Pre-deployment Agent Evaluation
      #   id: eval
      #   uses: ./.github/actions/evaluate-agent
      #   with:
      #     golden-dataset-path: 'tests/golden-datasets'
      #     threshold-accuracy: '0.80'
      #     threshold-latency: '2500'
      #     threshold-cost: '0.60'
      #     threshold-success-rate: '0.90'
      #     generate-report: 'true'
      #     report-path: 'pre-deploy-evaluation.json'

      # - name: Upload pre-deployment evaluation report
      #   if: always()
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: pre-deploy-evaluation-${{ github.sha }}
      #     path: pre-deploy-evaluation.json
      #     retention-days: 90

      # - name: Evaluate results
      #   run: |
      #     if [ "${{ steps.eval.outputs.passed }}" != "true" ]; then
      #       echo "::error::Agent evaluation failed - deployment blocked"
      #       echo "::error::Overall Score: ${{ steps.eval.outputs.overall-score }}/100"
      #       echo "::error::Accuracy: ${{ steps.eval.outputs.accuracy }}"
      #       exit 1
      #     fi
      #
      #     echo "✅ Agent evaluation passed - proceeding with deployment"
      #     echo "Overall Score: ${{ steps.eval.outputs.overall-score }}/100"

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy Starter Package
  # Services: field-management-service, weather-service, advisory-service
  # Note: field-ops → field-management-service, weather-core → weather-service, agro-advisor → advisory-service
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-starter:
    name: Deploy Starter Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pre-deploy-checks, agent-evaluation-gate]
    if: needs.pre-deploy-checks.outputs.deploy_starter == 'true' && needs.pre-deploy-checks.outputs.kubeconfig_available == 'true'
    environment:
      name: staging-starter
      url: https://staging.sahool.io
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure kubectl
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.KUBERNETES_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Docker registry secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=${{ env.KUBERNETES_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy infrastructure services
        run: |
          echo "Deploying PostgreSQL, Redis, NATS..."
          helm upgrade --install infra-staging ./helm/infra \
            --namespace ${{ env.KUBERNETES_NAMESPACE }} \
            --set environment=staging \
            --timeout ${{ env.HELM_TIMEOUT }} \
            --wait

      - name: Deploy Starter services
        run: |
          echo "Deploying Starter package services..."

          # SECURITY: Use --set-file for secrets in a run-scoped temp directory
          # to avoid YAML escaping issues and /tmp collisions between runners.
          SECRETS_DIR=$(mktemp -d "/tmp/helm-secrets-${{ github.run_id }}-XXXXXX")
          trap "rm -rf '$SECRETS_DIR'" EXIT

          printf '%s' "${{ secrets.JWT_SECRET_STAGING }}" > "$SECRETS_DIR/jwt"
          printf '%s' "${{ secrets.DATABASE_URL_STAGING }}" > "$SECRETS_DIR/dburl"

          # Deploy field-management-service (replaces field-ops)
          helm upgrade --install field-management-service ./helm/services/field-management-service \
            --namespace ${{ env.KUBERNETES_NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --set-file secrets.jwtSecret="$SECRETS_DIR/jwt" \
            --set-file database.url="$SECRETS_DIR/dburl" \
            --timeout ${{ env.HELM_TIMEOUT }} \
            --wait

          printf '%s' "${{ secrets.OPENWEATHER_API_KEY }}" > "$SECRETS_DIR/weather"

          # Deploy weather-service (replaces deprecated weather-core)
          helm upgrade --install weather-service ./helm/services/weather-service \
            --namespace ${{ env.KUBERNETES_NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --set-file secrets.openWeatherApiKey="$SECRETS_DIR/weather" \
            --timeout ${{ env.HELM_TIMEOUT }} \
            --wait

          # Deploy advisory-service (replaces deprecated agro-advisor)
          helm upgrade --install advisory-service ./helm/services/advisory-service \
            --namespace ${{ env.KUBERNETES_NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --timeout ${{ env.HELM_TIMEOUT }} \
            --wait

      - name: Wait for services to be ready
        run: |
          kubectl wait --for=condition=ready pod \
            -l package=starter \
            --namespace=${{ env.KUBERNETES_NAMESPACE }} \
            --timeout=300s

      - name: Verify deployments
        run: |
          kubectl get deployments -n ${{ env.KUBERNETES_NAMESPACE }}
          kubectl get pods -n ${{ env.KUBERNETES_NAMESPACE }} -l package=starter

  # ─────────────────────────────────────────────────────────────────────────────
  # Integration Tests - Starter Package
  # ─────────────────────────────────────────────────────────────────────────────
  test-starter:
    name: Test Starter Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [deploy-starter, pre-deploy-checks]
    if: needs.pre-deploy-checks.outputs.kubeconfig_available == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio httpx

      - name: Run integration tests
        run: |
          pytest tests/integration/starter/ -v --tb=short
        env:
          API_BASE_URL: https://staging.sahool.io
          API_KEY: ${{ secrets.STAGING_API_KEY }}

      - name: Run smoke tests
        run: |
          # Test field-management-service health
          curl -f https://staging.sahool.io/api/v1/field-management/health || exit 1

          # Test weather-service health
          curl -f https://staging.sahool.io/api/v1/weather/health || exit 1

          # Test advisory-service health (replaces agro-advisor)
          curl -f https://staging.sahool.io/api/v1/advisory/health || exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy Professional Package
  # Additional Services: crop-intelligence-service, vegetation-analysis-service, irrigation-smart
  # Note: crop-health → crop-intelligence-service, ndvi-engine → vegetation-analysis-service
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-professional:
    name: Deploy Professional Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-starter, pre-deploy-checks]
    if: needs.pre-deploy-checks.outputs.deploy_professional == 'true' && needs.pre-deploy-checks.outputs.kubeconfig_available == 'true'
    environment:
      name: staging-professional
      url: https://staging.sahool.io/professional
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure kubectl
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy Professional services
        run: |
          echo "Deploying Professional package services..."

          # Deploy crop-intelligence-service (replaces deprecated crop-health)
          helm upgrade --install crop-intelligence-service ./helm/services/crop-intelligence-service \
            --namespace ${{ env.KUBERNETES_NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --timeout ${{ env.HELM_TIMEOUT }} \
            --wait

          # Deploy vegetation-analysis-service (replaces deprecated ndvi-engine)
          helm upgrade --install vegetation-analysis-service ./helm/services/vegetation-analysis-service \
            --namespace ${{ env.KUBERNETES_NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --set secrets.sentinelHubId=${{ secrets.SENTINEL_HUB_ID }} \
            --set secrets.sentinelHubSecret=${{ secrets.SENTINEL_HUB_SECRET }} \
            --timeout ${{ env.HELM_TIMEOUT }} \
            --wait

          # Deploy irrigation-smart
          helm upgrade --install irrigation-smart ./helm/services/irrigation-smart \
            --namespace ${{ env.KUBERNETES_NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --timeout ${{ env.HELM_TIMEOUT }} \
            --wait

      - name: Wait for services to be ready
        run: |
          kubectl wait --for=condition=ready pod \
            -l package=professional \
            --namespace=${{ env.KUBERNETES_NAMESPACE }} \
            --timeout=300s

  # ─────────────────────────────────────────────────────────────────────────────
  # Integration Tests - Professional Package
  # ─────────────────────────────────────────────────────────────────────────────
  test-professional:
    name: Test Professional Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [deploy-professional, pre-deploy-checks]
    if: needs.pre-deploy-checks.outputs.kubeconfig_available == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio httpx

      - name: Run integration tests
        run: |
          pytest tests/integration/professional/ -v --tb=short
        env:
          API_BASE_URL: https://staging.sahool.io
          API_KEY: ${{ secrets.STAGING_API_KEY }}

      - name: Run smoke tests
        run: |
          curl -f https://staging.sahool.io/api/v1/crop-intelligence/health || exit 1
          curl -f https://staging.sahool.io/api/v1/vegetation-analysis/health || exit 1
          curl -f https://staging.sahool.io/api/v1/irrigation/health || exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy Enterprise Package
  # Services: vegetation-analysis-service, weather-service, crop-intelligence-service,
  #           yield-prediction-service, billing-core, inventory-service
  # Note: All deprecated services have been migrated to their replacements
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-enterprise:
    name: Deploy Enterprise Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-professional, pre-deploy-checks]
    if: needs.pre-deploy-checks.outputs.deploy_enterprise == 'true' && needs.pre-deploy-checks.outputs.kubeconfig_available == 'true'
    environment:
      name: staging-enterprise
      url: https://staging.sahool.io/enterprise
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure kubectl
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy Enterprise services
        run: |
          echo "Deploying Enterprise package services..."

          # Deploy vegetation-analysis-service (replaces satellite-service)
          helm upgrade --install vegetation-analysis-service ./helm/services/vegetation-analysis-service \
            --namespace ${{ env.KUBERNETES_NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --set secrets.sentinelHubId=${{ secrets.SENTINEL_HUB_ID }} \
            --set secrets.sentinelHubSecret=${{ secrets.SENTINEL_HUB_SECRET }} \
            --timeout ${{ env.HELM_TIMEOUT }} \
            --wait

          # Deploy weather-service (replaces weather-advanced)
          helm upgrade --install weather-service ./helm/services/weather-service \
            --namespace ${{ env.KUBERNETES_NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --timeout ${{ env.HELM_TIMEOUT }} \
            --wait

          # Deploy crop-intelligence-service (replaces crop-health-ai)
          helm upgrade --install crop-intelligence-service ./helm/services/crop-intelligence-service \
            --namespace ${{ env.KUBERNETES_NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --timeout ${{ env.HELM_TIMEOUT }} \
            --wait

          # Deploy yield-prediction-service (replaces deprecated yield-engine)
          helm upgrade --install yield-prediction-service ./helm/services/yield-prediction-service \
            --namespace ${{ env.KUBERNETES_NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --timeout ${{ env.HELM_TIMEOUT }} \
            --wait

          # Deploy billing-core
          helm upgrade --install billing-core ./helm/services/billing-core \
            --namespace ${{ env.KUBERNETES_NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --set secrets.stripeSecretKey=${{ secrets.STRIPE_SECRET_KEY_TEST }} \
            --timeout ${{ env.HELM_TIMEOUT }} \
            --wait

          # Deploy inventory-service
          helm upgrade --install inventory-service ./helm/services/inventory-service \
            --namespace ${{ env.KUBERNETES_NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --timeout ${{ env.HELM_TIMEOUT }} \
            --wait

      - name: Wait for services to be ready
        run: |
          kubectl wait --for=condition=ready pod \
            -l package=enterprise \
            --namespace=${{ env.KUBERNETES_NAMESPACE }} \
            --timeout=300s

  # ─────────────────────────────────────────────────────────────────────────────
  # Integration Tests - Enterprise Package
  # ─────────────────────────────────────────────────────────────────────────────
  test-enterprise:
    name: Test Enterprise Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [deploy-enterprise, pre-deploy-checks]
    if: needs.pre-deploy-checks.outputs.kubeconfig_available == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio httpx

      - name: Run integration tests
        run: |
          pytest tests/integration/enterprise/ -v --tb=short
        env:
          API_BASE_URL: https://staging.sahool.io
          API_KEY: ${{ secrets.STAGING_API_KEY }}

      - name: Run smoke tests
        run: |
          # Health checks for enterprise services
          # Note: API paths updated for new service names
          curl -f https://staging.sahool.io/api/v1/vegetation-analysis/health || exit 1
          curl -f https://staging.sahool.io/api/v1/weather/health || exit 1
          curl -f https://staging.sahool.io/api/v1/crop-intelligence/health || exit 1
          curl -f https://staging.sahool.io/api/v1/yield/health || exit 1
          curl -f https://staging.sahool.io/api/v1/billing/health || exit 1
          curl -f https://staging.sahool.io/api/v1/inventory/health || exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # End-to-End Smoke Tests
  # ─────────────────────────────────────────────────────────────────────────────
  smoke-tests:
    name: End-to-End Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-enterprise, pre-deploy-checks]
    if: needs.pre-deploy-checks.outputs.kubeconfig_available == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio httpx playwright
          playwright install

      - name: Run E2E smoke tests
        run: |
          pytest tests/e2e/smoke/ -v --tb=short
        env:
          APP_URL: https://staging.sahool.io
          API_KEY: ${{ secrets.STAGING_API_KEY }}

      - name: Test critical user flows
        run: |
          # Test user registration and login
          python tests/scripts/test_user_flow.py

          # Test field creation workflow
          python tests/scripts/test_field_workflow.py

          # Test weather data retrieval
          python tests/scripts/test_weather_flow.py
        env:
          APP_URL: https://staging.sahool.io
          TEST_USER_EMAIL: test@sahool.io
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Post-deployment Validation (Agent Evaluation with Golden Dataset)
  # ─────────────────────────────────────────────────────────────────────────────
  post-deploy-validation:
    name: Post-deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
