# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL AI/RAG Container Security Workflow
# Version: 16.0.0
# Updated: February 2026
# 
# Comprehensive security scanning for all AI and RAG services including:
# - Dependency vulnerability scanning (Safety, pip-audit)
# - Container security (Trivy, Grype)
# - SBOM generation
# - License compliance
# ═══════════════════════════════════════════════════════════════════════════════

name: AI/RAG Container Security

on:
  push:
    branches: [main, develop, 'copilot/**', 'claude/**']
    paths:
      - 'apps/services/ai-advisor/**'
      - 'apps/services/ai-agents-service/**'
      - 'apps/services/llm-orchestrator-service/**'
      - 'apps/services/yolo26-vision-service/**'
      - 'apps/services/crop-intelligence-service/**'
      - 'apps/services/field-intelligence/**'
      - 'apps/services/ground-vision-service/**'
      - 'shared/ai/**'
      - 'docker/constraints-ai.txt'
      - 'docker/Dockerfile.ai-base'
      - '.github/workflows/ci-ai-rag-security.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/services/ai-advisor/**'
      - 'apps/services/ai-agents-service/**'
      - 'apps/services/llm-orchestrator-service/**'
      - 'apps/services/yolo26-vision-service/**'
      - 'shared/ai/**'
      - 'docker/constraints-ai.txt'
      - '.github/workflows/ci-ai-rag-security.yml'
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Dependency Vulnerability Scanning
  # ───────────────────────────────────────────────────────────────────────────
  dependency-scan:
    name: Scan AI Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - ai-advisor
          - ai-agents-service
          - llm-orchestrator-service
          - crop-intelligence-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanning tools
        run: |
          pip install --upgrade pip
          pip install safety pip-audit

      - name: Scan with Safety
        continue-on-error: true
        run: |
          echo "🔍 Scanning ${{ matrix.service }} with Safety..."
          
          if [ -f "apps/services/${{ matrix.service }}/requirements.txt" ]; then
            safety scan --target "apps/services/${{ matrix.service }}/requirements.txt" \
              --output json > safety-${{ matrix.service }}.json || true
            
            # Show summary
            safety scan --target "apps/services/${{ matrix.service }}/requirements.txt" || true
          fi

      - name: Scan with pip-audit
        continue-on-error: true
        run: |
          echo "🔍 Auditing ${{ matrix.service }} with pip-audit..."
          
          if [ -f "apps/services/${{ matrix.service }}/requirements.txt" ]; then
            pip-audit -r "apps/services/${{ matrix.service }}/requirements.txt" \
              --format json > audit-${{ matrix.service }}.json || true
            
            # Show summary
            pip-audit -r "apps/services/${{ matrix.service }}/requirements.txt" || true
          fi

      - name: Check for critical vulnerabilities
        run: |
          echo "🔍 Checking for CRITICAL vulnerabilities in ${{ matrix.service }}..."
          
          # This is informational - we don't fail the build here
          if [ -f "safety-${{ matrix.service }}.json" ]; then
            CRITICAL_COUNT=$(cat safety-${{ matrix.service }}.json | grep -i "critical" | wc -l || echo "0")
            echo "Found $CRITICAL_COUNT critical issues"
            
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "⚠️ WARNING: Critical vulnerabilities found in ${{ matrix.service }}"
              echo "Please review the Safety report and update dependencies"
            fi
          fi

      - name: Upload scan results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-scans-${{ matrix.service }}
          path: |
            safety-*.json
            audit-*.json
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # Container Image Security Scanning
  # ───────────────────────────────────────────────────────────────────────────
  container-scan:
    name: Scan AI Containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - ai-advisor
          - ai-agents-service
          - llm-orchestrator-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Free disk space
        run: |
          echo "Freeing disk space for AI container builds..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        id: build
        run: |
          set +e
          echo "🔨 Building ${{ matrix.service }} container..."
          timeout 1200 docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --tag ${{ matrix.service }}:scan \
            --file apps/services/${{ matrix.service }}/Dockerfile \
            . 2>&1
          BUILD_EXIT=$?
          set -e
          if [ $BUILD_EXIT -eq 0 ]; then
            echo "build_success=true" >> $GITHUB_OUTPUT
            echo "✅ Build succeeded"
          else
            echo "build_success=false" >> $GITHUB_OUTPUT
            echo "::warning::Build failed for ${{ matrix.service }} (exit code: $BUILD_EXIT) - skipping security scans"
          fi

      - name: Install Trivy
        if: steps.build.outputs.build_success == 'true'
        id: install_trivy
        run: |
          TRIVY_VERSION="0.69.3"
          echo "Installing Trivy v${TRIVY_VERSION}..."
          for i in 1 2 3 4; do
            echo "Attempt $i: Downloading Trivy..."
            if curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
              -o trivy.tar.gz -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"; then
              tar -xzf trivy.tar.gz trivy
              sudo mv trivy /usr/local/bin/trivy
              rm -f trivy.tar.gz
              trivy --version
              echo "installed=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Download failed, retrying in $((i * 4))s..."
            sleep $((i * 4))
          done
          echo "installed=false" >> $GITHUB_OUTPUT
          echo "::warning::Failed to install Trivy after 4 attempts"

      - name: Cache Trivy DB
        if: steps.install_trivy.outputs.installed == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Run Trivy vulnerability scanner
        if: steps.build.outputs.build_success == 'true' && steps.install_trivy.outputs.installed == 'true'
        continue-on-error: true
        run: |
          trivy image \
            --skip-check-update \
            --format sarif \
            --output trivy-${{ matrix.service }}.sarif \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 \
            --ignore-unfixed \
            --scanners vuln \
            ${{ matrix.service }}:scan || true

      - name: Generate Trivy SARIF fallback
        if: always()
        run: |
          # Create minimal SARIF if Trivy didn't generate one (e.g., build failed)
          if [ ! -f "trivy-${{ matrix.service }}.sarif" ]; then
            echo "Creating empty SARIF file (build or scan did not produce output)..."
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","version":"0.62.1"}},"results":[]}]}' > trivy-${{ matrix.service }}.sarif
          fi

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Run Grype scanner
        if: steps.build.outputs.build_success == 'true'
        uses: anchore/scan-action@v7
        continue-on-error: true
        with:
          image: ${{ matrix.service }}:scan
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Generate SBOM
        if: steps.build.outputs.build_success == 'true'
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ${{ matrix.service }}:scan
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM
        if: steps.build.outputs.build_success == 'true'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 90
          if-no-files-found: warn

      - name: Check image size
        if: steps.build.outputs.build_success == 'true'
        run: |
          echo "📊 Analyzing ${{ matrix.service }} image size..."
          docker images ${{ matrix.service }}:scan --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

          SIZE_MB=$(docker images ${{ matrix.service }}:scan --format "{{.Size}}" | sed 's/MB//' | sed 's/GB/*1024/' | bc 2>/dev/null || echo "0")

          echo "Image size: ${SIZE_MB}MB"

          # Warn if image is larger than 2GB
          if (( $(echo "$SIZE_MB > 2048" | bc -l) )); then
            echo "⚠️ WARNING: Image size is larger than 2GB - consider optimization"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Dockerfile Linting and Best Practices
  # ───────────────────────────────────────────────────────────────────────────
  dockerfile-lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Hadolint
        continue-on-error: true
        run: |
          # Install hadolint
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 || true
          chmod +x /usr/local/bin/hadolint || true

          DOCKERFILES=(
            "apps/services/ai-advisor/Dockerfile"
            "apps/services/ai-agents-service/Dockerfile"
            "apps/services/llm-orchestrator-service/Dockerfile"
            "apps/services/yolo26-vision-service/Dockerfile"
            "docker/Dockerfile.ai-base"
          )

          for df in "${DOCKERFILES[@]}"; do
            if [ -f "$df" ]; then
              echo "Linting $df..."
              hadolint --failure-threshold warning "$df" || true
            fi
          done

      - name: Check Dockerfile security best practices
        run: |
          echo "🔍 Checking Dockerfile security best practices..."
          
          DOCKERFILES=(
            "apps/services/ai-advisor/Dockerfile"
            "apps/services/ai-agents-service/Dockerfile"
            "apps/services/llm-orchestrator-service/Dockerfile"
            "apps/services/yolo26-vision-service/Dockerfile"
          )
          
          ISSUES=0
          
          for dockerfile in "${DOCKERFILES[@]}"; do
            echo "Checking: $dockerfile"
            
            # Check for non-root user
            if ! grep -q "USER.*sahool\|USER.*[^r]" "$dockerfile"; then
              echo "❌ ERROR: No non-root USER directive in $dockerfile"
              ISSUES=$((ISSUES + 1))
            else
              echo "✅ Non-root user found"
            fi
            
            # Check for multi-stage build
            if ! grep -q "FROM.*AS" "$dockerfile"; then
              echo "⚠️ WARNING: No multi-stage build in $dockerfile"
            else
              echo "✅ Multi-stage build found"
            fi
            
            # Check for health check
            if ! grep -q "HEALTHCHECK" "$dockerfile"; then
              echo "⚠️ WARNING: No HEALTHCHECK in $dockerfile"
            else
              echo "✅ Health check found"
            fi
            
            # Check for pinned base image
            if grep -qE "FROM .+:latest" "$dockerfile"; then
              echo "❌ ERROR: Using :latest tag in $dockerfile"
              ISSUES=$((ISSUES + 1))
            else
              echo "✅ Pinned base image"
            fi
            
            echo "---"
          done
          
          if [ $ISSUES -gt 0 ]; then
            echo "❌ Found $ISSUES critical issues"
            exit 1
          fi
          
          echo "✅ All Dockerfiles pass security checks"

  # ───────────────────────────────────────────────────────────────────────────
  # Shared AI Module Security
  # ───────────────────────────────────────────────────────────────────────────
  shared-ai-scan:
    name: Scan Shared AI Modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit on shared AI modules
        run: |
          echo "🔍 Running Bandit security scan on shared/ai/..."
          
          # Run Bandit and create SARIF file (continue on error)
          bandit -r shared/ai/ \
            -ll \
            -ii \
            --format sarif \
            -o bandit-shared-ai.sarif || {
              echo "⚠️ Bandit encountered issues, but SARIF file may still be created"
              # Check if file was created
              if [ ! -f bandit-shared-ai.sarif ]; then
                echo "❌ SARIF file not created"
              else
                echo "✅ SARIF file created"
              fi
            }
          
          # Also output text format for human readability
          bandit -r shared/ai/ \
            -ll \
            -ii \
            --format txt || true
          
          # Verify SARIF file exists and is valid JSON
          if [ -f bandit-shared-ai.sarif ]; then
            echo "📄 Validating SARIF file..."
            python3 -m json.tool bandit-shared-ai.sarif > /dev/null && \
              echo "✅ SARIF file is valid JSON" || \
              echo "⚠️ SARIF file may have issues"
          fi

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('bandit-shared-ai.sarif') != ''
        with:
          sarif_file: bandit-shared-ai.sarif
          category: bandit-shared-ai

  # ───────────────────────────────────────────────────────────────────────────
  # Security Summary Report
  # ───────────────────────────────────────────────────────────────────────────
  security-summary:
    name: AI/RAG Security Summary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - dependency-scan
      - container-scan
      - dockerfile-lint
      - shared-ai-scan
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🤖 AI/RAG Container Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile Lint | ${{ needs.dockerfile-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shared AI Modules | ${{ needs.shared-ai-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Review SARIF reports in Security tab" >> $GITHUB_STEP_SUMMARY
          echo "- Update vulnerable dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- Download and review SBOM artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔒 Security Best Practices Applied" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Multi-stage builds for smaller attack surface" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Non-root user execution" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Pinned dependency versions" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Health checks implemented" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SBOM generation for supply chain security" >> $GITHUB_STEP_SUMMARY
