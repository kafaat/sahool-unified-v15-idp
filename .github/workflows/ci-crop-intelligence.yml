# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL CI Pipeline - Crop Intelligence Service
# Covers: crop-intelligence-service, shared/digital_twin, shared/calibration,
#          shared/process_models, shared/fertilizer_management, shared/soil_testing
# Version: 16.0.0
# ═══════════════════════════════════════════════════════════════════════════════

name: CI - Crop Intelligence

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "claude/**"]
    paths:
      - 'apps/services/crop-intelligence-service/**'
      - 'shared/digital_twin/**'
      - 'shared/calibration/**'
      - 'shared/process_models/**'
      - 'shared/fertilizer_management/**'
      - 'shared/soil_testing/**'
      - 'shared/events/subjects.py'
      - '.github/workflows/ci-crop-intelligence.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/services/crop-intelligence-service/**'
      - 'shared/digital_twin/**'
      - 'shared/calibration/**'
      - 'shared/process_models/**'
      - 'shared/fertilizer_management/**'
      - 'shared/soil_testing/**'
      - 'shared/events/subjects.py'
      - '.github/workflows/ci-crop-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  packages: write
  security-events: write

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Code Quality - Ruff Linting
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linters
        run: |
          pip install --upgrade pip
          pip install ruff black isort mypy

      - name: Run Ruff linter
        run: |
          echo "Running Ruff on crop-intelligence-service and shared modules..."
          ruff check apps/services/crop-intelligence-service/ --output-format=github || true
          ruff check shared/digital_twin/ --output-format=github || true
          ruff check shared/calibration/ --output-format=github || true
          ruff check shared/process_models/ --output-format=github || true

      - name: Run Black formatter check
        run: |
          black --check apps/services/crop-intelligence-service/ || true
          black --check shared/digital_twin/ || true
          black --check shared/calibration/ || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Unit & Integration Tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip

          # Install service dependencies
          if [ -f apps/services/crop-intelligence-service/requirements.txt ]; then
            pip install -r apps/services/crop-intelligence-service/requirements.txt
          fi

          # Install test dependencies
          pip install pytest "pytest-asyncio>=0.23.0,<1.0.0" pytest-cov pytest-xdist httpx fastapi pydantic

          # Install scientific computing
          pip install numpy scipy optuna || true

      - name: Run unit tests
        run: |
          echo "Running unit tests..."
          PYTHONPATH=$PWD pytest tests/unit/test_gap_fixes.py -v --tb=short \
            --cov=shared/digital_twin --cov=shared/calibration --cov=shared/process_models \
            --cov-report=xml --cov-report=term-missing \
            -x

          # Run service-specific tests if they exist
          if [ -d apps/services/crop-intelligence-service/tests ]; then
            PYTHONPATH=$PWD pytest apps/services/crop-intelligence-service/tests -v --tb=short
          fi
        env:
          ENVIRONMENT: test
          PYTHONPATH: .
          JWT_SECRET_KEY: test-secret-key-for-unit-tests-only-32chars
          JWT_ALGORITHM: HS256
          DATABASE_URL: ""
          NATS_URL: ""

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        if: always() && secrets.CODECOV_TOKEN != ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: crop-intelligence
          name: crop-intelligence-coverage

  # ─────────────────────────────────────────────────────────────────────────────
  # Security Scan
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit safety

      - name: Run Bandit security scan
        run: |
          echo "Running Bandit on crop-intelligence-service..."
          bandit -r apps/services/crop-intelligence-service/src/ -ll -ii --format sarif \
            -o bandit-crop-intelligence.sarif 2>/dev/null || true
          bandit -r apps/services/crop-intelligence-service/src/ -ll -ii --format txt || true

          echo "Running Bandit on shared modules..."
          bandit -r shared/digital_twin/ shared/calibration/ shared/process_models/ \
            -ll -ii --format txt || true

          # Create empty SARIF if not exists
          if [ ! -f bandit-crop-intelligence.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Bandit","version":"1.0.0"}},"results":[]}]}' > bandit-crop-intelligence.sarif
          fi

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: bandit-crop-intelligence.sarif
          category: 'bandit-crop-intelligence'

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Docker Image
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker image prune --all --force || true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        env:
          DOCKER_BUILD_SUMMARY: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/crop-intelligence-service
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/services/crop-intelligence-service/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Container Security Scan (Trivy)
  # ─────────────────────────────────────────────────────────────────────────────
  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy || true

      - name: Run Trivy vulnerability scanner
        run: |
          trivy image --severity HIGH,CRITICAL --format sarif \
            --output trivy-crop-intelligence.sarif \
            ${{ env.REGISTRY }}/${{ github.repository }}/crop-intelligence-service:latest || true

          # Create empty SARIF if scan failed
          if [ ! -f trivy-crop-intelligence.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","version":"0.69.1"}},"results":[]}]}' > trivy-crop-intelligence.sarif
          fi

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-crop-intelligence.sarif
          category: 'trivy-crop-intelligence'

  # ─────────────────────────────────────────────────────────────────────────────
  # Helm Chart Lint
  # ─────────────────────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Helm
        run: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Lint Helm chart
        run: |
          helm lint helm/services/crop-intelligence-service/ \
            --values helm/services/crop-intelligence-service/values.yaml \
            --strict

      - name: Lint staging values
        run: |
          helm lint helm/services/crop-intelligence-service/ \
            --values helm/services/crop-intelligence-service/values.yaml \
            --values helm/services/crop-intelligence-service/values-staging.yaml \
            --strict
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Pipeline Summary
  # ─────────────────────────────────────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test, security, build, helm-lint]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# CI Pipeline Summary - Crop Intelligence" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Modules Covered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| crop-intelligence-service | Crop health diagnostics & AI advisory |" >> $GITHUB_STEP_SUMMARY
          echo "| shared/digital_twin | Digital twin pipeline & assimilation |" >> $GITHUB_STEP_SUMMARY
          echo "| shared/calibration | Bayesian calibration engine |" >> $GITHUB_STEP_SUMMARY
          echo "| shared/process_models | Crop growth & nutrient models |" >> $GITHUB_STEP_SUMMARY
          echo "| shared/fertilizer_management | Fertilizer recommendations |" >> $GITHUB_STEP_SUMMARY
          echo "| shared/soil_testing | Soil test interpretation |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Helm Lint | ${{ needs.helm-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
