# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL CI Pipeline - Terrain Services (Matrix Build)
# Continuous Integration for terrain-core, hydrology, and leveling-optimizer services
# Version: 16.0.0
# ═══════════════════════════════════════════════════════════════════════════════

name: CI - Terrain Services

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "claude/**"]
    paths:
      - 'apps/services/terrain-core-service/**'
      - 'apps/services/hydrology-service/**'
      - 'apps/services/leveling-optimizer-service/**'
      - 'shared/**'
      - '.github/workflows/ci-terrain-services.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/services/terrain-core-service/**'
      - 'apps/services/hydrology-service/**'
      - 'apps/services/leveling-optimizer-service/**'
      - 'shared/**'
      - '.github/workflows/ci-terrain-services.yml'
  workflow_dispatch:

# Restrict default permissions for all jobs
permissions:
  contents: read
  actions: read
  pull-requests: read
  packages: write
  security-events: write

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Determine Changed Services
  # ─────────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      terrain-core: ${{ steps.filter.outputs.terrain-core }}
      hydrology: ${{ steps.filter.outputs.hydrology }}
      leveling-optimizer: ${{ steps.filter.outputs.leveling-optimizer }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Use git-diff mode instead of GitHub API to avoid "Bad credentials"
      # errors with github.token. This works because fetch-depth: 0 above
      # fetches full history needed for accurate diff detection.
      - name: Detect file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            terrain-core:
              - 'apps/services/terrain-core-service/**'
              - 'shared/**'
            hydrology:
              - 'apps/services/hydrology-service/**'
              - 'shared/**'
            leveling-optimizer:
              - 'apps/services/leveling-optimizer-service/**'
              - 'shared/**'

      - name: Set matrix for changed services
        id: set-matrix
        run: |
          SERVICES=()

          # Always run all on workflow_dispatch or when shared changes
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SERVICES=("terrain-core-service" "hydrology-service" "leveling-optimizer-service")
          else
            if [ "${{ steps.filter.outputs.terrain-core }}" == "true" ]; then
              SERVICES+=("terrain-core-service")
            fi
            if [ "${{ steps.filter.outputs.hydrology }}" == "true" ]; then
              SERVICES+=("hydrology-service")
            fi
            if [ "${{ steps.filter.outputs.leveling-optimizer }}" == "true" ]; then
              SERVICES+=("leveling-optimizer-service")
            fi
          fi

          # If no services changed, run all (fallback)
          if [ ${#SERVICES[@]} -eq 0 ]; then
            SERVICES=("terrain-core-service" "hydrology-service" "leveling-optimizer-service")
          fi

          # Convert to JSON
          MATRIX=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -cs '{"service": .}')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Services to build: ${SERVICES[*]}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Code Quality - Ruff Linting (Matrix)
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linters
        run: |
          pip install --upgrade pip
          pip install ruff black isort mypy

      - name: Run Ruff linter
        run: |
          echo "🔍 Running Ruff on ${{ matrix.service }}..."
          SERVICE_PATH="apps/services/${{ matrix.service }}"
          if [ -d "$SERVICE_PATH" ]; then
            ruff check "$SERVICE_PATH" --output-format=github || true
          else
            echo "⚠️ Service path not found: $SERVICE_PATH"
          fi

      - name: Run Black formatter check
        run: |
          SERVICE_PATH="apps/services/${{ matrix.service }}"
          if [ -d "$SERVICE_PATH" ]; then
            black --check "$SERVICE_PATH" || true
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Unit & Integration Tests (Matrix)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, lint]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          SERVICE_PATH="apps/services/${{ matrix.service }}"

          # Install service-specific dependencies
          if [ -f "$SERVICE_PATH/requirements.txt" ]; then
            pip install -r "$SERVICE_PATH/requirements.txt"
          fi

          # Install test dependencies
          pip install pytest "pytest-asyncio>=0.23.0,<1.0.0" pytest-cov pytest-xdist httpx fastapi pydantic

          # Install terrain/GIS specific dependencies
          pip install numpy scipy shapely pyproj rasterio geopandas || true

      - name: Run tests
        run: |
          SERVICE_PATH="apps/services/${{ matrix.service }}"
          echo "🧪 Running tests for ${{ matrix.service }}..."

          if [ -d "$SERVICE_PATH/tests" ]; then
            PYTHONPATH=$PWD pytest "$SERVICE_PATH/tests" -v --tb=short \
              --cov="$SERVICE_PATH" --cov-report=xml --cov-report=term-missing \
              -x --timeout=120 || true
          else
            echo "⚠️ No tests directory found for ${{ matrix.service }}"
          fi
        env:
          ENVIRONMENT: test
          PYTHONPATH: .
          JWT_SECRET_KEY: test-secret-key-for-unit-tests-only-32chars
          JWT_ALGORITHM: HS256
          DATABASE_URL: ""
          NATS_URL: ""

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        if: always()
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage

  # ─────────────────────────────────────────────────────────────────────────────
  # Security Scan (Matrix)
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, lint]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit safety

      - name: Run Bandit security scan
        run: |
          SERVICE_PATH="apps/services/${{ matrix.service }}"
          echo "🔒 Running Bandit on ${{ matrix.service }}..."

          if [ -d "$SERVICE_PATH" ]; then
            bandit -r "$SERVICE_PATH" -ll -ii --format sarif -o "bandit-${{ matrix.service }}.sarif" 2>/dev/null || true
            bandit -r "$SERVICE_PATH" -ll -ii --format txt || true
          fi

          # Create empty SARIF if not exists
          if [ ! -f "bandit-${{ matrix.service }}.sarif" ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Bandit","version":"1.0.0"}},"results":[]}]}' > "bandit-${{ matrix.service }}.sarif"
          fi

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: bandit-${{ matrix.service }}.sarif
          category: 'bandit-${{ matrix.service }}'

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Docker Images (Matrix)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Pre-pull BuildKit image
        run: |
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i: Pulling moby/buildkit:v0.12.5..."
            if timeout 120 docker pull moby/buildkit:v0.12.5; then
              echo "✅ Successfully pulled buildkit image"
              exit 0
            fi
            # Exponential backoff: 15s, 30s, 60s, 120s, 240s, 300s
            WAIT_TIME=$((15 * (2 ** (i - 1))))
            if [ $WAIT_TIME -gt 300 ]; then WAIT_TIME=300; fi
            echo "⚠️ Pull failed, waiting ${WAIT_TIME} seconds before retry..."
            sleep $WAIT_TIME
          done
          echo "❌ Failed to pull buildkit after 6 attempts, continuing anyway..."
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.5
            network=host
        env:
          DOCKER_BUILD_SUMMARY: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Check Dockerfile exists
        id: check-dockerfile
        run: |
          SERVICE_PATH="apps/services/${{ matrix.service }}"
          if [ -f "$SERVICE_PATH/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Dockerfile if not exists
        if: steps.check-dockerfile.outputs.exists == 'false'
        run: |
          SERVICE_PATH="apps/services/${{ matrix.service }}"

          # Determine port based on service
          case "${{ matrix.service }}" in
            terrain-core-service) PORT=8130 ;;
            hydrology-service) PORT=8131 ;;
            leveling-optimizer-service) PORT=8132 ;;
            *) PORT=8130 ;;
          esac

          cat > "$SERVICE_PATH/Dockerfile" << EOF
          # ${{ matrix.service }} Dockerfile
          FROM python:3.11-slim

          # Install GDAL and GIS dependencies
          RUN apt-get update && apt-get install -y \\
              gdal-bin \\
              libgdal-dev \\
              libgeos-dev \\
              libproj-dev \\
              && rm -rf /var/lib/apt/lists/*

          # Create non-root user
          RUN useradd -m -u 1000 appuser

          WORKDIR /app

          # Copy and install requirements
          COPY apps/services/${{ matrix.service }}/requirements.txt ./requirements.txt 2>/dev/null || true
          RUN pip install --no-cache-dir fastapi uvicorn pydantic numpy scipy shapely pyproj rasterio geopandas || true
          RUN if [ -f requirements.txt ]; then pip install --no-cache-dir -r requirements.txt; fi

          # Copy shared modules
          COPY shared/ ./shared/

          # Copy application
          COPY apps/services/${{ matrix.service }}/src/ ./src/

          RUN chown -R appuser:appuser /app
          USER appuser

          ENV PYTHONPATH=/app
          ENV ENVIRONMENT=production

          HEALTHCHECK --interval=30s --timeout=10s --start-period=30s --retries=3 \\
              CMD curl -f http://localhost:$PORT/healthz || exit 1

          EXPOSE $PORT

          CMD ["python", "-m", "uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "$PORT"]
          EOF

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/services/${{ matrix.service }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # DISABLED: GitHub Actions Cache service is intermittently unavailable
          # cache-from: type=gha,scope=${{ matrix.service }}
          # cache-to: type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
        # Continue on transient Docker Hub errors
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Container Security Scan (Matrix)
  # ─────────────────────────────────────────────────────────────────────────────
  container-scan:
    name: Scan - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - name: Free up disk space
        run: |
          echo "🧹 Freeing up disk space..."
          # Remove unnecessary packages and files to prevent "no space left on device" errors
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h

      - name: Install Trivy
        id: install_trivy
        run: |
          TRIVY_VERSION="0.69.3"
          echo "📦 Installing Trivy v${TRIVY_VERSION}..."
          for i in 1 2 3 4; do
            echo "Attempt $i: Downloading Trivy..."
            if curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
              -o trivy.tar.gz -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"; then
              tar -xzf trivy.tar.gz trivy
              sudo mv trivy /usr/local/bin/trivy
              rm -f trivy.tar.gz
              trivy --version
              echo "installed=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Download failed, retrying in $((i * 4))s..."
            sleep $((i * 4))
          done
          echo "installed=false" >> $GITHUB_OUTPUT
          echo "::warning::Failed to install Trivy after 4 attempts"

      - name: Cache Trivy DB
        if: steps.install_trivy.outputs.installed == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Run Trivy vulnerability scanner
        if: steps.install_trivy.outputs.installed == 'true'
        continue-on-error: true
        run: |
          echo "🔍 Running Trivy vulnerability scanner..."
          trivy image \
            --skip-check-update \
            --format sarif \
            --output trivy-${{ matrix.service }}.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --ignore-unfixed \
            --scanners vuln \
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }} || true

          # Ensure SARIF file exists
          if [ ! -f "trivy-${{ matrix.service }}.sarif" ]; then
            echo "Creating empty SARIF file..."
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","version":"0.62.1"}},"results":[]}]}' > trivy-${{ matrix.service }}.sarif
          fi

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: 'trivy-${{ matrix.service }}'

  # ─────────────────────────────────────────────────────────────────────────────
  # Pipeline Summary
  # ─────────────────────────────────────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint, test, security, build]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# 🚀 CI Pipeline Summary - Terrain Services" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Services Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| terrain-core-service | Digital elevation models & terrain analysis |" >> $GITHUB_STEP_SUMMARY
          echo "| hydrology-service | Water flow & drainage calculations |" >> $GITHUB_STEP_SUMMARY
          echo "| leveling-optimizer-service | Land leveling optimization |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
