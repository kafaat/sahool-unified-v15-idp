# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL CI Pipeline - YOLO26 Vision Service
# Continuous Integration for computer vision service with CUDA support
# Version: 16.0.0
# ═══════════════════════════════════════════════════════════════════════════════

name: CI - YOLO26 Vision Service

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "claude/**"]
    paths:
      - 'apps/services/yolo26-vision-service/**'
      - 'shared/**'
      - '.github/workflows/ci-yolo26-vision.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/services/yolo26-vision-service/**'
      - 'shared/**'
      - '.github/workflows/ci-yolo26-vision.yml'
  workflow_dispatch:

# Restrict default permissions for all jobs
permissions:
  contents: read
  actions: read
  packages: write
  security-events: write

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: sahool
  SERVICE_NAME: yolo26-vision-service
  SERVICE_PATH: apps/services/yolo26-vision-service

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Code Quality - Ruff Linting
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linters
        run: |
          pip install --upgrade pip
          pip install ruff black isort mypy

      - name: Run Ruff linter
        run: |
          echo "🔍 Running Ruff on ${{ env.SERVICE_NAME }}..."
          ruff check ${{ env.SERVICE_PATH }} --output-format=github
        continue-on-error: true

      - name: Run Black formatter check
        run: |
          echo "🎨 Checking code formatting with Black..."
          black --check ${{ env.SERVICE_PATH }}
        continue-on-error: true

      - name: Generate lint summary
        if: always()
        run: |
          echo "## 🔍 Lint Results - ${{ env.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ruff | Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Black | Completed |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # Unit & Integration Tests with Coverage
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install service-specific dependencies if requirements.txt exists
          if [ -f "${{ env.SERVICE_PATH }}/requirements.txt" ]; then
            pip install -r ${{ env.SERVICE_PATH }}/requirements.txt
          fi
          # Install test dependencies
          pip install pytest "pytest-asyncio>=0.23.0,<1.0.0" pytest-cov pytest-xdist httpx fastapi pydantic
          # Install vision-specific dependencies (CPU versions for CI)
          pip install numpy pillow opencv-python-headless
          # Mock ultralytics for testing without full CUDA
          pip install ultralytics --no-deps || true

      - name: Run unit tests
        run: |
          echo "🧪 Running unit tests for ${{ env.SERVICE_NAME }}..."
          if [ -d "${{ env.SERVICE_PATH }}/tests" ]; then
            PYTHONPATH=$PWD pytest ${{ env.SERVICE_PATH }}/tests -v --tb=short \
              --cov=${{ env.SERVICE_PATH }} --cov-report=xml --cov-report=term-missing \
              -x --timeout=120 || true
          else
            echo "⚠️ No tests directory found"
          fi
        env:
          ENVIRONMENT: test
          PYTHONPATH: .
          JWT_SECRET_KEY: test-secret-key-for-unit-tests-only-32chars
          JWT_ALGORITHM: HS256
          DATABASE_URL: ""
          NATS_URL: ""
          REDIS_URL: ""
          MODEL_BASE_PATH: /tmp/yolo26-test-models

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        if: always()
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: yolo26-vision
          name: yolo26-vision-coverage

      - name: Generate test summary
        if: always()
        run: |
          echo "## 🧪 Test Results - ${{ env.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "coverage.xml" ]; then
            COV=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); print(f\"{float(tree.getroot().attrib.get('line-rate', 0)) * 100:.1f}%\")" 2>/dev/null || echo "N/A")
            echo "**Coverage:** $COV" >> $GITHUB_STEP_SUMMARY
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Security Scan (Bandit)
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          echo "🔒 Running Bandit security analysis on ${{ env.SERVICE_NAME }}..."
          bandit -r ${{ env.SERVICE_PATH }} -ll -ii --format sarif -o bandit-results.sarif 2>/dev/null || true
          bandit -r ${{ env.SERVICE_PATH }} -ll -ii --format txt || true

          # Create empty SARIF if file doesn't exist
          if [ ! -f "bandit-results.sarif" ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Bandit","version":"1.0.0"}},"results":[]}]}' > bandit-results.sarif
          fi

      - name: Upload Bandit SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: bandit-results.sarif
          category: 'bandit-yolo26-vision'

      - name: Check for high-severity issues
        run: |
          if [ -f "bandit-results.sarif" ]; then
            HIGH_SEVERITY=$(cat bandit-results.sarif | jq '[.runs[0].results[]? | select(.level == "error")] | length' 2>/dev/null || echo "0")
            if [ "$HIGH_SEVERITY" -gt "0" ]; then
              echo "::warning::Bandit found $HIGH_SEVERITY high-severity issues in ${{ env.SERVICE_NAME }}"
            fi
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Docker Image with CUDA Support
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image (CUDA)
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Free up disk space
        run: |
          echo "Freeing disk space for CUDA Docker build..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Pre-pull BuildKit image
        run: |
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i: Pulling moby/buildkit:v0.12.5..."
            if timeout 120 docker pull moby/buildkit:v0.12.5; then
              echo "✅ Successfully pulled buildkit image"
              exit 0
            fi
            # Exponential backoff: 15s, 30s, 60s, 120s, 240s, 300s
            WAIT_TIME=$((15 * (2 ** (i - 1))))
            if [ $WAIT_TIME -gt 300 ]; then WAIT_TIME=300; fi
            echo "⚠️ Pull failed, waiting ${WAIT_TIME} seconds before retry..."
            sleep $WAIT_TIME
          done
          echo "❌ Failed to pull buildkit after 6 attempts, continuing anyway..."
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.5
            network=host
        env:
          DOCKER_BUILD_SUMMARY: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Check Dockerfile exists
        id: check-dockerfile
        run: |
          if [ -f "${{ env.SERVICE_PATH }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Dockerfile found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No Dockerfile found - creating standard Python Dockerfile"
          fi

      - name: Create Dockerfile if not exists
        if: steps.check-dockerfile.outputs.exists == 'false'
        run: |
          cat > ${{ env.SERVICE_PATH }}/Dockerfile << 'EOF'
          # YOLO26 Vision Service Dockerfile with CUDA support
          # Base image with CUDA for GPU inference
          FROM nvidia/cuda:12.1-cudnn8-runtime-ubuntu22.04 AS base

          # Install Python and system dependencies
          RUN apt-get update && apt-get install -y \
              python3.11 \
              python3-pip \
              python3.11-venv \
              libgl1-mesa-glx \
              libglib2.0-0 \
              libsm6 \
              libxext6 \
              libxrender-dev \
              && rm -rf /var/lib/apt/lists/*

          # Set Python 3.11 as default
          RUN update-alternatives --install /usr/bin/python python /usr/bin/python3.11 1

          # Create app user for security
          RUN useradd -m -u 1000 appuser

          WORKDIR /app

          # Copy requirements and install dependencies
          COPY apps/services/yolo26-vision-service/requirements.txt ./requirements.txt
          RUN pip install --no-cache-dir -r requirements.txt 2>/dev/null || \
              pip install --no-cache-dir fastapi uvicorn pydantic numpy pillow opencv-python-headless ultralytics

          # Copy shared modules
          COPY shared/ ./shared/

          # Copy application code
          COPY apps/services/yolo26-vision-service/src/ ./src/

          # Create model weights directory
          RUN mkdir -p /app/models_weights && chown -R appuser:appuser /app

          # Switch to non-root user
          USER appuser

          # Environment variables
          ENV PYTHONPATH=/app
          ENV ENVIRONMENT=production
          ENV CUDA_VISIBLE_DEVICES=0

          # Health check
          HEALTHCHECK --interval=30s --timeout=10s --start-period=60s --retries=3 \
              CMD curl -f http://localhost:8150/healthz || exit 1

          EXPOSE 8150

          CMD ["python", "-m", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8150"]
          EOF

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # DISABLED: GitHub Actions Cache service is intermittently unavailable
          # cache-from: type=gha,scope=${{ env.SERVICE_NAME }}
          # cache-to: type=gha,scope=${{ env.SERVICE_NAME }},mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=16.0.0
        # Continue on transient Docker Hub errors
        continue-on-error: true

      - name: Generate build summary
        if: always()
        run: |
          echo "## 🐳 Docker Build - ${{ env.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**CUDA:** Enabled (12.1 + cuDNN 8)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "✅ Image pushed to registry" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏸️ Image built but not pushed (not main branch)" >> $GITHUB_STEP_SUMMARY
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Container Security Scan (Trivy)
  # ─────────────────────────────────────────────────────────────────────────────
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Free up disk space
        run: |
          echo "🧹 Freeing up disk space..."
          # Remove unnecessary packages and files to prevent "no space left on device" errors
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h

      - name: Install Trivy
        id: install_trivy
        run: |
          TRIVY_VERSION="0.62.1"
          echo "📦 Installing Trivy v${TRIVY_VERSION}..."
          for i in 1 2 3 4; do
            echo "Attempt $i: Downloading Trivy..."
            if curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
              -o trivy.tar.gz -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"; then
              tar -xzf trivy.tar.gz trivy
              sudo mv trivy /usr/local/bin/trivy
              rm -f trivy.tar.gz
              trivy --version
              echo "installed=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Download failed, retrying in $((i * 4))s..."
            sleep $((i * 4))
          done
          echo "installed=false" >> $GITHUB_OUTPUT
          echo "::warning::Failed to install Trivy after 4 attempts"

      - name: Cache Trivy DB
        if: steps.install_trivy.outputs.installed == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Run Trivy vulnerability scanner
        if: steps.install_trivy.outputs.installed == 'true'
        continue-on-error: true
        run: |
          echo "🔍 Running Trivy vulnerability scanner..."
          trivy image \
            --skip-check-update \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --ignore-unfixed \
            --scanners vuln \
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}:${{ github.sha }} || true

          # Ensure SARIF file exists
          if [ ! -f "trivy-results.sarif" ]; then
            echo "Creating empty SARIF file..."
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","version":"0.62.1"}},"results":[]}]}' > trivy-results.sarif
          fi

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: 'trivy-yolo26-vision'

  # ─────────────────────────────────────────────────────────────────────────────
  # Pipeline Summary
  # ─────────────────────────────────────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()
    steps:
      - name: Generate final summary
        run: |
          echo "# 🚀 CI Pipeline Summary - YOLO26 Vision Service" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
