# SPDX-License-Identifier: Proprietary
# Decision-Core Quality Gates — neutrality + unit tests for the Decision Kernel.
# Distinct from quality-gates.yml (broader): this one is scoped to the kernel
# surfaces and runs on every PR that touches them.
name: Decision-Core Quality Gates

on:
  pull_request:
    paths:
      - 'shared/digital_twin/**'
      - 'shared/crop_cards/**'
      - 'shared/process_models/**'
      - 'shared/knowledge_layer/**'
      - 'shared/workspace/**'
      - 'tests/unit/test_digital_twin_*.py'
      - 'tests/unit/test_crop_cards*.py'
      - 'tests/unit/test_process_models_units*.py'
      - 'tests/unit/test_knowledge_layer*.py'
      - 'tests/unit/test_workspace*.py'
      - 'scripts/check_decision_neutrality.py'
      - '.github/workflows/decision-core-quality-gates.yml'
  push:
    branches: [main, develop]
    paths:
      - 'shared/digital_twin/**'
      - 'shared/crop_cards/**'
      - 'shared/process_models/**'
      - 'shared/knowledge_layer/**'
      - 'shared/workspace/**'

permissions:
  contents: read

jobs:
  neutrality:
    name: Neutrality guard (STRICT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run neutrality guard
        run: python scripts/check_decision_neutrality.py

  tests:
    name: Decision-core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # The Decision Kernel modules sit inside shared/digital_twin/ whose
          # __init__.py pulls in assimilation (structlog) and repository
          # (asyncpg). Install the full testing requirements so the package
          # imports cleanly, then add asyncpg explicitly (not in testing.txt).
          pip install -r requirements/testing.txt
          pip install "asyncpg>=0.29,<0.32"
      - name: Run decision-core tests
        run: |
          pytest \
            tests/unit/test_digital_twin_errors.py \
            tests/unit/test_digital_twin_field_lifecycle.py \
            tests/unit/test_digital_twin_evidence_class.py \
            tests/unit/test_digital_twin_pesticide_gate.py \
            tests/unit/test_digital_twin_models_extension.py \
            tests/unit/test_digital_twin_decision_chain.py \
            tests/unit/test_digital_twin_feedback_loop.py \
            tests/unit/test_process_models_units.py \
            tests/unit/test_crop_cards.py \
            tests/unit/test_knowledge_layer.py \
            tests/unit/test_workspace.py \
            -v --tb=short
