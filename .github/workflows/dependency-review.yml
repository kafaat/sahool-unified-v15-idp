# Dependency Review - Scans PRs for vulnerable/malicious dependencies
# https://github.com/actions/dependency-review-action

name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail on high/critical vulnerabilities
          fail-on-severity: high

          # Block specific license types (copyleft)
          # Note: allow-licenses and deny-licenses are mutually exclusive
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

          # Comment summary on PR
          comment-summary-in-pr: always

          # Warn on moderate vulnerabilities (don't fail)
          warn-only: false

      - name: Upload dependency review results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-review-results
          path: |
            dependency-review-report.json
          retention-days: 30
          if-no-files-found: ignore
