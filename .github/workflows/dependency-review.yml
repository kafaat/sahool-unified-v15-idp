# Dependency Review - Scans PRs for vulnerable/malicious dependencies
# https://github.com/actions/dependency-review-action

name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail on high/critical vulnerabilities
          fail-on-severity: high

          # Block specific license types (copyleft)
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

          # Allow known development-only licenses
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense, CC0-1.0, CC-BY-4.0, Python-2.0, PSF-2.0

          # Comment summary on PR
          comment-summary-in-pr: always

          # Warn on moderate vulnerabilities (don't fail)
          warn-only: false

          # Check for known malicious packages
          deny-groups: known-malware

      - name: Upload dependency review results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-review-results
          path: |
            dependency-review-report.json
          retention-days: 30
          if-no-files-found: ignore
