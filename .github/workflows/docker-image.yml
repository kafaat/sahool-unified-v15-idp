name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Validate Dockerfiles for PRs (fast, doesn't require Docker Hub)
  validate:
    name: Validate Dockerfiles
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        service:
          # Active services
          - name: crop-growth-model
            path: apps/services/crop-growth-model
          - name: indicators-service
            path: apps/services/indicators-service
          - name: irrigation-smart
            path: apps/services/irrigation-smart
          # yield-engine: DEPRECATED → yield-prediction-service (archived)
          - name: notification-service
            path: apps/services/notification-service
          - name: marketplace-service
            path: apps/services/marketplace-service
          - name: iot-service
            path: apps/services/iot-service
          - name: virtual-sensors
            path: apps/services/virtual-sensors
          - name: vegetation-analysis-service
            path: apps/services/vegetation-analysis-service
          - name: advisory-service
            path: apps/services/advisory-service
          - name: weather-service
            path: apps/services/weather-service
          - name: crop-intelligence-service
            path: apps/services/crop-intelligence-service
          - name: field-management-service
            path: apps/services/field-management-service
          # DEPRECATED - see docs/DEPRECATED_SERVICES.md
          # satellite-service → vegetation-analysis-service
          # weather-advanced → weather-service
          # fertilizer-advisor → advisory-service
      fail-fast: false

    steps:
    - uses: actions/checkout@v6

    - name: Check if Dockerfile exists
      id: check
      run: |
        if [ -f "${{ matrix.service.path }}/Dockerfile" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "✅ Dockerfile exists for ${{ matrix.service.name }}"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "⚠️ No Dockerfile found for ${{ matrix.service.name }}"
        fi

    - name: Validate Dockerfile syntax
      if: steps.check.outputs.exists == 'true'
      run: |
        echo "Validating Dockerfile for ${{ matrix.service.name }}..."
        if ! grep -q "^FROM " "${{ matrix.service.path }}/Dockerfile"; then
          echo "❌ Invalid Dockerfile: missing FROM instruction"
          exit 1
        fi
        echo "✅ Dockerfile syntax valid"

    - name: Summary
      run: |
        echo "### ✅ Dockerfile Validation: ${{ matrix.service.name }}" >> $GITHUB_STEP_SUMMARY
        echo "Dockerfile validation passed. Full build runs on merge to main." >> $GITHUB_STEP_SUMMARY

  # Full Docker builds only on push to main
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      matrix:
        service:
          # Active services
          - name: crop-growth-model
            path: apps/services/crop-growth-model
          - name: indicators-service
            path: apps/services/indicators-service
          - name: irrigation-smart
            path: apps/services/irrigation-smart
          # yield-engine: DEPRECATED → yield-prediction-service (archived)
          - name: notification-service
            path: apps/services/notification-service
          - name: marketplace-service
            path: apps/services/marketplace-service
          - name: iot-service
            path: apps/services/iot-service
          - name: virtual-sensors
            path: apps/services/virtual-sensors
          - name: vegetation-analysis-service
            path: apps/services/vegetation-analysis-service
          - name: advisory-service
            path: apps/services/advisory-service
          - name: weather-service
            path: apps/services/weather-service
          - name: crop-intelligence-service
            path: apps/services/crop-intelligence-service
          - name: field-management-service
            path: apps/services/field-management-service
          # ─────────────────────────────────────────────────────────────
          # DEPRECATED services - see docs/DEPRECATED_SERVICES.md
          # satellite-service → vegetation-analysis-service
          # weather-advanced → weather-service
          # crop-health-ai → crop-intelligence-service
          # fertilizer-advisor → advisory-service
          # ─────────────────────────────────────────────────────────────
      fail-fast: false

    steps:
    - name: Free up disk space
      run: |
        echo "Disk space before cleanup:"
        df -h
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force || true
        echo "Disk space after cleanup:"
        df -h

    - uses: actions/checkout@v6

    # Login to Docker Hub to avoid rate limiting when pulling base images
    # Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets for better reliability
    # Skip login entirely when secrets are not configured to avoid "Username and password required" error
    - name: Check Docker Hub credentials
      id: docker_creds
      run: |
        if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "⚠️ Docker Hub credentials not configured - builds will use anonymous pulls"
        fi
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to Docker Hub
      if: steps.docker_creds.outputs.available == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      continue-on-error: true

    - name: Check if Dockerfile exists
      id: check_dockerfile
      run: |
        if [ -f "${{ matrix.service.path }}/Dockerfile" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Build the Docker image
      if: steps.check_dockerfile.outputs.exists == 'true'
      run: |
        # Retry logic for transient Docker Hub failures
        max_attempts=3
        attempt=1
        while [ $attempt -le $max_attempts ]; do
          echo "Build attempt $attempt of $max_attempts..."
          if docker build . \
            --file ${{ matrix.service.path }}/Dockerfile \
            --tag sahool/${{ matrix.service.name }}:${{ github.sha }}; then
            echo "Build succeeded on attempt $attempt"
            exit 0
          fi
          echo "Build failed on attempt $attempt"
          if [ $attempt -lt $max_attempts ]; then
            sleep_time=$((attempt * 10))
            echo "Waiting ${sleep_time}s before retry..."
            sleep $sleep_time
          fi
          attempt=$((attempt + 1))
        done
        echo "Build failed after $max_attempts attempts"
        exit 1
