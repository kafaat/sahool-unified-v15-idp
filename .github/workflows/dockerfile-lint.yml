# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Dockerfile Linting - hadolint
# فحص ملفات Docker لمنصة سهول
# ═══════════════════════════════════════════════════════════════════════════════

name: Dockerfile Lint

on:
  pull_request:
    paths:
      - "**/Dockerfile*"
      - ".hadolint.yaml"
  push:
    branches: [main, develop]
    paths:
      - "**/Dockerfile*"
      - ".hadolint.yaml"

concurrency:
  group: dockerfile-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Dockerfiles
        id: find
        run: |
          FILES=$(find . -name "Dockerfile*" -not -path "./.git/*" -not -path "./archive/*" -not -path "./node_modules/*" | sort)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=$(echo "$FILES" | wc -l)" >> $GITHUB_OUTPUT

      - name: Download hadolint
        run: |
          curl -sL "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64" -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Run hadolint
        run: |
          ERRORS=0
          while IFS= read -r f; do
            if ! hadolint --config .hadolint.yaml "$f"; then
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -name "Dockerfile*" -not -path "./.git/*" -not -path "./archive/*" -not -path "./node_modules/*" -not -path "./idp/templates/*" | sort)
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::hadolint found issues in $ERRORS Dockerfile(s)"
            exit 1
          fi

      - name: Summary
        if: always()
        run: echo "Scanned ${{ steps.find.outputs.count }} Dockerfiles"
