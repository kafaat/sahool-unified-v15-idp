# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Dockerfile Linting - hadolint
# فحص ملفات Docker لمنصة سهول
# ═══════════════════════════════════════════════════════════════════════════════

name: Dockerfile Lint

on:
  pull_request:
    paths:
      - "**/Dockerfile*"
      - ".hadolint.yaml"
  push:
    branches: [main, develop]
    paths:
      - "**/Dockerfile*"
      - ".hadolint.yaml"

concurrency:
  group: dockerfile-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Dockerfiles
        id: find
        run: |
          FILES=$(find . -name "Dockerfile*" -not -path "./.git/*" -not -path "./archive/*" -not -path "./node_modules/*" | sort)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=$(echo "$FILES" | wc -l)" >> $GITHUB_OUTPUT

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          config: .hadolint.yaml
          ignore: DL3008,DL3013,DL3018

      - name: Summary
        if: always()
        run: echo "Scanned ${{ steps.find.outputs.count }} Dockerfiles"
