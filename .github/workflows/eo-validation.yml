name: EO Offline Validation
on:
  pull_request:
    paths:
      - 'tools/eo-validation/**'
      - '.github/workflows/eo-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install isolated validation dependencies
        run: python -m pip install -r tools/eo-validation/requirements.txt ruff==0.15.11
      - name: Lint and format check
        run: |
          ruff check tools/eo-validation
          ruff format --check tools/eo-validation
      - name: Run exact tests and independent receipt gate
        run: python tools/eo-validation/run_checks.py --output-dir "$RUNNER_TEMP/eo-validation-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Preserve receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eo-validation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eo-validation-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
