name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release/debug)'
        required: true
        default: 'debug'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter-apk.yml'

env:
  FLUTTER_VERSION: '3.27.1'
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  build-apk:
    name: Build Sahool APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "platform-tools" || echo "::warning::Some SDK components failed to install"
          echo "Installed SDK packages:"
          sdkmanager --list_installed 2>/dev/null | head -20 || true

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Verify Flutter Setup
        run: |
          flutter doctor -v
          echo "Flutter and Android SDK verification complete"

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Override Gradle JVM memory for CI
        working-directory: .
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'GRADLEEOF'
          org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          GRADLEEOF
          sed -i 's/^[[:space:]]*//' ~/.gradle/gradle.properties

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Setup Python for icon generation
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Generate app icons
        run: |
          pip install Pillow
          mkdir -p assets/icon assets/images assets/icons
          python3 scripts/generate_icons.py || echo "Icon generation skipped"

      - name: Create .env file
        run: |
          # Use secrets when available, fallback to placeholders
          WEATHER_KEY="${{ secrets.WEATHER_API_KEY }}"
          MAPS_KEY="${{ secrets.MAPS_API_KEY }}"
          cat > .env <<ENVEOF
          API_BASE_URL=https://api.sahool.app
          WEATHER_API_KEY=${WEATHER_KEY:-placeholder_weather_key_for_ci_build}
          MAPS_API_KEY=${MAPS_KEY:-placeholder_maps_key_for_ci_build}
          ENV=${{ github.event.inputs.build_type || 'debug' }}
          ENVEOF
          sed -i 's/^[[:space:]]*//' .env
          echo "Created .env file:"
          cat .env

      - name: Clean previous build artifacts
        run: |
          flutter clean
          rm -rf .dart_tool
          rm -rf build
          # Remove existing generated files to force regeneration
          find lib -name "*.g.dart" -delete 2>/dev/null || true
          find lib -name "*.freezed.dart" -delete 2>/dev/null || true
          flutter pub get

      - name: Generate code
        run: |
          echo "Starting code generation..."
          echo "Working directory: $(pwd)"
          echo ""
          echo "=== build.yaml content ==="
          cat build.yaml
          echo ""
          dart run build_runner clean || true
          set +o pipefail
          dart run build_runner build --delete-conflicting-outputs --verbose 2>&1 | tee codegen.log
          exit_code=${PIPESTATUS[0]}
          set -o pipefail
          if [ $exit_code -ne 0 ]; then
            echo "::error::build_runner failed, retrying with fresh state..."
            rm -rf .dart_tool/build
            touch lib/core/storage/database.dart
            dart run build_runner build --delete-conflicting-outputs --verbose 2>&1 | tee codegen.log
          fi
          echo ""
          echo "Generated files count:"
          echo "  .g.dart files: $(find lib -name '*.g.dart' | wc -l)"
          echo "  .freezed.dart files: $(find lib -name '*.freezed.dart' | wc -l)"
          echo ""

      - name: Verify generated files
        run: |
          echo "Checking critical generated files..."
          missing=0
          for f in \
            lib/core/storage/database.g.dart \
            lib/features/advisor/data/models/fertilizer_models.g.dart \
            lib/features/advisor/data/models/irrigation_models.g.dart \
            lib/features/astronomical/models/astronomical_models.g.dart \
            lib/features/auth/config/otp_config.g.dart \
            lib/features/community/data/models/chat_models.g.dart \
            lib/features/crop_health/data/models/diagnosis_model.g.dart \
            lib/features/crop_health/data/models/diagnosis_models.g.dart \
            lib/features/pivot_irrigation/domain/models/pivot_models.g.dart \
            lib/features/pivot_irrigation/domain/models/span_zone_models.g.dart \
            lib/features/virtual_sensors/data/models/virtual_sensor_models.g.dart; do
            if [ -f "$f" ]; then
              echo "OK: $(basename $f)"
            else
              echo "::error::Missing generated file: $f"
              missing=$((missing + 1))
            fi
          done
          total_g=$(find lib -name "*.g.dart" | wc -l)
          echo "Total .g.dart files generated: $total_g"
          if [ $missing -gt 0 ]; then
            echo "::error::$missing critical .g.dart files missing"
            echo "## Missing Generated Files ($missing)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 codegen.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "All critical .g.dart files generated successfully"

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || echo "Launcher icons generation skipped"

      - name: Generate native splash
        run: dart run flutter_native_splash:create || echo "Splash generation skipped"

      - name: Analyze code before build
        run: flutter analyze --no-fatal-infos || echo "::warning::Analysis warnings found"

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          echo "Building Debug APK..."
          set +o pipefail
          flutter build apk --debug --verbose 2>&1 | tee build.log
          exit_code=${PIPESTATUS[0]}
          set -o pipefail
          if [ $exit_code -ne 0 ]; then
            echo "::error::Flutter debug build failed with exit code $exit_code"
            echo "## Build Debug APK - FAILED" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -i "error\|FAILURE\|exception\|failed\|Cannot\|OutOfMemory" build.log | tail -50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $exit_code
          fi
          echo "Build completed!"

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          echo "Building Release APK..."
          set +o pipefail
          flutter build apk --release --verbose 2>&1 | tee build.log
          exit_code=${PIPESTATUS[0]}
          set -o pipefail
          if [ $exit_code -ne 0 ]; then
            echo "::error::Flutter release build failed with exit code $exit_code"
            echo "## Build Release APK - FAILED" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -i "error\|FAILURE\|exception\|failed\|Cannot\|OutOfMemory" build.log | tail -50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $exit_code
          fi
          echo "Build completed!"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.3.5
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            apps/mobile/build.log
            apps/mobile/codegen.log
          retention-days: 7

      - name: Get APK info
        id: apk_info
        run: |
          APK_PATH=$(find build/app/outputs -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
            echo "APK Path: $APK_PATH"
            echo "APK Size: $APK_SIZE"
          else
            echo "No APK found"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.3.5
        with:
          name: sahool-apk-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Debug Symbols
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.3.5
        with:
          name: sahool-symbols-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/symbols/
          retention-days: 90
        continue-on-error: true

      - name: Build Summary
        run: |
          echo "## Sahool APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | ${{ github.event.inputs.build_type || 'debug' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| APK Size | ${{ steps.apk_info.outputs.apk_size || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter Version | ${{ env.FLUTTER_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
