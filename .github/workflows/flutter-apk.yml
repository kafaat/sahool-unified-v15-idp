name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release/debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
      - 'claude/*'
    paths:
      - 'apps/mobile/**'

jobs:
  build-apk:
    name: Build Sahool APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME || echo "ANDROID_HOME directory not found"
          which sdkmanager || echo "sdkmanager not found"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Setup
        run: |
          flutter doctor -v
          echo "Flutter and Android SDK verification complete"

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Setup Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate app icons
        run: |
          pip install Pillow
          mkdir -p assets/icon assets/images assets/icons
          python3 scripts/generate_icons.py

      - name: Validate required secrets
        id: secrets_check
        run: |
          echo "Validating required API keys..."
          MISSING_SECRETS=0

          if [ -z "${{ secrets.WEATHER_API_KEY }}" ]; then
            echo "⚠️ WARNING: WEATHER_API_KEY secret is not set - using placeholder"
            MISSING_SECRETS=1
          else
            echo "✅ WEATHER_API_KEY is configured"
          fi

          if [ -z "${{ secrets.MAPS_API_KEY }}" ]; then
            echo "⚠️ WARNING: MAPS_API_KEY secret is not set - using placeholder"
            MISSING_SECRETS=1
          else
            echo "✅ MAPS_API_KEY is configured"
          fi

          if [ $MISSING_SECRETS -eq 1 ]; then
            echo "⚠️ Some secrets are missing - build will use placeholder values"
            echo "For production builds, configure secrets in repository settings"
            echo "secrets_missing=true" >> $GITHUB_OUTPUT
          else
            echo "All required secrets are configured"
            echo "secrets_missing=false" >> $GITHUB_OUTPUT
          fi

      - name: Create .env file
        run: |
          # Copy from .env.example if available, otherwise create comprehensive .env
          if [ -f ".env.example" ]; then
            echo "Using .env.example as base..."
            cp .env.example .env
          fi

          # Create/override with CI-specific configuration
          cat > .env << 'ENVEOF'
          # SAHOOL Field App - CI Build Environment
          ENV=production
          ENVIRONMENT=production

          # API Configuration
          API_URL=https://api.sahool.app/api/v1
          API_BASE_URL=https://api.sahool.app/api/v1

          # WebSocket Configuration
          WS_URL=wss://ws.sahool.app
          WS_GATEWAY_URL=wss://ws.sahool.app

          # Maps Configuration (placeholder - override with secrets)
          MAPBOX_ACCESS_TOKEN=
          MAPBOX_STYLE_URL=mapbox://styles/mapbox/satellite-streets-v12
          MAP_TILE_URL=https://tiles.sahool.app/{z}/{x}/{y}.png

          # Feature Flags
          ENABLE_OFFLINE_MODE=true
          ENABLE_OFFLINE_MAPS=true
          ENABLE_BACKGROUND_SYNC=true
          ENABLE_CAMERA=true
          ENABLE_PUSH=true
          ENABLE_ANALYTICS=true
          ENABLE_CRASH_REPORTING=true
          ENABLE_EDGE_AI=false
          ENABLE_VOICE=false
          ENABLE_AR=false

          # Sync Configuration
          SYNC_INTERVAL_SECONDS=30
          BG_SYNC_INTERVAL_MINUTES=15
          MAX_RETRY_COUNT=5
          OUTBOX_BATCH_SIZE=50

          # App Info
          APP_NAME=SAHOOL Field
          APP_VERSION=16.0.0

          # Tenant Configuration
          DEFAULT_TENANT_ID=sahool-prod

          # AI Service
          AI_SERVICE_URL=https://ai.sahool.app
          ENVEOF

          # Copy .env to sahool_field_app subfolder for integration tests
          if [ -d "sahool_field_app" ]; then
            cp .env sahool_field_app/.env
            echo "Copied .env to sahool_field_app/"
          fi

          echo "Created .env file with CI configuration"

      - name: Clean previous build artifacts
        run: |
          flutter clean
          # Remove entire .dart_tool to ensure clean slate
          rm -rf .dart_tool
          rm -rf build
          # Remove any existing generated files to force regeneration
          find lib -name "*.g.dart" -delete 2>/dev/null || true
          find lib -name "*.freezed.dart" -delete 2>/dev/null || true
          flutter pub get

      - name: Generate Drift database code
        run: |
          echo "Starting code generation..."
          echo "Working directory: $(pwd)"
          echo ""
          echo "=== build.yaml content ==="
          cat build.yaml
          echo ""
          dart run build_runner clean || true
          # Run with verbose flag to diagnose issues
          dart run build_runner build --delete-conflicting-outputs --verbose 2>&1 | tee codegen.log || {
            echo "First attempt output:"
            tail -50 codegen.log
            echo "Retrying with fresh state..."
            rm -rf .dart_tool/build
            touch lib/core/storage/database.dart
            dart run build_runner build --delete-conflicting-outputs --verbose
          }
          echo ""
          echo "📊 Generated files count:"
          echo "  .g.dart files: $(find lib -name '*.g.dart' | wc -l)"
          echo "  .freezed.dart files: $(find lib -name '*.freezed.dart' | wc -l)"
          echo ""
          echo "=== All generated .g.dart files ==="
          find lib -name "*.g.dart" -type f 2>/dev/null || echo "No .g.dart files found"
          echo ""
          if [ -f "lib/core/storage/database.g.dart" ]; then
            echo "✅ database.g.dart generated successfully"
            head -10 lib/core/storage/database.g.dart
          else
            echo "❌ database.g.dart NOT found - build will fail"
            echo "=== Searching for database.g.dart anywhere ==="
            find . -name "database.g.dart" -type f 2>/dev/null || echo "Not found anywhere"
            echo "=== Full codegen log ==="
            cat codegen.log
            exit 1
          fi

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || echo "Launcher icons generation skipped"

      - name: Generate native splash
        run: dart run flutter_native_splash:create || echo "Splash generation skipped"

      - name: Analyze code before build
        run: flutter analyze --no-fatal-infos || echo "Analysis warnings found"

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == '' }}
        run: |
          echo "🔨 Building Release APK..."
          echo "Flutter version:"
          flutter --version
          echo "Dart version:"
          dart --version
          echo "Starting build..."
          flutter build apk --release --verbose 2>&1 | tee build.log || {
            echo "❌ Build failed! Last 100 lines of log:"
            tail -100 build.log
            exit 1
          }
          echo "✅ Build completed!"

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: |
          echo "🔨 Building Debug APK..."
          flutter build apk --debug --verbose 2>&1 | tee build.log || {
            echo "❌ Build failed! Last 100 lines of log:"
            tail -100 build.log
            exit 1
          }
          echo "✅ Build completed!"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            apps/mobile/build.log
            apps/mobile/codegen.log
          retention-days: 7

      - name: Get APK info
        id: apk_info
        run: |
          APK_PATH=$(find build/app/outputs -name "*.apk" | head -1)
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "APK Path: $APK_PATH"
          echo "APK Size: $APK_SIZE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahool-apk-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/**/*.apk
          retention-days: 30

      - name: Upload Debug Symbols
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sahool-symbols-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/symbols/
          retention-days: 90
        continue-on-error: true

      - name: Build Summary
        run: |
          echo "## Sahool APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | ${{ github.event.inputs.build_type || 'release' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| APK Size | ${{ steps.apk_info.outputs.apk_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter Version | 3.27.1 |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
