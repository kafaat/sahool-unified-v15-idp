  # =============================================================================
  # Job 5: E2E Tests for Web (Playwright)
  # =============================================================================
  web-e2e-tests:
    name: E2E - Web (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web-build
    if: needs.web-build.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/web/node_modules
          key: ${{ runner.os }}-e2e-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-node-
            ${{ runner.os }}-web-node-

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm install --legacy-peer-deps --ignore-scripts && break
            echo "⚠️ npm install failed (attempt $i), retrying in $((i * 5))s..."
            sleep $((i * 5))
          done

      - name: Install Playwright Browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Download Web Build
        id: download
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: apps/web/.next
        continue-on-error: true

      - name: Build Web App if download failed
        if: steps.download.outcome == 'failure'
        run: |
          set -e
          echo "::warning::Build artifact not found, building from scratch"
          echo "Building shared packages first..."
          npm run build:packages
          echo "Building web app..."
          cd apps/web && npm run build
          echo "✅ Web app built from scratch"
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Verify build exists
        run: |
          if [ ! -d "apps/web/.next" ]; then
            echo "::error::Build directory not found after download and build attempts"
            exit 1
          fi
          echo "✅ Build directory exists"

      - name: Start Web App
        working-directory: apps/web
        run: |
          npm run start > server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Health check with generous timeout.
          # 60s was hitting the edge on slower runners and caused
          # intermittent E2E flakes — the Next.js production server
          # cold-start sometimes exceeds 45s when RSC prefetching and
          # the first request trigger additional bundle compilation.
          # 120s gives a comfortable safety margin; on a healthy runner
          # the server is up in <10s and we exit the loop immediately.
          timeout=120
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -f http://localhost:3000 2>/dev/null; then
              echo "✅ Server is ready after ${elapsed}s"
              # Brief warmup so Next.js finishes compiling the /login
              # route (the first Playwright smoke test target) before
              # the browser starts hitting it cold.
              sleep 2
              exit 0
            fi
            echo "Waiting for server... (${elapsed}/${timeout}s)"
            sleep 3
            elapsed=$((elapsed + 3))
          done

          echo "::error::Server failed to start within ${timeout}s"
          echo "=== Server logs ==="
          cat server.log
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        env:
          NODE_ENV: production

      - name: Run E2E Tests
        id: e2e
        working-directory: apps/web
        run: |
          echo "Running Playwright E2E tests..."
          npx playwright test --project=chromium --reporter=html
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Stop Web App
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
            echo "✅ Server stopped"
          fi

      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 3

      - name: Upload Server Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-logs
          path: apps/web/server.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Report E2E Status
        if: failure()
        run: |
          echo "::error::E2E tests failed. Check playwright-results artifact for details."
          echo "## ❌ E2E Tests Failed" >> $GITHUB_STEP_SUMMARY
          echo "Playwright E2E tests failed. Check the playwright-results artifact for details." >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Job 6: Integration Tests for Mobile
  # =============================================================================
  mobile-integration-tests:
    name: Integration - Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: flutter-unit-tests
    if: always() && !cancelled()

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Free disk space
        # Same cleanup as the Android Build job. See §6 of
        # docs/prompts/fix-flutter-android-ci-flake.md.
        run: |
          echo "=== Freeing disk space ==="
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          sudo rm -rf /opt/hostedtoolcache/PyPy || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf /home/linuxbrew || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo docker system prune --all --force >/dev/null 2>&1 || true
          df -h
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native SQLite3 library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        working-directory: .

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Android NDK 27.0.12077973
        # Same NDK cache as the Android Build job — see §5 of
        # docs/prompts/fix-flutter-android-ci-flake.md.
        id: cache-android-ndk
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /usr/local/lib/android/sdk/ndk/27.0.12077973
          key: android-ndk-27.0.12077973-${{ runner.os }}

      - name: Install required Android SDK components
        # Same retry logic as the Android Build job — see
        # docs/prompts/fix-flutter-android-ci-flake.md §2.
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt: installing Android SDK components..."
            if yes | sdkmanager --install \
                 "platforms;android-35" \
                 "ndk;27.0.12077973"; then
              echo "✓ SDK components installed on attempt $attempt"
              exit 0
            fi
            wait_s=$((attempt * 30))
            echo "::warning::Attempt $attempt failed; sleeping ${wait_s}s before retry"
            sleep $wait_s
          done
          echo "::error::Failed to install Android SDK components after 3 attempts"
          exit 1
        working-directory: .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

      - name: Cache Flutter dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            apps/mobile/.dart_tool/package_config.json
          key: ${{ runner.os }}-flutter-integration-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-integration-${{ env.FLUTTER_VERSION }}-
            ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          cat > .env <<'EOF'
          ENV=test
          ENVIRONMENT=test
          API_URL=http://localhost:8080
          API_BASE_URL=https://api.sahool.app
          WS_URL=ws://localhost:8080
          WS_GATEWAY_URL=ws://localhost:8081
          DEV_HOST=localhost
          GATEWAY_PORT=8080
          NATS_URL=nats://localhost:4222
          WEATHER_API_KEY=test_weather_key
          WEATHER_PROVIDER=open-meteo
          GOOGLE_MAPS_API_KEY=test_maps_key
          MAP_PROVIDER=osm
          MAPBOX_ACCESS_TOKEN=pk.test_token
          CONNECT_TIMEOUT_SECONDS=30
          RECEIVE_TIMEOUT_SECONDS=30
          SYNC_INTERVAL_SECONDS=30
          BG_SYNC_INTERVAL_MINUTES=15
          MAX_RETRY_COUNT=3
          OUTBOX_BATCH_SIZE=50
          DEFAULT_TENANT_ID=test-tenant
          APP_NAME=SAHOOL Field
          APP_VERSION=16.0.0
          BUILD_NUMBER=1
          ENABLE_OFFLINE_MODE=true
          ENABLE_BACKGROUND_SYNC=true
          ENABLE_CAMERA=false
          ENABLE_EDGE_AI=false
          ENABLE_CERTIFICATE_PINNING=false
          ENABLE_DEVICE_INTEGRITY=false
          ENABLE_DATABASE_ENCRYPTION=false
          SKIP_DEVICE_CHECKS=true
          EOF
          sed 's/^[[:space:]]*//' .env > .env.tmp && mv .env.tmp .env

      - name: Run code generation
        uses: ./.github/actions/flutter-codegen
        with:
          working-directory: apps/mobile
          clean-first: 'true'
          verify-files: 'lib/core/storage/database.g.dart'

      - name: Verify all generated files
        run: |
          echo "=== Checking all generated files ==="
          missing=0
          for f in \
            lib/core/storage/database.g.dart \
            lib/features/auth/config/otp_config.g.dart \
            lib/features/advisor/data/models/irrigation_models.freezed.dart \
            lib/features/advisor/data/models/irrigation_models.g.dart \
            lib/features/advisor/data/models/fertilizer_models.freezed.dart \
            lib/features/advisor/data/models/fertilizer_models.g.dart \
            lib/features/astronomical/models/astronomical_models.freezed.dart \
            lib/features/astronomical/models/astronomical_models.g.dart \
            lib/features/community/data/models/chat_models.freezed.dart \
            lib/features/community/data/models/chat_models.g.dart \
            lib/features/crop_health/data/models/diagnosis_models.freezed.dart \
            lib/features/crop_health/data/models/diagnosis_models.g.dart \
            lib/features/virtual_sensors/data/models/virtual_sensor_models.freezed.dart \
            lib/features/virtual_sensors/data/models/virtual_sensor_models.g.dart \
            lib/features/pivot_irrigation/domain/models/pivot_models.freezed.dart \
            lib/features/pivot_irrigation/domain/models/pivot_models.g.dart \
            lib/features/pivot_irrigation/domain/models/span_zone_models.freezed.dart \
            lib/features/pivot_irrigation/domain/models/span_zone_models.g.dart; do
            if [ -f "$f" ]; then
              echo "  ✅ $f"
            else
              echo "  ❌ MISSING: $f"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo ""
            echo "⚠️ $missing generated files are missing — build_runner may have failed for some generators"
            echo "=== All generated files in lib/ ==="
            find lib -name "*.g.dart" -o -name "*.freezed.dart" 2>/dev/null | sort
          else
            echo "✅ All generated files verified"
          fi

      - name: Pre-compile integration test
        run: |
          echo "=== Pre-compiling integration test to catch errors early ==="
          flutter analyze integration_test/app_test.dart

      - name: Enable KVM (for Android Emulator)
        id: kvm
        run: |
          # Load KVM kernel modules
          sudo modprobe kvm 2>/dev/null || true
          sudo modprobe kvm_intel 2>/dev/null || sudo modprobe kvm_amd 2>/dev/null || true
          # Set permissions on /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0660", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo usermod -aG kvm $(whoami) 2>/dev/null || true
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 660 /dev/kvm 2>/dev/null || true
          # Verify KVM is available — without it the emulator is extremely slow
          if [ -e /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "kvm_available=true" >> $GITHUB_OUTPUT
            echo "✅ KVM is available"
          else
            echo "kvm_available=false" >> $GITHUB_OUTPUT
            echo "⚠️ KVM is NOT available — skipping emulator tests to avoid timeout"
          fi

      - name: Run Integration Tests with Android Emulator
        id: integration
        if: steps.kvm.outputs.kvm_available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 30
          arch: x86_64
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 2048
          script: |
            cd apps/mobile
            echo "=== Generated files present ==="
            find lib -name "*.g.dart" -o -name "*.freezed.dart" 2>/dev/null | sort || echo "No generated files found"
            echo "=== Running integration tests ==="
            flutter test integration_test/app_test.dart --verbose --timeout 180s 2>&1 | tee integration_test_output.txt
            echo "✅ Integration tests completed"

      - name: Report Skipped Integration Tests
        if: steps.kvm.outputs.kvm_available != 'true'
        run: echo "::warning::Integration tests skipped — KVM not available on this runner. Use a KVM-enabled runner for emulator tests."

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-integration-results
          path: |
            apps/mobile/integration_test/screenshots/
            apps/mobile/integration_test/test-results/
          retention-days: 3
          if-no-files-found: ignore

  # =============================================================================
  # Job 7: Generate Test Reports
  # =============================================================================
  test-reports:
    name: Generate Test Reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - web-fast-checks
      - web-unit-tests
      - web-build
      - admin-fast-checks
      - admin-unit-tests
      - admin-build
      - flutter-analyze
      - flutter-unit-tests
      - flutter-android-build
      - flutter-ios-build
      - web-e2e-tests
      - mobile-integration-tests
    if: always()

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
        continue-on-error: true

      - name: Generate Test Summary
        run: |
          echo "# Frontend Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Status by Component" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          # Web App
          if [ -d "artifacts/web-build" ]; then
            echo "| Web App | ✅ Build Successful |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Web App | ❌ Build Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          # Admin Dashboard
          if [ -d "artifacts/admin-build" ]; then
            echo "| Admin Dashboard | ✅ Build Successful |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Admin Dashboard | ❌ Build Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          # Flutter Android
          if [ -d "artifacts/flutter-android-apk" ]; then
            echo "| Flutter Android | ✅ Build Successful |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Flutter Android | ❌ Build Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          # E2E Tests
          if [ -d "artifacts/playwright-results" ]; then
            echo "| E2E Tests (Web) | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| E2E Tests (Web) | ⚠️ Not Run |" >> $GITHUB_STEP_SUMMARY
          fi

          # Mobile Integration
          if [ -d "artifacts/mobile-integration-results" ]; then
            echo "| Mobile Integration | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Mobile Integration | ⚠️ Not Run |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Coverage Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Web Coverage
          if [ -d "artifacts/web-coverage" ]; then
            echo "- ✅ Web App coverage report available" >> $GITHUB_STEP_SUMMARY
          fi

          # Admin Coverage
          if [ -d "artifacts/admin-coverage" ]; then
            echo "- ✅ Admin Dashboard coverage report available" >> $GITHUB_STEP_SUMMARY
          fi

          # Flutter Coverage
          if [ -d "artifacts/flutter-coverage" ]; then
            echo "- ✅ Flutter coverage report available" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All test artifacts have been uploaded and are available for download." >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with Test Results
        # Report each component's status from the job's actual `result`,
        # not from whether an artifact directory happened to land on
        # disk. An upstream flake cancelling / skipping a downstream
        # artifact upload used to be reported as "❌ Failed", causing
        # false-alarm red checks on Web/Admin when only Flutter Android
        # had flaked (see PR #1581). `needs.<job>.result` reflects the
        # real outcome: success | failure | cancelled | skipped.
        # See §7a of docs/prompts/fix-flutter-android-ci-flake.md.
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          WEB_BUILD_RESULT: ${{ needs.web-build.result }}
          ADMIN_BUILD_RESULT: ${{ needs.admin-build.result }}
          FLUTTER_BUILD_RESULT: ${{ needs.flutter-android-build.result }}
          E2E_RESULT: ${{ needs.web-e2e-tests.result }}
          MOBILE_INTEG_RESULT: ${{ needs.mobile-integration-tests.result }}
        with:
          script: |
            const fs = require('fs');

            // Real job outcomes from the workflow graph — not a
            // guess based on artifact presence.
            const jobs = {
              webBuild:    process.env.WEB_BUILD_RESULT,
              adminBuild:  process.env.ADMIN_BUILD_RESULT,
              flutterBuild:process.env.FLUTTER_BUILD_RESULT,
              e2e:         process.env.E2E_RESULT,
              mobileInteg: process.env.MOBILE_INTEG_RESULT,
            };

            const icon = (r) =>
              r === 'success'   ? '✅ Passed'    :
              r === 'failure'   ? '❌ Failed'    :
              r === 'cancelled' ? '🚫 Cancelled' :
              r === 'skipped'   ? '⚠️ Skipped'   :
                                  `❓ ${r || 'unknown'}`;

            // Coverage artifacts are optional and uploaded opportunistically,
            // so the existing artifact-presence check is still correct here.
            const artifactsPath = 'artifacts';
            const webCoverage     = fs.existsSync(`${artifactsPath}/web-coverage`);
            const adminCoverage   = fs.existsSync(`${artifactsPath}/admin-coverage`);
            const flutterCoverage = fs.existsSync(`${artifactsPath}/flutter-coverage`);

            let comment = '## 🧪 Frontend Test Results\n\n';
            comment += '### Build Status\n\n';
            comment += `| Component | Status |\n`;
            comment += `|-----------|--------|\n`;
            comment += `| Web App | ${icon(jobs.webBuild)} |\n`;
            comment += `| Admin Dashboard | ${icon(jobs.adminBuild)} |\n`;
            comment += `| Flutter Android | ${icon(jobs.flutterBuild)} |\n`;
            comment += `| E2E Tests | ${icon(jobs.e2e)} |\n`;
            comment += `| Mobile Integration | ${icon(jobs.mobileInteg)} |\n`;

            comment += '\n### 📊 Coverage Reports\n\n';
            if (webCoverage || adminCoverage || flutterCoverage) {
              comment += 'Coverage reports are available in the workflow artifacts:\n';
              if (webCoverage) comment += '- Web App coverage\n';
              if (adminCoverage) comment += '- Admin Dashboard coverage\n';
              if (flutterCoverage) comment += '- Flutter coverage\n';
            } else {
              comment += 'No coverage reports available.\n';
            }
            comment += '\n---\n';
            comment += `*Workflow run: [#${context.runNumber}](${context.payload.repository.html_url}/actions/runs/${context.runId})*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        continue-on-error: true

  # =============================================================================
  # Job 8: Bundle Analysis (Only on PR)
  # =============================================================================
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-packages, web-fast-checks, admin-fast-checks]
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore packages build
        uses: actions/cache/restore@v5
        with:
          path: |
            packages/*/dist
            packages/*/build
          key: ${{ runner.os }}-${{ needs.build-packages.outputs.cache-key }}

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm install --legacy-peer-deps --ignore-scripts && break
            echo "⚠️ npm install failed (attempt $i), retrying in $((i * 5))s..."
            sleep $((i * 5))
          done

      - name: Verify and build shared packages
        run: |
          set -e
          echo "Building shared packages for bundle analysis..."
          npm run build:packages
          echo "✅ Packages built"

      - name: Analyze Web App Bundle
        run: |
          cd apps/web
          ANALYZE=true npm run build || echo "⚠️ Web bundle analysis completed with warnings"
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Analyze Admin Bundle
        run: |
          cd apps/admin
          ANALYZE=true npm run build || echo "⚠️ Admin bundle analysis completed with warnings"
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Upload Bundle Analysis
        uses: actions/upload-artifact@v7
        with:
          name: bundle-analysis
          path: |
            apps/web/.next/analyze/
            apps/admin/.next/analyze/
          retention-days: 3
          if-no-files-found: ignore

      - name: Comment Bundle Size
        uses: actions/github-script@v9
        with:
          script: |
            const comment = '## 📦 Bundle Size Analysis\n\n' +
              'Bundle analysis completed. Check the artifacts for detailed reports.\n\n' +
              '- Web App bundle analysis available\n' +
              '- Admin Dashboard bundle analysis available\n';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        continue-on-error: true
