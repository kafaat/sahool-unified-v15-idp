name: Frontend Tests

# =============================================================================
# Security: Minimal permissions at workflow level
# Job-specific permissions are granted where needed
# =============================================================================
permissions:
  contents: read

on:
  push:
    branches: [main, develop, 'claude/**']
    # Negative patterns (!) exclude auto-generated Dart contract files —
    # content is only `Contract version: X.Y.Z` comment bumps, safe to
    # skip the full frontend matrix (Web + Admin + Flutter Android build).
    # NOTE: `paths` + `paths-ignore` on the same event is rejected by
    # GitHub Actions ("you may only define one of"), so we fold the
    # ignores into `paths` using `!` negative patterns.
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/frontend-tests.yml'
      - '.github/actions/flutter-codegen/**'
      - '.github/actions/setup-node-packages/**'
      - '!apps/mobile/lib/core/contracts/**'
      - '!apps/mobile/**/*.md'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'apps/mobile/**'
      - 'packages/**'
      - '!apps/mobile/lib/core/contracts/**'
      - '!apps/mobile/**/*.md'

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  FLUTTER_VERSION: '3.27.1'
  JAVA_VERSION: '17'

jobs:
  # =============================================================================
  # Job 0: Build Shared Packages (runs once, cached for other jobs)
  # =============================================================================
  build-packages:
    name: Build Shared Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Generate cache key
        id: cache-key
        run: echo "key=packages-build-${{ hashFiles('packages/*/src/**', 'packages/*/package.json') }}" >> $GITHUB_OUTPUT

      - name: Restore packages build cache
        id: packages-cache
        uses: actions/cache@v5
        with:
          path: |
            packages/*/dist
            packages/*/build
          key: ${{ runner.os }}-${{ steps.cache-key.outputs.key }}

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm install --legacy-peer-deps --ignore-scripts && break
            echo "⚠️ npm install failed (attempt $i), retrying in $((i * 5))s..."
            sleep $((i * 5))
          done

      - name: Clean stale build artifacts
        run: |
          rm -rf packages/*/tsconfig.tsbuildinfo packages/*/dist packages/*/build
          echo "✅ Cleaned stale build artifacts"

      - name: Build shared packages
        run: |
          echo "=== Building shared packages ==="
          npm run build:packages
          echo "✅ Shared packages built"

      - name: Verify package builds
        run: |
          for pkg in shared-types shared-utils i18n shared-ui api-client shared-hooks; do
            if [ -d "packages/$pkg/dist" ]; then
              echo "✅ packages/$pkg/dist exists"
            else
              echo "❌ packages/$pkg/dist missing"
              exit 1
            fi
          done

      - name: Save packages build cache
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            packages/*/dist
            packages/*/build
          key: ${{ runner.os }}-${{ steps.cache-key.outputs.key }}

  # =============================================================================
  # Job 1a: Web App - Fast Checks (lint, typecheck)
  # =============================================================================
  web-fast-checks:
    name: Web App - ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-packages

    strategy:
      fail-fast: false
      matrix:
        check: ['lint', 'typecheck']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-web-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-web-node-
            ${{ runner.os }}-node-

      - name: Restore packages build
        id: restore-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            packages/*/dist
            packages/*/build
          key: ${{ runner.os }}-${{ needs.build-packages.outputs.cache-key }}

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm install --legacy-peer-deps --ignore-scripts && break
            echo "⚠️ npm install failed (attempt $i), retrying in $((i * 5))s..."
            sleep $((i * 5))
          done

      - name: Rebuild packages if cache missed
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: npm run build:packages

      - name: Run Lint
        id: lint
        if: matrix.check == 'lint'
        run: |
          echo "Running ESLint on Web App..."
          cd apps/web && npm run lint

      - name: Run Type Check
        id: typecheck
        if: matrix.check == 'typecheck'
        run: |
          echo "Running TypeScript type check on Web App..."
          cd apps/web && npm run typecheck

  # =============================================================================
  # Job 1b: Web App - Unit Tests
  # =============================================================================
  web-unit-tests:
    name: Web App - Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-packages, web-fast-checks]
    if: always() && !cancelled() && needs.build-packages.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-web-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-web-node-

      - name: Restore packages build
        id: restore-cache-web-tests
        uses: actions/cache/restore@v5
        with:
          path: |
            packages/*/dist
            packages/*/build
          key: ${{ runner.os }}-${{ needs.build-packages.outputs.cache-key }}

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm install --legacy-peer-deps --ignore-scripts && break
            echo "⚠️ npm install failed (attempt $i), retrying in $((i * 5))s..."
            sleep $((i * 5))
          done

      - name: Rebuild packages if cache missed
        if: steps.restore-cache-web-tests.outputs.cache-hit != 'true'
        run: npm run build:packages

      - name: Run Unit Tests
        id: tests
        run: |
          echo "Running Vitest unit tests on Web App..."
          cd apps/web && npm run test:coverage

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 3
          if-no-files-found: ignore

  # =============================================================================
  # Job 1c: Web App - Build
  # =============================================================================
  web-build:
    name: Web App - Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-packages, web-fast-checks]
    if: always() && !cancelled() && needs.build-packages.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-web-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-web-node-

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm install --legacy-peer-deps --ignore-scripts && break
            echo "⚠️ npm install failed (attempt $i), retrying in $((i * 5))s..."
            sleep $((i * 5))
          done

      - name: Clean and rebuild shared packages
        run: |
          rm -rf packages/*/tsconfig.tsbuildinfo apps/web/.next apps/web/tsconfig.tsbuildinfo
          npm run build:packages

      - name: Build Web App
        id: build-web
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Verify Web Build
        if: always() && steps.build-web.outcome == 'success'
        run: |
          set -e
          echo "=== Verifying Web Build ==="
          if [ -d "apps/web/.next" ]; then
            echo "✅ Build successful - .next directory exists"
            echo "=== .next directory contents ==="
            ls -la apps/web/.next
            echo "=== Checking for required files ==="
            [ -f "apps/web/.next/BUILD_ID" ] && echo "✓ BUILD_ID exists" || echo "❌ BUILD_ID missing"
            [ -d "apps/web/.next/server" ] && echo "✓ server directory exists" || echo "❌ server directory missing"
            [ -d "apps/web/.next/static" ] && echo "✓ static directory exists" || echo "❌ static directory missing"
          else
            echo "❌ Build failed - .next directory not found"
            echo "=== apps/web directory contents ==="
            ls -la apps/web/
            exit 1
          fi

      - name: Upload Build Artifacts
        if: always() && steps.build-web.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: true

  # =============================================================================
  # Job 2a: Admin Dashboard - Fast Checks
  # =============================================================================
  admin-fast-checks:
    name: Admin - ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-packages

    strategy:
      fail-fast: false
      matrix:
        check: ['lint', 'typecheck']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/admin/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-admin-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-admin-node-
            ${{ runner.os }}-node-

      - name: Restore packages build
        id: restore-cache-admin
        uses: actions/cache/restore@v5
        with:
          path: |
            packages/*/dist
            packages/*/build
          key: ${{ runner.os }}-${{ needs.build-packages.outputs.cache-key }}

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm install --legacy-peer-deps --ignore-scripts && break
            echo "⚠️ npm install failed (attempt $i), retrying in $((i * 5))s..."
            sleep $((i * 5))
          done

      - name: Rebuild packages if cache missed
        if: steps.restore-cache-admin.outputs.cache-hit != 'true'
        run: npm run build:packages

      - name: Run Lint
        id: lint
        if: matrix.check == 'lint'
        run: |
          echo "Running ESLint on Admin Dashboard..."
          cd apps/admin && npm run lint

      - name: Run Type Check
        id: typecheck
        if: matrix.check == 'typecheck'
        run: |
          echo "Running TypeScript type check on Admin Dashboard..."
          cd apps/admin && npm run typecheck

  # =============================================================================
  # Job 2b: Admin Dashboard - Unit Tests
  # =============================================================================
  admin-unit-tests:
    name: Admin - Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-packages, admin-fast-checks]
    if: always() && !cancelled() && needs.build-packages.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/admin/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-admin-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-admin-node-

      - name: Restore packages build
        id: restore-cache-admin-tests
        uses: actions/cache/restore@v5
        with:
          path: |
            packages/*/dist
            packages/*/build
          key: ${{ runner.os }}-${{ needs.build-packages.outputs.cache-key }}

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm install --legacy-peer-deps --ignore-scripts && break
            echo "⚠️ npm install failed (attempt $i), retrying in $((i * 5))s..."
            sleep $((i * 5))
          done

      - name: Rebuild packages if cache missed
        if: steps.restore-cache-admin-tests.outputs.cache-hit != 'true'
        run: npm run build:packages

      - name: Run Unit Tests
        id: tests
        run: |
          echo "Running Vitest unit tests on Admin Dashboard..."
          cd apps/admin
          if npm run test:coverage 2>/dev/null; then
            echo "✅ Tests passed with coverage"
          elif npm run test 2>/dev/null; then
            echo "✅ Tests passed"
          else
            echo "⚠️ No test script found - skipping"
          fi

      - name: Upload Admin Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-coverage
          path: apps/admin/coverage/
          retention-days: 3
          if-no-files-found: ignore

  # =============================================================================
  # Job 2c: Admin Dashboard - Build
  # =============================================================================
  admin-build:
    name: Admin - Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-packages, admin-fast-checks]
    if: always() && !cancelled() && needs.build-packages.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/admin/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-admin-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-admin-node-

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm install --legacy-peer-deps --ignore-scripts && break
            echo "⚠️ npm install failed (attempt $i), retrying in $((i * 5))s..."
            sleep $((i * 5))
          done

      - name: Clean and rebuild shared packages
        run: |
          rm -rf packages/*/tsconfig.tsbuildinfo apps/admin/.next apps/admin/tsconfig.tsbuildinfo
          npm run build:packages

      - name: Build Admin Dashboard
        id: build-admin
        run: npm run build:admin
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Verify Admin Build
        if: always() && steps.build-admin.outcome == 'success'
        run: |
          set -e
          echo "=== Verifying Admin Build ==="
          if [ -d "apps/admin/.next" ]; then
            echo "✅ Build successful - .next directory exists"
            echo "=== .next directory contents ==="
            ls -la apps/admin/.next
            echo "=== Checking for required files ==="
            [ -f "apps/admin/.next/BUILD_ID" ] && echo "✓ BUILD_ID exists" || echo "❌ BUILD_ID missing"
            [ -d "apps/admin/.next/server" ] && echo "✓ server directory exists" || echo "❌ server directory missing"
            [ -d "apps/admin/.next/static" ] && echo "✓ static directory exists" || echo "❌ static directory missing"
          else
            echo "❌ Build failed - .next directory not found"
            echo "=== apps/admin directory contents ==="
            ls -la apps/admin/
            exit 1
          fi

      - name: Upload Build Artifacts
        if: always() && steps.build-admin.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: admin-build
          path: apps/admin/.next
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: true

  # =============================================================================
  # Job 3a: Flutter - Analyze
  # =============================================================================
  flutter-analyze:
    name: Flutter - Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native SQLite3 library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        working-directory: .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            apps/mobile/.dart_tool/package_config.json
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-
            ${{ runner.os }}-flutter-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          cat > .env <<EOF
          ENV=test
          ENVIRONMENT=test
          API_BASE_URL=https://api.sahool.app
          API_URL=http://localhost:8000
          DEV_HOST=localhost
          GATEWAY_PORT=8000
          WS_GATEWAY_URL=ws://localhost:8081
          NATS_URL=nats://localhost:4222
          WEATHER_API_KEY=test_weather_key
          WEATHER_PROVIDER=open-meteo
          GOOGLE_MAPS_API_KEY=test_maps_key
          MAP_PROVIDER=osm
          MAPBOX_ACCESS_TOKEN=pk.test_token
          CONNECT_TIMEOUT_SECONDS=30
          RECEIVE_TIMEOUT_SECONDS=30
          SYNC_INTERVAL_SECONDS=30
          BG_SYNC_INTERVAL_MINUTES=15
          MAX_RETRY_COUNT=3
          OUTBOX_BATCH_SIZE=50
          DEFAULT_TENANT_ID=test-tenant
          APP_NAME=SAHOOL Field
          APP_VERSION=16.0.0
          BUILD_NUMBER=1
          ENABLE_OFFLINE_MODE=true
          ENABLE_BACKGROUND_SYNC=true
          ENABLE_CAMERA=false
          ENABLE_EDGE_AI=false
          ENABLE_CERTIFICATE_PINNING=false
          ENABLE_DEVICE_INTEGRITY=false
          ENABLE_DATABASE_ENCRYPTION=false
          SKIP_DEVICE_CHECKS=true
          EOF
          sed 's/^[[:space:]]*//' .env > .env.tmp && mv .env.tmp .env

      - name: Run code generation
        uses: ./.github/actions/flutter-codegen
        with:
          working-directory: apps/mobile
          clean-first: 'true'

      - name: Run Flutter Analyze
        id: analyze
        run: |
          echo "Running Flutter analyze..."
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze_output.txt || {
            echo "::warning::Flutter analysis found issues (pre-existing)"
            echo "## ⚠️ Flutter Analyze Warnings" >> $GITHUB_STEP_SUMMARY
            echo "Flutter analyze found issues in apps/mobile. Run \`cd apps/mobile && flutter analyze\` locally to see details." >> $GITHUB_STEP_SUMMARY
          }

  # =============================================================================
  # Job 3b: Flutter - Unit Tests
  # =============================================================================
  flutter-unit-tests:
    name: Flutter - Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: flutter-analyze
    if: always() && !cancelled()

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native SQLite3 library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        working-directory: .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            apps/mobile/.dart_tool/package_config.json
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          cat > .env <<EOF
          ENV=test
          ENVIRONMENT=test
          API_BASE_URL=https://api.sahool.app
          API_URL=http://localhost:8000
          DEV_HOST=localhost
          GATEWAY_PORT=8000
          WS_GATEWAY_URL=ws://localhost:8081
          NATS_URL=nats://localhost:4222
          WEATHER_API_KEY=test_weather_key
          WEATHER_PROVIDER=open-meteo
          GOOGLE_MAPS_API_KEY=test_maps_key
          MAP_PROVIDER=osm
          MAPBOX_ACCESS_TOKEN=pk.test_token
          CONNECT_TIMEOUT_SECONDS=30
          RECEIVE_TIMEOUT_SECONDS=30
          SYNC_INTERVAL_SECONDS=30
          BG_SYNC_INTERVAL_MINUTES=15
          MAX_RETRY_COUNT=3
          OUTBOX_BATCH_SIZE=50
          DEFAULT_TENANT_ID=test-tenant
          APP_NAME=SAHOOL Field
          APP_VERSION=16.0.0
          BUILD_NUMBER=1
          ENABLE_OFFLINE_MODE=true
          ENABLE_BACKGROUND_SYNC=true
          ENABLE_CAMERA=false
          ENABLE_EDGE_AI=false
          ENABLE_CERTIFICATE_PINNING=false
          ENABLE_DEVICE_INTEGRITY=false
          ENABLE_DATABASE_ENCRYPTION=false
          SKIP_DEVICE_CHECKS=true
          EOF
          sed 's/^[[:space:]]*//' .env > .env.tmp && mv .env.tmp .env

      - name: Run code generation
        uses: ./.github/actions/flutter-codegen
        with:
          working-directory: apps/mobile
          clean-first: 'true'

      - name: Run Unit Tests
        id: tests
        run: |
          echo "Running Flutter unit and widget tests..."
          flutter test --coverage --reporter=expanded

      - name: Upload Test Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: apps/mobile/coverage/
          retention-days: 3
          if-no-files-found: ignore

  # =============================================================================
  # Job 3c: Flutter - Android Build
  # =============================================================================
  flutter-android-build:
    name: Flutter - Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: flutter-analyze
    if: always() && !cancelled()

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Free disk space
        # Android NDK + Flutter SDK + Gradle cache + node_modules can
        # push disk past 14 GB on a 7 GB-swap runner. Remove every
        # hosted toolcache we don't use in this job to buy headroom.
        # See §6 of docs/prompts/fix-flutter-android-ci-flake.md.
        run: |
          echo "=== Disk space before cleanup ==="
          df -h

          echo "=== Freeing disk space ==="
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          # Additional toolcaches unused by Flutter Android builds
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          sudo rm -rf /opt/hostedtoolcache/PyPy || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf /home/linuxbrew || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo docker system prune --all --force >/dev/null 2>&1 || true

          # Clean apt cache
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true

          echo "=== Disk space after cleanup ==="
          df -h
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native SQLite3 library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        working-directory: .

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Android NDK 27.0.12077973
        # NDK is ~1 GB and version-pinned. Key on the NDK version so
        # cache hits save a full sdkmanager download (see §5 of
        # docs/prompts/fix-flutter-android-ci-flake.md). On a miss the
        # retry-wrapped install below will populate it.
        id: cache-android-ndk
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /usr/local/lib/android/sdk/ndk/27.0.12077973
          key: android-ndk-27.0.12077973-${{ runner.os }}

      - name: Install required Android SDK components
        # sdkmanager fetches ~1 GB from the Google CDN which is the single
        # flakiest step of this job. Retry up to 3× with exponential back-off
        # so transient 5xx / connection-reset errors don't fail the whole
        # build. See docs/prompts/fix-flutter-android-ci-flake.md §2.
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt: installing Android SDK components..."
            if yes | sdkmanager --install \
                 "platforms;android-35" \
                 "ndk;27.0.12077973"; then
              echo "✓ SDK components installed on attempt $attempt"
              exit 0
            fi
            wait_s=$((attempt * 30))
            echo "::warning::Attempt $attempt failed; sleeping ${wait_s}s before retry"
            sleep $wait_s
          done
          echo "::error::Failed to install Android SDK components after 3 attempts"
          exit 1
        working-directory: .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

      - name: Cache Flutter dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            apps/mobile/.dart_tool/package_config.json
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Setup Python for icon generation
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Create required directories and generate assets
        run: |
          mkdir -p assets/icon assets/images assets/icons assets/fonts

          pip install Pillow
          if [ -f "scripts/generate_icons.py" ]; then
            python3 scripts/generate_icons.py
          else
            echo "⚠️ Icon generation script not found - using existing assets"
          fi
        continue-on-error: true

      - name: Create .env file
        run: |
          cat > .env <<EOF
          ENV=test
          ENVIRONMENT=test
          API_BASE_URL=https://api.sahool.app
          API_URL=http://localhost:8000
          DEV_HOST=localhost
          GATEWAY_PORT=8000
          WS_GATEWAY_URL=ws://localhost:8081
          NATS_URL=nats://localhost:4222
          WEATHER_API_KEY=test_weather_key
          WEATHER_PROVIDER=open-meteo
          GOOGLE_MAPS_API_KEY=test_maps_key
          MAP_PROVIDER=osm
          MAPBOX_ACCESS_TOKEN=pk.test_token
          CONNECT_TIMEOUT_SECONDS=30
          RECEIVE_TIMEOUT_SECONDS=30
          SYNC_INTERVAL_SECONDS=30
          BG_SYNC_INTERVAL_MINUTES=15
          MAX_RETRY_COUNT=3
          OUTBOX_BATCH_SIZE=50
          DEFAULT_TENANT_ID=test-tenant
          APP_NAME=SAHOOL Field
          APP_VERSION=16.0.0
          BUILD_NUMBER=1
          ENABLE_OFFLINE_MODE=true
          ENABLE_BACKGROUND_SYNC=true
          ENABLE_CAMERA=false
          ENABLE_EDGE_AI=false
          ENABLE_CERTIFICATE_PINNING=false
          ENABLE_DEVICE_INTEGRITY=false
          ENABLE_DATABASE_ENCRYPTION=false
          SKIP_DEVICE_CHECKS=true
          EOF
          sed 's/^[[:space:]]*//' .env > .env.tmp && mv .env.tmp .env

      - name: Run code generation
        uses: ./.github/actions/flutter-codegen
        with:
          working-directory: apps/mobile
          clean-first: 'true'

      - name: Build Android APK
        run: |
          echo "Building Android APK..."
          # Override Gradle JVM args for CI (runners have ~7 GB RAM).
          # `org.gradle.daemon=false` is critical — daemon mode caches
          # nothing in a fresh CI job but holds ~1 GB RAM hostage.
          # See §7b of docs/prompts/fix-flutter-android-ci-flake.md.
          export GRADLE_OPTS="-Xmx5g \
            -XX:MaxMetaspaceSize=512m \
            -XX:+HeapDumpOnOutOfMemoryError \
            -Dfile.encoding=UTF-8 \
            -Dorg.gradle.daemon=false \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.workers.max=2"
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: flutter-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 3

