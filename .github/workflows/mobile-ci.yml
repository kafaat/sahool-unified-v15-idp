# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Mobile CI Pipeline - Flutter App Testing & Analysis
# خط أنابيب التكامل المستمر لتطبيق سهول الجوال
# ═══════════════════════════════════════════════════════════════════════════════
# This workflow runs on every push and PR to ensure code quality
# يعمل هذا الخط على كل دفع وطلب سحب لضمان جودة الكود

name: Mobile CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'claude/**'
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip running tests'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

# Prevent concurrent runs for the same branch
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.27.1'
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_MIN_SDK: '23'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Analyze Job - Static Code Analysis
  # ─────────────────────────────────────────────────────────────────────────────
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/sahool_field_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: Cache pub dependencies
        uses: actions/cache@565629816435f6c0b50676926c9b05c254113c0c # v4.2.3
        with:
          path: |
            ~/.pub-cache
            apps/mobile/sahool_field_app/.dart_tool
            apps/mobile/sahool_field_app/.packages
          key: pub-cache-${{ runner.os }}-${{ hashFiles('apps/mobile/sahool_field_app/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Verify Flutter setup
        run: flutter doctor -v

      - name: Generate code (Drift, Freezed, etc.)
        run: |
          echo "Running code generation..."
          dart run build_runner build --delete-conflicting-outputs || {
            echo "Code generation failed, retrying..."
            rm -rf .dart_tool/build
            dart run build_runner build --delete-conflicting-outputs
          }

      - name: Run Flutter Analyze
        run: |
          echo "Running Flutter Analyze..."
          flutter analyze --no-fatal-infos 2>&1 | tee analyze_output.txt || echo "::warning::Flutter analysis errors found (pre-existing)"

          # Extract warning and error counts
          ERRORS=$(grep -c "error" analyze_output.txt || echo "0")
          WARNINGS=$(grep -c "warning" analyze_output.txt || echo "0")
          INFOS=$(grep -c "info" analyze_output.txt || echo "0")

          echo "## Flutter Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
          echo "| Warnings | $WARNINGS |" >> $GITHUB_STEP_SUMMARY
          echo "| Infos | $INFOS |" >> $GITHUB_STEP_SUMMARY

      - name: Check Dart formatting
        run: |
          echo "Checking Dart formatting (excluding generated files)..."
          find lib/ test/ -name '*.dart' \
            ! -name '*.g.dart' \
            ! -name '*.freezed.dart' \
            ! -name '*.gr.dart' \
            ! -name '*.config.dart' \
            -print0 | xargs -0 dart format --set-exit-if-changed --output=none || {
            echo "::warning::Some files are not properly formatted"
            echo "Run 'dart format lib/ test/' locally to fix formatting issues"
          }

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.3.5
        with:
          name: analysis-results
          path: apps/mobile/sahool_field_app/analyze_output.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Job - Unit and Widget Tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: analyze
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    defaults:
      run:
        working-directory: apps/mobile/sahool_field_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: Cache pub dependencies
        uses: actions/cache@565629816435f6c0b50676926c9b05c254113c0c # v4.2.3
        with:
          path: |
            ~/.pub-cache
            apps/mobile/sahool_field_app/.dart_tool
            apps/mobile/sahool_field_app/.packages
          key: pub-cache-${{ runner.os }}-${{ hashFiles('apps/mobile/sahool_field_app/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env file for tests
        run: |
          cat > .env <<ENVEOF
          API_BASE_URL=https://api.test.sahool.app
          WEATHER_API_KEY=test_weather_key
          MAPS_API_KEY=test_maps_key
          ENV=test
          ENVEOF
          sed 's/^[[:space:]]*//' .env > .env.tmp && mv .env.tmp .env

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        working-directory: .

      - name: Run unit tests with coverage
        run: |
          echo "Running Flutter tests with coverage..."
          flutter test --coverage --coverage-path=coverage/lcov.info \
            --reporter=expanded \
            --test-randomize-ordering-seed=random \
            2>&1 | tee test_output.txt

      - name: Generate coverage report
        run: |
          if [ -f coverage/lcov.info ]; then
            # Install lcov for coverage processing
            sudo apt-get update && sudo apt-get install -y lcov

            # Generate HTML report
            genhtml coverage/lcov.info -o coverage/html --ignore-errors source

            # Calculate coverage percentage
            COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | sed 's/.*: //' | sed 's/%.*//')
            echo "COVERAGE_PERCENT=$COVERAGE" >> $GITHUB_ENV

            echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Line Coverage:** ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage data generated"
            echo "COVERAGE_PERCENT=0" >> $GITHUB_ENV
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: apps/mobile/sahool_field_app/coverage/lcov.info
          flags: flutter,mobile
          name: sahool-mobile-coverage
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.3.5
        with:
          name: coverage-report
          path: |
            apps/mobile/sahool_field_app/coverage/
            apps/mobile/sahool_field_app/test_output.txt
          retention-days: 14

      - name: Check coverage threshold
        run: |
          COVERAGE="${{ env.COVERAGE_PERCENT }}"
          THRESHOLD=10

          if [ -z "$COVERAGE" ]; then
            echo "::warning::Coverage data not available"
          elif [ $(echo "$COVERAGE < $THRESHOLD" | bc -l) -eq 1 ]; then
            echo "::warning::Coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
          else
            echo "Coverage ($COVERAGE%) meets threshold ($THRESHOLD%)"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Debug APK Job
  # ─────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [analyze, test]
    if: always() && needs.analyze.result == 'success'
    defaults:
      run:
        working-directory: apps/mobile/sahool_field_app
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "ndk;27.0.12077973" \
            "platform-tools" || echo "::warning::Some SDK components failed to install"
          echo "Installed SDK components:"
          sdkmanager --list_installed 2>/dev/null | grep -E 'platforms|build-tools|ndk' || true

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: Cache pub dependencies
        uses: actions/cache@565629816435f6c0b50676926c9b05c254113c0c # v4.2.3
        with:
          path: |
            ~/.pub-cache
            apps/mobile/sahool_field_app/.dart_tool
            apps/mobile/sahool_field_app/.packages
          key: pub-cache-${{ runner.os }}-${{ hashFiles('apps/mobile/sahool_field_app/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@565629816435f6c0b50676926c9b05c254113c0c # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/sahool_field_app/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/sahool_field_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Setup Python for icon generation
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Generate app icons
        run: |
          pip install Pillow
          mkdir -p assets/icon assets/images assets/icons
          python3 scripts/generate_icons.py || echo "Icon generation skipped"

      - name: Create .env file
        run: |
          WEATHER_KEY="${{ secrets.WEATHER_API_KEY }}"
          MAPS_KEY="${{ secrets.MAPS_API_KEY }}"
          cat > .env <<ENVEOF
          API_BASE_URL=https://api.sahool.app
          WEATHER_API_KEY=${WEATHER_KEY:-debug_weather_key}
          MAPS_API_KEY=${MAPS_KEY:-debug_maps_key}
          ENV=debug
          ENVEOF
          sed 's/^[[:space:]]*//' .env > .env.tmp && mv .env.tmp .env

      - name: Override Gradle JVM memory for CI
        working-directory: .
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'GRADLEEOF'
          org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          GRADLEEOF
          sed 's/^[[:space:]]*//' ~/.gradle/gradle.properties > /tmp/gp.tmp && mv /tmp/gp.tmp ~/.gradle/gradle.properties

      - name: Generate code
        run: |
          flutter clean
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || echo "Launcher icons skipped"

      - name: Generate native splash
        run: dart run flutter_native_splash:create || echo "Splash generation skipped"

      - name: Build Debug APK
        run: |
          set -o pipefail
          echo "Building Debug APK..."
          flutter build apk --debug --verbose 2>&1 | tee build.log || {
            BUILD_RC=$?
            echo "::error::Flutter build failed with exit code $BUILD_RC"
            echo ""
            echo "=== LAST 80 LINES OF BUILD LOG ==="
            tail -80 build.log
            echo ""
            echo "=== GRADLE ERRORS ==="
            grep -i -E '(FAILURE|ERROR|Exception|Could not|cannot find|No such)' build.log | tail -30 || true
            echo ""
            echo "## Build Debug APK FAILED" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -i -E '(FAILURE|ERROR|Exception|Could not|cannot find|No such)' build.log | tail -20 >> $GITHUB_STEP_SUMMARY || echo "No specific error pattern found" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Last 30 lines of build log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -30 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $BUILD_RC
          }
          echo "Build completed!"

      - name: Get APK info
        id: apk_info
        run: |
          APK_PATH=$(find build/app/outputs -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            APK_NAME=$(basename "$APK_PATH")
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
            echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.3.5
        with:
          name: sahool-debug-apk-${{ github.run_number }}
          path: |
            apps/mobile/sahool_field_app/build/app/outputs/**/*.apk
            apps/mobile/sahool_field_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.3.5
        with:
          name: build-logs-debug-${{ github.run_number }}
          path: |
            apps/mobile/sahool_field_app/build.log
            apps/mobile/sahool_field_app/android/app/build/outputs/logs/
          retention-days: 7

      - name: Build Summary
        run: |
          echo "## Debug APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | Debug |" >> $GITHUB_STEP_SUMMARY
          echo "| APK Size | ${{ steps.apk_info.outputs.apk_size || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter Version | ${{ env.FLUTTER_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # Integration Tests Job (Optional - runs on schedule or manual trigger)
  # ─────────────────────────────────────────────────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-debug
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    defaults:
      run:
        working-directory: apps/mobile/sahool_field_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env file
        run: |
          cat > .env <<ENVEOF
          API_BASE_URL=https://api.test.sahool.app
          WEATHER_API_KEY=test_key
          MAPS_API_KEY=test_key
          ENV=test
          ENVEOF
          sed 's/^[[:space:]]*//' .env > .env.tmp && mv .env.tmp .env

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_5
          script: cd apps/mobile/sahool_field_app && flutter test integration_test/ --verbose
        continue-on-error: true

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.3.5
        with:
          name: integration-test-results
          path: apps/mobile/sahool_field_app/integration_test_output/
          retention-days: 7
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Final Status Check
  # ─────────────────────────────────────────────────────────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [analyze, test, build-debug]
    if: always()
    steps:
      - name: Check CI Results
        run: |
          echo "## Mobile CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Analyze | ${{ needs.analyze.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Debug | ${{ needs.build-debug.result }} |" >> $GITHUB_STEP_SUMMARY

          # Only fail on actual failures, not on cancelled/skipped jobs
          # Cancelled jobs are expected when concurrency rules apply
          if [ "${{ needs.analyze.result }}" == "failure" ]; then
            echo "::error::Analyze job failed"
            exit 1
          fi

          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "::error::Test job failed"
            exit 1
          fi

          if [ "${{ needs.build-debug.result }}" == "failure" ]; then
            echo "::error::Build job failed"
            exit 1
          fi

          # Warn about cancelled jobs but don't fail
          if [ "${{ needs.analyze.result }}" == "cancelled" ] || \
             [ "${{ needs.test.result }}" == "cancelled" ] || \
             [ "${{ needs.build-debug.result }}" == "cancelled" ]; then
            echo "::warning::Some jobs were cancelled (likely due to concurrency rules)"
          fi

          echo "All CI checks passed!"
