# ═══════════════════════════════════════════════════════════════════════════════
# Pre-Deploy Validation — التحقق قبل النشر
# Ensures no CHANGE_ME_BEFORE_DEPLOY placeholders reach production
# ═══════════════════════════════════════════════════════════════════════════════
name: Pre-Deploy Validation

on:
  pull_request:
    branches: [main, release/**, stabilization/**]
    paths:
      - 'infrastructure/**'
      - 'helm/*/values*.yaml'
      - 'governance/**'
      - 'docker/**'
      - '.env*'
  push:
    branches: [main, release/**, stabilization/**]
    paths:
      - 'infrastructure/**'
      - 'helm/*/values*.yaml'
      - 'governance/**'
      - 'docker/**'

concurrency:
  group: pre-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-no-placeholders:
    name: Check for deployment placeholders
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run pre-deploy validation (strict)
        run: |
          chmod +x scripts/pre-deploy-validation.sh
          ./scripts/pre-deploy-validation.sh --strict
