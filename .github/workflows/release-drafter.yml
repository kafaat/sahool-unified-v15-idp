# ═══════════════════════════════════════════════════════════════════════════════
# Release Drafter - Automatically drafts release notes from merged PRs
# مسودة الإصدار التلقائي
# ═══════════════════════════════════════════════════════════════════════════════

name: Release Drafter

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  update-release-draft:
    name: Draft Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          # Only create draft on main branch pushes
          disable-autolabeler: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
