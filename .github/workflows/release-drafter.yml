# ═══════════════════════════════════════════════════════════════════════════════
# Release Drafter - Automatically drafts release notes from merged PRs
# مسودة الإصدار التلقائي
#
# NOTE: The config file (.github/release-drafter.yml) must exist in the
# default branch (main). This workflow only runs on pushes to main/develop.
# ═══════════════════════════════════════════════════════════════════════════════

name: Release Drafter

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-release-draft:
    name: Draft Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
