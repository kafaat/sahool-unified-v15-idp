# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Schemathesis API Contract Fuzz Tests
# اختبارات العقود التلقائية باستخدام Schemathesis
#
# Generates per-service OpenAPI specs fresh on every run (from FastAPI
# ``app.openapi()``) and validates every endpoint against its declared
# contract — response shapes, status codes, content types. Catches undocumented
# responses, 5xx errors, and schema violations without writing manual tests.
#
# Design note: specs are **not** committed to git. They are generated as a CI
# artifact, eliminating the class of false failures that byte-compare drift
# checks produce when FastAPI's dict-insertion order varies across environments.
#
# Docs: https://schemathesis.readthedocs.io/
# ═══════════════════════════════════════════════════════════════════════════════

name: Schemathesis API Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'api/gateway-openapi.yaml'
      - 'docs/api/openapi/**'
      - 'apps/services/*/src/**'
      - 'apps/services/*/openapi.yaml'
      - 'scripts/export-openapi.py'
      - 'requirements/openapi-export.txt'
      - 'tests/contract/**'
      - '.github/workflows/schemathesis-api-tests.yml'

  workflow_dispatch:
    inputs:
      target_url:
        description: 'Base URL of the running API (e.g. http://localhost:8000)'
        required: false
        default: ''
      spec_file:
        description: 'OpenAPI spec file to test (relative to repo root)'
        required: false
        default: 'api/gateway-openapi.yaml'
      max_examples:
        description: 'Max test cases per endpoint (Hypothesis setting)'
        required: false
        default: '50'

  schedule:
    - cron: '30 3 * * 2'  # Tuesday 3:30 AM UTC

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: schemathesis-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Validate the hand-authored gateway spec
  # التحقق من المواصفة اليدوية للبوابة
  # ─────────────────────────────────────────────────────────────────────────────
  validate-spec:
    name: Validate Gateway Spec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install validators
        run: pip install --no-cache-dir openapi-spec-validator>=0.7.0 pyyaml>=6.0

      - name: Validate spec syntax
        run: |
          SPEC_FILE="${{ github.event.inputs.spec_file || 'api/gateway-openapi.yaml' }}"
          echo "🔍 Validating OpenAPI spec: $SPEC_FILE"
          python3 -m openapi_spec_validator "$SPEC_FILE"

  # ─────────────────────────────────────────────────────────────────────────────
  # Build per-service OpenAPI specs fresh from source.
  # Publishes them as an artifact and emits a matrix of paths for downstream
  # contract-test jobs. Specs are NOT committed to git — this job is the
  # single source of truth.
  # بناء مواصفات OpenAPI الجديدة من الكود المصدري
  # ─────────────────────────────────────────────────────────────────────────────
  build-specs:
    name: Build OpenAPI Specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      specs: ${{ steps.enumerate.outputs.specs }}
      service_count: ${{ steps.enumerate.outputs.service_count }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install exporter runtime deps
        # Versions are pinned via constraints.txt so upgrades flow through a
        # single place and the exporter stays reproducible.
        run: |
          pip install --no-cache-dir \
            -c constraints.txt \
            -r requirements/openapi-export.txt

      - name: Export per-service OpenAPI specs
        id: export
        run: |
          mkdir -p build
          # Run with ``|| true`` so the failure is recorded in the summary
          # step below instead of eating the log; the gate comes at the end.
          python3 scripts/export-openapi.py \
            --summary-json build/openapi-summary.json \
            && echo "exit_code=0" >> "$GITHUB_OUTPUT" \
            || echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Print export summary (always)
        if: always()
        run: |
          set -euo pipefail
          echo "─── Export summary ───"
          if [ ! -f build/openapi-summary.json ]; then
            echo "::warning::No summary file produced — the exporter failed before writing it"
            exit 0
          fi
          python3 -c "
          import json
          s = json.load(open('build/openapi-summary.json'))
          print(f\"exported: {s['exported_count']}\")
          print(f\"skipped:  {s['skipped_count']}\")
          print('─── Skipped services (first 40) ───')
          for row in s['skipped'][:40]:
              print(f\"  • {row['service']}: {row['reason']}\")
          "

      - name: Gate — fail if exporter errored
        if: steps.export.outputs.exit_code != '0'
        run: |
          echo "::error::Exporter failed with exit code ${{ steps.export.outputs.exit_code }}. See the 'Print export summary' step above for the per-service skip reasons."
          exit 1

      - name: Enumerate spec files (hand-written + generated)
        id: enumerate
        run: |
          set -euo pipefail
          SPECS=()
          for f in api/gateway-openapi.yaml \
                   docs/api/openapi/core-services.yaml \
                   docs/api/openapi/field-services.yaml \
                   docs/api/openapi/weather-services.yaml; do
            [ -f "$f" ] && SPECS+=("$f")
          done
          while IFS= read -r f; do SPECS+=("$f"); done < <(
            find apps/services -maxdepth 2 -name openapi.yaml -type f | sort
          )
          printf 'Discovered %d spec(s):\n' "${#SPECS[@]}"
          printf '  • %s\n' "${SPECS[@]}"

          python3 - "${SPECS[@]}" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          print("specs=" + json.dumps(sys.argv[1:]))
          print(f"service_count={len(sys.argv[1:])}")
          PY

      - name: Upload generated specs
        uses: actions/upload-artifact@v7
        with:
          name: openapi-specs
          path: |
            apps/services/*/openapi.yaml
            api/gateway-openapi.yaml
            docs/api/openapi/*.yaml
            build/openapi-summary.json
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Static Schema Contract Tests (no running service required)
  # اختبارات عقود المخططات الثابتة
  # ─────────────────────────────────────────────────────────────────────────────
  static-contract-tests:
    name: Static Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate-spec, build-specs]
    if: needs.build-specs.outputs.service_count != '0'

    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJson(needs.build-specs.outputs.specs) }}

    steps:
      - uses: actions/checkout@v6

      - name: Download generated specs
        uses: actions/download-artifact@v8
        with:
          name: openapi-specs
          path: .

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install validators
        run: |
          pip install --no-cache-dir \
            openapi-spec-validator>=0.7.0 \
            schemathesis>=3.38.0 \
            pyyaml>=6.0

      - name: Validate ${{ matrix.spec }} (strict, warning-only)
        # openapi-spec-validator is stricter than Schemathesis on OpenAPI 3.1
        # semantics (e.g. path parameters declared in URLs must also appear in
        # the operation parameters list). Long-standing service bugs surface
        # here as warnings so the pipeline doesn't become a forcing function
        # for unrelated fixes. The Schemathesis loader below is the real gate.
        run: |
          set -euo pipefail
          SPEC="${{ matrix.spec }}"
          echo "🧪 openapi-spec-validator on $SPEC"
          if ! python3 -m openapi_spec_validator "$SPEC"; then
            echo "::warning file=$SPEC::Strict OpenAPI 3.1 validation failed — service owners should tighten the route declarations"
          fi

      - name: Schemathesis schema loader check for ${{ matrix.spec }}
        # ``from_path`` raises on a malformed spec (missing required fields,
        # unresolvable $refs) which is exactly what this guard needs to
        # detect. We rely on that public contract rather than poking at
        # Schemathesis internals.
        run: |
          set -euo pipefail
          SPEC="${{ matrix.spec }}"
          echo "🧪 Loading $SPEC through Schemathesis"
          python3 - "$SPEC" <<'PY'
          import sys, schemathesis
          path = sys.argv[1]
          schema = schemathesis.openapi.from_path(path)
          ops = list(schema.get_all_operations())
          print(f"✓ {path}: {len(ops)} operations loaded")
          PY

  # ─────────────────────────────────────────────────────────────────────────────
  # Live Contract Fuzz Tests (requires running services)
  # اختبارات العقود الحية — تتطلب خدمات قيد التشغيل
  # ─────────────────────────────────────────────────────────────────────────────
  live-contract-tests:
    name: Live Fuzz Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    env:
      JWT_SECRET_KEY: test-secret-key-for-schemathesis-only-32chars
      JWT_ALGORITHM: HS256
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --no-cache-dir schemathesis>=3.38.0 httpx>=0.28.0

      - name: Determine target URL
        id: target
        run: |
          TARGET="${{ github.event.inputs.target_url }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ vars.STAGING_API_BASE_URL }}"
          fi
          if [ -z "$TARGET" ]; then
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "⚠️ No target URL provided. Live tests will be skipped."
          else
            echo "url=$TARGET" >> "$GITHUB_OUTPUT"
            echo "🎯 Target URL: $TARGET"
          fi

      - name: Run Schemathesis against live API
        if: steps.target.outputs.url != ''
        run: |
          set -o pipefail
          TARGET="${{ steps.target.outputs.url }}"
          SPEC="${{ github.event.inputs.spec_file || 'api/gateway-openapi.yaml' }}"
          MAX_EXAMPLES="${{ github.event.inputs.max_examples || '50' }}"

          echo "🚀 Running Schemathesis fuzz tests"
          echo "   Target: $TARGET"
          echo "   Spec: $SPEC"
          echo "   Max examples per endpoint: $MAX_EXAMPLES"

          st run "$SPEC" \
            --base-url="$TARGET" \
            --hypothesis-max-examples="$MAX_EXAMPLES" \
            --checks=all \
            --stateful=links \
            --report \
            --header="Authorization: Bearer ${TEST_JWT_TOKEN:-mock-jwt-for-contract-tests}" \
            --header="X-Tenant-ID: 00000000-0000-0000-0000-000000000001" \
            --junit-xml=/tmp/schemathesis-results.xml \
            2>&1 | tee /tmp/schemathesis-output.log

      - name: Upload Schemathesis results
        if: always() && steps.target.outputs.url != ''
        uses: actions/upload-artifact@v7
        with:
          name: schemathesis-results
          path: |
            /tmp/schemathesis-results.xml
            /tmp/schemathesis-output.log
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Pytest Contract Tests (Schemathesis + GraphQL consistency)
  # ─────────────────────────────────────────────────────────────────────────────
  pytest-contract-tests:
    name: Pytest Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: |
          pip install --no-cache-dir \
            -r requirements/test-requirements.txt \
            schemathesis>=3.38.0

      - name: Run contract tests
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret-key-for-contract-tests-only32
          JWT_ALGORITHM: HS256
          KONG_BASE_URL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.STAGING_API_BASE_URL || 'http://localhost:8000' }}
          GRAPHQL_URL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.STAGING_API_BASE_URL && format('{0}/graphql', vars.STAGING_API_BASE_URL) || 'http://localhost:8000/graphql' }}
          FIELD_SERVICE_OPENAPI_URL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.STAGING_API_BASE_URL && format('{0}/api-json', vars.STAGING_API_BASE_URL) || 'http://localhost:3000/api-json' }}
        run: |
          set -o pipefail
          mkdir -p reports
          echo "🧪 Running pytest contract tests..."
          python -m pytest tests/contract/ \
            -v \
            -m contract \
            --tb=short \
            --junit-xml=reports/contract-tests.xml \
            2>&1 | tee /tmp/pytest-contract.log

          if grep -q "0 passed" /tmp/pytest-contract.log && grep -q "skipped" /tmp/pytest-contract.log; then
            echo "::warning::All contract tests were skipped — services are unreachable. Set vars.STAGING_API_BASE_URL for meaningful test execution."
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-contract-report
          path: reports/contract-tests.xml
          retention-days: 14
