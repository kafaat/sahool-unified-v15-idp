name: Security Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2:00 AM UTC for continuous security monitoring
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      full-scan:
        description: 'Run full security scan (slower but more comprehensive)'
        required: false
        type: boolean
        default: false

# Cancel in-progress runs for the same branch
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict default permissions for all jobs
permissions:
  contents: read
  actions: read

env:
  CACHE_VERSION: "v2"

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for secrets in code
        run: |
          echo "🔍 Scanning for potential secrets..."

          # Only check for actual embedded secrets, not variable names or paths
          FOUND=0

          # Check for actual private key content (PEM format)
          if grep -rn "-----BEGIN.*PRIVATE KEY-----" --include="*.py" --include="*.js" --include="*.ts" --include="*.yml" --include="*.yaml" . 2>/dev/null | grep -v ".github/workflows"; then
            echo "⚠️ Found embedded private key content"
            FOUND=1
          fi

          # Check for hardcoded AWS credentials (actual values, not env vars)
          # Exclude test files and example files
          if grep -rniE "AKIA[0-9A-Z]{16}" --include="*.py" --include="*.js" --include="*.ts" --include="*.yml" --include="*.yaml" . 2>/dev/null | grep -v ".github/workflows" | grep -v "test_" | grep -v "_test.py" | grep -v "tests/" | grep -v "_example" | grep -v "example_" | grep -v "examples"; then
            echo "⚠️ Found AWS Access Key ID"
            FOUND=1
          fi

          # Check for hardcoded passwords with actual values (not env var references)
          # Exclude test files and example files
          if grep -rniE "password\s*=\s*['\"][a-zA-Z0-9!@#$%^&*]{8,}['\"]" --include="*.py" . 2>/dev/null | grep -v "test_" | grep -v "_test.py" | grep -v "_example" | grep -v "example_" | grep -v "examples" | grep -v "getenv" | grep -v "environ" | grep -v "mock" | grep -v "fixture"; then
            echo "⚠️ Found hardcoded password"
            FOUND=1
          fi

          if [ $FOUND -eq 1 ]; then
            echo "❌ Secrets scan failed!"
            exit 1
          fi

          echo "✅ No secrets found in code"

      - name: Check for sensitive files
        run: |
          echo "🔍 Checking for sensitive files..."

          # Note: secrets/ directories under gitops/ and shared/ are code templates, not actual secrets
          SENSITIVE_FILES=(
            "*.pem"
            "*.key"
            "*.p12"
            "*.pfx"
            ".env"
            ".env.local"
            "*.credentials"
          )

          FOUND=0
          for pattern in "${SENSITIVE_FILES[@]}"; do
            # Exclude example files and gitops templates
            MATCHES=$(find . -name "$pattern" -not -path "./.git/*" -not -name "*.example" -not -path "./gitops/*" 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "⚠️ Found sensitive file pattern: $pattern"
              echo "$MATCHES"
              FOUND=1
            fi
          done

          # Check for secrets directories at root level only (not code directories)
          if find . -maxdepth 1 -name "secrets" -type d 2>/dev/null | grep -q .; then
            echo "⚠️ Found root-level secrets directory"
            FOUND=1
          fi

          if [ $FOUND -eq 1 ]; then
            echo "❌ Sensitive files found!"
            exit 1
          fi

          echo "✅ No sensitive files found"

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    continue-on-error: false
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Free up disk space
        run: |
          echo "🧹 Freeing up disk space..."
          # Remove unnecessary packages and files to prevent "no space left on device" errors
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install safety
        run: pip install safety pip-audit

      - name: Install Trivy
        id: install_trivy
        run: |
          TRIVY_VERSION="0.62.1"
          echo "📦 Installing Trivy v${TRIVY_VERSION}..."
          for i in 1 2 3 4; do
            echo "Attempt $i: Downloading Trivy..."
            if curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
              -o trivy.tar.gz -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"; then
              tar -xzf trivy.tar.gz trivy
              sudo mv trivy /usr/local/bin/trivy
              rm -f trivy.tar.gz
              trivy --version
              echo "installed=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Download failed, retrying in $((i * 4))s..."
            sleep $((i * 4))
          done
          # Fallback: use official install script (latest stable)
          echo "Trying official install script..."
          if curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin; then
            trivy --version
            echo "installed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "installed=false" >> $GITHUB_OUTPUT
          echo "::warning::Failed to install Trivy after all attempts"

      - name: Cache Trivy DB
        if: steps.install_trivy.outputs.installed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Scan Python dependencies with Safety
        continue-on-error: true
        run: |
          echo "🔍 Scanning Python dependencies with Safety..."
          # Note: Safety now requires API key for full functionality
          # Using 'scan' command (check was deprecated June 2024)
          SAFETY_ISSUES=0
          for req in $(find . -name "requirements.txt" -type f -not -path "./.git/*" -not -path "./archive/*"); do
            echo "Scanning: $req"
            safety scan --target "$req" 2>&1 || SAFETY_ISSUES=$((SAFETY_ISSUES + 1))
          done
          if [ $SAFETY_ISSUES -gt 0 ]; then
            echo "::warning::Safety found potential issues in $SAFETY_ISSUES requirements files"
          fi
          echo "✅ Safety scan completed"

      - name: Scan Python dependencies with pip-audit
        continue-on-error: true
        run: |
          echo "🔍 Scanning Python dependencies with pip-audit..."
          AUDIT_ISSUES=0
          for req in $(find . -name "requirements.txt" -type f -not -path "./.git/*" -not -path "./archive/*" | head -10); do
            echo "Auditing: $req"
            pip-audit -r "$req" 2>&1 || AUDIT_ISSUES=$((AUDIT_ISSUES + 1))
          done
          if [ $AUDIT_ISSUES -gt 0 ]; then
            echo "::warning::pip-audit found potential issues in $AUDIT_ISSUES requirements files"
          fi
          echo "✅ pip-audit scan completed"

      - name: Run Trivy filesystem scan
        id: trivy
        if: steps.install_trivy.outputs.installed == 'true'
        continue-on-error: true  # Informational scan - don't block pipeline
        run: |
          echo "🔍 Running Trivy filesystem scan..."
          mkdir -p trivy-results
          trivy fs \
            --skip-check-update \
            --scanners vuln \
            --severity CRITICAL \
            --exit-code 0 \
            --format sarif \
            --output trivy-results.sarif \
            . || true

      - name: Create empty SARIF if Trivy failed
        if: always()
        run: |
          if [ ! -f "trivy-results.sarif" ]; then
            echo "Creating empty SARIF file..."
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","version":"0.62.1"}},"results":[]}]}' > trivy-results.sarif
          fi

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-dependency-scan'

      - name: Report vulnerabilities
        if: always()
        run: |
          if [ -f "trivy-results.sarif" ]; then
            # Check if there are any results in the SARIF file
            RESULTS=$(cat trivy-results.sarif | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('runs',[{}])[0].get('results',[])))" 2>/dev/null || echo "0")
            if [ "$RESULTS" != "0" ]; then
              echo "::warning::Trivy found $RESULTS potential security issues"
              echo "## ⚠️ Security Scan Results" >> $GITHUB_STEP_SUMMARY
              echo "Trivy detected $RESULTS potential issues. Please review the Security tab." >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No critical vulnerabilities found by Trivy"
            fi
          fi

  code-security:
    name: Code Security Analysis (SAST)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install security scanners
        run: pip install bandit semgrep

      - name: Run Bandit security scan
        continue-on-error: true
        run: |
          echo "Running Bandit security analysis..."
          if [ -d "apps/services" ] || [ -d "shared" ]; then
            # Generate SARIF report (informational, don't fail on this)
            bandit -r apps/services/ shared/ -ll -ii \
              --exclude "*/tests/*,*/test_*,*/__pycache__/*,*/archive/*" \
              --format sarif -o bandit-results.sarif 2>/dev/null || true
            # Run text report for visibility
            bandit -r apps/services/ shared/ -ll -ii \
              --exclude "*/tests/*,*/test_*,*/__pycache__/*,*/archive/*" \
              --format txt 2>/dev/null || true
          fi

      - name: Run Semgrep SAST
        timeout-minutes: 5
        continue-on-error: true
        run: |
          echo "Running Semgrep SAST..."
          if [ -d "apps/services" ] || [ -d "shared" ]; then
            # Focus on security-critical rules only (p/python is too broad/slow)
            semgrep --config=p/security-audit \
                    --config=p/secrets \
                    --severity=ERROR \
                    --severity=WARNING \
                    --exclude="**/test_*.py" \
                    --exclude="**/*_test.py" \
                    --exclude="**/tests/**" \
                    --exclude="**/node_modules/**" \
                    --exclude="**/__pycache__/**" \
                    --exclude="**/archive/**" \
                    --timeout=60 \
                    --max-target-bytes=500000 \
                    --jobs=2 \
                    --sarif -o semgrep-results.sarif \
                    apps/services/ shared/ 2>/dev/null || true
          fi

      - name: Create empty SARIF files if missing
        if: always()
        run: |
          if [ ! -f "bandit-results.sarif" ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Bandit","version":"1.0.0"}},"results":[]}]}' > bandit-results.sarif
          fi
          if [ ! -f "semgrep-results.sarif" ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Semgrep","version":"1.0.0"}},"results":[]}]}' > semgrep-results.sarif
          fi

      - name: Upload Bandit SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: bandit-results.sarif
          category: 'bandit-sast'

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep-results.sarif
          category: 'semgrep-sast'

      - name: Upload security reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: security-reports
          path: |
            bandit-results.sarif
            semgrep-results.sarif
          retention-days: 30

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Scan Dockerfiles
        run: |
          echo "🔍 Scanning Dockerfiles..."

          for dockerfile in $(find . -name "Dockerfile" -type f); do
            echo "Checking: $dockerfile"

            # Check for root user
            if grep -q "USER root" "$dockerfile"; then
              echo "⚠️ WARNING: Container runs as root in $dockerfile"
            fi

            # Check for latest tag
            if grep -qE "FROM .+:latest" "$dockerfile"; then
              echo "⚠️ WARNING: Using :latest tag in $dockerfile"
            fi

            # Check for hardcoded secrets
            if grep -qE "(PASSWORD|SECRET|KEY)=" "$dockerfile"; then
              echo "❌ ERROR: Hardcoded secrets in $dockerfile"
              exit 1
            fi
          done

          echo "✅ Dockerfile scan complete"

  # ─────────────────────────────────────────────────────────────────────────────
  # SBOM Generation (Software Bill of Materials)
  # ─────────────────────────────────────────────────────────────────────────────
  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install SBOM tools
        run: |
          pip install cyclonedx-bom --quiet
          npm install -g @cyclonedx/cdxgen --quiet 2>/dev/null || true

      - name: Generate Python SBOM
        run: |
          echo "Generating Python SBOM..."
          for req in $(find . -name "requirements.txt" -type f -not -path "./.git/*" -not -path "./archive/*" | head -20); do
            echo "Processing: $req"
            cyclonedx-py requirements "$req" --output-format json --output-file "sbom-python-$(echo $req | md5sum | cut -d' ' -f1).json" 2>/dev/null || true
          done
        continue-on-error: true

      - name: Generate Node.js SBOM
        run: |
          echo "Generating Node.js SBOM..."
          if [ -f "package-lock.json" ]; then
            npx @cyclonedx/cdxgen -o sbom-nodejs.json -t npm . 2>/dev/null || true
          fi
        continue-on-error: true

      - name: Merge SBOMs
        run: |
          echo "Merging SBOMs into single file..."
          # Create a combined SBOM summary
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat << EOF > sbom-summary.json
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.4",
            "version": 1,
            "metadata": {
              "timestamp": "${TIMESTAMP}",
              "component": {
                "type": "application",
                "name": "sahool-platform",
                "version": "16.0.0"
              }
            },
            "components": []
          }
          EOF
          echo "✅ SBOM generation complete"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-*.json
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # OWASP Dependency Check
  # ─────────────────────────────────────────────────────────────────────────────
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.full-scan == 'true' || github.ref == 'refs/heads/main'
    continue-on-error: false
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Cache OWASP database
        uses: actions/cache@v5.0.3
        with:
          path: ~/.dependency-check
          key: ${{ runner.os }}-owasp-db-${{ env.CACHE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-owasp-db-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies for Node Audit analysis
        run: npm ci --ignore-scripts --no-audit 2>/dev/null || true

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        id: owasp
        with:
          project: 'sahool-platform'
          path: '.'
          format: 'HTML'
          out: 'owasp-reports'
          args: >
            -f JSON
            -f SARIF
            --enableExperimental
            --failOnCVSS 7
            --exclude 'archive/**'
            --exclude '**/__pycache__/**'
            --exclude '**/node_modules/**'
            --suppression .dependency-check-suppression.xml

      - name: Upload OWASP SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: owasp-reports/dependency-check-report.sarif
          category: 'owasp-dependency-check'

      - name: Upload OWASP reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: owasp-reports-${{ github.sha }}
          path: owasp-reports/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # License Compliance Check
  # ─────────────────────────────────────────────────────────────────────────────
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install license checkers
        run: |
          pip install pip-licenses --quiet
          npm install -g license-checker --quiet 2>/dev/null || true

      - name: Check Python licenses
        run: |
          echo "## Python License Summary" >> $GITHUB_STEP_SUMMARY
          pip-licenses --format=markdown --with-urls 2>/dev/null | head -50 >> $GITHUB_STEP_SUMMARY || echo "No Python packages found"
        continue-on-error: true

      - name: Check Node.js licenses
        run: |
          echo "## Node.js License Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps --quiet 2>/dev/null || true
            npx license-checker --summary 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No Node.js packages found"
          fi
        continue-on-error: true

      - name: Check for GPL licenses (warning)
        run: |
          echo "Checking for GPL licenses..."
          pip-licenses --format=csv 2>/dev/null | grep -i "GPL" && echo "::warning::GPL licensed packages found - review for compliance" || echo "✅ No GPL licenses detected in Python packages"
        continue-on-error: true

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [secrets-scan, dependency-scan, code-security, sbom-generation, license-check]
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Scan | ${{ needs.secrets-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result == 'success' && '✅ Passed' || (needs.dependency-scan.result == 'skipped' && '⏭️ Skipped' || '⚠️ Issues Found') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Security | ${{ needs.code-security.result == 'success' && '✅ Passed' || (needs.code-security.result == 'skipped' && '⏭️ Skipped' || '⚠️ Issues Found') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Generation | ${{ needs.sbom-generation.result == 'success' && '✅ Generated' || (needs.sbom-generation.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Compliance | ${{ needs.license-check.result == 'success' && '✅ Passed' || (needs.license-check.result == 'skipped' && '⏭️ Skipped' || '⚠️ Review Needed') }} |" >> $GITHUB_STEP_SUMMARY

      - name: Enforce security gates
        run: |
          CRITICAL_FAILURES=0

          if [[ "${{ needs.secrets-scan.result }}" == "failure" ]]; then
            echo "::error::Secrets scan failed - potential credentials in code"
            CRITICAL_FAILURES=$((CRITICAL_FAILURES + 1))
          fi

          if [ $CRITICAL_FAILURES -gt 0 ]; then
            echo "::error::$CRITICAL_FAILURES critical security check(s) failed - blocking merge"
            exit 1
          fi

          # Non-critical warnings (these jobs use continue-on-error: true)
          if [[ "${{ needs.code-security.result }}" == "failure" ]]; then
            echo "::warning::Code security analysis (SAST) reported issues - review recommended"
          fi

          if [[ "${{ needs.dependency-scan.result }}" == "failure" ]]; then
            echo "::warning::Dependency scan reported issues - review recommended"
          fi

          echo "Security gates passed"

      - name: Notify on security issues (main branch)
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          echo "::error::Security issues detected on main branch - review required"
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"Security Alert: Issues detected in SAHOOL platform\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nDetails: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
              "${{ secrets.SLACK_WEBHOOK_URL }}"
          fi
        continue-on-error: true
