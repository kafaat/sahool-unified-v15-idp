# SAHOOL hadolint Configuration
# إعدادات فحص Docker لمنصة سهول

# Fail on warnings and above
failure-threshold: warning

# Ignore rules that conflict with our patterns
ignored:
  # DL3008: Pin versions in apt-get install (too strict for base images)
  - DL3008
  # DL3013: Pin versions in pip install (we use constraints.txt instead)
  - DL3013
  # DL3018: Pin versions in apk add (Alpine packages)
  - DL3018
  # DL3059: Multiple consecutive RUN instructions (we optimize for layer caching)
  - DL3059
  # DL4006: Set SHELL option -o pipefail (not all base images support it)
  - DL4006
  # SC2015: A && B || C pattern used intentionally for npm/pip mirror fallback chains
  - SC2015
  # SC2102: Range pattern false positive in printf/heredoc pip.conf generation
  - SC2102

# Trusted registries
trustedRegistries:
  - docker.io
  - ghcr.io
  - gcr.io
  - quay.io
  - nvidia
  - python
  - node
  - eclipse-mosquitto
  - grafana
  - nats
  - redis
  - postgres
  - bitnami
  - minio
