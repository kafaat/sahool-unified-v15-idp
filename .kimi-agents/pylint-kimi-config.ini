# ═══════════════════════════════════════════════════════════════════════════════
# Kimi Pylint Configuration for Backend
# إعداد Pylint مع وكيل Kimi للخلفية
# ═══════════════════════════════════════════════════════════════════════════════
#
# This configuration extends the base Ruff/Pylint configuration with Kimi-specific
# rules for automated code quality improvements in Python services.
#
# هذا الإعداد يمد إعدادات Ruff/Pylint الأساسية بقواعد Kimi المخصصة
# لتحسين جودة كود Python تلقائياً
# ═══════════════════════════════════════════════════════════════════════════════

[MASTER]
# Load Kimi plugin for enhanced analysis
load-plugins=kimi_repair_plugin

# Kimi-specific settings
kimi-enabled=true
kimi-version=16.0.0
kimi-auto-fix=true

[KIMI]
# Kimi Repair Agent Configuration

# Enable automatic fixing of issues
auto-fix=true

# Enable EC (Electrical Conductivity) nutrient separation validation
# التحقق من فصل قيمة EC عن العناصر الغذائية
ec-nutrient-separation=true

# Enable type hints validation
# التحقق من وجود type hints
enforce-type-hints=true

# Enable security scanning
# تفعيل فحص الأمان
security-scan=true

# Agricultural domain-specific validations
# التحقق من صحة المصطلحات الزراعية
agricultural-domain-validation=true

[MESSAGES CONTROL]
# Enable Kimi-specific messages
enable=
    kimi-inconsistent-ec,
    kimi-missing-type-hints,
    kimi-unhandled-exception,
    kimi-hardcoded-password,
    kimi-agricultural-naming,
    kimi-empty-except,
    kimi-sql-injection,
    kimi-unsafe-yaml

# Disable overly strict rules for productivity
disable=
    too-few-public-methods,
    too-many-arguments,
    too-many-locals,
    too-many-branches,
    too-many-statements,
    duplicate-code

[KIMI-RULES]
# Custom Kimi rules for SAHOOL platform

# EC (Electrical Conductivity) Rules
# قواعد قيمة EC
inconsistent-ec-usage:
    enabled=true
    severity=MEDIUM
    description="Ensure EC values are not confused with nutrient values"
    patterns=["ec_value.*fertilizer", "ec.*nitrogen", "ec.*phosphorus"]

# Type Hints Rules
# قواعد Type Hints
missing-type-hints:
    enabled=true
    severity=LOW
    description="Functions should have type hints for parameters and return values"
    exclude-patterns=["__init__", "test_*"]

# Error Handling Rules
# قواعد معالجة الأخطاء
empty-except:
    enabled=true
    severity=MEDIUM
    description="Avoid empty except blocks that hide errors"
    pattern="except.*:\\s*pass"

# Security Rules
# قواعد الأمان
hardcoded-password:
    enabled=true
    severity=CRITICAL
    description="No hardcoded passwords or secrets"
    patterns=["password\\s*=\\s*['\"]", "api_key\\s*=\\s*['\"]", "secret\\s*=\\s*['\"]"]

# Agricultural Domain Rules
# قواعد المجال الزراعي
agricultural-naming:
    enabled=true
    severity=LOW
    description="Use consistent naming for agricultural entities"
    entities=["field", "crop", "irrigation", "ndvi", "lai", "et", "vpd"]

[KIMI-AUTO-FIX]
# Configuration for automatic fixes

# Enable auto-fix for these categories
enabled-categories=
    code-style,
    imports,
    formatting,
    simple-refactoring

# Require manual review for these categories
manual-review-required=
    security,
    logic-changes,
    api-changes,
    database-schema

# Maximum fixes per file (safety limit)
max-fixes-per-file=20

# Create backup before applying fixes
create-backup=true
backup-suffix=.kimi-backup

[KIMI-INTEGRATION]
# Integration with development tools

# Pre-commit hook
pre-commit:
    enabled=true
    blocking=false
    max-errors=10

# CI/CD
ci-cd:
    enabled=true
    fail-on-critical=true
    max-warnings=50

# VS Code
vscode:
    enabled=true
    format-on-save=false
    lint-on-save=true

[KIMI-PERFORMANCE]
# Performance settings

# Enable caching
cache=true
cache-dir=.kimi-cache

# Parallel processing
parallel=true
max-workers=4

# Skip these directories
exclude-dirs=
    node_modules,
    .venv,
    venv,
    __pycache__,
    .pytest_cache,
    .mypy_cache,
    dist,
    build,
    archive,
    legacy

[KIMI-REPORTING]
# Reporting configuration

# Output format
output-format=json
output-file=.kimi-results/pylint-report.json

# Console output
console-output=true
colorize=true

# Statistics
show-statistics=true
show-summary=true

# ═══════════════════════════════════════════════════════════════════════════════
# Usage Notes - ملاحظات الاستخدام
# ═══════════════════════════════════════════════════════════════════════════════
#
# To use this configuration:
# 1. Ensure Ruff is installed: pip install ruff
# 2. Run: ruff check . --config .kimi-agents/pylint-kimi-config.ini
# 3. For auto-fix: ruff check . --fix --config .kimi-agents/pylint-kimi-config.ini
#
# Note: This is a conceptual configuration. Actual Kimi plugin would need to be
# installed separately. For now, use Ruff with pyproject.toml configuration.
#
# لاستخدام هذا الإعداد:
# 1. تأكد من تثبيت Ruff: pip install ruff
# 2. شغل: ruff check . --config .kimi-agents/pylint-kimi-config.ini
# 3. للإصلاح التلقائي: ruff check . --fix
#
# ملاحظة: هذا إعداد مفاهيمي. يحتاج إضافة Kimi الفعلية للتثبيت منفصلاً.
# حالياً استخدم Ruff مع إعدادات pyproject.toml
#
# ═══════════════════════════════════════════════════════════════════════════════
