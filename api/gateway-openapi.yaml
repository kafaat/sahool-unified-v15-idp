# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Platform - Gateway OpenAPI Specification
# مواصفات بوابة API لمنصة سهول
#
# This is the unified gateway-level OpenAPI spec that references all
# per-service specifications. It provides environment-driven server URLs
# and shared components (security, errors, pagination, correlation).
#
# Usage:
#   - Bundle with: npx @redocly/cli join api/gateway-openapi.yaml -o api/bundled.yaml
#   - Validate:    npx @redocly/cli lint api/gateway-openapi.yaml
#   - Generate SDK: openapi-generator-cli generate -i api/gateway-openapi.yaml -g typescript-axios
#
# @version 16.0.0
# @see docs/api/openapi/ for per-service specs
# ═══════════════════════════════════════════════════════════════════════════════

openapi: 3.0.3

info:
  title: SAHOOL Agricultural Intelligence Platform API
  description: |
    # منصة سهول للذكاء الزراعي - بوابة API الموحدة
    # SAHOOL Agricultural Intelligence Platform - Unified API Gateway

    ## Overview
    Gateway-level API specification for the SAHOOL platform, providing a single
    entry point for all 71 microservices. All requests are routed through Kong
    API Gateway which handles authentication, rate limiting, CORS, and routing.

    ## Authentication
    All protected endpoints require JWT authentication via `Authorization: Bearer <token>`.
    Public endpoints (login, register, health checks) are accessible without authentication.

    ## Multi-tenancy
    Most endpoints require the `X-Tenant-ID` header for tenant isolation.

    ## Rate Limiting
    | Tier         | Requests/min | Requests/hour |
    |--------------|-------------|---------------|
    | Starter      | 30          | 500           |
    | Professional | 60          | 2,000         |
    | Enterprise   | 120         | 5,000         |
    | Research     | 120         | 10,000        |
    | Internal     | 1,000       | 50,000        |

    ## Error Format
    All errors follow the unified `ApiResponse` format with bilingual messages (AR/EN).

    ## Service Specifications
    Detailed per-service specs are available in `docs/api/openapi/`:
    - [Core Services](./docs/api/openapi/core-services.yaml) - Auth, Users, Notifications, Alerts
    - [Field Services](./docs/api/openapi/field-services.yaml) - Field Management, Boundaries, NDVI
    - [Weather Services](./docs/api/openapi/weather-services.yaml) - Weather, Forecasts, GDD
    - [AI Services](./docs/api/openapi/ai-services.yaml) - Advisory, Crop Intelligence, Disease Detection
    - [Analysis Services](./docs/api/openapi/analysis-services.yaml) - Vegetation, Indicators, LAI
    - [IoT Services](./docs/api/openapi/iot-services.yaml) - Devices, Sensors, WebSocket
    - [Marketplace Services](./docs/api/openapi/marketplace-services.yaml) - Products, Orders
    - [Billing Services](./docs/api/openapi/billing-services.yaml) - Plans, Subscriptions, Invoices
    - [Task Services](./docs/api/openapi/task-services.yaml) - Tasks, Equipment, Inventory
    - [Agent Services](./docs/api/openapi/agent-services.yaml) - AI Agents, Knowledge Graph
    - [Vision API](./docs/api/openapi/yolo26-vision-api.yaml) - YOLO26 Pest/Disease/Weed Detection
    - [Terrain API](./docs/api/openapi/terrain-api.yaml) - DEM, Slope, Aspect Analysis
    - [Hydrology API](./docs/api/openapi/hydrology-api.yaml) - Drainage, Watershed
    - [Leveling API](./docs/api/openapi/leveling-api.yaml) - Field Leveling Optimization
    - [Edge API](./docs/api/openapi/edge-api.yaml) - Edge Device Management

  version: "16.0.0"
  contact:
    name: SAHOOL Platform Support
    email: support@sahool.sa
    url: https://sahool.sa
  license:
    name: Proprietary
    url: https://sahool.sa/terms

# ═══════════════════════════════════════════════════════════════════════════════
# Server URLs - Environment-Driven
# عناوين الخوادم - تعتمد على البيئة
# ═══════════════════════════════════════════════════════════════════════════════
servers:
  - url: https://api.sahool.app
    description: Production (public gateway)
  - url: https://staging-api.sahool.sa/api/v1
    description: Staging
  - url: http://localhost:8000
    description: Local development (Kong Gateway)
  - url: http://{service}.{namespace}.svc.cluster.local:{port}
    description: In-cluster (Kubernetes)
    variables:
      service:
        default: kong
        description: Kubernetes Service name for the gateway
      namespace:
        default: kong
        description: Kubernetes Namespace where the gateway runs
      port:
        default: "8000"
        description: Gateway service port

