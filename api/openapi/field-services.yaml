openapi: 3.0.3
info:
  title: SAHOOL Platform - Field Services API
  description: |
    # SAHOOL Field Management API Documentation
    ## واجهة برمجة تطبيقات إدارة الحقول الزراعية

    This API provides comprehensive field management and geospatial capabilities for the SAHOOL agricultural platform:
    - Field CRUD operations (عمليات إدارة الحقول)
    - Field Boundary Management (إدارة حدود الحقول)
    - Boundary Change History (سجل تغييرات الحدود)
    - NDVI & Vegetation Index Data (بيانات مؤشر الغطاء النباتي)
    - Pest Management (إدارة الآفات)
    - Field Health Monitoring (مراقبة صحة الحقول)
    - Geospatial Queries (الاستعلامات الجغرافية)

    ## Authentication
    All endpoints require JWT authentication via the `Authorization: Bearer <token>` header.

    ## Multi-tenancy
    All endpoints require the `X-Tenant-ID` header for tenant isolation.

    ## Rate Limiting
    - Free tier: 30 requests/minute
    - Standard: 60 requests/minute
    - Premium: 120 requests/minute

    ## Kong Gateway Configuration
    - Service: field-management-service
    - Port: 3000
    - Paths: /api/v1/fields, /api/v1/field, /field

  version: 16.0.0
  contact:
    name: SAHOOL Field Services Support
    email: support@sahool.sa
    url: https://sahool.sa
  license:
    name: Proprietary
    url: https://sahool.sa/terms

servers:
  - url: https://api.sahool.sa/api/v1
    description: Production server (الخادم الإنتاجي)
  - url: https://staging-api.sahool.sa/api/v1
    description: Staging server (خادم الاختبار)
  - url: http://localhost:3000
    description: Development server - Field Management Service (خادم التطوير)

tags:
  - name: Fields
    description: |
      Field management operations - إدارة الحقول
      Core CRUD operations for agricultural field management including creation, updates, and deletion.
  - name: Boundaries
    description: |
      Field boundary management - إدارة حدود الحقول
      Update field boundaries with change tracking and audit trail.
  - name: NDVI
    description: |
      Vegetation index data - بيانات مؤشر الغطاء النباتي
      Record and retrieve NDVI readings from satellite imagery.
  - name: Pests
    description: |
      Pest management and treatment tracking - إدارة الآفات والعلاجات
  - name: Geospatial
    description: |
      Geospatial queries and analysis - الاستعلامات الجغرافية
  - name: Health
    description: |
      Service health endpoints - نقاط فحص صحة الخدمة

paths:
  # ============================================================================
  # FIELD MANAGEMENT ENDPOINTS
  # نقاط إدارة الحقول
  # ============================================================================
  /fields:
    get:
      tags: [Fields]
      summary: List all fields
      description: |
        Get paginated list of fields for the tenant.
        الحصول على قائمة مُقسمة للحقول حسب المستأجر.
      operationId: listFields
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          description: |
            Filter by field status
            تصفية حسب حالة الحقل
          schema:
            $ref: '#/components/schemas/FieldStatus'
        - name: cropType
          in: query
          description: |
            Filter by crop type
            تصفية حسب نوع المحصول
          schema:
            $ref: '#/components/schemas/CropType'
        - name: irrigationType
          in: query
          description: |
            Filter by irrigation type
            تصفية حسب نوع الري
          schema:
            $ref: '#/components/schemas/IrrigationType'
        - name: soilType
          in: query
          description: |
            Filter by soil type
            تصفية حسب نوع التربة
          schema:
            $ref: '#/components/schemas/SoilType'
        - name: minArea
          in: query
          description: |
            Minimum area in hectares
            الحد الأدنى للمساحة بالهكتار
          schema:
            type: number
            format: double
            minimum: 0
        - name: maxArea
          in: query
          description: |
            Maximum area in hectares
            الحد الأقصى للمساحة بالهكتار
          schema:
            type: number
            format: double
            minimum: 0
        - name: sortBy
          in: query
          description: |
            Sort field
            ترتيب حسب
          schema:
            type: string
            enum: [name, areaHectares, createdAt, updatedAt, healthScore]
            default: createdAt
        - name: sortOrder
          in: query
          description: |
            Sort order
            اتجاه الترتيب
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: |
            Successful response
            استجابة ناجحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      security:
        - bearerAuth: []

    post:
      tags: [Fields]
      summary: Create a new field
      description: |
        Create a new agricultural field with boundary coordinates.
        إنشاء حقل زراعي جديد مع إحداثيات الحدود.
      operationId: createField
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldDto'
            examples:
              wheat_field:
                summary: Wheat field example (مثال حقل قمح)
                value:
                  name: حقل القمح الشمالي
                  cropType: wheat
                  areaHectares: 8.5
                  boundary:
                    - [46.7, 24.6]
                    - [46.8, 24.6]
                    - [46.8, 24.7]
                    - [46.7, 24.7]
                    - [46.7, 24.6]
                  irrigationType: drip
                  soilType: sandy_loam
                  plantingDate: '2026-01-15'
              date_palm:
                summary: Date palm grove (مثال بستان نخيل)
                value:
                  name: بستان النخيل الشرقي
                  cropType: date_palm
                  areaHectares: 12.3
                  boundary:
                    - [46.85, 24.55]
                    - [46.95, 24.55]
                    - [46.95, 24.65]
                    - [46.85, 24.65]
                    - [46.85, 24.55]
                  irrigationType: drip
                  soilType: sandy
                  plantingDate: '2020-03-01'
      responses:
        '201':
          description: |
            Field created successfully
            تم إنشاء الحقل بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - bearerAuth: []

  /fields/{fieldId}:
    get:
      tags: [Fields]
      summary: Get field by ID
      description: |
        Get detailed field information including current NDVI and health score.
        الحصول على معلومات الحقل التفصيلية بما في ذلك مؤشر NDVI الحالي ودرجة الصحة.
      operationId: getField
      parameters:
        - $ref: '#/components/parameters/FieldId'
        - $ref: '#/components/parameters/TenantId'
        - name: include
          in: query
          description: |
            Include related data
            تضمين البيانات المرتبطة
          schema:
            type: array
            items:
              type: string
              enum: [ndviHistory, boundaryHistory, cropSeasons]
          style: form
          explode: false
      responses:
        '200':
          description: |
            Successful response
            استجابة ناجحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []

    put:
      tags: [Fields]
      summary: Update field
      description: |
        Update field properties. Use PUT /fields/{fieldId}/boundary to update boundaries.
        تحديث خصائص الحقل. استخدم PUT /fields/{fieldId}/boundary لتحديث الحدود.
      operationId: updateField
      parameters:
        - $ref: '#/components/parameters/FieldId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFieldDto'
            examples:
              update_crop:
                summary: Update crop type (تحديث نوع المحصول)
                value:
                  cropType: barley
                  plantingDate: '2026-02-01'
              update_status:
                summary: Mark as harvested (تحديد كمحصود)
                value:
                  status: harvested
      responses:
        '200':
          description: |
            Field updated successfully
            تم تحديث الحقل بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
      security:
        - bearerAuth: []

    delete:
      tags: [Fields]
      summary: Delete field
      description: |
        Soft delete a field. The field will be marked as inactive but not permanently removed.
        حذف الحقل (حذف مبدئي). سيتم تحديد الحقل كغير نشط ولكن لن يُزال نهائياً.
      operationId: deleteField
      parameters:
        - $ref: '#/components/parameters/FieldId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '204':
          description: |
            Field deleted successfully
            تم حذف الحقل بنجاح
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []

  # ============================================================================
  # BOUNDARY MANAGEMENT ENDPOINTS
  # نقاط إدارة الحدود
  # ============================================================================
  /fields/{fieldId}/boundary:
    put:
      tags: [Boundaries]
      summary: Update field boundary
      description: |
        Update the field boundary with a change reason for audit trail.
        تحديث حدود الحقل مع سبب التغيير للسجل المراجعي.

        This operation:
        - Validates the new boundary geometry
        - Recalculates the field area
        - Creates a history record of the change
        - Triggers NDVI recalculation for the new boundary

        هذه العملية:
        - تتحقق من صحة الهندسة الجديدة للحدود
        - تعيد حساب مساحة الحقل
        - تنشئ سجل بتاريخ التغيير
        - تفعّل إعادة حساب NDVI للحدود الجديدة
      operationId: updateFieldBoundary
      parameters:
        - $ref: '#/components/parameters/FieldId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoundaryDto'
            examples:
              expansion:
                summary: Field expansion (توسيع الحقل)
                value:
                  boundary:
                    type: Polygon
                    coordinates:
                      - - [46.7, 24.6]
                        - [46.85, 24.6]
                        - [46.85, 24.75]
                        - [46.7, 24.75]
                        - [46.7, 24.6]
                  changeReason: "توسيع الحقل بعد شراء الأرض المجاورة - Field expansion after purchasing adjacent land"
                  changeSource: mobile
              correction:
                summary: GPS correction (تصحيح GPS)
                value:
                  boundary:
                    type: Polygon
                    coordinates:
                      - - [46.701, 24.601]
                        - [46.801, 24.601]
                        - [46.801, 24.701]
                        - [46.701, 24.701]
                        - [46.701, 24.601]
                  changeReason: "تصحيح حدود الحقل بعد المسح الجديد - Boundary correction after new survey"
                  changeSource: api
      responses:
        '200':
          description: |
            Boundary updated successfully
            تم تحديث الحدود بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoundaryUpdateResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: |
            Invalid geometry - الهندسة غير صالحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: Invalid polygon geometry - polygon must be closed and non-self-intersecting
                error_ar: هندسة المضلع غير صالحة - يجب أن يكون المضلع مغلقاً وغير متقاطع ذاتياً
      security:
        - bearerAuth: []

  /fields/{fieldId}/history:
    get:
      tags: [Boundaries]
      summary: Get boundary change history
      description: |
        Get the history of boundary changes for a field with audit information.
        الحصول على سجل تغييرات حدود الحقل مع معلومات المراجعة.
      operationId: getFieldBoundaryHistory
      parameters:
        - $ref: '#/components/parameters/FieldId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: startDate
          in: query
          description: |
            Filter changes from this date
            تصفية التغييرات من هذا التاريخ
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: |
            Filter changes until this date
            تصفية التغييرات حتى هذا التاريخ
          schema:
            type: string
            format: date
        - name: changeSource
          in: query
          description: |
            Filter by change source
            تصفية حسب مصدر التغيير
          schema:
            $ref: '#/components/schemas/ChangeSource'
      responses:
        '200':
          description: |
            Boundary history retrieved
            تم استرجاع سجل الحدود
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldBoundaryHistoryListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []

  # ============================================================================
  # NDVI ENDPOINTS
  # نقاط مؤشر الغطاء النباتي
  # ============================================================================
  /fields/{fieldId}/ndvi:
    get:
      tags: [NDVI]
      summary: Get NDVI history
      description: |
        Get vegetation index history for a field.
        الحصول على سجل مؤشر NDVI للحقل.
      operationId: getFieldNdvi
      parameters:
        - $ref: '#/components/parameters/FieldId'
        - $ref: '#/components/parameters/TenantId'
        - name: startDate
          in: query
          description: |
            Start date for filtering
            تاريخ البداية للتصفية
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: |
            End date for filtering
            تاريخ النهاية للتصفية
          schema:
            type: string
            format: date
        - name: source
          in: query
          description: |
            Filter by satellite source
            تصفية حسب مصدر القمر الصناعي
          schema:
            type: string
            enum: [sentinel-2, landsat-8, landsat-9, modis, planet]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: |
            NDVI data retrieved
            تم استرجاع بيانات NDVI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NdviListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []

    post:
      tags: [NDVI]
      summary: Record NDVI reading
      description: |
        Record a new NDVI measurement for the field from satellite imagery.
        تسجيل قراءة NDVI جديدة للحقل من صور الأقمار الصناعية.
      operationId: addFieldNdvi
      parameters:
        - $ref: '#/components/parameters/FieldId'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NdviReadingDto'
            examples:
              sentinel:
                summary: Sentinel-2 reading (قراءة سنتينل-2)
                value:
                  value: 0.72
                  source: sentinel-2
                  cloudCover: 5.2
                  satelliteName: Sentinel-2A
                  bandInfo:
                    red: B04
                    nir: B08
                    resolution: 10
                  recordedAt: '2026-01-15T10:30:00Z'
              landsat:
                summary: Landsat-8 reading (قراءة لاندسات-8)
                value:
                  value: 0.68
                  source: landsat-8
                  cloudCover: 12.5
                  satelliteName: Landsat-8 OLI
                  bandInfo:
                    red: B4
                    nir: B5
                    resolution: 30
                  recordedAt: '2026-01-14T09:15:00Z'
      responses:
        '201':
          description: |
            NDVI reading recorded
            تم تسجيل قراءة NDVI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NdviResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []

  # ============================================================================
  # PEST MANAGEMENT ENDPOINTS
  # نقاط إدارة الآفات
  # ============================================================================
  /pests/incidents:
    get:
      tags: [Pests]
      summary: List pest incidents
      description: |
        Get paginated list of pest incidents.
        الحصول على قائمة مُقسمة لحوادث الآفات.
      operationId: listPestIncidents
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: fieldId
          in: query
          description: |
            Filter by field ID
            تصفية حسب معرف الحقل
          schema:
            type: string
            format: uuid
        - name: cropSeasonId
          in: query
          description: |
            Filter by crop season ID
            تصفية حسب معرف موسم المحصول
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: |
            Filter by incident status
            تصفية حسب حالة الحادثة
          schema:
            type: string
            enum: [DETECTED, MONITORING, TREATING, RESOLVED, RECURRING]
        - name: pestType
          in: query
          description: |
            Filter by pest type
            تصفية حسب نوع الآفة
          schema:
            $ref: '#/components/schemas/PestType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: |
            Successful response
            استجابة ناجحة
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PestIncident'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []

    post:
      tags: [Pests]
      summary: Report pest incident
      description: |
        Report a new pest incident.
        الإبلاغ عن حادثة آفة جديدة.
      operationId: reportPestIncident
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PestIncidentCreate'
            examples:
              aphids:
                summary: Aphid infestation (إصابة بالمن)
                value:
                  fieldId: 123e4567-e89b-12d3-a456-426614174000
                  tenantId: tenant-001
                  pestType: INSECT
                  pestName: Aphids
                  pestNameAr: المن
                  severityLevel: 3
                  affectedArea: 0.5
                  detectedAt: '2026-01-15T10:00:00Z'
                  reportedBy: Field Inspector
                  location:
                    lat: 24.6
                    lng: 46.7
                  notes: Found on wheat leaves
                  notesAr: وُجد على أوراق القمح
      responses:
        '201':
          description: |
            Pest incident reported successfully
            تم الإبلاغ عن حادثة الآفة بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PestIncident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []

  /pests/incidents/{id}:
    get:
      tags: [Pests]
      summary: Get pest incident
      description: |
        Get pest incident details with treatments.
        الحصول على تفاصيل حادثة الآفة مع العلاجات.
      operationId: getPestIncident
      parameters:
        - name: id
          in: path
          required: true
          description: |
            Pest incident ID
            معرف حادثة الآفة
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: |
            Successful response
            استجابة ناجحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PestIncident'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []

    put:
      tags: [Pests]
      summary: Update pest incident
      description: |
        Update pest incident details.
        تحديث تفاصيل حادثة الآفة.
      operationId: updatePestIncident
      parameters:
        - name: id
          in: path
          required: true
          description: |
            Pest incident ID
            معرف حادثة الآفة
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PestIncidentUpdate'
      responses:
        '200':
          description: |
            Pest incident updated successfully
            تم تحديث حادثة الآفة بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PestIncident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []

    delete:
      tags: [Pests]
      summary: Delete pest incident
      description: |
        Delete a pest incident.
        حذف حادثة الآفة.
      operationId: deletePestIncident
      parameters:
        - name: id
          in: path
          required: true
          description: |
            Pest incident ID
            معرف حادثة الآفة
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: |
            Pest incident deleted successfully
            تم حذف حادثة الآفة بنجاح
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []

  /pests/treatments:
    get:
      tags: [Pests]
      summary: List pest treatments
      description: |
        Get paginated list of pest treatments.
        الحصول على قائمة مُقسمة لعلاجات الآفات.
      operationId: listPestTreatments
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: incidentId
          in: query
          description: |
            Filter by incident ID
            تصفية حسب معرف الحادثة
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: |
            Successful response
            استجابة ناجحة
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PestTreatment'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []

    post:
      tags: [Pests]
      summary: Record pest treatment
      description: |
        Record a new pest treatment application.
        تسجيل تطبيق علاج آفة جديد.
      operationId: recordPestTreatment
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PestTreatmentCreate'
            examples:
              insecticide:
                summary: Insecticide application (تطبيق مبيد حشري)
                value:
                  incidentId: 123e4567-e89b-12d3-a456-426614174001
                  tenantId: tenant-001
                  treatmentDate: '2026-01-15T14:00:00Z'
                  method: Spray application
                  methodAr: الرش
                  productUsed: Neem Oil
                  productUsedAr: زيت النيم
                  quantity: 5
                  unit: liters
                  appliedBy: Farm Worker A
                  cost: 250.50
                  notes: Applied in early morning
                  notesAr: تم التطبيق في الصباح الباكر
      responses:
        '201':
          description: |
            Treatment recorded successfully
            تم تسجيل العلاج بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PestTreatment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: |
            Pest incident not found
            حادثة الآفة غير موجودة
      security:
        - bearerAuth: []

  # ============================================================================
  # GEOSPATIAL ENDPOINTS
  # نقاط الاستعلامات الجغرافية
  # ============================================================================
  /geo/fields/nearby:
    get:
      tags: [Geospatial]
      summary: Find nearby fields
      description: |
        Find fields within a specified radius of a location.
        البحث عن الحقول ضمن نطاق محدد من موقع معين.
      operationId: findNearbyFields
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: lat
          in: query
          required: true
          description: |
            Latitude
            خط العرض
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          description: |
            Longitude
            خط الطول
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: radius
          in: query
          description: |
            Search radius in kilometers
            نطاق البحث بالكيلومترات
          schema:
            type: number
            format: double
            default: 10
            minimum: 0.1
            maximum: 100
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: |
            Nearby fields found
            تم العثور على الحقول القريبة
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          $ref: '#/components/schemas/Field'
                        distance:
                          type: number
                          description: |
                            Distance in kilometers
                            المسافة بالكيلومترات
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
        - bearerAuth: []

  /geo/fields/within-bounds:
    get:
      tags: [Geospatial]
      summary: Find fields within bounding box
      description: |
        Find fields within a geographic bounding box.
        البحث عن الحقول ضمن منطقة جغرافية محددة.
      operationId: findFieldsWithinBounds
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: minLat
          in: query
          required: true
          description: |
            Minimum latitude (south)
            الحد الأدنى لخط العرض (جنوب)
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: minLng
          in: query
          required: true
          description: |
            Minimum longitude (west)
            الحد الأدنى لخط الطول (غرب)
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: maxLat
          in: query
          required: true
          description: |
            Maximum latitude (north)
            الحد الأقصى لخط العرض (شمال)
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: maxLng
          in: query
          required: true
          description: |
            Maximum longitude (east)
            الحد الأقصى لخط الطول (شرق)
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: |
            Fields within bounds found
            تم العثور على الحقول ضمن الحدود
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
        - bearerAuth: []

  # ============================================================================
  # HEALTH ENDPOINTS
  # نقاط فحص الصحة
  # ============================================================================
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      description: |
        Kubernetes liveness probe endpoint.
        نقطة فحص الحياة لكوبرنيتس.
      operationId: healthCheck
      responses:
        '200':
          description: |
            Service is alive
            الخدمة تعمل
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: field-management-service
                  version:
                    type: string
                    example: "16.0.0"
                  timestamp:
                    type: string
                    format: date-time
      security: []

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: |
        Kubernetes readiness probe endpoint.
        نقطة فحص الجاهزية لكوبرنيتس.
      operationId: readinessCheck
      responses:
        '200':
          description: |
            Service is ready
            الخدمة جاهزة
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        example: connected
                      cache:
                        type: string
                        example: connected
                      nats:
                        type: string
                        example: connected
        '503':
          description: |
            Service not ready
            الخدمة غير جاهزة
      security: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from authentication service
        رمز JWT من خدمة المصادقة

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      description: |
        Tenant identifier for multi-tenancy
        معرف المستأجر للتعدد
      schema:
        type: string
        format: uuid

    FieldId:
      name: fieldId
      in: path
      required: true
      description: |
        Field identifier
        معرف الحقل
      schema:
        type: string
        format: uuid

    Limit:
      name: limit
      in: query
      description: |
        Number of items to return
        عدد العناصر المُرجعة
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Offset:
      name: offset
      in: query
      description: |
        Number of items to skip
        عدد العناصر المُتخطاة
      schema:
        type: integer
        minimum: 0
        default: 0

    IfMatch:
      name: If-Match
      in: header
      description: |
        ETag for optimistic concurrency control
        ETag للتحكم بالتزامن المتفائل
      schema:
        type: string

  schemas:
    # ============================================================================
    # ENUMS - التعدادات
    # ============================================================================
    FieldStatus:
      type: string
      description: |
        Field status
        حالة الحقل
      enum:
        - active      # نشط - Field is actively cultivated
        - fallow      # بور - Field is left uncultivated
        - harvested   # محصود - Crop has been harvested
        - preparing   # قيد التحضير - Being prepared for planting
        - inactive    # غير نشط - Field is inactive/deleted

    IrrigationType:
      type: string
      description: |
        Irrigation system type
        نوع نظام الري
      enum:
        - drip        # تنقيط - Drip irrigation
        - sprinkler   # رشاش - Sprinkler irrigation
        - flood       # غمر - Flood irrigation
        - pivot       # محوري - Center pivot irrigation
        - none        # بدون ري - Rainfed/no irrigation

    SoilType:
      type: string
      description: |
        Soil type classification
        تصنيف نوع التربة
      enum:
        - sandy       # رملية - Sandy soil
        - loamy       # طميية - Loamy soil
        - clay        # طينية - Clay soil
        - sandy_loam  # رملية طميية - Sandy loam
        - clay_loam   # طينية طميية - Clay loam
        - silt        # طمي - Silt soil

    CropType:
      type: string
      description: |
        Crop type
        نوع المحصول
      enum:
        - wheat       # قمح
        - barley      # شعير
        - date_palm   # نخيل
        - tomato      # طماطم
        - cucumber    # خيار
        - potato      # بطاطس
        - onion       # بصل
        - mango       # مانجو
        - citrus      # حمضيات
        - alfalfa     # برسيم
        - corn        # ذرة
        - cotton      # قطن
        - watermelon  # بطيخ
        - grape       # عنب
        - olive       # زيتون
        - other       # أخرى

    ChangeSource:
      type: string
      description: |
        Source of the change
        مصدر التغيير
      enum:
        - mobile      # تطبيق الجوال - Mobile application
        - web         # الموقع الإلكتروني - Web application
        - api         # واجهة برمجة التطبيقات - Direct API call
        - system      # النظام - System/automated change

    PestType:
      type: string
      description: |
        Type of pest
        نوع الآفة
      enum:
        - INSECT      # حشرة
        - FUNGUS      # فطر
        - BACTERIA    # بكتيريا
        - VIRUS       # فيروس
        - WEED        # حشائش
        - RODENT      # قوارض
        - BIRD        # طيور
        - NEMATODE    # نيماتودا
        - OTHER       # أخرى

    # ============================================================================
    # FIELD SCHEMAS - مخططات الحقل
    # ============================================================================
    Field:
      type: object
      description: |
        Agricultural field entity
        كيان الحقل الزراعي
      properties:
        id:
          type: string
          format: uuid
          description: |
            Unique field identifier
            المعرف الفريد للحقل
        tenantId:
          type: string
          format: uuid
          description: |
            Tenant/organization identifier
            معرف المستأجر/المنظمة
        name:
          type: string
          maxLength: 100
          description: |
            Field name (supports Arabic)
            اسم الحقل (يدعم العربية)
          example: حقل القمح الشمالي
        cropType:
          $ref: '#/components/schemas/CropType'
        areaHectares:
          type: number
          format: double
          description: |
            Field area in hectares
            مساحة الحقل بالهكتار
          example: 8.5
        boundary:
          $ref: '#/components/schemas/GeoJSONPolygon'
        healthScore:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: |
            Overall field health score (0-100)
            درجة صحة الحقل الإجمالية (0-100)
          example: 85.5
        ndviValue:
          type: number
          format: double
          minimum: -1
          maximum: 1
          nullable: true
          description: |
            Current/latest NDVI value
            قيمة NDVI الحالية/الأخيرة
          example: 0.72
        status:
          $ref: '#/components/schemas/FieldStatus'
        irrigationType:
          $ref: '#/components/schemas/IrrigationType'
        soilType:
          $ref: '#/components/schemas/SoilType'
        plantingDate:
          type: string
          format: date
          nullable: true
          description: |
            Date of planting
            تاريخ الزراعة
        createdAt:
          type: string
          format: date-time
          description: |
            Creation timestamp
            تاريخ الإنشاء
        updatedAt:
          type: string
          format: date-time
          description: |
            Last update timestamp
            تاريخ آخر تحديث
        version:
          type: integer
          description: |
            Version number for optimistic concurrency
            رقم الإصدار للتحكم بالتزامن
      required:
        - id
        - tenantId
        - name
        - status

    CreateFieldDto:
      type: object
      description: |
        Data transfer object for creating a new field
        كائن نقل البيانات لإنشاء حقل جديد
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Field name (supports Arabic)
            اسم الحقل (يدعم العربية)
        cropType:
          $ref: '#/components/schemas/CropType'
        areaHectares:
          type: number
          format: double
          minimum: 0.01
          maximum: 10000
          description: |
            Field area in hectares (optional - calculated from boundary if not provided)
            مساحة الحقل بالهكتار (اختياري - يُحسب من الحدود إذا لم يُقدم)
        boundary:
          type: array
          description: |
            Polygon coordinates as array of [longitude, latitude] pairs
            إحداثيات المضلع كمصفوفة من أزواج [خط الطول، خط العرض]
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
          minItems: 4
          example:
            - [46.7, 24.6]
            - [46.8, 24.6]
            - [46.8, 24.7]
            - [46.7, 24.7]
            - [46.7, 24.6]
        irrigationType:
          $ref: '#/components/schemas/IrrigationType'
        soilType:
          $ref: '#/components/schemas/SoilType'
        plantingDate:
          type: string
          format: date
          description: |
            Date of planting
            تاريخ الزراعة
        metadata:
          type: object
          description: |
            Additional metadata
            بيانات وصفية إضافية
          additionalProperties: true
      required:
        - name
        - cropType
        - boundary

    UpdateFieldDto:
      type: object
      description: |
        Data transfer object for updating a field (partial update)
        كائن نقل البيانات لتحديث الحقل (تحديث جزئي)
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Field name (supports Arabic)
            اسم الحقل (يدعم العربية)
        cropType:
          $ref: '#/components/schemas/CropType'
        status:
          $ref: '#/components/schemas/FieldStatus'
        irrigationType:
          $ref: '#/components/schemas/IrrigationType'
        soilType:
          $ref: '#/components/schemas/SoilType'
        plantingDate:
          type: string
          format: date
          description: |
            Date of planting
            تاريخ الزراعة
        metadata:
          type: object
          description: |
            Additional metadata
            بيانات وصفية إضافية
          additionalProperties: true

    # ============================================================================
    # BOUNDARY SCHEMAS - مخططات الحدود
    # ============================================================================
    GeoJSONPolygon:
      type: object
      description: |
        GeoJSON Polygon geometry
        هندسة مضلع GeoJSON
      properties:
        type:
          type: string
          enum: [Polygon]
          description: GeoJSON geometry type
        coordinates:
          type: array
          description: |
            Array of linear rings (first is exterior, rest are holes)
            مصفوفة الحلقات الخطية (الأولى خارجية، والباقي ثقوب)
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
            minItems: 4
          example:
            - - [46.7, 24.6]
              - [46.8, 24.6]
              - [46.8, 24.7]
              - [46.7, 24.7]
              - [46.7, 24.6]
      required:
        - type
        - coordinates

    UpdateBoundaryDto:
      type: object
      description: |
        Data transfer object for updating field boundary
        كائن نقل البيانات لتحديث حدود الحقل
      properties:
        boundary:
          $ref: '#/components/schemas/GeoJSONPolygon'
        changeReason:
          type: string
          minLength: 10
          maxLength: 500
          description: |
            Reason for boundary change (required for audit trail)
            سبب تغيير الحدود (مطلوب للسجل المراجعي)
          example: "توسيع الحقل بعد شراء الأرض المجاورة - Field expansion after purchasing adjacent land"
        changeSource:
          $ref: '#/components/schemas/ChangeSource'
      required:
        - boundary
        - changeReason

    FieldBoundaryHistory:
      type: object
      description: |
        Field boundary change history record
        سجل تاريخ تغيير حدود الحقل
      properties:
        id:
          type: string
          format: uuid
          description: |
            History record identifier
            معرف سجل التاريخ
        fieldId:
          type: string
          format: uuid
          description: |
            Field identifier
            معرف الحقل
        previousBoundary:
          $ref: '#/components/schemas/GeoJSONPolygon'
        newBoundary:
          $ref: '#/components/schemas/GeoJSONPolygon'
        previousAreaHectares:
          type: number
          format: double
          description: |
            Previous area in hectares
            المساحة السابقة بالهكتار
        newAreaHectares:
          type: number
          format: double
          description: |
            New area in hectares
            المساحة الجديدة بالهكتار
        areaChangeHectares:
          type: number
          format: double
          description: |
            Change in area (positive = expansion, negative = reduction)
            التغيير في المساحة (موجب = توسيع، سالب = تقليص)
        areaChangePercent:
          type: number
          format: double
          description: |
            Percentage change in area
            نسبة التغيير في المساحة
        changedBy:
          type: string
          format: uuid
          description: |
            User ID who made the change
            معرف المستخدم الذي أجرى التغيير
        changedByName:
          type: string
          description: |
            Name of user who made the change
            اسم المستخدم الذي أجرى التغيير
        changeReason:
          type: string
          description: |
            Reason for the change
            سبب التغيير
        changeSource:
          $ref: '#/components/schemas/ChangeSource'
        changedAt:
          type: string
          format: date-time
          description: |
            Timestamp of the change
            وقت التغيير

    # ============================================================================
    # NDVI SCHEMAS - مخططات NDVI
    # ============================================================================
    NdviReading:
      type: object
      description: |
        NDVI (Normalized Difference Vegetation Index) reading
        قراءة مؤشر الغطاء النباتي NDVI
      properties:
        id:
          type: string
          format: uuid
          description: |
            Reading identifier
            معرف القراءة
        fieldId:
          type: string
          format: uuid
          description: |
            Field identifier
            معرف الحقل
        value:
          type: number
          format: double
          minimum: -1
          maximum: 1
          description: |
            NDVI value (-1 to 1, higher = healthier vegetation)
            قيمة NDVI (من -1 إلى 1، القيمة الأعلى = غطاء نباتي أكثر صحة)
        source:
          type: string
          description: |
            Data source (e.g., sentinel-2, landsat-8)
            مصدر البيانات (مثل sentinel-2، landsat-8)
        cloudCover:
          type: number
          format: double
          minimum: 0
          maximum: 100
          nullable: true
          description: |
            Cloud cover percentage at time of capture
            نسبة الغطاء السحابي وقت الالتقاط
        satelliteName:
          type: string
          nullable: true
          description: |
            Name of the satellite
            اسم القمر الصناعي
        bandInfo:
          type: object
          nullable: true
          description: |
            Band information used for NDVI calculation
            معلومات النطاقات المستخدمة لحساب NDVI
          properties:
            red:
              type: string
              description: Red band identifier
            nir:
              type: string
              description: NIR band identifier
            resolution:
              type: number
              description: Spatial resolution in meters
        recordedAt:
          type: string
          format: date-time
          description: |
            Timestamp of the reading
            وقت القراءة
        createdAt:
          type: string
          format: date-time
          description: |
            Creation timestamp
            تاريخ الإنشاء

    NdviReadingDto:
      type: object
      description: |
        Data transfer object for recording NDVI reading
        كائن نقل البيانات لتسجيل قراءة NDVI
      properties:
        value:
          type: number
          format: double
          minimum: -1
          maximum: 1
          description: |
            NDVI value (-1 to 1)
            قيمة NDVI (من -1 إلى 1)
        source:
          type: string
          maxLength: 50
          description: |
            Data source (sentinel-2, landsat-8, etc.)
            مصدر البيانات (sentinel-2، landsat-8، إلخ)
        cloudCover:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: |
            Cloud cover percentage
            نسبة الغطاء السحابي
        satelliteName:
          type: string
          maxLength: 100
          description: |
            Name of the satellite
            اسم القمر الصناعي
        bandInfo:
          type: object
          description: |
            Band information used for calculation
            معلومات النطاقات المستخدمة للحساب
          properties:
            red:
              type: string
              description: Red band identifier
            nir:
              type: string
              description: NIR band identifier
            resolution:
              type: number
              description: Spatial resolution in meters
        recordedAt:
          type: string
          format: date-time
          description: |
            Timestamp when reading was taken (defaults to now)
            الوقت الذي أُخذت فيه القراءة (الافتراضي: الآن)
      required:
        - value
        - source

    # ============================================================================
    # PEST SCHEMAS - مخططات الآفات
    # ============================================================================
    PestIncident:
      type: object
      description: |
        Pest incident record
        سجل حادثة آفة
      properties:
        id:
          type: string
          format: uuid
        fieldId:
          type: string
