          type: integer
          description: |
            Items per page
            عناصر لكل صفحة
        offset:
          type: integer
          description: |
            Current offset
            الإزاحة الحالية
        hasMore:
          type: boolean
          description: |
            Whether more items are available
            هل توجد عناصر أخرى

    Error:
      type: object
      description: |
        Error response structure
        هيكل استجابة الخطأ
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: |
            Error message in English
            رسالة الخطأ بالإنجليزية
        error_ar:
          type: string
          description: |
            Error message in Arabic
            رسالة الخطأ بالعربية
        code:
          type: string
          description: |
            Error code for programmatic handling
            رمز الخطأ للمعالجة البرمجية
        details:
          type: array
          description: |
            Field-level validation errors
            أخطاء التحقق على مستوى الحقل
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              message_ar:
                type: string
              code:
                type: string

  responses:
    Unauthorized:
      description: |
        Authentication required
        المصادقة مطلوبة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Unauthorized - Valid authentication token required
            error_ar: غير مصرح - يلزم رمز مصادقة صالح
            code: AUTH_REQUIRED

    NotFound:
      description: |
        Resource not found
        المورد غير موجود
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Field not found
            error_ar: الحقل غير موجود
            code: FIELD_NOT_FOUND

    ValidationError:
      description: |
        Validation error
        خطأ في التحقق
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Validation failed
            error_ar: فشل التحقق من البيانات
            code: VALIDATION_ERROR
            details:
              - field: name
                message: Required field is missing
                message_ar: الحقل المطلوب مفقود
                code: required
              - field: boundary
                message: Polygon must have at least 4 points
                message_ar: يجب أن يحتوي المضلع على 4 نقاط على الأقل
                code: min_points

    Conflict:
      description: |
        Conflict - resource already exists or version mismatch
        تعارض - المورد موجود بالفعل أو عدم تطابق الإصدار
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: A field with this name already exists
            error_ar: يوجد حقل بهذا الاسم بالفعل
            code: DUPLICATE_FIELD

    PreconditionFailed:
      description: |
        ETag mismatch - resource was modified
        عدم تطابق ETag - تم تعديل المورد
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Resource was modified by another request
            error_ar: تم تعديل المورد بواسطة طلب آخر
            code: CONCURRENT_MODIFICATION

    RateLimitExceeded:
      description: |
        Rate limit exceeded
        تم تجاوز حد الطلبات
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: |
            Request limit per minute
            حد الطلبات في الدقيقة
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: |
            Remaining requests
            الطلبات المتبقية
        X-RateLimit-Reset:
          schema:
            type: integer
          description: |
            Unix timestamp when limit resets
            الطابع الزمني لإعادة تعيين الحد
        Retry-After:
          schema:
            type: integer
          description: |
            Seconds to wait before retry
            الثواني قبل إعادة المحاولة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Rate limit exceeded - please wait before retrying
            error_ar: تم تجاوز حد الطلبات - يرجى الانتظار قبل إعادة المحاولة
            code: RATE_LIMIT_EXCEEDED

    BadRequest:
      description: |
        Bad request - Invalid input
        طلب غير صالح - إدخال غير صالح
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Bad request - Invalid input provided
            error_ar: طلب غير صالح - الإدخال المقدم غير صالح
            code: BAD_REQUEST

