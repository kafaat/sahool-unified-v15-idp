      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Field'
        message:
          type: string
          description: |
            Success message in English
            رسالة النجاح بالإنجليزية
        message_ar:
          type: string
          description: |
            Success message in Arabic
            رسالة النجاح بالعربية

    FieldListResponse:
      type: object
      description: |
        Paginated field list response
        استجابة قائمة الحقول المُقسمة
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        pagination:
          $ref: '#/components/schemas/Pagination'

    BoundaryUpdateResponse:
      type: object
      description: |
