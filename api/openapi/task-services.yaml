    # ========== Common Schemas ==========
    Pagination:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
        version:
          type: string
          example: "16.0.0"
        uptime:
          type: integer
          description: Uptime in seconds

    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        database:
          type: boolean
        nats:
          type: boolean
        redis:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        errorAr:
          type: string
          description: Arabic error message - رسالة الخطأ بالعربية
        code:
          type: string
          description: Error code for client handling
        details:
          type: object
          additionalProperties: true

  responses:
    Unauthorized:
      description: Authentication required or token invalid - المصادقة مطلوبة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Unauthorized
            errorAr: غير مصرح
            code: UNAUTHORIZED

    Forbidden:
      description: Insufficient permissions - صلاحيات غير كافية
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Forbidden
            errorAr: ممنوع
            code: FORBIDDEN

    NotFound:
      description: Resource not found - المورد غير موجود
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Resource not found
            errorAr: المورد غير موجود
            code: NOT_FOUND

    ValidationError:
      description: Invalid request parameters - معلمات الطلب غير صالحة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Validation failed
            errorAr: فشل التحقق من البيانات
            code: VALIDATION_ERROR
            details:
              title: "Title is required"

    TooManyRequests:
      description: Rate limit exceeded - تم تجاوز حد الطلبات
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Rate limit exceeded
            errorAr: تم تجاوز حد الطلبات
            code: RATE_LIMIT_EXCEEDED
      headers:
        X-RateLimit-Limit-Minute:
          schema:
            type: integer
          description: Request limit per minute
        X-RateLimit-Remaining-Minute:
          schema:
            type: integer
          description: Remaining requests this minute
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retry

security:
  - bearerAuth: []
