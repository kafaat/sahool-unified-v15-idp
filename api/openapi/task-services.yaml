        sku:
          type: string
          maxLength: 50
          description: Stock Keeping Unit - رمز المنتج
        category:
          $ref: '#/components/schemas/ItemCategory'
        description:
          type: string
          maxLength: 2000
        descriptionAr:
          type: string
          maxLength: 2000
        unit:
          type: string
          maxLength: 20
          description: Unit of measurement - وحدة القياس
        quantity:
          type: number
          description: Current quantity - الكمية الحالية
        minimumQuantity:
          type: number
          description: Minimum stock level - الحد الأدنى للمخزون
        maximumQuantity:
          type: number
          description: Maximum stock level - الحد الأقصى للمخزون
        unitCost:
          type: number
          format: double
          description: Cost per unit - التكلفة لكل وحدة
        totalValue:
          type: number
          format: double
          description: Total inventory value - القيمة الإجمالية للمخزون
        currency:
          type: string
          default: SAR
          maxLength: 3
        location:
          type: string
          maxLength: 200
          description: Storage location - موقع التخزين
        locationAr:
          type: string
          maxLength: 200
        expiryDate:
          type: string
          format: date
          description: Expiry date if applicable - تاريخ الانتهاء
        supplier:
          type: string
          maxLength: 200
        supplierAr:
          type: string
          maxLength: 200
        attributes:
          type: object
          additionalProperties: true
          description: Additional item attributes - خصائص إضافية
        lowStockAlert:
          type: boolean
          description: Whether item is below minimum - تنبيه المخزون المنخفض
        images:
          type: array
          items:
            type: string
            format: uri
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InventoryItemCreate:
      type: object
