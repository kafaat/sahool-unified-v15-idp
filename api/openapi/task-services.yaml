      properties:
        adjustmentType:
          type: string
          enum: [in, out, adjustment]
          description: |
            Type of adjustment:
            - in: Add stock - إضافة
            - out: Remove stock - سحب
            - adjustment: Correction - تعديل
        quantity:
          type: number
          description: Quantity to adjust (positive for in, negative for adjustment)
        reason:
          type: string
          maxLength: 500
        reasonAr:
          type: string
          maxLength: 500
        reference:
          type: string
          maxLength: 100
          description: Reference number (PO, invoice, etc.)
        fieldId:
          type: string
          format: uuid
          description: Associated field if applicable
        taskId:
          type: string
          format: uuid
          description: Associated task if applicable
        unitCost:
          type: number
          description: Cost per unit for this adjustment

    InventoryTransaction:
      type: object
      required:
        - type
        - items
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        reference:
