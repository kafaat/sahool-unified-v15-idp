          type: string

    MaintenanceRecord:
      type: object
      required:
        - type
        - description
        - performedBy
        - performedAt
      properties:
        type:
          type: string
          enum:
            - preventive
            - corrective
            - inspection
            - calibration
          description: |
            Type of maintenance:
            - preventive: Regular scheduled maintenance - صيانة وقائية
            - corrective: Repair due to failure - صيانة تصحيحية
            - inspection: Routine inspection - فحص دوري
            - calibration: Equipment calibration - معايرة
        description:
          type: string
          maxLength: 2000
        descriptionAr:
          type: string
          maxLength: 2000
        performedBy:
          type: string
          maxLength: 200
          description: Person/company who performed maintenance
        performedAt:
          type: string
          format: date-time
        cost:
          type: number
          format: double
        currency:
          type: string
          default: SAR
          maxLength: 3
        partsUsed:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              nameAr:
                type: string
              quantity:
                type: number
              unit:
                type: string
              cost:
                type: number
        laborHours:
          type: number
        conditionBefore:
          $ref: '#/components/schemas/EquipmentCondition'
        conditionAfter:
          $ref: '#/components/schemas/EquipmentCondition'
        nextMaintenanceDate:
          type: string
          format: date
        nextMaintenanceHours:
          type: integer
          description: Hours until next maintenance
        attachments:
          type: array
          items:
            type: string
            format: uri
        notes:
          type: string
        notesAr:
          type: string

    MaintenanceResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          allOf:
            - $ref: '#/components/schemas/MaintenanceRecord'
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                equipmentId:
                  type: string
                  format: uuid
                createdAt:
                  type: string
                  format: date-time
        message:
          type: string
        messageAr:
          type: string

    EquipmentAssignment:
