          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/InventoryItem'
              - type: object
                properties:
                  stockLevel:
                    type: string
                    enum: [low, critical]
                    description: |
                      Stock level severity:
                      - low: Below minimum - منخفض
                      - critical: Below 25% of minimum - حرج
                  percentageOfMinimum:
                    type: number
                    description: Percentage of minimum quantity
        pagination:
          $ref: '#/components/schemas/Pagination'
        summary:
          type: object
          properties:
            lowStockCount:
              type: integer
            criticalCount:
