          items:
            $ref: '#/components/schemas/TransactionRecord'
        pagination:
          $ref: '#/components/schemas/Pagination'
        summary:
          type: object
          properties:
            totalTransactions:
              type: integer
            totalInValue:
              type: number
            totalOutValue:
              type: number
            byType:
              type: object
              additionalProperties:
