          type: string
        supplierAr:
          type: string
        attributes:
          type: object
          additionalProperties: true
        images:
          type: array
          items:
            type: string
            format: uri

    InventoryItemUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        nameAr:
          type: string
          maxLength: 200
        sku:
          type: string
          maxLength: 50
