        minimumQuantity:
          type: number
          minimum: 0
        maximumQuantity:
          type: number
          minimum: 0
        unitCost:
          type: number
          minimum: 0
        currency:
          type: string
          default: SAR
        location:
          type: string
          maxLength: 200
        locationAr:
          type: string
          maxLength: 200
        expiryDate:
          type: string
          format: date
