openapi: 3.0.3
info:
  title: SAHOOL Weather Services API
  description: |
    Weather and Climate Services API for the SAHOOL Agricultural Platform
    واجهة برمجة تطبيقات خدمات الطقس والمناخ لمنصة سهول الزراعية

    This API provides comprehensive weather data, forecasting, and agricultural
    weather assessments for informed farming decisions.

    توفر هذه الواجهة البرمجية بيانات شاملة عن الطقس، والتنبؤات، وتقييمات
    الطقس الزراعية لاتخاذ قرارات زراعية مستنيرة.

    ## Features | الميزات

    - Real-time current weather data | بيانات الطقس الحالية في الوقت الفعلي
    - Multi-day weather forecasts (up to 16 days) | توقعات الطقس لعدة أيام (حتى 16 يومًا)
    - Evapotranspiration (ET0) calculation using FAO-56 Penman-Monteith | حساب التبخر النتح باستخدام طريقة بنمان مونتيث
    - Growing Degree Days (GDD) calculation | حساب درجات يوم النمو
    - Spray window assessment | تقييم نافذة الرش
    - Frost risk assessment | تقييم خطر الصقيع
    - Heat stress index calculation | حساب مؤشر الإجهاد الحراري
    - Chill hours calculation for fruit trees | حساب ساعات التبريد لأشجار الفاكهة
    - Drought stress index | مؤشر الإجهاد الجفافي
    - Comprehensive agricultural weather reports | تقارير الطقس الزراعية الشاملة
    - Weather alerts and notifications | تنبيهات الطقس والإشعارات
    - Multi-provider support (Open-Meteo, OpenWeatherMap, WeatherAPI) | دعم متعدد المزودين

    ## Services | الخدمات

    - **weather-service**: Primary weather service (port 8092) | خدمة الطقس الأساسية
    - **weather-core**: Core weather processing (port 8108) | معالجة الطقس الأساسية

    Arabic Support: جميع واجهات API تدعم اللغة العربية
  version: 16.0.0
  contact:
    name: SAHOOL Platform Support
    email: support@sahool.sa
  license:
    name: Proprietary

servers:
  - url: https://api.sahool.sa/api/v1
    description: Production server | خادم الإنتاج
  - url: https://staging-api.sahool.sa/api/v1
    description: Staging server | خادم التجربة
  - url: http://localhost:8092
    description: Local weather-service development | خدمة الطقس المحلية
  - url: http://localhost:8108
    description: Local weather-core development | معالجة الطقس المحلية

tags:
  - name: Current Weather
    description: |
      Real-time weather data retrieval
      جلب بيانات الطقس في الوقت الفعلي
  - name: Forecasts
    description: |
      Weather forecast endpoints
      نقاط نهاية توقعات الطقس
  - name: Agricultural Assessments
    description: |
      Weather-based agricultural recommendations and risk assessments
      التوصيات الزراعية القائمة على الطقس وتقييمات المخاطر
  - name: Evapotranspiration
    description: |
      Evapotranspiration calculations for irrigation planning
      حسابات التبخر النتح للتخطيط للري
  - name: Crop Metrics
    description: |
      Growing Degree Days and crop-related weather metrics
      درجات يوم النمو ومقاييس الطقس المتعلقة بالمحاصيل
  - name: Risk Assessment
    description: |
      Weather-related risk assessments (frost, heat stress, drought)
      تقييمات المخاطر المتعلقة بالطقس (الصقيع، الإجهاد الحراري، الجفاف)
  - name: Spray Operations
    description: |
      Spray window and application suitability assessments
      تقييمات نافذة الرش وملاءمة التطبيق
  - name: Reports
    description: |
      Comprehensive agricultural weather reports
      تقارير الطقس الزراعية الشاملة
  - name: Historical Data
    description: |
      Historical weather data access
      الوصول إلى البيانات التاريخية للطقس
  - name: Alerts
    description: |
      Weather alerts and warnings
      تنبيهات وتحذيرات الطقس
  - name: Providers
    description: |
      Weather data provider management
      إدارة مزودي بيانات الطقس

security:
  - BearerAuth: []

paths:
  /weather/assess:
    post:
      tags:
        - Agricultural Assessments
      summary: Assess weather conditions | تقييم الظروف الجوية
      description: |
        Assess weather conditions and generate agricultural alerts based on manual input.
        تقييم الظروف الجوية وإنشاء تنبيهات زراعية بناءً على المدخلات اليدوية.

        This endpoint allows manual weather data input for assessment when sensor
        data is unavailable or for scenario planning.

        تسمح نقطة النهاية هذه بإدخال بيانات الطقس يدويًا للتقييم عندما تكون بيانات
        المستشعرات غير متاحة أو للتخطيط للسيناريوهات.
      operationId: assessWeather
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeatherAssessRequest'
            example:
              tenant_id: "tenant-001"
              field_id: "field-001"
              temp_c: 38
              humidity_pct: 25
              wind_speed_kmh: 30
              precipitation_mm: 0
              uv_index: 10
      responses:
        '200':
          description: Assessment completed successfully | اكتمل التقييم بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherAssessResponse'
              examples:
                highTemperature:
                  summary: High temperature alert | تنبيه درجة حرارة مرتفعة
                  value:
                    field_id: "field-001"
                    alerts:
                      - alert_type: "EXTREME_HEAT"
                        severity: "critical"
                        title_en: "Extreme Heat Warning"
                        title_ar: "تحذير من الحرارة الشديدة"
                        window_hours: 12
                      - alert_type: "HIGH_WIND"
                        severity: "warning"
                        title_en: "High Wind Alert"
                        title_ar: "تنبيه الرياح القوية"
                        window_hours: 6
                    alert_count: 2
                    event_ids: ["event-001", "event-002"]
                    published: true
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /weather/current:
    post:
      tags:
        - Current Weather
      summary: Get current weather by location | الحصول على الطقس الحالي حسب الموقع
      description: |
        Retrieve current weather conditions for a specific location.
        الحصول على بيانات الطقس الحالية لموقع محدد.

        Uses multi-provider service with automatic fallback:
        يستخدم خدمة متعددة المزودين مع التراجع التلقائي:

        - Open-Meteo (free, no API key required) | مفتوح، لا يتطلب مفتاح API
        - OpenWeatherMap (if OPENWEATHERMAP_API_KEY configured) | إذا تم تكوين مفتاح API
        - WeatherAPI (if WEATHERAPI_KEY configured) | إذا تم تكوين مفتاح API
      operationId: getCurrentWeather
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
            example:
              tenant_id: "tenant-001"
              field_id: "field-001"
              lat: 24.7136
              lon: 46.6753
      responses:
        '200':
          description: Current weather retrieved successfully | تم جلب الطقس الحالي بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentWeatherResponse'
              examples:
                success:
                  summary: Successful response | استجابة ناجحة
                  value:
                    field_id: "field-001"
                    location:
                      lat: 24.7136
                      lon: 46.6753
                    provider: "Open-Meteo"
                    current:
                      temperature_c: 32.5
                      humidity_pct: 35
                      wind_speed_kmh: 15.3
                      wind_direction_deg: 180
                      wind_direction: "S"
                      precipitation_mm: 0
                      cloud_cover_pct: 20
                      pressure_hpa: 1013
                      uv_index: 8.5
                      condition: "Partly Cloudy"
                      condition_ar: "غائم جزئياً"
                      timestamp: "2024-01-15T10:30:00Z"
                    alerts:
                      - alert_type: "HIGH_TEMPERATURE"
                        severity: "warning"
                        title_en: "High Temperature Alert"
                        title_ar: "تنبيه ارتفاع درجة الحرارة"
                        window_hours: 6
                    event_ids: ["event-001"]
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /weather/forecast:
    post:
      tags:
        - Forecasts
      summary: Get weather forecast (1-16 days) | الحصول على توقعات الطقس (1-16 يوم)
      description: |
        Retrieve multi-day weather forecast for a specific location.
        الحصول على توقعات الطقس لعدة أيام لموقع محدد.

        Supports forecasts from 1 to 16 days ahead.
        يدعم التنبؤات من يوم واحد إلى 16 يومًا مقدمًا.
      operationId: getWeatherForecast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForecastRequest'
            example:
              tenant_id: "tenant-001"
              field_id: "field-001"
              lat: 24.7136
              lon: 46.6753
              days: 7
      responses:
        '200':
          description: Forecast retrieved successfully | تم جلب التوقعات بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'
              examples:
                success:
                  summary: 7-day forecast | توقعات 7 أيام
                  value:
                    field_id: "field-001"
                    location:
                      lat: 24.7136
                      lon: 46.6753
                    provider: "Open-Meteo"
                    forecast:
                      - date: "2024-01-15"
                        temp_max_c: 35
                        temp_min_c: 22
                        precipitation_mm: 0
                        precipitation_probability_pct: 5
                        wind_speed_max_kmh: 25
                        uv_index_max: 9
                        condition: "Sunny"
                        condition_ar: "مشمس"
                        sunrise: "06:45"
                        sunset: "17:30"
                      - date: "2024-01-16"
                        temp_max_c: 33
                        temp_min_c: 21
                        precipitation_mm: 0
                        precipitation_probability_pct: 10
                        wind_speed_max_kmh: 20
                        uv_index_max: 8
                        condition: "Partly Cloudy"
                        condition_ar: "غائم جزئياً"
                        sunrise: "06:45"
                        sunset: "17:31"
                    days: 7
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /weather/evapotranspiration:
    post:
      tags:
        - Evapotranspiration
      summary: Calculate ET0 (FAO-56 Penman-Monteith) | حساب التبخر النتح المرجعي
      description: |
        Calculate reference evapotranspiration (ET0) using the FAO-56 Penman-Monteith equation.
        حساب التبخر النتح المرجعي باستخدام معادلة بنمان مونتيث FAO-56.

        This is the standard method for calculating crop water requirements.
        هذه هي الطريقة القياسية لحساب احتياجات المياه للمحاصيل.

        ## Formula | المعادلة
        The FAO-56 Penman-Monteith equation considers:
        تأخذ معادلة FAO-56 بنمان مونتيث في الاعتبار:

        - Temperature (°C) | درجة الحرارة
        - Relative humidity (%) | الرطوبة النسبية
        - Wind speed (km/h) | سرعة الرياح
        - Solar radiation (MJ/m²/day) | الإشعاع الشمسي
      operationId: calculateEvapotranspiration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ETRequest'
            example:
              tenant_id: "tenant-001"
              field_id: "field-001"
              temp_c: 28.5
              humidity_pct: 45
              wind_speed_kmh: 12
              solar_radiation_mj: 22.5
      responses:
        '200':
          description: ET0 calculated successfully | تم حساب التبخر النتح بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ETResponse'
              examples:
                success:
                  summary: ET0 calculation result | نتيجة حساب التبخر النتح
                  value:
                    field_id: "field-001"
                    et0_mm_day: 5.8
                    method: "FAO-56 Penman-Monteith"
                    method_ar: "بنمان مونتيث FAO-56"
                    input_data:
                      temp_c: 28.5
                      humidity_pct: 45
                      wind_speed_kmh: 12
                      solar_radiation_mj: 22.5
                    recommendation_en: "High evapotranspiration rate. Consider increasing irrigation."
                    recommendation_ar: "معدل تبخر نتح عالي. يُنصح بزيادة الري."
                    timestamp: "2024-01-15T10:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /weather/gdd:
    post:
      tags:
        - Crop Metrics
      summary: Calculate Growing Degree Days | حساب درجات يوم النمو
      description: |
        Calculate Growing Degree Days (GDD) for crop development tracking.
        حساب درجات يوم النمو لتتبع تطور المحاصيل.

        GDD is a measure of heat accumulation used to predict crop development stages.
        درجات يوم النمو هي مقياس لتراكم الحرارة يُستخدم للتنبؤ بمراحل نمو المحاصيل.

        ## Formula | المعادلة
        GDD = ((Tmax + Tmin) / 2) - Tbase

        Where temperatures below base are set to base, and above upper threshold are capped.
        حيث تُعيَّن درجات الحرارة الأقل من القاعدة إلى القاعدة، والأعلى من الحد الأعلى تُحدد عنده.
      operationId: calculateGDD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GDDRequest'
            example:
              tenant_id: "tenant-001"
              field_id: "field-001"
              temp_max_c: 32
              temp_min_c: 18
              base_temp_c: 10
              upper_temp_c: 30
      responses:
        '200':
          description: GDD calculated successfully | تم حساب درجات يوم النمو بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GDDResponse'
              examples:
                success:
                  summary: GDD calculation result | نتيجة حساب درجات يوم النمو
                  value:
                    field_id: "field-001"
                    gdd: 15.0
                    gdd_unit: "degree-days"
                    gdd_unit_ar: "درجة-يوم"
                    input_data:
                      temp_max_c: 32
                      temp_min_c: 18
                      base_temp_c: 10
                      upper_temp_c: 30
                    effective_temp_max_c: 30
                    effective_temp_min_c: 18
                    notes_en: "Upper temperature cap applied (32°C → 30°C)"
                    notes_ar: "تم تطبيق الحد الأعلى لدرجة الحرارة (32° → 30°)"
                    timestamp: "2024-01-15T10:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /weather/spray-window:
    post:
      tags:
        - Spray Operations
      summary: Assess spray application suitability | تقييم ملاءمة تطبيق الرش
      description: |
        Assess weather conditions for pesticide/fertilizer spray application.
        تقييم الظروف الجوية لتطبيق رش المبيدات/الأسمدة.

        Evaluates wind speed, humidity, temperature, and precipitation risk.
        يُقيِّم سرعة الرياح والرطوبة ودرجة الحرارة وخطر هطول الأمطار.

        ## Optimal Conditions | الظروف المثلى
        - Wind speed: 3-15 km/h | سرعة الرياح: 3-15 كم/س
        - Humidity: 40-90% | الرطوبة: 40-90%
        - Temperature: 10-30°C | درجة الحرارة: 10-30°م
        - No precipitation expected | عدم توقع هطول أمطار
      operationId: assessSprayWindow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SprayWindowRequest'
            example:
              tenant_id: "tenant-001"
              field_id: "field-001"
              temp_c: 22
              humidity_pct: 65
              wind_speed_kmh: 8
              precipitation_probability: 5
      responses:
        '200':
          description: Spray window assessed successfully | تم تقييم نافذة الرش بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprayWindowResponse'
              examples:
                suitable:
                  summary: Suitable spray conditions | ظروف رش مناسبة
                  value:
                    field_id: "field-001"
                    suitable: true
                    suitability_score: 92
                    recommendation_en: "Excellent conditions for spray application"
                    recommendation_ar: "ظروف ممتازة لتطبيق الرش"
                    factors:
                      - factor: "wind_speed"
                        factor_ar: "سرعة الرياح"
                        status: "optimal"
                        status_ar: "مثالي"
                        value: 8
                        unit: "km/h"
                      - factor: "humidity"
                        factor_ar: "الرطوبة"
                        status: "optimal"
                        status_ar: "مثالي"
                        value: 65
                        unit: "%"
                      - factor: "temperature"
                        factor_ar: "درجة الحرارة"
                        status: "optimal"
                        status_ar: "مثالي"
                        value: 22
                        unit: "°C"
                      - factor: "precipitation_risk"
                        factor_ar: "خطر الهطول"
                        status: "low"
                        status_ar: "منخفض"
                        value: 5
                        unit: "%"
                    optimal_window_hours: 6
                    timestamp: "2024-01-15T06:00:00Z"
                unsuitable:
                  summary: Unsuitable spray conditions | ظروف رش غير مناسبة
                  value:
                    field_id: "field-001"
                    suitable: false
                    suitability_score: 35
                    recommendation_en: "Avoid spraying due to high wind speed"
                    recommendation_ar: "تجنب الرش بسبب سرعة الرياح العالية"
                    factors:
                      - factor: "wind_speed"
                        factor_ar: "سرعة الرياح"
                        status: "critical"
                        status_ar: "حرج"
                        value: 28
                        unit: "km/h"
                    optimal_window_hours: 0
                    timestamp: "2024-01-15T14:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /weather/frost-risk:
    post:
      tags:
        - Risk Assessment
      summary: Assess frost risk | تقييم خطر الصقيع
      description: |
        Assess frost risk based on temperature, humidity, wind, and cloud cover.
        تقييم خطر الصقيع بناءً على درجة الحرارة والرطوبة والرياح والغطاء السحابي.

        ## Risk Factors | عوامل الخطر
        - Low temperature near or below freezing | درجة حرارة منخفضة قريبة من التجمد أو أقل
        - Clear skies (radiative cooling) | سماء صافية (تبريد إشعاعي)
        - Low wind speed (calm conditions) | سرعة رياح منخفضة (ظروف هادئة)
        - High humidity with low dew point | رطوبة عالية مع نقطة ندى منخفضة
      operationId: assessFrostRisk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrostRiskRequest'
            example:
              tenant_id: "tenant-001"
              field_id: "field-001"
              temp_c: 3
              humidity_pct: 85
              wind_speed_kmh: 5
              cloud_cover_pct: 10
              dew_point_c: 1
      responses:
        '200':
          description: Frost risk assessed successfully | تم تقييم خطر الصقيع بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrostRiskResponse'
              examples:
                highRisk:
                  summary: High frost risk | خطر صقيع مرتفع
                  value:
                    field_id: "field-001"
                    frost_risk_level: "high"
                    frost_risk_level_ar: "مرتفع"
                    frost_probability_pct: 85
                    minimum_expected_temp_c: -2
                    frost_type: "radiation"
                    frost_type_ar: "صقيع إشعاعي"
                    recommendation_en: "High frost risk tonight. Protect sensitive crops with covers or irrigation."
                    recommendation_ar: "خطر صقيع مرتفع الليلة. احمِ المحاصيل الحساسة بالأغطية أو الري."
                    protective_measures:
                      - measure_en: "Apply protective irrigation before sunset"
                        measure_ar: "قم بالري الوقائي قبل غروب الشمس"
                      - measure_en: "Cover sensitive plants with frost cloth"
                        measure_ar: "غطِّ النباتات الحساسة بقماش الصقيع"
                    window_hours: 8
                    timestamp: "2024-01-15T18:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /weather/heat-stress:
    post:
      tags:
        - Risk Assessment
      summary: Calculate heat stress index | حساب مؤشر الإجهاد الحراري
      description: |
        Calculate comprehensive heat stress index for crops and livestock.
        حساب مؤشر الإجهاد الحراري الشامل للمحاصيل والماشية.

        Considers temperature, humidity, solar radiation, and wind speed.
        يأخذ في الاعتبار درجة الحرارة والرطوبة والإشعاع الشمسي وسرعة الرياح.

        ## Heat Stress Categories | فئات الإجهاد الحراري
        - None (THI < 72) | لا يوجد
        - Mild (THI 72-79) | خفيف
        - Moderate (THI 80-89) | معتدل
        - Severe (THI 90-99) | شديد
        - Critical (THI ≥ 100) | حرج
      operationId: calculateHeatStress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeatStressRequest'
            example:
              tenant_id: "tenant-001"
              field_id: "field-001"
              temp_c: 38
              humidity_pct: 60
              solar_radiation_mj: 28
              wind_speed_kmh: 5
      responses:
        '200':
          description: Heat stress calculated successfully | تم حساب الإجهاد الحراري بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatStressCalculatedResponse'
              examples:
                severeHeat:
                  summary: Severe heat stress | إجهاد حراري شديد
                  value:
                    field_id: "field-001"
                    temperature_humidity_index: 92
                    heat_stress_level: "severe"
                    heat_stress_level_ar: "شديد"
                    apparent_temperature_c: 45
                    crop_impact:
                      severity: "high"
