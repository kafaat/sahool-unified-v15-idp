      summary: Calculate chill hours for fruit trees | حساب ساعات التبريد لأشجار الفاكهة
      description: |
        Calculate accumulated chill hours for fruit tree dormancy requirements.
        حساب ساعات التبريد المتراكمة لمتطلبات سكون أشجار الفاكهة.

        ## Chill Hour Models | نماذج ساعات التبريد
        - **Utah Model**: Standard chill unit calculation | نموذج يوتا القياسي
        - **Positive Utah Model**: Modified for mild winters | معدل للشتاء المعتدل
        - **Dynamic Model**: Most accurate for warm regions | الأكثر دقة للمناطق الدافئة

        ## Common Requirements | المتطلبات الشائعة
        - Apples: 800-1200 hours | التفاح
        - Peaches: 600-900 hours | الخوخ
        - Almonds: 300-600 hours | اللوز
        - Figs: 100-300 hours | التين
      operationId: calculateChillHours
