components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication token | رمز مصادقة JWT

  schemas:
    # Request Schemas
    WeatherAssessRequest:
      type: object
      description: |
        Request for weather condition assessment
        طلب تقييم الظروف الجوية
      required:
        - tenant_id
        - field_id
        - temp_c
      properties:
        tenant_id:
          type: string
          description: Tenant identifier | معرف المستأجر
          example: "tenant-001"
        field_id:
          type: string
          description: Field identifier | معرف الحقل
          example: "field-001"
        temp_c:
          type: number
          format: float
          description: Temperature in Celsius | درجة الحرارة بالدرجة المئوية
          example: 38
        humidity_pct:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Humidity percentage | نسبة الرطوبة
          example: 25
        wind_speed_kmh:
          type: number
