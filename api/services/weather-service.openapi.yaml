openapi: 3.1.0
info:
  title: SAHOOL Weather Service API
  version: "4.12.0"
  description: "Bilingual EN+AR — Weather data, forecasts, alerts, and agricultural calendars for SAHOOL fields and locations. Sourced from Sentinel Hub + OpenWeather + local stations."
  contact:
    name: "SAHOOL Developer Relations"
    email: developer@sahool.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://sahool.com/legal/terms
  x-service-name: weather-service
  x-service-port: 8092
  x-contract-version: "4.12.0"

servers:
  - url: https://api.sahool.com
    description: Production
  - url: https://sandbox.sahool.app
    description: Sandbox
  - url: "http://localhost:8000"
    description: Local (via Kong gateway)

tags:
  - name: Weather
    description: "Weather data, forecasts, alerts, and agricultural calendars"
  - name: Health
    description: Liveness and readiness probes

security:
  - bearerAuth: []

x-rateLimit:
  perMinute: 120
  perHour: 5000
  scope: per-ip
  notes: "Read-heavy weather tier; see docs/API_GATEWAY.md for tier overrides"

paths:
  /api/v1/weather/current:
    get:
      operationId: getCurrentWeatherByCoords
      summary: Get current weather by coordinates
      description: "Returns current weather conditions for a latitude/longitude pair."
      tags: [Weather]
      parameters:
        - { in: query, name: lat, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 }, description: Latitude in decimal degrees }
        - { in: query, name: lng, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 }, description: Longitude in decimal degrees }
      responses:
        "200":
          description: Current weather snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherCurrentResponse" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "429": { description: Rate limit exceeded, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/v1/weather/current/{locationId}:
    get:
      operationId: getCurrentWeatherByLocation
      summary: Get current weather by saved location
      description: "Returns current weather for a previously saved SAHOOL location."
      tags: [Weather]
      parameters:
        - { in: path, name: locationId, required: true, schema: { type: string, format: uuid }, description: Saved location UUID }
      responses:
        "200":
          description: Current weather snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherCurrentResponse" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Location not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/v1/weather/forecast:
    get:
      operationId: getForecastByCoords
      summary: Get multi-day forecast by coordinates
      description: "Returns a daily (and optional hourly) forecast for the given coordinates."
      tags: [Weather]
      parameters:
        - { in: query, name: lat, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 }, description: Latitude in decimal degrees }
        - { in: query, name: lng, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 }, description: Longitude in decimal degrees }
        - { in: query, name: days, required: false, schema: { type: integer, minimum: 1, maximum: 14, default: 7 }, description: Number of forecast days }
      responses:
        "200":
          description: Forecast data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherForecastResponse" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/v1/weather/forecast/{locationId}:
    get:
      operationId: getForecastByLocation
      summary: Get forecast by saved location
      description: "Returns a forecast for a saved SAHOOL location."
      tags: [Weather]
      parameters:
        - { in: path, name: locationId, required: true, schema: { type: string, format: uuid }, description: Saved location UUID }
        - { in: query, name: days, required: false, schema: { type: integer, minimum: 1, maximum: 14, default: 7 }, description: Number of forecast days }
      responses:
        "200":
          description: Forecast data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherForecastResponse" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Location not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/v1/weather/forecast/field/{fieldId}:
    get:
      operationId: getForecastByField
      summary: Get forecast by field
      description: "Returns a forecast centered on a SAHOOL field centroid."
      tags: [Weather]
      parameters:
        - { in: path, name: fieldId, required: true, schema: { type: string, format: uuid }, description: Field UUID }
        - { in: query, name: days, required: false, schema: { type: integer, minimum: 1, maximum: 14, default: 7 }, description: Number of forecast days }
      responses:
        "200":
          description: Forecast data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherForecastResponse" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Field not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/v1/weather/alerts:
    get:
      operationId: getAlertsByCoords
      summary: Get active weather alerts by coordinates
      description: "Returns active severe weather alerts within an optional radius of the given coordinates."
      tags: [Weather]
      parameters:
        - { in: query, name: lat, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 }, description: Latitude in decimal degrees }
        - { in: query, name: lng, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 }, description: Longitude in decimal degrees }
        - { in: query, name: radiusKm, required: false, schema: { type: number, format: double, minimum: 1, maximum: 500, default: 50 }, description: Search radius in kilometers }
      responses:
        "200":
          description: Array of active alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WeatherAlertResponse" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/v1/weather/alerts/{locationId}:
    get:
      operationId: getAlertsByLocation
      summary: Get active weather alerts by saved location
      description: "Returns active severe weather alerts for a saved location."
      tags: [Weather]
      parameters:
        - { in: path, name: locationId, required: true, schema: { type: string, format: uuid }, description: Saved location UUID }
      responses:
        "200":
          description: Array of active alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WeatherAlertResponse" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Location not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/v1/weather/alerts/field/{fieldId}:
    get:
      operationId: getAlertsByField
      summary: Get active weather alerts for a field
      description: "Returns active severe weather alerts affecting a SAHOOL field."
      tags: [Weather]
      parameters:
        - { in: path, name: fieldId, required: true, schema: { type: string, format: uuid }, description: Field UUID }
      responses:
        "200":
          description: Array of active alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WeatherAlertResponse" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Field not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/v1/weather/locations:
    get:
      operationId: listWeatherLocations
      summary: List saved weather locations
      description: "Lists saved weather locations for the tenant, with optional free-text search."
      tags: [Weather]
      parameters:
        - { in: query, name: search, required: false, schema: { type: string, maxLength: 200 }, description: Free-text search on location name (EN or AR) }
      responses:
        "200":
          description: Array of saved locations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WeatherLocation" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/v1/weather/agricultural-calendar:
    get:
      operationId: getAgriculturalCalendar
      summary: Get agricultural calendar for a crop/location
      description: "Returns crop-stage recommendations keyed to climate and season for the given location."
      tags: [Weather]
      parameters:
        - { in: query, name: crop, required: true, schema: { type: string, minLength: 2, maxLength: 64 }, description: "Crop code or name (e.g. wheat, dates, tomato)" }
        - { in: query, name: lat, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 }, description: Latitude in decimal degrees }
        - { in: query, name: lng, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 }, description: Longitude in decimal degrees }
      responses:
        "200":
          description: Agricultural calendar with growth stages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgriCalendarResponse" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/v1/weather/fields/{fieldId}/graph:
    post:
      operationId: generateFieldWeatherGraph
      summary: Generate a signed weather graph for a field
      description: "Generates a Farmonaut-style signed SVG graph of weather metrics for the field over a date range. Added @since 4.7.0."
      tags: [Weather]
      parameters:
        - { in: path, name: fieldId, required: true, schema: { type: string, format: uuid }, description: Field UUID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeatherGraphGenerateRequest" }
      responses:
        "201":
          description: Graph generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherGraphResponse" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Field not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { description: Unprocessable entity, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/v1/weather/graphs/{graphId}:
    get:
      operationId: getWeatherGraph
      summary: Fetch a previously generated weather graph
      description: "Retrieves a previously generated weather graph (signed SVG URL). Added @since 4.7.0."
      tags: [Weather]
      parameters:
        - { in: path, name: graphId, required: true, schema: { type: string, format: uuid }, description: Graph UUID }
      responses:
        "200":
          description: Graph metadata with signed URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherGraphResponse" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Graph not found or expired, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/v1/weather-core/weather/current:
    get:
      operationId: getCurrentWeatherLegacy
      summary: "[DEPRECATED] Legacy current weather endpoint"
      description: "Deprecated legacy endpoint. Use /api/v1/weather/current. Removal: v18.0.0."
      deprecated: true
      tags: [Weather]
      parameters:
        - { in: query, name: lat, required: true, schema: { type: number, format: double }, description: Latitude in decimal degrees }
        - { in: query, name: lng, required: true, schema: { type: number, format: double }, description: Longitude in decimal degrees }
      responses:
        "200":
          description: Current weather snapshot (legacy)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherCurrentResponse" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/v1/weather-core/weather/forecast:
    get:
      operationId: getForecastLegacy
      summary: "[DEPRECATED] Legacy forecast endpoint"
      description: "Deprecated legacy endpoint. Use /api/v1/weather/forecast. Removal: v18.0.0."
      deprecated: true
      tags: [Weather]
      parameters:
        - { in: query, name: lat, required: true, schema: { type: number, format: double }, description: Latitude in decimal degrees }
        - { in: query, name: lng, required: true, schema: { type: number, format: double }, description: Longitude in decimal degrees }
        - { in: query, name: days, required: false, schema: { type: integer, default: 7 }, description: Number of forecast days }
      responses:
        "200":
          description: Forecast data (legacy)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherForecastResponse" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/v1/weather-core/weather/agricultural-report:
    get:
      operationId: getAgriculturalReportLegacy
      summary: "[DEPRECATED] Legacy agricultural report endpoint"
      description: "Deprecated legacy endpoint. Use /api/v1/weather/agricultural-calendar. Removal: v18.0.0."
      deprecated: true
      tags: [Weather]
      parameters:
        - { in: query, name: crop, required: true, schema: { type: string }, description: Crop code or name }
        - { in: query, name: lat, required: true, schema: { type: number, format: double }, description: Latitude in decimal degrees }
        - { in: query, name: lng, required: true, schema: { type: number, format: double }, description: Longitude in decimal degrees }
      responses:
        "200":
          description: Agricultural calendar (legacy)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgriCalendarResponse" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: "Kubernetes liveness probe. No authentication required."
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: "Kubernetes readiness probe. No authentication required."
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Service not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /health:
    get:
      operationId: getHealth
      summary: Combined health status
      description: "Combined liveness/readiness health response."
      tags: [Health]
      responses:
        "200":
          description: Health response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Internal SAHOOL JWT issued by user-service (HS256)."

  schemas:
    WeatherCurrentResponse:
      type: object
      required: [location, current, timestamp]
      properties:
        location:
          type: object
          required: [lat, lng]
          properties:
            lat: { type: number, format: double }
            lng: { type: number, format: double }
            name: { type: [string, "null"] }
        current:
          type: object
          required: [temperature, humidity, windSpeed, description]
          properties:
            temperature: { type: number, format: double, description: Temperature in degrees Celsius }
            humidity: { type: number, format: double, minimum: 0, maximum: 100, description: Relative humidity percentage }
            windSpeed: { type: number, format: double, description: Wind speed in km/h }
            windDirection: { type: [number, "null"], format: double, description: Wind direction in degrees (0-360) }
            pressure: { type: [number, "null"], format: double, description: Pressure in hPa }
            cloudCover: { type: [number, "null"], format: double, minimum: 0, maximum: 100 }
            uvIndex: { type: [number, "null"], format: double, minimum: 0 }
            description: { type: string, description: Human-readable weather description (English) }
            descriptionAr: { type: [string, "null"], description: Arabic description }
            icon: { type: [string, "null"], description: Icon code }
        timestamp: { type: string, format: date-time }
      example:
        location: { lat: 24.7136, lng: 46.6753, name: Riyadh }
        current:
          temperature: 28.4
          humidity: 22
          windSpeed: 14.2
          windDirection: 135
          pressure: 1012
          cloudCover: 5
          uvIndex: 8
          description: Clear sky
          descriptionAr: سماء صافية
          icon: clear-day
        timestamp: "2026-04-12T10:15:00Z"

    DailyForecast:
      type: object
      required: [date, tempMax, tempMin, humidity, precipitation, windSpeed, description]
      properties:
        date: { type: string, format: date }
        tempMax: { type: number, format: double }
        tempMin: { type: number, format: double }
        humidity: { type: number, format: double, minimum: 0, maximum: 100 }
        precipitation: { type: number, format: double, description: Total precipitation in mm }
        precipitationProbability: { type: [number, "null"], format: double, minimum: 0, maximum: 100 }
        windSpeed: { type: number, format: double }
        description: { type: string }
        descriptionAr: { type: [string, "null"] }
        icon: { type: [string, "null"] }

    HourlyForecast:
      type: object
      required: [time, temperature, humidity, precipitation, windSpeed]
      properties:
        time: { type: string, format: date-time }
        temperature: { type: number, format: double }
        humidity: { type: number, format: double, minimum: 0, maximum: 100 }
        precipitation: { type: number, format: double }
        windSpeed: { type: number, format: double }
        icon: { type: [string, "null"] }

    WeatherForecastResponse:
      type: object
      required: [location, daily]
      properties:
        location:
          type: object
          required: [lat, lng]
          properties:
            lat: { type: number, format: double }
            lng: { type: number, format: double }
        daily:
          type: array
          items: { $ref: "#/components/schemas/DailyForecast" }
        hourly:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/HourlyForecast" }
      example:
        location: { lat: 24.7136, lng: 46.6753 }
        daily:
          - date: "2026-04-12"
            tempMax: 31.2
            tempMin: 18.5
            humidity: 25
            precipitation: 0.0
            precipitationProbability: 5
            windSpeed: 12.0
            description: Sunny
            descriptionAr: مشمس
            icon: clear-day

    WeatherAlertResponse:
      type: object
      required: [type, severity, title, message]
      properties:
        id: { type: [string, "null"], format: uuid }
        type: { type: string, description: "Alert category (e.g. heat, frost, storm, dust)" }
        severity:
          type: string
          enum: [low, medium, high, critical]
        title: { type: string }
        titleAr: { type: [string, "null"] }
        message: { type: string }
        messageAr: { type: [string, "null"] }
        affectedAreas:
          type: [array, "null"]
          items: { type: string }
        startTime: { type: [string, "null"], format: date-time }
        endTime: { type: [string, "null"], format: date-time }
        isActive: { type: [boolean, "null"] }
        timestamp: { type: [string, "null"], format: date-time }
      example:
        id: 9a2b5e0e-6a9a-4f0e-9f0e-0f0e0f0e0f0e
        type: dust
        severity: high
        title: Severe dust storm warning
        titleAr: تحذير عاصفة غبارية شديدة
        message: Visibility below 500m expected
        messageAr: يتوقع انخفاض الرؤية دون 500 متر
        affectedAreas: [Riyadh, Al-Kharj]
        startTime: "2026-04-12T14:00:00Z"
        endTime: "2026-04-12T22:00:00Z"
        isActive: true

    WeatherLocation:
      type: object
      required: [id, name, lat, lng]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        nameAr: { type: [string, "null"] }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        tenantId: { type: [string, "null"], format: uuid }
        isDefault: { type: [boolean, "null"] }

    WeatherGraphGenerateRequest:
      type: object
      required: [startDate, endDate, metrics]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        metrics:
          type: array
          minItems: 1
          items:
            type: string
            enum: [temp, humidity, precipitation, wind, uv]
      example:
        startDate: "2026-04-01"
        endDate: "2026-04-12"
        metrics: [temp, humidity, precipitation]

    WeatherGraphResponse:
      type: object
      required: [id, fieldId, svgUrl, expiresAt, generatedAt]
      properties:
        id: { type: string, format: uuid }
        fieldId: { type: string, format: uuid }
        svgUrl: { type: string, format: uri, description: Signed URL to SVG asset }
        expiresAt: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }

    AgriCalendarResponse:
      type: object
      required: [crop, stages]
      properties:
        crop: { type: string }
        stages:
          type: array
          items:
            type: object
            required: [name, nameAr, startDate, endDate, recommendedActions]
            properties:
              name: { type: string }
              nameAr: { type: string }
              startDate: { type: string, format: date }
              endDate: { type: string, format: date }
              recommendedActions:
                type: array
                items: { type: string }
      example:
        crop: wheat
        stages:
          - name: Tillering
            nameAr: التفريع
            startDate: "2026-01-15"
            endDate: "2026-02-28"
            recommendedActions: ["Apply nitrogen top dressing", "Monitor for rust"]

    ApiError:
      type: object
      required: [success, error, errorCode]
      properties:
        success: { type: boolean, enum: [false] }
        error: { type: string }
        errorAr: { type: [string, "null"] }
        errorCode: { type: string, description: "Machine-readable error code (e.g. E1001)" }
        requestId: { type: [string, "null"] }
      example:
        success: false
        error: Invalid coordinates
        errorAr: إحداثيات غير صالحة
        errorCode: E1001
        requestId: 7b2c1e0e-1a2b-4c3d-9f0e-0f0e0f0e0f0e

    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok, degraded, not_ready]
        service:
          type: string
          enum: [weather-service]
        version: { type: string }
        timestamp: { type: [string, "null"], format: date-time }
        database: { type: [boolean, "null"] }
        cache: { type: [boolean, "null"] }
      example:
        status: ok
        service: weather-service
        version: "4.12.0"
        timestamp: "2026-04-12T10:15:00Z"
        database: true
        cache: true
