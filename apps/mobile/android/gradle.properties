org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon=false
org.gradle.caching=false

# R8 Full Mode - Enable aggressive code shrinking and obfuscation
# Provides better optimization and smaller APK size
android.enableR8.fullMode=true

# R8 optimization settings
android.enableR8=true

# Java version configuration - Force Java 17 for all compilations
# This prevents dependencies from trying to use Java 21
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
