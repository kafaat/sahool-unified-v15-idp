name: sahool_atmosphere
description: "SAHOOL Atmosphere - Revolutionary Agricultural UX Platform"
publish_to: 'none'
version: 16.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'  # Flutter 3.27.x uses Dart 3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Sensors for gyroscope/accelerometer
  # Updated from ^4.0.2 to ^7.0.0 for compatibility with sahool_field_app
  # Breaking changes: SensorEvent renamed to specific event types (AccelerometerEvent, etc.)
  sensors_plus: ^7.0.0

  # State management
  flutter_riverpod: ^2.6.1

  # Animations
  flutter_animate: ^4.3.0

  # Icons
  flutter_svg: ^2.0.16
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8

  # Glassmorphism effects
  glassmorphism: ^3.0.0

  # Charts
  fl_chart: ^0.69.2

  # Haptic feedback
  vibration: ^1.8.4

  # Voice recognition
  # Updated from ^6.5.1 to ^7.0.0 for compatibility with sahool_field_app
  # Breaking changes: listen() returns Future<void> instead of bool, updated callback signatures
  speech_to_text: ^7.0.0

  # AR Kit (for future)
  # arkit_plugin: ^1.0.7

  # HTTP client
  dio: ^5.7.0

  # Environment config
  flutter_dotenv: ^5.2.1

  # Internationalization
  intl: 0.19.0  # Pinned for flutter_localizations SDK compatibility

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Security - Root/Jailbreak Detection
  # أمان - كشف الروت والجيلبريك
  safe_device: ^1.1.7
  device_info_plus: ^10.1.2

  # Network & Connectivity
  connectivity_plus: ^6.1.1

  # Navigation
  go_router: ^14.6.2

  # Utils
  uuid: ^4.5.1
  equatable: ^2.0.7

  # Maps - خرائط الحقول
  flutter_map: ">=8.1.1 <8.2.0"  # Pin to 8.1.x - 8.2.x requires http ^1.5.0
  latlong2: ^0.9.1

  # Location - تحديد الموقع
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13  # Last version for Dart 3.6.0
  mocktail: ^1.0.4

  # App Branding - أيقونات التطبيق
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

# App Icon Configuration
# تكوين أيقونة التطبيق
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D1F12"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 23

# Splash Screen Configuration
# تكوين شاشة البداية
flutter_native_splash:
  color: "#0D1F12"
  image: assets/icon/splash_logo.png
  color_dark: "#050A06"
  image_dark: assets/icon/splash_logo.png
  android_12:
    color: "#0D1F12"
    icon_background_color: "#0D1F12"
    image: assets/icon/splash_logo.png
  ios: true
  web: false

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icon/
    - .env.example

  # Note: Using system fonts until custom fonts are available
  # To add custom fonts, download and place in assets/fonts/ directory:
  # - SpaceGrotesk: https://fonts.google.com/specimen/Space+Grotesk
  # - Inter: https://fonts.google.com/specimen/Inter
  # fonts:
  #   - family: SpaceGrotesk
  #     fonts:
  #       - asset: assets/fonts/SpaceGrotesk-Regular.ttf
  #       - asset: assets/fonts/SpaceGrotesk-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/SpaceGrotesk-Bold.ttf
  #         weight: 700
  #
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
