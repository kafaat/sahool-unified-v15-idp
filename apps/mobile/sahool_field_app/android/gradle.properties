org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# AndroidX Configuration
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Build Optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin Configuration
kotlin.code.style=official
kotlin.incremental=true

# R8 Full Mode - Aggressive optimization and obfuscation
# Enabled for production builds (2026-02-02)
android.enableR8.fullMode=true
android.enableR8=true

# Disable deprecated warnings for cleaner build output
android.suppressUnsupportedCompileSdk=36
