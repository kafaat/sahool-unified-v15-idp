org.gradle.jvmargs=-Xmx6G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# AndroidX Configuration
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Build Optimizations — parallel disabled to avoid race conditions in CI
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=false

# Kotlin Configuration
kotlin.code.style=official
kotlin.incremental=true

# R8 — compatibility mode (full mode strips SQLCipher native bindings)
android.enableR8=true
# android.enableR8.fullMode=true

# Disable deprecated warnings for cleaner build output
android.suppressUnsupportedCompileSdk=35
