# SAHOOL Field App Build Configuration
# ملف إعدادات توليد الكود
#
# IMPORTANT: When adding new @freezed, @JsonSerializable, @riverpod, or Drift
# models, ensure the file path matches the generate_for patterns below.
# If not, add the new path pattern.
#
# هام: عند إضافة نماذج جديدة، تأكد من أن مسار الملف يطابق أنماط generate_for أدناه.

targets:
  $default:
    builders:
      # JSON Serializable configuration
      json_serializable:
        generate_for:
          - "lib/models/**/*.dart"
          - "lib/services/**/*.dart"
          - "lib/core/**/*.dart"
          - "lib/features/**/*.dart"
        options:
          explicit_to_json: true
          include_if_null: false

      # Freezed configuration
      freezed:
        generate_for:
          - "lib/models/**/*.dart"
          - "lib/core/**/*.dart"
          - "lib/features/**/*.dart"

      # Riverpod Generator configuration
      riverpod_generator:
        generate_for:
          - "lib/core/**/*.dart"
          - "lib/features/**/*.dart"

      # Drift database configuration
      drift_dev:
        generate_for:
          - "lib/core/storage/*.dart"
          - "lib/core/storage/**/*.dart"
          - "lib/core/database/*.dart"
          - "lib/core/database/**/*.dart"
          - "lib/features/**/data/*.dart"
          - "lib/features/**/data/**/*.dart"
        options:
          store_date_time_values_as_text: true

      # Exclude test files and generated files from code generation
      source_gen|combining_builder:
        generate_for:
          exclude:
            - "test/**"
            - "**/*.mocks.dart"
            - "**/*.g.dart"
            - "**/*.freezed.dart"
