name: sahool_field_app
description: "SAHOOL Field Operations App - Offline-First Mobile Application"
publish_to: 'none'
version: 16.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'  # Flutter 3.27.x uses Dart 3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management (Riverpod 2.x - compatible with Dart 3.6.0)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database (Offline) - SECURITY: Using SQLCipher for encrypted database
  # قاعدة بيانات مشفرة باستخدام SQLCipher للأمان
  drift: ^2.24.0
  sqlcipher_flutter_libs: ^0.6.1  # SQLCipher for encrypted database (CRITICAL SECURITY)
  path_provider: ^2.1.5
  path: ^1.9.0  # Must match Flutter SDK version requirement

  # Network
  dio: ^5.7.0
  http: ^1.2.2
  connectivity_plus: ^6.1.1
  socket_io_client: ^2.0.3+1  # Real-time updates
  # Certificate pinning implemented via custom Dio interceptor (see lib/core/security/)

  # Background Tasks
  workmanager: ^0.6.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0  # Required by flutter_local_notifications for scheduled notifications
  # Firebase - required by core/notifications/ services
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Biometric Authentication
  local_auth: ^2.3.0

  # Device Security
  safe_device: ^1.1.7
  secure_application: ^4.1.0  # Screenshot prevention (upgraded for rxdart compatibility)

  # UI
  cupertino_icons: ^1.0.8
  # google_fonts removed: using local IBM Plex Sans Arabic fonts instead
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1

  # Charts
  fl_chart: ^0.69.2

  # Maps - Updated for Flutter 3.27 compatibility
  flutter_map: ">=8.1.1 <8.2.0"  # Pin to 8.1.x - 8.2.x requires http ^1.5.0 which may conflict
  flutter_map_cache: ^2.0.0  # Lightweight offline map caching
  latlong2: ^0.9.1
  # Note: maplibre_gl removed - requires Java 21 and NDK 28, flutter_map is sufficient

  # Location
  geolocator: ^13.0.2

  # Environment Configuration
  flutter_dotenv: ^5.2.1

  # Navigation
  go_router: ^14.6.2

  # Camera & Photos
  image_picker: ^1.1.2
  camera: ^0.11.0+2

  # Barcode/QR Scanner
  mobile_scanner: ^6.0.2

  # Utils
  uuid: ^4.5.1
  intl: 0.19.0  # Pinned for flutter_localizations SDK compatibility
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4  # Compatible with freezed 2.5.8
  json_annotation: ^4.9.0
  crypto: ^3.0.6  # For hashing and cryptography

  # Device & Package Info
  # معلومات الجهاز والتطبيق
  device_info_plus: ^10.1.2
  package_info_plus: ^8.1.0

  # URL Launcher & App Links
  # فتح الروابط والتعامل مع الروابط العميقة
  url_launcher: ^6.2.2
  app_links: ^6.3.3  # Deep link handling (Universal Links / App Links)

  # Date/Time
  jiffy: ^6.3.1
  table_calendar: ^3.1.3  # Calendar widget for spray scheduling

  # File Management & Sharing
  # إدارة الملفات والمشاركة
  file_picker: ^8.1.6
  share_plus: ^10.1.4

  # Permissions
  # إدارة الصلاحيات
  permission_handler: ^11.3.1

  # Audio Recording
  # تسجيل الصوت
  record: ^5.1.2

  # Image Processing
  # معالجة الصور
  image: ^4.3.0
  flutter_cache_manager: ^3.4.1  # Explicit cache manager (used alongside cached_network_image)

  # WebSocket
  # اتصال WebSocket مباشر
  web_socket_channel: ^3.0.1

  # SQLite Direct Access (used alongside Drift)
  sqlite3: ^2.4.6
  sqflite: ^2.4.1  # Required by notifications local DB

  # Voice & Speech - required by core/voice/ services
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Motion/Sensors - required by core/motion/
  sensors_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13  # Last version for Dart 3.6.0
  drift_dev: ^2.24.0
  freezed: 2.5.8  # Last 2.x version compatible with Dart 3.6.0
  json_serializable: ^6.9.0
  # mockito removed: 5.4.5 incompatible with analyzer 7.x, 5.4.6+ requires Dart 3.7.0
  mocktail: ^1.0.4  # For comprehensive testing and mocking

  riverpod_generator: ^2.6.3

  # App Branding
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

# Compatibility Matrix for Flutter 3.27.x (Dart 3.6.0):
# - freezed 2.5.8: analyzer >=7.0.0 <8.0.0, source_gen ^2.0.0
# - mockito: REMOVED (5.4.5 incompatible with analyzer 7.x)
# - build_runner 2.4.13: Compatible with Dart 3.6.0

# App Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 23

# Splash Screen Configuration
flutter_native_splash:
  color: "#2E7D32"
  image: assets/icon/splash_logo.png
  color_dark: "#1B5E20"
  image_dark: assets/icon/splash_logo.png
  android_12:
    color: "#2E7D32"
    icon_background_color: "#2E7D32"
    image: assets/icon/splash_logo.png
  ios: true
  web: false

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
  generate: true  # Enable code generation for l10n

  assets:
    - .env.example
    - assets/images/
    - assets/icons/
    - assets/icon/
    - assets/fonts/
    - assets/avatars/

  # Local Arabic fonts - faster app startup, smaller APK
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/IBMPlexSansArabic-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
