components:
  schemas:
    AgentCapability:
      description: 'Agent capability definition

        تعريف قدرة الوكيل


        Describes a specific capability or function the agent can perform.

        يصف قدرة أو وظيفة محددة يمكن للوكيل أدائها.'
      example:
        description: Diagnose crop diseases from symptoms
        description_ar: تشخيص أمراض المحاصيل من الأعراض
        input_schema:
          properties:
            crop_type:
              type: string
            symptoms:
              type: object
          type: object
        name: diagnose_disease
        output_schema:
          properties:
            confidence:
              type: number
            disease:
              type: string
          type: object
      properties:
        description:
          description: Capability description
          title: Description
          type: string
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          description: Arabic description
          title: Description Ar
        examples:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          description: Usage examples
          title: Examples
        input_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: JSON Schema for input
          title: Input Schema
        name:
          description: Capability name
          title: Name
          type: string
        output_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: JSON Schema for output
          title: Output Schema
      required:
      - name
      - description
      title: AgentCapability
      type: object
    AgentCard:
      description: 'A2A Protocol Agent Card

        بطاقة الوكيل - بروتوكول A2A


        Complete agent specification following the A2A protocol.

        مواصفات كاملة للوكيل تتبع بروتوكول A2A.


        This is the core data structure for agent registry and discovery.

        هذا هو هيكل البيانات الأساسي لسجل واكتشاف الوكلاء.'
      example:
        agent_id: disease-expert-agent
        capabilities:
        - description: Diagnose crop diseases from symptoms
          input_schema:
            type: object
          name: diagnose_disease
          output_schema:
            type: object
        dependencies:
        - crop-health-service
        - satellite-service
        description: AI agent specialized in diagnosing crop diseases
        description_ar: وكيل ذكاء اصطناعي متخصص في تشخيص أمراض المحاصيل
        endpoint:
          method: POST
          url: https://api.sahool.app/agents/disease-expert/invoke
        health_endpoint: https://api.sahool.app/agents/disease-expert/health
        input_modes:
        - text
        - structured
        - multimodal
        name: Disease Expert Agent
        name_ar: وكيل خبير الأمراض
        output_modes:
        - text
        - structured
        requires_authentication: true
        security_scheme: bearer
        skills:
        - keywords:
          - disease
          - diagnosis
          level: expert
          name: Crop Pathology
          skill_id: crop_pathology
        status: active
        version: 1.0.0
      properties:
        agent_id:
          description: Unique agent identifier
          minLength: 1
          title: Agent Id
          type: string
        capabilities:
          description: Agent capabilities
          items:
            $ref: '#/components/schemas/AgentCapability'
          title: Capabilities
          type: array
        dependencies:
          description: Other agents this agent depends on
          items:
            type: string
          title: Dependencies
          type: array
        description:
          description: Agent description
          minLength: 1
          title: Description
          type: string
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          description: Arabic description
          title: Description Ar
        endpoint:
          $ref: '#/components/schemas/AgentEndpoint'
          description: Primary agent endpoint
        health_endpoint:
          anyOf:
          - format: uri
            maxLength: 2083
            minLength: 1
            type: string
          - type: 'null'
          description: Health check endpoint
          title: Health Endpoint
        input_modes:
          description: Supported input modes
          items:
            $ref: '#/components/schemas/InputMode'
          title: Input Modes
          type: array
        metadata:
          $ref: '#/components/schemas/AgentMetadata'
          description: Additional metadata
        name:
          description: Agent name
          minLength: 1
          title: Name
          type: string
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          description: Arabic name
          title: Name Ar
        output_modes:
          description: Supported output modes
          items:
            $ref: '#/components/schemas/OutputMode'
          title: Output Modes
          type: array
        requires_authentication:
          default: true
          description: Whether authentication is required
          title: Requires Authentication
          type: boolean
        security_scheme:
          $ref: '#/components/schemas/SecurityScheme'
          default: bearer
          description: Authentication scheme
        skills:
          description: Agent skills/expertise
          items:
            $ref: '#/components/schemas/AgentSkill'
          title: Skills
          type: array
        status:
          default: active
          description: Agent status
          enum:
          - active
          - inactive
          - deprecated
          - maintenance
          title: Status
          type: string
        version:
          description: Agent version (semver)
          pattern: ^\d+\.\d+\.\d+$
          title: Version
          type: string
      required:
      - agent_id
      - name
      - version
      - description
      - endpoint
      title: AgentCard
      type: object
    AgentEndpoint:
      description: 'Agent endpoint configuration

        تكوين نقطة نهاية الوكيل'
      example:
        headers:
          Content-Type: application/json
        method: POST
        timeout_seconds: 30
        url: https://api.sahool.app/agents/disease-expert/invoke
      properties:
        headers:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          description: Required headers
          title: Headers
        method:
          default: POST
          description: HTTP method
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          title: Method
          type: string
        timeout_seconds:
          default: 30
          description: Request timeout
          title: Timeout Seconds
          type: integer
        url:
          description: Endpoint URL
          format: uri
          maxLength: 2083
          minLength: 1
          title: Url
          type: string
      required:
      - url
      title: AgentEndpoint
      type: object
    AgentMetadata:
      description: 'Agent metadata and discovery information

        البيانات الوصفية للوكيل ومعلومات الاكتشاف'
      example:
        category: agricultural-intelligence
        documentation: https://docs.sahool.app/agents/disease-expert
        homepage: https://sahool.app
        license: MIT
        organization: SAHOOL
        tags:
        - agriculture
        - ai
        - disease-detection
      properties:
        category:
          anyOf:
          - type: string
          - type: 'null'
          description: Agent category
          title: Category
        created_at:
          description: Creation timestamp
          format: date-time
          title: Created At
          type: string
        documentation:
          anyOf:
          - format: uri
            maxLength: 2083
            minLength: 1
            type: string
          - type: 'null'
          description: Documentation URL
          title: Documentation
        homepage:
          anyOf:
          - format: uri
            maxLength: 2083
            minLength: 1
            type: string
          - type: 'null'
          description: Agent homepage
          title: Homepage
        license:
          anyOf:
          - type: string
          - type: 'null'
          description: License type
          title: License
        organization:
          anyOf:
          - type: string
          - type: 'null'
          description: Organization/owner
          title: Organization
        source_code:
          anyOf:
          - format: uri
            maxLength: 2083
            minLength: 1
            type: string
          - type: 'null'
          description: Source code repository
          title: Source Code
        tags:
          description: Searchable tags
          items:
            type: string
          title: Tags
          type: array
        updated_at:
          description: Last update timestamp
          format: date-time
          title: Updated At
          type: string
      title: AgentMetadata
      type: object
    AgentSkill:
      description: 'Agent skill/expertise area

        مهارة/مجال خبرة الوكيل


        Represents a domain or area of expertise for the agent.

        يمثل مجالًا أو منطقة خبرة للوكيل.'
      example:
        keywords:
        - disease
        - diagnosis
        - pathology
        - pest
        level: expert
        name: Crop Disease Diagnosis
        name_ar: تشخيص أمراض المحاصيل
        skill_id: crop_disease_diagnosis
      properties:
        keywords:
          description: Search keywords
          items:
            type: string
          title: Keywords
          type: array
        level:
          description: Proficiency level
          enum:
          - beginner
          - intermediate
          - advanced
          - expert
          title: Level
          type: string
        name:
          description: Skill name
          title: Name
          type: string
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          description: Arabic name
          title: Name Ar
        skill_id:
          description: Unique skill identifier
          title: Skill Id
          type: string
      required:
      - skill_id
      - name
      - level
      title: AgentSkill
      type: object
    DiscoverByTagsRequest:
      description: Request to discover agents by tags / طلب لاكتشاف الوكلاء حسب العلامات
      properties:
        tags:
          description: Tags to search for
          items:
            type: string
          title: Tags
          type: array
      required:
      - tags
      title: DiscoverByTagsRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    InputMode:
      description: Agent input modes / أنماط إدخال الوكيل
      enum:
      - text
      - structured
      - multimodal
      - stream
      title: InputMode
      type: string
    OutputMode:
      description: Agent output modes / أنماط إخراج الوكيل
      enum:
      - text
      - structured
      - multimodal
      - stream
      title: OutputMode
      type: string
    RegisterAgentRequest:
      description: Request to register an agent / طلب لتسجيل وكيل
      properties:
        agent_card:
          $ref: '#/components/schemas/AgentCard'
          description: Agent card to register
      required:
      - agent_card
      title: RegisterAgentRequest
      type: object
    SecurityScheme:
      description: Security authentication schemes / مخططات المصادقة الأمنية
      enum:
      - apiKey
      - bearer
      - oauth2
      - mutualTLS
      - none
      title: SecurityScheme
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: A2A Protocol-compliant agent registry for SAHOOL platform
  title: SAHOOL Agent Registry Service
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/registry/agents:
    get:
      description: 'List all agents with optional filters

        قائمة بجميع الوكلاء مع مرشحات اختيارية'
      operationId: list_agents_api_v1_registry_agents_get
      parameters:
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - in: query
        name: category
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Agents
      tags:
      - Agents
    post:
      description: 'Register a new agent

        تسجيل وكيل جديد


        Requires API key authentication.

        يتطلب مصادقة مفتاح API.'
      operationId: register_agent_api_v1_registry_agents_post
      parameters:
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Register Agent
      tags:
      - Agents
  /api/v1/registry/agents/{agent_id}:
    delete:
      description: 'Deregister an agent

        إلغاء تسجيل وكيل


        Requires API key authentication.

        يتطلب مصادقة مفتاح API.'
      operationId: deregister_agent_api_v1_registry_agents__agent_id__delete
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          title: Agent Id
          type: string
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Deregister Agent
      tags:
      - Agents
    get:
      description: 'Get agent card by ID

        الحصول على بطاقة الوكيل بواسطة المعرف'
      operationId: get_agent_api_v1_registry_agents__agent_id__get
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          title: Agent Id
          type: string
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Agent
      tags:
      - Agents
  /api/v1/registry/agents/{agent_id}/health:
    get:
      description: 'Check health of a specific agent

        فحص صحة وكيل محدد'
      operationId: check_agent_health_api_v1_registry_agents__agent_id__health_get
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          title: Agent Id
          type: string
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Check Agent Health
      tags:
      - Health
  /api/v1/registry/discover/capability:
    get:
      description: 'Discover agents by capability

        اكتشاف الوكلاء حسب القدرة'
      operationId: discover_by_capability_api_v1_registry_discover_capability_get
      parameters:
      - in: query
        name: capability
        required: true
        schema:
          title: Capability
          type: string
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Discover By Capability
      tags:
      - Discovery
  /api/v1/registry/discover/skill:
    get:
      description: 'Discover agents by skill

        اكتشاف الوكلاء حسب المهارة'
      operationId: discover_by_skill_api_v1_registry_discover_skill_get
      parameters:
      - in: query
        name: skill
        required: true
        schema:
          title: Skill
          type: string
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Discover By Skill
      tags:
      - Discovery
  /api/v1/registry/discover/tags:
    post:
      description: 'Discover agents by tags

        اكتشاف الوكلاء حسب العلامات'
      operationId: discover_by_tags_api_v1_registry_discover_tags_post
      parameters:
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverByTagsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Discover By Tags
      tags:
      - Discovery
  /api/v1/registry/health/all:
    get:
      description: 'Get health statuses of all agents

        الحصول على حالات صحة جميع الوكلاء'
      operationId: get_all_health_statuses_api_v1_registry_health_all_get
      parameters:
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get All Health Statuses
      tags:
      - Health
  /api/v1/registry/stats:
    get:
      description: 'Get registry statistics

        الحصول على إحصائيات السجل'
      operationId: get_registry_stats_api_v1_registry_stats_get
      parameters:
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Registry Stats
      tags:
      - Registry
  /healthz:
    get:
      description: 'Health check endpoint

        نقطة فحص الصحة'
      operationId: health_check_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health Check
      tags:
      - Health
  /readyz:
    get:
      description: Kubernetes readiness probe - is the service ready to accept traffic?
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
      tags:
      - Health
