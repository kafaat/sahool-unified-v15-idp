info:
  description: Lightweight AI assistant for SAHOOL chat services | مساعد الشات الذكي لخدمات سهول
  title: AI Chat Assistant
  version: 1.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: Root endpoint with service information.
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
  /health:
    get:
      description: 'Combined health check.

        فحص الصحة المجمع.'
      operationId: combined_health_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Combined Health
  /health/live:
    get:
      description: 'Liveness probe - checks if the service is running.

        مسبار الحياة - يتحقق من تشغيل الخدمة.'
      operationId: health_check_health_live_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health Check
  /health/ready:
    get:
      description: "Readiness probe - checks if the service is ready to serve requests.\nمسبار الجاهزية - يتحقق من جاهزية الخدمة لخدمة الطلبات.\n\nSemantics:\n* production / staging  — fail closed. Any missing dependency\n  (Redis / NATS / LLM orchestrator) returns 503 so K8s removes\n  this pod from the service endpoints until every backend is up.\n* development / test    — fail open with diagnostic body. The\n  process is up and able to answer HTTP; returning 200 lets local\n  smoke tests (and the module-import-only unit test) pass without\n  standing up the full Redis/NATS/LLM stack. The body still\n  reports each dependency's state for visibility."
      operationId: readiness_check_health_ready_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness Check
  /healthz:
    get:
      description: 'Liveness probe - checks if the service is running.

        مسبار الحياة - يتحقق من تشغيل الخدمة.'
      operationId: health_check_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health Check
  /metrics:
    get:
      description: 'Prometheus metrics endpoint.

        نقطة نهاية مقاييس Prometheus.'
      operationId: metrics_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Metrics
  /readyz:
    get:
      description: "Readiness probe - checks if the service is ready to serve requests.\nمسبار الجاهزية - يتحقق من جاهزية الخدمة لخدمة الطلبات.\n\nSemantics:\n* production / staging  — fail closed. Any missing dependency\n  (Redis / NATS / LLM orchestrator) returns 503 so K8s removes\n  this pod from the service endpoints until every backend is up.\n* development / test    — fail open with diagnostic body. The\n  process is up and able to answer HTTP; returning 200 lets local\n  smoke tests (and the module-import-only unit test) pass without\n  standing up the full Redis/NATS/LLM stack. The body still\n  reports each dependency's state for visibility."
      operationId: readiness_check_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness Check
