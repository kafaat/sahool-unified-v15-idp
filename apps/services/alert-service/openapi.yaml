components:
  schemas:
    AlertCreate:
      description: إنشاء تنبيه جديد
      properties:
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          description: معرف الارتباط
          title: Correlation Id
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: تاريخ انتهاء الصلاحية
          title: Expires At
        field_id:
          description: معرف الحقل
          title: Field Id
          type: string
        message:
          description: رسالة التنبيه
          maxLength: 2000
          minLength: 1
          title: Message
          type: string
        message_en:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          description: الرسالة بالإنجليزية
          title: Message En
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: بيانات إضافية
          title: Metadata
        recommendations:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: التوصيات
          title: Recommendations
        recommendations_en:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: التوصيات بالإنجليزية
          title: Recommendations En
        severity:
          $ref: '#/components/schemas/AlertSeverity'
          description: مستوى الخطورة
        source_service:
          anyOf:
          - type: string
          - type: 'null'
          description: الخدمة المصدر
          title: Source Service
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          description: معرف المستأجر
          title: Tenant Id
        title:
          description: عنوان التنبيه
          maxLength: 200
          minLength: 1
          title: Title
          type: string
        title_en:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          description: العنوان بالإنجليزية
          title: Title En
        type:
          $ref: '#/components/schemas/AlertType'
          description: نوع التنبيه
      required:
      - field_id
      - type
      - severity
      - title
      - message
      title: AlertCreate
      type: object
    AlertResponse:
      description: استجابة التنبيه
      properties:
        acknowledged_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Acknowledged At
        acknowledged_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Acknowledged By
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        created_at:
          format: date-time
          title: Created At
          type: string
        dismissed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Dismissed At
        dismissed_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Dismissed By
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        field_id:
          title: Field Id
          type: string
        id:
          title: Id
          type: string
        message:
          title: Message
          type: string
        message_en:
          anyOf:
          - type: string
          - type: 'null'
          title: Message En
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        recommendations:
          items:
            type: string
          title: Recommendations
          type: array
        recommendations_en:
          items:
            type: string
          title: Recommendations En
          type: array
        resolution_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Resolution Note
        resolved_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Resolved At
        resolved_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Resolved By
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        source_service:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Service
        status:
          $ref: '#/components/schemas/AlertStatus'
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
        title:
          title: Title
          type: string
        title_en:
          anyOf:
          - type: string
          - type: 'null'
          title: Title En
        type:
          $ref: '#/components/schemas/AlertType'
      required:
      - id
      - field_id
      - tenant_id
      - type
      - severity
      - status
      - title
      - title_en
      - message
      - message_en
      - recommendations
      - recommendations_en
      - metadata
      - source_service
      - correlation_id
      - created_at
      - expires_at
      - acknowledged_at
      - acknowledged_by
      - dismissed_at
      - dismissed_by
      - resolved_at
      - resolved_by
      - resolution_note
      title: AlertResponse
      type: object
    AlertRuleConfig:
      description: إعدادات التنبيه للقاعدة
      properties:
        message_template:
          anyOf:
          - type: string
          - type: 'null'
          title: Message Template
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        title:
          maxLength: 200
          title: Title
          type: string
        title_en:
          anyOf:
          - type: string
          - type: 'null'
          title: Title En
        type:
          $ref: '#/components/schemas/AlertType'
      required:
      - type
      - severity
      - title
      title: AlertRuleConfig
      type: object
    AlertRuleCreate:
      description: إنشاء قاعدة تنبيه
      properties:
        alert_config:
          $ref: '#/components/schemas/AlertRuleConfig'
        condition:
          $ref: '#/components/schemas/RuleCondition'
        cooldown_hours:
          default: 24
          description: فترة الانتظار بالساعات
          maximum: 168
          minimum: 0
          title: Cooldown Hours
          type: integer
        enabled:
          default: true
          title: Enabled
          type: boolean
        field_id:
          title: Field Id
          type: string
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        name_en:
          anyOf:
          - type: string
          - type: 'null'
          title: Name En
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      required:
      - field_id
      - name
      - condition
      - alert_config
      title: AlertRuleCreate
      type: object
    AlertRuleResponse:
      description: استجابة قاعدة التنبيه
      properties:
        alert_config:
          $ref: '#/components/schemas/AlertRuleConfig'
        condition:
          $ref: '#/components/schemas/RuleCondition'
        cooldown_hours:
          title: Cooldown Hours
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        enabled:
          title: Enabled
          type: boolean
        field_id:
          title: Field Id
          type: string
        id:
          title: Id
          type: string
        last_triggered_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Triggered At
        name:
          title: Name
          type: string
        name_en:
          anyOf:
          - type: string
          - type: 'null'
          title: Name En
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - field_id
      - tenant_id
      - name
      - name_en
      - enabled
      - condition
      - alert_config
      - cooldown_hours
      - last_triggered_at
      - created_at
      - updated_at
      title: AlertRuleResponse
      type: object
    AlertSeverity:
      description: مستويات الخطورة
      enum:
      - critical
      - high
      - medium
      - low
      - info
      title: AlertSeverity
      type: string
    AlertStats:
      description: إحصائيات التنبيهات
      properties:
        acknowledged_rate:
          title: Acknowledged Rate
          type: number
        active_alerts:
          title: Active Alerts
          type: integer
        average_resolution_hours:
          anyOf:
          - type: number
          - type: 'null'
          title: Average Resolution Hours
        by_severity:
          additionalProperties:
            type: integer
          title: By Severity
          type: object
        by_status:
          additionalProperties:
            type: integer
          title: By Status
          type: object
        by_type:
          additionalProperties:
            type: integer
          title: By Type
          type: object
        resolved_rate:
          title: Resolved Rate
          type: number
        total_alerts:
          title: Total Alerts
          type: integer
      required:
      - total_alerts
      - active_alerts
      - by_type
      - by_severity
      - by_status
      - acknowledged_rate
      - resolved_rate
      - average_resolution_hours
      title: AlertStats
      type: object
    AlertStatus:
      description: حالة التنبيه
      enum:
      - active
      - acknowledged
      - dismissed
      - resolved
      - expired
      title: AlertStatus
      type: string
    AlertType:
      description: أنواع التنبيهات
      enum:
      - weather
      - pest
      - disease
      - irrigation
      - fertilizer
      - harvest
      - ndvi_low
      - ndvi_anomaly
      - soil_moisture
      - equipment
      - general
      title: AlertType
      type: string
    AlertUpdate:
      description: تحديث تنبيه
      properties:
        acknowledged_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Acknowledged By
        dismissed_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Dismissed By
        resolution_note:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          title: Resolution Note
        resolved_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Resolved By
        status:
          anyOf:
          - $ref: '#/components/schemas/AlertStatus'
          - type: 'null'
      title: AlertUpdate
      type: object
    ConditionOperator:
      description: عوامل المقارنة للقواعد
      enum:
      - eq
      - ne
      - gt
      - gte
      - lt
      - lte
      title: ConditionOperator
      type: string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    PaginatedResponse:
      description: استجابة مع ترقيم الصفحات
      properties:
        has_more:
          title: Has More
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/AlertResponse'
          title: Items
          type: array
        limit:
          title: Limit
          type: integer
        skip:
          title: Skip
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - skip
      - limit
      - has_more
      title: PaginatedResponse
      type: object
    RuleCondition:
      description: شرط قاعدة التنبيه
      properties:
        duration_minutes:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: 0
          description: المدة بالدقائق قبل الإطلاق
          title: Duration Minutes
        metric:
          description: 'اسم المقياس (مثل: soil_moisture, ndvi)'
          title: Metric
          type: string
        operator:
          $ref: '#/components/schemas/ConditionOperator'
          description: عامل المقارنة
        value:
          description: القيمة للمقارنة
          title: Value
          type: number
      required:
      - metric
      - operator
      - value
      title: RuleCondition
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: "\n    خدمة إدارة التنبيهات والإنذارات الزراعية\n\n    Agricultural Alerts and Warnings Management Service\n\n    Features:\n    - إنشاء وإدارة التنبيهات\n    - قواعد التنبيه التلقائي\n    - تكامل مع خدمات NDVI والطقس وIoT\n    - إحصائيات وتقارير\n    "
  title: SAHOOL Alert Service
  version: 16.0.0
openapi: 3.1.0
paths:
  /alerts:
    post:
      description: 'إنشاء تنبيه جديد

        Create a new alert'
      operationId: create_alert_endpoint_alerts_post
      parameters:
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Alert Endpoint
      tags:
      - Alerts
  /alerts/field/{field_id}:
    get:
      description: 'جلب تنبيهات حقل معين

        Get alerts for a specific field'
      operationId: get_alerts_by_field_endpoint_alerts_field__field_id__get
      parameters:
      - description: معرف الحقل
        in: path
        name: field_id
        required: true
        schema:
          description: معرف الحقل
          title: Field Id
          type: string
      - description: تصفية حسب الحالة
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AlertStatus'
          - type: 'null'
          description: تصفية حسب الحالة
          title: Status
      - description: تصفية حسب الخطورة
        in: query
        name: severity
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AlertSeverity'
          - type: 'null'
          description: تصفية حسب الخطورة
          title: Severity
      - description: تصفية حسب النوع
        in: query
        name: type
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AlertType'
          - type: 'null'
          description: تصفية حسب النوع
          title: Type
      - in: query
        name: skip
        required: false
        schema:
          default: 0
          minimum: 0
          title: Skip
          type: integer
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Alerts By Field Endpoint
      tags:
      - Alerts
  /alerts/rules:
    get:
      description: 'جلب قواعد التنبيه

        Get alert rules'
      operationId: get_rules_alerts_rules_get
      parameters:
      - description: تصفية حسب الحقل
        in: query
        name: field_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: تصفية حسب الحقل
          title: Field Id
      - description: تصفية حسب الحالة
        in: query
        name: enabled
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: تصفية حسب الحالة
          title: Enabled
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AlertRuleResponse'
                title: Response Get Rules Alerts Rules Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Rules
      tags:
      - Alert Rules
    post:
      description: 'إنشاء قاعدة تنبيه

        Create an alert rule'
      operationId: create_rule_alerts_rules_post
      parameters:
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Rule
      tags:
      - Alert Rules
  /alerts/rules/{rule_id}:
    delete:
      description: 'حذف قاعدة تنبيه

        Delete an alert rule'
      operationId: delete_rule_alerts_rules__rule_id__delete
      parameters:
      - description: معرف القاعدة
        in: path
        name: rule_id
        required: true
        schema:
          description: معرف القاعدة
          title: Rule Id
          type: string
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Delete Rule
      tags:
      - Alert Rules
  /alerts/stats:
    get:
      description: 'إحصائيات التنبيهات

        Get alert statistics'
      operationId: get_stats_alerts_stats_get
      parameters:
      - description: تصفية حسب الحقل
        in: query
        name: field_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: تصفية حسب الحقل
          title: Field Id
      - description: الفترة الزمنية (7d, 30d, 90d)
        in: query
        name: period
        required: false
        schema:
          default: 30d
          description: الفترة الزمنية (7d, 30d, 90d)
          pattern: ^\d{1,4}d$
          title: Period
          type: string
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertStats'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Stats
      tags:
      - Statistics
  /alerts/{alert_id}:
    delete:
      description: 'حذف تنبيه

        Delete an alert'
      operationId: delete_alert_endpoint_alerts__alert_id__delete
      parameters:
      - description: معرف التنبيه
        in: path
        name: alert_id
        required: true
        schema:
          description: معرف التنبيه
          title: Alert Id
          type: string
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Delete Alert Endpoint
      tags:
      - Alerts
    get:
      description: 'جلب تنبيه محدد

        Get a specific alert'
      operationId: get_alert_endpoint_alerts__alert_id__get
      parameters:
      - description: معرف التنبيه
        in: path
        name: alert_id
        required: true
        schema:
          description: معرف التنبيه
          title: Alert Id
          type: string
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Alert Endpoint
      tags:
      - Alerts
    patch:
      description: 'تحديث حالة تنبيه

        Update alert status'
      operationId: update_alert_endpoint_alerts__alert_id__patch
      parameters:
      - description: معرف التنبيه
        in: path
        name: alert_id
        required: true
        schema:
          description: معرف التنبيه
          title: Alert Id
          type: string
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update Alert Endpoint
      tags:
      - Alerts
  /alerts/{alert_id}/acknowledge:
    post:
      description: 'الإقرار بتنبيه

        Acknowledge an alert'
      operationId: acknowledge_alert_alerts__alert_id__acknowledge_post
      parameters:
      - description: معرف التنبيه
        in: path
        name: alert_id
        required: true
