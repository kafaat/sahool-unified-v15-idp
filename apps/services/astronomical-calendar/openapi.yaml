        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: التاريخ الميلادي (YYYY-MM-DD)
          title: Date Str
        description: التاريخ الميلادي (YYYY-MM-DD)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HijriDate'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/hijri-months:
    get:
      tags:
      - Reference
      summary: List Hijri Months
      description: قائمة الأشهر الهجرية
      operationId: list_hijri_months_v1_hijri_months_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /v1/zodiac:
    get:
      tags:
      - Astronomy
      summary: Get Zodiac
      description: الحصول على البرج الشمسي
      operationId: get_zodiac_v1_zodiac_get
      security:
