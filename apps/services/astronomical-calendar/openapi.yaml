  /v1/regions:
    get:
      tags:
      - Yemeni Heritage
      summary: Get Regions
      description: 'المناطق الزراعية اليمنية


        يرجع قائمة بجميع المناطق الزراعية الرئيسية في اليمن مع معلومات أساسية عن كل
        منطقة:

        - سهل تهامة

        - المرتفعات الوسطى

        - الهضبة الشرقية

        - المرتفعات الشمالية

        - الساحل الجنوبي'
      operationId: get_regions_v1_regions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /v1/regions/{region_id}:
    get:
      tags:
      - Yemeni Heritage
      summary: Get Region
      description: 'تفاصيل منطقة زراعية


        يرجع معلومات تفصيلية عن منطقة زراعية محددة تشمل:

        - المعلومات الجغرافية والمناخية

        - المحاصيل الرئيسية

        - مواسم الزراعة

        - التحديات الزراعية

        - المنتجات الشهيرة

        - أنظمة الري التقليدية


        المناطق المتاحة: tihama, central_highlands, eastern_plateau, northern_highlands,
        southern_coast'
      operationId: get_region_v1_regions__region_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: region_id
        in: path
        required: true
        schema:
          type: string
          title: Region Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/regions/{region_id}/crops:
    get:
      tags:
      - Yemeni Heritage
      summary: Get Region Crops
      description: 'محاصيل منطقة معينة


        يرجع قائمة مفصلة بالمحاصيل التي تُزرع في منطقة معينة مع معلومات عن:

        - المحاصيل الرئيسية

        - مواسم الزراعة لكل محصول

        - المنتجات الشهيرة من المنطقة


        المناطق المتاحة: tihama, central_highlands, eastern_plateau, northern_highlands,
        southern_coast'
      operationId: get_region_crops_v1_regions__region_id__crops_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: region_id
        in: path
        required: true
        schema:
          type: string
          title: Region Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/best-days:
    get:
      tags:
      - Calendar
      summary: Get Best Farming Days
      description: 'البحث عن أفضل الأيام لنشاط زراعي معين


        الأنشطة المدعومة: زراعة، حصاد، ري، تقليم، غرس، تطعيم'
      operationId: get_best_farming_days_v1_best_days_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: activity
        in: query
        required: false
        schema:
          type: string
          description: 'النشاط: زراعة، حصاد، ري، تقليم'
          default: زراعة
          title: Activity
        description: 'النشاط: زراعة، حصاد، ري، تقليم'
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 90
          minimum: 7
          description: عدد الأيام للبحث
          default: 30
          title: Days
        description: عدد الأيام للبحث
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/integration/weather:
    get:
      tags:
      - Integration
      summary: Get Integrated Data
      description: 'دمج البيانات الفلكية مع بيانات الطقس


        يتصل بخدمة الطقس للحصول على بيانات متكاملة'
      operationId: get_integrated_data_v1_integration_weather_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: location_id
        in: query
        required: false
        schema:
          type: string
          description: معرف الموقع
          default: sanaa
          title: Location Id
        description: معرف الموقع
      - name: date_str
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: التاريخ (YYYY-MM-DD)
          title: Date Str
        description: التاريخ (YYYY-MM-DD)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
