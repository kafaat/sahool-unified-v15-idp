      summary: Get Crop Proverbs
      description: 'الحصول على الأمثال الخاصة بمحصول معين


        المحاصيل المدعومة: قمح، بن، ذرة، بصل'
      operationId: get_crop_proverbs_v1_proverbs_crop__crop_name__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
