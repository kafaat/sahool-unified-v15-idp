openapi: 3.1.0
info:
  title: SAHOOL Astronomical Calendar Service
  description: "\n    خدمة التقويم الفلكي الزراعي التقليدي اليمني\n\n    ## المميزات:\n\
    \    - \U0001F319 حساب مراحل القمر بدقة عالية\n    - ⭐ منازل النجوم الـ 28 (المنازل\
    \ القمرية)\n    - \U0001F4C5 التقويم الهجري\n    - \U0001F331 توقيتات الزراعة\
    \ التقليدية\n    - ♈ الأبراج الزراعية\n    - \U0001F517 تكامل مع خدمة الطقس\n\n\
    \    ## الاستخدام:\n    يستخدم المزارعون اليمنيون هذا التقويم منذ آلاف السنين\n\
    \    لتحديد أفضل أوقات الزراعة والحصاد.\n    "
  version: 16.0.0
paths:
  /healthz:
    get:
      tags:
      - Health
      summary: Health Check
      description: التحقق من صحة الخدمة
      operationId: health_check_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /readyz:
    get:
      tags:
      - Health
      summary: Readiness
      description: Kubernetes readiness probe - is the service ready to accept traffic?
      operationId: readiness_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/today:
    get:
      tags:
      - Calendar
      summary: Get Today
      description: 'الحصول على البيانات الفلكية لليوم الحالي


        يرجع:

        - التاريخ الهجري

        - مرحلة القمر

        - المنزلة القمرية

        - البرج

        - الموسم الزراعي

        - التوصيات الزراعية'
      operationId: get_today_v1_today_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyAstronomicalData'
      security:
      - OAuth2PasswordBearer: []
  /v1/date/{date_str}:
    get:
      tags:
      - Calendar
      summary: Get Date
      description: 'الحصول على البيانات الفلكية لتاريخ محدد


        المعطيات:

        - date_str: التاريخ بصيغة YYYY-MM-DD'
      operationId: get_date_v1_date__date_str__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: date_str
        in: path
        required: true
        schema:
          type: string
          title: Date Str
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyAstronomicalData'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/week:
    get:
      tags:
      - Calendar
      summary: Get Weekly Forecast
      description: 'الحصول على التوقعات الفلكية الأسبوعية


        يرجع أفضل أيام الزراعة والحصاد والأيام التي يجب تجنبها'
      operationId: get_weekly_forecast_v1_week_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: تاريخ البداية (YYYY-MM-DD)
          title: Start Date
        description: تاريخ البداية (YYYY-MM-DD)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyForecast'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/moon-phase:
    get:
      tags:
      - Astronomy
      summary: Get Moon Phase
      description: الحصول على مرحلة القمر
      operationId: get_moon_phase_v1_moon_phase_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: date_str
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: التاريخ (YYYY-MM-DD)
          title: Date Str
        description: التاريخ (YYYY-MM-DD)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoonPhase'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/lunar-mansion:
    get:
      tags:
      - Astronomy
      summary: Get Lunar Mansion
      description: الحصول على المنزلة القمرية الحالية
      operationId: get_lunar_mansion_v1_lunar_mansion_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: date_str
