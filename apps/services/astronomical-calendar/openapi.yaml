  /v1/crop-calendar/{crop_name}:
    get:
      tags:
      - Crops
      summary: Get Crop Calendar
      description: 'الحصول على التقويم الفلكي لمحصول معين


        المحاصيل المدعومة: قمح، شعير، ذرة، طماطم، بن، موز، بصل، ثوم'
      operationId: get_crop_calendar_v1_crop_calendar__crop_name__get
