      description: 'تفاصيل محصول كاملة


        يرجع جميع المعلومات عن محصول معين بما في ذلك:

        - الأصناف والمناطق

        - معلومات الزراعة التفصيلية

        - العناية والري والتسميد

        - الحصاد والمعالجة

        - الأمثال الشعبية'
      operationId: get_crop_details_v1_crop_details__crop_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: crop_id
        in: path
        required: true
        schema:
          type: string
          title: Crop Id
      responses:
        '200':
          description: Successful Response
          content:
