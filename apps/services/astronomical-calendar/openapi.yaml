      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZodiacInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/zodiac-farming:
    get:
      tags:
      - Reference
      summary: List Zodiac Farming
      description: قائمة الأبراج مع معلومات الخصوبة الزراعية
      operationId: list_zodiac_farming_v1_zodiac_farming_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /v1/seasons:
    get:
      tags:
      - Reference
      summary: List Seasons
      description: قائمة المواسم الزراعية اليمنية
      operationId: list_seasons_v1_seasons_get
