            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/crop-details/{crop_id}/planting-guide:
    get:
      tags:
      - Crops
      summary: Get Planting Guide
      description: 'دليل زراعة المحصول المفصل


        يرجع دليل خطوة بخطوة لزراعة المحصول المحدد'
      operationId: get_planting_guide_v1_crop_details__crop_id__planting_guide_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: crop_id
        in: path
        required: true
        schema:
          type: string
          title: Crop Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/what-to-plant:
    get:
      tags:
      - Crops
      summary: What To Plant Now
      description: 'ماذا أزرع الآن؟


        يوصي بالمحاصيل المناسبة للزراعة في الوقت الحالي بناءً على:

        - التاريخ الحالي (الشهر الميلادي والهجري)

        - المنزلة القمرية

        - مرحلة القمر

        - المنطقة (اختياري)

        - الارتفاع (اختياري)'
      operationId: what_to_plant_now_v1_what_to_plant_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: region
        in: query
        required: false
        schema:
          type: string
          description: 'المنطقة (اختياري): حراز، صنعاء، تهامة، إلخ'
          title: Region
        description: 'المنطقة (اختياري): حراز، صنعاء، تهامة، إلخ'
      - name: altitude_min
        in: query
        required: false
        schema:
          type: integer
          description: الارتفاع الأدنى بالمتر
          title: Altitude Min
        description: الارتفاع الأدنى بالمتر
      - name: altitude_max
        in: query
        required: false
        schema:
          type: integer
          description: الارتفاع الأعلى بالمتر
          title: Altitude Max
        description: الارتفاع الأعلى بالمتر
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/proverbs:
    get:
      tags:
      - Yemeni Wisdom
      summary: Get All Proverbs
      description: 'الحصول على جميع الأمثال الزراعية اليمنية


        تشمل:

        - الأمثال العامة

        - أمثال حسب المحصول

        - أمثال حسب الموسم'
