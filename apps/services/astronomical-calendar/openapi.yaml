        in: path
        required: true
        schema:
          type: string
          title: Mansion Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/stars:
    get:
      tags:
      - Yemeni Wisdom
      summary: Get Important Stars
      description: 'الحصول على النجوم المهمة في التقويم الزراعي اليمني


        تشمل:

        - سهيل (Canopus)

        - الثريا (Pleiades)

        - السماك (Spica)'
      operationId: get_important_stars_v1_stars_get
      responses:
        '200':
