components:
  schemas:
    CropCalendar:
      description: تقويم المحصول
      properties:
        best_moon_phases:
          items:
            type: string
          title: Best Moon Phases
          type: array
        best_planting_mansions:
          items:
            type: integer
          title: Best Planting Mansions
          type: array
        best_zodiac_signs:
          items:
            type: string
          title: Best Zodiac Signs
          type: array
        crop_name:
          title: Crop Name
          type: string
        crop_name_en:
          title: Crop Name En
          type: string
        current_suitability:
          title: Current Suitability
          type: integer
        optimal_months:
          items:
            type: integer
          title: Optimal Months
          type: array
        planting_guide:
          title: Planting Guide
          type: string
      required:
      - crop_name
      - crop_name_en
      - best_planting_mansions
      - best_moon_phases
      - best_zodiac_signs
      - optimal_months
      - planting_guide
      - current_suitability
      title: CropCalendar
      type: object
    DailyAstronomicalData:
      description: البيانات الفلكية اليومية
      properties:
        date_gregorian:
          description: التاريخ الميلادي
          title: Date Gregorian
          type: string
        date_hijri:
          $ref: '#/components/schemas/HijriDate'
        lunar_mansion:
          $ref: '#/components/schemas/LunarMansion'
          description: المنزلة القمرية
        moon_phase:
          $ref: '#/components/schemas/MoonPhase'
        overall_farming_score:
          description: درجة الزراعة الإجمالية
          maximum: 10
          minimum: 1
          title: Overall Farming Score
          type: integer
        recommendations:
          description: التوصيات الزراعية
          items:
            $ref: '#/components/schemas/FarmingRecommendation'
          title: Recommendations
          type: array
        season:
          $ref: '#/components/schemas/SeasonInfo'
          description: الموسم
        zodiac:
          $ref: '#/components/schemas/ZodiacInfo'
          description: البرج
      required:
      - date_gregorian
      - date_hijri
      - moon_phase
      - lunar_mansion
      - zodiac
      - season
      - overall_farming_score
      - recommendations
      title: DailyAstronomicalData
      type: object
    FarmingRecommendation:
      description: توصية زراعية
      properties:
        activity:
          description: النشاط
          title: Activity
          type: string
        best_time:
          anyOf:
          - type: string
          - type: 'null'
          description: أفضل وقت
          title: Best Time
        reason:
          description: السبب
          title: Reason
          type: string
        suitability:
          description: مدى الملاءمة
          title: Suitability
          type: string
        suitability_score:
          description: درجة الملاءمة
          maximum: 10
          minimum: 1
          title: Suitability Score
          type: integer
      required:
      - activity
      - suitability
      - suitability_score
      - reason
      title: FarmingRecommendation
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HijriDate:
      description: التاريخ الهجري
      properties:
        day:
          description: اليوم
          maximum: 30
          minimum: 1
          title: Day
          type: integer
        month:
          description: الشهر
          maximum: 12
          minimum: 1
          title: Month
          type: integer
        month_name:
          description: اسم الشهر بالعربية
          title: Month Name
          type: string
        month_name_en:
          description: اسم الشهر بالإنجليزية
          title: Month Name En
          type: string
        weekday:
          description: اليوم من الأسبوع
          title: Weekday
          type: string
        year:
          description: السنة الهجرية
          title: Year
          type: integer
      required:
      - year
      - month
      - day
      - month_name
      - month_name_en
      - weekday
      title: HijriDate
      type: object
    LunarMansion:
      description: منزلة قمرية
      properties:
        activities:
          description: الأنشطة الموصى بها
          items:
            type: string
          title: Activities
          type: array
        avoid:
          description: الأنشطة التي يجب تجنبها
          items:
            type: string
          title: Avoid
          type: array
        constellation:
          description: البرج
          title: Constellation
          type: string
        constellation_en:
          description: البرج بالإنجليزية
          title: Constellation En
          type: string
        crops:
          description: المحاصيل الموصى بها
          items:
            type: string
          title: Crops
          type: array
        description:
          description: وصف المنزلة
          title: Description
          type: string
        element:
          description: العنصر
          title: Element
          type: string
        farming:
          description: حالة الزراعة
          title: Farming
          type: string
        farming_score:
          description: درجة ملاءمة الزراعة
          maximum: 10
          minimum: 1
          title: Farming Score
          type: integer
        name:
          description: اسم المنزلة بالعربية
          title: Name
          type: string
        name_en:
          description: اسم المنزلة بالإنجليزية
          title: Name En
          type: string
        number:
          description: رقم المنزلة
          maximum: 28
          minimum: 1
          title: Number
          type: integer
      required:
      - number
      - name
      - name_en
      - constellation
      - constellation_en
      - element
      - farming
      - farming_score
      - crops
      - activities
      - avoid
      - description
      title: LunarMansion
      type: object
    MoonPhase:
      description: مرحلة القمر
      properties:
        age_days:
          description: عمر القمر بالأيام
          title: Age Days
          type: number
        farming_good:
          description: هل مناسب للزراعة
          title: Farming Good
          type: boolean
        icon:
          description: أيقونة المرحلة
          title: Icon
          type: string
        illumination:
          description: نسبة الإضاءة
          maximum: 100.0
          minimum: 0.0
          title: Illumination
          type: number
        is_waxing:
          description: هل القمر متزايد
          title: Is Waxing
          type: boolean
        name:
          description: اسم المرحلة بالعربية
          title: Name
          type: string
        name_en:
          description: اسم المرحلة بالإنجليزية
          title: Name En
          type: string
        phase_key:
          description: مفتاح المرحلة
          title: Phase Key
          type: string
      required:
      - phase_key
      - name
      - name_en
      - icon
      - illumination
      - age_days
      - is_waxing
      - farming_good
      title: MoonPhase
      type: object
    SeasonInfo:
      description: معلومات الموسم
      properties:
        activities:
          description: الأنشطة الموصى بها
          items:
            type: string
          title: Activities
          type: array
        description:
          description: وصف الموسم
          title: Description
          type: string
        main_crops:
          description: المحاصيل الرئيسية
          items:
            type: string
          title: Main Crops
          type: array
        name:
          description: اسم الموسم بالعربية
          title: Name
          type: string
        name_en:
          description: اسم الموسم بالإنجليزية
          title: Name En
          type: string
      required:
      - name
      - name_en
      - description
      - main_crops
      - activities
      title: SeasonInfo
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WeeklyForecast:
      description: التوقعات الأسبوعية
      properties:
        avoid_days:
          items:
            type: string
          title: Avoid Days
          type: array
        best_harvesting_days:
          items:
            type: string
          title: Best Harvesting Days
          type: array
        best_planting_days:
          items:
            type: string
          title: Best Planting Days
          type: array
        days:
          items:
            $ref: '#/components/schemas/DailyAstronomicalData'
          title: Days
          type: array
        end_date:
          title: End Date
          type: string
        start_date:
          title: Start Date
          type: string
      required:
      - start_date
      - end_date
      - days
      - best_planting_days
      - best_harvesting_days
      - avoid_days
      title: WeeklyForecast
      type: object
    ZodiacInfo:
      description: معلومات البرج
      properties:
        element:
          description: العنصر
          title: Element
          type: string
        fertility:
          description: الخصوبة
          title: Fertility
          type: string
        name:
          description: اسم البرج بالعربية
          title: Name
          type: string
        name_en:
          description: اسم البرج بالإنجليزية
          title: Name En
          type: string
        score:
          description: درجة ملاءمة الزراعة
          maximum: 10
          minimum: 1
          title: Score
          type: integer
      required:
      - name
      - name_en
      - element
      - fertility
      - score
      title: ZodiacInfo
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: "\n    خدمة التقويم الفلكي الزراعي التقليدي اليمني\n\n    ## المميزات:\n    - \U0001F319 حساب مراحل القمر بدقة عالية\n    - ⭐ منازل النجوم الـ 28 (المنازل القمرية)\n    - \U0001F4C5 التقويم الهجري\n    - \U0001F331 توقيتات الزراعة التقليدية\n    - ♈ الأبراج الزراعية\n    - \U0001F517 تكامل مع خدمة الطقس\n\n    ## الاستخدام:\n    يستخدم المزارعون اليمنيون هذا التقويم منذ آلاف السنين\n    لتحديد أفضل أوقات الزراعة والحصاد.\n    "
  title: SAHOOL Astronomical Calendar Service
  version: 16.0.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      description: التحقق من صحة الخدمة
      operationId: health_check_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health Check
      tags:
      - Health
  /readyz:
    get:
      description: Kubernetes readiness probe - is the service ready to accept traffic?
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
      tags:
      - Health
  /v1/best-days:
    get:
      description: 'البحث عن أفضل الأيام لنشاط زراعي معين


        الأنشطة المدعومة: زراعة، حصاد، ري، تقليم، غرس، تطعيم'
      operationId: get_best_farming_days_v1_best_days_get
      parameters:
      - description: 'النشاط: زراعة، حصاد، ري، تقليم'
        in: query
        name: activity
        required: false
        schema:
          default: زراعة
          description: 'النشاط: زراعة، حصاد، ري، تقليم'
          title: Activity
          type: string
      - description: عدد الأيام للبحث
        in: query
        name: days
        required: false
        schema:
          default: 30
          description: عدد الأيام للبحث
          maximum: 90
          minimum: 7
          title: Days
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Best Farming Days
      tags:
      - Calendar
  /v1/crop-calendar/{crop_name}:
    get:
      description: 'الحصول على التقويم الفلكي لمحصول معين


        المحاصيل المدعومة: قمح، شعير، ذرة، طماطم، بن، موز، بصل، ثوم'
      operationId: get_crop_calendar_v1_crop_calendar__crop_name__get
      parameters:
      - in: path
        name: crop_name
        required: true
        schema:
          title: Crop Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropCalendar'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Crop Calendar
      tags:
      - Crops
  /v1/crop-details:
    get:
      description: 'قائمة المحاصيل مع التفاصيل الكاملة


        يرجع معلومات موجزة عن جميع المحاصيل في التقويم التفصيلي'
      operationId: list_detailed_crops_v1_crop_details_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: List Detailed Crops
      tags:
      - Crops
  /v1/crop-details/{crop_id}:
    get:
      description: 'تفاصيل محصول كاملة


        يرجع جميع المعلومات عن محصول معين بما في ذلك:

        - الأصناف والمناطق

        - معلومات الزراعة التفصيلية

        - العناية والري والتسميد

        - الحصاد والمعالجة

        - الأمثال الشعبية'
      operationId: get_crop_details_v1_crop_details__crop_id__get
      parameters:
      - in: path
        name: crop_id
        required: true
        schema:
          title: Crop Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Crop Details
      tags:
      - Crops
  /v1/crop-details/{crop_id}/planting-guide:
    get:
      description: 'دليل زراعة المحصول المفصل


        يرجع دليل خطوة بخطوة لزراعة المحصول المحدد'
      operationId: get_planting_guide_v1_crop_details__crop_id__planting_guide_get
      parameters:
      - in: path
        name: crop_id
        required: true
        schema:
          title: Crop Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Planting Guide
      tags:
      - Crops
  /v1/crops:
    get:
      description: قائمة المحاصيل المدعومة
      operationId: list_supported_crops_v1_crops_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: List Supported Crops
      tags:
      - Crops
  /v1/current-season:
    get:
      description: الحصول على الموسم الزراعي الحالي
      operationId: get_current_season_info_v1_current_season_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonInfo'
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Get Current Season Info
      tags:
      - Calendar
  /v1/date/{date_str}:
    get:
      description: 'الحصول على البيانات الفلكية لتاريخ محدد


        المعطيات:

        - date_str: التاريخ بصيغة YYYY-MM-DD'
      operationId: get_date_v1_date__date_str__get
      parameters:
      - in: path
        name: date_str
        required: true
        schema:
          title: Date Str
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyAstronomicalData'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Date
      tags:
      - Calendar
  /v1/hijri:
    get:
      description: تحويل تاريخ ميلادي إلى هجري
      operationId: get_hijri_date_v1_hijri_get
      parameters:
      - description: التاريخ الميلادي (YYYY-MM-DD)
        in: query
        name: date_str
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: التاريخ الميلادي (YYYY-MM-DD)
          title: Date Str
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HijriDate'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Hijri Date
      tags:
      - Calendar
  /v1/hijri-months:
    get:
      description: قائمة الأشهر الهجرية
      operationId: list_hijri_months_v1_hijri_months_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: List Hijri Months
      tags:
      - Reference
  /v1/integration/weather:
    get:
      description: 'دمج البيانات الفلكية مع بيانات الطقس


        يتصل بخدمة الطقس للحصول على بيانات متكاملة'
      operationId: get_integrated_data_v1_integration_weather_get
      parameters:
      - description: معرف الموقع
        in: query
        name: location_id
        required: false
        schema:
          default: sanaa
          description: معرف الموقع
          title: Location Id
          type: string
      - description: التاريخ (YYYY-MM-DD)
        in: query
        name: date_str
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: التاريخ (YYYY-MM-DD)
          title: Date Str
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Integrated Data
      tags:
      - Integration
  /v1/landmarks:
    get:
      description: 'قائمة المعالم الزراعية اليمنية التاريخية


        تشمل:

        - المدرجات الجبلية

        - السدود التاريخية

        - أنظمة الري التقليدية

        - مخازن الحبوب والمحاصيل


        هذه المعالم تمثل التراث الزراعي اليمني العريق'
      operationId: get_landmarks_v1_landmarks_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Get Landmarks
      tags:
      - Yemeni Heritage
  /v1/landmarks/{category}:
    get:
      description: 'المعالم حسب الفئة


        الفئات المتاحة:

        - terraces: المدرجات الجبلية

        - dams: السدود التاريخية

        - water_systems: أنظمة الري التقليدية

        - storage: أنظمة التخزين'
      operationId: get_landmarks_by_category_v1_landmarks__category__get
      parameters:
      - in: path
        name: category
        required: true
        schema:
          title: Category
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Landmarks By Category
      tags:
      - Yemeni Heritage
  /v1/landmarks/{category}/{landmark_name}:
    get:
      description: 'الحصول على معلومات معلم محدد


        مثال: /v1/landmarks/dams/سد مأرب'
      operationId: get_specific_landmark_v1_landmarks__category___landmark_name__get
      parameters:
      - in: path
        name: category
        required: true
        schema:
          title: Category
          type: string
      - in: path
        name: landmark_name
        required: true
        schema:
          title: Landmark Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Specific Landmark
      tags:
      - Yemeni Heritage
  /v1/lunar-mansion:
    get:
      description: الحصول على المنزلة القمرية الحالية
      operationId: get_lunar_mansion_v1_lunar_mansion_get
      parameters:
      - description: التاريخ (YYYY-MM-DD)
        in: query
        name: date_str
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: التاريخ (YYYY-MM-DD)
          title: Date Str
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LunarMansion'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Lunar Mansion
      tags:
      - Astronomy
  /v1/lunar-mansions:
    get:
      description: قائمة جميع المنازل القمرية الـ 28
      operationId: list_lunar_mansions_v1_lunar_mansions_get
      responses:
        '200':
          content:
