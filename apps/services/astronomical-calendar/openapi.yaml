      summary: Get Mansion Proverbs
      description: الحصول على الأمثال المرتبطة بمنزلة قمرية معينة
      operationId: get_mansion_proverbs_v1_proverbs_mansion__mansion_name__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
