    get:
      tags:
      - Health
      summary: Health
      description: Health check with dependencies
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /healthz:
    get:
      tags:
      - Health
      summary: Healthz
      description: Kubernetes liveness probe
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
