components:
  schemas:
    AuditLogCreate:
      description: Validated request body for creating audit log entries
      properties:
        action:
          default: unknown
          maxLength: 200
          title: Action
          type: string
        category:
          default: general
          maxLength: 100
          title: Category
          type: string
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
        resource_id:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Resource Id
        resource_type:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Resource Type
        severity:
          default: info
          pattern: ^(info|warning|error|critical)$
          title: Severity
          type: string
      title: AuditLogCreate
      type: object
    AuditLogResponse:
      description: Audit log entry response (camelCase aliases for frontend)
      properties:
        action:
          title: Action
          type: string
        category:
          title: Category
          type: string
        correlationId:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlationid
        createdAt:
          title: Createdat
          type: string
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
        entryHash:
          anyOf:
          - type: string
          - type: 'null'
          title: Entryhash
        errorCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Errorcode
        errorMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Errormessage
        id:
          title: Id
          type: string
        ipAddress:
          anyOf:
          - type: string
          - type: 'null'
          title: Ipaddress
        newValue:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Newvalue
        oldValue:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Oldvalue
        resourceId:
          anyOf:
          - type: string
          - type: 'null'
          title: Resourceid
        resourceType:
          anyOf:
          - type: string
          - type: 'null'
          title: Resourcetype
        severity:
          title: Severity
          type: string
        success:
          default: true
          title: Success
          type: boolean
        tenantId:
          title: Tenantid
          type: string
        userId:
          title: Userid
          type: string
      required:
      - id
      - tenantId
      - userId
      - action
      - category
      - severity
      - createdAt
      title: AuditLogResponse
      type: object
    AuditStatsResponse:
      description: Audit statistics response (camelCase aliases for frontend)
      properties:
        chainCoveragePercent:
          title: Chaincoveragepercent
          type: number
        eventsByCategory:
          additionalProperties: true
          title: Eventsbycategory
          type: object
        eventsBySeverity:
          additionalProperties: true
          title: Eventsbyseverity
          type: object
        failedEvents:
          title: Failedevents
          type: integer
        totalEvents:
          title: Totalevents
          type: integer
        uniqueUsers:
          title: Uniqueusers
          type: integer
      required:
      - totalEvents
      - eventsByCategory
      - eventsBySeverity
      - failedEvents
      - uniqueUsers
      - chainCoveragePercent
      title: AuditStatsResponse
      type: object
    ComplianceReportResponse:
      description: Compliance report response
      properties:
        by_category:
          additionalProperties: true
          title: By Category
          type: object
        by_severity:
          additionalProperties: true
          title: By Severity
          type: object
        chain_integrity:
          additionalProperties: true
          title: Chain Integrity
          type: object
        framework:
          title: Framework
          type: string
        period:
          additionalProperties: true
          title: Period
          type: object
        report_generated:
          title: Report Generated
          type: string
        summary:
          additionalProperties: true
          title: Summary
          type: object
        tenant_id:
          title: Tenant Id
          type: string
      required:
      - tenant_id
      - report_generated
      - period
      - framework
      - summary
      - by_category
      - by_severity
      - chain_integrity
      title: ComplianceReportResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HashChainValidationResponse:
      description: Hash chain validation result
      properties:
        errors:
          items:
            type: string
          title: Errors
          type: array
        invalid_entries:
          items:
            type: string
          title: Invalid Entries
          type: array
        retention_gaps_crossed:
          default: 0
          title: Retention Gaps Crossed
          type: integer
        total_entries:
          title: Total Entries
          type: integer
        valid:
          title: Valid
          type: boolean
        validated_entries:
          title: Validated Entries
          type: integer
      required:
      - valid
      - total_entries
      - validated_entries
      - invalid_entries
      - errors
      title: HashChainValidationResponse
      type: object
    PaginatedResponse:
      description: Paginated response wrapper
      properties:
        has_more:
          title: Has More
          type: boolean
        items:
          items: {}
          title: Items
          type: array
        limit:
          title: Limit
          type: integer
        skip:
          title: Skip
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - skip
      - limit
      - has_more
      title: PaginatedResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: "\n    خدمة التدقيق والمراجعة المركزية\n\n    Centralized Audit Logging Service for Security Compliance\n\n    Features:\n    - سلسلة التجزئة للتحقق من السلامة (Hash Chain Integrity)\n    - تتبع التغييرات على مستوى الحقل (Field-Level Tracking)\n    - تقارير الامتثال (Compliance Reporting)\n    - تنبيهات الأمان في الوقت الفعلي (Real-time Security Alerts)\n    "
  title: SAHOOL Audit Service
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/audit/chain/summary:
    get:
      description: 'Get hash chain summary for tenant


        جلب ملخص سلسلة التجزئة للمستأجر'
      operationId: get_chain_summary_api_v1_audit_chain_summary_get
      parameters:
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Chain Summary
      tags:
      - Hash Chain
  /api/v1/audit/chain/validate:
