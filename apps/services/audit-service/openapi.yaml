components:
  schemas:
    AuditLogCreate:
      properties:
        action:
          type: string
          maxLength: 200
          title: Action
          default: unknown
        category:
          type: string
          maxLength: 100
          title: Category
          default: general
        severity:
          type: string
          pattern: ^(info|warning|error|critical)$
          title: Severity
          default: info
        resource_type:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Resource Type
        resource_id:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Resource Id
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
      type: object
      title: AuditLogCreate
      description: Validated request body for creating audit log entries
    AuditLogResponse:
      properties:
        id:
          type: string
          title: Id
        tenantId:
          type: string
          title: Tenantid
        userId:
          type: string
          title: Userid
        action:
          type: string
          title: Action
        category:
          type: string
          title: Category
        severity:
          type: string
          title: Severity
        resourceType:
          anyOf:
          - type: string
          - type: 'null'
          title: Resourcetype
        resourceId:
          anyOf:
          - type: string
          - type: 'null'
          title: Resourceid
        correlationId:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlationid
        ipAddress:
          anyOf:
          - type: string
          - type: 'null'
          title: Ipaddress
        success:
          type: boolean
          title: Success
          default: true
        errorCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Errorcode
        errorMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Errormessage
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
        oldValue:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Oldvalue
        newValue:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Newvalue
        entryHash:
          anyOf:
          - type: string
          - type: 'null'
          title: Entryhash
        createdAt:
          type: string
          title: Createdat
      type: object
      required:
      - id
      - tenantId
      - userId
      - action
      - category
      - severity
      - createdAt
      title: AuditLogResponse
      description: Audit log entry response (camelCase aliases for frontend)
    AuditStatsResponse:
      properties:
        totalEvents:
          type: integer
          title: Totalevents
        eventsByCategory:
          additionalProperties: true
          type: object
          title: Eventsbycategory
        eventsBySeverity:
          additionalProperties: true
          type: object
          title: Eventsbyseverity
        failedEvents:
          type: integer
          title: Failedevents
        uniqueUsers:
          type: integer
          title: Uniqueusers
        chainCoveragePercent:
          type: number
          title: Chaincoveragepercent
      type: object
      required:
      - totalEvents
      - eventsByCategory
      - eventsBySeverity
      - failedEvents
      - uniqueUsers
