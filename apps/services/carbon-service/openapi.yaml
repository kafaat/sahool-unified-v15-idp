components:
  schemas:
    CarbonBreakdownResponse:
      properties:
        biochar_seq:
          title: Biochar Seq
          type: number
        cover_cropping_seq:
          title: Cover Cropping Seq
          type: number
        fertilizer_k:
          title: Fertilizer K
          type: number
        fertilizer_n:
          title: Fertilizer N
          type: number
        fertilizer_p:
          title: Fertilizer P
          type: number
        fuel:
          title: Fuel
          type: number
        machinery:
          title: Machinery
          type: number
        no_till_seq:
          title: No Till Seq
          type: number
        pesticide:
          title: Pesticide
          type: number
        residue_burning:
          title: Residue Burning
          type: number
      required:
      - fuel
      - fertilizer_n
      - fertilizer_p
      - fertilizer_k
      - machinery
      - pesticide
      - residue_burning
      - cover_cropping_seq
      - no_till_seq
      - biochar_seq
      title: CarbonBreakdownResponse
      type: object
    ComputeRequest:
      description: Stateless compute request — caller supplies all inputs inline.
      properties:
        area_hectares:
          anyOf:
          - type: number
          - type: 'null'
          title: Area Hectares
        biochar_tonnes:
          anyOf:
          - type: number
          - type: 'null'
          title: Biochar Tonnes
        duration_hours:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration Hours
        fuel_liters:
          anyOf:
          - type: number
          - type: 'null'
          title: Fuel Liters
        fuel_type:
          default: diesel
          title: Fuel Type
          type: string
        is_cover_cropping:
          default: false
          title: Is Cover Cropping
          type: boolean
        is_no_till:
          default: false
          title: Is No Till
          type: boolean
        is_residue_burning:
          default: false
          title: Is Residue Burning
          type: boolean
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        nitrogen_kg:
          anyOf:
          - type: number
          - type: 'null'
          title: Nitrogen Kg
        operation_id:
          description: Operation UUID or synthetic id
          title: Operation Id
          type: string
        operation_type:
          title: Operation Type
          type: string
        pesticide_kg:
          anyOf:
          - type: number
          - type: 'null'
          title: Pesticide Kg
        phosphorus_kg:
          anyOf:
          - type: number
          - type: 'null'
          title: Phosphorus Kg
        potassium_kg:
          anyOf:
          - type: number
          - type: 'null'
          title: Potassium Kg
      required:
      - operation_id
      - operation_type
      title: ComputeRequest
      type: object
    ComputeResponse:
      properties:
        breakdown:
          $ref: '#/components/schemas/CarbonBreakdownResponse'
        carbon_credit_eligible:
          title: Carbon Credit Eligible
          type: boolean
        emission_source_type:
          title: Emission Source Type
          type: string
        emissions_kg:
          title: Emissions Kg
          type: number
        methodology:
          title: Methodology
          type: string
        net_kg:
          title: Net Kg
          type: number
        operation_id:
          title: Operation Id
          type: string
        operation_type:
          title: Operation Type
          type: string
        sequestration_kg:
          title: Sequestration Kg
          type: number
        warnings:
          items:
            type: string
          title: Warnings
          type: array
      required:
      - operation_id
      - operation_type
      - emissions_kg
      - sequestration_kg
      - net_kg
      - methodology
      - emission_source_type
      - carbon_credit_eligible
      - breakdown
      - warnings
      title: ComputeResponse
      type: object
    CropSeasonCarbonSummary:
      properties:
        by_operation_type:
          additionalProperties:
            additionalProperties:
              type: number
            type: object
          title: By Operation Type
          type: object
        by_source:
          additionalProperties:
            type: number
          title: By Source
          type: object
        crop_season_id:
          title: Crop Season Id
          type: string
        crop_type:
          title: Crop Type
          type: string
        field_id:
          title: Field Id
          type: string
        sowing_date:
          title: Sowing Date
          type: string
        total_emissions_kg:
          title: Total Emissions Kg
          type: number
        total_net_kg:
          title: Total Net Kg
          type: number
        total_operations:
          title: Total Operations
          type: integer
        total_sequestration_kg:
          title: Total Sequestration Kg
          type: number
      required:
      - crop_season_id
      - field_id
      - crop_type
      - sowing_date
      - total_operations
      - total_emissions_kg
      - total_sequestration_kg
      - total_net_kg
      - by_source
      - by_operation_type
      title: CropSeasonCarbonSummary
      type: object
    FieldCarbonSummary:
      properties:
        by_source:
          additionalProperties:
            type: number
          title: By Source
          type: object
        currency:
          default: kgCO2e
          title: Currency
          type: string
        field_id:
          title: Field Id
          type: string
        first_operation_at:
          anyOf:
          - type: string
          - type: 'null'
          title: First Operation At
        last_operation_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Operation At
        total_emissions_kg:
          title: Total Emissions Kg
          type: number
        total_net_kg:
          title: Total Net Kg
          type: number
        total_operations:
          title: Total Operations
          type: integer
        total_sequestration_kg:
          title: Total Sequestration Kg
          type: number
      required:
      - field_id
      - total_operations
      - total_emissions_kg
      - total_sequestration_kg
      - total_net_kg
      - by_source
      - first_operation_at
      - last_operation_at
      title: FieldCarbonSummary
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: Agricultural carbon footprint (IPCC Tier 1) — خدمة البصمة الكربونية الزراعية
  title: carbon-service
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/carbon/compute:
    post:
      description: 'Stateless compute — runs the engine on a fully-populated request

        without touching the DB. Useful for what-if analysis from the web

        client ("if I halve my fertiliser, what happens to my emissions?").


        Requires a valid JWT; does NOT persist anything, so tenant header

        isn''t mandatory for this endpoint.'
      operationId: compute_stateless_api_v1_carbon_compute_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Compute Stateless
      tags:
      - Carbon - الكربون
  /api/v1/carbon/crop-seasons/{crop_season_id}/summary:
    get:
      description: Aggregate carbon data for all operations in a crop season.
      operationId: crop_season_summary_api_v1_carbon_crop_seasons__crop_season_id__summary_get
      parameters:
      - in: path
        name: crop_season_id
        required: true
        schema:
          title: Crop Season Id
          type: string
      - in: header
        name: x-tenant-id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropSeasonCarbonSummary'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Crop Season Summary
      tags:
      - Carbon - الكربون
  /api/v1/carbon/fields/{field_id}/summary:
    get:
      description: Aggregate carbon data for a single field across all operations.
      operationId: field_summary_api_v1_carbon_fields__field_id__summary_get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      - in: header
        name: x-tenant-id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldCarbonSummary'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Field Summary
      tags:
      - Carbon - الكربون
  /api/v1/carbon/operations/{operation_id}/compute:
    post:
      description: "DB-backed compute — reads the FieldOperation row from the\nfield-management-service DB, maps it into the engine's input shape\n(using operation_type + metadata + cost breakdown columns as a\nheuristic for inputs), runs the engine, and writes the result back\nonto the same row. Used by:\n\n  - The NATS subscriber when a new operation is recorded\n  - The admin API for re-computing after formula updates\n  - Batch backfill jobs"
      operationId: compute_for_operation_api_v1_carbon_operations__operation_id__compute_post
      parameters:
      - in: path
        name: operation_id
        required: true
        schema:
          title: Operation Id
          type: string
      - in: header
        name: x-tenant-id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Compute For Operation
      tags:
      - Carbon - الكربون
  /health:
    get:
      description: Comprehensive health check.
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Health Get
                type: object
          description: Successful Response
      summary: Health
  /healthz:
    get:
      description: Liveness probe.
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Healthz Healthz Get
                type: object
          description: Successful Response
      summary: Healthz
  /metrics:
    get:
      description: Prometheus metrics.
      operationId: metrics_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Metrics
  /readyz:
    get:
      description: Readiness probe — reports DB + NATS connection state.
      operationId: readyz_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Readyz Readyz Get
                type: object
          description: Successful Response
      summary: Readyz
