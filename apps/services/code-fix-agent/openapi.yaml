components:
  schemas:
    AgentResponse:
      description: استجابة الوكيل
      properties:
        action_type:
          title: Action Type
          type: string
        agent_id:
          title: Agent Id
          type: string
        confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Reasoning
        reasoning_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Reasoning Ar
        response_time_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Response Time Ms
        success:
          title: Success
          type: boolean
      required:
      - success
      - action_type
      - agent_id
      title: AgentResponse
      type: object
    AnalyzeCodeRequest:
      description: طلب تحليل الكود
      properties:
        code:
          description: Code snippet to analyze
          title: Code
          type: string
        context:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Additional context
          title: Context
        file_path:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional file path
          title: File Path
        language:
          default: python
          description: Programming language (python, typescript, dart)
          title: Language
          type: string
      required:
      - code
      title: AnalyzeCodeRequest
      type: object
    FixCodeRequest:
      description: طلب إصلاح الكود
      properties:
        code:
          description: Code with issue to fix
          title: Code
          type: string
        errors:
          description: Error information
          items:
            additionalProperties: true
            type: object
          title: Errors
          type: array
        language:
          default: python
          description: Programming language
          title: Language
          type: string
        strategy:
          default: minimal
          description: Fix strategy (minimal, comprehensive, refactor)
          title: Strategy
          type: string
      required:
      - code
      - errors
      title: FixCodeRequest
      type: object
    GenerateTestsRequest:
      description: طلب توليد الاختبارات
      properties:
        code:
          description: Code to generate tests for
          title: Code
          type: string
        coverage_target:
          default: 80
          description: Coverage target
          maximum: 100
          minimum: 0
          title: Coverage Target
          type: integer
        framework:
          anyOf:
          - type: string
          - type: 'null'
          description: Test framework
          title: Framework
        language:
          default: python
          description: Programming language
          title: Language
          type: string
      required:
      - code
      title: GenerateTestsRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ImplementFeatureRequest:
      description: طلب تنفيذ ميزة
      properties:
        design_patterns:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Patterns to use
          title: Design Patterns
        specification:
          additionalProperties: true
          description: Feature specification
          title: Specification
          type: object
        target_files:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Target files
          title: Target Files
      required:
      - specification
      title: ImplementFeatureRequest
      type: object
    ReviewPRRequest:
      description: طلب مراجعة طلب السحب
      properties:
        context_files:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Related files
          title: Context Files
        diff:
          description: PR diff content
          title: Diff
          type: string
        review_focus:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Focus areas (security, performance, style)
          title: Review Focus
      required:
      - diff
      title: ReviewPRRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: AI-powered code analysis, bug fixing, and implementation agent
  title: SAHOOL Code Fix Agent
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/agent/info:
    get:
      description: 'الحصول على معلومات الوكيل

        Get agent information'
      operationId: get_agent_info_api_v1_agent_info_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Get Agent Info
      tags:
      - Agent
  /api/v1/analyze:
    post:
      description: 'تحليل الكود واكتشاف المشاكل

        Analyze code and detect issues


        Analyzes the provided code snippet for:

        - Syntax errors

        - Security vulnerabilities

        - Performance issues

        - Style violations

        - Type errors'
      operationId: analyze_code_api_v1_analyze_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeCodeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Analyze Code
      tags:
      - Agent
  /api/v1/feedback:
    post:
      description: 'إرسال التغذية الراجعة للتعلم

        Submit feedback for learning


        Allows the agent to learn from fix results.'
      operationId: submit_feedback_api_v1_feedback_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              title: Feedback
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Submit Feedback
      tags:
      - Agent
  /api/v1/fix:
    post:
      description: 'إصلاح الكود تلقائياً

        Automatically fix code issues


        Generates and applies fixes for the provided errors.'
      operationId: fix_code_api_v1_fix_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixCodeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Fix Code
      tags:
      - Agent
  /api/v1/generate-tests:
    post:
      description: 'توليد اختبارات تلقائية

        Generate automated tests


        Generates unit tests for the provided code.'
      operationId: generate_tests_api_v1_generate_tests_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTestsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Generate Tests
      tags:
      - Agent
  /api/v1/implement:
    post:
      description: 'تنفيذ ميزة جديدة

        Implement new feature


        Implements a feature based on the provided specification.'
      operationId: implement_feature_api_v1_implement_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImplementFeatureRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Implement Feature
      tags:
      - Agent
  /api/v1/review:
    post:
      description: 'مراجعة طلب السحب

        Review pull request


        Analyzes PR changes and provides review comments.'
      operationId: review_pr_api_v1_review_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPRRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Review Pr
      tags:
      - Agent
  /health:
    get:
      description: 'Combined health check

        فحص الصحة الشامل'
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
      tags:
      - Health
  /health/live:
    get:
      description: 'Liveness probe

        فحص الحياة'
      operationId: liveness_health_live_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Liveness
      tags:
      - Health
  /health/ready:
    get:
      description: 'Readiness probe

        فحص الجاهزية'
      operationId: readiness_health_ready_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
      tags:
      - Health
  /healthz:
    get:
      description: 'Liveness probe

        فحص الحياة'
      operationId: liveness_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Liveness
      tags:
      - Health
  /metrics:
    get:
      description: 'Prometheus metrics

        مقاييس بروميثيوس'
      operationId: metrics_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Metrics
      tags:
      - Health
  /readyz:
    get:
      description: 'Readiness probe

        فحص الجاهزية'
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
      tags:
      - Health
