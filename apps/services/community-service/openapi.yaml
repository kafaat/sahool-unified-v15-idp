components:
  schemas:
    AdvisoryBotMessage:
      description: Post an advisory bot message | نشر رسالة بوت استشاري
      properties:
        advisory_type:
          description: 'Advisory type: irrigation | crop-diseases | pest-management | weather-alerts | market-prices | best-practices'
          title: Advisory Type
          type: string
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Additional metadata
          title: Metadata
        severity:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Alert severity: info | warning | critical'
          title: Severity
        source:
          anyOf:
          - type: string
          - type: 'null'
          description: Advisory source service
          title: Source
        text:
          description: Advisory text | نص الاستشارة
          maxLength: 5000
          minLength: 1
          title: Text
          type: string
        text_ar:
          anyOf:
          - maxLength: 5000
            type: string
          - type: 'null'
          description: Arabic advisory text | النص بالعربية
          title: Text Ar
      required:
      - advisory_type
      - text
      title: AdvisoryBotMessage
      type: object
    AlertBotMessage:
      description: Post a weather/pest alert | نشر تنبيه طقس/آفات
      properties:
        affected_area:
          anyOf:
          - type: string
          - type: 'null'
          description: Affected geographic area
          title: Affected Area
        alert_type:
          description: 'Alert type: weather | pest | disease | frost | flood | heatwave'
          title: Alert Type
          type: string
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          description: Alert expiry ISO timestamp
          title: Expires At
        severity:
          default: warning
          description: 'Severity: info | warning | critical'
          title: Severity
          type: string
        text:
          description: Alert body | نص التنبيه
          maxLength: 5000
          minLength: 1
          title: Text
          type: string
        text_ar:
          anyOf:
          - maxLength: 5000
            type: string
          - type: 'null'
          description: Arabic alert body | النص بالعربية
          title: Text Ar
        title:
          description: Alert title | عنوان التنبيه
          maxLength: 200
          title: Title
          type: string
        title_ar:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          description: Arabic title | العنوان بالعربية
          title: Title Ar
      required:
      - alert_type
      - title
      - text
      title: AlertBotMessage
      type: object
    ChannelCreate:
      description: Create a new community channel | إنشاء قناة مجتمع جديدة
      properties:
        description:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          description: Channel description
          title: Description
        description_ar:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          description: وصف القناة بالعربية
          title: Description Ar
        members:
          description: Initial member usernames
          items:
            type: string
          title: Members
          type: array
        name:
          description: Channel name (English)
          maxLength: 64
          minLength: 2
          title: Name
          type: string
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          description: Channel name (Arabic) | اسم القناة بالعربية
          title: Name Ar
        read_only:
          default: false
          description: Read-only channel | قناة للقراءة فقط
          title: Read Only
          type: boolean
        topic:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Topic
      required:
      - name
      title: ChannelCreate
      type: object
    ChannelResponse:
      description: Channel information | معلومات القناة
      properties:
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Description Ar
        id:
          title: Id
          type: string
        members_count:
          default: 0
          title: Members Count
          type: integer
        name:
          title: Name
          type: string
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
        read_only:
          default: false
          title: Read Only
          type: boolean
        topic:
          anyOf:
          - type: string
          - type: 'null'
          title: Topic
      required:
      - id
      - name
      title: ChannelResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    MessagePost:
      description: Post a message to a channel | نشر رسالة في قناة
      properties:
        alias:
          anyOf:
          - type: string
          - type: 'null'
          description: Display name override
          title: Alias
        attachments:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          description: Message attachments
          title: Attachments
        channel_id:
          description: Target channel ID or name
          title: Channel Id
          type: string
        emoji:
          anyOf:
          - type: string
          - type: 'null'
          description: Avatar emoji
          title: Emoji
        text:
          description: Message text | نص الرسالة
          maxLength: 5000
          minLength: 1
          title: Text
          type: string
      required:
      - channel_id
      - text
      title: MessagePost
      type: object
    MessageResponse:
      description: Message information | معلومات الرسالة
      properties:
        channel_id:
          title: Channel Id
          type: string
        id:
          title: Id
          type: string
        text:
          title: Text
          type: string
        timestamp:
          anyOf:
          - type: string
          - type: 'null'
          title: Timestamp
        user:
          anyOf:
          - type: string
          - type: 'null'
          title: User
      required:
      - id
      - channel_id
      - text
      title: MessageResponse
      type: object
    MessageSearchRequest:
      description: Search messages in a channel | البحث في رسائل القناة
      properties:
        channel_id:
          description: Channel ID to search in
          title: Channel Id
          type: string
        query:
          description: Search query | نص البحث
          maxLength: 200
          minLength: 1
          title: Query
          type: string
      required:
      - channel_id
      - query
      title: MessageSearchRequest
      type: object
    TenantSetupRequest:
      description: Initialize tenant community workspace | تهيئة مساحة عمل المجتمع للمستأجر
      properties:
        admin_email:
          anyOf:
          - type: string
          - type: 'null'
          description: Tenant admin email
          title: Admin Email
        admin_username:
          anyOf:
          - type: string
          - type: 'null'
          description: Tenant admin username
          title: Admin Username
        extra_channels:
          description: Additional channels beyond defaults
          items:
            $ref: '#/components/schemas/ChannelCreate'
          title: Extra Channels
          type: array
        tenant_id:
          description: Tenant UUID
          title: Tenant Id
          type: string
        tenant_name:
          description: Tenant display name | اسم المستأجر
          title: Tenant Name
          type: string
      required:
      - tenant_id
      - tenant_name
      title: TenantSetupRequest
      type: object
    TenantSetupResponse:
      description: Tenant setup result | نتيجة تهيئة المستأجر
      properties:
        admin_synced:
          default: false
          title: Admin Synced
          type: boolean
        channels:
          items:
            $ref: '#/components/schemas/ChannelResponse'
          title: Channels
          type: array
        channels_created:
          title: Channels Created
          type: integer
        tenant_id:
          title: Tenant Id
          type: string
      required:
      - tenant_id
      - channels_created
      - channels
      title: TenantSetupResponse
      type: object
    UserSyncRequest:
      description: Sync a SAHOOL user to Rocket.Chat | مزامنة مستخدم سهول مع روكيت شات
      properties:
        avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Avatar URL
          title: Avatar Url
        email:
          description: User email
          title: Email
          type: string
        name:
          description: Display name | الاسم المعروض
          title: Name
          type: string
        password:
          anyOf:
          - type: string
          - type: 'null'
          description: Password (generated if empty)
          title: Password
        roles:
          description: Rocket.Chat roles
          items:
            type: string
          title: Roles
          type: array
        username:
          description: Username
          title: Username
          type: string
      required:
      - email
      - name
      - username
      title: UserSyncRequest
      type: object
    UserSyncResponse:
      description: User sync result | نتيجة مزامنة المستخدم
      properties:
        rc_user_id:
          title: Rc User Id
          type: string
        synced:
          default: true
          title: Synced
          type: boolean
        username:
          title: Username
          type: string
      required:
      - rc_user_id
      - username
      title: UserSyncResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: Rocket.Chat integration for farmer community messaging - خدمة المجتمع الزراعي
  title: SAHOOL Community Service
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/community/bots/advisory:
    post:
      description: 'Post advisory bot message to relevant channel.

        نشر رسالة بوت استشاري في القناة المناسبة'
      operationId: post_advisory_api_v1_community_bots_advisory_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisoryBotMessage'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Post Advisory
      tags:
      - Bots
  /api/v1/community/bots/alert:
    post:
      description: 'Post weather/pest alert to relevant channel.

        نشر تنبيه طقس/آفات في القناة المناسبة'
      operationId: post_alert_api_v1_community_bots_alert_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertBotMessage'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Post Alert
      tags:
      - Bots
  /api/v1/community/channels:
    get:
      description: List community channels | عرض قنوات المجتمع
      operationId: list_channels_api_v1_community_channels_get
      parameters:
      - in: query
        name: count
        required: false
        schema:
          default: 100
          maximum: 500
          minimum: 1
          title: Count
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List Channels
      tags:
      - Channels
    post:
      description: Create a community channel | إنشاء قناة مجتمع
      operationId: create_channel_api_v1_community_channels_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Channel
      tags:
      - Channels
  /api/v1/community/channels/{channel_id}/history:
    get:
      description: Get channel message history | عرض سجل رسائل القناة
      operationId: get_channel_history_api_v1_community_channels__channel_id__history_get
      parameters:
      - in: path
        name: channel_id
        required: true
        schema:
          title: Channel Id
          type: string
      - in: query
        name: count
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Count
          type: integer
      - description: ISO timestamp for oldest message
        in: query
        name: oldest
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO timestamp for oldest message
          title: Oldest
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Channel History
      tags:
      - Messages
  /api/v1/community/channels/{channel_id}/join:
    post:
      description: Join a community channel | الانضمام إلى قناة
      operationId: join_channel_api_v1_community_channels__channel_id__join_post
      parameters:
      - in: path
        name: channel_id
        required: true
        schema:
          title: Channel Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Join Channel
      tags:
      - Channels
  /api/v1/community/channels/{channel_id}/leave:
    post:
      description: Leave a community channel | مغادرة قناة
      operationId: leave_channel_api_v1_community_channels__channel_id__leave_post
      parameters:
      - in: path
        name: channel_id
        required: true
        schema:
          title: Channel Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Leave Channel
      tags:
      - Channels
  /api/v1/community/channels/{channel_id}/members:
    get:
      description: Get channel members | عرض أعضاء القناة
      operationId: get_channel_members_api_v1_community_channels__channel_id__members_get
      parameters:
      - in: path
        name: channel_id
        required: true
        schema:
          title: Channel Id
          type: string
      - in: query
        name: count
        required: false
        schema:
          default: 100
          maximum: 500
          minimum: 1
          title: Count
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Channel Members
      tags:
      - Channels
  /api/v1/community/messages:
    post:
      description: Post a message to a channel | نشر رسالة في قناة
      operationId: post_message_api_v1_community_messages_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessagePost'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Post Message
      tags:
      - Messages
  /api/v1/community/messages/search:
    post:
      description: Search messages in a channel | البحث في رسائل القناة
      operationId: search_messages_api_v1_community_messages_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSearchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Search Messages
      tags:
      - Messages
  /api/v1/community/setup-tenant:
    post:
      description: 'Initialize tenant community workspace - تهيئة مساحة عمل المجتمع للمستأجر


        Creates all default agricultural channels for a tenant and optionally syncs

        an admin user to Rocket.Chat.'
      operationId: setup_tenant_api_v1_community_setup_tenant_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantSetupRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSetupResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Setup Tenant
      tags:
      - Tenant
  /api/v1/community/users/sync:
    post:
      description: Sync a SAHOOL user to Rocket.Chat | مزامنة مستخدم سهول مع روكيت شات
      operationId: sync_user_api_v1_community_users_sync_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSyncRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSyncResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Sync User
      tags:
      - Users
  /health:
    get:
      description: Combined health status.
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
      tags:
      - Health
  /healthz:
    get:
      description: Liveness probe.
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Healthz
      tags:
      - Health
  /metrics:
    get:
      description: Prometheus metrics endpoint.
      operationId: metrics_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Metrics
      tags:
      - Monitoring
  /readyz:
    get:
      description: Readiness probe.
      operationId: readyz_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readyz
      tags:
      - Health
