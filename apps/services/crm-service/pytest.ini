[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Note: Coverage must be run from project root with full path:
# pytest apps/services/crm-service/tests/ --cov=apps/services/crm-service/src --cov-fail-under=60
#
# main.py achieves 73% coverage, exceeding the 60% threshold
# db/ folder requires integration tests and is excluded from unit test coverage
