components:
  schemas:
    FieldState:
      description: Current state of a field's digital twin.
      properties:
        air_temp_c:
          default: 25.0
          title: Air Temp C
          type: number
        biomass_kg_ha:
          default: 500.0
          title: Biomass Kg Ha
          type: number
        canopy_cover_pct:
          default: 40.0
          title: Canopy Cover Pct
          type: number
        crop:
          default: wheat
          title: Crop
          type: string
        cumulative_et_mm:
          default: 80.0
          title: Cumulative Et Mm
          type: number
        cumulative_irrigation_mm:
          default: 100.0
          title: Cumulative Irrigation Mm
          type: number
        cumulative_rainfall_mm:
          default: 20.0
          title: Cumulative Rainfall Mm
          type: number
        days_after_planting:
          default: 30
          title: Days After Planting
          type: integer
        et0_mm_day:
          default: 5.0
          title: Et0 Mm Day
          type: number
        field_id:
          title: Field Id
          type: string
        growth_stage:
          default: vegetative
          title: Growth Stage
          type: string
        humidity_pct:
          default: 50.0
          title: Humidity Pct
          type: number
        lai:
          default: 2.0
          description: Leaf Area Index
          title: Lai
          type: number
        soil_ec_dsm:
          default: 1.0
          description: Soil EC (dS/m)
          title: Soil Ec Dsm
          type: number
        soil_k_ppm:
          default: 100.0
          title: Soil K Ppm
          type: number
        soil_moisture_pct:
          default: 50.0
          description: Volumetric water content (%)
          title: Soil Moisture Pct
          type: number
        soil_n_ppm:
          default: 25.0
          title: Soil N Ppm
          type: number
        soil_p_ppm:
          default: 15.0
          title: Soil P Ppm
          type: number
        soil_temperature_c:
          default: 20.0
          title: Soil Temperature C
          type: number
        timestamp:
          format: date-time
          title: Timestamp
          type: string
      required:
      - field_id
      title: FieldState
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    OptimizationObjective:
      enum:
      - minimize_water
      - maximize_yield
      - minimize_cost
      - minimize_environmental
      - balanced
      title: OptimizationObjective
      type: string
    OptimizationRequest:
      description: Multi-objective optimization request.
      properties:
        climate_zone:
          anyOf:
          - type: string
          - type: 'null'
          title: Climate Zone
        constraints:
          additionalProperties: true
          title: Constraints
          type: object
        days:
          default: 90
          maximum: 365
          minimum: 1
          title: Days
          type: integer
        field_state:
          $ref: '#/components/schemas/FieldState'
        objectives:
          default:
          - balanced
          items:
            $ref: '#/components/schemas/OptimizationObjective'
          title: Objectives
          type: array
      required:
      - field_state
      title: OptimizationRequest
      type: object
    OptimizationResult:
      description: Optimization result.
      properties:
        crop:
          title: Crop
          type: string
        field_id:
          title: Field Id
          type: string
        metrics:
          additionalProperties: true
          title: Metrics
          type: object
        objectives:
          items:
            type: string
          title: Objectives
          type: array
        optimal_schedule:
          items:
            additionalProperties: true
            type: object
          title: Optimal Schedule
          type: array
        pareto_solutions:
          items:
            additionalProperties: true
            type: object
          title: Pareto Solutions
          type: array
        recommendation:
          title: Recommendation
          type: string
        recommendation_ar:
          title: Recommendation Ar
          type: string
      required:
      - field_id
      - crop
      - objectives
      - optimal_schedule
      - metrics
      - pareto_solutions
      - recommendation
      - recommendation_ar
      title: OptimizationResult
      type: object
    ScenarioComparison:
      description: Comparison result of multiple scenarios.
      properties:
        best_for_cost:
          title: Best For Cost
          type: string
        best_for_water:
          title: Best For Water
          type: string
        best_for_yield:
          title: Best For Yield
          type: string
        crop:
          title: Crop
          type: string
        field_id:
          title: Field Id
          type: string
        recommendation_reason:
          title: Recommendation Reason
          type: string
        recommendation_reason_ar:
          title: Recommendation Reason Ar
          type: string
        recommended:
          title: Recommended
          type: string
        scenarios:
          items:
            additionalProperties: true
            type: object
          title: Scenarios
          type: array
      required:
      - field_id
      - crop
      - scenarios
      - best_for_water
      - best_for_yield
      - best_for_cost
      - recommended
      - recommendation_reason
      - recommendation_reason_ar
      title: ScenarioComparison
      type: object
    ScenarioRequest:
      description: Request to compare multiple scenarios.
      properties:
        climate_zone:
          anyOf:
          - type: string
          - type: 'null'
          title: Climate Zone
        days:
          default: 90
          maximum: 365
          minimum: 1
          title: Days
          type: integer
        field_state:
          $ref: '#/components/schemas/FieldState'
        scenarios:
          description: List of {name, irrigation_schedule, description}
          items:
            additionalProperties: true
            type: object
          title: Scenarios
          type: array
      required:
      - field_state
      - scenarios
      title: ScenarioRequest
      type: object
    SimulationDay:
      description: Simulated state for a single day.
      properties:
        biomass_kg_ha:
          title: Biomass Kg Ha
          type: number
        canopy_cover_pct:
          title: Canopy Cover Pct
          type: number
        cumulative_water_mm:
          title: Cumulative Water Mm
          type: number
        date:
          format: date
          title: Date
          type: string
        day:
          title: Day
          type: integer
        drainage_mm:
          title: Drainage Mm
          type: number
        etc_mm:
          title: Etc Mm
          type: number
        irrigation_mm:
          title: Irrigation Mm
          type: number
        lai:
          title: Lai
          type: number
        rainfall_mm:
          title: Rainfall Mm
          type: number
        salinity_stress:
          title: Salinity Stress
          type: number
        soil_ec_dsm:
          title: Soil Ec Dsm
          type: number
        soil_moisture_pct:
          title: Soil Moisture Pct
          type: number
        water_stress:
          title: Water Stress
          type: number
        yield_estimate_pct:
          title: Yield Estimate Pct
          type: number
      required:
      - day
      - date
      - soil_moisture_pct
      - soil_ec_dsm
      - etc_mm
      - irrigation_mm
      - rainfall_mm
      - drainage_mm
      - lai
      - biomass_kg_ha
      - canopy_cover_pct
      - water_stress
      - salinity_stress
      - cumulative_water_mm
      - yield_estimate_pct
      title: SimulationDay
      type: object
    SimulationRequest:
      description: Request to simulate field state over time.
      properties:
        climate_zone:
          anyOf:
          - type: string
          - type: 'null'
          title: Climate Zone
        days_to_simulate:
          default: 30
          maximum: 365
          minimum: 1
          title: Days To Simulate
          type: integer
        field_state:
          $ref: '#/components/schemas/FieldState'
        irrigation_schedule:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          description: 'List of {day: int, amount_mm: float} irrigation events'
          title: Irrigation Schedule
        rainfall_forecast:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          description: 'List of {day: int, amount_mm: float} rainfall events'
          title: Rainfall Forecast
        soil_profile:
          anyOf:
          - type: string
          - type: 'null'
          title: Soil Profile
      required:
      - field_state
      title: SimulationRequest
      type: object
    SimulationResult:
      description: Complete simulation result.
      properties:
        crop:
          title: Crop
          type: string
        daily_states:
          items:
            $ref: '#/components/schemas/SimulationDay'
          title: Daily States
          type: array
        field_id:
          title: Field Id
          type: string
        final_yield_pct:
          title: Final Yield Pct
          type: number
        max_salinity_stress:
          title: Max Salinity Stress
          type: number
        max_water_stress:
          title: Max Water Stress
          type: number
        peak_lai:
          title: Peak Lai
          type: number
        simulation_days:
          title: Simulation Days
          type: integer
        total_drainage_mm:
          title: Total Drainage Mm
          type: number
        total_et_mm:
          title: Total Et Mm
          type: number
        total_irrigation_mm:
          title: Total Irrigation Mm
          type: number
        total_rainfall_mm:
          title: Total Rainfall Mm
          type: number
        water_use_efficiency:
          title: Water Use Efficiency
          type: number
      required:
      - field_id
      - crop
      - simulation_days
      - daily_states
      - total_irrigation_mm
      - total_rainfall_mm
      - total_et_mm
      - total_drainage_mm
      - final_yield_pct
      - water_use_efficiency
      - peak_lai
      - max_water_stress
      - max_salinity_stress
      title: SimulationResult
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: L3 agricultural digital twin for simulation, optimization, and decision support
  title: Digital Twin Engine
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/digital-twin/info:
    get:
      description: Get digital twin engine information and capabilities.
      operationId: get_dt_info_api_v1_digital_twin_info_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Get Dt Info
  /api/v1/digital-twin/optimize:
    post:
      description: 'Multi-objective optimization for irrigation scheduling.

        Optimizes across water usage, yield, cost, and environmental impact.'
      operationId: optimize_irrigation_api_v1_digital_twin_optimize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Optimize Irrigation
  /api/v1/digital-twin/scenarios:
    post:
      description: 'Compare multiple irrigation scenarios with what-if analysis.

        Returns comparison metrics and recommendation.'
      operationId: compare_scenarios_api_v1_digital_twin_scenarios_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioComparison'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Compare Scenarios
  /api/v1/digital-twin/simulate:
    post:
      description: 'Simulate field state over time with soil moisture, crop growth,

        and water balance modeling.'
      operationId: simulate_field_api_v1_digital_twin_simulate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Simulate Field
  /api/v1/digital-twin/state/update:
    post:
      description: 'Update digital twin state with real-time sensor data.

        Uses Kalman filter for state estimation.'
      operationId: update_field_state_api_v1_digital_twin_state_update_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldState'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update Field State
  /healthz:
    get:
      operationId: health_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /readyz:
    get:
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
