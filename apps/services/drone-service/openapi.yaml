          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/missions/{mission_id}/complete:
    post:
      tags:
      - missions
      summary: Complete Mission
      description: Complete mission - إكمال المهمة
      operationId: complete_mission_api_v1_missions__mission_id__complete_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
