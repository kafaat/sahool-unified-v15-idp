  /healthz:
    get:
      summary: Health
      description: Liveness probe - فحص الحياة
      operationId: health_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /readyz:
    get:
      summary: Readiness
      description: 'Readiness probe - فحص الجاهزية.


        In production/staging, ALL critical dependencies must be up for the

        service to accept traffic. Dev only requires at least one so local

        runs without real infra still succeed.'
      operationId: readiness_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      summary: Comprehensive Health
