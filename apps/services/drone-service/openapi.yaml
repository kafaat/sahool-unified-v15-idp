  /api/v1/missions/{mission_id}/start:
    post:
      tags:
      - missions
      summary: Start Mission
      description: Start mission execution - بدء تنفيذ المهمة
      operationId: start_mission_api_v1_missions__mission_id__start_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/missions/{mission_id}/pause:
    post:
      tags:
      - missions
      summary: Pause Mission
      description: Pause mission - إيقاف المهمة مؤقتاً
      operationId: pause_mission_api_v1_missions__mission_id__pause_post
      security:
      - OAuth2PasswordBearer: []
