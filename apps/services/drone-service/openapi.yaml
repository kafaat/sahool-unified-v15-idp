                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Delete Drone
      tags:
      - drones
    get:
      description: Get drone details - الحصول على تفاصيل الطائرة
      operationId: get_drone_api_v1_drones__drone_id__get
      parameters:
      - in: path
