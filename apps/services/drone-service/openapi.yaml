components:
  schemas:
    BoundsInput:
      properties:
        max_lat:
          title: Max Lat
          type: number
        max_lng:
          title: Max Lng
          type: number
        min_lat:
          title: Min Lat
          type: number
        min_lng:
          title: Min Lng
          type: number
      required:
      - min_lat
      - max_lat
      - min_lng
      - max_lng
      title: BoundsInput
      type: object
    Coordinate:
      properties:
        lat:
          title: Lat
          type: number
        lng:
          title: Lng
          type: number
      required:
      - lat
      - lng
      title: Coordinate
      type: object
    DroneCreate:
      properties:
        drone_type:
          default: custom
          title: Drone Type
          type: string
        max_flight_time_min:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Flight Time Min
        max_payload_kg:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Payload Kg
        model:
          title: Model
          type: string
        name:
          title: Name
          type: string
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
        serial_number:
          title: Serial Number
          type: string
        tank_capacity_l:
          anyOf:
          - type: number
          - type: 'null'
          title: Tank Capacity L
      required:
      - name
      - model
      - serial_number
      title: DroneCreate
      type: object
    DroneResponse:
      properties:
        drone_type:
          title: Drone Type
          type: string
        id:
          title: Id
          type: string
        model:
          title: Model
          type: string
        name:
          title: Name
          type: string
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
        serial_number:
          title: Serial Number
          type: string
        status:
          default: active
          title: Status
          type: string
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      required:
      - id
      - name
      - model
      - serial_number
      - drone_type
      title: DroneResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    MappingFlightRequest:
      properties:
        boundary:
          items:
            $ref: '#/components/schemas/Coordinate'
          title: Boundary
          type: array
        field_id:
          title: Field Id
          type: string
        frontal_overlap:
          default: 80.0
          title: Frontal Overlap
          type: number
        gsd_cm_px:
          default: 2.0
          title: Gsd Cm Px
          type: number
        name:
          title: Name
          type: string
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
        side_overlap:
          default: 70.0
          title: Side Overlap
          type: number
      required:
      - field_id
      - boundary
      - name
      title: MappingFlightRequest
      type: object
    MissionCreate:
      properties:
        drone_id:
          title: Drone Id
          type: string
        field_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Field Id
        flight_plan_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Flight Plan Id
        mission_type:
          default: spray
          title: Mission Type
          type: string
        name:
          title: Name
          type: string
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
      required:
      - drone_id
      - name
      title: MissionCreate
      type: object
    MissionResponse:
      properties:
        drone_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Drone Id
        id:
          title: Id
          type: string
        mission_type:
          title: Mission Type
          type: string
        name:
          title: Name
          type: string
        status:
          title: Status
          type: string
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      required:
      - id
      - mission_type
      - name
      - status
      title: MissionResponse
      type: object
    NDVIPrescriptionRequest:
      properties:
        base_rate_l_ha:
          default: 10.0
          title: Base Rate L Ha
          type: number
        bounds:
          $ref: '#/components/schemas/BoundsInput'
        field_id:
          title: Field Id
          type: string
        name:
          default: NDVI Prescription
          title: Name
          type: string
        name_ar:
          default: وصفة NDVI
          title: Name Ar
          type: string
        ndvi_grid:
          items:
            items:
              type: number
            type: array
          title: Ndvi Grid
          type: array
      required:
      - field_id
      - ndvi_grid
      - bounds
      title: NDVIPrescriptionRequest
      type: object
    ResourceEstimateRequest:
      properties:
        area_ha:
          title: Area Ha
          type: number
        flight_time_per_tank_min:
          default: 15.0
          title: Flight Time Per Tank Min
          type: number
        spray_rate_l_ha:
          default: 10.0
          title: Spray Rate L Ha
          type: number
        tank_capacity_l:
          default: 20.0
          title: Tank Capacity L
          type: number
      required:
      - area_ha
      title: ResourceEstimateRequest
      type: object
    SpotSprayRequest:
      properties:
        base_rate_l_ha:
          default: 5.0
          title: Base Rate L Ha
          type: number
        boundary:
          items:
            $ref: '#/components/schemas/Coordinate'
          title: Boundary
          type: array
        detection_points:
          items:
            additionalProperties: true
            type: object
          title: Detection Points
          type: array
        detection_type:
          default: weed
          title: Detection Type
          type: string
        field_id:
          title: Field Id
          type: string
        name:
          default: Spot Spray Map
          title: Name
          type: string
        name_ar:
          default: خريطة الرش النقطي
          title: Name Ar
          type: string
      required:
      - field_id
      - detection_points
      - boundary
      title: SpotSprayRequest
      type: object
    SprayFlightRequest:
      properties:
        altitude_m:
          default: 3.0
          title: Altitude M
          type: number
        boundary:
          items:
            $ref: '#/components/schemas/Coordinate'
          title: Boundary
          type: array
        field_id:
          title: Field Id
          type: string
        name:
          title: Name
          type: string
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
        spray_rate_l_ha:
          default: 10.0
          title: Spray Rate L Ha
          type: number
        swath_width_m:
          default: 5.0
          title: Swath Width M
          type: number
      required:
      - field_id
      - boundary
      - name
      title: SprayFlightRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WeatherCheckRequest:
      properties:
        humidity_percent:
          default: 50.0
          title: Humidity Percent
          type: number
        lat:
          title: Lat
          type: number
        lng:
          title: Lng
          type: number
        precipitation_mm:
          default: 0.0
          title: Precipitation Mm
          type: number
        temperature_c:
          default: 25.0
          title: Temperature C
          type: number
        wind_speed_ms:
          default: 0.0
          title: Wind Speed Ms
          type: number
      required:
      - lat
      - lng
      title: WeatherCheckRequest
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: Drone integration and management - تكامل وإدارة الطائرات المسيرة
  title: drone-service
  version: 16.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: Root endpoint - نقطة نهاية الجذر
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
  /api/v1/drones/:
    get:
      description: List all registered drones - قائمة بجميع الطائرات المسجلة
      operationId: list_drones_api_v1_drones__get
      parameters:
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - in: query
        name: limit
        required: false
        schema:
          default: 500
          maximum: 1000
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DroneResponse'
                title: Response List Drones Api V1 Drones  Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List Drones
      tags:
      - drones
    post:
      description: Register a new drone - تسجيل طائرة جديدة
      operationId: register_drone_api_v1_drones__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DroneCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DroneResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Register Drone
      tags:
      - drones
  /api/v1/drones/{drone_id}:
    delete:
