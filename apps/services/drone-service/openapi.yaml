      security:
      - OAuth2PasswordBearer: []
  /api/v1/flights/weather-check:
    post:
      tags:
      - flight-planning
      summary: Check Flight Weather
      description: Check weather conditions for flight - فحص حالة الطقس للرحلة
      operationId: check_flight_weather_api_v1_flights_weather_check_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeatherCheckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/flights/estimate:
    post:
      tags:
      - flight-planning
      summary: Estimate Resources
      description: Estimate flight resources - تقدير موارد الرحلة
      operationId: estimate_resources_api_v1_flights_estimate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceEstimateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/flights/plans:
    get:
      tags:
      - flight-planning
      summary: List Flight Plans
      description: List flight plans - قائمة خطط الرحلات
      operationId: list_flight_plans_api_v1_flights_plans_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: field_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Field Id
      - name: plan_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Plan Type
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/flights/plans/{plan_id}:
    get:
      tags:
      - flight-planning
      summary: Get Flight Plan
      description: Get flight plan details - تفاصيل خطة الرحلة
      operationId: get_flight_plan_api_v1_flights_plans__plan_id__get
