      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/missions/{mission_id}/resume:
    post:
      tags:
      - missions
      summary: Resume Mission
      description: Resume mission - استئناف المهمة
      operationId: resume_mission_api_v1_missions__mission_id__resume_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/missions/{mission_id}/abort:
    post:
      tags:
      - missions
      summary: Abort Mission
      description: Abort mission - إلغاء المهمة
      operationId: abort_mission_api_v1_missions__mission_id__abort_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: mission_id
        in: path
        required: true
