openapi: 3.1.0
info:
  title: drone-service
  description: Drone integration and management - تكامل وإدارة الطائرات المسيرة
  version: 16.0.0
paths:
  /api/v1/drones/:
    get:
      tags:
      - drones
      summary: List Drones
      description: List all registered drones - قائمة بجميع الطائرات المسجلة
      operationId: list_drones_api_v1_drones__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DroneResponse'
                title: Response List Drones Api V1 Drones  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - drones
      summary: Register Drone
      description: Register a new drone - تسجيل طائرة جديدة
      operationId: register_drone_api_v1_drones__post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DroneCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DroneResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/drones/{drone_id}:
    get:
      tags:
      - drones
      summary: Get Drone
      description: Get drone details - الحصول على تفاصيل الطائرة
      operationId: get_drone_api_v1_drones__drone_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: drone_id
        in: path
        required: true
        schema:
          type: string
          title: Drone Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DroneResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - drones
      summary: Update Drone
      description: Update drone information - تحديث معلومات الطائرة
      operationId: update_drone_api_v1_drones__drone_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: drone_id
        in: path
        required: true
        schema:
          type: string
          title: Drone Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DroneCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DroneResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - drones
      summary: Delete Drone
      description: Deregister a drone - إلغاء تسجيل الطائرة
      operationId: delete_drone_api_v1_drones__drone_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: drone_id
        in: path
        required: true
        schema:
          type: string
          title: Drone Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/drones/{drone_id}/status:
    get:
      tags:
      - drones
      summary: Get Drone Status
      description: Get real-time drone status - الحصول على حالة الطائرة في الوقت الفعلي
      operationId: get_drone_status_api_v1_drones__drone_id__status_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: drone_id
        in: path
        required: true
        schema:
          type: string
          title: Drone Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/drones/{drone_id}/telemetry:
    get:
      tags:
      - drones
      summary: Get Drone Telemetry
      description: Get drone telemetry history - الحصول على سجل القياس عن بعد للطائرة
      operationId: get_drone_telemetry_api_v1_drones__drone_id__telemetry_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: drone_id
        in: path
        required: true
        schema:
          type: string
          title: Drone Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/flights/plan/spray:
    post:
      tags:
      - flight-planning
      summary: Create Spray Flight Plan
      description: Create spray flight plan - إنشاء خطة رحلة رش
      operationId: create_spray_flight_plan_api_v1_flights_plan_spray_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SprayFlightRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/flights/plan/mapping:
    post:
