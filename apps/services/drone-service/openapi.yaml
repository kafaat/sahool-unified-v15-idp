  /api/v1/vra/prescription/ndvi:
    post:
      tags:
      - vra
      summary: Create Ndvi Prescription
      description: Create NDVI-based prescription map - إنشاء خريطة وصفة مبنية على NDVI
      operationId: create_ndvi_prescription_api_v1_vra_prescription_ndvi_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NDVIPrescriptionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/vra/prescription/spot-spray:
    post:
      tags:
