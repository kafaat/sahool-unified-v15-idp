          - type: 'null'
          title: Status
      - name: drone_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Drone Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MissionResponse'
                title: Response List Missions Api V1 Missions  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - missions
      summary: Create Mission
      description: Create a new mission - إنشاء مهمة جديدة
      operationId: create_mission_api_v1_missions__post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
