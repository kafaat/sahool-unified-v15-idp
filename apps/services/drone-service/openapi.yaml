  /api/v1/missions/{mission_id}:
    get:
      tags:
      - missions
      summary: Get Mission
      description: Get mission details - الحصول على تفاصيل المهمة
      operationId: get_mission_api_v1_missions__mission_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionResponse'
        '422':
          description: Validation Error
          content:
