      operationId: comprehensive_health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /metrics:
    get:
      summary: Metrics
      description: Prometheus metrics endpoint
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /:
    get:
      summary: Root
      description: Root endpoint - نقطة نهاية الجذر
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    BoundsInput:
      properties:
        min_lat:
          type: number
          title: Min Lat
        max_lat:
          type: number
          title: Max Lat
        min_lng:
          type: number
          title: Min Lng
        max_lng:
          type: number
          title: Max Lng
      type: object
      required:
      - min_lat
      - max_lat
      - min_lng
      - max_lng
      title: BoundsInput
    Coordinate:
      properties:
        lat:
          type: number
          title: Lat
        lng:
          type: number
          title: Lng
      type: object
      required:
      - lat
      - lng
      title: Coordinate
    DroneCreate:
      properties:
        name:
          type: string
          title: Name
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
        model:
          type: string
          title: Model
        serial_number:
          type: string
          title: Serial Number
        drone_type:
          type: string
          title: Drone Type
          default: custom
        max_payload_kg:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Payload Kg
        tank_capacity_l:
          anyOf:
          - type: number
          - type: 'null'
          title: Tank Capacity L
        max_flight_time_min:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Flight Time Min
      type: object
      required:
      - name
      - model
      - serial_number
      title: DroneCreate
    DroneResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
        model:
          type: string
          title: Model
        serial_number:
          type: string
          title: Serial Number
        drone_type:
          type: string
          title: Drone Type
        status:
          type: string
          title: Status
          default: active
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      type: object
      required:
      - id
      - name
      - model
      - serial_number
      - drone_type
      title: DroneResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MappingFlightRequest:
      properties:
        field_id:
          type: string
          title: Field Id
        boundary:
          items:
            $ref: '#/components/schemas/Coordinate'
          type: array
          title: Boundary
        gsd_cm_px:
          type: number
          title: Gsd Cm Px
          default: 2.0
        frontal_overlap:
          type: number
          title: Frontal Overlap
          default: 80.0
        side_overlap:
          type: number
          title: Side Overlap
          default: 70.0
        name:
          type: string
          title: Name
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
      type: object
      required:
      - field_id
      - boundary
      - name
      title: MappingFlightRequest
    MissionCreate:
      properties:
        drone_id:
          type: string
          title: Drone Id
        flight_plan_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Flight Plan Id
