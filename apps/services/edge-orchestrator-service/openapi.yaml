  /api/v1/edge/jobs:
    post:
      tags:
      - jobs
      - edge
      summary: Create new job | إنشاء مهمة جديدة
      description: 'Create and queue a new edge computing job.


        إنشاء وإدراج مهمة حوسبة حافة جديدة في قائمة الانتظار.'
      operationId: create_job_api_v1_edge_jobs_post
