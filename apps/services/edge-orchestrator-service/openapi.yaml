        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/edge/sync/{device_id}:
    post:
      tags:
      - sync
      - deploy
      - edge
      summary: Sync data from/to device | مزامنة البيانات من/إلى الجهاز
      description: 'Initiate data synchronization between edge device and cloud.


        بدء مزامنة البيانات بين جهاز الحافة والسحابة.


        Data types that can be synced:

        - inference_results: AI inference outputs

        - sensor_data: IoT sensor readings

        - images: Captured images

        - logs: Device logs

        - metrics: Performance metrics


        أنواع البيانات التي يمكن مزامنتها:

        - inference_results: مخرجات استدلال الذكاء الاصطناعي

        - sensor_data: قراءات مستشعرات إنترنت الأشياء

        - images: الصور الملتقطة

        - logs: سجلات الجهاز

        - metrics: مقاييس الأداء'
      operationId: sync_device_data_api_v1_edge_sync__device_id__post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Device Id
      - name: direction
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SyncDirection'
          description: Sync direction | اتجاه المزامنة
          default: upload
        description: Sync direction | اتجاه المزامنة
      - name: data_types
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated data types | أنواع البيانات مفصولة بفواصل
          title: Data Types
        description: Comma-separated data types | أنواع البيانات مفصولة بفواصل
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          description: Force sync even if no changes | فرض المزامنة
          default: false
          title: Force
        description: Force sync even if no changes | فرض المزامنة
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/SyncRequest'
              - type: 'null'
              title: Sync Request
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/edge/sync/{sync_id}/status:
    get:
      tags:
      - sync
      - deploy
      - edge
      summary: Get sync status | الحصول على حالة المزامنة
      description: 'Get the status of a sync operation.


        الحصول على حالة عملية المزامنة.'
      operationId: get_sync_status_api_v1_edge_sync__sync_id__status_get
      parameters:
      - name: sync_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Sync Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/edge/deploy/{device_id}:
    post:
      tags:
      - sync
      - deploy
      - edge
      summary: Deploy model to device | نشر النموذج على الجهاز
      description: 'Deploy an AI model to an edge device.


        نشر نموذج ذكاء اصطناعي على جهاز الحافة.


        Supported models for Jetson Orin Nano:

        - yolo26-s: YOLO26 Small (optimized for edge)

        - yolo26-n: YOLO26 Nano (fastest)

        - yolo11-s: YOLO11 Small

        - crop-disease-v3: Crop disease detection

        - pest-detection-v2: Pest detection

        - weed-classifier-v1: Weed classification


        النماذج المدعومة لـ Jetson Orin Nano:

        - yolo26-s: YOLO26 صغير (محسن للحافة)

        - yolo26-n: YOLO26 نانو (الأسرع)

        - yolo11-s: YOLO11 صغير

        - crop-disease-v3: كشف أمراض المحاصيل

        - pest-detection-v2: كشف الآفات

        - weed-classifier-v1: تصنيف الأعشاب الضارة'
      operationId: deploy_model_api_v1_edge_deploy__device_id__post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Device Id
      - name: model_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Model name to deploy | اسم النموذج للنشر
          title: Model Name
        description: Model name to deploy | اسم النموذج للنشر
      - name: model_version
        in: query
        required: false
        schema:
          type: string
          description: Model version | إصدار النموذج
          default: latest
          title: Model Version
        description: Model version | إصدار النموذج
      - name: model_format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ModelFormat'
          description: Model format | تنسيق النموذج
          default: tensorrt
        description: Model format | تنسيق النموذج
      - name: force_update
        in: query
        required: false
        schema:
          type: boolean
          description: Force update even if same version | فرض التحديث
          default: false
          title: Force Update
        description: Force update even if same version | فرض التحديث
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/DeployRequest'
              - type: 'null'
              title: Deploy Request
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployResponse'
        '422':
