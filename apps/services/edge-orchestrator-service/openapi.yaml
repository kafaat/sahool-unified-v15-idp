                $ref: '#/components/schemas/EdgeDeviceList'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List all edge devices | عرض جميع أجهزة الحافة
