openapi: 3.1.0
info:
  title: Edge Orchestrator Service | خدمة تنسيق الحافة
  description: "\n    Manages edge computing devices for agricultural AI inference.\n\
    \n    تدير أجهزة الحوسبة على الحافة للاستدلال بالذكاء الاصطناعي الزراعي.\n\n \
    \   ## Features | الميزات\n\n    - **Device Management**: Register, monitor, and\
    \ manage edge devices\n    - **Job Orchestration**: Queue and execute AI inference\
    \ jobs\n    - **Model Deployment**: Deploy AI models to edge devices\n    - **Data\
    \ Synchronization**: Sync data between edge and cloud\n    - **Real-time Updates**:\
    \ WebSocket support for live monitoring\n\n    - **إدارة الأجهزة**: تسجيل ومراقبة\
    \ وإدارة أجهزة الحافة\n    - **تنسيق المهام**: إدراج وتنفيذ مهام استدلال الذكاء\
    \ الاصطناعي\n    - **نشر النماذج**: نشر نماذج الذكاء الاصطناعي على أجهزة الحافة\n\
    \    - **مزامنة البيانات**: مزامنة البيانات بين الحافة والسحابة\n    - **التحديثات\
    \ الفورية**: دعم WebSocket للمراقبة المباشرة\n\n    ## Supported Devices | الأجهزة\
    \ المدعومة\n\n    - NVIDIA Jetson Orin Nano (8GB)\n    - NVIDIA Jetson Orin NX\
    \ (16GB)\n    - NVIDIA Jetson AGX Orin (64GB)\n    - Raspberry Pi 5 with AI HAT\n\
    \    "
  version: 16.0.0
paths:
  /healthz:
    get:
      tags:
      - health
      summary: Liveness probe | فحص الحياة
      description: 'Liveness probe for Kubernetes.


        فحص الحياة لـ Kubernetes.'
      operationId: health_check_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      tags:
      - health
      summary: Readiness probe | فحص الجاهزية
      description: 'Readiness probe for Kubernetes.


        فحص الجاهزية لـ Kubernetes.'
      operationId: readiness_check_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
  /health:
    get:
      tags:
      - health
      summary: Combined health status | حالة الصحة المجمعة
      description: 'Combined health check with detailed status.


        فحص صحة مجمع مع حالة مفصلة.'
      operationId: combined_health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Combined Health Health Get
  /api/v1/edge/devices:
    get:
      tags:
      - devices
      - edge
      summary: List all edge devices | عرض جميع أجهزة الحافة
