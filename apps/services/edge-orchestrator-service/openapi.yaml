          application/json:
            schema:
              $ref: '#/components/schemas/EdgeJobCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - jobs
      - edge
      summary: List all jobs | عرض جميع المهام
      description: 'List all jobs across all devices.


        عرض جميع المهام عبر جميع الأجهزة.'
      operationId: list_all_jobs_api_v1_edge_jobs_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 20
          title: Page Size
        description: Items per page
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/JobStatus'
          - type: 'null'
          description: Filter by status
          title: Status
        description: Filter by status
      - name: job_type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/JobType'
          - type: 'null'
          description: Filter by job type
          title: Job Type
        description: Filter by job type
      - name: device_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Filter by device
          title: Device Id
        description: Filter by device
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeJobList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/edge/jobs/{job_id}:
    get:
      tags:
      - jobs
      - edge
      summary: Get job status | الحصول على حالة المهمة
      description: 'Get the status and details of a specific job.


        الحصول على حالة وتفاصيل مهمة محددة.'
      operationId: get_job_api_v1_edge_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/edge/devices/{device_id}/jobs:
    get:
      tags:
      - jobs
      - edge
      summary: List device jobs | عرض مهام الجهاز
      description: 'List all jobs for a specific device.


        عرض جميع المهام لجهاز محدد.'
      operationId: list_device_jobs_api_v1_edge_devices__device_id__jobs_get
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Device Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 20
          title: Page Size
        description: Items per page
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/JobStatus'
          - type: 'null'
          description: Filter by status | تصفية حسب الحالة
          title: Status
        description: Filter by status | تصفية حسب الحالة
      - name: job_type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/JobType'
          - type: 'null'
          description: Filter by job type | تصفية حسب نوع المهمة
          title: Job Type
        description: Filter by job type | تصفية حسب نوع المهمة
      - name: priority
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/JobPriority'
          - type: 'null'
          description: Filter by priority | تصفية حسب الأولوية
          title: Priority
        description: Filter by priority | تصفية حسب الأولوية
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeJobList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/edge/jobs/{job_id}/cancel:
    post:
      tags:
      - jobs
      - edge
      summary: Cancel job | إلغاء المهمة
      description: 'Cancel a pending or running job.


        إلغاء مهمة معلقة أو قيد التنفيذ.'
      operationId: cancel_job_api_v1_edge_jobs__job_id__cancel_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/edge/jobs/{job_id}/retry:
    post:
      tags:
      - jobs
      - edge
      summary: Retry failed job | إعادة محاولة المهمة الفاشلة
      description: 'Retry a failed or cancelled job.


        إعادة محاولة مهمة فاشلة أو ملغاة.'
      operationId: retry_job_api_v1_edge_jobs__job_id__retry_post
      security:
      - OAuth2PasswordBearer: []
