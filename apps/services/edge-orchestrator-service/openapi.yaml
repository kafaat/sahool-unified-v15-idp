      - devices
      - edge
      summary: Update device | تحديث الجهاز
      description: 'Update an existing edge device.


        تحديث جهاز حافة موجود.'
      operationId: update_device_api_v1_edge_devices__device_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeDeviceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeDevice'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - devices
      - edge
      summary: Remove device | إزالة الجهاز
      description: 'Remove an edge device from the system.


        إزالة جهاز حافة من النظام.'
      operationId: delete_device_api_v1_edge_devices__device_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Device Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/edge/devices/{device_id}/reconnect:
    post:
      tags:
