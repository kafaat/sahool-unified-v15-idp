components:
  schemas:
    DeployProgress:
      description: Model deployment progress | تقدم نشر النموذج.
      properties:
        bytes_transferred:
          default: 0
          title: Bytes Transferred
          type: integer
        estimated_time_remaining_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Estimated Time Remaining Seconds
        percent_complete:
          default: 0.0
          maximum: 100.0
          minimum: 0.0
          title: Percent Complete
          type: number
        stage:
          default: initializing
          description: Current deployment stage
          title: Stage
          type: string
        stage_ar:
          anyOf:
          - type: string
          - type: 'null'
          description: Stage in Arabic
          title: Stage Ar
        total_bytes:
          default: 0
          title: Total Bytes
          type: integer
      title: DeployProgress
      type: object
    DeployRequest:
      description: Request to deploy model to device | طلب نشر النموذج على الجهاز.
      properties:
        config_overrides:
          additionalProperties: true
          default: {}
          description: Configuration overrides for deployment
          title: Config Overrides
          type: object
        device_id:
          description: Target device | الجهاز المستهدف
          format: uuid
          title: Device Id
          type: string
        force_update:
          default: false
          description: Force update even if same version | فرض التحديث
          title: Force Update
          type: boolean
        model_format:
          $ref: '#/components/schemas/ModelFormat'
          default: tensorrt
          description: Model format | تنسيق النموذج
        model_name:
          description: Model to deploy | النموذج للنشر
          maxLength: 100
          minLength: 1
          title: Model Name
          type: string
        model_version:
          default: latest
          description: Model version | إصدار النموذج
          title: Model Version
          type: string
        validate_after_deploy:
          default: true
          description: Run validation after deployment
          title: Validate After Deploy
          type: boolean
      required:
      - device_id
      - model_name
      title: DeployRequest
      type: object
    DeployResponse:
      description: Response from deploy operation | استجابة عملية النشر.
      properties:
        completed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Completed At
        deploy_id:
          description: Deployment ID | معرف النشر
          format: uuid
          title: Deploy Id
          type: string
        device_id:
          format: uuid
          title: Device Id
          type: string
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        error_message_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message Ar
        model_name:
          title: Model Name
          type: string
        model_version:
          title: Model Version
          type: string
        progress:
          $ref: '#/components/schemas/DeployProgress'
        started_at:
          format: date-time
          title: Started At
          type: string
        status:
          description: Deployment status
          title: Status
          type: string
        validation_result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Post-deployment validation result
          title: Validation Result
      required:
      - deploy_id
      - device_id
      - model_name
      - model_version
      - status
      title: DeployResponse
      type: object
    DeviceCapabilities:
      additionalProperties: true
      description: Device hardware capabilities | قدرات أجهزة الجهاز.
      properties:
        camera_interfaces:
          default:
          - csi
          - usb
          description: Camera interfaces available
          items:
            type: string
          title: Camera Interfaces
          type: array
        cpu_cores:
          default: 6
          description: Number of CPU cores
          title: Cpu Cores
          type: integer
        gpu_memory_gb:
          default: 8.0
          description: GPU memory in GB
          title: Gpu Memory Gb
          type: number
        has_nvme:
          default: false
          description: Has NVMe storage
          title: Has Nvme
          type: boolean
        max_power_watts:
          default: 15
          description: Max power consumption
          title: Max Power Watts
          type: integer
        ram_gb:
          default: 8.0
          description: RAM in GB
          title: Ram Gb
          type: number
        storage_gb:
          default: 64.0
          description: Storage in GB
          title: Storage Gb
          type: number
        supported_models:
          default:
          - yolo26-s
          - yolo26-n
          description: Supported AI models
          items:
            type: string
          title: Supported Models
          type: array
      title: DeviceCapabilities
      type: object
    DeviceMetrics:
      additionalProperties: true
      description: Real-time device metrics | مقاييس الجهاز في الوقت الفعلي.
      properties:
        cpu_usage_percent:
          default: 0.0
          maximum: 100.0
          minimum: 0.0
          title: Cpu Usage Percent
          type: number
        disk_usage_percent:
          default: 0.0
          maximum: 100.0
          minimum: 0.0
          title: Disk Usage Percent
          type: number
        gpu_usage_percent:
          default: 0.0
          maximum: 100.0
          minimum: 0.0
          title: Gpu Usage Percent
          type: number
        inference_fps:
          default: 0.0
          minimum: 0.0
          title: Inference Fps
          type: number
        last_heartbeat:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Heartbeat
        memory_usage_percent:
          default: 0.0
          maximum: 100.0
          minimum: 0.0
          title: Memory Usage Percent
          type: number
        network_latency_ms:
          default: 0.0
          minimum: 0.0
          title: Network Latency Ms
          type: number
        power_usage_watts:
          default: 0.0
          minimum: 0.0
          title: Power Usage Watts
          type: number
        temperature_celsius:
          default: 0.0
          title: Temperature Celsius
          type: number
        uptime_seconds:
          default: 0
          minimum: 0
          title: Uptime Seconds
          type: integer
      title: DeviceMetrics
      type: object
    DeviceStatus:
      description: Device operational status | حالة تشغيل الجهاز.
      enum:
      - online
      - offline
      - idle
      - busy
      - syncing
      - deploying
      - error
      - maintenance
      title: DeviceStatus
      type: string
    DeviceType:
      description: Edge device types | أنواع أجهزة الحافة.
      enum:
      - jetson_orin_nano
      - jetson_orin_nx
      - jetson_agx_orin
      - raspberry_pi_5
      - generic_edge
      title: DeviceType
      type: string
    EdgeDevice:
      description: Complete edge device schema | مخطط جهاز الحافة الكامل.
      properties:
        capabilities:
          $ref: '#/components/schemas/DeviceCapabilities'
        created_at:
          format: date-time
          title: Created At
          type: string
        description:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          title: Description
        description_ar:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          title: Description Ar
        device_type:
          $ref: '#/components/schemas/DeviceType'
          default: jetson_orin_nano
          description: Device type | نوع الجهاز
        farm_id:
          description: Associated farm ID | معرف المزرعة
          format: uuid
          title: Farm Id
          type: string
        field_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Associated field ID | معرف الحقل
          title: Field Id
        firmware_version:
          anyOf:
          - type: string
          - type: 'null'
          description: Firmware version
          title: Firmware Version
        id:
          description: Device unique ID | المعرف الفريد للجهاز
          format: uuid
          title: Id
          type: string
        installed_model:
          anyOf:
          - type: string
          - type: 'null'
          description: Currently installed AI model
          title: Installed Model
        installed_model_version:
          anyOf:
          - type: string
          - type: 'null'
          description: Version of installed model
          title: Installed Model Version
        ip_address:
          anyOf:
          - type: string
          - type: 'null'
          description: Device IP address
          title: Ip Address
        is_active:
          default: true
          description: Is device active | هل الجهاز نشط
          title: Is Active
          type: boolean
        last_seen:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Last seen timestamp | آخر ظهور
          title: Last Seen
        location:
          anyOf:
          - $ref: '#/components/schemas/GeoLocation'
          - type: 'null'
          description: Device location | موقع الجهاز
        mac_address:
          anyOf:
          - type: string
          - type: 'null'
          description: Device MAC address
          title: Mac Address
        metadata:
          additionalProperties: true
          default: {}
          description: Additional metadata | بيانات وصفية إضافية
          title: Metadata
          type: object
        metrics:
          $ref: '#/components/schemas/DeviceMetrics'
        name:
          maxLength: 255
          minLength: 1
          title: Name
          type: string
        name_ar:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Name Ar
        serial_number:
          anyOf:
          - type: string
          - type: 'null'
          description: Device serial number
          title: Serial Number
        status:
          $ref: '#/components/schemas/DeviceStatus'
          default: offline
          description: Current status | الحالة الحالية
        tags:
          default: []
          description: Device tags | علامات الجهاز
          items:
            type: string
          title: Tags
          type: array
        tenant_id:
          description: Tenant ID | معرف المستأجر
          format: uuid
          title: Tenant Id
          type: string
        total_inference_count:
          default: 0
          description: Total inferences run | إجمالي الاستدلالات
          title: Total Inference Count
          type: integer
        total_sync_bytes:
          default: 0
          description: Total bytes synced | إجمالي البايتات المزامنة
          title: Total Sync Bytes
          type: integer
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - name
      - farm_id
      - id
      - tenant_id
      title: EdgeDevice
      type: object
    EdgeDeviceCreate:
      description: Schema for creating a new edge device | مخطط إنشاء جهاز حافة جديد.
      properties:
        description:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          title: Description
        description_ar:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          title: Description Ar
        device_type:
          $ref: '#/components/schemas/DeviceType'
          default: jetson_orin_nano
          description: Device type | نوع الجهاز
        farm_id:
          description: Associated farm ID | معرف المزرعة
          format: uuid
          title: Farm Id
          type: string
        field_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Associated field ID | معرف الحقل
          title: Field Id
        firmware_version:
          anyOf:
          - type: string
          - type: 'null'
          description: Firmware version
          title: Firmware Version
        installed_model:
          anyOf:
          - type: string
          - type: 'null'
          description: Currently installed AI model
          title: Installed Model
        installed_model_version:
          anyOf:
          - type: string
          - type: 'null'
          description: Version of installed model
          title: Installed Model Version
        ip_address:
          anyOf:
          - type: string
          - type: 'null'
          description: Device IP address
          title: Ip Address
        location:
          anyOf:
          - $ref: '#/components/schemas/GeoLocation'
          - type: 'null'
          description: Device location | موقع الجهاز
        mac_address:
          anyOf:
          - type: string
          - type: 'null'
          description: Device MAC address
          title: Mac Address
        metadata:
          additionalProperties: true
          default: {}
          description: Additional metadata | بيانات وصفية إضافية
          title: Metadata
          type: object
        name:
          maxLength: 255
          minLength: 1
          title: Name
          type: string
        name_ar:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Name Ar
        serial_number:
          anyOf:
          - type: string
          - type: 'null'
          description: Device serial number
          title: Serial Number
        tags:
          default: []
          description: Device tags | علامات الجهاز
          items:
            type: string
          title: Tags
          type: array
      required:
      - name
      - farm_id
      title: EdgeDeviceCreate
      type: object
    EdgeDeviceList:
      description: Paginated list of edge devices | قائمة أجهزة الحافة مرقمة.
      properties:
        items:
          items:
            $ref: '#/components/schemas/EdgeDevice'
          title: Items
          type: array
        page:
          default: 1
          minimum: 1
          title: Page
          type: integer
        page_size:
          default: 20
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
        pages:
          default: 1
          minimum: 1
          title: Pages
          type: integer
        total:
          description: Total count | العدد الإجمالي
          title: Total
          type: integer
      required:
      - items
      - total
      title: EdgeDeviceList
      type: object
    EdgeDeviceUpdate:
      additionalProperties: false
      description: Schema for updating an edge device | مخطط تحديث جهاز الحافة.
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Description Ar
        field_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Field Id
        firmware_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Firmware Version
        installed_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Installed Model
        installed_model_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Installed Model Version
        ip_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip Address
        location:
          anyOf:
          - $ref: '#/components/schemas/GeoLocation'
          - type: 'null'
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
        status:
          anyOf:
          - $ref: '#/components/schemas/DeviceStatus'
          - type: 'null'
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
      title: EdgeDeviceUpdate
      type: object
    EdgeJob:
      description: Complete edge job schema | مخطط مهمة الحافة الكامل.
      properties:
        completed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When job completed | وقت اكتمال المهمة
          title: Completed At
        config:
          $ref: '#/components/schemas/JobConfig'
          description: Job configuration | تكوين المهمة
        created_at:
          format: date-time
          title: Created At
          type: string
        device_id:
          description: Target device ID | معرف الجهاز المستهدف
          format: uuid
          title: Device Id
          type: string
        id:
          description: Job unique ID | المعرف الفريد للمهمة
          format: uuid
          title: Id
          type: string
        job_type:
          $ref: '#/components/schemas/JobType'
          description: Type of job | نوع المهمة
        max_retries:
          default: 3
          description: Maximum retries allowed
          title: Max Retries
          type: integer
        metadata:
          additionalProperties: true
          default: {}
          description: Additional metadata
          title: Metadata
          type: object
        priority:
          $ref: '#/components/schemas/JobPriority'
          default: normal
          description: Job priority | أولوية المهمة
        progress_percent:
          default: 0.0
          description: Progress percentage | نسبة التقدم
          maximum: 100.0
          minimum: 0.0
          title: Progress Percent
          type: number
        result:
          anyOf:
          - $ref: '#/components/schemas/JobResult'
          - type: 'null'
          description: Job result | نتيجة المهمة
        retry_count:
          default: 0
          description: Number of retries
          title: Retry Count
          type: integer
        scheduled_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Scheduled execution time | وقت التنفيذ المجدول
          title: Scheduled At
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When job started | وقت بدء المهمة
          title: Started At
        status:
          $ref: '#/components/schemas/JobStatus'
          default: pending
          description: Current status | الحالة الحالية
        tenant_id:
          description: Tenant ID | معرف المستأجر
          format: uuid
          title: Tenant Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - job_type
      - device_id
      - id
      - tenant_id
      title: EdgeJob
      type: object
    EdgeJobCreate:
      description: Schema for creating a new job | مخطط إنشاء مهمة جديدة.
      properties:
        config:
          $ref: '#/components/schemas/JobConfig'
          description: Job configuration | تكوين المهمة
        device_id:
          description: Target device ID | معرف الجهاز المستهدف
          format: uuid
          title: Device Id
          type: string
        job_type:
          $ref: '#/components/schemas/JobType'
          description: Type of job | نوع المهمة
        metadata:
          additionalProperties: true
          default: {}
          description: Additional metadata
          title: Metadata
          type: object
        priority:
          $ref: '#/components/schemas/JobPriority'
          default: normal
          description: Job priority | أولوية المهمة
        scheduled_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Scheduled execution time | وقت التنفيذ المجدول
          title: Scheduled At
      required:
      - job_type
      - device_id
      title: EdgeJobCreate
      type: object
    EdgeJobList:
      description: Paginated list of jobs | قائمة المهام مرقمة.
      properties:
        items:
          items:
            $ref: '#/components/schemas/EdgeJob'
          title: Items
          type: array
        page:
          default: 1
          minimum: 1
          title: Page
          type: integer
        page_size:
          default: 20
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
        pages:
          default: 1
          minimum: 1
          title: Pages
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      title: EdgeJobList
      type: object
    GeoLocation:
      description: Geographic location | الموقع الجغرافي.
      properties:
        accuracy_m:
          anyOf:
          - type: number
          - type: 'null'
          description: Accuracy in meters
          title: Accuracy M
        altitude_m:
          anyOf:
          - type: number
          - type: 'null'
          description: Altitude in meters
          title: Altitude M
        latitude:
          maximum: 90.0
          minimum: -90.0
          title: Latitude
          type: number
        longitude:
          maximum: 180.0
          minimum: -180.0
          title: Longitude
          type: number
      required:
      - latitude
      - longitude
      title: GeoLocation
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthStatus:
      description: Health check response | استجابة فحص الصحة.
      properties:
        service:
          default: edge-orchestrator-service
          description: Service name
          title: Service
          type: string
        status:
          default: ok
          description: Service status
          title: Status
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        version:
          default: 16.0.0
          description: Service version
          title: Version
          type: string
      title: HealthStatus
      type: object
    JobConfig:
      additionalProperties: true
      description: Job configuration parameters | معلمات تكوين المهمة.
      properties:
        batch_size:
          default: 1
          maximum: 32
          minimum: 1
          title: Batch Size
          type: integer
        confidence_threshold:
          default: 0.5
          description: Detection confidence threshold
          maximum: 1.0
          minimum: 0.0
          title: Confidence Threshold
          type: number
        input_source:
          anyOf:
          - type: string
          - type: 'null'
          description: Input source (camera, file path)
          title: Input Source
        max_detections:
          default: 100
          maximum: 1000
          minimum: 1
          title: Max Detections
          type: integer
        model_name:
          anyOf:
          - type: string
          - type: 'null'
          description: AI model to use
          title: Model Name
        output_format:
          default: json
          description: Output format
          title: Output Format
          type: string
        save_images:
          default: false
          description: Save annotated images
          title: Save Images
          type: boolean
        timeout_seconds:
          default: 300
          maximum: 3600
          minimum: 1
          title: Timeout Seconds
          type: integer
      title: JobConfig
      type: object
    JobPriority:
      description: Job priority levels | مستويات أولوية المهمة.
      enum:
      - low
      - normal
      - high
      - critical
      title: JobPriority
      type: string
    JobResult:
      additionalProperties: true
      description: Job execution result | نتيجة تنفيذ المهمة.
      properties:
        artifacts:
          default: []
          description: Generated artifact paths
          items:
            type: string
          title: Artifacts
          type: array
        detections_count:
          anyOf:
          - type: integer
          - type: 'null'
          description: Number of detections
          title: Detections Count
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          description: Error code if failed
          title: Error Code
        execution_time_ms:
          anyOf:
          - type: integer
          - type: 'null'
          description: Execution time in ms
          title: Execution Time Ms
        message:
          anyOf:
          - type: string
          - type: 'null'
          description: Result message
          title: Message
        message_ar:
          anyOf:
          - type: string
          - type: 'null'
          description: Result message in Arabic
          title: Message Ar
        output_data:
          additionalProperties: true
          default: {}
          description: Job output data
          title: Output Data
          type: object
        success:
          description: Whether job succeeded
          title: Success
          type: boolean
      required:
      - success
      title: JobResult
      type: object
    JobStatus:
      description: Job execution status | حالة تنفيذ المهمة.
      enum:
      - pending
      - scheduled
      - running
      - completed
      - failed
      - cancelled
      - timeout
      title: JobStatus
      type: string
    JobType:
      description: Edge job types | أنواع مهام الحافة.
      enum:
      - inference
      - model_deploy
      - data_sync
      - firmware_update
      - diagnostic
      - calibration
      - capture
      title: JobType
      type: string
    ModelFormat:
      description: AI model format | تنسيق نموذج الذكاء الاصطناعي.
      enum:
      - tensorrt
      - onnx
      - pytorch
      - tflite
      title: ModelFormat
      type: string
    ReadinessStatus:
      description: Readiness check response | استجابة فحص الجاهزية.
      properties:
        active_devices:
          default: 0
          description: Number of active devices
          title: Active Devices
          type: integer
        active_jobs:
          default: 0
          description: Number of active jobs
          title: Active Jobs
          type: integer
        database:
          default: false
          description: Database connection status
          title: Database
          type: boolean
        nats:
          default: false
          description: NATS connection status
          title: Nats
          type: boolean
        redis:
          default: false
          description: Redis connection status
          title: Redis
          type: boolean
        status:
          default: ok
          title: Status
          type: string
      title: ReadinessStatus
      type: object
    SyncDataItem:
      additionalProperties: true
      description: Single data item for synchronization | عنصر بيانات واحد للمزامنة.
      properties:
        checksum:
          anyOf:
          - type: string
          - type: 'null'
          description: Data checksum for validation
          title: Checksum
        data:
          additionalProperties: true
          description: Item data
          title: Data
          type: object
        item_id:
          description: Unique identifier
          title: Item Id
          type: string
        item_type:
          description: Type of data item
          title: Item Type
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
      required:
      - item_type
      - item_id
      - data
      title: SyncDataItem
      type: object
    SyncDirection:
      description: Data sync direction | اتجاه مزامنة البيانات.
      enum:
      - upload
      - download
      - bidirectional
      title: SyncDirection
      type: string
    SyncProgress:
      description: Sync operation progress | تقدم عملية المزامنة.
      properties:
        bytes_transferred:
          default: 0
          description: Bytes transferred
          title: Bytes Transferred
          type: integer
        estimated_time_remaining_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Estimated Time Remaining Seconds
        failed_items:
          default: 0
          description: Items that failed to sync
          title: Failed Items
          type: integer
        percent_complete:
          default: 0.0
          maximum: 100.0
          minimum: 0.0
          title: Percent Complete
          type: number
        synced_items:
          default: 0
          description: Items synced so far
          title: Synced Items
          type: integer
        total_items:
          default: 0
          description: Total items to sync
          title: Total Items
          type: integer
      title: SyncProgress
      type: object
    SyncRequest:
      description: Request to sync data from/to device | طلب مزامنة البيانات من/إلى الجهاز.
      properties:
        data_types:
          default:
          - inference_results
          - sensor_data
          - images
          description: Types of data to sync | أنواع البيانات للمزامنة
          items:
            type: string
          title: Data Types
          type: array
        device_id:
          description: Device to sync | الجهاز للمزامنة
          format: uuid
          title: Device Id
          type: string
        direction:
          $ref: '#/components/schemas/SyncDirection'
          default: upload
          description: Sync direction | اتجاه المزامنة
        force:
          default: false
          description: Force sync even if no changes | فرض المزامنة
          title: Force
          type: boolean
        items:
          default: []
          description: Data items to sync | عناصر البيانات للمزامنة
          items:
            $ref: '#/components/schemas/SyncDataItem'
          title: Items
          type: array
        since:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Sync data since this timestamp | مزامنة البيانات منذ
          title: Since
      required:
      - device_id
      title: SyncRequest
      type: object
    SyncResponse:
      description: Response from sync operation | استجابة عملية المزامنة.
      properties:
        completed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Completed At
        device_id:
          format: uuid
          title: Device Id
          type: string
        direction:
          $ref: '#/components/schemas/SyncDirection'
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        error_message_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message Ar
        progress:
          $ref: '#/components/schemas/SyncProgress'
        started_at:
          format: date-time
          title: Started At
          type: string
        status:
          description: Sync status
          title: Status
          type: string
        sync_id:
          description: Sync operation ID | معرف عملية المزامنة
          format: uuid
          title: Sync Id
          type: string
      required:
      - sync_id
      - device_id
      - status
      - direction
      title: SyncResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: "\n    Manages edge computing devices for agricultural AI inference.\n\n    تدير أجهزة الحوسبة على الحافة للاستدلال بالذكاء الاصطناعي الزراعي.\n\n    ## Features | الميزات\n\n    - **Device Management**: Register, monitor, and manage edge devices\n    - **Job Orchestration**: Queue and execute AI inference jobs\n    - **Model Deployment**: Deploy AI models to edge devices\n    - **Data Synchronization**: Sync data between edge and cloud\n    - **Real-time Updates**: WebSocket support for live monitoring\n\n    - **إدارة الأجهزة**: تسجيل ومراقبة وإدارة أجهزة الحافة\n    - **تنسيق المهام**: إدراج وتنفيذ مهام استدلال الذكاء الاصطناعي\n    - **نشر النماذج**: نشر نماذج الذكاء الاصطناعي على أجهزة الحافة\n    - **مزامنة البيانات**: مزامنة البيانات بين الحافة والسحابة\n    - **التحديثات الفورية**: دعم WebSocket للمراقبة المباشرة\n\n    ## Supported Devices | الأجهزة المدعومة\n\n    - NVIDIA Jetson Orin Nano (8GB)\n    - NVIDIA Jetson Orin NX (16GB)\n    - NVIDIA Jetson AGX Orin (64GB)\n    - Raspberry Pi 5 with AI HAT\n    "
  title: Edge Orchestrator Service | خدمة تنسيق الحافة
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/edge/deploy/{deploy_id}/cancel:
    post:
      description: 'Cancel an ongoing deployment operation.


        إلغاء عملية نشر جارية.'
      operationId: cancel_deployment_api_v1_edge_deploy__deploy_id__cancel_post
      parameters:
