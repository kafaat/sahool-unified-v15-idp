        عرض جميع أجهزة الحافة مع التصفية والترقيم.'
      operationId: list_devices_api_v1_edge_devices_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 20
          title: Page Size
        description: Items per page
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/DeviceStatus'
          - type: 'null'
          description: Filter by status | تصفية حسب الحالة
          title: Status
        description: Filter by status | تصفية حسب الحالة
      - name: device_type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/DeviceType'
          - type: 'null'
          description: Filter by device type | تصفية حسب نوع الجهاز
          title: Device Type
        description: Filter by device type | تصفية حسب نوع الجهاز
      - name: farm_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Filter by farm ID | تصفية حسب معرف المزرعة
          title: Farm Id
        description: Filter by farm ID | تصفية حسب معرف المزرعة
      - name: field_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Filter by field ID | تصفية حسب معرف الحقل
          title: Field Id
        description: Filter by field ID | تصفية حسب معرف الحقل
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Search by name | البحث بالاسم
          title: Search
        description: Search by name | البحث بالاسم
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeDeviceList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - devices
      - edge
      summary: Register new device | تسجيل جهاز جديد
      description: 'Register a new edge device (e.g., Jetson Orin Nano).


        تسجيل جهاز حافة جديد (مثل Jetson Orin Nano).'
      operationId: create_device_api_v1_edge_devices_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeDeviceCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeDevice'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/edge/devices/{device_id}:
    get:
      tags:
      - devices
      - edge
      summary: Get device details | الحصول على تفاصيل الجهاز
      description: 'Get detailed information about a specific edge device.


        الحصول على معلومات مفصلة حول جهاز حافة معين.'
