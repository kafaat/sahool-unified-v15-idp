      - edge
  /api/v1/edge/deploy/{device_id}:
    post:
      description: 'Deploy an AI model to an edge device.


        نشر نموذج ذكاء اصطناعي على جهاز الحافة.


        Supported models for Jetson Orin Nano:

        - yolo26-s: YOLO26 Small (optimized for edge)

        - yolo26-n: YOLO26 Nano (fastest)

        - yolo11-s: YOLO11 Small

        - crop-disease-v3: Crop disease detection

        - pest-detection-v2: Pest detection

        - weed-classifier-v1: Weed classification


        النماذج المدعومة لـ Jetson Orin Nano:

        - yolo26-s: YOLO26 صغير (محسن للحافة)

        - yolo26-n: YOLO26 نانو (الأسرع)

        - yolo11-s: YOLO11 صغير

        - crop-disease-v3: كشف أمراض المحاصيل

        - pest-detection-v2: كشف الآفات

        - weed-classifier-v1: تصنيف الأعشاب الضارة'
      operationId: deploy_model_api_v1_edge_deploy__device_id__post
      parameters:
      - in: path
        name: device_id
        required: true
        schema:
          format: uuid
          title: Device Id
          type: string
      - description: Model name to deploy | اسم النموذج للنشر
        in: query
        name: model_name
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Model name to deploy | اسم النموذج للنشر
          title: Model Name
      - description: Model version | إصدار النموذج
        in: query
        name: model_version
        required: false
        schema:
          default: latest
          description: Model version | إصدار النموذج
          title: Model Version
          type: string
      - description: Model format | تنسيق النموذج
        in: query
        name: model_format
        required: false
        schema:
          $ref: '#/components/schemas/ModelFormat'
          default: tensorrt
          description: Model format | تنسيق النموذج
      - description: Force update even if same version | فرض التحديث
        in: query
        name: force_update
        required: false
        schema:
          default: false
          description: Force update even if same version | فرض التحديث
          title: Force Update
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/DeployRequest'
              - type: 'null'
              title: Deploy Request
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Deploy model to device | نشر النموذج على الجهاز
      tags:
      - sync
      - deploy
      - edge
