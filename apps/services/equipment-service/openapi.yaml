components:
  schemas:
    EquipmentCreate:
      description: Create a new equipment
      properties:
        brand:
          anyOf:
          - type: string
          - type: 'null'
          title: Brand
        equipment_type:
          $ref: '#/components/schemas/EquipmentType'
        field_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Field Id
        fuel_capacity_liters:
          anyOf:
          - type: number
          - type: 'null'
          title: Fuel Capacity Liters
        horsepower:
          anyOf:
          - type: integer
          - type: 'null'
          title: Horsepower
        location_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Name
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
        purchase_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Purchase Date
        purchase_price:
          anyOf:
          - type: number
          - type: 'null'
          title: Purchase Price
        serial_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Serial Number
        year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
      required:
      - name
      - equipment_type
      title: EquipmentCreate
      type: object
    EquipmentIssueCreate:
      description: 'Schema for reporting an incident/issue against a piece of equipment.


        This is intentionally minimal: the service does not yet own a dedicated

        ``equipment_issues`` table, so we persist via the NATS event bus instead

        (subject ``sahool.tenant.{tid}.equipment.issue_reported``) and return a

        synthetic ``issue_id`` so the client can correlate.'
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Description Ar
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        reported_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Reported By
        severity:
          $ref: '#/components/schemas/IssueSeverity'
          default: medium
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
        title_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Title Ar
      required:
      - title
      title: EquipmentIssueCreate
      type: object
    EquipmentIssueResponse:
      description: Response payload for a reported issue.
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Description Ar
        equipment_id:
          title: Equipment Id
          type: string
        id:
          title: Id
          type: string
        issue_id:
          title: Issue Id
          type: string
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        reported_at:
          format: date-time
          title: Reported At
          type: string
        reported_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Reported By
        severity:
          $ref: '#/components/schemas/IssueSeverity'
        status:
          $ref: '#/components/schemas/IssueStatus'
          default: open
        tenant_id:
          title: Tenant Id
          type: string
        title:
          title: Title
          type: string
        title_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Title Ar
      required:
      - id
      - issue_id
      - equipment_id
      - tenant_id
      - title
      - severity
      - reported_at
      title: EquipmentIssueResponse
      type: object
    EquipmentType:
      enum:
      - tractor
      - pump
      - drone
      - harvester
      - sprayer
      - pivot
      - sensor
      - vehicle
      - other
      title: EquipmentType
      type: string
    EquipmentUpdate:
      description: 'Update equipment properties.


        Accepts both backend-canonical status values (``operational``, ``inactive``)

        and frontend-canonical aliases (``active``, ``idle``, ``retired``). Incoming

        aliases are normalized to the backend canonical form before persistence.'
      properties:
        brand:
          anyOf:
          - type: string
          - type: 'null'
          title: Brand
        current_fuel_percent:
          anyOf:
          - type: number
          - type: 'null'
          title: Current Fuel Percent
        current_hours:
          anyOf:
          - type: number
          - type: 'null'
          title: Current Hours
        current_lat:
          anyOf:
          - type: number
          - type: 'null'
          title: Current Lat
        current_lon:
          anyOf:
          - type: number
          - type: 'null'
          title: Current Lon
        equipment_type:
          anyOf:
          - $ref: '#/components/schemas/EquipmentType'
          - type: 'null'
        field_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Field Id
        location_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Name
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
        serial_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Serial Number
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
      title: EquipmentUpdate
      type: object
    GeofenceEventPayload:
      description: Geofence entry/exit event consumed by the auto-op bridge.
      properties:
        alert_type:
          default: entry
          maxLength: 32
          title: Alert Type
          type: string
        crop_season_id:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Crop Season Id
        equipment_id:
          maxLength: 128
          minLength: 1
          title: Equipment Id
          type: string
        equipment_name:
          default: ''
          maxLength: 255
          title: Equipment Name
          type: string
        equipment_type:
          default: other
          maxLength: 32
          title: Equipment Type
          type: string
        field_id:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Field Id
        geofence_id:
          maxLength: 128
          minLength: 1
          title: Geofence Id
          type: string
        geofence_type:
          default: field
          maxLength: 64
          title: Geofence Type
          type: string
        lat:
          maximum: 90.0
          minimum: -90.0
          title: Lat
          type: number
        lng:
          maximum: 180.0
          minimum: -180.0
          title: Lng
          type: number
        operator_id:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Operator Id
        timestamp:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Timestamp
      required:
      - equipment_id
      - geofence_id
      - lat
      - lng
      title: GeofenceEventPayload
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    IssueSeverity:
      enum:
      - low
      - medium
      - high
      - critical
      title: IssueSeverity
      type: string
    IssueStatus:
      enum:
      - open
      - acknowledged
      - in_progress
      - resolved
      - closed
      title: IssueStatus
      type: string
    MaintenancePriority:
      enum:
      - low
      - medium
      - high
      - critical
      title: MaintenancePriority
      type: string
    MaintenanceRecord:
      description: Maintenance record
      properties:
        cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Cost
        description:
          title: Description
          type: string
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Description Ar
        equipment_id:
          title: Equipment Id
          type: string
        maintenance_type:
          $ref: '#/components/schemas/MaintenanceType'
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        parts_replaced:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Parts Replaced
        performed_at:
          format: date-time
          title: Performed At
          type: string
        performed_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Performed By
        record_id:
          title: Record Id
          type: string
      required:
      - record_id
      - equipment_id
      - maintenance_type
      - description
      - performed_at
      title: MaintenanceRecord
      type: object
    MaintenanceType:
      enum:
      - oil_change
      - filter_change
      - tire_check
      - battery_check
      - calibration
      - general_service
      - repair
      - other
      title: MaintenanceType
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: Agricultural equipment and asset management API
  title: SAHOOL Equipment Service
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/equipment:
    get:
      description: "List all equipment with optional filters.\n\nAccepts both ``equipment_type`` and ``type`` query parameters for\nfrontend compatibility. ``equipment_type`` takes precedence if both are\nsupplied. ``status`` accepts both the backend canonical dialect\n(``operational``, ``inactive``) and the frontend canonical dialect\n(``active``, ``idle``, ``retired``).\n\nThe response envelope is::\n\n    {\n        \"data\": [...],           # new, preferred\n        \"pagination\": {...},     # new, preferred\n        \"equipment\": [...],      # legacy alias (will be removed in v17)\n        \"total\": N,              # legacy alias\n        \"limit\": X,              # legacy alias\n        \"offset\": Y,             # legacy alias\n    }"
      operationId: list_equipment_api_v1_equipment_get
      parameters:
      - description: Filter by equipment type (preferred)
        in: query
        name: equipment_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by equipment type (preferred)
          title: Equipment Type
      - description: Alias for equipment_type (frontend compatibility)
        in: query
        name: type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Alias for equipment_type (frontend compatibility)
          title: Type
      - description: Filter by status. Accepts both backend (operational) and frontend (active) canonical values.
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by status. Accepts both backend (operational) and frontend (active) canonical values.
          title: Status
      - description: Filter by field
        in: query
        name: field_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by field
          title: Field Id
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Equipment Api V1 Equipment Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List Equipment
    post:
      description: Create new equipment
      operationId: create_equipment_api_v1_equipment_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Create Equipment Api V1 Equipment Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Equipment
  /api/v1/equipment/alerts:
    get:
      description: Get maintenance alerts
      operationId: get_maintenance_alerts_api_v1_equipment_alerts_get
      parameters:
      - in: query
        name: priority
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MaintenancePriority'
          - type: 'null'
          title: Priority
      - in: query
        name: overdue_only
        required: false
        schema:
          default: false
          title: Overdue Only
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Maintenance Alerts Api V1 Equipment Alerts Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Maintenance Alerts
  /api/v1/equipment/geofence/event:
    post:
      description: "Handle a geofence entry event and, when appropriate, auto-draft\na FieldOperation in field-management-service.\n\nCalled by the fleet/geofencing worker whenever tracked equipment\ncrosses a geofence boundary. Returns:\n\n* ``reason=drafted`` + ``operation_id`` — a draft FieldOperation\n  was created in field-management-service, status pending review.\n* ``reason=skipped`` — the event was not actionable (wrong zone\n  type, not an entry, no field mapping).\n* ``reason=pending_retry`` — field-management-service was\n  unreachable, the event is logged and should be retried.\n\nThe draft is NEVER auto-approved. A human operator must confirm\nvia the existing ``POST /api/v1/field-operations/:id/approve``\nendpoint before it counts for cost rollup, ERP sync, or carbon.\n\nSecurity: the equipment must exist and belong to the authenticated\ntenant. Cross-tenant geofence events are rejected with 404."
      operationId: geofence_event_api_v1_equipment_geofence_event_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeofenceEventPayload'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Geofence Event
  /api/v1/equipment/maintenance-schedule:
    get:
      description: "Return the upcoming maintenance schedule.\n\nCombines two sources:\n\n1. ``MaintenanceAlert`` rows scoped to the tenant (via the equipment join),\n   which represent service tickets the system has already raised.\n2. Equipment whose ``next_maintenance_at`` falls inside the look-ahead\n   window -- these are upcoming scheduled services that may not yet have\n   an explicit alert row.\n\nThe endpoint is the authoritative source for the frontend\n``/api/v1/equipment/maintenance-schedule`` call, which used to 404."
      operationId: get_maintenance_schedule_api_v1_equipment_maintenance_schedule_get
      parameters:
      - description: Look-ahead window in days for upcoming maintenance
        in: query
        name: days_ahead
        required: false
        schema:
          default: 90
          description: Look-ahead window in days for upcoming maintenance
          maximum: 365
          minimum: 1
          title: Days Ahead
          type: integer
      - in: query
        name: priority
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MaintenancePriority'
          - type: 'null'
          title: Priority
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Maintenance Schedule Api V1 Equipment Maintenance Schedule Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Maintenance Schedule
  /api/v1/equipment/qr/{qr_code}:
    get:
      description: Get equipment by QR code.
      operationId: get_equipment_by_qr_api_v1_equipment_qr__qr_code__get
      parameters:
      - in: path
        name: qr_code
        required: true
        schema:
          title: Qr Code
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Equipment By Qr Api V1 Equipment Qr  Qr Code  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Equipment By Qr
  /api/v1/equipment/stats:
    get:
      description: Get equipment statistics
      operationId: get_equipment_stats_api_v1_equipment_stats_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Equipment Stats Api V1 Equipment Stats Get
                type: object
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Get Equipment Stats
  /api/v1/equipment/{equipment_id}:
    delete:
      description: Delete equipment
      operationId: delete_equipment_api_v1_equipment__equipment_id__delete
      parameters:
      - in: path
        name: equipment_id
        required: true
        schema:
          title: Equipment Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Delete Equipment
    get:
      description: 'Get equipment by ID.


        Returns the unified response shape emitted by :func:`serialize_equipment`

        (legacy snake_case fields + new camelCase frontend aliases).'
      operationId: get_equipment_api_v1_equipment__equipment_id__get
      parameters:
      - in: path
        name: equipment_id
        required: true
        schema:
          title: Equipment Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Equipment Api V1 Equipment  Equipment Id  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Equipment
    put:
      description: Update equipment
      operationId: update_equipment_api_v1_equipment__equipment_id__put
      parameters:
      - in: path
        name: equipment_id
        required: true
        schema:
          title: Equipment Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Update Equipment Api V1 Equipment  Equipment Id  Put
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update Equipment
  /api/v1/equipment/{equipment_id}/issues:
    post:
      description: "Report an issue/incident against a piece of equipment.\n\nThis endpoint is an **event-first** replacement for the missing DB-backed\nissues table. Behaviour:\n\n1. Verifies the equipment exists and belongs to the authenticated tenant.\n2. Builds an ``EquipmentIssueResponse`` payload with a synthetic issue_id.\n3. Best-effort publishes the payload to NATS on the subject\n   ``sahool.tenant.{tenant_id}.equipment.issue_reported`` so downstream\n   services (notification, audit, ticketing) can react. Publishing is\n   best-effort: the HTTP call returns ``202 Accepted`` even if the NATS\n   connection is unavailable (the payload is still logged for later\n   reconciliation).\n\nReturns ``202 Accepted`` to signal the issue has been queued."
      operationId: report_equipment_issue_api_v1_equipment__equipment_id__issues_post
      parameters:
      - in: path
        name: equipment_id
        required: true
        schema:
          title: Equipment Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentIssueCreate'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentIssueResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Report Equipment Issue
  /api/v1/equipment/{equipment_id}/location:
    post:
      description: Update equipment GPS location
      operationId: update_equipment_location_api_v1_equipment__equipment_id__location_post
      parameters:
      - in: path
        name: equipment_id
        required: true
        schema:
          title: Equipment Id
          type: string
      - in: query
        name: lat
        required: true
        schema:
          title: Lat
          type: number
      - in: query
        name: lon
        required: true
        schema:
          title: Lon
          type: number
      - in: query
        name: location_name
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Name
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Update Equipment Location Api V1 Equipment  Equipment Id  Location Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update Equipment Location
  /api/v1/equipment/{equipment_id}/maintenance:
    get:
      description: Get maintenance history for equipment
      operationId: get_maintenance_history_api_v1_equipment__equipment_id__maintenance_get
      parameters:
      - in: path
        name: equipment_id
        required: true
        schema:
          title: Equipment Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Maintenance History Api V1 Equipment  Equipment Id  Maintenance Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Maintenance History
    post:
      description: Add a maintenance record
      operationId: add_maintenance_record_api_v1_equipment__equipment_id__maintenance_post
      parameters:
      - in: path
        name: equipment_id
        required: true
        schema:
          title: Equipment Id
          type: string
      - in: query
        name: maintenance_type
        required: true
        schema:
