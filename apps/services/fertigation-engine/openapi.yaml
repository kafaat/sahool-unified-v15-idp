components:
  schemas:
    FertigationPlan:
      description: Fertigation schedule result.
      properties:
        cost_per_ha_sar:
          title: Cost Per Ha Sar
          type: number
        crop:
          title: Crop
          type: string
        crop_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Crop Ar
        ec_fertilizer_contribution:
          title: Ec Fertilizer Contribution
          type: number
        ec_total:
          title: Ec Total
          type: number
        ec_water:
          title: Ec Water
          type: number
        ec_within_limit:
          title: Ec Within Limit
          type: boolean
        fertilizer_plan:
          items:
            additionalProperties: true
            type: object
          title: Fertilizer Plan
          type: array
        field_area_ha:
          title: Field Area Ha
          type: number
        growth_phase:
          title: Growth Phase
          type: string
        k_adjusted_kg_ha:
          title: K Adjusted Kg Ha
          type: number
        k_required_kg_ha:
          title: K Required Kg Ha
          type: number
        n_adjusted_kg_ha:
          title: N Adjusted Kg Ha
          type: number
        n_loss_risk:
          title: N Loss Risk
          type: string
        n_loss_risk_ar:
          title: N Loss Risk Ar
          type: string
        n_required_kg_ha:
          title: N Required Kg Ha
          type: number
        p_adjusted_kg_ha:
          title: P Adjusted Kg Ha
          type: number
        p_loss_risk:
          title: P Loss Risk
          type: string
        p_loss_risk_ar:
          title: P Loss Risk Ar
          type: string
        p_required_kg_ha:
          title: P Required Kg Ha
          type: number
        recommendations:
          items:
            type: string
          title: Recommendations
          type: array
        recommendations_ar:
          items:
            type: string
          title: Recommendations Ar
          type: array
        total_cost_sar:
          title: Total Cost Sar
          type: number
      required:
      - crop
      - growth_phase
      - field_area_ha
      - n_required_kg_ha
      - p_required_kg_ha
      - k_required_kg_ha
      - n_adjusted_kg_ha
      - p_adjusted_kg_ha
      - k_adjusted_kg_ha
      - fertilizer_plan
      - ec_water
      - ec_fertilizer_contribution
      - ec_total
      - ec_within_limit
      - total_cost_sar
      - cost_per_ha_sar
      - n_loss_risk
      - n_loss_risk_ar
      - p_loss_risk
      - p_loss_risk_ar
      - recommendations
      - recommendations_ar
      title: FertigationPlan
      type: object
    FertigationRequest:
      description: Calculate fertigation schedule for a field.
      properties:
        crop:
          description: Crop name
          title: Crop
          type: string
        ec_water:
          default: 0.5
          description: Irrigation water EC (dS/m)
          title: Ec Water
          type: number
        field_area_ha:
          default: 1.0
          description: Field area (ha)
          minimum: 0.01
          title: Field Area Ha
          type: number
        growth_phase:
          $ref: '#/components/schemas/GrowthPhase'
        irrigation_volume_m3:
          description: Irrigation volume per event (m³)
          title: Irrigation Volume M3
          type: number
        max_ec_solution:
          default: 2.5
          description: Max EC of fertigation solution (dS/m)
          title: Max Ec Solution
          type: number
        preferred_fertilizers:
          anyOf:
          - items:
              $ref: '#/components/schemas/FertilizerType'
            type: array
          - type: 'null'
          title: Preferred Fertilizers
        soil_k_ppm:
          anyOf:
          - type: number
          - type: 'null'
          description: Current soil K (ppm)
          title: Soil K Ppm
        soil_n_ppm:
          anyOf:
          - type: number
          - type: 'null'
          description: Current soil N (ppm)
          title: Soil N Ppm
        soil_p_ppm:
          anyOf:
          - type: number
          - type: 'null'
          description: Current soil P (ppm)
          title: Soil P Ppm
        target_yield_tha:
          anyOf:
          - type: number
          - type: 'null'
          description: Target yield (t/ha)
          title: Target Yield Tha
      required:
      - crop
      - growth_phase
      - irrigation_volume_m3
      title: FertigationRequest
      type: object
    FertilizerType:
      enum:
      - urea
      - dap
      - map
      - kcl
      - sop
      - ammonium_nitrate
      - calcium_nitrate
      - potassium_nitrate
      - npk_20_20_20
      - npk_15_15_15
      - phosphoric_acid
      - sulfuric_acid
      title: FertilizerType
      type: string
    GrowthPhase:
      enum:
      - germination
      - seedling
      - vegetative
      - tillering
      - flowering
      - fruit_development
      - ripening
      - harvest
      title: GrowthPhase
      type: string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    NutrientBalance:
      description: Nutrient balance summary.
      properties:
        crop:
          title: Crop
          type: string
        deficit_alert:
          title: Deficit Alert
          type: boolean
        field_id:
          title: Field Id
          type: string
        k_balance_kg_ha:
          title: K Balance Kg Ha
          type: number
        k_efficiency_pct:
          title: K Efficiency Pct
          type: number
        n_balance_kg_ha:
          title: N Balance Kg Ha
          type: number
        n_efficiency_pct:
          title: N Efficiency Pct
          type: number
        p_balance_kg_ha:
          title: P Balance Kg Ha
          type: number
        p_efficiency_pct:
          title: P Efficiency Pct
          type: number
        recommendations:
          items:
            type: string
          title: Recommendations
          type: array
        recommendations_ar:
          items:
            type: string
          title: Recommendations Ar
          type: array
        surplus_alert:
          title: Surplus Alert
          type: boolean
      required:
      - field_id
      - crop
      - n_balance_kg_ha
      - p_balance_kg_ha
      - k_balance_kg_ha
      - n_efficiency_pct
      - p_efficiency_pct
      - k_efficiency_pct
      - surplus_alert
      - deficit_alert
      - recommendations
      - recommendations_ar
      title: NutrientBalance
      type: object
    NutrientBalanceRequest:
      description: Track nutrient balance over time.
      properties:
        crop:
          title: Crop
          type: string
        entries:
          description: 'List of {date, type: ''applied''|''removed'', n_kg, p_kg, k_kg}'
          items:
            additionalProperties: true
            type: object
          title: Entries
          type: array
        field_id:
          title: Field Id
          type: string
      required:
      - field_id
      - crop
      - entries
      title: NutrientBalanceRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: Integrated fertilizer + irrigation management with NPK scheduling
  title: Fertigation Engine
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/fertigation/crops:
    get:
      description: List crops with NPK data available.
      operationId: list_crops_with_npk_api_v1_fertigation_crops_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Crops With Npk
  /api/v1/fertigation/crops/{crop_name}/npk:
    get:
      description: Get NPK requirements by growth phase for a crop.
      operationId: get_crop_npk_api_v1_fertigation_crops__crop_name__npk_get
      parameters:
      - in: path
        name: crop_name
        required: true
        schema:
          title: Crop Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Crop Npk
  /api/v1/fertigation/fertilizers:
    get:
      description: List available fertilizers with NPK content and pricing.
      operationId: list_fertilizers_api_v1_fertigation_fertilizers_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Fertilizers
  /api/v1/fertigation/growth-phases:
    get:
      description: List available growth phases.
      operationId: list_growth_phases_api_v1_fertigation_growth_phases_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Growth Phases
  /api/v1/fertigation/nutrient-balance:
    post:
      description: Track and analyze nutrient balance for a field.
      operationId: calculate_balance_api_v1_fertigation_nutrient_balance_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NutrientBalanceRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutrientBalance'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Calculate Balance
  /api/v1/fertigation/plan:
    post:
      description: 'Calculate fertigation plan with NPK requirements, fertilizer selection,

        EC management, and environmental risk assessment.'
      operationId: create_fertigation_plan_api_v1_fertigation_plan_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FertigationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FertigationPlan'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Fertigation Plan
  /healthz:
    get:
      operationId: health_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /readyz:
    get:
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
