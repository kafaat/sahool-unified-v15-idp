          - type: 'null'
          title: Message Ar
        recommendations:
          items:
            type: string
          type: array
          title: Recommendations
        recommendations_ar:
          items:
            type: string
          type: array
          title: Recommendations Ar
        expire_hours:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expire Hours
      type: object
      required:
      - alert_type
      - severity
      - title
      - message
      title: AlertConfig
      description: 'إعداد التنبيه

        Alert Configuration'
    ConditionOperator:
