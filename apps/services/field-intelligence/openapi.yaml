          type: object
          title: Metadata
      type: object
      required:
      - action_type
      title: ActionConfig
      description: 'إعداد الإجراء

        Action Configuration'
    ActionType:
      type: string
      enum:
      - create_task
      - send_notification
      - create_alert
      - update_field
      - trigger_irrigation
      - webhook
      - log_event
