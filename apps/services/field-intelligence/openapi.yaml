          type: string
          title: Tenant Id
        field_id:
          type: string
          title: Field Id
        event_type:
          $ref: '#/components/schemas/EventType'
        severity:
          $ref: '#/components/schemas/EventSeverity'
        title:
          type: string
          title: Title
        title_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Title Ar
        description:
          type: string
          title: Description
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Description Ar
        source_service:
          type: string
          title: Source Service
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
        location:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Location
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
      type: object
      required:
      - tenant_id
      - field_id
      - event_type
      - severity
      - title
      - description
      - source_service
      title: EventCreate
      description: 'إنشاء حدث جديد

