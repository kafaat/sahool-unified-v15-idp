      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: "\n    خدمة ذكاء الحقول والقواعد الآلية\n    Field Intelligence and Automation Rules Service\n\n    **Features:**\n    - \U0001F916 محرك القواعد للأتمتة الحقلية - Rules engine for field automation\n    - \U0001F4CA معالجة الأحداث - Event processing (NDVI drop, weather alert, soil moisture)\n    - ✅ إنشاء المهام التلقائية - Auto task creation from events\n    - \U0001F514 تفعيل الإشعارات - Notification triggers\n    - \U0001F319 التكامل مع التقويم الفلكي - Integration with astronomical calendar\n\n    **Supported Events:**\n    - NDVI drop/anomaly detection\n    - Weather alerts (frost, heatwave, storm, etc.)\n    - Soil moisture (low/high)\n    - Temperature extremes\n    - Pest/disease detection\n    - Irrigation needs\n    - Harvest readiness\n    - Astronomical events\n\n    **Automation Actions:**\n    - Create tasks automatically\n    - Send notifications (push, SMS, email, WhatsApp)\n    - Create alerts\n    - Trigger irrigation systems\n    - Call webhooks\n    - Log events\n    "
  title: SAHOOL Field Intelligence Service
  version: 16.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: 'معلومات الخدمة - Service information

        Root endpoint with service information'
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
      tags:
      - Info
  /api/v1/events:
    get:
      description: 'قائمة الأحداث مع الفلترة

        List events with filters'
      operationId: list_events_api_v1_events_get
      parameters:
      - description: تصفية حسب الحقل
        in: query
        name: field_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: تصفية حسب الحقل
          title: Field Id
      - description: تصفية حسب نوع الحدث
        in: query
        name: event_type
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EventType'
          - type: 'null'
          description: تصفية حسب نوع الحدث
          title: Event Type
      - description: تصفية حسب الحالة
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EventStatus'
          - type: 'null'
          description: تصفية حسب الحالة
          title: Status
      - description: من تاريخ
        in: query
        name: start_date
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: من تاريخ
          title: Start Date
      - description: إلى تاريخ
        in: query
        name: end_date
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: إلى تاريخ
          title: End Date
      - in: query
        name: skip
        required: false
        schema:
          default: 0
          minimum: 0
          title: Skip
          type: integer
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Events Api V1 Events Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Events
      tags:
      - Field Intelligence
      - Events
    post:
      description: 'إنشاء حدث حقلي جديد

        Create a new field event


        يقوم بـ:

        - إنشاء الحدث

        - تقييم القواعد المطابقة

        - تنفيذ الإجراءات (مهام، إشعارات، تنبيهات)'
      operationId: create_event_api_v1_events_post
      parameters:
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Event
      tags:
      - Field Intelligence
      - Events
  /api/v1/events/field/{field_id}/stats:
    get:
      description: 'إحصائيات الأحداث للحقل

        Event statistics for a field'
      operationId: get_field_event_stats_api_v1_events_field__field_id__stats_get
      parameters:
      - description: معرف الحقل
        in: path
        name: field_id
        required: true
        schema:
          description: معرف الحقل
          title: Field Id
          type: string
      - description: عدد الأيام للإحصائيات
        in: query
        name: days
        required: false
        schema:
          default: 30
          description: عدد الأيام للإحصائيات
          maximum: 90
          minimum: 1
          title: Days
          type: integer
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Field Event Stats Api V1 Events Field  Field Id  Stats Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Field Event Stats
      tags:
      - Field Intelligence
      - Events
  /api/v1/events/{event_id}:
    get:
      description: 'جلب حدث محدد

        Get a specific event'
      operationId: get_event_api_v1_events__event_id__get
      parameters:
      - description: معرف الحدث
        in: path
        name: event_id
        required: true
        schema:
          description: معرف الحدث
          title: Event Id
          type: string
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Event
      tags:
      - Field Intelligence
      - Events
  /api/v1/events/{event_id}/status:
    patch:
      description: 'تحديث حالة الحدث

        Update event status'
      operationId: update_event_status_api_v1_events__event_id__status_patch
      parameters:
      - description: معرف الحدث
        in: path
        name: event_id
        required: true
        schema:
          description: معرف الحدث
          title: Event Id
          type: string
      - description: الحالة الجديدة
        in: query
        name: new_status
        required: true
        schema:
          $ref: '#/components/schemas/EventStatus'
          description: الحالة الجديدة
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
