components:
  schemas:
    ActionConfig:
      description: 'إعداد الإجراء

        Action Configuration'
      properties:
        action_type:
          $ref: '#/components/schemas/ActionType'
        alert_config:
          anyOf:
          - $ref: '#/components/schemas/AlertConfig'
          - type: 'null'
        enabled:
          default: true
          title: Enabled
          type: boolean
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        notification_config:
          anyOf:
          - $ref: '#/components/schemas/NotificationConfig'
          - type: 'null'
        task_config:
          anyOf:
          - $ref: '#/components/schemas/TaskConfig'
          - type: 'null'
        webhook_config:
          anyOf:
          - $ref: '#/components/schemas/WebhookConfig'
          - type: 'null'
      required:
      - action_type
      title: ActionConfig
      type: object
    ActionType:
      description: أنواع الإجراءات - Action Types
      enum:
      - create_task
      - send_notification
      - create_alert
      - update_field
      - trigger_irrigation
      - webhook
      - log_event
      title: ActionType
      type: string
    AlertConfig:
      description: 'إعداد التنبيه

        Alert Configuration'
      properties:
        alert_type:
          title: Alert Type
          type: string
        expire_hours:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expire Hours
        message:
          title: Message
          type: string
        message_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Message Ar
        recommendations:
          items:
            type: string
          title: Recommendations
          type: array
        recommendations_ar:
          items:
            type: string
          title: Recommendations Ar
          type: array
        severity:
          title: Severity
          type: string
        title:
          title: Title
          type: string
        title_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Title Ar
      required:
      - alert_type
      - severity
      - title
      - message
      title: AlertConfig
      type: object
    ConditionOperator:
      description: معاملات الشرط - Condition Operators
      enum:
      - equals
      - not_equals
      - greater_than
      - less_than
      - greater_equal
      - less_equal
      - contains
      - in
      - between
      title: ConditionOperator
      type: string
    EventCreate:
      description: 'إنشاء حدث جديد

        Create New Event'
      properties:
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        description:
          title: Description
          type: string
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Description Ar
        event_type:
          $ref: '#/components/schemas/EventType'
        field_id:
          title: Field Id
          type: string
        location:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Location
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        severity:
          $ref: '#/components/schemas/EventSeverity'
        source_service:
          title: Source Service
          type: string
        tenant_id:
          title: Tenant Id
          type: string
        title:
          title: Title
          type: string
        title_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Title Ar
      required:
      - tenant_id
      - field_id
      - event_type
      - severity
      - title
      - description
      - source_service
      title: EventCreate
      type: object
    EventResponse:
      description: 'استجابة الحدث

        Event Response'
      properties:
        acknowledged_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Acknowledged At
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        created_at:
          format: date-time
          title: Created At
          type: string
        created_tasks:
          description: معرفات المهام التي تم إنشاؤها
          items:
            type: string
          title: Created Tasks
          type: array
        description:
          title: Description
          type: string
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Description Ar
        event_id:
          title: Event Id
          type: string
        event_type:
          $ref: '#/components/schemas/EventType'
        field_id:
          title: Field Id
          type: string
        location:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Location
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        notifications_sent:
          default: 0
          description: عدد الإشعارات المرسلة
          title: Notifications Sent
          type: integer
        resolved_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Resolved At
        severity:
          $ref: '#/components/schemas/EventSeverity'
        source_service:
          title: Source Service
          type: string
        status:
          $ref: '#/components/schemas/EventStatus'
        tenant_id:
          title: Tenant Id
          type: string
        title:
          title: Title
          type: string
        title_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Title Ar
        triggered_rules:
          description: معرفات القواعد التي تم تفعيلها
          items:
            type: string
          title: Triggered Rules
          type: array
      required:
      - event_id
      - tenant_id
      - field_id
      - event_type
      - severity
      - status
      - title
      - description
      - source_service
      - metadata
      - created_at
      title: EventResponse
      type: object
    EventSeverity:
      description: درجات خطورة الحدث - Event Severity
      enum:
      - low
      - medium
      - high
      - critical
      title: EventSeverity
      type: string
    EventStatus:
      description: حالات الحدث - Event Status
      enum:
      - active
      - acknowledged
      - resolved
      - ignored
      title: EventStatus
      type: string
    EventType:
      description: أنواع الأحداث - Event Types
      enum:
      - ndvi_drop
      - ndvi_anomaly
      - weather_alert
      - soil_moisture_low
      - soil_moisture_high
      - temperature_extreme
      - pest_detection
      - disease_detection
      - irrigation_needed
      - harvest_ready
      - astronomical_event
      - custom
      title: EventType
      type: string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    NotificationConfig:
      description: 'إعداد الإشعار

        Notification Configuration'
      properties:
        channels:
          description: 'قنوات الإشعار: push, sms, email, whatsapp'
          items:
            type: string
          title: Channels
          type: array
        message:
          title: Message
          type: string
        message_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Message Ar
        priority:
          default: normal
          title: Priority
          type: string
        recipients:
          description: معرفات المستلمين أو 'field_owner'
          items:
            type: string
          title: Recipients
          type: array
        template_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Template Id
        title:
          title: Title
          type: string
        title_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Title Ar
      required:
      - title
      - message
      title: NotificationConfig
      type: object
    RuleCondition:
      description: 'شرط القاعدة

        Rule Condition'
      properties:
        field:
          description: الحقل للفحص (e.g., 'event_type', 'severity')
          title: Field
          type: string
        operator:
          $ref: '#/components/schemas/ConditionOperator'
        value:
          description: القيمة للمقارنة
          title: Value
        value_type:
          default: string
          description: 'نوع البيانات: string, number, boolean, list'
          title: Value Type
          type: string
      required:
      - field
      - operator
      - value
      title: RuleCondition
      type: object
    RuleConditionGroup:
      description: 'مجموعة شروط (AND/OR)

        Condition Group with logical operators'
      properties:
        conditions:
          items:
            $ref: '#/components/schemas/RuleCondition'
          title: Conditions
          type: array
        logic:
          default: AND
          description: 'المعامل المنطقي: AND أو OR'
          title: Logic
          type: string
      title: RuleConditionGroup
      type: object
    RuleCreate:
      description: 'إنشاء قاعدة جديدة

        Create New Rule'
      properties:
        actions:
          items:
            $ref: '#/components/schemas/ActionConfig'
          title: Actions
          type: array
        conditions:
          $ref: '#/components/schemas/RuleConditionGroup'
        cooldown_minutes:
          default: 60
          title: Cooldown Minutes
          type: integer
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Description Ar
        event_types:
          items:
            type: string
          title: Event Types
          type: array
        field_ids:
          items:
            type: string
          title: Field Ids
          type: array
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        name:
          title: Name
          type: string
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
        priority:
          default: 100
          title: Priority
          type: integer
        status:
          $ref: '#/components/schemas/RuleStatus'
          default: active
        tenant_id:
          title: Tenant Id
          type: string
      required:
      - tenant_id
      - name
      - conditions
      - actions
      title: RuleCreate
      type: object
    RuleResponse:
      description: 'استجابة القاعدة

        Rule Response'
      properties:
        actions:
          items:
            $ref: '#/components/schemas/ActionConfig'
          title: Actions
          type: array
        conditions:
          $ref: '#/components/schemas/RuleConditionGroup'
        cooldown_minutes:
          title: Cooldown Minutes
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Description Ar
        event_types:
          items:
            type: string
          title: Event Types
          type: array
        field_ids:
          items:
            type: string
          title: Field Ids
          type: array
        last_triggered_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Triggered At
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        name:
          title: Name
          type: string
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
        priority:
          title: Priority
          type: integer
        rule_id:
          title: Rule Id
          type: string
        status:
          $ref: '#/components/schemas/RuleStatus'
        tenant_id:
          title: Tenant Id
          type: string
        trigger_count:
          title: Trigger Count
          type: integer
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - rule_id
      - tenant_id
      - name
      - status
      - field_ids
      - event_types
      - conditions
      - actions
      - cooldown_minutes
      - priority
      - created_at
      - updated_at
      - trigger_count
      - metadata
      title: RuleResponse
      type: object
    RuleStatus:
      description: حالات القاعدة - Rule Status
      enum:
      - active
      - inactive
      - paused
      title: RuleStatus
      type: string
    RuleUpdate:
      description: 'تحديث القاعدة

        Update Rule'
      properties:
        actions:
          anyOf:
          - items:
              $ref: '#/components/schemas/ActionConfig'
            type: array
          - type: 'null'
          title: Actions
        conditions:
          anyOf:
          - $ref: '#/components/schemas/RuleConditionGroup'
          - type: 'null'
        cooldown_minutes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Cooldown Minutes
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Description Ar
        event_types:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Event Types
        field_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Field Ids
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
        priority:
          anyOf:
          - type: integer
          - type: 'null'
          title: Priority
        status:
          anyOf:
          - $ref: '#/components/schemas/RuleStatus'
          - type: 'null'
      title: RuleUpdate
      type: object
    TaskConfig:
      description: 'إعداد المهمة التلقائية

        Auto-Task Configuration'
      properties:
        assign_to:
          anyOf:
          - type: string
          - type: 'null'
          title: Assign To
        description:
          title: Description
          type: string
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Description Ar
        due_hours:
          default: 24
          description: المهمة مستحقة بعد كم ساعة من الحدث
          title: Due Hours
          type: integer
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        priority:
          default: medium
          title: Priority
          type: string
        task_type:
          title: Task Type
          type: string
        title:
          title: Title
          type: string
        title_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Title Ar
      required:
      - title
      - description
      - task_type
      title: TaskConfig
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WebhookConfig:
      description: 'إعداد Webhook

        Webhook Configuration'
      properties:
        body_template:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Body Template
        headers:
          additionalProperties:
            type: string
          title: Headers
          type: object
        method:
          default: POST
          title: Method
          type: string
        retry_count:
          default: 3
          title: Retry Count
          type: integer
        timeout_seconds:
          default: 10
