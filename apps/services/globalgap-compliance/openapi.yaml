openapi: 3.1.0
info:
  title: SAHOOL GlobalGAP Compliance Service
  description: "\n    خدمة الامتثال لمعايير GlobalGAP IFA v6\n    GlobalGAP IFA v6 Compliance Service\n\n    ## الميزات الرئيسية | Main Features\n\n    - تتبع الامتثال للمزارع | Farm compliance tracking\n    - إدارة قوائم المراجعة | Checklist management\n    - إعداد تقارير التدقيق | Audit report preparation\n    - إدارة شهادات GGN | GGN certificate management\n    - تتبع عدم المطابقات والإجراءات التصحيحية | Non-conformity and corrective action tracking\n    "
  version: 16.0.0
paths:
  /health:
    get:
      summary: Health
      description: 'Health check with dependencies

        فحص الصحة مع التبعيات'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /healthz:
    get:
      summary: Liveness
      description: 'Kubernetes liveness probe

        فحص الصحة - Kubernetes liveness probe'
      operationId: liveness_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/live:
    get:
      summary: Liveness
      description: 'Kubernetes liveness probe

        فحص الصحة - Kubernetes liveness probe'
      operationId: liveness_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /readyz:
    get:
      summary: Readiness
      description: 'Kubernetes readiness probe

        فحص الجاهزية - Kubernetes readiness probe'
      operationId: readiness_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/ready:
    get:
      summary: Readiness
      description: 'Kubernetes readiness probe

        فحص الجاهزية - Kubernetes readiness probe'
      operationId: readiness_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /farms/{farm_id}/compliance:
    get:
      summary: Get Farm Compliance
      description: 'Get current compliance status for a farm

        الحصول على حالة الامتثال الحالية للمزرعة'
      operationId: get_farm_compliance_farms__farm_id__compliance_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: farm_id
        in: path
        required: true
        schema:
          type: string
          title: Farm Id
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Create Or Update Compliance
      description: 'Create or update compliance record for a farm

        إنشاء أو تحديث سجل الامتثال للمزرعة'
      operationId: create_or_update_compliance_farms__farm_id__compliance_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: farm_id
        in: path
        required: true
        schema:
          type: string
          title: Farm Id
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplianceRecord'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /farms/{farm_id}/compliance/trends:
    get:
      summary: Get Compliance Trends
      description: 'Get compliance trends over time

        الحصول على اتجاهات الامتثال عبر الزمن'
      operationId: get_compliance_trends_farms__farm_id__compliance_trends_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: farm_id
        in: path
        required: true
        schema:
          type: string
          title: Farm Id
      - name: months
        in: query
        required: false
        schema:
          type: integer
          maximum: 24
          minimum: 1
          default: 12
          title: Months
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /checklists:
    get:
      summary: Get Checklists
      description: 'Get available checklists

        الحصول على قوائم المراجعة المتاحة'
      operationId: get_checklists_checklists_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: ifa_version
        in: query
        required: false
        schema:
          type: string
          description: IFA version | إصدار معايير IFA
          default: '6.0'
          title: Ifa Version
        description: IFA version | إصدار معايير IFA
      - name: checklist_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: full, partial, follow_up
          title: Checklist Type
        description: full, partial, follow_up
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /checklists/{checklist_id}/items:
    get:
      summary: Get Checklist Items
      description: 'Get checklist items (control points)

        الحصول على عناصر قائمة المراجعة (نقاط التحكم)'
      operationId: get_checklist_items_checklists__checklist_id__items_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: checklist_id
        in: path
        required: true
        schema:
          type: string
          title: Checklist Id
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ChecklistCategory'
          - type: 'null'
          title: Category
      - name: compliance_level
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ComplianceLevel'
          - type: 'null'
          title: Compliance Level
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /farms/{farm_id}/assessments:
    post:
      summary: Create Assessment
      description: 'Create or update a checklist assessment for a farm

        إنشاء أو تحديث تقييم قائمة المراجعة للمزرعة'
      operationId: create_assessment_farms__farm_id__assessments_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: farm_id
        in: path
        required: true
        schema:
          type: string
          title: Farm Id
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistAssessment'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: Get Farm Assessments
      description: 'Get all assessments for a farm

        الحصول على جميع التقييمات للمزرعة'
      operationId: get_farm_assessments_farms__farm_id__assessments_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: farm_id
        in: path
        required: true
        schema:
          type: string
          title: Farm Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ControlPointStatus'
          - type: 'null'
          title: Status
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /audits:
    post:
      summary: Create Audit
      description: 'Prepare and create an audit report

        إعداد وإنشاء تقرير تدقيق'
      operationId: create_audit_audits_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: farm_id
        in: query
        required: true
        schema:
          type: string
          description: Farm identifier
          title: Farm Id
        description: Farm identifier
      - name: audit_type
        in: query
        required: false
        schema:
          type: string
          description: internal, external, certification
          default: internal
          title: Audit Type
        description: internal, external, certification
      - name: auditor_name
        in: query
        required: true
        schema:
          type: string
          description: Name of auditor
          title: Auditor Name
        description: Name of auditor
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /audits/{audit_id}:
    get:
      summary: Get Audit
      description: 'Get audit result by ID

        الحصول على نتيجة التدقيق حسب المعرف'
      operationId: get_audit_audits__audit_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: audit_id
        in: path
        required: true
        schema:
          type: string
          title: Audit Id
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /farms/{farm_id}/audits:
    get:
      summary: Get Farm Audits
      description: 'Get audit history for a farm

        الحصول على سجل التدقيق للمزرعة'
      operationId: get_farm_audits_farms__farm_id__audits_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: farm_id
        in: path
        required: true
        schema:
          type: string
          title: Farm Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Limit
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /farms/{farm_id}/non-conformities:
    get:
      summary: Get Farm Non Conformities
      description: 'Get non-conformities for a farm

        الحصول على عدم المطابقات للمزرعة'
      operationId: get_farm_non_conformities_farms__farm_id__non_conformities_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: farm_id
        in: path
        required: true
        schema:
          type: string
          title: Farm Id
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SeverityLevel'
          - type: 'null'
          title: Severity
      - name: resolved
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Resolved
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /non-conformities:
    post:
      summary: Create Non Conformity
      description: 'Create a new non-conformity record

        إنشاء سجل عدم مطابقة جديد'
      operationId: create_non_conformity_non_conformities_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NonConformity'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /farms/{farm_id}/certificates:
    get:
      summary: Get Farm Certificates
      description: 'Get GGN certificates for a farm

        الحصول على شهادات GGN للمزرعة'
      operationId: get_farm_certificates_farms__farm_id__certificates_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: farm_id
        in: path
        required: true
        schema:
          type: string
          title: Farm Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/CertificateStatus'
          - type: 'null'
          title: Status
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /certificates:
    post:
      summary: Create Certificate
      description: 'Create a new GGN certificate

        إنشاء شهادة GGN جديدة'
      operationId: create_certificate_certificates_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GGNCertificate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /certificates/{certificate_id}:
    get:
      summary: Get Certificate
      description: 'Get certificate by ID

        الحصول على الشهادة حسب المعرف'
      operationId: get_certificate_certificates__certificate_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: certificate_id
        in: path
        required: true
        schema:
          type: string
          title: Certificate Id
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CertificateStatus:
      type: string
      enum:
      - active
      - expired
      - suspended
      - withdrawn
      - pending_approval
      - renewal_required
      title: CertificateStatus
      description: 'Certificate status

        حالة الشهادة'
    CertificationBody:
      properties:
        name:
          type: string
          title: Name
          description: Certification body name | اسم الجهة المانحة للشهادة
        code:
          type: string
          title: Code
          description: CB code | رمز الجهة
        country:
          type: string
          title: Country
          description: Country | الدولة
        contact_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Email
        contact_phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Phone
        website:
          anyOf:
          - type: string
          - type: 'null'
          title: Website
        accreditation_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Accreditation Number
      type: object
      required:
      - name
      - code
      - country
      title: CertificationBody
      description: 'Certification body information

        معلومات الجهة المانحة للشهادة'
    CertificationScope:
      type: string
      enum:
      - crops_base
      - fruit_vegetables
      - combinable_crops
      - plant_propagation
      - flowers_ornamentals
      title: CertificationScope
      description: 'Certification scope

        نطاق الشهادة'
    ChecklistAssessment:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        farm_id:
          type: string
          title: Farm Id
        tenant_id:
          type: string
          title: Tenant Id
        checklist_item_id:
          type: string
          title: Checklist Item Id
        control_point_number:
          type: string
          title: Control Point Number
        status:
          $ref: '#/components/schemas/ControlPointStatus'
          description: Assessment status | حالة التقييم
          default: not_assessed
        evidence_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Description
        evidence_photos:
          items:
            type: string
          type: array
          title: Evidence Photos
        evidence_documents:
          items:
            type: string
          type: array
          title: Evidence Documents
        assessor_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Assessor Notes
        non_compliance_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Non Compliance Reason
        corrective_action_required:
          type: boolean
          title: Corrective Action Required
          default: false
        corrective_action_plan:
          anyOf:
          - type: string
          - type: 'null'
          title: Corrective Action Plan
        corrective_action_deadline:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Corrective Action Deadline
        corrective_action_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Corrective Action Status
        assessed_by:
          type: string
          title: Assessed By
          description: Assessor name | اسم المقيم
        assessment_date:
          type: string
          format: date-time
          title: Assessment Date
        verified_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Verified By
        verification_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Verification Date
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - farm_id
      - tenant_id
      - checklist_item_id
      - control_point_number
      - assessed_by
      title: ChecklistAssessment
      description: 'Assessment of a checklist item for a specific farm

        تقييم عنصر قائمة المراجعة لمزرعة معينة'
      example:
        assessed_by: أحمد محمد
        assessment_date: '2025-12-28T10:00:00Z'
        checklist_item_id: item_af_1_1_1
        control_point_number: AF.1.1.1
        farm_id: farm_12345
        status: compliant
        tenant_id: tenant_001
    ChecklistCategory:
      type: string
      enum:
      - af_site_management
      - af_soil_management
      - af_fertilizer_use
      - af_irrigation
      - af_crop_protection
      - af_harvest
      - af_produce_handling
      - af_waste_pollution
      - af_worker_health
      - af_environment
      - cb_propagation_material
      - cb_site_history
      title: ChecklistCategory
      description: 'Main checklist categories from IFA v6

        فئات قائمة المراجعة الرئيسية من معايير IFA v6'
    ComplianceLevel:
      type: string
      enum:
      - major_must
      - minor_must
      - recommendation
      title: ComplianceLevel
      description: 'Compliance level according to IFA standards

        مستوى الامتثال وفقًا لمعايير IFA'
    ComplianceRecord:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        farm_id:
          type: string
          title: Farm Id
          description: Farm identifier | معرف المزرعة
        tenant_id:
          type: string
          title: Tenant Id
          description: Tenant identifier | معرف المستأجر
        overall_status:
          $ref: '#/components/schemas/ComplianceStatus'
          description: Overall compliance status | حالة الامتثال الإجمالية
          default: not_assessed
        compliance_percentage:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Compliance Percentage
          description: Compliance percentage | نسبة الامتثال
          default: 0.0
        total_control_points:
          type: integer
          title: Total Control Points
          description: Total control points | إجمالي نقاط التحكم
          default: 0
        compliant_points:
          type: integer
          title: Compliant Points
          description: Compliant control points | نقاط التحكم المتوافقة
          default: 0
        non_compliant_points:
          type: integer
          title: Non Compliant Points
          description: Non-compliant points | نقاط عدم التوافق
          default: 0
        major_must_fails:
          type: integer
          title: Major Must Fails
          description: Major Must non-conformities | عدم المطابقات الرئيسية الإلزامية
          default: 0
