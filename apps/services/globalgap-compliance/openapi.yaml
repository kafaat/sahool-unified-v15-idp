components:
  schemas:
    CertificateStatus:
      description: 'Certificate status

        حالة الشهادة'
      enum:
      - active
      - expired
      - suspended
      - withdrawn
      - pending_approval
      - renewal_required
      title: CertificateStatus
      type: string
    CertificationBody:
      description: 'Certification body information

        معلومات الجهة المانحة للشهادة'
      properties:
        accreditation_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Accreditation Number
        code:
          description: CB code | رمز الجهة
          title: Code
          type: string
        contact_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Email
        contact_phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Phone
        country:
          description: Country | الدولة
          title: Country
          type: string
        name:
          description: Certification body name | اسم الجهة المانحة للشهادة
          title: Name
          type: string
        website:
          anyOf:
          - type: string
          - type: 'null'
          title: Website
      required:
      - name
      - code
      - country
      title: CertificationBody
      type: object
    CertificationScope:
      description: 'Certification scope

        نطاق الشهادة'
      enum:
      - crops_base
      - fruit_vegetables
      - combinable_crops
      - plant_propagation
      - flowers_ornamentals
      title: CertificationScope
      type: string
    ChecklistAssessment:
      description: 'Assessment of a checklist item for a specific farm

        تقييم عنصر قائمة المراجعة لمزرعة معينة'
      example:
        assessed_by: أحمد محمد
        assessment_date: '2025-12-28T10:00:00Z'
        checklist_item_id: item_af_1_1_1
        control_point_number: AF.1.1.1
        farm_id: farm_12345
        status: compliant
        tenant_id: tenant_001
      properties:
        assessed_by:
          description: Assessor name | اسم المقيم
          title: Assessed By
          type: string
        assessment_date:
          format: date-time
          title: Assessment Date
          type: string
        assessor_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Assessor Notes
        checklist_item_id:
          title: Checklist Item Id
          type: string
        control_point_number:
          title: Control Point Number
          type: string
        corrective_action_deadline:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Corrective Action Deadline
        corrective_action_plan:
          anyOf:
          - type: string
          - type: 'null'
          title: Corrective Action Plan
        corrective_action_required:
          default: false
          title: Corrective Action Required
          type: boolean
        corrective_action_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Corrective Action Status
        created_at:
          format: date-time
          title: Created At
          type: string
        evidence_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Description
        evidence_documents:
          items:
            type: string
          title: Evidence Documents
          type: array
        evidence_photos:
          items:
            type: string
          title: Evidence Photos
          type: array
        farm_id:
          title: Farm Id
          type: string
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        non_compliance_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Non Compliance Reason
        status:
          $ref: '#/components/schemas/ControlPointStatus'
          default: not_assessed
          description: Assessment status | حالة التقييم
        tenant_id:
          title: Tenant Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        verification_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Verification Date
        verified_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Verified By
      required:
      - farm_id
      - tenant_id
      - checklist_item_id
      - control_point_number
      - assessed_by
      title: ChecklistAssessment
      type: object
    ChecklistCategory:
      description: 'Main checklist categories from IFA v6

        فئات قائمة المراجعة الرئيسية من معايير IFA v6'
      enum:
      - af_site_management
      - af_soil_management
      - af_fertilizer_use
      - af_irrigation
      - af_crop_protection
      - af_harvest
      - af_produce_handling
      - af_waste_pollution
      - af_worker_health
      - af_environment
      - cb_propagation_material
      - cb_site_history
      title: ChecklistCategory
      type: string
    ComplianceLevel:
      description: 'Compliance level according to IFA standards

        مستوى الامتثال وفقًا لمعايير IFA'
      enum:
      - major_must
      - minor_must
      - recommendation
      title: ComplianceLevel
      type: string
    ComplianceRecord:
      description: 'Compliance record for a farm

        سجل الامتثال للمزرعة'
      example:
        compliance_percentage: 85.5
        compliant_points: 171
        farm_id: farm_12345
        ifa_version: '6.0'
        major_must_fails: 2
        minor_must_fails: 5
        non_compliant_points: 29
        overall_status: partially_compliant
        tenant_id: tenant_001
        total_control_points: 200
      properties:
        assessed_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Assessed By
        assessment_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Assessment Date
        compliance_percentage:
          default: 0.0
          description: Compliance percentage | نسبة الامتثال
          maximum: 100.0
          minimum: 0.0
          title: Compliance Percentage
          type: number
        compliant_points:
          default: 0
          description: Compliant control points | نقاط التحكم المتوافقة
          title: Compliant Points
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        farm_id:
          description: Farm identifier | معرف المزرعة
          title: Farm Id
          type: string
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        ifa_version:
          default: '6.0'
          description: IFA version | إصدار معايير IFA
          title: Ifa Version
          type: string
        major_must_fails:
          default: 0
          description: Major Must non-conformities | عدم المطابقات الرئيسية الإلزامية
          title: Major Must Fails
          type: integer
        minor_must_fails:
          default: 0
          description: Minor Must non-conformities | عدم المطابقات الثانوية الإلزامية
          title: Minor Must Fails
          type: integer
        next_assessment_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Next Assessment Date
        non_compliant_points:
          default: 0
          description: Non-compliant points | نقاط عدم التوافق
          title: Non Compliant Points
          type: integer
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        overall_status:
          $ref: '#/components/schemas/ComplianceStatus'
          default: not_assessed
          description: Overall compliance status | حالة الامتثال الإجمالية
        tenant_id:
          description: Tenant identifier | معرف المستأجر
          title: Tenant Id
          type: string
        total_control_points:
          default: 0
          description: Total control points | إجمالي نقاط التحكم
          title: Total Control Points
          type: integer
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - farm_id
      - tenant_id
      title: ComplianceRecord
      type: object
    ComplianceStatus:
      description: 'Compliance status enumeration

        تعداد حالات الامتثال'
      enum:
      - compliant
      - non_compliant
      - partially_compliant
      - pending_review
      - not_assessed
      title: ComplianceStatus
      type: string
    ControlPointStatus:
      description: 'Status of a control point assessment

        حالة تقييم نقطة التحكم'
      enum:
      - compliant
      - non_compliant
      - not_applicable
      - not_assessed
      title: ControlPointStatus
      type: string
    GGNCertificate:
      description: 'GlobalGAP GGN Certificate

        شهادة GlobalGAP GGN'
      example:
        certificate_number: GGN-YE-2025-001234
        certification_body:
          code: CB-YE-001
          country: Yemen
          name: Yemen Certification Body
        compliance_percentage: 98.5
        farm_address: صنعاء، اليمن
        farm_id: farm_12345
        farm_name: مزرعة النصر للخضروات
        ggn_number: '4063061234567'
        gln_number: '4063061234567'
        ifa_version: '6.0'
        issue_date: '2025-01-15'
        major_must_compliance: true
        minor_must_compliance_percentage: 97.5
        producer_name: أحمد محمد علي
        production_methods:
        - conventional
        products:
        - tomatoes
        - cucumbers
        - peppers
        scope: fruit_vegetables
        status: active
        tenant_id: tenant_001
        total_area_ha: 5.5
        valid_from: '2025-01-15'
        valid_until: '2026-01-14'
      properties:
        attachments:
          items:
            type: string
          title: Attachments
          type: array
        audit_report_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Audit Report Url
        certificate_number:
          description: Certificate number | رقم الشهادة
          title: Certificate Number
          type: string
        certificate_pdf_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Certificate Pdf Url
        certification_body:
          $ref: '#/components/schemas/CertificationBody'
          description: Certification body details | تفاصيل الجهة المانحة للشهادة
        compliance_percentage:
          description: Overall compliance percentage | نسبة الامتثال الإجمالية
          maximum: 100.0
          minimum: 0.0
          title: Compliance Percentage
          type: number
        created_at:
          format: date-time
          title: Created At
          type: string
        farm_address:
          description: Farm address | عنوان المزرعة
          title: Farm Address
          type: string
        farm_country:
          default: Yemen
          description: Country | الدولة
          title: Farm Country
          type: string
        farm_id:
          description: Farm identifier | معرف المزرعة
          title: Farm Id
          type: string
        farm_name:
          description: Farm name | اسم المزرعة
          title: Farm Name
          type: string
        ggn_number:
          description: GlobalGAP Number (GGN) - 13 digits | رقم GlobalGAP (GGN) - 13 رقم
          maxLength: 13
          minLength: 13
          title: Ggn Number
          type: string
        gln_number:
          anyOf:
          - maxLength: 13
            minLength: 13
            type: string
          - type: 'null'
          description: Global Location Number (GLN) | رقم الموقع العالمي
          title: Gln Number
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        ifa_version:
          default: '6.0'
          description: IFA version | إصدار معايير IFA
          title: Ifa Version
          type: string
        issue_date:
          description: Issue date | تاريخ الإصدار
          format: date
          title: Issue Date
          type: string
        last_audit_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Last Audit Date
        major_must_compliance:
          default: false
          description: All Major Must points compliant | جميع النقاط الإلزامية الرئيسية متوافقة
          title: Major Must Compliance
          type: boolean
        minor_must_compliance_percentage:
          description: Minor Must compliance (must be >= 95%) | نسبة الامتثال للنقاط الإلزامية الثانوية (يجب أن تكون >= 95%)
          maximum: 100.0
          minimum: 0.0
          title: Minor Must Compliance Percentage
          type: number
        next_audit_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Next Audit Date
        producer_contact:
          anyOf:
          - type: string
          - type: 'null'
          title: Producer Contact
        producer_name:
          description: Producer/farmer name | اسم المنتج/المزارع
          title: Producer Name
          type: string
        production_methods:
          description: 'e.g., conventional, organic | مثل: تقليدي، عضوي'
          items:
            type: string
          title: Production Methods
          type: array
        products:
          description: Certified products | المنتجات المعتمدة
          items:
            type: string
          title: Products
          type: array
        publicly_searchable:
          default: true
          description: Certificate searchable in GlobalGAP database | الشهادة قابلة للبحث في قاعدة بيانات GlobalGAP
          title: Publicly Searchable
          type: boolean
        renewal_notification_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Renewal Notification Date
        renewal_notification_sent:
          default: false
          title: Renewal Notification Sent
          type: boolean
        scope:
          $ref: '#/components/schemas/CertificationScope'
          description: Certification scope | نطاق الشهادة
        status:
          $ref: '#/components/schemas/CertificateStatus'
          default: pending_approval
          description: Certificate status | حالة الشهادة
        tenant_id:
          description: Tenant identifier | معرف المستأجر
          title: Tenant Id
          type: string
        total_area_ha:
          description: Total certified area in hectares | المساحة الكلية المعتمدة بالهكتار
          exclusiveMinimum: 0.0
          title: Total Area Ha
          type: number
        updated_at:
          format: date-time
          title: Updated At
          type: string
        valid_from:
          description: Valid from date | صالح من تاريخ
          format: date
          title: Valid From
          type: string
        valid_until:
          description: Valid until date | صالح حتى تاريخ
          format: date
          title: Valid Until
          type: string
      required:
      - farm_id
      - tenant_id
      - ggn_number
      - certificate_number
      - scope
      - issue_date
      - valid_from
      - valid_until
      - certification_body
      - farm_name
      - farm_address
      - total_area_ha
      - producer_name
      - compliance_percentage
      - minor_must_compliance_percentage
      title: GGNCertificate
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    NonConformity:
      description: 'Non-conformity finding

        نتيجة عدم المطابقة'
      example:
        compliance_record_id: comp_123
        control_point_id: cp_af_1_1_1
        control_point_number: AF.1.1.1
        corrective_action_required: true
        description_ar: عدم وجود سجلات تطبيق المبيدات الحشرية
        description_en: Lack of pesticide application records
        severity: major
      properties:
        compliance_record_id:
          title: Compliance Record Id
          type: string
        control_point_id:
          title: Control Point Id
          type: string
        control_point_number:
          description: CP number e.g., AF.1.1.1 | رقم نقطة التحكم
          title: Control Point Number
          type: string
        corrective_action_completed:
          default: false
          title: Corrective Action Completed
          type: boolean
        corrective_action_deadline:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Corrective Action Deadline
        corrective_action_required:
          default: true
          title: Corrective Action Required
          type: boolean
        corrective_action_taken:
          anyOf:
          - type: string
          - type: 'null'
          title: Corrective Action Taken
        description_ar:
          description: Description in Arabic | الوصف بالعربية
          title: Description Ar
          type: string
        description_en:
          description: Description in English | الوصف بالإنجليزية
          title: Description En
          type: string
        evidence_documents:
          description: Document URLs | روابط المستندات
          items:
            type: string
          title: Evidence Documents
          type: array
        evidence_photos:
          description: Photo URLs | روابط الصور
          items:
            type: string
          title: Evidence Photos
          type: array
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        identified_date:
          format: date-time
          title: Identified Date
          type: string
        resolved_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Resolved Date
        severity:
          $ref: '#/components/schemas/SeverityLevel'
        verified_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Verified By
      required:
      - compliance_record_id
      - control_point_id
      - control_point_number
      - severity
      - description_ar
      - description_en
      title: NonConformity
      type: object
    SeverityLevel:
      description: 'Severity level for non-compliance

        مستوى خطورة عدم الامتثال'
      enum:
      - critical
      - major
      - minor
      - observation
      title: SeverityLevel
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: "\n    خدمة الامتثال لمعايير GlobalGAP IFA v6\n    GlobalGAP IFA v6 Compliance Service\n\n    ## الميزات الرئيسية | Main Features\n\n    - تتبع الامتثال للمزارع | Farm compliance tracking\n    - إدارة قوائم المراجعة | Checklist management\n    - إعداد تقارير التدقيق | Audit report preparation\n    - إدارة شهادات GGN | GGN certificate management\n    - تتبع عدم المطابقات والإجراءات التصحيحية | Non-conformity and corrective action tracking\n    "
  title: SAHOOL GlobalGAP Compliance Service
  version: 16.0.0
openapi: 3.1.0
paths:
  /audits:
    post:
      description: 'Prepare and create an audit report

        إعداد وإنشاء تقرير تدقيق'
      operationId: create_audit_audits_post
      parameters:
      - description: Farm identifier
        in: query
        name: farm_id
        required: true
        schema:
          description: Farm identifier
          title: Farm Id
          type: string
      - description: internal, external, certification
        in: query
        name: audit_type
        required: false
        schema:
          default: internal
          description: internal, external, certification
          title: Audit Type
          type: string
      - description: Name of auditor
        in: query
        name: auditor_name
        required: true
        schema:
          description: Name of auditor
          title: Auditor Name
          type: string
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Audit
  /audits/{audit_id}:
    get:
      description: 'Get audit result by ID

        الحصول على نتيجة التدقيق حسب المعرف'
      operationId: get_audit_audits__audit_id__get
      parameters:
      - in: path
        name: audit_id
        required: true
        schema:
          title: Audit Id
          type: string
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Audit
  /certificates:
    post:
      description: 'Create a new GGN certificate

        إنشاء شهادة GGN جديدة'
      operationId: create_certificate_certificates_post
      parameters:
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GGNCertificate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Certificate
  /certificates/{certificate_id}:
    get:
      description: 'Get certificate by ID

        الحصول على الشهادة حسب المعرف'
      operationId: get_certificate_certificates__certificate_id__get
      parameters:
      - in: path
        name: certificate_id
        required: true
        schema:
          title: Certificate Id
          type: string
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Certificate
  /checklists:
    get:
      description: 'Get available checklists

        الحصول على قوائم المراجعة المتاحة'
      operationId: get_checklists_checklists_get
      parameters:
      - description: IFA version | إصدار معايير IFA
        in: query
        name: ifa_version
        required: false
        schema:
          default: '6.0'
          description: IFA version | إصدار معايير IFA
          title: Ifa Version
          type: string
      - description: full, partial, follow_up
        in: query
        name: checklist_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: full, partial, follow_up
          title: Checklist Type
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Checklists
  /checklists/{checklist_id}/items:
    get:
      description: 'Get checklist items (control points)

        الحصول على عناصر قائمة المراجعة (نقاط التحكم)'
