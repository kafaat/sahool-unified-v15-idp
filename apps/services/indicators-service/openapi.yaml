components:
  schemas:
    AlertSeverity:
      enum:
      - info
      - warning
      - critical
      title: AlertSeverity
      type: string
    DashboardSummary:
      properties:
        active_alerts:
          title: Active Alerts
          type: integer
        attention_needed_fields:
          items:
            additionalProperties: true
            type: object
          title: Attention Needed Fields
          type: array
        average_health_score:
          title: Average Health Score
          type: number
        critical_alerts:
          title: Critical Alerts
          type: integer
        generated_at:
          format: date-time
          title: Generated At
          type: string
        indicators_summary:
          additionalProperties: true
          title: Indicators Summary
          type: object
        tenant_id:
          title: Tenant Id
          type: string
        top_performing_fields:
          items:
            additionalProperties: true
            type: object
          title: Top Performing Fields
          type: array
        total_area_hectares:
          title: Total Area Hectares
          type: number
        total_fields:
          title: Total Fields
          type: integer
      required:
      - tenant_id
      - total_fields
      - total_area_hectares
      - average_health_score
      - indicators_summary
      - active_alerts
      - critical_alerts
      - top_performing_fields
      - attention_needed_fields
      - generated_at
      title: DashboardSummary
      type: object
    FieldIndicators:
      properties:
        alerts:
          items:
            additionalProperties: true
            type: object
          title: Alerts
          type: array
        area_hectares:
          title: Area Hectares
          type: number
        crop_type:
          title: Crop Type
          type: string
        field_id:
          title: Field Id
          type: string
        field_name:
          title: Field Name
          type: string
        indicators:
          items:
            $ref: '#/components/schemas/Indicator'
          title: Indicators
          type: array
        overall_score:
          title: Overall Score
          type: number
      required:
      - field_id
      - field_name
      - area_hectares
      - crop_type
      - indicators
      - overall_score
      - alerts
      title: FieldIndicators
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    Indicator:
      properties:
        category:
          $ref: '#/components/schemas/IndicatorCategory'
        id:
          title: Id
          type: string
        last_updated:
          format: date-time
          title: Last Updated
          type: string
        max_value:
          title: Max Value
          type: number
        min_value:
          title: Min Value
          type: number
        name_ar:
          title: Name Ar
          type: string
        name_en:
          title: Name En
          type: string
        optimal_max:
          title: Optimal Max
          type: number
        optimal_min:
          title: Optimal Min
          type: number
        status:
          title: Status
          type: string
        trend:
          $ref: '#/components/schemas/TrendDirection'
        trend_percent:
          title: Trend Percent
          type: number
        unit:
          title: Unit
          type: string
        value:
          title: Value
          type: number
      required:
      - id
      - name_ar
      - name_en
      - category
      - value
      - unit
      - min_value
      - max_value
      - optimal_min
      - optimal_max
      - trend
      - trend_percent
      - status
      - last_updated
      title: Indicator
      type: object
    IndicatorCategory:
      enum:
      - vegetation
      - water
      - soil
      - weather
      - crop_health
      - productivity
      - financial
      title: IndicatorCategory
      type: string
    IndicatorInput:
      description: Input model for storing indicator values
      properties:
        indicator_type:
          title: Indicator Type
          type: string
        trend:
          anyOf:
          - $ref: '#/components/schemas/TrendDirection'
          - type: 'null'
        trend_percent:
          anyOf:
          - type: number
          - type: 'null'
          title: Trend Percent
        value:
          title: Value
          type: number
      required:
      - indicator_type
      - value
      title: IndicatorInput
      type: object
    TrendDirection:
      enum:
      - up
      - down
      - stable
      title: TrendDirection
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: Comprehensive agricultural indicators dashboard - KPIs, trends, alerts
  title: SAHOOL Agricultural Indicators | خدمة المؤشرات الزراعية
  version: 16.0.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      description: Health check endpoint (liveness probe)
      operationId: health_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /metrics:
    get:
      description: Prometheus metrics endpoint
      operationId: metrics_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Metrics
  /readyz:
    get:
      description: Kubernetes readiness probe - is the service ready to accept traffic?
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
  /v1/alerts/{tenant_id}:
    get:
      description: الحصول على تنبيهات المستأجر
      operationId: get_tenant_alerts_v1_alerts__tenant_id__get
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          title: Tenant Id
          type: string
      - in: query
        name: severity
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AlertSeverity'
          - type: 'null'
          title: Severity
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Tenant Alerts
  /v1/dashboard/{tenant_id}:
    get:
      description: لوحة المعلومات الرئيسية للمستأجر
      operationId: get_dashboard_summary_v1_dashboard__tenant_id__get
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          title: Tenant Id
          type: string
      - in: query
        name: num_fields
        required: false
        schema:
          default: 10
          maximum: 100
          minimum: 1
          title: Num Fields
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Dashboard Summary
  /v1/field/{field_id}/indicator/{indicator_type}:
    get:
      description: 'الحصول على مؤشر واحد لحقل معين


        Retrieve a single indicator value from the database.'
      operationId: get_single_indicator_v1_field__field_id__indicator__indicator_type__get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      - in: path
        name: indicator_type
        required: true
        schema:
          title: Indicator Type
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Single Indicator
  /v1/field/{field_id}/indicators:
    delete:
      description: 'حذف جميع مؤشرات حقل معين


        Delete all stored indicators for a specific field.

        Use with caution - this operation cannot be undone.'
      operationId: delete_field_indicators_endpoint_v1_field__field_id__indicators_delete
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Delete Field Indicators Endpoint
    get:
      description: "الحصول على مؤشرات حقل معين\n\nArgs:\n    field_id: Field identifier\n    category: Optional category filter\n    force_refresh: If True, regenerate indicators even if cached"
      operationId: get_field_indicators_v1_field__field_id__indicators_get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      - in: query
        name: category
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/IndicatorCategory'
          - type: 'null'
          title: Category
      - in: query
        name: force_refresh
        required: false
        schema:
          default: false
          title: Force Refresh
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldIndicators'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Field Indicators
    post:
      description: 'تخزين قيمة مؤشر لحقل معين


        Store an indicator value for a specific field. This is useful when

        indicator values are computed externally (e.g., from satellite imagery

        processing or IoT sensors).'
      operationId: store_field_indicator_v1_field__field_id__indicators_post
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndicatorInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Store Field Indicator
  /v1/indicators/definitions:
    get:
      description: الحصول على تعريفات جميع المؤشرات
      operationId: get_indicator_definitions_v1_indicators_definitions_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Get Indicator Definitions
  /v1/trends/{field_id}/{indicator_id}:
    get:
      description: الحصول على اتجاهات مؤشر معين
      operationId: get_indicator_trends_v1_trends__field_id___indicator_id__get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      - in: path
        name: indicator_id
        required: true
        schema:
          title: Indicator Id
          type: string
      - in: query
        name: days
        required: false
        schema:
          default: 30
          maximum: 365
          minimum: 7
          title: Days
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Indicator Trends
