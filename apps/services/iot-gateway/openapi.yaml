openapi: 3.1.0
info:
  title: SAHOOL IoT Gateway
  description: MQTT to NATS bridge for sensor data ingestion
  version: 16.0.0
paths:
  /health:
    get:
      summary: Health Simple
      description: Simple health check - always returns OK if service is running
      operationId: health_simple_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /healthz:
    get:
      summary: Health
      description: 'Health check endpoint - basic liveness check

        Always returns 200 OK to indicate service is running

        This is a minimal health check that should NEVER fail'
      operationId: health_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /readyz:
    get:
      summary: Readiness
      description: Kubernetes readiness probe - is the service ready to accept traffic?
      operationId: readiness_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /sensor/reading:
    post:
      summary: Post Sensor Reading
      description: 'HTTP endpoint to submit sensor reading


        Security features:

        - Requires device to be registered first

        - Validates tenant isolation

        - Validates field association

        - Validates sensor value ranges

        - Logs all operations for audit trail


        Alternative to MQTT for devices that support HTTP'
      operationId: post_sensor_reading_sensor_reading_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorReadingRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /sensor/batch:
    post:
      summary: Post Batch Readings
      description: 'Submit multiple sensor readings at once


        Security features:

        - Validates device exists and is registered

        - Validates tenant isolation

        - Validates field association

        - Validates each sensor value range

        - Rejects entire batch if any validation fails'
      operationId: post_batch_readings_sensor_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchReadingRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /device/register:
    post:
      summary: Register Device
      description: Register a new device with Redis persistence
      operationId: register_device_device_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /device/{device_id}:
    get:
      summary: Get Device
      description: Get device information
      operationId: get_device_device__device_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete Device
      description: Remove device from registry with Redis persistence
      operationId: delete_device_device__device_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /device/{device_id}/status:
    get:
      summary: Get Device Status
      description: Get device status
      operationId: get_device_status_device__device_id__status_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /devices:
    get:
      summary: List Devices
      description: List registered devices with pagination
      operationId: list_devices_devices_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: field_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by field ID
          title: Field Id
        description: Filter by field ID
      - name: device_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by device type
          title: Device Type
        description: Filter by device type
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of devices to return
          default: 50
          title: Limit
        description: Maximum number of devices to return
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of devices to skip
          default: 0
          title: Offset
        description: Number of devices to skip
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /field/{field_id}/devices:
    get:
      summary: Get Field Devices
      description: Get all devices for a field
      operationId: get_field_devices_field__field_id__devices_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: field_id
        in: path
        required: true
        schema:
          type: string
          title: Field Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /field/{field_id}/latest:
    get:
      summary: Get Field Latest Readings
      description: Get latest readings from all devices in a field
      operationId: get_field_latest_readings_field__field_id__latest_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: field_id
        in: path
        required: true
        schema:
          type: string
          title: Field Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stats:
    get:
      summary: Get Stats
      description: Get gateway statistics
      operationId: get_stats_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
components:
  schemas:
    BatchReadingRequest:
      properties:
        device_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Device Id
        tenant_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Tenant Id
        field_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Field Id
        readings:
          items:
            additionalProperties: true
            type: object
          type: array
          maxItems: 100
          minItems: 1
          title: Readings
      type: object
      required:
      - device_id
      - tenant_id
      - field_id
      - readings
      title: BatchReadingRequest
    DeviceRegisterRequest:
      properties:
        device_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Device Id
        tenant_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Tenant Id
        field_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Field Id
        device_type:
          type: string
          maxLength: 50
          minLength: 1
          title: Device Type
        name_ar:
          type: string
          maxLength: 200
          minLength: 1
          title: Name Ar
        name_en:
          type: string
          maxLength: 200
          minLength: 1
          title: Name En
        location:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Location
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
      type: object
      required:
      - device_id
      - tenant_id
      - field_id
      - device_type
      - name_ar
      - name_en
      title: DeviceRegisterRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SensorReadingRequest:
      properties:
        device_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Device Id
        tenant_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Tenant Id
        field_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Field Id
        sensor_type:
          type: string
          maxLength: 50
          minLength: 1
          title: Sensor Type
        value:
          type: number
          title: Value
        unit:
          type: string
          maxLength: 20
          title: Unit
          default: ''
        timestamp:
          anyOf:
          - type: string
          - type: 'null'
          title: Timestamp
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
      type: object
      required:
      - device_id
      - tenant_id
      - field_id
      - sensor_type
      - value
      title: SensorReadingRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
