components:
  schemas:
    BatchReadingRequest:
      properties:
        device_id:
          maxLength: 100
          minLength: 1
          title: Device Id
          type: string
        field_id:
          maxLength: 100
          minLength: 1
          title: Field Id
          type: string
        readings:
          items:
            additionalProperties: true
            type: object
          maxItems: 100
          minItems: 1
          title: Readings
          type: array
        tenant_id:
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
      required:
      - device_id
      - tenant_id
      - field_id
      - readings
      title: BatchReadingRequest
      type: object
    DeviceRegisterRequest:
      properties:
        device_id:
          maxLength: 100
          minLength: 1
          title: Device Id
          type: string
        device_type:
          maxLength: 50
          minLength: 1
          title: Device Type
          type: string
        field_id:
          maxLength: 100
          minLength: 1
          title: Field Id
          type: string
        location:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Location
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        name_ar:
          maxLength: 200
          minLength: 1
          title: Name Ar
          type: string
        name_en:
          maxLength: 200
          minLength: 1
          title: Name En
          type: string
        tenant_id:
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
      required:
      - device_id
      - tenant_id
      - field_id
      - device_type
      - name_ar
      - name_en
      title: DeviceRegisterRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    SensorReadingRequest:
      properties:
        device_id:
          maxLength: 100
          minLength: 1
          title: Device Id
          type: string
        field_id:
          maxLength: 100
          minLength: 1
          title: Field Id
          type: string
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        sensor_type:
          maxLength: 50
          minLength: 1
          title: Sensor Type
          type: string
        tenant_id:
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
        timestamp:
          anyOf:
          - type: string
          - type: 'null'
          title: Timestamp
        unit:
          default: ''
          maxLength: 20
          title: Unit
          type: string
        value:
          title: Value
          type: number
      required:
      - device_id
      - tenant_id
      - field_id
      - sensor_type
      - value
      title: SensorReadingRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: MQTT to NATS bridge for sensor data ingestion
  title: SAHOOL IoT Gateway
  version: 16.0.0
openapi: 3.1.0
paths:
  /device/register:
    post:
      description: Register a new device with Redis persistence
      operationId: register_device_device_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Register Device
  /device/{device_id}:
    delete:
      description: Remove device from registry with Redis persistence
      operationId: delete_device_device__device_id__delete
      parameters:
      - in: path
        name: device_id
        required: true
        schema:
          title: Device Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Delete Device
    get:
      description: Get device information
      operationId: get_device_device__device_id__get
      parameters:
      - in: path
        name: device_id
        required: true
        schema:
          title: Device Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Device
  /device/{device_id}/status:
    get:
      description: Get device status
      operationId: get_device_status_device__device_id__status_get
      parameters:
      - in: path
        name: device_id
        required: true
        schema:
          title: Device Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Device Status
  /devices:
    get:
      description: List registered devices with pagination
      operationId: list_devices_devices_get
      parameters:
      - description: Filter by field ID
        in: query
        name: field_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by field ID
          title: Field Id
      - description: Filter by device type
        in: query
        name: device_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by device type
          title: Device Type
      - description: Maximum number of devices to return
        in: query
        name: limit
        required: false
        schema:
          default: 50
          description: Maximum number of devices to return
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - description: Number of devices to skip
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Number of devices to skip
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List Devices
  /field/{field_id}/devices:
    get:
      description: Get all devices for a field
      operationId: get_field_devices_field__field_id__devices_get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Field Devices
  /field/{field_id}/latest:
    get:
      description: Get latest readings from all devices in a field
      operationId: get_field_latest_readings_field__field_id__latest_get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Field Latest Readings
  /health:
    get:
      description: Simple health check - always returns OK if service is running
      operationId: health_simple_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health Simple
  /healthz:
    get:
      description: 'Health check endpoint - basic liveness check

        Always returns 200 OK to indicate service is running

        This is a minimal health check that should NEVER fail'
      operationId: health_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /readyz:
    get:
      description: Kubernetes readiness probe - is the service ready to accept traffic?
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
  /sensor/batch:
    post:
      description: 'Submit multiple sensor readings at once


        Security features:

        - Validates device exists and is registered

        - Validates tenant isolation

        - Validates field association

        - Validates each sensor value range

        - Rejects entire batch if any validation fails'
      operationId: post_batch_readings_sensor_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchReadingRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Post Batch Readings
  /sensor/reading:
    post:
      description: 'HTTP endpoint to submit sensor reading


        Security features:

        - Requires device to be registered first

        - Validates tenant isolation

        - Validates field association

        - Validates sensor value ranges

        - Logs all operations for audit trail


        Alternative to MQTT for devices that support HTTP'
      operationId: post_sensor_reading_sensor_reading_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorReadingRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Post Sensor Reading
  /stats:
    get:
      description: Get gateway statistics
      operationId: get_stats_stats_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Get Stats
