components:
  schemas:
    AlertSeverity:
      enum:
      - critical
      - warning
      - advisory
      - info
      title: AlertSeverity
      type: string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    NodeRegistration:
      description: Register a new IoT node.
      properties:
        battery_level:
          anyOf:
          - type: number
          - type: 'null'
          title: Battery Level
        field_id:
          title: Field Id
          type: string
        firmware_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Firmware Version
        latitude:
          title: Latitude
          type: number
        longitude:
          title: Longitude
          type: number
        name:
          title: Name
          type: string
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
        node_id:
          title: Node Id
          type: string
        node_type:
          $ref: '#/components/schemas/NodeType'
        sensors:
          items:
            $ref: '#/components/schemas/SensorType'
          title: Sensors
          type: array
      required:
      - node_id
      - node_type
      - name
      - field_id
      - sensors
      - latitude
      - longitude
      title: NodeRegistration
      type: object
    NodeType:
      enum:
      - esp32_lora
      - esp32_wifi
      - arduino_lora
      - commercial
      - gateway
      title: NodeType
      type: string
    SensorReading:
      description: Single sensor reading from a node.
      properties:
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        node_id:
          description: Node identifier
          title: Node Id
          type: string
        quality:
          default: 1.0
          description: Data quality 0-1
          maximum: 1.0
          minimum: 0.0
          title: Quality
          type: number
        sensor_type:
          $ref: '#/components/schemas/SensorType'
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        unit:
          default: ''
          title: Unit
          type: string
        value:
          title: Value
          type: number
      required:
      - node_id
      - sensor_type
      - value
      title: SensorReading
      type: object
    SensorReadingBatch:
      description: Batch of sensor readings from one or more nodes.
      properties:
        field_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Field Id
        readings:
          items:
            $ref: '#/components/schemas/SensorReading'
          title: Readings
          type: array
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      required:
      - readings
      title: SensorReadingBatch
      type: object
    SensorType:
      enum:
      - soil_moisture
      - soil_temperature
      - soil_ec
      - air_temperature
      - air_humidity
      - wind_speed
      - solar_radiation
      - rainfall
      - water_flow
      - water_level
      - water_ec
      - water_ph
      - leaf_wetness
      - ndvi_sensor
      - pressure
      title: SensorType
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WDIRequest:
      description: Weighted Decision Index calculation request.
      properties:
        field_id:
          title: Field Id
          type: string
        humidity:
          default: 50.0
          description: Relative humidity (%)
          title: Humidity
          type: number
        soil_moisture:
          description: Current soil moisture (%)
          title: Soil Moisture
          type: number
        soil_moisture_threshold:
          default: 40.0
          description: Moisture threshold (%)
          title: Soil Moisture Threshold
          type: number
        solar_radiation:
          default: 20.0
          description: Solar radiation (MJ/m²/day)
          title: Solar Radiation
          type: number
        temperature:
          description: Air temperature (°C)
          title: Temperature
          type: number
        temperature_optimal:
          default: 25.0
          description: Optimal temperature (°C)
          title: Temperature Optimal
          type: number
        w_humidity:
          default: 0.15
          description: Weight for humidity
          title: W Humidity
          type: number
        w_moisture:
          default: 0.35
          description: Weight for soil moisture
          title: W Moisture
          type: number
        w_radiation:
          default: 0.15
          description: Weight for radiation
          title: W Radiation
          type: number
        w_temperature:
          default: 0.25
          description: Weight for temperature
          title: W Temperature
          type: number
        w_wind:
          default: 0.1
          description: Weight for wind
          title: W Wind
          type: number
        wind_speed:
          default: 2.0
          description: Wind speed (m/s)
          title: Wind Speed
          type: number
      required:
      - field_id
      - soil_moisture
      - temperature
      title: WDIRequest
      type: object
    WDIResponse:
      description: Weighted Decision Index result.
      properties:
        components:
          additionalProperties:
            type: number
          title: Components
          type: object
        confidence:
          title: Confidence
          type: number
        decision:
          title: Decision
          type: string
        decision_ar:
          title: Decision Ar
          type: string
        field_id:
          title: Field Id
          type: string
        irrigate:
          title: Irrigate
          type: boolean
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        wdi:
          description: WDI value (0-1, higher = more stress)
          title: Wdi
          type: number
      required:
      - field_id
      - wdi
      - decision
      - decision_ar
      - components
      - irrigate
      - confidence
      - timestamp
      title: WDIResponse
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: LoRaWAN + MQTT gateway with edge computing for agricultural IoT
  title: IoT Sensor Hub
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/iot/alerts:
    get:
      description: Get recent IoT alerts.
      operationId: get_alerts_api_v1_iot_alerts_get
      parameters:
      - in: query
        name: severity
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AlertSeverity'
          - type: 'null'
          title: Severity
      - in: query
        name: field_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Field Id
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 500
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Alerts
  /api/v1/iot/cache/status:
    get:
      description: Get offline cache status.
      operationId: cache_status_api_v1_iot_cache_status_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Cache Status
  /api/v1/iot/cache/sync:
    post:
      description: 'Retrieve cached entries and optionally clear them.


        Two-phase sync: first call with confirm_clear=false to preview,

        then confirm_clear=true to actually clear synced entries.'
      operationId: sync_cache_api_v1_iot_cache_sync_post
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 1000
          maximum: 10000
          title: Limit
          type: integer
      - description: Set true to clear synced entries
        in: query
        name: confirm_clear
        required: false
        schema:
          default: false
          description: Set true to clear synced entries
          title: Confirm Clear
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Sync Cache
  /api/v1/iot/nodes:
    get:
      description: List registered IoT nodes.
      operationId: list_nodes_api_v1_iot_nodes_get
      parameters:
      - in: query
        name: field_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Field Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List Nodes
    post:
      description: Register a new IoT sensor node.
      operationId: register_node_api_v1_iot_nodes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeRegistration'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Register Node
  /api/v1/iot/nodes/{node_id}:
    get:
      description: Get node status and recent readings.
      operationId: get_node_api_v1_iot_nodes__node_id__get
      parameters:
      - in: path
        name: node_id
        required: true
        schema:
          title: Node Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Node
  /api/v1/iot/readings:
    post:
      description: Ingest a single sensor reading with Kalman filtering and alert checking.
      operationId: ingest_reading_api_v1_iot_readings_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorReading'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Ingest Reading
  /api/v1/iot/readings/batch:
    post:
      description: Ingest a batch of sensor readings.
      operationId: ingest_batch_api_v1_iot_readings_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorReadingBatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Ingest Batch
  /api/v1/iot/sensor-types:
    get:
      description: List supported sensor types with valid ranges.
      operationId: list_sensor_types_api_v1_iot_sensor_types_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Sensor Types
  /api/v1/iot/sensors:
    get:
      description: 'Alias for ``/api/v1/iot/nodes`` — returns sensors in camelCase shape.


        Aligned with ``IOT_ENDPOINTS.SENSORS`` in the shared contracts package.'
      operationId: list_sensors_alias_api_v1_iot_sensors_get
      parameters:
      - description: Optional field filter
        in: query
        name: field_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional field filter
          title: Field Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List Sensors Alias
  /api/v1/iot/sensors/stats:
    get:
      description: 'Sensor summary statistics grouped by status and node type.


        Aligned with ``IOT_ENDPOINTS.SENSOR_STATS`` in the shared contracts package.'
      operationId: sensors_stats_alias_api_v1_iot_sensors_stats_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Sensors Stats Alias
  /api/v1/iot/sensors/stream:
    get:
      description: 'Server-Sent Events stream of live sensor readings.


        Subscribes to NATS subject ``sahool.tenant.{tenantId}.iot.reading.*``

        and forwards each message as a ``data:`` SSE event. Returns HTTP 501

        with a bilingual explanation if ``sse-starlette`` is not installed or

        NATS is unavailable.


        Aligned with ``IOT_ENDPOINTS.SENSOR_STREAM`` in the shared contracts

        package.'
      operationId: sensors_stream_alias_api_v1_iot_sensors_stream_get
      parameters:
      - description: Optional sensor/node filter
        in: query
        name: sensor_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional sensor/node filter
          title: Sensor Id
      - description: Optional field filter
        in: query
        name: field_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional field filter
          title: Field Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Sensors Stream Alias
  /api/v1/iot/sensors/{sensor_id}:
    get:
      description: Alias for ``/api/v1/iot/nodes/{id}`` — returns a single sensor in camelCase shape.
      operationId: get_sensor_alias_api_v1_iot_sensors__sensor_id__get
      parameters:
      - in: path
        name: sensor_id
        required: true
        schema:
          title: Sensor Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Sensor Alias
  /api/v1/iot/sensors/{sensor_id}/latest:
    get:
      description: 'Return the most recent filtered reading for a sensor in camelCase shape.


        Aligned with ``IOT_ENDPOINTS.SENSOR_LATEST`` in the shared contracts package.'
      operationId: get_sensor_latest_api_v1_iot_sensors__sensor_id__latest_get
      parameters:
      - in: path
        name: sensor_id
        required: true
        schema:
          title: Sensor Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Sensor Latest
  /api/v1/iot/stats:
    get:
      description: Get IoT hub statistics.
      operationId: get_stats_api_v1_iot_stats_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Get Stats
  /api/v1/iot/wdi:
    post:
      description: 'Calculate Weighted Decision Index (WDI) for irrigation decision.


        WDI integrates multiple sensor readings into a single irrigation

        decision index. Based on Sahu & Tripathi (2025): 25% water saving.'
      operationId: calculate_wdi_api_v1_iot_wdi_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WDIRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WDIResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Calculate Wdi
  /healthz:
    get:
      operationId: health_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /readyz:
    get:
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
