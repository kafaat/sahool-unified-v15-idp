components:
  schemas:
    CropInfoResponse:
      description: Detailed crop information.
      properties:
        crop_type:
          title: Crop Type
          type: string
        depletion_fraction:
          title: Depletion Fraction
          type: number
        growth_stages:
          items:
            additionalProperties: true
            type: object
          title: Growth Stages
          type: array
        name:
          title: Name
          type: string
        name_ar:
          title: Name Ar
          type: string
        regions:
          items:
            type: string
          title: Regions
          type: array
        root_depth_m:
          title: Root Depth M
          type: number
        salinity_threshold_dsm:
          title: Salinity Threshold Dsm
          type: number
      required:
      - name
      - name_ar
      - crop_type
      - root_depth_m
      - depletion_fraction
      - growth_stages
      - salinity_threshold_dsm
      - regions
      title: CropInfoResponse
      type: object
    ET0Request:
      description: Request for ET0 calculation.
      properties:
        elevation_m:
          description: Elevation (m)
          title: Elevation M
          type: number
        latitude:
          description: Latitude (decimal degrees)
          title: Latitude
          type: number
        weather:
          description: Weather data series
          items:
            $ref: '#/components/schemas/WeatherInput'
          minItems: 1
          title: Weather
          type: array
      required:
      - latitude
      - elevation_m
      - weather
      title: ET0Request
      type: object
    ET0Response:
      description: ET0 calculation result.
      properties:
        date:
          format: date
          title: Date
          type: string
        et0_mm:
          title: Et0 Mm
          type: number
        method:
          default: penman_monteith_fao56
          title: Method
          type: string
      required:
      - date
      - et0_mm
      title: ET0Response
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    IrrigationCycleRequest:
      description: Request for irrigation cycle calculation.
      properties:
        alpha:
          default: 1.0
          description: ET correction factor α
          title: Alpha
          type: number
        beta:
          default: 1.0
          description: Soil correction factor β
          title: Beta
          type: number
        bulk_density:
          default: 1.4
          description: Soil bulk density (g/cm³)
          title: Bulk Density
          type: number
        crop:
          description: Crop name
          title: Crop
          type: string
        depletion_fraction:
          default: 0.5
          description: Allowable depletion (p)
          title: Depletion Fraction
          type: number
        ec_soil:
          anyOf:
          - type: number
          - type: 'null'
          description: Soil EC (dS/m)
          title: Ec Soil
        ec_water:
          anyOf:
          - type: number
          - type: 'null'
          description: Irrigation water EC (dS/m)
          title: Ec Water
        et0_mm_day:
          description: Reference ET (mm/day)
          title: Et0 Mm Day
          type: number
        field_capacity:
          description: θfc (cm³/cm³)
          title: Field Capacity
          type: number
        gamma:
          default: 1.0
          description: Stress correction factor γ
          title: Gamma
          type: number
        growth_stage:
          anyOf:
          - type: string
          - type: 'null'
          description: Current growth stage name
          title: Growth Stage
        kc:
          anyOf:
          - type: number
          - type: 'null'
          description: Crop coefficient (overrides crop DB)
          title: Kc
        root_depth_m:
          default: 1.0
          description: Effective root depth (m)
          title: Root Depth M
          type: number
        wilting_point:
          description: θwp (cm³/cm³)
          title: Wilting Point
          type: number
      required:
      - crop
      - field_capacity
      - wilting_point
      - et0_mm_day
      title: IrrigationCycleRequest
      type: object
    IrrigationCycleResponse:
      description: Irrigation cycle calculation result.
      properties:
        available_water_mm:
          description: Total available water in root zone (mm)
          title: Available Water Mm
          type: number
        crop_name:
          title: Crop Name
          type: string
        crop_name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Crop Name Ar
        cycle_days:
          description: Irrigation cycle T (days)
          title: Cycle Days
          type: number
        etc_mm_day:
          description: Crop ET (mm/day)
          title: Etc Mm Day
          type: number
        gross_irrigation_mm:
          description: Gross irrigation with efficiency (mm)
          title: Gross Irrigation Mm
          type: number
        kc_adjusted:
          anyOf:
          - type: number
          - type: 'null'
          description: Salinity-adjusted Kc
          title: Kc Adjusted
        kc_used:
          description: Kc value used
          title: Kc Used
          type: number
        leaching_fraction:
          anyOf:
          - type: number
          - type: 'null'
          description: Leaching fraction if salinity
          title: Leaching Fraction
        net_irrigation_mm:
          description: Net irrigation depth (mm)
          title: Net Irrigation Mm
          type: number
        next_irrigation_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Recommended next irrigation
          title: Next Irrigation Date
        readily_available_mm:
          description: Readily available water (mm)
          title: Readily Available Mm
          type: number
        recommendations:
          default: []
          items:
            type: string
          title: Recommendations
          type: array
        recommendations_ar:
          default: []
          items:
            type: string
          title: Recommendations Ar
          type: array
        total_water_mm:
          description: Total water including leaching (mm)
          title: Total Water Mm
          type: number
      required:
      - cycle_days
      - net_irrigation_mm
      - gross_irrigation_mm
      - etc_mm_day
      - kc_used
      - total_water_mm
      - available_water_mm
      - readily_available_mm
      - crop_name
      title: IrrigationCycleResponse
      type: object
    ScheduleDay:
      description: Single day in irrigation schedule.
      properties:
        cumulative_water_mm:
          title: Cumulative Water Mm
          type: number
        date:
          format: date
          title: Date
          type: string
        day_of_season:
          title: Day Of Season
          type: integer
        et0_mm:
          title: Et0 Mm
          type: number
        etc_mm:
          title: Etc Mm
          type: number
        growth_stage:
          title: Growth Stage
          type: string
        irrigate:
          title: Irrigate
          type: boolean
        irrigation_mm:
          title: Irrigation Mm
          type: number
        kc:
          title: Kc
          type: number
        soil_moisture_pct:
          title: Soil Moisture Pct
          type: number
      required:
      - date
      - day_of_season
      - growth_stage
      - kc
      - et0_mm
      - etc_mm
      - soil_moisture_pct
      - irrigate
      - irrigation_mm
      - cumulative_water_mm
      title: ScheduleDay
      type: object
    ScheduleRequest:
      description: Multi-day irrigation schedule request.
      properties:
        climate_zone:
          description: Yemen climate zone
          title: Climate Zone
          type: string
        crop:
          title: Crop
          type: string
        days:
          default: 30
          maximum: 365
          minimum: 1
          title: Days
          type: integer
        ec_water:
          anyOf:
          - type: number
          - type: 'null'
          description: Water EC (dS/m)
          title: Ec Water
        field_area_ha:
          default: 1.0
          description: Field area (hectares)
          title: Field Area Ha
          type: number
        irrigation_efficiency:
          default: 0.85
          description: System efficiency (0-1)
          title: Irrigation Efficiency
          type: number
        soil_profile:
          description: Yemen soil profile name
          title: Soil Profile
          type: string
        start_date:
          format: date
          title: Start Date
          type: string
      required:
      - crop
      - soil_profile
      - climate_zone
      - start_date
      title: ScheduleRequest
      type: object
    ScheduleResponse:
      description: Multi-day irrigation schedule.
      properties:
        average_cycle_days:
          title: Average Cycle Days
          type: number
        climate_zone:
          title: Climate Zone
          type: string
        crop:
          title: Crop
          type: string
        crop_ar:
          title: Crop Ar
          type: string
        irrigation_events:
          title: Irrigation Events
          type: integer
        schedule:
          items:
            $ref: '#/components/schemas/ScheduleDay'
          title: Schedule
          type: array
        soil_profile:
          title: Soil Profile
          type: string
        total_water_m3_per_ha:
          title: Total Water M3 Per Ha
          type: number
        total_water_mm:
          title: Total Water Mm
          type: number
        water_use_efficiency:
          title: Water Use Efficiency
          type: string
      required:
      - crop
      - crop_ar
      - soil_profile
      - climate_zone
      - schedule
      - total_water_mm
      - total_water_m3_per_ha
      - irrigation_events
      - average_cycle_days
      - water_use_efficiency
      title: ScheduleResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WeatherInput:
      description: Daily weather data for ET0 calculation.
      properties:
        date:
          format: date
          title: Date
          type: string
        humidity_max_pct:
          default: 70.0
          description: Max relative humidity (%)
          title: Humidity Max Pct
          type: number
        humidity_min_pct:
          default: 30.0
          description: Min relative humidity (%)
          title: Humidity Min Pct
          type: number
        rainfall_mm:
          default: 0.0
          description: Rainfall (mm)
          title: Rainfall Mm
          type: number
        solar_radiation_mjm2:
          default: 20.0
          description: Solar radiation (MJ/m²/day)
          title: Solar Radiation Mjm2
          type: number
        temp_max_c:
          description: Max temperature (°C)
          title: Temp Max C
          type: number
        temp_min_c:
          description: Min temperature (°C)
          title: Temp Min C
          type: number
        wind_speed_2m_ms:
          default: 2.0
          description: Wind speed at 2m (m/s)
          title: Wind Speed 2M Ms
          type: number
      required:
      - date
      - temp_min_c
      - temp_max_c
      title: WeatherInput
      type: object
    YemenCropListResponse:
      description: List of available Yemen crops.
      properties:
        crops:
          items:
            additionalProperties: true
            type: object
          title: Crops
          type: array
        total:
          title: Total
          type: integer
      required:
      - crops
      - total
      title: YemenCropListResponse
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: FAO-56 based irrigation scheduling with Yemen adaptations
  title: Irrigation Cycle Engine
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/irrigation/cycle:
    post:
      description: 'Calculate irrigation cycle period and water requirements.


        Uses the formula: T = ((θfc - θmin) × Zr × β) / (ETc × α × γ)

        With optional salinity adjustment via SalinityModule.'
      operationId: calculate_irrigation_cycle_api_v1_irrigation_cycle_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IrrigationCycleRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IrrigationCycleResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Calculate Irrigation Cycle
  /api/v1/irrigation/et0:
    post:
      description: Calculate reference evapotranspiration (ET0) using FAO-56 Penman-Monteith.
      operationId: calculate_et0_api_v1_irrigation_et0_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ET0Request'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ET0Response'
                title: Response Calculate Et0 Api V1 Irrigation Et0 Post
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Calculate Et0
  /api/v1/irrigation/salinity-assessment:
    post:
      description: Assess salinity impact on irrigation and crop yield.
      operationId: assess_salinity_api_v1_irrigation_salinity_assessment_post
      parameters:
      - description: EC of irrigation water (dS/m)
        in: query
        name: ec_water
        required: true
        schema:
          description: EC of irrigation water (dS/m)
          title: Ec Water
          type: number
      - description: Crop name
        in: query
        name: crop
        required: true
        schema:
          description: Crop name
          title: Crop
          type: string
      - description: Current Kc
        in: query
        name: kc
        required: false
        schema:
          default: 1.0
          description: Current Kc
          title: Kc
          type: number
      - description: Soil EC (dS/m)
        in: query
        name: ec_soil
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Soil EC (dS/m)
          title: Ec Soil
      - description: Sodium (meq/L)
        in: query
        name: na
        required: false
        schema:
          default: 0.0
          description: Sodium (meq/L)
          title: Na
          type: number
      - description: Calcium (meq/L)
        in: query
        name: ca
        required: false
        schema:
          default: 0.0
          description: Calcium (meq/L)
          title: Ca
          type: number
      - description: Magnesium (meq/L)
        in: query
        name: mg
        required: false
        schema:
          default: 0.0
          description: Magnesium (meq/L)
          title: Mg
          type: number
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Assess Salinity
  /api/v1/irrigation/schedule:
    post:
      description: 'Generate multi-day irrigation schedule using Yemen crop/climate/soil data.


        Combines pyfao56 ET calculations with Yemen-specific parameters

        for a complete irrigation plan.'
      operationId: generate_irrigation_schedule_api_v1_irrigation_schedule_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Generate Irrigation Schedule
  /api/v1/yemen/climate-zones:
    get:
      description: List Yemen climate zones with key parameters.
      operationId: list_climate_zones_api_v1_yemen_climate_zones_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Climate Zones
  /api/v1/yemen/crops:
    get:
      description: List available Yemen crop parameters.
      operationId: list_yemen_crops_api_v1_yemen_crops_get
      parameters:
      - description: Filter by type
        in: query
        name: crop_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by type
          title: Crop Type
      - description: Filter by region
        in: query
        name: region
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by region
          title: Region
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YemenCropListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Yemen Crops
  /api/v1/yemen/crops/{crop_name}:
    get:
      description: Get detailed crop parameters for a Yemen crop.
      operationId: get_crop_info_api_v1_yemen_crops__crop_name__get
      parameters:
      - in: path
        name: crop_name
        required: true
        schema:
          title: Crop Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropInfoResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Crop Info
  /api/v1/yemen/soils:
    get:
      description: List Yemen soil profiles with hydraulic properties.
      operationId: list_soil_profiles_api_v1_yemen_soils_get
      parameters:
      - in: query
        name: region
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Region
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Soil Profiles
  /healthz:
    get:
      operationId: health_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /readyz:
    get:
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
