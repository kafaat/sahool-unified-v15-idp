paths:
  /:
    get:
      description: 'Root endpoint


        Returns service information and available endpoints.'
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
  /api/v1/entities/crops:
    get:
      description: 'List all crops in the knowledge graph


        Returns a paginated list of all crops with their properties.'
      operationId: list_crops_api_v1_entities_crops_get
      parameters:
      - in: query
        name: request
        required: true
        schema:
          title: Request
      - description: Maximum crops to return
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Maximum crops to return
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List Crops
      tags:
      - entities
    post:
      description: 'Create a new crop in the knowledge graph


        Adds a new crop entity with all its properties.'
      operationId: create_crop_api_v1_entities_crops_post
      parameters:
      - in: query
