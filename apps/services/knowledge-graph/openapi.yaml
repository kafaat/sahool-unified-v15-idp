      summary: Find Relationship Path
      description: 'Find the shortest path between two entities


        Shows the relationship chain connecting two entities in the knowledge graph.

        Useful for understanding how crops, diseases, and treatments are connected.'
      operationId: find_relationship_path_api_v1_graphs_path_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: request
        in: query
        required: true
        schema:
          title: Request
      - name: source_type
        in: query
        required: true
        schema:
          type: string
          description: Source entity type (crop, disease, treatment)
          title: Source Type
        description: Source entity type (crop, disease, treatment)
      - name: source_id
        in: query
        required: true
        schema:
          type: string
          description: Source entity ID
          title: Source Id
        description: Source entity ID
      - name: target_type
        in: query
        required: true
