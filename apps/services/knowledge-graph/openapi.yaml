components:
  schemas:
    Crop:
      description: Crop entity in the knowledge graph
      example:
        family: Poaceae
        growing_season: winter
        id: wheat
        name_ar: القمح
        name_en: Wheat
      properties:
        attributes:
          additionalProperties: true
          description: Additional attributes
          title: Attributes
          type: object
        created_at:
          format: date-time
          title: Created At
          type: string
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          description: Arabic description
          title: Description Ar
        description_en:
          anyOf:
          - type: string
          - type: 'null'
          description: English description
          title: Description En
        family:
          anyOf:
          - type: string
          - type: 'null'
          description: Botanical family
          title: Family
        growing_season:
          anyOf:
          - type: string
          - type: 'null'
          description: Growing season (spring/summer/fall/winter)
          title: Growing Season
        id:
          description: Unique crop identifier (e.g., 'wheat', 'tomato')
          title: Id
          type: string
        name_ar:
          description: Arabic crop name
          title: Name Ar
          type: string
        name_en:
          description: English crop name
          title: Name En
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - name_en
      - name_ar
      title: Crop
      type: object
    Disease:
      description: Disease entity in the knowledge graph
      example:
        id: powdery-mildew-wheat
        name_ar: البياض الدقيقي
        name_en: Powdery Mildew
        pathogen_type: fungal
        severity_level: 7
        symptoms_en:
        - White powder coating
        - Leaf distortion
      properties:
        attributes:
          additionalProperties: true
          description: Additional attributes
          title: Attributes
          type: object
        created_at:
          format: date-time
          title: Created At
          type: string
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          description: Arabic description
          title: Description Ar
        description_en:
          anyOf:
          - type: string
          - type: 'null'
          description: English description
          title: Description En
        id:
          description: Unique disease identifier
          title: Id
          type: string
        incubation_days:
          anyOf:
          - type: integer
          - type: 'null'
          description: Incubation period in days
          title: Incubation Days
        name_ar:
          description: Arabic disease name
          title: Name Ar
          type: string
        name_en:
          description: English disease name
          title: Name En
          type: string
        pathogen_type:
          anyOf:
          - type: string
          - type: 'null'
          description: Type of pathogen (fungal, bacterial, viral, etc.)
          title: Pathogen Type
        severity_level:
          anyOf:
          - maximum: 10
            minimum: 1
            type: integer
          - type: 'null'
          description: Severity level (1-10)
          title: Severity Level
        symptoms_ar:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: List of Arabic symptoms
          title: Symptoms Ar
        symptoms_en:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: List of English symptoms
          title: Symptoms En
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - name_en
      - name_ar
      title: Disease
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthCheckResponse:
      description: Health check response
      example:
        database: true
        service: knowledge-graph
        status: healthy
        timestamp: '2026-01-13T10:00:00'
        version: 1.0.0
      properties:
        database:
          description: Database connection status
          title: Database
          type: boolean
        service:
          description: Service name
          title: Service
          type: string
        status:
          description: Service status
          title: Status
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        version:
          description: Service version
          title: Version
          type: string
      required:
      - status
      - service
      - version
      - database
      title: HealthCheckResponse
      type: object
    RelationshipType:
      description: Types of relationships in the knowledge graph
      enum:
      - affects
      - treated_by
      - used_for
      - causes
      - prevents
      - alleviates
      - requires
      - compatible
      - follows
      - resistant_to
      title: RelationshipType
      type: string
    Treatment:
      description: Treatment/Pesticide entity in the knowledge graph
      example:
        active_ingredient: Sulfur
        application_method: dust
        id: sulfur-dust
        name_ar: مسحوق الكبريت
        name_en: Sulfur Dust
        safety_level: 1
        treatment_type: fungicide
      properties:
        active_ingredient:
          anyOf:
          - type: string
          - type: 'null'
          description: Active ingredient
          title: Active Ingredient
        application_method:
          anyOf:
          - type: string
          - type: 'null'
          description: Application method (spray, drench, dust, etc.)
          title: Application Method
        attributes:
          additionalProperties: true
          description: Additional attributes
          title: Attributes
          type: object
        concentration:
          anyOf:
          - type: string
          - type: 'null'
          description: Concentration/dosage (e.g., '0.2%')
          title: Concentration
        cost_per_liter:
          anyOf:
          - type: number
          - type: 'null'
          description: Cost per liter/unit
          title: Cost Per Liter
        created_at:
          format: date-time
          title: Created At
          type: string
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          description: Arabic description
          title: Description Ar
        description_en:
          anyOf:
          - type: string
          - type: 'null'
          description: English description
          title: Description En
        environmental_impact:
          anyOf:
          - type: string
          - type: 'null'
          description: Environmental impact
          title: Environmental Impact
        id:
          description: Unique treatment identifier
          title: Id
          type: string
        name_ar:
          description: Arabic treatment name
          title: Name Ar
          type: string
        name_en:
          description: English treatment name
          title: Name En
          type: string
        safety_level:
          anyOf:
          - maximum: 5
            minimum: 1
            type: integer
          - type: 'null'
          description: Safety level (1=very safe, 5=dangerous)
          title: Safety Level
        treatment_type:
          anyOf:
          - type: string
          - type: 'null'
          description: Type (fungicide, bactericide, insecticide, etc.)
          title: Treatment Type
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - name_en
      - name_ar
      title: Treatment
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
