info:
  description: Agricultural logistics management - fleet, storage, collection, and delivery optimization
  title: SAHOOL Logistics Service | خدمة اللوجستيات
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/collections:
    get:
      description: 'List harvest collections

        قائمة جمع المحاصيل'
      operationId: list_harvest_collections_api_v1_collections_get
      parameters:
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ShipmentStatus'
          - type: 'null'
          title: Status
      - in: query
        name: priority
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/CollectionPriority'
          - type: 'null'
          title: Priority
      - in: query
        name: scheduled_from
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Scheduled From
      - in: query
        name: scheduled_to
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Scheduled To
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema:
