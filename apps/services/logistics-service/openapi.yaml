      title: ShipmentCreate
      type: object
    ShipmentStatus:
      description: "Canonical shipment status enum.\n\nIncludes both backend-native values (scheduled, collecting, at_storage,\ndelivering) and soft/UX values used by the frontend (pending, delayed).\n\nSoft states semantics:\n  - `pending`: Maps internally to `scheduled` (not yet dispatched) - a \"soft\" state\n    used by the frontend to represent shipments that have been created but have\n    no vehicle assigned. Persisted canonically as `scheduled`.\n  - `delayed`: Maps internally to `in_transit` with a `delayed=True` flag - a\n    \"soft\" state representing a shipment in transit past its ETA. Persisted\n    canonically as `in_transit` with metadata.delayed=True."
      enum:
      - pending
      - delayed
      - scheduled
      - collecting
      - in_transit
      - at_storage
      - delivering
      - delivered
      - cancelled
      title: ShipmentStatus
      type: string
