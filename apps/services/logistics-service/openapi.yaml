      summary: Update Shipment Status
      description: 'Update shipment status

        تحديث حالة الشحنة


        Accepts both canonical backend statuses (scheduled, collecting, in_transit,

        at_storage, delivering, delivered, cancelled) and soft/UX frontend statuses

        (pending, delayed). The "pending" value is mapped to `scheduled`;

        "delayed" is mapped to `in_transit` with a metadata.delayed=True flag.'
      operationId: update_shipment_status_api_v1_logistics_shipments__shipment_id__status_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      - name: status
        in: query
        required: true
        schema:
          type: string
          description: Shipment status (canonical or legacy value)
          title: Status
        description: Shipment status (canonical or legacy value)
