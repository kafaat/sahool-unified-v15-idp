      operationId: list_prompts_prompts_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Prompts
  /ready:
    get:
      description: Kubernetes readiness probe - is the service ready to accept traffic?
      operationId: ready_ready_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Ready
  /readyz:
    get:
      description: Kubernetes readiness probe - is the service ready to accept traffic?
      operationId: ready_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Ready
  /resources:
    get:
      description: List available resources (convenience endpoint)
      operationId: list_resources_resources_get
      responses:
        '200':
          content:
