info:
  description: Model Context Protocol server for SAHOOL agricultural platform
  title: SAHOOL MCP Server
  version: 16.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: Root endpoint with server information
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
  /health:
    get:
      description: Health check endpoint
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /healthz:
    get:
      description: Health check endpoint
      operationId: health_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /mcp:
    post:
      description: Handle MCP JSON-RPC request
      operationId: handle_mcp_request_mcp_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Handle Mcp Request
  /mcp/sse:
    get:
      description: Handle Server-Sent Events for streaming MCP
      operationId: handle_sse_mcp_sse_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Handle Sse
  /metrics:
    get:
      description: Prometheus metrics endpoint
      operationId: metrics_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Metrics
