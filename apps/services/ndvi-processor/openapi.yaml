components:
  schemas:
    AnomalyResponse:
      description: استجابة الشذوذ
      properties:
        anomaly_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Anomaly Type
        current_ndvi:
          title: Current Ndvi
          type: number
        date:
          title: Date
          type: string
        field_id:
          title: Field Id
          type: string
        historical_mean:
          title: Historical Mean
          type: number
        historical_std:
          title: Historical Std
          type: number
        is_anomaly:
          title: Is Anomaly
          type: boolean
        severity:
          anyOf:
          - type: string
          - type: 'null'
          title: Severity
        z_score:
          title: Z Score
          type: number
      required:
      - field_id
      - date
      - current_ndvi
      - historical_mean
      - historical_std
      - z_score
      - is_anomaly
      - anomaly_type
      - severity
      title: AnomalyResponse
      type: object
    ChangeAnalysisRequest:
      description: طلب تحليل التغير
      properties:
        date1:
          title: Date1
          type: string
        date2:
          title: Date2
          type: string
        field_id:
          title: Field Id
          type: string
        include_zones:
          default: true
          title: Include Zones
          type: boolean
        tenant_id:
          title: Tenant Id
          type: string
      required:
      - tenant_id
      - field_id
      - date1
      - date2
      title: ChangeAnalysisRequest
      type: object
    ChangeAnalysisResponse:
      description: استجابة تحليل التغير
      properties:
        change:
          additionalProperties: true
          title: Change
          type: object
        date1:
          title: Date1
          type: string
        date2:
          title: Date2
          type: string
        days_between:
          title: Days Between
          type: integer
        field_id:
          title: Field Id
          type: string
        zones:
          anyOf:
          - items:
              $ref: '#/components/schemas/ZoneChange'
            type: array
          - type: 'null'
          title: Zones
      required:
      - field_id
      - date1
      - date2
      - days_between
      - change
      - zones
      title: ChangeAnalysisResponse
      type: object
    CompositeListResponse:
      description: قائمة المركبات
      properties:
        composites:
          items:
            $ref: '#/components/schemas/CompositeResponse'
          title: Composites
          type: array
        field_id:
          title: Field Id
          type: string
        total:
          title: Total
          type: integer
      required:
      - field_id
      - composites
      - total
      title: CompositeListResponse
      type: object
    CompositeMethod:
      description: طريقة التركيب
      enum:
      - max_ndvi
      - mean_ndvi
      - median_ndvi
      - min_cloud
      title: CompositeMethod
      type: string
    CompositeRequest:
      description: طلب إنشاء مركب
      properties:
        field_id:
          title: Field Id
          type: string
        method:
          $ref: '#/components/schemas/CompositeMethod'
          default: max_ndvi
        month:
          maximum: 12
          minimum: 1
          title: Month
          type: integer
        source:
          $ref: '#/components/schemas/SatelliteSource'
          default: sentinel-2
        tenant_id:
          title: Tenant Id
          type: string
        year:
          maximum: 2100
          minimum: 2000
          title: Year
          type: integer
      required:
      - tenant_id
      - field_id
      - year
      - month
      title: CompositeRequest
      type: object
    CompositeResponse:
      description: استجابة المركب
      properties:
        composite_id:
          title: Composite Id
          type: string
        created_at:
          title: Created At
          type: string
        field_id:
          title: Field Id
          type: string
        files:
          $ref: '#/components/schemas/FileUrls'
        images_used:
          title: Images Used
          type: integer
        method:
          title: Method
          type: string
        month:
          title: Month
          type: integer
        source:
          title: Source
          type: string
        statistics:
          $ref: '#/components/schemas/NDVIStatistics'
        year:
          title: Year
          type: integer
      required:
      - composite_id
      - field_id
      - year
      - month
      - method
      - source
      - statistics
      - images_used
      - files
      - created_at
      title: CompositeResponse
      type: object
    DateRange:
      description: نطاق التاريخ
      properties:
        end:
          description: تاريخ النهاية YYYY-MM-DD
          title: End
          type: string
        start:
          description: تاريخ البداية YYYY-MM-DD
          title: Start
          type: string
      required:
      - start
      - end
      title: DateRange
      type: object
    ExportFormat:
      description: صيغة التصدير
      enum:
      - geotiff
      - png
      - csv
      - json
      title: ExportFormat
      type: string
    FileUrls:
      description: روابط الملفات
      properties:
        geotiff:
          anyOf:
          - type: string
          - type: 'null'
          title: Geotiff
        png:
          anyOf:
          - type: string
          - type: 'null'
          title: Png
        thumbnail:
          anyOf:
          - type: string
          - type: 'null'
          title: Thumbnail
      title: FileUrls
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    JobListResponse:
      description: قائمة المهام
      properties:
        active_count:
          title: Active Count
          type: integer
        jobs:
          items:
            $ref: '#/components/schemas/JobResponse'
          title: Jobs
          type: array
        total:
          title: Total
          type: integer
      required:
      - jobs
      - total
      - active_count
      title: JobListResponse
      type: object
    JobResponse:
      description: استجابة المهمة
      properties:
        completed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Completed At
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        estimated_completion:
          anyOf:
          - type: string
          - type: 'null'
          title: Estimated Completion
        field_id:
          title: Field Id
          type: string
        job_id:
          title: Job Id
          type: string
        parameters:
          additionalProperties: true
          title: Parameters
          type: object
        progress_percent:
          maximum: 100
          minimum: 0
          title: Progress Percent
          type: integer
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Started At
        status:
          $ref: '#/components/schemas/JobStatus'
        tenant_id:
          title: Tenant Id
          type: string
        type:
          title: Type
          type: string
      required:
      - job_id
      - field_id
      - tenant_id
      - type
      - status
      - progress_percent
      - parameters
      - started_at
      - completed_at
      - estimated_completion
      - result
      - error
      title: JobResponse
      type: object
    JobStatus:
      description: حالة المهمة
      enum:
      - queued
      - processing
      - completed
      - failed
      - cancelled
      title: JobStatus
      type: string
    NDVIStatistics:
      description: إحصائيات NDVI
      properties:
        max:
          maximum: 1.0
          minimum: -1.0
          title: Max
          type: number
        mean:
          maximum: 1.0
          minimum: -1.0
          title: Mean
          type: number
        median:
          anyOf:
          - maximum: 1.0
            minimum: -1.0
            type: number
          - type: 'null'
          title: Median
        min:
          maximum: 1.0
          minimum: -1.0
          title: Min
          type: number
        percentiles:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Percentiles
        std:
          minimum: 0.0
          title: Std
          type: number
      required:
      - mean
      - std
      - min
      - max
      title: NDVIStatistics
      type: object
    ProcessRequest:
      description: طلب معالجة صورة
      properties:
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
        date_range:
          $ref: '#/components/schemas/DateRange'
        field_id:
          title: Field Id
          type: string
        options:
          anyOf:
          - $ref: '#/components/schemas/ProcessingOptions'
          - type: 'null'
        priority:
          default: 5
          maximum: 10
          minimum: 1
          title: Priority
          type: integer
        source:
          $ref: '#/components/schemas/SatelliteSource'
          default: sentinel-2
        tenant_id:
          title: Tenant Id
          type: string
      required:
      - tenant_id
      - field_id
      - date_range
      title: ProcessRequest
      type: object
    ProcessingOptions:
      description: خيارات المعالجة
      properties:
        atmospheric_correction:
          default: true
          title: Atmospheric Correction
          type: boolean
        cloud_masking:
          default: true
          title: Cloud Masking
          type: boolean
        cloud_threshold_percent:
          default: 20
          maximum: 100
          minimum: 0
          title: Cloud Threshold Percent
          type: integer
        include_thumbnail:
          default: true
          title: Include Thumbnail
          type: boolean
        output_format:
          $ref: '#/components/schemas/ExportFormat'
          default: geotiff
      title: ProcessingOptions
      type: object
    SatelliteSource:
      description: مصادر الأقمار الصناعية
      enum:
      - sentinel-2
      - landsat-8
      - landsat-9
      - modis
      title: SatelliteSource
      type: string
    SeasonalAnalysisResponse:
      description: استجابة التحليل الموسمي
      properties:
        annual_mean:
          title: Annual Mean
          type: number
        field_id:
          title: Field Id
          type: string
        peak_month:
          title: Peak Month
          type: integer
        seasons:
          items:
            $ref: '#/components/schemas/SeasonalStats'
          title: Seasons
          type: array
        trough_month:
          title: Trough Month
          type: integer
        year:
          title: Year
          type: integer
      required:
      - field_id
      - year
      - seasons
      - peak_month
      - trough_month
      - annual_mean
      title: SeasonalAnalysisResponse
      type: object
    SeasonalStats:
      description: إحصائيات موسمية
      properties:
        months:
          items:
            type: integer
          title: Months
          type: array
        ndvi_max:
          title: Ndvi Max
          type: number
        ndvi_mean:
          title: Ndvi Mean
          type: number
        ndvi_min:
          title: Ndvi Min
          type: number
        observations_count:
          title: Observations Count
          type: integer
        season:
          title: Season
          type: string
        season_ar:
          title: Season Ar
          type: string
      required:
      - season
      - season_ar
      - months
      - ndvi_mean
      - ndvi_max
      - ndvi_min
      - observations_count
      title: SeasonalStats
      type: object
    TimeseriesPoint:
      description: نقطة في السلسلة الزمنية
      properties:
        cloud_cover_percent:
          title: Cloud Cover Percent
          type: number
        date:
          title: Date
          type: string
        ndvi_max:
          title: Ndvi Max
          type: number
        ndvi_mean:
          title: Ndvi Mean
          type: number
        ndvi_min:
          title: Ndvi Min
          type: number
        source:
          title: Source
          type: string
      required:
      - date
      - ndvi_mean
      - ndvi_min
      - ndvi_max
      - cloud_cover_percent
      - source
      title: TimeseriesPoint
      type: object
    TimeseriesResponse:
      description: استجابة السلسلة الزمنية
      properties:
        data:
          items:
            $ref: '#/components/schemas/TimeseriesPoint'
          title: Data
          type: array
        end_date:
          title: End Date
          type: string
        field_id:
          title: Field Id
          type: string
        sources:
          items:
            type: string
          title: Sources
          type: array
        start_date:
          title: Start Date
          type: string
        total_points:
          title: Total Points
          type: integer
      required:
      - field_id
      - start_date
      - end_date
      - data
      - total_points
      - sources
      title: TimeseriesResponse
      type: object
    TrendDirection:
      description: اتجاه التغير
      enum:
      - improving
      - declining
      - stable
      title: TrendDirection
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    ZoneChange:
      description: تغير منطقة
      properties:
        change:
          title: Change
          type: number
        change_percent:
          title: Change Percent
          type: number
        ndvi_date1:
          title: Ndvi Date1
          type: number
        ndvi_date2:
          title: Ndvi Date2
          type: number
        trend:
          $ref: '#/components/schemas/TrendDirection'
        zone:
          title: Zone
          type: string
        zone_name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Zone Name Ar
      required:
      - zone
      - zone_name_ar
      - ndvi_date1
      - ndvi_date2
      - change
      - change_percent
      - trend
      title: ZoneChange
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: "\n    خدمة معالجة صور الأقمار الصناعية وحساب NDVI\n\n    ## الميزات الرئيسية\n\n    - معالجة صور Sentinel-2, Landsat, MODIS\n    - التصحيح الجوي وقناع السحب\n    - السلاسل الزمنية لـ NDVI\n    - تحليل التغير والشذوذ\n    - إنشاء المركبات الشهرية\n    - تصدير GeoTIFF و PNG\n    "
  title: SAHOOL NDVI Processor
  version: 16.0.0
openapi: 3.1.0
paths:
  /composites/monthly:
    post:
      description: إنشاء مركب شهري
      operationId: create_monthly_composite_composites_monthly_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompositeRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Monthly Composite
  /composites/{composite_id}:
    get:
      description: جلب مركب
      operationId: get_composite_composites__composite_id__get
      parameters:
      - in: path
        name: composite_id
        required: true
        schema:
          title: Composite Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Composite
  /composites/{composite_id}/download:
    get:
      description: تنزيل مركب
      operationId: download_composite_composites__composite_id__download_get
      parameters:
      - in: path
        name: composite_id
        required: true
        schema:
          title: Composite Id
          type: string
      - in: query
        name: format
        required: false
        schema:
          $ref: '#/components/schemas/ExportFormat'
          default: geotiff
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Download Composite
  /fields/{field_id}/composites:
    get:
      description: قائمة المركبات
      operationId: list_composites_fields__field_id__composites_get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      - in: query
        name: year
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositeListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List Composites
  /fields/{field_id}/ndvi:
    get:
      description: الحصول على NDVI
      operationId: get_ndvi_fields__field_id__ndvi_get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      - in: query
        name: date
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Ndvi
  /fields/{field_id}/ndvi/anomaly:
    get:
      description: كشف الشذوذ
      operationId: get_anomaly_detection_fields__field_id__ndvi_anomaly_get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      - in: query
        name: date
        required: true
        schema:
          title: Date
          type: string
      - in: query
        name: current_ndvi
        required: false
        schema:
          anyOf:
          - maximum: 1
            minimum: -1
            type: number
          - type: 'null'
          title: Current Ndvi
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnomalyResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Anomaly Detection
  /fields/{field_id}/ndvi/change:
    get:
      description: تحليل التغير
      operationId: get_change_analysis_fields__field_id__ndvi_change_get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      - in: query
        name: date1
        required: true
        schema:
          title: Date1
          type: string
      - in: query
        name: date2
        required: true
        schema:
          title: Date2
          type: string
      - in: query
        name: include_zones
        required: false
        schema:
          default: true
          title: Include Zones
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeAnalysisResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Change Analysis
    post:
      description: تحليل التغير (POST)
      operationId: post_change_analysis_fields__field_id__ndvi_change_post
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAnalysisRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeAnalysisResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Post Change Analysis
  /fields/{field_id}/ndvi/export:
    get:
      description: تصدير NDVI
      operationId: export_ndvi_fields__field_id__ndvi_export_get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      - in: query
        name: date
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date
      - in: query
        name: start
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Start
      - in: query
        name: end
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: End
      - in: query
        name: format
        required: false
        schema:
          $ref: '#/components/schemas/ExportFormat'
          default: geotiff
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Export Ndvi
  /fields/{field_id}/ndvi/latest:
    get:
      description: أحدث NDVI متاح
      operationId: get_latest_ndvi_fields__field_id__ndvi_latest_get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Latest Ndvi
  /fields/{field_id}/ndvi/seasonal:
    get:
      description: تحليل موسمي
      operationId: get_seasonal_analysis_fields__field_id__ndvi_seasonal_get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      - in: query
        name: year
        required: true
        schema:
          maximum: 2100
          minimum: 2000
          title: Year
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonalAnalysisResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Seasonal Analysis
  /fields/{field_id}/ndvi/timeseries:
    get:
      description: السلسلة الزمنية
