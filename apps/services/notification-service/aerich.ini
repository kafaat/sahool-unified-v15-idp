# DEPRECATED: Aerich is incompatible with tortoise-orm>=1.0.0.
# This service now uses Tortoise ORM's built-in migration CLI.
# Configuration lives in pyproject.toml under [tool.tortoise].
#
# Commands (run from the notification-service directory):
#   python -m tortoise init                          # One-time: scaffold migration packages
#   python -m tortoise makemigrations --name "desc"  # Generate a migration
#   python -m tortoise migrate                       # Apply pending migrations
#   python -m tortoise downgrade                     # Rollback last migration
#   python -m tortoise sqlmigrate models 0001        # Preview SQL without executing
#
# See: https://tortoise.github.io/migration.html
