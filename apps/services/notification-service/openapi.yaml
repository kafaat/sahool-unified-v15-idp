          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventPreferenceRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /quiet-hours:
    post:
      tags:
      - Preferences
      summary: تحديد ساعات الهدوء - Set Quiet Hours
      description: 'تحديد ساعات الهدوء (عدم الإزعاج)

        Set quiet hours (do not disturb period)


        During quiet hours, notifications will not be sent unless they are critical
        priority.

        Time format: HH:MM (24-hour format)

        Example: 22:00 to 06:00 (10 PM to 6 AM)'
      operationId: set_quiet_hours_quiet_hours_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
