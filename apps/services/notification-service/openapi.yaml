          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /:
    get:
      tags:
      - Preferences
      summary: الحصول على تفضيلات المستخدم - Get User Preferences
      description: 'الحصول على جميع تفضيلات الإشعارات للمستخدم

        Get all notification preferences for a user


        Returns preferences for all event types with their configured channels.'
      operationId: get_preferences__get
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          description: User ID
          title: User Id
        description: User ID
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Create Custom Notification
      description: إنشاء إشعار مخصص
      operationId: create_custom_notification__post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /event/{event_type}:
    get:
      tags:
      - Preferences
      summary: الحصول على تفضيلات حدث معين - Get Event Preference
      description: 'الحصول على تفضيلات نوع حدث معين

        Get preference for a specific event type


        Event types:

        - weather_alert

        - pest_outbreak

        - irrigation_reminder

        - crop_health

        - market_price

        - task_reminder

        - system'
      operationId: get_event_preference_event__event_type__get
      parameters:
      - name: event_type
        in: path
        required: true
        schema:
          type: string
          title: Event Type
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          description: User ID
          title: User Id
        description: User ID
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /update:
    post:
      tags:
      - Preferences
      summary: تحديث تفضيلات حدث - Update Event Preference
      description: 'تحديث تفضيلات نوع حدث معين

        Update preferences for a specific event type


        Configure which channels to use for each event type.

        Available channels: email, sms, push, whatsapp, in_app'
