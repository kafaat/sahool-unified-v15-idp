  /otp/send:
    post:
      description: 'إرسال رمز OTP إلى المستخدم

        Send OTP code to user via specified channel


        Rate limited to 3 requests per minute.


        Channels:

        - **sms**: SMS text message (requires phone number in E.164 format)

        - **whatsapp**: WhatsApp message (requires phone number)

        - **telegram**: Telegram message (requires Telegram chat ID)

        - **email**: Email message (requires email address)


        Purposes:

        - **login**: User login verification

        - **password_reset**: Password reset request

        - **verify_phone**: Phone number verification

        - **verify_email**: Email address verification

        - **two_factor**: Two-factor authentication'
      operationId: send_otp_otp_send_post
      parameters:
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendOTPResponse'
          description: OTP sent successfully
        '400':
          description: Invalid request
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          description: Too many requests - rate limited
        '503':
          description: Channel unavailable
      summary: إرسال رمز OTP - Send OTP Code
      tags:
      - OTP - رموز التحقق
  /otp/status:
    get:
      description: 'التحقق من حالة OTP

        Check OTP status including:

        - Whether OTP was sent

        - Remaining validity time

        - Remaining verification attempts'
      operationId: get_otp_status_otp_status_get
