      summary: حالة OTP - OTP Status
      description: 'التحقق من حالة OTP

        Check OTP status including:

        - Whether OTP was sent

        - Remaining validity time

        - Remaining verification attempts'
      operationId: get_otp_status_otp_status_get
      parameters:
      - name: identifier
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          description: Phone number or email | رقم الهاتف أو البريد
          title: Identifier
        description: Phone number or email | رقم الهاتف أو البريد
      - name: purpose
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/OTPPurpose'
          description: OTP purpose | غرض OTP
        description: OTP purpose | غرض OTP
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
