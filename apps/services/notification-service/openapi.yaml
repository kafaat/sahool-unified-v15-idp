openapi: 3.1.0
info:
  title: SAHOOL Notification Service | خدمة الإشعارات
  description: Enhanced personalized agricultural notifications for Yemeni farmers.
    Field-First Architecture with NATS integration, Redis queue, and comprehensive
    analytics.
  version: 16.0.0
paths:
  /add:
    post:
      tags:
      - Channels
      summary: إضافة قناة إشعار - Add Notification Channel
      description: 'إضافة قناة إشعار جديدة للمستخدم

        Add a new notification channel for a user


        - **email**: Requires verification via email

        - **sms**: Requires verification via SMS code

        - **whatsapp**: Requires verification via WhatsApp

        - **push**: No verification needed (FCM token)

        - **in_app**: No verification needed'
      operationId: add_channel_add_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddChannelRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /verify:
    post:
      tags:
      - Channels
      summary: تحقق من قناة - Verify Channel
      description: 'تحقق من قناة إشعار باستخدام رمز التحقق

        Verify a notification channel using verification code


        Required for: email, sms, whatsapp channels'
      operationId: verify_channel_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyChannelRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /remove:
    delete:
      tags:
      - Channels
      summary: حذف قناة - Remove Channel
      description: 'حذف قناة إشعار

        Remove a notification channel'
      operationId: remove_channel_remove_delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: channel_id
        in: query
        required: true
        schema:
          type: string
          description: Channel ID
          title: Channel Id
        description: Channel ID
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: User ID (deprecated, derived from auth)
          title: User Id
        description: User ID (deprecated, derived from auth)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /list:
    get:
      tags:
      - Channels
      summary: قائمة قنوات المستخدم - List User Channels
      description: 'الحصول على قائمة قنوات الإشعار للمستخدم مع الترقيم

        Get list of notification channels for a user with pagination


        Filters:

        - **channel_type**: email, sms, push, whatsapp, in_app

        - **enabled_only**: Show only enabled channels'
      operationId: list_channels_list_get
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          description: User ID
          title: User Id
        description: User ID
      - name: channel_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by channel type
          title: Channel Type
        description: Filter by channel type
      - name: enabled_only
        in: query
        required: false
        schema:
          type: boolean
          description: Show only enabled channels
          default: false
          title: Enabled Only
        description: Show only enabled channels
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of channels to return
          default: 50
          title: Limit
        description: Maximum number of channels to return
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of channels to skip
          default: 0
          title: Offset
        description: Number of channels to skip
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /update-status:
    patch:
      tags:
