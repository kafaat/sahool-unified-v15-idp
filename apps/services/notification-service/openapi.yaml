      description: "إحصائيات الإشعارات\nGet notification statistics\n\nSECURITY: tenant_id is now required via X-Tenant-Id header (not optional query param)\nto enforce tenant isolation and prevent cross-tenant data access.\n\nArgs:\n    user_id: Optional user ID filter\n    days: Number of days to analyze\n    tenant_id: Tenant ID from X-Tenant-Id header (required)\n\nReturns:\n    Notification statistics"
      operationId: get_notification_stats_history_stats_get
      parameters:
      - description: Filter by user ID
        in: query
        name: user_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by user ID
          title: User Id
      - description: Number of days to analyze
        in: query
        name: days
        required: false
        schema:
          default: 7
          description: Number of days to analyze
          maximum: 365
          minimum: 1
          title: Days
          type: integer
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryStatsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Notification Stats
      tags:
      - Notification History | سجل الإشعارات
  /history/user/{user_id}:
    get:
      description: "الحصول على سجل إشعارات المستخدم\nGet paginated notification history for a user\n\nArgs:\n    user_id: User ID\n    page: Page number (1-indexed)\n    page_size: Number of items per page\n    status: Optional status filter\n    type: Optional notification type filter\n    channel: Optional channel filter\n    start_date: Optional start date filter\n    end_date: Optional end date filter\n    include_expired: Whether to include expired notifications\n\nReturns:\n    Paginated list of notifications"
      operationId: get_user_notification_history_history_user__user_id__get
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          title: User Id
          type: string
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
      - description: 'Filter by status: pending, sent, failed, read'
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by status: pending, sent, failed, read'
          title: Status
      - description: Filter by notification type
        in: query
        name: type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by notification type
          title: Type
      - description: Filter by channel
        in: query
        name: channel
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by channel
          title: Channel
      - description: Filter from date
        in: query
        name: start_date
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Filter from date
          title: Start Date
      - description: Filter to date
        in: query
        name: end_date
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Filter to date
          title: End Date
      - description: Include expired notifications
        in: query
        name: include_expired
        required: false
        schema:
          default: false
          description: Include expired notifications
          title: Include Expired
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHistoryResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get User Notification History
      tags:
      - Notification History | سجل الإشعارات
