components:
  schemas:
    AddChannelRequest:
      properties:
        user_id:
          type: string
          maxLength: 100
          minLength: 1
          title: User Id
          description: User ID
        channel_type:
          type: string
          maxLength: 20
          minLength: 1
          title: Channel Type
          description: 'Channel type: email, sms, push, whatsapp, in_app'
        address:
          type: string
          maxLength: 500
          minLength: 1
          title: Address
          description: Channel address (email, phone, FCM token, etc.)
        tenant_id:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Tenant Id
          description: Tenant ID for multi-tenancy
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Additional metadata
      type: object
      required:
      - user_id
      - channel_type
      - address
      title: AddChannelRequest
      description: طلب إضافة قناة - Add Channel Request
      example:
        address: farmer@example.com
        channel_type: email
        metadata:
          device: web
        tenant_id: tenant-1
        user_id: farmer-123
    BulkUpdatePreferencesRequest:
      properties:
        user_id:
          type: string
          maxLength: 100
          minLength: 1
          title: User Id
          description: User ID
        preferences:
          items:
            additionalProperties: true
            type: object
          type: array
          minItems: 1
          title: Preferences
          description: List of preference updates
        tenant_id:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Tenant Id
          description: Tenant ID for multi-tenancy
      type: object
      required:
      - user_id
      - preferences
      title: BulkUpdatePreferencesRequest
      description: طلب تحديث تفضيلات متعددة - Bulk Update Preferences Request
      example:
        preferences:
        - channels:
          - email
          - sms
          - push
          enabled: true
          event_type: weather_alert
        - channels:
          - sms
          - push
          enabled: true
          event_type: pest_outbreak
        - channels:
          - push
          enabled: false
          event_type: irrigation_reminder
        tenant_id: tenant-1
        user_id: farmer-123
    CreateNotificationRequest:
      properties:
        type:
          $ref: '#/components/schemas/NotificationType'
        priority:
          $ref: '#/components/schemas/NotificationPriority'
          default: medium
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        title_ar:
          type: string
          maxLength: 200
          minLength: 1
          title: Title Ar
        body:
          type: string
          maxLength: 2000
          minLength: 1
          title: Body
        body_ar:
          type: string
          maxLength: 2000
          minLength: 1
          title: Body Ar
        data:
          additionalProperties: true
          type: object
          title: Data
          default: {}
        target_farmers:
          items:
            type: string
          type: array
          title: Target Farmers
          default: []
        target_governorates:
          items:
            $ref: '#/components/schemas/Governorate'
