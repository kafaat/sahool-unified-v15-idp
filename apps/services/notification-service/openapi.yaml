  /otp/send:
    post:
      tags:
      - OTP - رموز التحقق
      summary: إرسال رمز OTP - Send OTP Code
      description: 'إرسال رمز OTP إلى المستخدم

        Send OTP code to user via specified channel


        Rate limited to 3 requests per minute.


        Channels:

        - **sms**: SMS text message (requires phone number in E.164 format)

        - **whatsapp**: WhatsApp message (requires phone number)

        - **telegram**: Telegram message (requires Telegram chat ID)

        - **email**: Email message (requires email address)


        Purposes:

        - **login**: User login verification

        - **password_reset**: Password reset request

        - **verify_phone**: Phone number verification

        - **verify_email**: Email address verification

        - **two_factor**: Two-factor authentication'
      operationId: send_otp_otp_send_post
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendOTPResponse'
        '400':
          description: Invalid request
        '429':
          description: Too many requests - rate limited
        '503':
          description: Channel unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /otp/verify:
    post:
      tags:
      - OTP - رموز التحقق
      summary: التحقق من رمز OTP - Verify OTP Code
      description: 'التحقق من رمز OTP

        Verify the OTP code entered by user


        Returns success status and optional reset token (for password reset purpose).'
      operationId: verify_otp_otp_verify_post
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOTPResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid or expired OTP
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /otp/status:
    get:
      tags:
