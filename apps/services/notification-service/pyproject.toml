# Tortoise ORM built-in migration configuration
# Replaces the previous [tool.aerich] section (aerich is incompatible with tortoise-orm>=1.0.0)
#
# Usage (from the notification-service directory):
#   python -m tortoise makemigrations --name "description"
#   python -m tortoise migrate
[tool.tortoise]
config = "src.database.TORTOISE_ORM_LOCAL"
