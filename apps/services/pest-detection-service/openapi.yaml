          type: string
        pest_name_en:
          title: Pest Name En
          type: string
        recommendations_ar:
          items:
            type: string
          title: Recommendations Ar
          type: array
        recommendations_en:
          items:
            type: string
          title: Recommendations En
          type: array
        severity:
