openapi: 3.1.0
info:
  title: SAHOOL Pest Detection Service
  description: AI-powered pest detection with Middle East pest database | خدمة كشف الآفات بالذكاء الاصطناعي
  version: 16.0.0
paths:
  /v1/feature-schema:
    get:
      tags:
      - Schema
      summary: Get Feature Schema
      description: Return the ML feature schema for data drift monitoring.
      operationId: get_feature_schema_v1_feature_schema_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /healthz:
    get:
      tags:
      - Health
      summary: Liveness
      description: Kubernetes liveness probe.
      operationId: liveness_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /readyz:
    get:
      tags:
      - Health
      summary: Readiness
      description: Kubernetes readiness probe.
      operationId: readiness_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      tags:
      - Health
      summary: Health
      description: Comprehensive health check.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /metrics:
    get:
      tags:
      - Health
      summary: Metrics
      description: Prometheus metrics endpoint.
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/pests:
    get:
      tags:
      - Pests | الآفات
      summary: List Pests
      description: 'List all pests in database.

        قائمة جميع الآفات في قاعدة البيانات.'
      operationId: list_pests_api_v1_pests_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/PestCategory'
          - type: 'null'
          title: Category
      - name: crop
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Crop
      - name: quarantine_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Quarantine Only
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pest'
                title: Response List Pests Api V1 Pests Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/pests/search:
    get:
      tags:
      - Pests | الآفات
      summary: Search Pests
      description: 'Search pests by name.

        البحث عن الآفات بالاسم.'
      operationId: search_pests_api_v1_pests_search_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          description: Search query
          title: Q
        description: Search query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/pests/crop/{crop}:
    get:
      tags:
      - Pests | الآفات
      summary: Get Pests By Crop
      description: 'Get pests that affect a specific crop.

        الحصول على الآفات التي تصيب محصولاً معيناً.'
      operationId: get_pests_by_crop_api_v1_pests_crop__crop__get
