          description: Image file (JPG, PNG)
          title: File
          type: string
      required:
      - file
      title: Body_identify_pest_from_image_api_v1_pests_identify_post
      type: object
    DetectionResult:
      description: AI pest detection result.
      properties:
        bounding_box:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Bounding Box
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        life_stage:
