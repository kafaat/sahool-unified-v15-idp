        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_identify_pest_from_image_api_v1_pests_identify_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/pests/identify/symptoms:
    post:
