      - OAuth2PasswordBearer: []
      parameters:
      - name: crop
        in: path
        required: true
        schema:
          type: string
          title: Crop
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/pests/identify:
    post:
      tags:
      - Pests | الآفات
      summary: Identify Pest From Image
      description: 'Identify pest from image using AI.

        تحديد الآفة من الصورة باستخدام الذكاء الاصطناعي.'
      operationId: identify_pest_from_image_api_v1_pests_identify_post
