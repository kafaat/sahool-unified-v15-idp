components:
  schemas:
    Alert:
      description: Pest alert.
      properties:
        acknowledged_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Acknowledged At
        acknowledged_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Acknowledged By
        created_at:
          format: date-time
          title: Created At
          type: string
        field_id:
          title: Field Id
          type: string
        id:
          title: Id
          type: string
        message_ar:
          title: Message Ar
          type: string
        message_en:
          title: Message En
          type: string
        pest_id:
          title: Pest Id
          type: string
        pest_name_ar:
          title: Pest Name Ar
          type: string
        pest_name_en:
          title: Pest Name En
          type: string
        priority:
          $ref: '#/components/schemas/AlertPriority'
        recommended_action_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Recommended Action Ar
        recommended_action_en:
          anyOf:
          - type: string
          - type: 'null'
          title: Recommended Action En
        resolved_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Resolved At
        status:
          $ref: '#/components/schemas/AlertStatus'
          default: active
        threshold_exceeded:
          anyOf:
          - type: number
          - type: 'null'
          title: Threshold Exceeded
        title_ar:
          title: Title Ar
          type: string
        title_en:
          title: Title En
          type: string
      required:
      - field_id
      - pest_id
      - pest_name_en
      - pest_name_ar
      - priority
      - title_en
      - title_ar
      - message_en
      - message_ar
      title: Alert
      type: object
    AlertPriority:
      description: Alert priority levels.
      enum:
      - low
      - medium
      - high
      - critical
      title: AlertPriority
      type: string
    AlertStatus:
      description: Alert status.
      enum:
      - active
      - acknowledged
      - resolved
      - dismissed
      title: AlertStatus
      type: string
    Body_identify_pest_from_image_api_v1_pests_identify_post:
      properties:
        file:
