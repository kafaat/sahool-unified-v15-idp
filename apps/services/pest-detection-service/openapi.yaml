info:
  description: AI-powered pest detection with Middle East pest database | خدمة كشف الآفات بالذكاء الاصطناعي
  title: SAHOOL Pest Detection Service
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/alerts:
    get:
      description: 'List active pest alerts.

        قائمة تنبيهات الآفات النشطة.'
      operationId: list_alerts_api_v1_alerts_get
      parameters:
      - in: query
        name: field_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Field Id
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AlertStatus'
          - type: 'null'
          title: Status
      - in: query
        name: priority
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AlertPriority'
          - type: 'null'
          title: Priority
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Alerts
      tags:
      - Thresholds | العتبات
  /api/v1/alerts/create:
    post:
      description: 'Create manual alert.

        إنشاء تنبيه يدوي.'
      operationId: create_alert_api_v1_alerts_create_post
      parameters:
      - in: query
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      - in: query
        name: pest_id
        required: true
        schema:
          title: Pest Id
          type: string
      - in: query
        name: priority
        required: true
        schema:
          $ref: '#/components/schemas/AlertPriority'
      - in: query
        name: message_en
        required: true
        schema:
          title: Message En
          type: string
      - in: query
        name: message_ar
        required: true
        schema:
          title: Message Ar
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Alert
      tags:
      - Thresholds | العتبات
  /api/v1/alerts/{alert_id}:
    get:
      description: 'Get alert details.

        الحصول على تفاصيل التنبيه.'
      operationId: get_alert_api_v1_alerts__alert_id__get
      parameters:
      - in: path
        name: alert_id
        required: true
        schema:
          title: Alert Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Alert
      tags:
      - Thresholds | العتبات
  /api/v1/alerts/{alert_id}/acknowledge:
    post:
      description: 'Acknowledge alert.

        الإقرار بالتنبيه.'
      operationId: acknowledge_alert_api_v1_alerts__alert_id__acknowledge_post
      parameters:
      - in: path
        name: alert_id
        required: true
        schema:
          title: Alert Id
          type: string
      - description: User acknowledging the alert
        in: query
        name: acknowledged_by
        required: true
        schema:
          description: User acknowledging the alert
          title: Acknowledged By
          type: string
      responses:
