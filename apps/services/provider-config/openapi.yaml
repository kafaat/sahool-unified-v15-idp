components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthCheckRequest:
      properties:
        api_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Key
        provider_name:
          title: Provider Name
          type: string
        provider_type:
          $ref: '#/components/schemas/ProviderType'
      required:
      - provider_type
      - provider_name
      title: HealthCheckRequest
      type: object
    ProviderConfig:
      properties:
        api_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Key
        enabled:
          default: true
          title: Enabled
          type: boolean
        priority:
          $ref: '#/components/schemas/ProviderPriority'
          default: primary
        provider_name:
          title: Provider Name
          type: string
      required:
      - provider_name
      title: ProviderConfig
      type: object
    ProviderPriority:
      enum:
      - primary
      - secondary
      - tertiary
      - disabled
      title: ProviderPriority
      type: string
    ProviderStatus:
      enum:
      - available
      - unavailable
      - rate_limited
      - error
      - checking
      title: ProviderStatus
      type: string
    ProviderStatusResponse:
      properties:
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        last_check:
          format: date-time
          title: Last Check
          type: string
        provider_name:
          title: Provider Name
          type: string
        response_time_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Response Time Ms
        status:
          $ref: '#/components/schemas/ProviderStatus'
      required:
      - provider_name
      - status
      - last_check
      title: ProviderStatusResponse
      type: object
    ProviderType:
      enum:
      - map
      - weather
      - satellite
      - notification
      - payment
      - sms
      title: ProviderType
      type: string
    ProvidersListResponse:
      properties:
        map_providers:
          items:
            additionalProperties: true
            type: object
          title: Map Providers
          type: array
        satellite_providers:
          items:
            additionalProperties: true
            type: object
          title: Satellite Providers
          type: array
        weather_providers:
          items:
            additionalProperties: true
            type: object
          title: Weather Providers
          type: array
      required:
      - map_providers
      - weather_providers
      - satellite_providers
      title: ProvidersListResponse
      type: object
    TenantProviderConfig:
      properties:
        map_providers:
          default: []
          items:
            $ref: '#/components/schemas/ProviderConfig'
          title: Map Providers
          type: array
        satellite_providers:
          default: []
          items:
            $ref: '#/components/schemas/ProviderConfig'
          title: Satellite Providers
          type: array
        tenant_id:
          title: Tenant Id
          type: string
        weather_providers:
          default: []
          items:
            $ref: '#/components/schemas/ProviderConfig'
          title: Weather Providers
          type: array
      required:
      - tenant_id
      title: TenantProviderConfig
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: خدمة إدارة وتكوين المزودين الخارجيين للخرائط والطقس والأقمار الصناعية
  title: SAHOOL Provider Configuration Service
  version: 16.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: Service information
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
  /config/{tenant_id}:
    delete:
      description: Reset tenant configuration to defaults
      operationId: reset_tenant_config_config__tenant_id__delete
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          title: Tenant Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Reset Tenant Config
    get:
      description: Get provider configuration for a tenant
      operationId: get_tenant_config_config__tenant_id__get
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          title: Tenant Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Tenant Config
    post:
      description: Update provider configuration for a tenant
      operationId: update_tenant_config_config__tenant_id__post
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          title: Tenant Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantProviderConfig'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update Tenant Config
  /config/{tenant_id}/history:
    get:
      description: Get configuration change history for a tenant
      operationId: get_config_history_config__tenant_id__history_get
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          title: Tenant Id
          type: string
      - in: query
        name: provider_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Type
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Config History
  /config/{tenant_id}/rollback:
    post:
      description: Rollback configuration to a specific version
      operationId: rollback_config_config__tenant_id__rollback_post
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          title: Tenant Id
          type: string
      - in: query
        name: config_id
        required: true
        schema:
          title: Config Id
          type: string
      - in: query
        name: version
        required: true
        schema:
          title: Version
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Rollback Config
  /healthz:
    get:
      description: Health check endpoint
      operationId: health_check_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health Check
  /providers:
    get:
      description: List all available providers
      operationId: list_all_providers_providers_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersListResponse'
          description: Successful Response
      summary: List All Providers
  /providers/check:
    post:
      description: Check health of a specific provider
      operationId: check_provider_health_providers_check_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthCheckRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderStatusResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Check Provider Health
  /providers/check/all:
    get:
      description: Check health of all free providers (no API key required)
      operationId: check_all_free_providers_providers_check_all_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Check All Free Providers
  /providers/failover-chain/{provider_type}:
    get:
      description: 'Get ordered failover chain for a provider type

        سلسلة الاحتياط المرتبة لنوع المزود'
      operationId: get_failover_chain_providers_failover_chain__provider_type__get
      parameters:
      - in: path
        name: provider_type
        required: true
        schema:
          $ref: '#/components/schemas/ProviderType'
      - in: query
        name: country
        required: false
        schema:
          default: YE
          title: Country
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Failover Chain
  /providers/maps:
    get:
      description: List all map providers
      operationId: list_map_providers_providers_maps_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Map Providers
  /providers/notification:
    get:
      description: List all notification providers - قائمة مزودي الإشعارات
      operationId: list_notification_providers_providers_notification_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Notification Providers
  /providers/payment:
    get:
      description: List all payment providers - قائمة مزودي الدفع
      operationId: list_payment_providers_providers_payment_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Payment Providers
  /providers/recommend:
    get:
      description: Get recommended providers based on use case and budget
      operationId: recommend_providers_providers_recommend_get
      parameters:
      - in: query
        name: use_case
        required: false
        schema:
          default: agricultural
          title: Use Case
          type: string
      - in: query
        name: budget
        required: false
        schema:
          default: free
          title: Budget
          type: string
      - in: query
        name: offline_required
        required: false
        schema:
          default: true
          title: Offline Required
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Recommend Providers
  /providers/satellite:
    get:
      description: List all satellite providers
      operationId: list_satellite_providers_providers_satellite_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Satellite Providers
  /providers/select/{provider_type}:
    get:
      description: 'Smart provider selection based on country and requirements

        اختيار المزود الذكي بناءً على البلد والمتطلبات'
      operationId: select_provider_providers_select__provider_type__get
      parameters:
      - in: path
        name: provider_type
        required: true
        schema:
          $ref: '#/components/schemas/ProviderType'
      - in: query
        name: country
        required: false
        schema:
          default: YE
          title: Country
          type: string
      - in: query
        name: currency
        required: false
        schema:
          default: YER
          title: Currency
          type: string
      - in: query
        name: fallback
        required: false
        schema:
          default: true
          title: Fallback
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Select Provider
  /providers/sms:
    get:
      description: List all SMS providers - قائمة مزودي الرسائل النصية
      operationId: list_sms_providers_providers_sms_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Sms Providers
  /providers/weather:
    get:
      description: List all weather providers
      operationId: list_weather_providers_providers_weather_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Weather Providers
  /readyz:
    get:
      description: Kubernetes readiness probe - is the service ready to accept traffic?
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
