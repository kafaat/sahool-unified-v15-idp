components:
  schemas:
    CompressRequest:
      description: Request model for skill compression
      properties:
        compression_level:
          default: 1
          description: Compression level 1-9 (1=fastest, 9=best)
          maximum: 9
          minimum: 1
          title: Compression Level
          type: integer
        skill_data:
          additionalProperties: true
          description: The skill data to compress
          title: Skill Data
          type: object
        skill_id:
          description: Unique identifier for the skill
          title: Skill Id
          type: string
        target_size_kb:
          description: Target compressed size in KB
          title: Target Size Kb
          type: integer
      required:
      - skill_id
      - skill_data
      title: CompressRequest
      type: object
    EvaluateRequest:
      description: Request model for skill evaluation
      properties:
        expected_output:
          additionalProperties: true
          description: Expected output for validation
          title: Expected Output
          type: object
        input_data:
          additionalProperties: true
          description: Test input data
          title: Input Data
          type: object
        metrics:
          default:
          - accuracy
          - latency
          description: Metrics to evaluate
          items:
            type: string
          title: Metrics
          type: array
        skill_id:
          description: Skill ID to evaluate
          title: Skill Id
          type: string
      required:
      - skill_id
      - input_data
      title: EvaluateRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LearningModuleModel:
      description: Model for a learning module
      properties:
        difficulty:
          default: beginner
          description: Difficulty level
          title: Difficulty
          type: string
        duration_minutes:
          default: 30
          description: Estimated duration
          title: Duration Minutes
          type: integer
        module_id:
          description: Unique module identifier
          title: Module Id
          type: string
        skill_type:
          description: Type of skill covered
          title: Skill Type
          type: string
        title:
          description: Module title
          title: Title
          type: string
        title_ar:
          description: Module title in Arabic
          title: Title Ar
          type: string
      required:
      - module_id
      - title
      - skill_type
      title: LearningModuleModel
      type: object
    LearningPathRequest:
      description: Request model for learning path recommendation
      properties:
        current_skills:
          description: List of current skill IDs
          items:
            type: string
          title: Current Skills
          type: array
        farmer_id:
          description: Unique farmer identifier
          title: Farmer Id
          type: string
        max_modules:
          default: 5
          description: Maximum modules in path
          maximum: 20
          minimum: 1
          title: Max Modules
          type: integer
        preferred_difficulty:
          default: intermediate
          description: Preferred difficulty level
          title: Preferred Difficulty
          type: string
        target_skills:
          description: Desired skills to learn
          items:
            type: string
          title: Target Skills
          type: array
      required:
      - farmer_id
      title: LearningPathRequest
      type: object
    LearningPathResponse:
      description: Response model for learning path
      properties:
        created_at:
          title: Created At
          type: string
        farmer_id:
          title: Farmer Id
          type: string
        modules:
          items:
            $ref: '#/components/schemas/LearningModuleModel'
          title: Modules
          type: array
        path_id:
          title: Path Id
          type: string
        recommended_order:
          items:
            type: string
          title: Recommended Order
          type: array
        total_duration_minutes:
          title: Total Duration Minutes
          type: integer
      required:
      - path_id
      - farmer_id
      - modules
      - total_duration_minutes
      - recommended_order
      - created_at
      title: LearningPathResponse
      type: object
    MemoryRecallRequest:
      description: Request model for recalling skill from memory
      properties:
        include_metadata:
          default: false
          description: Include metadata in response
          title: Include Metadata
          type: boolean
        namespace:
          default: default
          description: Memory namespace
          title: Namespace
          type: string
        skill_id:
          description: Skill ID to recall
          title: Skill Id
          type: string
      required:
      - skill_id
      title: MemoryRecallRequest
      type: object
    MemoryStoreRequest:
      description: Request model for storing skill in memory
      properties:
        metadata:
          additionalProperties: true
          description: Optional metadata
          title: Metadata
          type: object
        namespace:
          default: default
          description: Memory namespace for organization
          title: Namespace
          type: string
        skill_data:
          additionalProperties: true
          description: Skill data to store
          title: Skill Data
          type: object
        skill_id:
          description: Unique skill identifier
          title: Skill Id
          type: string
        ttl_seconds:
          default: 3600
          description: Time to live in seconds (0=permanent)
          minimum: 0
          title: Ttl Seconds
          type: integer
      required:
      - skill_id
      - skill_data
      title: MemoryStoreRequest
      type: object
    SkillAssessmentRequest:
      description: Request model for skill assessment
      properties:
        assessment_data:
          additionalProperties: true
          description: Assessment input data
          title: Assessment Data
          type: object
        assessment_type:
          default: quiz
          description: Type of assessment (quiz, practical, self)
          title: Assessment Type
          type: string
        farmer_id:
          description: Unique farmer identifier
          title: Farmer Id
          type: string
        skill_type:
          description: Type of skill being assessed
          title: Skill Type
          type: string
      required:
      - farmer_id
      - skill_type
      - assessment_data
      title: SkillAssessmentRequest
      type: object
    SkillAssessmentResponse:
      description: Response model for skill assessment
      properties:
        assessment_id:
          title: Assessment Id
          type: string
        farmer_id:
          title: Farmer Id
          type: string
        feedback:
          title: Feedback
          type: string
        feedback_ar:
          title: Feedback Ar
          type: string
        level:
          title: Level
          type: string
        score:
          title: Score
          type: number
        skill_type:
          title: Skill Type
          type: string
        timestamp:
          title: Timestamp
          type: string
      required:
      - assessment_id
      - farmer_id
      - skill_type
      - score
      - level
      - feedback
      - timestamp
      title: SkillAssessmentResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: AI model skill compression, memory management, and evaluation
  title: SAHOOL Skills Service
  version: 16.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: API root endpoint
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
  /assess:
    post:
      description: 'Assess a farmer''s skill level based on assessment data.

        Publishes assessment results to NATS for downstream processing.'
      operationId: assess_skill_assess_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillAssessmentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillAssessmentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Assess Skill
  /compress:
    post:
      description: 'Compress skill data using configurable compression levels

        Reduces skill size while maintaining functionality'
      operationId: compress_skill_compress_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompressRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Compress Skill
  /evaluate:
    post:
      description: 'Evaluate skill performance against metrics

        Measures accuracy, latency, and other performance indicators'
      operationId: evaluate_skill_evaluate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Evaluate Skill
  /healthz:
    get:
      description: Health check endpoint for liveness probe
      operationId: health_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /learning-path:
    post:
      description: 'Generate a personalized learning path for a farmer.

        Publishes learning path creation event to NATS.'
      operationId: create_learning_path_learning_path_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningPathRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPathResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Learning Path
  /memory/recall:
    post:
      description: 'Recall previously stored skill from memory

        Returns skill data with optional metadata'
      operationId: recall_from_memory_memory_recall_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRecallRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Recall From Memory
  /memory/store:
    post:
      description: 'Store skill in volatile memory for fast access

        Supports namespacing and TTL (time-to-live)'
      operationId: store_in_memory_memory_store_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryStoreRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Store In Memory
  /readyz:
    get:
      description: Readiness check endpoint
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
