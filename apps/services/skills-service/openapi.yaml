openapi: 3.1.0
info:
  title: SAHOOL Skills Service
  description: AI model skill compression, memory management, and evaluation
  version: 16.0.0
paths:
  /healthz:
    get:
      summary: Health
      description: Health check endpoint for liveness probe
      operationId: health_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /readyz:
    get:
      summary: Readiness
      description: Readiness check endpoint
      operationId: readiness_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /compress:
    post:
      summary: Compress Skill
      description: 'Compress skill data using configurable compression levels

        Reduces skill size while maintaining functionality'
      operationId: compress_skill_compress_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompressRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /memory/store:
    post:
      summary: Store In Memory
      description: 'Store skill in volatile memory for fast access

        Supports namespacing and TTL (time-to-live)'
      operationId: store_in_memory_memory_store_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryStoreRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /memory/recall:
    post:
      summary: Recall From Memory
      description: 'Recall previously stored skill from memory

        Returns skill data with optional metadata'
      operationId: recall_from_memory_memory_recall_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRecallRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /evaluate:
    post:
      summary: Evaluate Skill
      description: 'Evaluate skill performance against metrics

        Measures accuracy, latency, and other performance indicators'
      operationId: evaluate_skill_evaluate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /assess:
    post:
      summary: Assess Skill
      description: 'Assess a farmer''s skill level based on assessment data.

        Publishes assessment results to NATS for downstream processing.'
      operationId: assess_skill_assess_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillAssessmentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillAssessmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /learning-path:
    post:
      summary: Create Learning Path
      description: 'Generate a personalized learning path for a farmer.

        Publishes learning path creation event to NATS.'
      operationId: create_learning_path_learning_path_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningPathRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPathResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /:
    get:
      summary: Root
      description: API root endpoint
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    CompressRequest:
      properties:
        skill_id:
          type: string
          title: Skill Id
          description: Unique identifier for the skill
        skill_data:
          additionalProperties: true
          type: object
          title: Skill Data
          description: The skill data to compress
        compression_level:
          type: integer
          maximum: 9
          minimum: 1
          title: Compression Level
          description: Compression level 1-9 (1=fastest, 9=best)
          default: 1
        target_size_kb:
          type: integer
          title: Target Size Kb
          description: Target compressed size in KB
      type: object
      required:
      - skill_id
      - skill_data
      title: CompressRequest
      description: Request model for skill compression
    EvaluateRequest:
      properties:
        skill_id:
          type: string
          title: Skill Id
          description: Skill ID to evaluate
        input_data:
          additionalProperties: true
          type: object
          title: Input Data
          description: Test input data
        expected_output:
          additionalProperties: true
          type: object
          title: Expected Output
          description: Expected output for validation
        metrics:
          items:
            type: string
          type: array
          title: Metrics
          description: Metrics to evaluate
          default:
          - accuracy
          - latency
      type: object
      required:
      - skill_id
      - input_data
      title: EvaluateRequest
      description: Request model for skill evaluation
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LearningModuleModel:
      properties:
        module_id:
          type: string
          title: Module Id
          description: Unique module identifier
        title:
          type: string
          title: Title
          description: Module title
        title_ar:
          type: string
          title: Title Ar
          description: Module title in Arabic
        skill_type:
          type: string
          title: Skill Type
          description: Type of skill covered
        difficulty:
          type: string
          title: Difficulty
          description: Difficulty level
          default: beginner
        duration_minutes:
          type: integer
          title: Duration Minutes
          description: Estimated duration
          default: 30
      type: object
      required:
      - module_id
      - title
      - skill_type
      title: LearningModuleModel
      description: Model for a learning module
    LearningPathRequest:
      properties:
        farmer_id:
          type: string
          title: Farmer Id
          description: Unique farmer identifier
        current_skills:
          items:
            type: string
          type: array
          title: Current Skills
          description: List of current skill IDs
        target_skills:
          items:
            type: string
          type: array
          title: Target Skills
          description: Desired skills to learn
        preferred_difficulty:
          type: string
          title: Preferred Difficulty
          description: Preferred difficulty level
          default: intermediate
        max_modules:
          type: integer
          maximum: 20
          minimum: 1
          title: Max Modules
          description: Maximum modules in path
          default: 5
      type: object
      required:
      - farmer_id
      title: LearningPathRequest
      description: Request model for learning path recommendation
    LearningPathResponse:
      properties:
        path_id:
          type: string
          title: Path Id
        farmer_id:
          type: string
          title: Farmer Id
        modules:
          items:
            $ref: '#/components/schemas/LearningModuleModel'
          type: array
          title: Modules
        total_duration_minutes:
          type: integer
          title: Total Duration Minutes
        recommended_order:
          items:
            type: string
          type: array
          title: Recommended Order
        created_at:
          type: string
          title: Created At
      type: object
      required:
      - path_id
      - farmer_id
      - modules
      - total_duration_minutes
      - recommended_order
      - created_at
      title: LearningPathResponse
      description: Response model for learning path
    MemoryRecallRequest:
      properties:
        skill_id:
          type: string
          title: Skill Id
          description: Skill ID to recall
        namespace:
          type: string
          title: Namespace
          description: Memory namespace
          default: default
        include_metadata:
          type: boolean
          title: Include Metadata
          description: Include metadata in response
          default: false
      type: object
      required:
      - skill_id
      title: MemoryRecallRequest
      description: Request model for recalling skill from memory
    MemoryStoreRequest:
      properties:
        skill_id:
          type: string
          title: Skill Id
          description: Unique skill identifier
        namespace:
          type: string
          title: Namespace
          description: Memory namespace for organization
          default: default
        skill_data:
          additionalProperties: true
          type: object
          title: Skill Data
          description: Skill data to store
        ttl_seconds:
          type: integer
          minimum: 0
          title: Ttl Seconds
          description: Time to live in seconds (0=permanent)
          default: 3600
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Optional metadata
      type: object
      required:
      - skill_id
      - skill_data
      title: MemoryStoreRequest
      description: Request model for storing skill in memory
    SkillAssessmentRequest:
      properties:
        farmer_id:
          type: string
          title: Farmer Id
          description: Unique farmer identifier
        skill_type:
          type: string
          title: Skill Type
          description: Type of skill being assessed
        assessment_data:
          additionalProperties: true
          type: object
          title: Assessment Data
          description: Assessment input data
        assessment_type:
          type: string
          title: Assessment Type
          description: Type of assessment (quiz, practical, self)
          default: quiz
      type: object
      required:
      - farmer_id
      - skill_type
      - assessment_data
      title: SkillAssessmentRequest
      description: Request model for skill assessment
    SkillAssessmentResponse:
      properties:
        assessment_id:
          type: string
          title: Assessment Id
        farmer_id:
          type: string
          title: Farmer Id
        skill_type:
          type: string
          title: Skill Type
        score:
          type: number
          title: Score
        level:
          type: string
          title: Level
        feedback:
          type: string
          title: Feedback
        feedback_ar:
          type: string
          title: Feedback Ar
        timestamp:
          type: string
          title: Timestamp
      type: object
      required:
      - assessment_id
      - farmer_id
      - skill_type
      - score
      - level
      - feedback
      - timestamp
      title: SkillAssessmentResponse
      description: Response model for skill assessment
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
