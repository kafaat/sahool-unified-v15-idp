components:
  schemas:
    AmendmentPlanRequest:
      properties:
        area_ha:
          default: 1.0
          title: Area Ha
          type: number
        crop:
          default: wheat
          title: Crop
          type: string
        target_yield_t_ha:
          default: 5.0
          title: Target Yield T Ha
          type: number
        test_id:
          title: Test Id
          type: string
      required:
      - test_id
      title: AmendmentPlanRequest
      type: object
    EcStatusRequest:
      properties:
        ec_ds_m:
          description: EC in dS/m
          minimum: 0.0
          title: Ec Ds M
          type: number
      required:
      - ec_ds_m
      title: EcStatusRequest
      type: object
    FertilizerRateRequest:
      properties:
        fertilizer_nutrient_percent:
          description: Nutrient content in fertilizer (%)
          exclusiveMinimum: 0.0
          maximum: 100.0
          title: Fertilizer Nutrient Percent
          type: number
        nutrient_needed_kg_ha:
          description: Nutrient needed in kg/ha
          exclusiveMinimum: 0.0
          title: Nutrient Needed Kg Ha
          type: number
      required:
      - nutrient_needed_kg_ha
      - fertilizer_nutrient_percent
      title: FertilizerRateRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    InterpretRequest:
      properties:
        crop:
          default: wheat
          title: Crop
          type: string
        test_id:
          title: Test Id
          type: string
      required:
      - test_id
      title: InterpretRequest
      type: object
    MacronutrientsInput:
      properties:
        calcium_ppm:
          anyOf:
          - type: number
          - type: 'null'
          title: Calcium Ppm
        magnesium_ppm:
          anyOf:
          - type: number
          - type: 'null'
          title: Magnesium Ppm
        nitrogen_nitrate_ppm:
          description: Nitrogen (NO3) ppm
          minimum: 0.0
          title: Nitrogen Nitrate Ppm
          type: number
        phosphorus_ppm:
          description: Phosphorus ppm
          minimum: 0.0
          title: Phosphorus Ppm
          type: number
        potassium_ppm:
          description: Potassium ppm
          minimum: 0.0
          title: Potassium Ppm
          type: number
        sulfur_ppm:
          anyOf:
          - type: number
          - type: 'null'
          title: Sulfur Ppm
      required:
      - nitrogen_nitrate_ppm
      - phosphorus_ppm
      - potassium_ppm
      title: MacronutrientsInput
      type: object
    NutrientStatusRequest:
      properties:
        extraction_method:
          default: olsen
          title: Extraction Method
          type: string
        nutrient:
          description: 'Nutrient code: N, P, K, Ca, Mg, S, Fe, Mn, Zn, Cu, B'
          title: Nutrient
          type: string
        value:
          description: Value in ppm
          minimum: 0.0
          title: Value
          type: number
      required:
      - nutrient
      - value
      title: NutrientStatusRequest
      type: object
    NutrientTrendRequest:
      properties:
        field_id:
          title: Field Id
          type: string
        nutrient:
          description: 'Nutrient code: N, P, K, etc.'
          title: Nutrient
          type: string
      required:
      - field_id
      - nutrient
      title: NutrientTrendRequest
      type: object
    PaginatedSoilTestsResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SoilTestRow'
          title: Items
          type: array
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextcursor
        total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total
      required:
      - items
      title: PaginatedSoilTestsResponse
      type: object
    PeriodCompareRequest:
      properties:
        field_id:
          title: Field Id
          type: string
        period1_end:
          format: date-time
          title: Period1 End
          type: string
        period1_start:
          format: date-time
          title: Period1 Start
          type: string
        period2_end:
          format: date-time
          title: Period2 End
          type: string
        period2_start:
          format: date-time
          title: Period2 Start
          type: string
      required:
      - field_id
      - period1_start
      - period1_end
      - period2_start
      - period2_end
      title: PeriodCompareRequest
      type: object
    PhStatusRequest:
      properties:
        ph:
          description: Soil pH value
          maximum: 14.0
          minimum: 0.0
          title: Ph
          type: number
      required:
      - ph
      title: PhStatusRequest
      type: object
    SoilPropertiesInput:
      properties:
        cec_meq_100g:
          anyOf:
          - type: number
          - type: 'null'
          title: Cec Meq 100G
        ec_ds_m:
          description: EC dS/m
          minimum: 0.0
          title: Ec Ds M
          type: number
        organic_matter_percent:
          maximum: 100.0
          minimum: 0.0
          title: Organic Matter Percent
          type: number
        ph:
          description: Soil pH
          maximum: 14.0
          minimum: 0.0
          title: Ph
          type: number
      required:
      - ph
      - ec_ds_m
      - organic_matter_percent
      title: SoilPropertiesInput
      type: object
    SoilTestCreateRequest:
      properties:
        field_id:
          title: Field Id
          type: string
        macronutrients:
          $ref: '#/components/schemas/MacronutrientsInput'
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        notes_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes Ar
        sample_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Sample Date
        sample_depth_cm:
          default: 30.0
          title: Sample Depth Cm
          type: number
        soil_properties:
          $ref: '#/components/schemas/SoilPropertiesInput'
      required:
      - field_id
      - macronutrients
      - soil_properties
      title: SoilTestCreateRequest
      type: object
    SoilTestRow:
      description: Single soil test row as returned by the analytics list endpoint.
      properties:
        calcium_ppm:
          anyOf:
          - type: number
          - type: 'null'
          title: Calcium Ppm
        created_at:
          format: date-time
          title: Created At
          type: string
        ec:
          anyOf:
          - type: number
          - type: 'null'
          title: Ec
        field_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Field Id
        id:
          title: Id
          type: string
        magnesium_ppm:
          anyOf:
          - type: number
          - type: 'null'
          title: Magnesium Ppm
        nitrogen_ppm:
          anyOf:
          - type: number
          - type: 'null'
          title: Nitrogen Ppm
        organic_matter:
          anyOf:
          - type: number
          - type: 'null'
          title: Organic Matter
        ph:
          anyOf:
          - type: number
          - type: 'null'
          title: Ph
        phosphorus_ppm:
          anyOf:
          - type: number
          - type: 'null'
          title: Phosphorus Ppm
        potassium_ppm:
          anyOf:
          - type: number
          - type: 'null'
          title: Potassium Ppm
        sample_date:
          format: date-time
          title: Sample Date
          type: string
        tenant_id:
          title: Tenant Id
          type: string
      required:
      - id
      - tenant_id
      - sample_date
      - created_at
      title: SoilTestRow
      type: object
    TrendRequest:
      properties:
        field_id:
          title: Field Id
          type: string
      required:
      - field_id
      title: TrendRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: Soil analysis and recommendations - تحليل التربة والتوصيات
  title: soil-analysis-service
  version: 16.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: Root endpoint - نقطة نهاية الجذر
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
  /api/v1/soil/crops/{crop}/requirements:
    get:
      description: Get nutrient requirements for a crop - الحصول على متطلبات المحصول من العناصر الغذائية
      operationId: get_crop_nutrient_requirements_api_v1_soil_crops__crop__requirements_get
      parameters:
      - in: path
        name: crop
        required: true
        schema:
          title: Crop
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Crop Nutrient Requirements
      tags:
      - soil-analysis
  /api/v1/soil/interpret:
    post:
      description: Interpret soil test results - تفسير نتائج تحليل التربة
      operationId: interpret_soil_test_api_v1_soil_interpret_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterpretRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Interpret Soil Test
      tags:
      - soil-analysis
  /api/v1/soil/interpretation/ec-status:
    post:
      description: Check soil EC/salinity status - فحص حالة ملوحة التربة
      operationId: check_ec_status_api_v1_soil_interpretation_ec_status_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EcStatusRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Check Ec Status
      tags:
      - soil-analysis
  /api/v1/soil/interpretation/nutrient-status:
    post:
      description: Check individual nutrient status - فحص حالة عنصر غذائي فردي
      operationId: check_nutrient_status_api_v1_soil_interpretation_nutrient_status_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NutrientStatusRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Check Nutrient Status
      tags:
      - soil-analysis
  /api/v1/soil/interpretation/ph-status:
    post:
      description: Check soil pH status - فحص حالة حموضة التربة
      operationId: check_ph_status_api_v1_soil_interpretation_ph_status_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhStatusRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Check Ph Status
      tags:
      - soil-analysis
  /api/v1/soil/products:
    get:
      description: List available fertilizer products - قائمة المنتجات السمادية المتاحة
      operationId: list_fertilizer_products_api_v1_soil_products_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Fertilizer Products
      tags:
      - soil-analysis
  /api/v1/soil/recommendations/amendment-plan:
    post:
      description: Generate soil amendment plan - إنشاء خطة تعديل التربة
      operationId: generate_amendment_plan_api_v1_soil_recommendations_amendment_plan_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendmentPlanRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Generate Amendment Plan
      tags:
      - soil-analysis
  /api/v1/soil/recommendations/calculate-rate:
    post:
      description: Calculate fertilizer application rate - حساب معدل تطبيق السماد
      operationId: calculate_rate_api_v1_soil_recommendations_calculate_rate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FertilizerRateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Calculate Rate
      tags:
      - soil-analysis
  /api/v1/soil/tests:
    get:
      description: 'List soil tests for the authenticated tenant across fields.


        Tenant isolation: the caller''s JWT `tenant_id` MUST equal the

        `tenantId` query parameter. Mismatch returns HTTP 403.


        Default ordering: `created_at DESC, id DESC`.

        Pagination: cursor-based on `(created_at, id)`.'
      operationId: list_soil_tests_api_v1_soil_tests_get
      parameters:
      - in: query
        name: tenantId
        required: true
        schema:
          title: Tenantid
          type: string
      - in: query
        name: fieldId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Fieldid
      - in: query
        name: fromDate
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Fromdate
      - in: query
        name: toDate
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Todate
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSoilTestsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List Soil Tests
      tags:
      - soil-analytics
    post:
      description: Create a new soil test record - إنشاء سجل تحليل تربة جديد
      operationId: create_soil_test_api_v1_soil_tests_post
      parameters:
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoilTestCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Soil Test
      tags:
      - soil-analysis
  /api/v1/soil/tests/field/{field_id}:
    get:
      description: Get all soil tests for a field - الحصول على جميع تحاليل التربة للحقل
      operationId: get_field_soil_tests_api_v1_soil_tests_field__field_id__get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Field Soil Tests
      tags:
      - soil-analysis
  /api/v1/soil/tests/{test_id}:
    delete:
      description: Delete soil test - حذف تحليل التربة
      operationId: delete_soil_test_api_v1_soil_tests__test_id__delete
      parameters:
      - in: path
        name: test_id
        required: true
        schema:
          title: Test Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Delete Soil Test
      tags:
      - soil-analysis
    get:
      description: Get soil test by ID - الحصول على تحليل التربة
      operationId: get_soil_test_api_v1_soil_tests__test_id__get
      parameters:
      - in: path
        name: test_id
        required: true
        schema:
          title: Test Id
          type: string
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Soil Test
      tags:
      - soil-analysis
  /api/v1/soil/trends:
    post:
      description: Analyze soil trends for a field - تحليل اتجاهات التربة للحقل
      operationId: analyze_soil_trends_api_v1_soil_trends_post
      parameters:
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrendRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Analyze Soil Trends
      tags:
      - soil-analysis
  /api/v1/soil/trends/compare-periods:
    post:
      description: Compare soil health between two periods - مقارنة صحة التربة بين فترتين
      operationId: compare_periods_api_v1_soil_trends_compare_periods_post
      parameters:
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodCompareRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Compare Periods
      tags:
      - soil-analysis
  /api/v1/soil/trends/nutrient:
    post:
      description: Get trend for a specific nutrient - الحصول على اتجاه عنصر غذائي محدد
      operationId: get_single_nutrient_trend_api_v1_soil_trends_nutrient_post
      parameters:
      - in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NutrientTrendRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Single Nutrient Trend
      tags:
      - soil-analysis
  /health:
    get:
      description: Comprehensive health check - فحص صحي شامل
      operationId: comprehensive_health_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Comprehensive Health
  /healthz:
    get:
      description: Liveness probe - فحص الحياة
      operationId: health_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /metrics:
    get:
      description: Prometheus metrics endpoint
      operationId: metrics_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Metrics
  /readyz:
    get:
      description: Readiness probe - فحص الجاهزية
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
