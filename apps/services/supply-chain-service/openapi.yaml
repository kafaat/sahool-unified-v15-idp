components:
  schemas:
    AutoPurchaseRequest:
      description: Auto-purchase request from recommendation.
      properties:
        delivery_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Delivery Address
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
          default: cash_on_delivery
        recommendation_id:
          format: uuid
          title: Recommendation Id
          type: string
        supplier_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Supplier Id
      required:
      - recommendation_id
      title: AutoPurchaseRequest
      type: object
    BulkPurchaseItem:
      description: Bulk purchase item.
      properties:
        product_id:
          format: uuid
          title: Product Id
          type: string
        quantity:
          exclusiveMinimum: 0.0
          title: Quantity
          type: number
        supplier_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Supplier Id
      required:
      - product_id
      - quantity
      title: BulkPurchaseItem
      type: object
    BulkPurchaseRequest:
      description: Bulk purchase request.
      properties:
        delivery_address:
          title: Delivery Address
          type: string
        items:
          items:
            $ref: '#/components/schemas/BulkPurchaseItem'
          minItems: 1
          title: Items
          type: array
        optimize_for:
          default: price
          pattern: ^(price|delivery|rating)$
          title: Optimize For
          type: string
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
          default: cash_on_delivery
      required:
      - items
      - delivery_address
      title: BulkPurchaseRequest
      type: object
    BulkPurchaseResult:
      description: Bulk purchase result.
      properties:
        estimated_savings:
          title: Estimated Savings
          type: number
        optimization_applied:
          title: Optimization Applied
          type: string
        orders:
          items:
            $ref: '#/components/schemas/Order'
          title: Orders
          type: array
        total_cost:
          title: Total Cost
          type: number
      required:
      - orders
      - total_cost
      - estimated_savings
      - optimization_applied
      title: BulkPurchaseResult
      type: object
    DeliveryStatus:
      description: Delivery status schema.
      properties:
        current_location:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Location
        current_location_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Location Ar
        driver_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Driver Name
        driver_phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Driver Phone
        eta:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Eta
        last_update:
          format: date-time
          title: Last Update
          type: string
        order_id:
          format: uuid
          title: Order Id
          type: string
        status:
          $ref: '#/components/schemas/DeliveryStatusEnum'
        status_ar:
          title: Status Ar
          type: string
        tracking_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Tracking Url
      required:
      - order_id
      - status
      - status_ar
      title: DeliveryStatus
      type: object
    DeliveryStatusEnum:
      description: Delivery status enumeration.
      enum:
      - preparing
      - picked_up
      - in_transit
      - out_for_delivery
      - delivered
      - failed
      title: DeliveryStatusEnum
      type: string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    Order:
      description: Order schema.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        delivery_address:
          title: Delivery Address
          type: string
        delivery_address_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Delivery Address Ar
        delivery_fee:
          default: 0
          minimum: 0.0
          title: Delivery Fee
          type: number
        estimated_delivery:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Estimated Delivery
        farmer_id:
          format: uuid
          title: Farmer Id
          type: string
        id:
          format: uuid
          title: Id
          type: string
        items:
          items:
            $ref: '#/components/schemas/OrderItem'
          title: Items
          type: array
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        notes_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes Ar
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        payment_status:
          default: pending
          title: Payment Status
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
          default: pending
        subtotal:
          minimum: 0.0
          title: Subtotal
          type: number
        supplier_id:
          format: uuid
          title: Supplier Id
          type: string
        supplier_name:
          title: Supplier Name
          type: string
        supplier_name_ar:
          title: Supplier Name Ar
          type: string
        tax:
          default: 0
          minimum: 0.0
          title: Tax
          type: number
        total:
          minimum: 0.0
          title: Total
          type: number
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - farmer_id
      - supplier_id
      - supplier_name
      - supplier_name_ar
      - items
      - subtotal
      - total
      - delivery_address
      - payment_method
      title: Order
      type: object
    OrderCreate:
      description: Order creation schema.
      properties:
        delivery_address:
          minLength: 5
          title: Delivery Address
          type: string
        delivery_address_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Delivery Address Ar
        items:
          items:
            $ref: '#/components/schemas/OrderItemCreate'
          minItems: 1
          title: Items
          type: array
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        notes_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes Ar
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
          default: cash_on_delivery
        supplier_id:
          format: uuid
          title: Supplier Id
          type: string
      required:
      - supplier_id
      - items
      - delivery_address
      title: OrderCreate
      type: object
    OrderItem:
      description: Order item schema.
      properties:
        product_id:
          format: uuid
          title: Product Id
          type: string
        product_name:
          title: Product Name
          type: string
        product_name_ar:
          title: Product Name Ar
          type: string
        quantity:
          exclusiveMinimum: 0.0
          title: Quantity
          type: number
        total_price:
          minimum: 0.0
          title: Total Price
          type: number
        unit:
          title: Unit
          type: string
        unit_price:
          minimum: 0.0
          title: Unit Price
          type: number
      required:
      - product_id
      - product_name
      - product_name_ar
      - quantity
      - unit
      - unit_price
      - total_price
      title: OrderItem
      type: object
    OrderItemCreate:
      description: Order item creation schema.
      properties:
        product_id:
          format: uuid
          title: Product Id
          type: string
        quantity:
          exclusiveMinimum: 0.0
          title: Quantity
          type: number
      required:
      - product_id
      - quantity
      title: OrderItemCreate
      type: object
    OrderListResponse:
      description: Order list response.
      properties:
        items:
          items:
            $ref: '#/components/schemas/Order'
          title: Items
          type: array
        page:
          title: Page
          type: integer
        page_size:
          title: Page Size
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      title: OrderListResponse
      type: object
    OrderStatus:
      description: Order status enumeration.
      enum:
      - pending
      - confirmed
      - processing
      - shipped
      - delivered
      - cancelled
      title: OrderStatus
      type: string
    PaymentMethod:
      description: Payment method enumeration.
      enum:
      - cash_on_delivery
      - credit_card
      - bank_transfer
      - digital_wallet
      title: PaymentMethod
      type: string
    Product:
      description: Product schema.
      properties:
        category:
          $ref: '#/components/schemas/ProductCategory'
        created_at:
          format: date-time
          title: Created At
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Description Ar
        id:
          format: uuid
          title: Id
          type: string
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        is_available:
          default: true
          title: Is Available
          type: boolean
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
        name_ar:
          maxLength: 200
          minLength: 1
          title: Name Ar
          type: string
        price_max:
          description: Maximum price in SAR
          minimum: 0.0
          title: Price Max
          type: number
        price_min:
          description: Minimum price in SAR
          minimum: 0.0
          title: Price Min
          type: number
        unit:
          description: Unit of measurement (kg, L, pcs)
          title: Unit
          type: string
        unit_ar:
          description: وحدة القياس
          title: Unit Ar
          type: string
      required:
      - id
      - name
      - name_ar
      - category
      - unit
      - unit_ar
      - price_min
      - price_max
      title: Product
      type: object
    ProductCategory:
      description: Product category enumeration.
      enum:
      - seeds
      - fertilizers
      - pesticides
      - herbicides
      - equipment
      - irrigation
      - tools
      - other
      title: ProductCategory
      type: string
    ProductListResponse:
      description: Product list response.
      properties:
        items:
          items:
            $ref: '#/components/schemas/Product'
          title: Items
          type: array
        page:
          title: Page
          type: integer
        page_size:
          title: Page Size
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      title: ProductListResponse
      type: object
    QuoteRequest:
      description: Request for quote from supplier.
      properties:
        delivery_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Delivery Address
        product_id:
          format: uuid
          title: Product Id
          type: string
        quantity:
          exclusiveMinimum: 0.0
          title: Quantity
          type: number
      required:
      - product_id
      - quantity
      title: QuoteRequest
      type: object
    Supplier:
      description: Supplier schema.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        delivery_time_days:
          description: Average delivery time in days
          minimum: 1
          title: Delivery Time Days
          type: integer
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        id:
          format: uuid
          title: Id
          type: string
        is_active:
          default: true
          title: Is Active
          type: boolean
        is_verified:
          default: false
          title: Is Verified
          type: boolean
        latitude:
          maximum: 90.0
          minimum: -90.0
          title: Latitude
          type: number
        location:
          title: Location
          type: string
        location_ar:
          title: Location Ar
          type: string
        longitude:
          maximum: 180.0
          minimum: -180.0
          title: Longitude
          type: number
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
        name_ar:
          maxLength: 200
          minLength: 1
          title: Name Ar
          type: string
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        products:
          items:
            format: uuid
            type: string
          title: Products
          type: array
        rating:
          description: Supplier rating (0-5)
          maximum: 5.0
          minimum: 0.0
          title: Rating
          type: number
        total_reviews:
          default: 0
          minimum: 0
          title: Total Reviews
          type: integer
      required:
      - id
      - name
      - name_ar
      - location
      - location_ar
      - latitude
      - longitude
      - rating
      - delivery_time_days
      title: Supplier
      type: object
    SupplierComparison:
      description: Supplier comparison for a product.
      properties:
        best_price_supplier_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Best Price Supplier Id
        best_rated_supplier_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Best Rated Supplier Id
        fastest_delivery_supplier_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Fastest Delivery Supplier Id
        product_id:
          format: uuid
          title: Product Id
          type: string
        product_name:
          title: Product Name
          type: string
        product_name_ar:
          title: Product Name Ar
          type: string
        quantity:
          title: Quantity
          type: number
        quotes:
          items:
            $ref: '#/components/schemas/SupplierQuote'
          title: Quotes
          type: array
      required:
      - product_id
      - product_name
      - product_name_ar
      - quantity
      - quotes
      title: SupplierComparison
      type: object
    SupplierListResponse:
      description: Supplier list response.
      properties:
        items:
          items:
            $ref: '#/components/schemas/Supplier'
          title: Items
          type: array
        page:
          title: Page
          type: integer
        page_size:
          title: Page Size
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      title: SupplierListResponse
      type: object
    SupplierQuote:
      description: Quote from a supplier for a product.
      properties:
        availability:
          pattern: ^(in_stock|limited|out_of_stock|pre_order)$
          title: Availability
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        delivery_days:
          minimum: 1
          title: Delivery Days
          type: integer
        id:
          format: uuid
          title: Id
          type: string
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        notes_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes Ar
        product_id:
          format: uuid
          title: Product Id
          type: string
        product_name:
          title: Product Name
          type: string
        product_name_ar:
          title: Product Name Ar
          type: string
        quantity:
          title: Quantity
          type: number
        supplier_id:
          format: uuid
          title: Supplier Id
          type: string
        supplier_name:
          title: Supplier Name
          type: string
        supplier_name_ar:
          title: Supplier Name Ar
          type: string
        total_price:
          description: Total price in SAR
          minimum: 0.0
          title: Total Price
          type: number
        unit_price:
          description: Price per unit in SAR
          minimum: 0.0
          title: Unit Price
          type: number
        valid_until:
          format: date-time
          title: Valid Until
          type: string
      required:
      - id
      - supplier_id
      - supplier_name
      - supplier_name_ar
      - product_id
      - product_name
      - product_name_ar
      - quantity
      - unit_price
      - total_price
      - delivery_days
      - availability
      - valid_until
      title: SupplierQuote
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: "\n## Supply Chain Service\n\nConnects farmers to agricultural suppliers for auto-purchasing based on advisory recommendations.\n\n### Features | الميزات\n\n- **Product Catalog** | كتالوج المنتجات: Browse agricultural supplies\n- **Supplier Management** | إدارة الموردين: Find and compare suppliers\n- **Order Management** | إدارة الطلبات: Create and track orders\n- **Auto-Purchase** | الشراء التلقائي: Automatic purchasing from recommendations\n- **Delivery Tracking** | تتبع التوصيل: Real-time delivery tracking\n\n### API Endpoints | نقاط الوصول\n\n- `/api/v1/products` - Product catalog operations\n- `/api/v1/suppliers` - Supplier management\n- `/api/v1/orders` - Order management\n- `/api/v1/auto-purchase` - Auto-purchase features\n\n---\n\n## خدمة سلسلة التوريد\n\nتربط المزارعين بموردي المستلزمات الزراعية للشراء التلقائي بناءً على التوصيات الاستشارية.\n    "
  title: Supply Chain Service | خدمة سلسلة التوريد
  version: 16.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: Root endpoint with service information.
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Root  Get
                type: object
          description: Successful Response
      summary: Service Info | معلومات الخدمة
      tags:
      - root
  /api/v1/auto-purchase:
    post:
      description: Automatically create an order based on an advisory recommendation. إنشاء طلب تلقائياً بناءً على توصية استشارية.
      operationId: auto_purchase_api_v1_auto_purchase_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoPurchaseRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Auto-Purchase from Recommendation | الشراء التلقائي من التوصية
      tags:
      - auto-purchase
  /api/v1/auto-purchase/bulk:
    post:
      description: Purchase multiple items at once with optimization. شراء عناصر متعددة مرة واحدة مع التحسين.
      operationId: bulk_purchase_api_v1_auto_purchase_bulk_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkPurchaseRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkPurchaseResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Bulk Purchase | شراء بالجملة
      tags:
      - auto-purchase
  /api/v1/auto-purchase/compare:
    post:
      description: Compare quotes from multiple suppliers for a product. مقارنة عروض الأسعار من موردين متعددين لمنتج.
      operationId: compare_suppliers_api_v1_auto_purchase_compare_post
      parameters:
      - in: query
        name: product_id
        required: true
        schema:
          format: uuid
          title: Product Id
          type: string
      - in: query
        name: quantity
        required: true
        schema:
          title: Quantity
          type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierComparison'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Compare Suppliers | مقارنة الموردين
      tags:
      - auto-purchase
  /api/v1/orders:
    get:
      description: Get a list of the farmer's orders. الحصول على قائمة طلبات المزارع.
      operationId: list_orders_api_v1_orders_get
      parameters:
      - description: Filter by status
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OrderStatus'
          - type: 'null'
          description: Filter by status
          title: Status
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List Orders | قائمة الطلبات
      tags:
      - orders
    post:
      description: Create a new order from a supplier. إنشاء طلب جديد من مورد.
      operationId: create_order_api_v1_orders_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Order | إنشاء طلب
      tags:
      - orders
  /api/v1/orders/{order_id}:
    get:
      description: Get details of a specific order. الحصول على تفاصيل طلب محدد.
      operationId: get_order_api_v1_orders__order_id__get
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          format: uuid
          title: Order Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Order | الحصول على طلب
      tags:
      - orders
  /api/v1/orders/{order_id}/cancel:
    post:
      description: Cancel a pending order. إلغاء طلب قيد الانتظار.
      operationId: cancel_order_api_v1_orders__order_id__cancel_post
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          format: uuid
          title: Order Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Cancel Order | إلغاء الطلب
