components:
  schemas:
    AspectAnalysisResponse:
      description: 'Aspect analysis response | استجابة تحليل الجانب


        Returns sun-facing direction (0-360 degrees, 0=North, clockwise)

        computed from the DEM for the field. Contract endpoint:

        GET /api/v1/terrain/aspect/{field_id}'
      properties:
        analyzed_at:
          description: Analysis timestamp | وقت التحليل
          format: date-time
          title: Analyzed At
          type: string
        aspect:
          $ref: '#/components/schemas/AspectResult'
        dem_source:
          $ref: '#/components/schemas/DEMSourceType'
          description: DEM source used | مصدر الارتفاعات
        field_id:
          description: Field identifier | معرف الحقل
          title: Field Id
          type: string
        processing_time_ms:
          description: Processing time (ms) | وقت المعالجة (ملي ثانية)
          title: Processing Time Ms
          type: integer
      required:
      - field_id
      - analyzed_at
      - dem_source
      - aspect
      - processing_time_ms
      title: AspectAnalysisResponse
      type: object
    AspectClassification:
      description: Aspect cardinal directions | اتجاهات الجوانب الأصلية
      enum:
      - flat
      - north
      - northeast
      - east
      - southeast
      - south
      - southwest
      - west
      - northwest
      title: AspectClassification
      type: string
    AspectResult:
      description: Aspect analysis result | نتيجة تحليل الجانب
      properties:
        distribution:
          additionalProperties:
            type: number
          description: Aspect distribution by direction | توزيع الجوانب حسب الاتجاه
          title: Distribution
          type: object
        dominant_direction:
          $ref: '#/components/schemas/AspectClassification'
          description: Dominant aspect direction | الاتجاه السائد
        dominant_direction_name:
          $ref: '#/components/schemas/BilingualField'
          description: Dominant direction name | اسم الاتجاه السائد
        mean_aspect_degrees:
          description: Mean aspect in degrees | متوسط الجانب بالدرجات
          title: Mean Aspect Degrees
          type: number
        raster_url:
          anyOf:
          - type: string
          - type: 'null'
          description: URL to aspect raster | رابط خريطة الجانب
          title: Raster Url
      required:
      - dominant_direction
      - dominant_direction_name
      - distribution
      - mean_aspect_degrees
      title: AspectResult
      type: object
    BilingualField:
      description: Bilingual field with Arabic and English values | حقل ثنائي اللغة
      properties:
        ar:
          description: Arabic value | القيمة بالعربية
          title: Ar
          type: string
        en:
          description: English value | القيمة بالإنجليزية
          title: En
          type: string
      required:
      - en
      - ar
      title: BilingualField
      type: object
    BoundingBox:
      description: Geographic bounding box | المربع المحيط
      properties:
        max_lat:
          description: Maximum latitude
          maximum: 90.0
          minimum: -90.0
          title: Max Lat
          type: number
        max_lon:
          description: Maximum longitude
          maximum: 180.0
          minimum: -180.0
          title: Max Lon
          type: number
        min_lat:
          description: Minimum latitude
          maximum: 90.0
          minimum: -90.0
          title: Min Lat
          type: number
        min_lon:
          description: Minimum longitude
          maximum: 180.0
          minimum: -180.0
          title: Min Lon
          type: number
      required:
      - min_lon
      - min_lat
      - max_lon
      - max_lat
      title: BoundingBox
      type: object
    CombinedErosionAssessmentRequest:
      description: 'Inputs for a combined water (RUSLE) + wind (RWEQ-lite) erosion

        assessment. Every field from :class:`ErosionAssessmentRequest` and

        :class:`WindErosionAssessmentRequest` is present here.


        مدخلات تقييم التعرية المشترك (تعرية المياه + تعرية الرياح).


        ``texture_key`` is optional: when omitted, the engine derives it

        from the RUSLE ``soil_texture`` USDA class. Pass an explicit key

        to use a Yemen-specific soil profile (e.g. ``tihama_sandy_loam``)

        that the USDA class doesn''t represent.'
      properties:
        annual_et0_mm:
          description: Annual reference evapotranspiration total (mm) | إجمالي التبخر النتح المرجعي
          maximum: 5000.0
          minimum: 100.0
          title: Annual Et0 Mm
          type: number
        annual_rainfall_mm:
          description: Mean annual precipitation (mm) | الهطول السنوي
          maximum: 5000.0
          minimum: 0.0
          title: Annual Rainfall Mm
          type: number
        canopy_cover_pct:
          default: 0.0
          description: Active canopy cover (%) | نسبة تغطية المظلة
          maximum: 100.0
          minimum: 0.0
          title: Canopy Cover Pct
          type: number
        conservation_practice:
          default: none
          description: Support practice (none, contour_farming, bench_terraces, ...) | ممارسة الحفاظ
          maxLength: 64
          title: Conservation Practice
          type: string
        cover_type:
          default: bare_soil
          description: Crop / cover class (bare_soil, wheat, date_palm, ...) | نوع الغطاء النباتي
          maxLength: 64
          title: Cover Type
          type: string
        field_id:
          description: Field identifier | معرف الحقل
          maxLength: 100
          minLength: 1
          title: Field Id
          type: string
        mean_wind_speed_ms:
          description: Mean wind speed (m/s) — use peak-month mean | متوسط سرعة الرياح
          maximum: 50.0
          minimum: 0.0
          title: Mean Wind Speed Ms
          type: number
        rainy_days_per_year:
          description: Mean rainy days per year | عدد الأيام الممطرة سنوياً
          maximum: 365
          minimum: 0
          title: Rainy Days Per Year
          type: integer
        residue_cover_pct:
          default: 0.0
          description: Flat/standing residue cover (%) | نسبة تغطية البقايا
          maximum: 100.0
          minimum: 0.0
          title: Residue Cover Pct
          type: number
        residue_state:
          $ref: '#/components/schemas/ResidueStateEnum'
          default: bare
          description: Crop residue state after harvest | حالة بقايا المحصول
        roughness:
          $ref: '#/components/schemas/SurfaceRoughnessEnum'
          default: medium
          description: Chepil surface roughness class | فئة خشونة السطح
        slope_length_m:
          anyOf:
          - maximum: 1000.0
            minimum: 1.0
            type: number
          - type: 'null'
          description: Slope length in metres (default 22.13, the RUSLE reference) | طول الميل (م)
          title: Slope Length M
        slope_pct:
          description: Mean slope percentage (0-200) | متوسط نسبة الميل
          maximum: 200.0
          minimum: 0.0
          title: Slope Pct
          type: number
        soil_texture:
          $ref: '#/components/schemas/SoilTextureEnum'
          description: USDA soil texture class — drives the RUSLE K factor | فئة قوام التربة
        tenant_id:
          description: Tenant identifier | معرف المستأجر
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
        texture_key:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          description: Optional Yemen-specific texture key (e.g. tihama_sandy_loam). If omitted, derived from the RUSLE soil_texture. | مفتاح قوام تربة يمني اختياري، يُشتق من soil_texture إذا لم يُحدد
          title: Texture Key
        unsheltered_length_m:
          default: 100.0
          description: Unsheltered field length along prevailing wind (m) | طول الحقل غير المحمي
          maximum: 5000.0
          minimum: 1.0
          title: Unsheltered Length M
          type: number
      required:
      - field_id
      - tenant_id
      - slope_pct
      - soil_texture
      - annual_rainfall_mm
      - rainy_days_per_year
      - mean_wind_speed_ms
      - annual_et0_mm
      title: CombinedErosionAssessmentRequest
      type: object
    CombinedErosionAssessmentResponse:
      description: 'Unified water (RUSLE) + wind (RWEQ-lite) erosion assessment.


        مخرجات التقييم المشترك لتعرية التربة (مياه + رياح).


        The ``overall_risk_level`` is the *worst* of the two sub-results

        (the FAO band with the highest ordinal). ``dominant_process``

        surfaces which engine is driving that worst-case, so operators can

        prioritise actions accordingly. Both sub-results are preserved in

        the ``water`` and ``wind`` fields so callers that care about the

        per-process breakdown can introspect them.'
      properties:
        assessed_at:
          description: Assessment timestamp
          format: date-time
          title: Assessed At
          type: string
        combined_recommendations:
          description: Priority-ordered mitigation actions across both processes (English)
          items:
            type: string
          title: Combined Recommendations
          type: array
        combined_recommendations_ar:
          description: خطوات التخفيف مرتبة حسب الأولوية لكلا العمليتين (عربي)
          items:
            type: string
          title: Combined Recommendations Ar
          type: array
        dominant_process:
          $ref: '#/components/schemas/DominantProcessEnum'
          description: Which erosion process dominates the risk | العملية المسيطرة
        field_id:
          title: Field Id
          type: string
        overall_risk_level:
          $ref: '#/components/schemas/ErosionRiskLevelEnum'
          description: Worst-of-two FAO risk band | أعلى مستوى خطر
        overall_risk_level_ar:
          description: Arabic label for the overall risk band
          title: Overall Risk Level Ar
          type: string
        tenant_id:
          title: Tenant Id
          type: string
        water:
          $ref: '#/components/schemas/ErosionAssessmentResponse'
          description: Full RUSLE (water) sub-result | نتيجة تعرية المياه
        wind:
          $ref: '#/components/schemas/WindErosionAssessmentResponse'
          description: Full RWEQ-lite (wind) sub-result | نتيجة تعرية الرياح
      required:
      - field_id
      - tenant_id
      - overall_risk_level
      - overall_risk_level_ar
      - dominant_process
      - water
      - wind
      - assessed_at
      title: CombinedErosionAssessmentResponse
      type: object
    ContourAnalysisResponse:
      description: Contour analysis response | استجابة تحليل الكنتور
      properties:
        analyzed_at:
          format: date-time
          title: Analyzed At
          type: string
        contours:
          $ref: '#/components/schemas/ContourResult'
        dem_source:
          $ref: '#/components/schemas/DEMSourceType'
        field_id:
          title: Field Id
          type: string
        processing_time_ms:
          title: Processing Time Ms
          type: integer
      required:
      - field_id
      - analyzed_at
      - dem_source
      - contours
      - processing_time_ms
      title: ContourAnalysisResponse
      type: object
    ContourLine:
      description: Single contour line | خط كنتور واحد
      properties:
        elevation_m:
          description: Elevation in meters | الارتفاع بالأمتار
          title: Elevation M
          type: number
        geometry:
          anyOf:
          - $ref: '#/components/schemas/GeoJSONLineString'
          - $ref: '#/components/schemas/GeoJSONMultiLineString'
          description: LineString or MultiLineString GeoJSON geometry | هندسة الخط
          title: Geometry
        is_major:
          default: false
          description: Is major contour | خط كنتور رئيسي
          title: Is Major
          type: boolean
        length_m:
          description: Length in meters | الطول بالأمتار
          title: Length M
          type: number
      required:
      - elevation_m
      - length_m
      - geometry
      title: ContourLine
      type: object
    ContourResult:
      description: Contour generation result | نتيجة إنشاء خطوط الكنتور
      properties:
        contours:
          description: Contour lines | خطوط الكنتور
          items:
            $ref: '#/components/schemas/ContourLine'
          title: Contours
          type: array
        geojson_url:
          anyOf:
          - type: string
          - type: 'null'
          description: URL to contours GeoJSON | رابط ملف GeoJSON
          title: Geojson Url
        interval_m:
          description: Contour interval | فترة الكنتور
          title: Interval M
          type: number
        major_interval_m:
          description: Major contour interval | فترة الكنتور الرئيسي
          title: Major Interval M
          type: number
        max_elevation_m:
          description: Maximum elevation | أقصى ارتفاع
          title: Max Elevation M
          type: number
        min_elevation_m:
          description: Minimum elevation | أدنى ارتفاع
          title: Min Elevation M
          type: number
        total_contours:
          description: Total contour lines | إجمالي خطوط الكنتور
          title: Total Contours
          type: integer
      required:
      - interval_m
      - min_elevation_m
      - max_elevation_m
      - total_contours
      - major_interval_m
      title: ContourResult
      type: object
    CurvatureResult:
      description: Curvature analysis result | نتيجة تحليل الانحناء
      properties:
        concave_pct:
          description: Concave area percentage | نسبة المنطقة المقعرة
          title: Concave Pct
          type: number
        convex_pct:
          description: Convex area percentage | نسبة المنطقة المحدبة
          title: Convex Pct
          type: number
        curvature_type:
          $ref: '#/components/schemas/CurvatureType'
          description: Curvature type | نوع الانحناء
        flat_pct:
          description: Flat area percentage | نسبة المنطقة المسطحة
          title: Flat Pct
          type: number
        max_curvature:
          description: Maximum curvature | أقصى انحناء
          title: Max Curvature
          type: number
        mean_curvature:
          description: Mean curvature | متوسط الانحناء
          title: Mean Curvature
          type: number
        min_curvature:
          description: Minimum curvature | أدنى انحناء
          title: Min Curvature
          type: number
        raster_url:
          anyOf:
          - type: string
          - type: 'null'
          description: URL to curvature raster | رابط خريطة الانحناء
          title: Raster Url
        type_name:
          $ref: '#/components/schemas/BilingualField'
          description: Type name | اسم النوع
      required:
      - curvature_type
      - type_name
      - min_curvature
      - max_curvature
      - mean_curvature
      - convex_pct
      - concave_pct
      - flat_pct
      title: CurvatureResult
      type: object
    CurvatureType:
      description: Curvature calculation types | أنواع حساب الانحناء
      enum:
      - plan
      - profile
      - total
      title: CurvatureType
      type: string
    DEMDataBounds:
      description: DEM data bounds | حدود بيانات الارتفاعات
      properties:
        max_lat:
          description: Maximum latitude | خط العرض الأقصى
          title: Max Lat
          type: number
        max_lon:
          description: Maximum longitude | خط الطول الأقصى
          title: Max Lon
          type: number
        min_lat:
          description: Minimum latitude | خط العرض الأدنى
          title: Min Lat
          type: number
        min_lon:
          description: Minimum longitude | خط الطول الأدنى
          title: Min Lon
          type: number
      required:
      - min_lon
      - min_lat
      - max_lon
      - max_lat
      title: DEMDataBounds
      type: object
    DEMDataResponse:
      description: Response containing DEM data for downstream services | استجابة بيانات الارتفاعات للخدمات المتصلة
      properties:
        analyzed_at:
          description: Analysis timestamp | وقت التحليل
          format: date-time
          title: Analyzed At
          type: string
        bounds:
          $ref: '#/components/schemas/DEMDataBounds'
          description: Data bounds | حدود البيانات
        cols:
          description: Number of columns | عدد الأعمدة
          title: Cols
          type: integer
        crs:
          description: Coordinate reference system | نظام الإحداثيات
          title: Crs
          type: string
        dem_source:
          $ref: '#/components/schemas/DEMSourceType'
          description: DEM source used | مصدر الارتفاعات المستخدم
        download_url:
          anyOf:
          - type: string
          - type: 'null'
          description: URL to download full DEM data | رابط تنزيل البيانات الكاملة
          title: Download Url
        elevation_data:
          anyOf:
          - items:
              items:
                type: number
              type: array
            type: array
          - type: 'null'
          description: Elevation data array (optional, for small fields) | مصفوفة الارتفاعات
          title: Elevation Data
        elevation_max:
          description: Maximum elevation (m) | أقصى ارتفاع (م)
          title: Elevation Max
          type: number
        elevation_mean:
          description: Mean elevation (m) | متوسط الارتفاع (م)
          title: Elevation Mean
          type: number
        elevation_min:
          description: Minimum elevation (m) | أدنى ارتفاع (م)
          title: Elevation Min
          type: number
        field_id:
          description: Field identifier | معرف الحقل
          title: Field Id
          type: string
        nodata_value:
          description: NoData value | قيمة عدم وجود بيانات
          title: Nodata Value
          type: number
        resolution_m:
          description: Resolution in meters | الدقة بالمتر
          title: Resolution M
          type: number
        rows:
          description: Number of rows | عدد الصفوف
          title: Rows
          type: integer
      required:
      - field_id
      - dem_source
      - bounds
      - resolution_m
      - rows
      - cols
      - crs
      - nodata_value
      - elevation_min
      - elevation_max
      - elevation_mean
      - analyzed_at
      title: DEMDataResponse
      type: object
    DEMMetadata:
      description: DEM file metadata | بيانات ملف الارتفاعات الوصفية
      properties:
        acquisition_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Data acquisition date | تاريخ الحصول على البيانات
          title: Acquisition Date
        bounds:
          $ref: '#/components/schemas/BoundingBox'
          description: Data bounds | حدود البيانات
        crs:
          description: Coordinate Reference System
          title: Crs
          type: string
        nodata_value:
          default: -9999.0
          description: NoData value | قيمة عدم وجود بيانات
          title: Nodata Value
          type: number
        resolution_m:
          description: Resolution in meters | الدقة بالأمتار
          exclusiveMinimum: 0.0
          title: Resolution M
          type: number
        source:
          $ref: '#/components/schemas/DEMSourceType'
          description: DEM source | مصدر الارتفاعات
        source_name:
          $ref: '#/components/schemas/BilingualField'
          description: Source name bilingual | اسم المصدر ثنائي اللغة
        vertical_datum:
          default: EGM96
          description: Vertical datum | المرجع الرأسي
          title: Vertical Datum
          type: string
      required:
      - source
      - source_name
      - resolution_m
      - crs
      - bounds
      title: DEMMetadata
      type: object
    DEMSourceInfo:
      description: DEM source information | معلومات مصدر الارتفاعات
      properties:
        coverage:
          description: Geographic coverage | التغطية الجغرافية
          title: Coverage
          type: string
        description:
          description: Source description | وصف المصدر
          title: Description
          type: string
        description_ar:
          description: Arabic description | الوصف بالعربية
          title: Description Ar
          type: string
        is_available:
          default: true
          description: Is source available | هل المصدر متاح
          title: Is Available
          type: boolean
        name:
          description: Source name | اسم المصدر
          title: Name
          type: string
        name_ar:
          description: Arabic source name | اسم المصدر بالعربية
          title: Name Ar
          type: string
        resolution_m:
          description: Resolution in meters | الدقة بالأمتار
          title: Resolution M
          type: number
        source:
          $ref: '#/components/schemas/DEMSourceType'
          description: Source type | نوع المصدر
      required:
      - source
      - name
      - name_ar
      - description
      - description_ar
      - resolution_m
      - coverage
      title: DEMSourceInfo
      type: object
    DEMSourceType:
      description: DEM data source types | أنواع مصادر بيانات الارتفاعات
      enum:
      - copernicus
      - srtm
      - alos_palsar
      - local
      title: DEMSourceType
      type: string
    DEMSourcesResponse:
      description: Response for listing DEM sources | استجابة قائمة مصادر الارتفاعات
      properties:
        default:
          description: Default source | المصدر الافتراضي
          title: Default
          type: string
        default_name:
          $ref: '#/components/schemas/BilingualField'
          description: Default source name | اسم المصدر الافتراضي
        sources:
          description: Available DEM sources | مصادر الارتفاعات المتاحة
          items:
            $ref: '#/components/schemas/DEMSourceInfo'
          title: Sources
          type: array
      required:
      - sources
      - default
      - default_name
      title: DEMSourcesResponse
      type: object
    DEMStatistics:
      description: DEM statistical summary | ملخص إحصائي للارتفاعات
      properties:
        elevation_range_m:
          description: Elevation range | نطاق الارتفاع
          title: Elevation Range M
          type: number
        max_elevation_m:
          description: Maximum elevation | أقصى ارتفاع
          title: Max Elevation M
          type: number
        mean_elevation_m:
          description: Mean elevation | متوسط الارتفاع
          title: Mean Elevation M
          type: number
        min_elevation_m:
          description: Minimum elevation | أدنى ارتفاع
          title: Min Elevation M
          type: number
        std_elevation_m:
          description: Standard deviation | الانحراف المعياري
          title: Std Elevation M
          type: number
        total_pixels:
          description: Total pixels | إجمالي البكسلات
          title: Total Pixels
          type: integer
        valid_pixels:
          description: Valid pixels | البكسلات الصالحة
          title: Valid Pixels
          type: integer
      required:
      - min_elevation_m
      - max_elevation_m
      - mean_elevation_m
      - std_elevation_m
      - elevation_range_m
      - total_pixels
      - valid_pixels
      title: DEMStatistics
      type: object
    DominantProcessEnum:
      description: 'Which erosion process dominates a field''s combined risk.

        العملية المسيطرة على الخطر المشترك لتعرية الحقل.'
      enum:
      - water
      - wind
      - both
      - none
      title: DominantProcessEnum
      type: string
    ErosionAssessmentRequest:
      description: 'Inputs for a RUSLE (Revised Universal Soil Loss Equation) assessment.


        Every factor is an aggregated per-field value. For sub-field

        variability, call this endpoint once per zone and compose the

        results on the caller side.'
      properties:
        annual_rainfall_mm:
          description: Mean annual precipitation (mm)
          maximum: 5000.0
          minimum: 0.0
          title: Annual Rainfall Mm
          type: number
        conservation_practice:
          default: none
          description: Support practice (none, contour_farming, strip_cropping, terraces, bench_terraces)
          maxLength: 64
          title: Conservation Practice
          type: string
        cover_type:
          default: bare_soil
          description: Crop / cover class (bare_soil, fallow, wheat, barley, corn, date_palm, olive, citrus, grass, forest, ...)
          maxLength: 64
          title: Cover Type
          type: string
        field_id:
          description: Field identifier
          maxLength: 100
          minLength: 1
          title: Field Id
          type: string
        rainy_days_per_year:
          description: Mean rainy days per year
          maximum: 365
          minimum: 0
          title: Rainy Days Per Year
          type: integer
        slope_length_m:
          anyOf:
          - maximum: 1000.0
            minimum: 1.0
            type: number
          - type: 'null'
          description: Slope length in metres (default 22.13, the RUSLE reference)
          title: Slope Length M
        slope_pct:
