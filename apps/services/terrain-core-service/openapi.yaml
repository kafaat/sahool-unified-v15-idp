openapi: 3.1.0
info:
  title: SAHOOL Terrain Core Service | خدمة تحليل التضاريس
  description: "\n## Terrain Analysis Service for Agricultural Applications\nخدمة تحليل التضاريس للتطبيقات الزراعية\n\nProvides comprehensive terrain analysis from Digital Elevation Models (DEMs):\n\n### DEM Sources | مصادر بيانات الارتفاعات\n- **Copernicus DEM** (30m/90m) - Global coverage\n- **NASA SRTM** (30m/90m) - 60°N to 56°S\n- **ALOS World 3D** (30m) - Global coverage\n- **Local Upload** - User-provided GeoTIFF files\n\n### Terrain Indicators | مؤشرات التضاريس\n1. **Slope** (الميل) - Using Horn's method\n2. **Aspect** (الجانب) - Slope direction\n3. **Flow Direction** (اتجاه التدفق) - D8 algorithm\n4. **Flow Accumulation** (تراكم التدفق) - Contributing area\n5. **TWI** (مؤشر الرطوبة الطبوغرافية) - Topographic Wetness Index\n6. **Curvature** (الانحناء) - Plan and profile curvature\n7. **Contours** (خطوط الكنتور) - Elevation isolines\n\n### Agricultural Applications | التطبيقات الزراعية\n- Irrigation suitability assessment\n- Erosion risk evaluation\n- Water flow analysis\n- Terrain-based zone delineation\n    "
  version: 16.0.0
paths:
  /healthz:
    get:
      tags:
      - health | الصحة
      summary: Liveness probe | فحص الحياة
      description: 'Health check endpoint (liveness probe)

        نقطة نهاية فحص الصحة (فحص الحياة)'
      operationId: health_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /readyz:
    get:
      tags:
      - health | الصحة
      summary: Readiness probe | فحص الجاهزية
      description: 'Kubernetes readiness probe - is the service ready to accept traffic?

        فحص جاهزية Kubernetes - هل الخدمة جاهزة لاستقبال الطلبات؟'
      operationId: readiness_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      tags:
      - health | الصحة
      summary: Combined health status | حالة الصحة المجمعة
      description: Combined health and readiness status | حالة الصحة والجاهزية المجمعة
      operationId: health_combined_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /metrics:
    get:
      tags:
      - health | الصحة
      summary: Prometheus metrics | مقاييس بروميثيوس
      description: 'Prometheus-compatible metrics endpoint.

        نقطة نهاية المقاييس المتوافقة مع بروميثيوس'
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/terrain/analyze:
    post:
      tags:
      - terrain | التضاريس
      summary: Full Terrain Analysis | تحليل التضاريس الكامل
      description: "Performs comprehensive terrain analysis for a field including:\n    - Slope and aspect\n    - Flow direction and accumulation\n    - Topographic Wetness Index (TWI)\n    - Curvature (plan and profile)\n    - Contour generation\n    - Irrigation recommendations\n\n    يجري تحليلاً شاملاً للتضاريس للحقل بما في ذلك:\n    - الميل والجانب\n    - اتجاه التدفق وتراكمه\n    - مؤشر الرطوبة الطبوغرافية\n    - الانحناء (أفقي وطولي)\n    - إنشاء خطوط الكنتور\n    - توصيات الري"
      operationId: analyze_terrain_api_v1_terrain_analyze_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerrainAnalysisRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerrainAnalysisResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/terrain/slope/{field_id}:
    get:
      tags:
      - terrain | التضاريس
      summary: Get Slope Analysis | الحصول على تحليل الميل
      description: Get slope analysis for a field | الحصول على تحليل الميل للحقل
      operationId: get_slope_analysis_api_v1_terrain_slope__field_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: field_id
        in: path
        required: true
        schema:
          type: string
          title: Field Id
      - name: dem_source
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DEMSourceType'
          default: copernicus
      - name: slope_unit
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SlopeUnit'
          default: degrees
      - name: classify
        in: query
        required: false
        schema:
          type: boolean
          description: Include slope classification
          default: true
          title: Classify
        description: Include slope classification
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlopeAnalysisResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/terrain/aspect/{field_id}:
    get:
      tags:
      - terrain | التضاريس
      summary: Get Aspect Analysis | الحصول على تحليل الجانب
      description: "Compute aspect (sun-facing direction, 0-360°) for a field from its DEM.\n\n    حساب اتجاه الجانب (اتجاه مواجهة الشمس، 0-360 درجة) للحقل من بيانات الارتفاع.\n\n    - Uses Horn's method (same gradient path as slope).\n    - 0° = North, 90° = East, 180° = South, 270° = West.\n    - Flat cells are reported in the distribution under `flat`.\n    - Coordinates returned assume CRS EPSG:4326 (WGS84)."
      operationId: get_aspect_analysis_api_v1_terrain_aspect__field_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: field_id
        in: path
        required: true
        schema:
          type: string
          title: Field Id
      - name: dem_source
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DEMSourceType'
          description: DEM source | مصدر الارتفاعات
          default: copernicus
        description: DEM source | مصدر الارتفاعات
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AspectAnalysisResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/terrain/flow/{field_id}:
    get:
      tags:
      - terrain | التضاريس
      summary: Get Flow Analysis | الحصول على تحليل التدفق
      description: Get flow direction and accumulation analysis | الحصول على تحليل اتجاه التدفق وتراكمه
      operationId: get_flow_analysis_api_v1_terrain_flow__field_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: field_id
        in: path
        required: true
        schema:
          type: string
          title: Field Id
      - name: dem_source
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DEMSourceType'
          default: copernicus
      - name: method
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FlowDirectionMethod'
          default: d8
      - name: accumulation_threshold
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 100
          title: Accumulation Threshold
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowAnalysisResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/terrain/twi/{field_id}:
    get:
      tags:
      - terrain | التضاريس
      summary: Get Topographic Wetness Index | الحصول على مؤشر الرطوبة الطبوغرافية
      description: Get Topographic Wetness Index analysis | الحصول على تحليل مؤشر الرطوبة الطبوغرافية
      operationId: get_twi_analysis_api_v1_terrain_twi__field_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: field_id
        in: path
        required: true
        schema:
          type: string
          title: Field Id
      - name: dem_source
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DEMSourceType'
          default: copernicus
      - name: flow_method
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FlowDirectionMethod'
          default: d8
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TWIAnalysisResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/terrain/contours/{field_id}:
    get:
      tags:
      - terrain | التضاريس
      summary: Get Contour Lines | الحصول على خطوط الكنتور
      description: Get contour lines for a field | الحصول على خطوط الكنتور للحقل
      operationId: get_contours_api_v1_terrain_contours__field_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: field_id
        in: path
        required: true
        schema:
          type: string
          title: Field Id
      - name: dem_source
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DEMSourceType'
          default: copernicus
      - name: interval_m
        in: query
        required: false
        schema:
          type: number
          exclusiveMinimum: 0
          description: Contour interval in meters
          default: 5.0
          title: Interval M
        description: Contour interval in meters
      - name: simplify_tolerance
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          default: 1.0
          title: Simplify Tolerance
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContourAnalysisResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/terrain/sources:
    get:
      tags:
      - terrain | التضاريس
      summary: List Available DEM Sources | قائمة مصادر الارتفاعات المتاحة
      description: List available DEM data sources | قائمة مصادر بيانات الارتفاعات المتاحة
      operationId: list_dem_sources_api_v1_terrain_sources_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DEMSourcesResponse'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/terrain/dem/{field_id}:
    get:
      tags:
      - terrain | التضاريس
      summary: Get DEM Data for Field | الحصول على بيانات الارتفاعات للحقل
      description: "Retrieves Digital Elevation Model data for a specific field.\n    Used by downstream services (hydrology, leveling) for terrain analysis.\n\n    يسترجع بيانات نموذج الارتفاع الرقمي لحقل محدد.\n    يستخدم من قبل الخدمات المتصلة (الهيدرولوجيا، التسوية) لتحليل التضاريس."
      operationId: get_dem_data_api_v1_terrain_dem__field_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: field_id
        in: path
        required: true
        schema:
          type: string
          title: Field Id
      - name: dem_source
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DEMSourceType'
          default: copernicus
      - name: resolution_m
        in: query
        required: false
        schema:
          type: number
          maximum: 1000.0
          minimum: 1.0
          default: 30.0
          title: Resolution M
      - name: include_data
        in: query
        required: false
        schema:
          type: boolean
          description: Include raw elevation data (for small fields only) | تضمين بيانات الارتفاع الخام
          default: false
          title: Include Data
        description: Include raw elevation data (for small fields only) | تضمين بيانات الارتفاع الخام
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DEMDataResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/terrain/erosion:
    post:
      tags:
      - terrain | التضاريس
      summary: Per-field soil erosion assessment (RUSLE) | تقييم تعرية التربة للحقل (RUSLE)
      description: "Compute the per-field annual soil loss using the RUSLE model:\n\n    A = R × K × LS × C × P\n\nWhere:\n  * **R** — rainfall-runoff erosivity (from annual precipitation + rainy days)\n  * **K** — soil erodibility (from USDA texture class)\n  * **LS** — slope length × steepness (from the terrain-core slope endpoint)\n  * **C** — cover-management (from the field's crop / cover class)\n  * **P** — support practice (none, contour, terraces, bench terraces)\n\nReturns:\n  * `soil_loss_t_ha_yr` — annual soil loss in tonnes / hectare / year\n  * `risk_level` — FAO classification (none / low / moderate / high / severe / catastrophic)\n  * `factors` — per-factor breakdown so operators can see which factor drives the loss\n  * `factor_contributions_pct` — log-normalised contribution per factor\n  * `recommendations` — targeted mitigation actions (bilingual EN + AR)\n\n**Context**: this replaces the Phase-1 ``erosion_risk: \"low\"`` string\nthat the /terrain/analyze response used to hard-code based on slope\nalone. That stub lied to farmers in Yemeni highland terraced fields\n(which frequently sit at slopes of 20-40%+ on silt-loam soils and\nrun a catastrophic erosion risk). The RUSLE endpoint surfaces the\nhonest answer plus actionable recommendations (bench terraces, cover\ncrops, residue retention).\n\nThe endpoint is a pure calculation — no DB, no satellite fetch. The\ncaller supplies aggregated per-field inputs. For sub-field zonation,\ncall once per management zone and compose on the client side."
      operationId: assess_erosion_api_v1_terrain_erosion_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErosionAssessmentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErosionAssessmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/terrain/erosion/wind:
    post:
      tags:
      - terrain | التضاريس
      summary: Per-field wind erosion assessment (RWEQ-lite) | تقييم تعرية الرياح للحقل (RWEQ-lite)
      description: "Compute the per-field annual wind soil loss using the RWEQ-lite model:\n\n    SL = 2 × (s / 50000²) × Q_max\n    Q_max = 109.8 × (WF × EF × SCF × K' × COG)\n\nWhere:\n  * **WF** — wind factor (aridity-weighted wind kinetic energy)\n  * **EF** — soil erodibility factor (texture fractions + organic matter)\n  * **SCF** — soil crust factor (clay + OM protective crusts)\n  * **K'** — Chepil surface roughness factor (tillage relief)\n  * **COG** — combined (residue + canopy) ground cover factor\n  * **s** — unsheltered field length along the prevailing wind\n\nReturns:\n  * `soil_loss_t_ha_yr` — annual wind soil loss in tonnes / hectare / year\n  * `risk_level` — FAO band (none / low / moderate / high / severe / catastrophic)\n  * `factors` — the 5 RWEQ sub-factors\n  * `factor_contributions_pct` — log-normalised contribution per factor\n  * `recommendations` — wind-specific mitigation (bilingual EN + AR)\n\n**Context**: RUSLE is wrong for Yemen's grain-producing plains\n(Tihama, Marib, Al-Jawf, Hadramawt) where slope is near-zero and wind\nis the dominant erosion driver. A flat Tihama sandy-loam field with\nno standing stubble can lose ~50 t/ha/yr to wind in a single sandstorm\nseason — RUSLE would score it as \"none\". This endpoint surfaces the\nhonest wind answer. For sloped fields pair with ``/erosion`` (water)\nor call ``/erosion/combined`` for both at once.\n\nThe endpoint is a pure calculation — no DB, no satellite fetch."
      operationId: assess_wind_erosion_api_v1_terrain_erosion_wind_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindErosionAssessmentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindErosionAssessmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/terrain/erosion/combined:
    post:
      tags:
      - terrain | التضاريس
      summary: Combined water + wind erosion assessment (RUSLE + RWEQ-lite) | التقييم المشترك لتعرية المياه والرياح
      description: "Run both the RUSLE (water) and RWEQ-lite (wind) engines on a single\nfield and return a unified assessment:\n\n  * `overall_risk_level` — the **worst-of-two** FAO band across the\n    two processes (not the sum — they operate on different time scales)\n  * `dominant_process` — which engine drives the overall risk\n    (`water` | `wind` | `both` | `none`), so operators can prioritise\n    between bench-terrace / cover-crop actions vs. windbreak /\n    standing-stubble actions\n  * `water` — the full RUSLE sub-result (same shape as ``/erosion``)\n  * `wind` — the full RWEQ-lite sub-result (same shape as ``/erosion/wind``)\n  * `combined_recommendations` — priority-ordered mitigation actions\n    starting with the dominant process (bilingual EN + AR)\n\n**Use this endpoint** whenever you need a per-field erosion risk\nwithout making assumptions about which process dominates. A field can\nbe safe on water and catastrophic on wind (flat Tihama sandy loam) or\nvice versa (Sana'a highland terrace at 30% slope). ``texture_key`` is\noptional: when omitted it's derived from the USDA ``soil_texture``\nvalue, which keeps the single-call path ergonomic for callers that\ndon't need Yemen-specific soil profiles.\n\nThe endpoint is a pure calculation — no DB, no satellite fetch."
      operationId: assess_combined_erosion_api_v1_terrain_erosion_combined_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CombinedErosionAssessmentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedErosionAssessmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/terrain/erosion/yemen:
    post:
      tags:
      - terrain | التضاريس
      summary: Combined erosion assessment for a Yemeni agro-ecological region | التقييم المشترك للتعرية لمنطقة زراعية يمنية
      description: "Minimum-input combined erosion assessment for Yemeni fields. Only\nfield-specific variables (slope, cover type, residue state) are\nrequired — climate (rainfall, wind speed, ET0) and soil texture\ndefaults are looked up from the ``YEMEN_REGION_PRESETS`` in\n``shared/terrain_erosion/combined.py`` (derived from\n``shared/yemen/climate.py`` + ``shared/yemen/soils.py``).\n\nSupported regions (``region`` field):\n  * ``tihama`` — Tihama Coastal Plain (peak wind 3.5 m/s, 125 mm rain)\n  * ``eastern_plateau`` — Marib / Al-Jawf semi-arid (3.5 m/s, 100 mm)\n  * ``hadhramaut`` — Wadi Hadhramaut (3.0 m/s, 65 mm)\n  * ``southern_coast`` — Aden / Lahj / Abyan delta (3.2 m/s, 120 mm)\n  * ``highlands`` — Sana'a / Ibb / Taiz terraces (2.5 m/s, 500 mm)\n\nReturns the full :class:`CombinedErosionAssessmentResponse` shape.\n\n**Use this endpoint** when an advisory-service caller only knows the\nfarmer's region name and wants a single call to get both the water\nand wind erosion risk. For full control over every input, call\n``/erosion/combined`` instead."
      operationId: assess_yemen_region_erosion_api_v1_terrain_erosion_yemen_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YemenRegionErosionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedErosionAssessmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
components:
  schemas:
    AspectAnalysisResponse:
      properties:
        field_id:
          type: string
          title: Field Id
          description: Field identifier | معرف الحقل
        analyzed_at:
          type: string
          format: date-time
          title: Analyzed At
          description: Analysis timestamp | وقت التحليل
        dem_source:
          $ref: '#/components/schemas/DEMSourceType'
          description: DEM source used | مصدر الارتفاعات
        aspect:
          $ref: '#/components/schemas/AspectResult'
        processing_time_ms:
          type: integer
          title: Processing Time Ms
          description: Processing time (ms) | وقت المعالجة (ملي ثانية)
      type: object
      required:
      - field_id
      - analyzed_at
      - dem_source
      - aspect
      - processing_time_ms
      title: AspectAnalysisResponse
      description: 'Aspect analysis response | استجابة تحليل الجانب


        Returns sun-facing direction (0-360 degrees, 0=North, clockwise)

        computed from the DEM for the field. Contract endpoint:

        GET /api/v1/terrain/aspect/{field_id}'
    AspectClassification:
      type: string
      enum:
      - flat
      - north
      - northeast
      - east
      - southeast
      - south
      - southwest
      - west
      - northwest
      title: AspectClassification
      description: Aspect cardinal directions | اتجاهات الجوانب الأصلية
    AspectResult:
      properties:
        dominant_direction:
          $ref: '#/components/schemas/AspectClassification'
          description: Dominant aspect direction | الاتجاه السائد
        dominant_direction_name:
          $ref: '#/components/schemas/BilingualField'
          description: Dominant direction name | اسم الاتجاه السائد
        distribution:
          additionalProperties:
            type: number
          type: object
          title: Distribution
          description: Aspect distribution by direction | توزيع الجوانب حسب الاتجاه
        mean_aspect_degrees:
          type: number
          title: Mean Aspect Degrees
          description: Mean aspect in degrees | متوسط الجانب بالدرجات
        raster_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Raster Url
          description: URL to aspect raster | رابط خريطة الجانب
      type: object
      required:
      - dominant_direction
      - dominant_direction_name
      - distribution
      - mean_aspect_degrees
      title: AspectResult
      description: Aspect analysis result | نتيجة تحليل الجانب
    BilingualField:
      properties:
        en:
          type: string
          title: En
          description: English value | القيمة بالإنجليزية
        ar:
          type: string
          title: Ar
