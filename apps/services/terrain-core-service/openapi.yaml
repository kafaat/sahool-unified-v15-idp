          default: bare
        residue_cover_pct:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Residue Cover Pct
          description: Flat/standing residue cover (%) | نسبة تغطية البقايا (٪)
          default: 0.0
        canopy_cover_pct:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Canopy Cover Pct
          description: Active canopy cover (%) | نسبة تغطية المظلة النباتية (٪)
          default: 0.0
        unsheltered_length_m:
          type: number
          maximum: 5000.0
          minimum: 1.0
          title: Unsheltered Length M
          description: Unsheltered field length along the prevailing wind direction (m) | طول الحقل غير المحمي باتجاه الرياح السائدة (م)
          default: 100.0
      type: object
      required:
      - field_id
      - tenant_id
      - texture_key
      - mean_wind_speed_ms
      - annual_rainfall_mm
      - annual_et0_mm
      title: WindErosionAssessmentRequest
      description: 'Inputs for a RWEQ-lite (Revised Wind Erosion Equation) assessment.


        مدخلات تقييم تعرية الرياح باستخدام معادلة RWEQ-lite.


        Use this for flat grain-producing plains (Tihama, Marib, Al-Jawf,

        Hadramawt) where slope is near-zero and wind is the dominant

        erosion driver. For sloped fields, pair with the water erosion

        endpoint — or call ``/erosion/combined`` for both at once.'
    WindErosionAssessmentResponse:
      properties:
        field_id:
          type: string
          title: Field Id
        tenant_id:
          type: string
          title: Tenant Id
        soil_loss_t_ha_yr:
          type: number
          title: Soil Loss T Ha Yr
          description: Annual wind soil loss (tonnes / hectare / year) | فقد التربة بالرياح سنوياً
        risk_level:
          $ref: '#/components/schemas/ErosionRiskLevelEnum'
          description: FAO risk band (none / low / moderate / high / severe / catastrophic)
        risk_level_ar:
          type: string
          title: Risk Level Ar
          description: Arabic label for the risk band
        factors:
          $ref: '#/components/schemas/RWEQFactorsResponse'
          description: Per-factor breakdown
        factor_contributions_pct:
          additionalProperties:
            type: number
          type: object
          title: Factor Contributions Pct
          description: Log-normalised per-factor contribution (%) — which factor drives the loss
        recommendations:
          items:
            type: string
          type: array
          title: Recommendations
          description: Wind-erosion mitigation actions (English)
        recommendations_ar:
          items:
            type: string
          type: array
          title: Recommendations Ar
          description: خطوات التخفيف من تعرية الرياح (عربي)
        assessed_at:
          type: string
          format: date-time
          title: Assessed At
          description: Assessment timestamp
      type: object
      required:
      - field_id
      - tenant_id
      - soil_loss_t_ha_yr
      - risk_level
      - risk_level_ar
      - factors
      - assessed_at
      title: WindErosionAssessmentResponse
      description: 'Full RWEQ-lite assessment output for a single field.

        مخرجات تقييم RWEQ-lite الكامل لحقل واحد.'
    YemenRegionErosionRequest:
      properties:
        field_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Field Id
          description: Field identifier | معرف الحقل
        tenant_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Tenant Id
          description: Tenant identifier | معرف المستأجر
        region:
          type: string
          maxLength: 64
          minLength: 1
          title: Region
          description: Yemen agro-ecological region key (tihama, eastern_plateau, hadhramaut, southern_coast, highlands) | المنطقة الزراعية اليمنية
        slope_pct:
          type: number
          maximum: 200.0
          minimum: 0.0
          title: Slope Pct
          description: Mean slope percentage (0-200), default 1% for plains | نسبة الميل
          default: 1.0
        soil_texture:
          anyOf:
          - $ref: '#/components/schemas/SoilTextureEnum'
          - type: 'null'
          description: Optional USDA soil texture override — when None, inferred from the regional Yemen profile | فئة قوام تربة اختيارية تُستنتج تلقائياً
        cover_type:
          type: string
          maxLength: 64
          title: Cover Type
          description: Crop / cover class for the RUSLE C factor | نوع الغطاء النباتي
          default: bare_soil
        conservation_practice:
          type: string
          maxLength: 64
          title: Conservation Practice
          description: Support practice for the RUSLE P factor | ممارسة الحفاظ
          default: none
        residue_state:
          $ref: '#/components/schemas/ResidueStateEnum'
          description: Crop residue state after harvest | حالة بقايا المحصول
          default: bare
        residue_cover_pct:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Residue Cover Pct
          description: Flat/standing residue cover (%) | نسبة تغطية البقايا
          default: 0.0
        canopy_cover_pct:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Canopy Cover Pct
          description: Active canopy cover (%) | نسبة تغطية المظلة
          default: 0.0
      type: object
      required:
      - field_id
      - tenant_id
      - region
      title: YemenRegionErosionRequest
      description: 'Minimum-input combined erosion request for a Yemeni field, using

        a named agro-ecological region to fill in climate + soil defaults.


        طلب تقييم التعرية المشترك لحقل يمني بالحد الأدنى من المدخلات

        باستخدام منطقة زراعية مسماة لملء القيم المناخية والتربة تلقائياً.


        Known regions: ``tihama``, ``eastern_plateau``, ``hadhramaut``,

        ``southern_coast``, ``highlands``. Only field-specific variables

        (slope, cover, residue) need to be supplied — everything else is

        inferred from ``YEMEN_REGION_PRESETS`` in

        ``shared/terrain_erosion/combined.py``.'
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
