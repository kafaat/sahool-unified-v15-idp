          description: Active canopy cover (%) | نسبة تغطية المظلة
          maximum: 100.0
          minimum: 0.0
          title: Canopy Cover Pct
          type: number
        conservation_practice:
          default: none
          description: Support practice for the RUSLE P factor | ممارسة الحفاظ
          maxLength: 64
          title: Conservation Practice
          type: string
        cover_type:
          default: bare_soil
          description: Crop / cover class for the RUSLE C factor | نوع الغطاء النباتي
          maxLength: 64
          title: Cover Type
          type: string
        field_id:
          description: Field identifier | معرف الحقل
          maxLength: 100
          minLength: 1
          title: Field Id
          type: string
        region:
          description: Yemen agro-ecological region key (tihama, eastern_plateau, hadhramaut, southern_coast, highlands) | المنطقة الزراعية اليمنية
          maxLength: 64
          minLength: 1
          title: Region
          type: string
        residue_cover_pct:
          default: 0.0
          description: Flat/standing residue cover (%) | نسبة تغطية البقايا
          maximum: 100.0
          minimum: 0.0
          title: Residue Cover Pct
          type: number
        residue_state:
          $ref: '#/components/schemas/ResidueStateEnum'
          default: bare
          description: Crop residue state after harvest | حالة بقايا المحصول
        slope_pct:
          default: 1.0
          description: Mean slope percentage (0-200), default 1% for plains | نسبة الميل
          maximum: 200.0
          minimum: 0.0
          title: Slope Pct
          type: number
        soil_texture:
          anyOf:
          - $ref: '#/components/schemas/SoilTextureEnum'
          - type: 'null'
          description: Optional USDA soil texture override — when None, inferred from the regional Yemen profile | فئة قوام تربة اختيارية تُستنتج تلقائياً
        tenant_id:
          description: Tenant identifier | معرف المستأجر
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
      required:
