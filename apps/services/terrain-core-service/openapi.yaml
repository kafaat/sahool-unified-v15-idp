          items:
            type: string
          title: Recommendations Ar
          type: array
        risk_level:
          $ref: '#/components/schemas/ErosionRiskLevelEnum'
          description: FAO risk band (none / low / moderate / high / severe / catastrophic)
        risk_level_ar:
          description: Arabic label for the risk band
          title: Risk Level Ar
          type: string
        soil_loss_t_ha_yr:
          description: Annual wind soil loss (tonnes / hectare / year) | فقد التربة بالرياح سنوياً
          title: Soil Loss T Ha Yr
          type: number
        tenant_id:
          title: Tenant Id
          type: string
      required:
      - field_id
      - tenant_id
