          description: Zone name | اسم المنطقة
      required:
      - zone_id
      - zone_name
      - area_ha
      - mean_slope_pct
      - mean_twi
      - irrigation_suitability
      - suitability_name
      - recommended_method
      - water_retention_capacity
      - erosion_risk
      - notes
      title: TerrainIrrigationRecommendation
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WindErosionAssessmentRequest:
      description: 'Inputs for a RWEQ-lite (Revised Wind Erosion Equation) assessment.


        مدخلات تقييم تعرية الرياح باستخدام معادلة RWEQ-lite.


        Use this for flat grain-producing plains (Tihama, Marib, Al-Jawf,

        Hadramawt) where slope is near-zero and wind is the dominant

        erosion driver. For sloped fields, pair with the water erosion

        endpoint — or call ``/erosion/combined`` for both at once.'
      properties:
        annual_et0_mm:
          description: Annual reference evapotranspiration total (mm) | إجمالي التبخر النتح المرجعي السنوي (مم)
          maximum: 5000.0
          minimum: 100.0
          title: Annual Et0 Mm
          type: number
        annual_rainfall_mm:
          description: Mean annual precipitation (mm) | متوسط الهطول السنوي (مم)
          maximum: 5000.0
          minimum: 0.0
          title: Annual Rainfall Mm
          type: number
        canopy_cover_pct:
          default: 0.0
          description: Active canopy cover (%) | نسبة تغطية المظلة النباتية (٪)
          maximum: 100.0
          minimum: 0.0
          title: Canopy Cover Pct
          type: number
        field_id:
          description: Field identifier | معرف الحقل
          maxLength: 100
          minLength: 1
          title: Field Id
          type: string
        mean_wind_speed_ms:
          description: Mean wind speed (m/s) — use peak-month mean for conservative planning | متوسط سرعة الرياح (م/ث)
          maximum: 50.0
          minimum: 0.0
          title: Mean Wind Speed Ms
          type: number
        residue_cover_pct:
          default: 0.0
          description: Flat/standing residue cover (%) | نسبة تغطية البقايا (٪)
          maximum: 100.0
          minimum: 0.0
          title: Residue Cover Pct
          type: number
        residue_state:
          $ref: '#/components/schemas/ResidueStateEnum'
          default: bare
          description: Crop residue state after harvest (drives COG) | حالة بقايا المحصول
        roughness:
          $ref: '#/components/schemas/SurfaceRoughnessEnum'
          default: medium
          description: Chepil surface roughness class (drives K') | فئة خشونة السطح
        tenant_id:
          description: Tenant identifier | معرف المستأجر
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
        texture_key:
          description: Soil texture key — USDA class (sand, loam, clay, ...) or Yemen profile (tihama_sandy_loam, highland_clay_loam, ...) | مفتاح قوام التربة (USDA أو ملف تعريف يمني)
          maxLength: 64
          minLength: 1
          title: Texture Key
          type: string
        unsheltered_length_m:
          default: 100.0
          description: Unsheltered field length along the prevailing wind direction (m) | طول الحقل غير المحمي باتجاه الرياح السائدة (م)
          maximum: 5000.0
          minimum: 1.0
          title: Unsheltered Length M
          type: number
      required:
      - field_id
      - tenant_id
      - texture_key
      - mean_wind_speed_ms
      - annual_rainfall_mm
      - annual_et0_mm
      title: WindErosionAssessmentRequest
      type: object
    WindErosionAssessmentResponse:
      description: 'Full RWEQ-lite assessment output for a single field.

        مخرجات تقييم RWEQ-lite الكامل لحقل واحد.'
      properties:
        assessed_at:
