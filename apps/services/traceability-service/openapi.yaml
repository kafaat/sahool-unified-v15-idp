components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: Product traceability and supply chain tracking - تتبع المنتجات وسلسلة التوريد
  title: Traceability Service
  version: 16.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: Root endpoint - نقطة نهاية الجذر
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
  /api/v1/traceability/anchors/stats:
    get:
      description: Expose subscriber stats for Prometheus scrapers / ops.
      operationId: anchor_stats_api_v1_traceability_anchors_stats_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Anchor Stats
  /api/v1/traceability/anchors/{tenant_id}/{field_id}:
    get:
      description: 'Return the in-memory chain of anchored events for a given

        (tenant, field). Useful for debugging and for the loan-

        verification / export-certificate flows that need to show

        the immutable activity log to auditors.'
      operationId: list_anchors_api_v1_traceability_anchors__tenant_id___field_id__get
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          title: Tenant Id
          type: string
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Anchors
  /api/v1/traceability/anchors/{tenant_id}/{field_id}/verify:
    get:
      description: 'Re-compute every hash in the field''s chain and confirm it

        matches. Returns ``valid: true`` only if the chain is untampered.'
      operationId: verify_anchors_api_v1_traceability_anchors__tenant_id___field_id__verify_get
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          title: Tenant Id
          type: string
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Verify Anchors
  /health:
    get:
      description: Comprehensive health check - فحص صحي شامل
      operationId: comprehensive_health_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Comprehensive Health
  /healthz:
    get:
      description: Liveness probe - فحص الحياة
      operationId: health_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /metrics:
    get:
      description: Prometheus metrics endpoint
      operationId: metrics_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Metrics
  /readyz:
    get:
      description: Readiness probe - فحص الجاهزية
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
