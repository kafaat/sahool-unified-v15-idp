components:
  schemas:
    BulkSMSRequest:
      description: Bulk SMS request
      properties:
        message:
          anyOf:
          - maxLength: 1600
            type: string
          - type: 'null'
          title: Message
        message_ar:
          anyOf:
          - maxLength: 1600
            type: string
          - type: 'null'
          title: Message Ar
        phone_numbers:
          items:
            type: string
          maxItems: 5000
          minItems: 1
          title: Phone Numbers
          type: array
        tenant_id:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Tenant Id
      required:
      - phone_numbers
      title: BulkSMSRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    SendSMSRequest:
      description: Send SMS request
      properties:
        message:
          anyOf:
          - maxLength: 1600
            type: string
          - type: 'null'
          title: Message
        message_ar:
          anyOf:
          - maxLength: 1600
            type: string
          - type: 'null'
          title: Message Ar
        phone_number:
          maxLength: 20
          title: Phone Number
          type: string
        tenant_id:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Tenant Id
      required:
      - phone_number
      title: SendSMSRequest
      type: object
    USSDSimulateRequest:
      description: USSD simulation request
      properties:
        language:
          default: ar
          pattern: ^(ar|en)$
          title: Language
          type: string
        phone_number:
          default: '+966500000000'
          maxLength: 20
          title: Phone Number
          type: string
        text:
          default: ''
          maxLength: 500
          title: Text
          type: string
      title: USSDSimulateRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WhatsAppSendRequest:
      description: WhatsApp send request
      properties:
        buttons:
          items:
            additionalProperties: true
            type: object
          maxItems: 10
          title: Buttons
          type: array
        message:
          anyOf:
          - maxLength: 4096
            type: string
          - type: 'null'
          title: Message
        message_ar:
          anyOf:
          - maxLength: 4096
            type: string
          - type: 'null'
          title: Message Ar
        phone_number:
          maxLength: 20
          title: Phone Number
          type: string
        template:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Template
      required:
      - phone_number
      title: WhatsAppSendRequest
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: SMS and USSD support for basic phones - دعم الهواتف البسيطة
  title: USSD Gateway - بوابة USSD
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/keywords:
    get:
      description: Get supported SMS keywords
      operationId: get_sms_keywords_api_v1_keywords_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Get Sms Keywords
      tags:
      - ussd-gateway
  /api/v1/menus:
    get:
      description: Get available USSD menu structure
      operationId: get_ussd_menus_api_v1_menus_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Get Ussd Menus
      tags:
      - ussd-gateway
  /api/v1/status:
    get:
      description: Get USSD gateway service status
      operationId: get_service_status_api_v1_status_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Get Service Status
      tags:
      - ussd-gateway
  /health/live:
    get:
      description: Liveness probe
      operationId: health_health_live_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /health/ready:
    get:
      description: 'Readiness probe.


        In production/staging, returns HTTP 503 when a critical dependency

        (DB, NATS) is down, so K8s will stop routing traffic. Dev keeps 200

        behavior so local runs without real infra still succeed.'
      operationId: readiness_health_ready_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
  /healthz:
    get:
      description: Liveness probe
      operationId: health_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /readyz:
    get:
      description: 'Readiness probe.


        In production/staging, returns HTTP 503 when a critical dependency

        (DB, NATS) is down, so K8s will stop routing traffic. Dev keeps 200

        behavior so local runs without real infra still succeed.'
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
  /sms/bulk:
    post:
      description: 'Send bulk SMS to multiple farmers

        إرسال رسائل جماعية للمزارعين'
      operationId: send_bulk_sms_sms_bulk_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSMSRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Send Bulk Sms
  /sms/receive:
    post:
      description: 'Handle incoming SMS from farmer

        معالجة الرسائل الواردة من المزارع


        Supports keyword-based responses'
      operationId: receive_sms_sms_receive_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Receive Sms
  /sms/send:
    post:
      description: 'Send SMS to farmer

        إرسال رسالة نصية للمزارع'
      operationId: send_sms_sms_send_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSMSRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Send Sms
  /ussd/callback:
    post:
      description: 'Handle USSD callback from telecom provider

        معالجة استدعاء USSD من مزود الاتصالات


        Supports Africa''s Talking, Infobip, and local telcos'
      operationId: ussd_callback_ussd_callback_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Ussd Callback
  /ussd/simulate:
    post:
      description: 'Simulate USSD session for testing

        محاكاة جلسة USSD للاختبار'
      operationId: ussd_simulate_ussd_simulate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/USSDSimulateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Ussd Simulate
  /whatsapp/send:
    post:
      description: 'Send WhatsApp message to farmer

        إرسال رسالة واتساب للمزارع'
      operationId: send_whatsapp_whatsapp_send_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppSendRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Send Whatsapp
  /whatsapp/webhook:
    post:
      description: 'Handle WhatsApp Business API webhook

        معالجة webhook واتساب للأعمال'
      operationId: whatsapp_webhook_whatsapp_webhook_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Whatsapp Webhook
