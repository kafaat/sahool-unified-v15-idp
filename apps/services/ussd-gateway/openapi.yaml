openapi: 3.1.0
info:
  title: USSD Gateway - بوابة USSD
  description: SMS and USSD support for basic phones - دعم الهواتف البسيطة
  version: 16.0.0
paths:
  /health/live:
    get:
      summary: Health
      description: Liveness probe
      operationId: health_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /healthz:
    get:
      summary: Health
      description: Liveness probe
      operationId: health_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/ready:
    get:
      summary: Readiness
      description: 'Readiness probe.


        In production/staging, returns HTTP 503 when a critical dependency

        (DB, NATS) is down, so K8s will stop routing traffic. Dev keeps 200

        behavior so local runs without real infra still succeed.'
      operationId: readiness_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /readyz:
    get:
      summary: Readiness
      description: 'Readiness probe.


        In production/staging, returns HTTP 503 when a critical dependency

        (DB, NATS) is down, so K8s will stop routing traffic. Dev keeps 200

        behavior so local runs without real infra still succeed.'
      operationId: readiness_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ussd/callback:
    post:
      summary: Ussd Callback
      description: 'Handle USSD callback from telecom provider

        معالجة استدعاء USSD من مزود الاتصالات


        Supports Africa''s Talking, Infobip, and local telcos'
      operationId: ussd_callback_ussd_callback_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ussd/simulate:
    post:
      summary: Ussd Simulate
      description: 'Simulate USSD session for testing

        محاكاة جلسة USSD للاختبار'
      operationId: ussd_simulate_ussd_simulate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/USSDSimulateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sms/send:
    post:
      summary: Send Sms
      description: 'Send SMS to farmer

        إرسال رسالة نصية للمزارع'
      operationId: send_sms_sms_send_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSMSRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /sms/receive:
    post:
      summary: Receive Sms
      description: 'Handle incoming SMS from farmer

        معالجة الرسائل الواردة من المزارع


        Supports keyword-based responses'
      operationId: receive_sms_sms_receive_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /sms/bulk:
    post:
      summary: Send Bulk Sms
      description: 'Send bulk SMS to multiple farmers

        إرسال رسائل جماعية للمزارعين'
      operationId: send_bulk_sms_sms_bulk_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSMSRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /whatsapp/webhook:
    post:
      summary: Whatsapp Webhook
      description: 'Handle WhatsApp Business API webhook

        معالجة webhook واتساب للأعمال'
      operationId: whatsapp_webhook_whatsapp_webhook_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /whatsapp/send:
    post:
      summary: Send Whatsapp
      description: 'Send WhatsApp message to farmer

        إرسال رسالة واتساب للمزارع'
      operationId: send_whatsapp_whatsapp_send_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppSendRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/status:
    get:
      tags:
      - ussd-gateway
      summary: Get Service Status
      description: Get USSD gateway service status
      operationId: get_service_status_api_v1_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/menus:
    get:
      tags:
      - ussd-gateway
      summary: Get Ussd Menus
      description: Get available USSD menu structure
      operationId: get_ussd_menus_api_v1_menus_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/keywords:
    get:
      tags:
      - ussd-gateway
      summary: Get Sms Keywords
      description: Get supported SMS keywords
      operationId: get_sms_keywords_api_v1_keywords_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    BulkSMSRequest:
      properties:
        phone_numbers:
          items:
            type: string
          type: array
          maxItems: 5000
          minItems: 1
          title: Phone Numbers
        message:
          anyOf:
          - type: string
            maxLength: 1600
          - type: 'null'
          title: Message
        message_ar:
          anyOf:
          - type: string
            maxLength: 1600
          - type: 'null'
          title: Message Ar
        tenant_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Tenant Id
      type: object
      required:
      - phone_numbers
      title: BulkSMSRequest
      description: Bulk SMS request
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SendSMSRequest:
      properties:
        phone_number:
          type: string
          maxLength: 20
          title: Phone Number
        message:
          anyOf:
          - type: string
            maxLength: 1600
          - type: 'null'
          title: Message
        message_ar:
          anyOf:
          - type: string
            maxLength: 1600
          - type: 'null'
          title: Message Ar
        tenant_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Tenant Id
      type: object
      required:
      - phone_number
      title: SendSMSRequest
      description: Send SMS request
    USSDSimulateRequest:
      properties:
        phone_number:
          type: string
          maxLength: 20
          title: Phone Number
          default: '+966500000000'
        text:
          type: string
          maxLength: 500
          title: Text
          default: ''
        language:
          type: string
          pattern: ^(ar|en)$
          title: Language
          default: ar
      type: object
      title: USSDSimulateRequest
      description: USSD simulation request
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WhatsAppSendRequest:
      properties:
        phone_number:
          type: string
          maxLength: 20
          title: Phone Number
        message:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Message
        message_ar:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Message Ar
        template:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          title: Template
        buttons:
          items:
            additionalProperties: true
            type: object
          type: array
          maxItems: 10
          title: Buttons
      type: object
      required:
      - phone_number
      title: WhatsAppSendRequest
      description: WhatsApp send request
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
