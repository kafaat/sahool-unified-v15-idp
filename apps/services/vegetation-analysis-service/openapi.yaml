      summary: Get Crop Gdd Requirements
  /v1/gdd/stage/{crop_code}:
    get:
      description: "مرحلة النمو | Get Growth Stage from GDD\n\nDetermine current growth stage based on accumulated GDD.\n\n**Simple API for Stage Lookup:**\n- Input: Crop + GDD\n- Output: Current stage + Next stage + GDD to next\n\n**Example:**\n```\nGET /v1/gdd/stage/WHEAT?gdd=1247.5\n```\n\n**Response:**\n```json\n{\n  \"crop_code\": \"WHEAT\",\n  \"crop_name_ar\": \"قمح\",\n  \"crop_name_en\": \"Wheat\",\n  \"accumulated_gdd\": 1247.5,\n  \"current_stage\": {\n    \"name_en\": \"Flowering\",\n    \"name_ar\": \"الإزهار\",\n    \"gdd_start\": 1100,\n    \"gdd_end\": 1500\n  },\n  \"next_stage\": {\n    \"name_en\": \"Grain Fill\",\n    \"name_ar\": \"امتلاء الحبوب\",\n    \"gdd_start\": 1500,\n    \"gdd_end\": 1700\n  },\n  \"gdd_to_next_stage\": 252.5,\n  \"progress_percent\": 61.9\n}\n```\n\n**Use Cases:**\n- Quick stage lookup\n- Mobile app stage indicator\n- Alert generation\n- Task recommendations"
