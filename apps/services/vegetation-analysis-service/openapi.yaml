openapi: 3.1.0
info:
  title: SAHOOL Satellite Service | خدمة الأقمار الصناعية
  description: Multi-provider satellite monitoring with automatic fallback. Supports
    Sentinel Hub, Copernicus STAC, NASA Earthdata. Includes Sentinel-1 SAR for soil
    moisture estimation. Now with GDD (Growing Degree Days) tracking for 40+ Yemen
    crops.
  version: 16.0.0
paths:
  /v1/weather/forecast:
    get:
      summary: Get Weather Forecast
      description: 'توقعات الطقس | Get Weather Forecast


        Get weather forecast for next N days with ET0 (evapotranspiration).

        Useful for irrigation planning and crop water management.


        Data from Open-Meteo free API.


        **Yemen Locations:**

        - Sanaa: lat=15.3694, lon=44.1910 (highland)

        - Aden: lat=12.7855, lon=45.0187 (coastal)

        - Hodeidah: lat=14.8022, lon=42.9511 (coastal)

        - Ibb: lat=13.9667, lon=44.1667 (highland)

        - Taiz: lat=13.5795, lon=44.0202 (mid-elevation)


        **Returns:**

        - Daily forecast: temp, precipitation, ET0

        - Hourly forecast: temp, humidity, wind, solar radiation'
      operationId: get_weather_forecast_v1_weather_forecast_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Latitude
          title: Lat
        description: Latitude
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          description: Longitude
          title: Lon
        description: Longitude
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 16
          minimum: 1
          description: Forecast days (1-16)
          default: 7
          title: Days
        description: Forecast days (1-16)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/weather/historical:
    get:
      summary: Get Historical Weather
      description: 'بيانات الطقس التاريخية | Get Historical Weather


        Get historical weather data from 1940 to ~7 days ago.

        Includes summary statistics: avg temp, total precipitation, ET0, GDD.


        Useful for:

        - Analyzing past growing seasons

        - Calibrating yield prediction models

        - Understanding long-term climate patterns


        **Example:**

        ```

        GET /v1/weather/historical?lat=15.3694&lon=44.1910&start_date=2024-01-01&end_date=2024-06-30

        ```'
      operationId: get_historical_weather_v1_weather_historical_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Latitude
          title: Lat
        description: Latitude
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          description: Longitude
          title: Lon
        description: Longitude
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          description: Start date (YYYY-MM-DD)
          title: Start Date
        description: Start date (YYYY-MM-DD)
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          description: End date (YYYY-MM-DD)
          title: End Date
        description: End date (YYYY-MM-DD)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
