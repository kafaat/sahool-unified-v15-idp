components:
  schemas:
    AnalyzeWithActionRequest:
      description: Request for analysis with ActionTemplate output
      properties:
        cloud_cover_max:
          default: 20.0
          maximum: 100.0
          minimum: 0.0
          title: Cloud Cover Max
          type: number
        end_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: End Date
        farmer_id:
          anyOf:
          - type: string
          - type: 'null'
          description: معرف المزارع
          title: Farmer Id
        field_id:
          description: معرف الحقل
          title: Field Id
          type: string
        latitude:
          maximum: 90.0
          minimum: -90.0
          title: Latitude
          type: number
        longitude:
          maximum: 180.0
          minimum: -180.0
          title: Longitude
          type: number
        publish_event:
          default: true
          description: نشر الحدث عبر NATS
          title: Publish Event
          type: boolean
        satellite:
          $ref: '#/components/schemas/SatelliteSource'
          default: sentinel-2
        start_date:
          format: date
          title: Start Date
          type: string
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          description: معرف المستأجر
          title: Tenant Id
      required:
      - field_id
      - latitude
      - longitude
      title: AnalyzeWithActionRequest
      type: object
    ChangeEventResponse:
      description: Response model for a single change event
      properties:
        additional_metrics:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Additional Metrics
        change_percent:
          title: Change Percent
          type: number
        change_type:
          title: Change Type
          type: string
        confidence:
          title: Confidence
          type: number
        description_ar:
          title: Description Ar
          type: string
        description_en:
          title: Description En
          type: string
        detected_date:
          title: Detected Date
          type: string
        field_id:
          title: Field Id
          type: string
        location:
          additionalProperties:
            type: number
          title: Location
          type: object
        ndvi_after:
          title: Ndvi After
          type: number
        ndvi_before:
          title: Ndvi Before
          type: number
        ndvi_change:
          title: Ndvi Change
          type: number
        recommended_action_ar:
          title: Recommended Action Ar
          type: string
        recommended_action_en:
          title: Recommended Action En
          type: string
        severity:
          title: Severity
          type: string
      required:
      - field_id
      - change_type
      - severity
      - detected_date
      - location
      - ndvi_before
      - ndvi_after
      - ndvi_change
      - change_percent
      - confidence
      - description_ar
      - description_en
      - recommended_action_ar
      - recommended_action_en
      title: ChangeEventResponse
      type: object
    ChangeReportResponse:
      description: Response model for comprehensive change detection report
      properties:
        analysis_period:
          additionalProperties:
            type: string
          title: Analysis Period
          type: object
        anomaly_count:
          title: Anomaly Count
          type: integer
        change_type_summary:
          additionalProperties:
            type: integer
          title: Change Type Summary
          type: object
        events:
          items:
            $ref: '#/components/schemas/ChangeEventResponse'
          title: Events
          type: array
        field_id:
          title: Field Id
          type: string
        ndvi_trend:
          title: Ndvi Trend
          type: number
        overall_trend:
          title: Overall Trend
          type: string
        recommendations_ar:
          items:
            type: string
          title: Recommendations Ar
          type: array
        recommendations_en:
          items:
            type: string
          title: Recommendations En
          type: array
        severity_summary:
          additionalProperties:
            type: integer
          title: Severity Summary
          type: object
        summary_ar:
          title: Summary Ar
          type: string
        summary_en:
          title: Summary En
          type: string
      required:
      - field_id
      - analysis_period
      - events
      - overall_trend
      - ndvi_trend
      - anomaly_count
      - severity_summary
      - change_type_summary
      - summary_ar
      - summary_en
      - recommendations_ar
      - recommendations_en
      title: ChangeReportResponse
      type: object
    FieldAnalysis:
      properties:
        analysis_date:
          format: date-time
          title: Analysis Date
          type: string
        anomalies:
          items:
            type: string
          title: Anomalies
          type: array
        field_id:
          title: Field Id
          type: string
        health_score:
          maximum: 100.0
          minimum: 0.0
          title: Health Score
          type: number
        health_status:
          title: Health Status
          type: string
        imagery:
          $ref: '#/components/schemas/SatelliteImagery'
        indices:
          $ref: '#/components/schemas/VegetationIndices'
        recommendations_ar:
          items:
            type: string
          title: Recommendations Ar
          type: array
        recommendations_en:
          items:
            type: string
          title: Recommendations En
          type: array
        satellite:
          $ref: '#/components/schemas/SatelliteSource'
      required:
      - field_id
      - analysis_date
      - satellite
      - imagery
      - indices
      - health_score
      - health_status
      - anomalies
      - recommendations_ar
      - recommendations_en
      title: FieldAnalysis
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ImageryRequest:
      properties:
        cloud_cover_max:
          default: 20.0
          maximum: 100.0
          minimum: 0.0
          title: Cloud Cover Max
          type: number
        end_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: End Date
        field_id:
          description: معرف الحقل
          title: Field Id
          type: string
        latitude:
          maximum: 90.0
          minimum: -90.0
          title: Latitude
          type: number
        longitude:
          maximum: 180.0
          minimum: -180.0
          title: Longitude
          type: number
        satellite:
          $ref: '#/components/schemas/SatelliteSource'
          default: sentinel-2
        start_date:
          format: date
          title: Start Date
          type: string
      required:
      - field_id
      - latitude
      - longitude
      title: ImageryRequest
      type: object
    InterpretRequest:
      description: Request for interpreting indices
      properties:
        crop_type:
          anyOf:
          - type: string
          - type: 'null'
          default: unknown
          description: نوع المحصول
          title: Crop Type
        field_id:
          description: معرف الحقل
          title: Field Id
          type: string
        growth_stage:
          anyOf:
          - type: string
          - type: 'null'
          default: vegetative
          description: مرحلة النمو
          title: Growth Stage
        indices:
          additionalProperties:
            type: number
          description: Index values to interpret
          title: Indices
          type: object
      required:
      - field_id
      - indices
      title: InterpretRequest
      type: object
    PhenologyActionRequest:
      description: Request for phenology detection with ActionTemplate output
      properties:
        crop_type:
          description: نوع المحصول
          title: Crop Type
          type: string
        days:
          default: 60
          maximum: 365
          minimum: 14
          title: Days
          type: integer
        farmer_id:
          anyOf:
          - type: string
          - type: 'null'
          description: معرف المزارع
          title: Farmer Id
        field_id:
          description: معرف الحقل
          title: Field Id
          type: string
        latitude:
          maximum: 90.0
          minimum: -90.0
          title: Latitude
          type: number
        longitude:
          maximum: 180.0
          minimum: -180.0
          title: Longitude
          type: number
        planting_date:
          anyOf:
          - type: string
          - type: 'null'
          description: تاريخ الزراعة
          title: Planting Date
        publish_event:
          default: true
          description: نشر الحدث عبر NATS
          title: Publish Event
          type: boolean
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          description: معرف المستأجر
          title: Tenant Id
      required:
      - field_id
      - crop_type
      - latitude
      - longitude
      title: PhenologyActionRequest
      type: object
    RealAnalysisRequest:
      description: Request model for real satellite analysis
      properties:
        cloud_cover_max:
          default: 30.0
          maximum: 100.0
          minimum: 0.0
          title: Cloud Cover Max
          type: number
        end_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: End Date
        field_id:
          description: معرف الحقل
          title: Field Id
          type: string
        latitude:
          maximum: 90.0
          minimum: -90.0
          title: Latitude
          type: number
        longitude:
          maximum: 180.0
          minimum: -180.0
          title: Longitude
          type: number
        start_date:
          format: date
          title: Start Date
          type: string
        tenant_id:
          default: default
          description: معرف المستأجر
          title: Tenant Id
          type: string
      required:
      - field_id
      - latitude
      - longitude
      title: RealAnalysisRequest
      type: object
    SatelliteBand:
      properties:
        band_name:
          title: Band Name
          type: string
        resolution_m:
          title: Resolution M
          type: integer
        value:
          title: Value
          type: number
        wavelength_nm:
          title: Wavelength Nm
          type: string
      required:
      - band_name
      - wavelength_nm
      - resolution_m
      - value
      title: SatelliteBand
      type: object
    SatelliteImagery:
      properties:
        acquisition_date:
          format: date-time
          title: Acquisition Date
          type: string
        bands:
          items:
            $ref: '#/components/schemas/SatelliteBand'
          title: Bands
          type: array
        cloud_cover_percent:
          title: Cloud Cover Percent
          type: number
        field_id:
          title: Field Id
          type: string
        imagery_id:
          title: Imagery Id
          type: string
        processing_level:
          title: Processing Level
          type: string
        satellite:
          $ref: '#/components/schemas/SatelliteSource'
        scene_id:
          title: Scene Id
          type: string
        sun_elevation:
          title: Sun Elevation
          type: number
        tile_id:
          title: Tile Id
          type: string
      required:
      - imagery_id
      - field_id
      - satellite
      - acquisition_date
      - cloud_cover_percent
      - sun_elevation
      - bands
      - scene_id
      - tile_id
      - processing_level
      title: SatelliteImagery
      type: object
    SatelliteSource:
      enum:
      - sentinel-2
      - landsat-8
      - landsat-9
      - modis
      title: SatelliteSource
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VegetationIndices:
      properties:
        evi:
          description: Enhanced Vegetation Index
          title: Evi
          type: number
        lai:
          description: Leaf Area Index estimate
          minimum: 0.0
          title: Lai
          type: number
        ndmi:
          description: Normalized Difference Moisture Index
          maximum: 1.0
          minimum: -1.0
          title: Ndmi
          type: number
        ndvi:
          description: Normalized Difference Vegetation Index
          maximum: 1.0
          minimum: -1.0
          title: Ndvi
          type: number
        ndwi:
          description: Normalized Difference Water Index
          maximum: 1.0
          minimum: -1.0
          title: Ndwi
          type: number
        savi:
          description: Soil Adjusted Vegetation Index
          title: Savi
          type: number
      required:
      - ndvi
      - ndwi
      - evi
      - savi
      - lai
      - ndmi
      title: VegetationIndices
      type: object
    YieldPredictionRequest:
      description: Request for crop yield prediction
      properties:
        avg_temp_max:
          anyOf:
          - type: number
          - type: 'null'
          description: متوسط درجة الحرارة الكبرى (°س)
          title: Avg Temp Max
        avg_temp_min:
          anyOf:
          - type: number
          - type: 'null'
          description: متوسط درجة الحرارة الصغرى (°س)
          title: Avg Temp Min
        crop_code:
          description: رمز المحصول (WHEAT, TOMATO, etc.)
          title: Crop Code
          type: string
        field_area_ha:
          default: 1.0
          description: مساحة الحقل بالهكتار
          minimum: 0.01
          title: Field Area Ha
          type: number
        field_id:
          description: معرف الحقل
          title: Field Id
          type: string
        latitude:
          maximum: 90.0
          minimum: -90.0
          title: Latitude
          type: number
        longitude:
          maximum: 180.0
          minimum: -180.0
          title: Longitude
          type: number
        ndvi_series:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          description: سلسلة زمنية من قيم NDVI (اختياري - سيتم جلبها تلقائياً إذا لم تقدم)
          title: Ndvi Series
        planting_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: تاريخ الزراعة
          title: Planting Date
        precipitation_mm:
          anyOf:
          - type: number
          - type: 'null'
          description: الأمطار الكلية (مم)
          title: Precipitation Mm
        soil_moisture:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: رطوبة التربة (0-1)
          title: Soil Moisture
      required:
      - field_id
      - crop_code
      - latitude
      - longitude
      title: YieldPredictionRequest
      type: object
    YieldPredictionResponse:
      description: Response for crop yield prediction
      properties:
        comparison_to_average:
          title: Comparison To Average
          type: number
        comparison_to_base:
          title: Comparison To Base
          type: number
        confidence:
          title: Confidence
          type: number
        crop_code:
          title: Crop Code
          type: string
        crop_name_ar:
          title: Crop Name Ar
          type: string
        crop_name_en:
          title: Crop Name En
          type: string
        data_sources_used:
          items:
            type: string
          title: Data Sources Used
          type: array
        days_to_harvest:
          anyOf:
          - type: integer
          - type: 'null'
          title: Days To Harvest
        factors:
          additionalProperties:
            type: number
          title: Factors
          type: object
        field_id:
          title: Field Id
          type: string
        growth_stage:
          title: Growth Stage
          type: string
        predicted_yield_ton_ha:
          title: Predicted Yield Ton Ha
          type: number
        predicted_yield_total_ton:
          title: Predicted Yield Total Ton
          type: number
        prediction_date:
          title: Prediction Date
          type: string
        recommendations_ar:
          items:
            type: string
          title: Recommendations Ar
          type: array
        recommendations_en:
          items:
            type: string
          title: Recommendations En
          type: array
        yield_range_max:
          title: Yield Range Max
          type: number
        yield_range_min:
          title: Yield Range Min
          type: number
      required:
      - field_id
      - crop_code
      - crop_name_ar
      - crop_name_en
      - predicted_yield_ton_ha
      - predicted_yield_total_ton
      - yield_range_min
      - yield_range_max
      - confidence
      - factors
      - comparison_to_average
      - comparison_to_base
      - recommendations_ar
      - recommendations_en
      - prediction_date
      - growth_stage
      - days_to_harvest
      - data_sources_used
      title: YieldPredictionResponse
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: Multi-provider satellite monitoring with automatic fallback. Supports Sentinel Hub, Copernicus STAC, NASA Earthdata. Includes Sentinel-1 SAR for soil moisture estimation. Now with GDD (Growing Degree Days) tracking for 40+ Yemen crops.
  title: SAHOOL Satellite Service | خدمة الأقمار الصناعية
  version: 16.0.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      description: Health check endpoint with comprehensive dependency status
      operationId: health_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /metrics:
    get:
      description: Prometheus metrics endpoint
      operationId: metrics_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Metrics
  /readyz:
    get:
      description: Kubernetes readiness probe - is the service ready to accept traffic?
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
  /v1/analyze:
    post:
      description: تحليل شامل للحقل باستخدام بيانات الأقمار الصناعية
      operationId: analyze_field_v1_analyze_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldAnalysis'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Analyze Field
  /v1/analyze-with-action:
    post:
      description: 'تحليل الحقل مع إنتاج ActionTemplate


        Field-First: ينتج قالب إجراء للتطبيق المحمول

        ينشر الحدث عبر NATS للإشعارات الفورية'
      operationId: analyze_field_with_action_v1_analyze_with_action_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeWithActionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Analyze Field With Action
  /v1/analyze/real:
    post:
      description: 'تحليل الحقل باستخدام بيانات الأقمار الصناعية الحقيقية


        يستخدم sahool-eo و Sentinel Hub للحصول على بيانات حقيقية.

        إذا لم تكن الاعتمادات مكونة، يعود إلى البيانات المحاكاة.'
      operationId: analyze_field_real_v1_analyze_real_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealAnalysisRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Analyze Field Real
  /v1/best-observation/{field_id}:
    get:
      description: "Find the best (lowest cloud) observation near target date\nالبحث عن أفضل رصد (أقل غيوم) قريب من التاريخ المستهدف\n\nReturns the highest quality observation within tolerance window.\nUseful for finding best image for a specific date.\n\nExample:\n    GET /v1/best-observation/field_123?lat=15.5&lon=44.2&target_date=2024-02-15&tolerance_days=10"
      operationId: get_best_observation_v1_best_observation__field_id__get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      - description: Field latitude
        in: query
        name: lat
        required: true
        schema:
          description: Field latitude
          maximum: 90
          minimum: -90
          title: Lat
          type: number
      - description: Field longitude
        in: query
        name: lon
        required: true
        schema:
          description: Field longitude
          maximum: 180
          minimum: -180
          title: Lon
          type: number
      - description: Target date (YYYY-MM-DD)
        in: query
        name: target_date
        required: true
        schema:
          description: Target date (YYYY-MM-DD)
          title: Target Date
          type: string
      - description: Days before/after to search
        in: query
        name: tolerance_days
        required: false
        schema:
          default: 15
          description: Days before/after to search
          maximum: 90
          minimum: 1
          title: Tolerance Days
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Best Observation
  /v1/cache/health:
    get:
      description: فحص صحة الـCache
      operationId: cache_health_v1_cache_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Cache Health
  /v1/cache/stats:
    get:
      description: إحصائيات الـCache
      operationId: cache_statistics_v1_cache_stats_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Cache Statistics
  /v1/changes/{field_id}:
    get:
      description: "كشف التغييرات الزراعية | Detect Agricultural Changes\n\nAnalyzes satellite time series to detect significant changes in agricultural fields:\n- Vegetation growth or decline\n- Water stress and drought\n- Flooding events\n- Harvest and planting detection\n- Crop damage from pests/weather\n- Land clearing\n\nReturns comprehensive report with detected events, trends, and recommendations.\n\nExample:\n    GET /v1/changes/field_123?lat=15.5&lon=44.2&start_date=2024-01-01&end_date=2024-03-31&crop_type=wheat"
      operationId: detect_changes_v1_changes__field_id__get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      - description: Field latitude
        in: query
        name: lat
        required: true
        schema:
          description: Field latitude
          maximum: 90
          minimum: -90
          title: Lat
          type: number
      - description: Field longitude
        in: query
        name: lon
        required: true
        schema:
          description: Field longitude
          maximum: 180
          minimum: -180
          title: Lon
          type: number
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        required: true
        schema:
          description: Start date (YYYY-MM-DD)
          title: Start Date
          type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end_date
        required: true
        schema:
          description: End date (YYYY-MM-DD)
          title: End Date
          type: string
      - description: Crop type (e.g., wheat, sorghum, coffee, qat)
        in: query
        name: crop_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Crop type (e.g., wheat, sorghum, coffee, qat)
