  /v1/gdd/chart/{field_id}:
    get:
      description: "مخطط وحدات الحرارة النامية | Get GDD Accumulation Chart\n\nGet comprehensive GDD tracking chart for a field from planting to current date.\n\n**Features:**\n- Daily GDD accumulation from planting\n- Growth stage identification\n- Milestone tracking (emergence, flowering, harvest)\n- Harvest date prediction\n- Comparison to historical normal\n- Visual chart data for mobile app\n\n**Calculation Methods:**\n- `simple`: (Tmax + Tmin) / 2 - Tbase (fastest, most common)\n- `modified`: Apply upper/lower cutoffs (more accurate for extreme temps)\n- `sine`: Sine wave approximation (most accurate, slower)\n\n**Supported Crops:**\n- Cereals: WHEAT, BARLEY, CORN, SORGHUM, MILLET\n- Vegetables: TOMATO, POTATO, ONION, CUCUMBER, PEPPER\n- Legumes: FABA_BEAN, LENTIL, CHICKPEA\n- Cash: COTTON, COFFEE, QAT\n- Fruits: DATE_PALM, GRAPE, MANGO\n- Fodder: ALFALFA\n\n**Example:**\n```\nGET /v1/gdd/chart/field123?crop_code=WHEAT&planting_date=2024-03-01&lat=15.37&lon=44.19\n```\n\n**Returns:**\n```json\n{\n  \"field_id\": \"field123\",\n  \"crop\": {\"code\": \"WHEAT\", \"name_ar\": \"قمح\", \"name_en\": \"Wheat\"},\n  \"planting_date\": \"2024-03-01\",\n  \"current_status\": {\n    \"date\": \"2024-05-15\",\n    \"total_gdd\": 1247.5,\n    \"days_since_planting\": 75,\n    \"avg_daily_gdd\": 16.6\n  },\n  \"current_stage\": {\n    \"name_en\": \"Flowering\",\n    \"name_ar\": \"الإزهار\",\n    \"next_stage_en\": \"Grain Fill\",\n    \"next_stage_ar\": \"امتلاء الحبوب\",\n    \"gdd_to_next_stage\": 252.5\n  },\n  \"milestones\": [...],\n  \"harvest_prediction\": {\n    \"estimated_date\": \"2024-06-20\",\n    \"gdd_remaining\": 752.5,\n    \"days_remaining\": 36\n  },\n  \"comparison\": {\n    \"vs_normal_percent\": 8.5,\n    \"description_ar\": \"متقدم بنسبة 8.5% عن المعدل الطبيعي\",\n    \"description_en\": \"8.5% ahead of normal\"\n  },\n  \"daily_data\": [...]\n}\n```\n\n**Use Cases:**\n- Track crop development progress\n- Predict flowering and harvest dates\n- Plan field operations (fertilization, irrigation)\n- Compare current season to normal\n- Optimize harvest timing\n- Mobile app charts and progress bars"
      operationId: get_gdd_chart_v1_gdd_chart__field_id__get
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      - description: Crop code (e.g., 'WHEAT', 'TOMATO')
        in: query
        name: crop_code
        required: true
        schema:
          description: Crop code (e.g., 'WHEAT', 'TOMATO')
          title: Crop Code
          type: string
      - description: Planting date (YYYY-MM-DD)
        in: query
        name: planting_date
        required: true
        schema:
          description: Planting date (YYYY-MM-DD)
          title: Planting Date
          type: string
      - description: Field latitude
        in: query
        name: lat
        required: true
        schema:
          description: Field latitude
          maximum: 90
          minimum: -90
          title: Lat
          type: number
      - description: Field longitude
        in: query
        name: lon
        required: true
        schema:
          description: Field longitude
          maximum: 180
          minimum: -180
          title: Lon
          type: number
      - description: 'End date (default: today)'
        in: query
        name: end_date
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'End date (default: today)'
          title: End Date
      - description: 'Calculation method: simple, modified, sine'
        in: query
        name: method
        required: false
        schema:
          default: simple
          description: 'Calculation method: simple, modified, sine'
          title: Method
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Gdd Chart
  /v1/gdd/crops:
    get:
      description: "قائمة المحاصيل | List All Supported Crops\n\nGet list of all crops with GDD tracking support.\n\n**40+ Yemen Crops:**\n\n**Cereals (الحبوب):**\n- Wheat, Barley, Corn, Sorghum, Millet, Rice\n\n**Vegetables (الخضروات):**\n- Tomato, Potato, Onion, Carrot, Cucumber, Squash\n- Pepper, Eggplant, Okra, Cabbage, Lettuce\n\n**Legumes (البقوليات):**\n- Faba Bean, Lentil, Chickpea, Cowpea, Peanut, Alfalfa\n\n**Cash Crops (المحاصيل النقدية):**\n- Cotton, Coffee, Qat, Sesame, Tobacco\n\n**Fruits (الفواكه):**\n- Date Palm, Grape, Mango, Banana, Papaya\n- Citrus, Pomegranate, Fig, Guava\n\n**Fodder (الأعلاف):**\n- Alfalfa, Rhodes Grass, Sudan Grass\n\n**Response:**\n```json\n[\n  {\n    \"crop_code\": \"WHEAT\",\n    \"crop_name_ar\": \"قمح\",\n    \"crop_name_en\": \"Wheat\",\n    \"base_temp_c\": 0,\n    \"upper_temp_c\": 30,\n    \"total_gdd_required\": 2000,\n    \"num_stages\": 8\n  },\n  ...\n]\n```"
