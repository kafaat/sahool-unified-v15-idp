  /v1/weather/gdd:
    get:
      summary: Get Gdd
      description: 'وحدات الحرارة النامية | Calculate Growing Degree Days (GDD)


        Calculate accumulated Growing Degree Days for crop phenology tracking.


        **GDD Formula:**

        GDD = Σ(max(0, (Tmax + Tmin)/2 - Tbase))


        **Base Temperatures:**

        - Most crops: 10°C (default)

        - Warm-season crops (corn, tomato): 10-12°C

        - Cool-season crops (wheat, barley): 5-8°C

        - Tropical crops (mango, banana): 12-15°C


        **Use Cases:**

        - Predict flowering/harvest dates

        - Track crop development stages

        - Compare seasons

        - Schedule field operations


        **Example:**

        ```

        GET /v1/weather/gdd?lat=15.37&lon=44.19&start_date=2024-03-01&end_date=2024-06-30&base_temp=10

        ```'
      operationId: get_gdd_v1_weather_gdd_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Latitude
          title: Lat
        description: Latitude
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          description: Longitude
          title: Lon
        description: Longitude
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          description: Start date (YYYY-MM-DD)
          title: Start Date
        description: Start date (YYYY-MM-DD)
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          description: End date (YYYY-MM-DD)
          title: End Date
        description: End date (YYYY-MM-DD)
      - name: base_temp
        in: query
        required: false
        schema:
          type: number
          maximum: 20
          minimum: 0
          description: Base temperature (°C)
          default: 10.0
          title: Base Temp
        description: Base temperature (°C)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/weather/water-balance:
    get:
      summary: Get Water Balance
      description: 'الميزان المائي | Calculate Water Balance


        Calculate water balance: Precipitation - (ET0 × Kc)


        Returns water deficit or surplus in mm, critical for irrigation scheduling.


        **Crop Coefficients (Kc) by Growth Stage:**


        **Cereals (Wheat, Barley):**

        - Initial: 0.3-0.5

        - Mid-season: 1.0-1.15

        - Late: 0.3-0.5


        **Vegetables (Tomato, Potato):**

        - Initial: 0.4-0.6

        - Mid-season: 1.05-1.25

        - Late: 0.7-0.9


        **Fruit Trees (Mango, Date):**

        - Year-round: 0.8-1.1


        **Water Balance Status:**

        - Surplus (> +50mm): Reduce irrigation

        - Balanced (-50 to +50mm): Optimal

        - Deficit (< -50mm): Increase irrigation


        **Example:**

        ```

        GET /v1/weather/water-balance?lat=15.37&lon=44.19&start_date=2024-03-01&end_date=2024-06-30&kc=1.0

        ```'
      operationId: get_water_balance_v1_weather_water_balance_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Latitude
          title: Lat
        description: Latitude
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          description: Longitude
          title: Lon
        description: Longitude
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          description: Start date (YYYY-MM-DD)
          title: Start Date
        description: Start date (YYYY-MM-DD)
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          description: End date (YYYY-MM-DD)
          title: End Date
        description: End date (YYYY-MM-DD)
      - name: kc
        in: query
        required: false
        schema:
          type: number
          maximum: 1.3
          minimum: 0.4
          description: Crop coefficient (0.4-1.3)
          default: 1.0
          title: Kc
        description: Crop coefficient (0.4-1.3)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/weather/irrigation-advice:
    get:
      summary: Get Irrigation Advice
      description: 'نصائح الري | Get Irrigation Recommendation


        Get irrigation recommendation based on:

        - 7-day weather forecast with ET0

        - Crop type and growth stage

        - Current soil moisture (if available)


        Returns:

        - Water requirement (mm)

        - Irrigation schedule (frequency in days)

        - Specific recommendations in Arabic and English


        **Growth Stages:**

        - `initial`: Germination/establishment (Kc ~0.5)

        - `development`: Vegetative growth (Kc ~0.7)

        - `mid`: Flowering/peak growth (Kc ~1.0-1.2)

        - `late`: Ripening/maturation (Kc ~0.8)

        - `harvest`: Pre-harvest (Kc ~0.6)


        **Yemen Crop Examples:**

        - Wheat: WHEAT

        - Tomato: TOMATO

        - Potato: POTATO

        - Sorghum: SORGHUM

        - Coffee: COFFEE


        **Example:**

        ```

        GET /v1/weather/irrigation-advice?lat=15.37&lon=44.19&crop_type=WHEAT&growth_stage=mid&soil_moisture=0.4

        ```'
      operationId: get_irrigation_advice_v1_weather_irrigation_advice_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Latitude
          title: Lat
        description: Latitude
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          description: Longitude
          title: Lon
        description: Longitude
      - name: crop_type
        in: query
        required: true
        schema:
          type: string
          description: Crop code (e.g., 'WHEAT', 'TOMATO')
          title: Crop Type
        description: Crop code (e.g., 'WHEAT', 'TOMATO')
      - name: growth_stage
        in: query
        required: true
        schema:
          type: string
          description: Growth stage (initial, development, mid, late, harvest)
          title: Growth Stage
        description: Growth stage (initial, development, mid, late, harvest)
      - name: soil_moisture
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 1
            minimum: 0
          - type: 'null'
          description: Current soil moisture (0-1)
          title: Soil Moisture
        description: Current soil moisture (0-1)
      - name: field_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Field identifier
          title: Field Id
        description: Field identifier
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/weather/frost-risk:
    get:
      summary: Get Frost Risk
      description: 'مخاطر الصقيع | Assess Frost Risk


        Assess frost risk for next N days.


        **Critical for Yemen Highlands:**

        - Sanaa (1,900m elevation): Regular frost in winter

        - Ibb (2,200m elevation): Frost risk Dec-Feb

        - Dhamar (2,400m elevation): High frost risk

        - Taiz (1,400m): Occasional frost


        **Frost Risk Levels:**

        - **Severe** (< -2°C, 95%+ probability): Immediate protection needed

        - **High** (-2°C to 0°C, 70-95% probability): Protect sensitive crops

        - **Moderate** (0°C to 2°C, 40-70% probability): Monitor and prepare

        - **Low** (2°C to 5°C, 10-40% probability): Watch forecasts

        - **None** (> 5°C, <10% probability): No action needed


        **Frost Protection Methods:**

        - Cover crops with plastic sheets or blankets

        - Use smoke/heating for orchards

        - Irrigate before frost (wet soil holds heat)

        - Avoid low-lying areas (cold air pools)


        **Example:**

        ```

        GET /v1/weather/frost-risk?lat=15.3694&lon=44.1910&days=7

        ```'
      operationId: get_frost_risk_v1_weather_frost_risk_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Latitude
          title: Lat
        description: Latitude
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          description: Longitude
          title: Lon
        description: Longitude
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 16
          minimum: 1
          description: Forecast days (1-16)
          default: 7
          title: Days
        description: Forecast days (1-16)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/gdd/chart/{field_id}:
    get:
      summary: Get Gdd Chart
      description: "مخطط وحدات الحرارة النامية | Get GDD Accumulation Chart\n\nGet\
        \ comprehensive GDD tracking chart for a field from planting to current date.\n\
        \n**Features:**\n- Daily GDD accumulation from planting\n- Growth stage identification\n\
        - Milestone tracking (emergence, flowering, harvest)\n- Harvest date prediction\n\
        - Comparison to historical normal\n- Visual chart data for mobile app\n\n\
        **Calculation Methods:**\n- `simple`: (Tmax + Tmin) / 2 - Tbase (fastest,\
        \ most common)\n- `modified`: Apply upper/lower cutoffs (more accurate for\
        \ extreme temps)\n- `sine`: Sine wave approximation (most accurate, slower)\n\
        \n**Supported Crops:**\n- Cereals: WHEAT, BARLEY, CORN, SORGHUM, MILLET\n\
        - Vegetables: TOMATO, POTATO, ONION, CUCUMBER, PEPPER\n- Legumes: FABA_BEAN,\
        \ LENTIL, CHICKPEA\n- Cash: COTTON, COFFEE, QAT\n- Fruits: DATE_PALM, GRAPE,\
        \ MANGO\n- Fodder: ALFALFA\n\n**Example:**\n```\nGET /v1/gdd/chart/field123?crop_code=WHEAT&planting_date=2024-03-01&lat=15.37&lon=44.19\n\
        ```\n\n**Returns:**\n```json\n{\n  \"field_id\": \"field123\",\n  \"crop\"\
        : {\"code\": \"WHEAT\", \"name_ar\": \"قمح\", \"name_en\": \"Wheat\"},\n \
        \ \"planting_date\": \"2024-03-01\",\n  \"current_status\": {\n    \"date\"\
        : \"2024-05-15\",\n    \"total_gdd\": 1247.5,\n    \"days_since_planting\"\
        : 75,\n    \"avg_daily_gdd\": 16.6\n  },\n  \"current_stage\": {\n    \"name_en\"\
        : \"Flowering\",\n    \"name_ar\": \"الإزهار\",\n    \"next_stage_en\": \"\
        Grain Fill\",\n    \"next_stage_ar\": \"امتلاء الحبوب\",\n    \"gdd_to_next_stage\"\
        : 252.5\n  },\n  \"milestones\": [...],\n  \"harvest_prediction\": {\n   \
        \ \"estimated_date\": \"2024-06-20\",\n    \"gdd_remaining\": 752.5,\n   \
        \ \"days_remaining\": 36\n  },\n  \"comparison\": {\n    \"vs_normal_percent\"\
        : 8.5,\n    \"description_ar\": \"متقدم بنسبة 8.5% عن المعدل الطبيعي\",\n\
        \    \"description_en\": \"8.5% ahead of normal\"\n  },\n  \"daily_data\"\
        : [...]\n}\n```\n\n**Use Cases:**\n- Track crop development progress\n- Predict\
        \ flowering and harvest dates\n- Plan field operations (fertilization, irrigation)\n\
        - Compare current season to normal\n- Optimize harvest timing\n- Mobile app\
        \ charts and progress bars"
      operationId: get_gdd_chart_v1_gdd_chart__field_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: field_id
        in: path
        required: true
        schema:
          type: string
          title: Field Id
      - name: crop_code
        in: query
        required: true
        schema:
          type: string
          description: Crop code (e.g., 'WHEAT', 'TOMATO')
          title: Crop Code
        description: Crop code (e.g., 'WHEAT', 'TOMATO')
      - name: planting_date
        in: query
        required: true
        schema:
          type: string
          description: Planting date (YYYY-MM-DD)
          title: Planting Date
        description: Planting date (YYYY-MM-DD)
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Field latitude
          title: Lat
        description: Field latitude
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          description: Field longitude
          title: Lon
        description: Field longitude
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'End date (default: today)'
          title: End Date
        description: 'End date (default: today)'
      - name: method
        in: query
        required: false
        schema:
          type: string
          description: 'Calculation method: simple, modified, sine'
          default: simple
          title: Method
        description: 'Calculation method: simple, modified, sine'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/gdd/forecast:
    get:
      summary: Get Gdd Forecast
      description: "توقع وحدات الحرارة النامية | Forecast GDD Accumulation\n\nForecast\
        \ when a target GDD will be reached using weather forecast.\n\n**Use Cases:**\n\
        - Predict flowering date: \"When will we reach 1300 GDD?\"\n- Estimate harvest\
        \ date: \"When will we reach 2000 GDD?\"\n- Plan irrigation: \"When will next\
        \ growth stage begin?\"\n- Schedule fertilization: \"When to apply nitrogen?\"\
        \n\n**How it Works:**\n1. Takes current accumulated GDD\n2. Uses 16-day weather\
        \ forecast to project future GDD\n3. Calculates daily GDD accumulation\n4.\
        \ Estimates date when target will be reached\n5. If target beyond forecast,\
        \ uses historical average to extrapolate\n\n**Example Use Case - Wheat Flowering:**\n\
        ```\nWheat planted March 1, currently at 1100 GDD (May 10).\nFlowering requires\
        \ 1500 GDD.\nWhen will flowering occur?\n\nGET /v1/gdd/forecast?lat=15.37&lon=44.19&current_gdd=1100&target_gdd=1500&base_temp=0\n\
        ```\n\n**Example Response:**\n```json\n{\n  \"current_gdd\": 1100,\n  \"target_gdd\"\
        : 1500,\n  \"gdd_needed\": 400,\n  \"estimated_date\": \"2024-05-28\",\n \
        \ \"is_estimated\": false,\n  \"forecast_data\": [\n    {\"date\": \"2024-05-11\"\
        , \"daily_gdd\": 18.5, \"accumulated_gdd\": 1118.5},\n    {\"date\": \"2024-05-12\"\
        , \"daily_gdd\": 17.2, \"accumulated_gdd\": 1135.7},\n    ...\n  ]\n}\n```\n\
        \n**Integration with Mobile App:**\n- Show countdown to next milestone\n-\
        \ Display progress bars\n- Push notifications when stages reached\n- Update\
        \ field task scheduling"
      operationId: get_gdd_forecast_v1_gdd_forecast_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Latitude
          title: Lat
        description: Latitude
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          description: Longitude
          title: Lon
        description: Longitude
      - name: current_gdd
        in: query
        required: true
        schema:
          type: number
          minimum: 0
          description: Current accumulated GDD
          title: Current Gdd
        description: Current accumulated GDD
      - name: target_gdd
        in: query
        required: true
        schema:
          type: number
          minimum: 0
          description: Target GDD to reach
          title: Target Gdd
        description: Target GDD to reach
      - name: base_temp
        in: query
        required: false
        schema:
          type: number
          maximum: 20
          minimum: 0
          description: Base temperature (°C)
          default: 10.0
          title: Base Temp
        description: Base temperature (°C)
      - name: upper_temp
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 45
            minimum: 20
          - type: 'null'
          description: Upper cutoff temp (°C)
          title: Upper Temp
        description: Upper cutoff temp (°C)
      - name: method
        in: query
        required: false
        schema:
          type: string
          description: 'Calculation method: simple, modified, sine'
          default: simple
          title: Method
        description: 'Calculation method: simple, modified, sine'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/gdd/requirements/{crop_code}:
    get:
      summary: Get Crop Gdd Requirements
      description: "متطلبات المحصول | Get Crop GDD Requirements\n\nGet complete GDD\
        \ requirements and growth stages for a crop.\n\n**What You Get:**\n- Base\
        \ temperature for the crop\n- Upper cutoff temperature (if applicable)\n-\
        \ Total GDD required from planting to harvest\n- All growth stages with GDD\
        \ thresholds\n- Stage descriptions in Arabic and English\n\n**Use Cases:**\n\
        - Understand crop development timeline\n- Plan planting dates\n- Estimate\
        \ season length\n- Compare different crops\n- Educational content for farmers\n\
        \n**Example:**\n```\nGET /v1/gdd/requirements/WHEAT\n```\n\n**Response:**\n\
        ```json\n{\n  \"crop_code\": \"WHEAT\",\n  \"crop_name_ar\": \"قمح\",\n  \"\
        crop_name_en\": \"Wheat\",\n  \"base_temp_c\": 0,\n  \"upper_temp_c\": 30,\n\
        \  \"total_gdd_required\": 2000,\n  \"stages\": [\n    {\n      \"name_en\"\
        : \"Emergence\",\n      \"name_ar\": \"الإنبات\",\n      \"gdd_start\": 0,\n\
        \      \"gdd_end\": 150,\n      \"gdd_duration\": 150,\n      \"description_ar\"\
        : \"ظهور البادرات\",\n      \"description_en\": \"Seedling emergence\"\n \
        \   },\n    ...\n  ]\n}\n```\n\n**All Yemen Crops Supported:**\n- 6 Cereals\
        \ (wheat, barley, corn, sorghum, millet, rice)\n- 11 Vegetables (tomato, potato,\
        \ onion, cucumber, pepper, etc.)\n- 6 Legumes (faba bean, lentil, chickpea,\
        \ etc.)\n- 5 Cash crops (cotton, coffee, qat, sesame, tobacco)\n- 9 Fruits\
        \ (date palm, grape, mango, banana, citrus, etc.)\n- 3 Fodder crops (alfalfa,\
        \ rhodes grass, sudan grass)\n\n**40+ crops total!**"
      operationId: get_crop_gdd_requirements_v1_gdd_requirements__crop_code__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: crop_code
        in: path
        required: true
        schema:
          type: string
          title: Crop Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
