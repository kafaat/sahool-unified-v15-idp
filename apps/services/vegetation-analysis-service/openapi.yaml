  /v1/spray/forecast:
    get:
      summary: Get Spray Forecast
      description: "توقعات أوقات الرش | Get Spray Time Forecast\n\nGet spray time\
        \ recommendations for next N days based on weather conditions.\n\nIdentifies\
        \ optimal spray windows during daylight hours (6 AM - 6 PM) considering:\n\
        - **Temperature**: 10-30°C ideal (varies by product)\n- **Humidity**: 40-80%\
        \ ideal\n- **Wind Speed**: < 15 km/h (prevents drift)\n- **Rain Probability**:\
        \ < 20% (prevents wash-off)\n- **Delta-T**: 2-8°C optimal (wet bulb depression)\n\
        \n**Product Types:**\n- `herbicide`: Higher temp needed (15-28°C), longer\
        \ rain-free period (6h)\n- `insecticide`: Lower wind tolerance (<10 km/h)\n\
        - `fungicide`: Lower humidity preferred (<70%)\n- `foliar_fertilizer`: Higher\
        \ humidity needed (>60%)\n- `growth_regulator`: Moderate conditions (15-25°C)\n\
        \n**Spray Conditions:**\n- `excellent` (score 85-100): Perfect conditions\n\
        - `good` (score 70-84): Safe to spray\n- `marginal` (score 50-69): Some risk,\
        \ use caution\n- `poor` (score 30-49): Not recommended\n- `dangerous` (score\
        \ 0-29): Do not spray\n\n**Example:**\n```\nGET /v1/spray/forecast?lat=15.3694&lon=44.1910&days=7&product_type=herbicide\n\
        ```\n\n**Returns:**\n```json\n[\n  {\n    \"date\": \"2024-12-25\",\n    \"\
        overall_condition\": \"good\",\n    \"best_window\": {\n      \"start_time\"\
        : \"2024-12-25T07:00:00\",\n      \"end_time\": \"2024-12-25T11:00:00\",\n\
        \      \"duration_hours\": 4,\n      \"condition\": \"good\",\n      \"score\"\
        : 78.5,\n      \"weather\": {...},\n      \"risks\": [\"low_humidity\"],\n\
        \      \"recommendations_ar\": [...],\n      \"recommendations_en\": [...]\n\
        \    },\n    \"all_windows\": [...],\n    \"hours_suitable\": 6.5,\n    \"\
        daily_summary\": {...}\n  }\n]\n```"
      operationId: get_spray_forecast_v1_spray_forecast_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Latitude
          title: Lat
        description: Latitude
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          description: Longitude
          title: Lon
        description: Longitude
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 16
          minimum: 1
          description: Forecast days (1-16)
          default: 7
          title: Days
        description: Forecast days (1-16)
      - name: product_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Product type: herbicide, insecticide, fungicide, foliar_fertilizer,
            growth_regulator'
          title: Product Type
        description: 'Product type: herbicide, insecticide, fungicide, foliar_fertilizer,
          growth_regulator'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
