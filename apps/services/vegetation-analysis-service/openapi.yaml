        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Product type: herbicide, insecticide, fungicide, foliar_fertilizer, growth_regulator'
          title: Product Type
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
