components:
  schemas:
    CropETcResponse:
      description: Crop evapotranspiration response
      properties:
        critical_period:
          title: Critical Period
          type: boolean
        crop_name_ar:
          title: Crop Name Ar
          type: string
        crop_type:
          title: Crop Type
          type: string
        daily_water_need_liters:
          title: Daily Water Need Liters
          type: number
        daily_water_need_m3:
          title: Daily Water Need M3
          type: number
        et0:
          description: Reference ET (mm/day)
          title: Et0
          type: number
        etc:
          description: Crop ET (mm/day)
          title: Etc
          type: number
        growth_stage:
          title: Growth Stage
          type: string
        kc:
          description: Crop coefficient
          title: Kc
          type: number
        notes:
          title: Notes
          type: string
        notes_ar:
          title: Notes Ar
          type: string
        weekly_water_need_m3:
          title: Weekly Water Need M3
          type: number
      required:
      - crop_type
      - crop_name_ar
      - growth_stage
      - kc
      - et0
      - etc
      - daily_water_need_liters
      - daily_water_need_m3
      - weekly_water_need_m3
      - critical_period
      - notes
      - notes_ar
      title: CropETcResponse
      type: object
    ET0Response:
      description: Reference evapotranspiration response
      properties:
        calculation_date:
          format: date
          title: Calculation Date
          type: string
        et0:
          description: Reference ET (mm/day)
          title: Et0
          type: number
        et0_ar:
          title: Et0 Ar
          type: string
        method:
          title: Method
          type: string
        weather_summary:
          additionalProperties: true
          title: Weather Summary
          type: object
      required:
      - et0
      - et0_ar
      - method
      - weather_summary
      - calculation_date
      title: ET0Response
      type: object
    GrowthStage:
      description: Crop growth stages for Kc determination
      enum:
      - initial
      - development
      - mid_season
      - late_season
      title: GrowthStage
      type: string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    IrrigationMethod:
      description: Irrigation methods
      enum:
      - drip
      - sprinkler
      - surface
      - flood
      - furrow
      title: IrrigationMethod
      type: string
    IrrigationRecommendation:
      description: Complete irrigation recommendation response
      properties:
        advice:
          title: Advice
          type: string
        advice_ar:
          title: Advice Ar
          type: string
        crop_name_ar:
          title: Crop Name Ar
          type: string
        crop_type:
          title: Crop Type
          type: string
        estimated_moisture:
          title: Estimated Moisture
          type: number
        et0:
          title: Et0
          type: number
        etc:
          title: Etc
          type: number
        field_area_hectares:
          title: Field Area Hectares
          type: number
        gross_irrigation_mm:
          title: Gross Irrigation Mm
          type: number
        growth_stage:
          title: Growth Stage
          type: string
        irrigation_needed:
          title: Irrigation Needed
          type: boolean
        kc:
          title: Kc
          type: number
        moisture_depletion_percent:
          title: Moisture Depletion Percent
          type: number
        next_irrigation_days:
          title: Next Irrigation Days
          type: integer
        optimal_time:
          title: Optimal Time
          type: string
        optimal_time_ar:
          title: Optimal Time Ar
          type: string
        recommendation_id:
          title: Recommendation Id
          type: string
        recommended_amount_liters:
          title: Recommended Amount Liters
          type: number
        recommended_amount_m3:
          title: Recommended Amount M3
          type: number
        recommended_amount_mm:
          title: Recommended Amount Mm
          type: number
        soil_type:
          title: Soil Type
          type: string
        soil_type_ar:
          title: Soil Type Ar
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        urgency:
          $ref: '#/components/schemas/UrgencyLevel'
        urgency_ar:
          title: Urgency Ar
          type: string
        warnings:
          items:
            type: string
          title: Warnings
          type: array
        warnings_ar:
          items:
            type: string
          title: Warnings Ar
          type: array
      required:
      - recommendation_id
      - timestamp
      - crop_type
      - crop_name_ar
      - growth_stage
      - field_area_hectares
      - et0
      - kc
      - etc
      - soil_type
      - soil_type_ar
      - estimated_moisture
      - moisture_depletion_percent
      - irrigation_needed
      - urgency
      - urgency_ar
      - recommended_amount_mm
      - recommended_amount_liters
      - recommended_amount_m3
      - gross_irrigation_mm
      - optimal_time
      - optimal_time_ar
      - next_irrigation_days
      - advice
      - advice_ar
      - warnings
      - warnings_ar
      title: IrrigationRecommendation
      type: object
    IrrigationRecommendationInput:
      description: Input for irrigation recommendation
      properties:
        crop_type:
          title: Crop Type
          type: string
        current_soil_moisture:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: Current moisture if known (m³/m³)
          title: Current Soil Moisture
        field_area_hectares:
          default: 1.0
          exclusiveMinimum: 0.0
          title: Field Area Hectares
          type: number
        growth_stage:
          $ref: '#/components/schemas/GrowthStage'
        irrigation_method:
          $ref: '#/components/schemas/IrrigationMethod'
        last_irrigation_amount:
          anyOf:
          - maximum: 500.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Last Irrigation Amount
        last_irrigation_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Last Irrigation Date
        soil_type:
          $ref: '#/components/schemas/SoilType'
        weather:
          $ref: '#/components/schemas/WeatherInput'
      required:
      - crop_type
      - growth_stage
      - soil_type
      - irrigation_method
      - weather
      title: IrrigationRecommendationInput
      type: object
    SoilMoistureInput:
      description: Input for virtual soil moisture calculation
      properties:
        daily_etc:
          description: Daily crop ET (mm/day)
          maximum: 25.0
          minimum: 0.0
          title: Daily Etc
          type: number
        last_irrigation_amount:
          description: Irrigation amount (mm)
          maximum: 500.0
          minimum: 0.0
          title: Last Irrigation Amount
          type: number
        last_irrigation_date:
          format: date
          title: Last Irrigation Date
          type: string
        rainfall_since:
          default: 0
          description: Rainfall since last irrigation (mm)
          maximum: 500.0
          minimum: 0.0
          title: Rainfall Since
          type: number
        root_depth:
          default: 0.6
          description: Root depth (m)
          exclusiveMinimum: 0.0
          maximum: 3.0
          title: Root Depth
          type: number
        soil_type:
          $ref: '#/components/schemas/SoilType'
      required:
      - soil_type
      - last_irrigation_date
      - last_irrigation_amount
      - daily_etc
      title: SoilMoistureInput
      type: object
    SoilType:
      description: Soil types common in Yemen
      enum:
      - sandy
      - sandy_loam
      - loam
      - clay_loam
      - clay
      - silty_clay
      title: SoilType
      type: string
    UrgencyLevel:
      description: Irrigation urgency levels
      enum:
      - none
      - low
      - medium
      - high
      - critical
      title: UrgencyLevel
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VirtualSensorActionRequest:
      description: Request for virtual sensor analysis with ActionTemplate output
      properties:
        crop_type:
          description: نوع المحصول
          maxLength: 50
          minLength: 1
          title: Crop Type
          type: string
        farmer_id:
          anyOf:
          - maxLength: 100
            minLength: 1
            pattern: ^[a-zA-Z0-9_\-]+$
            type: string
          - type: 'null'
          description: معرف المزارع
          title: Farmer Id
        field_area_hectares:
          default: 1.0
          description: مساحة الحقل بالهكتار
          exclusiveMinimum: 0.0
          title: Field Area Hectares
          type: number
        field_id:
          description: معرف الحقل - Field identifier (alphanumeric, hyphens, underscores)
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9_\-]+$
          title: Field Id
          type: string
        growth_stage:
          $ref: '#/components/schemas/GrowthStage'
          description: مرحلة النمو
        irrigation_method:
          $ref: '#/components/schemas/IrrigationMethod'
          default: drip
          description: طريقة الري
        last_irrigation_amount:
          anyOf:
          - type: number
          - type: 'null'
          description: كمية آخر ري بالمم
          title: Last Irrigation Amount
        last_irrigation_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: تاريخ آخر ري
          title: Last Irrigation Date
        publish_event:
          default: true
          description: نشر الحدث عبر NATS
          title: Publish Event
          type: boolean
        soil_type:
          $ref: '#/components/schemas/SoilType'
          default: loam
          description: نوع التربة
        tenant_id:
          anyOf:
          - maxLength: 100
            minLength: 1
            pattern: ^[a-zA-Z0-9_\-]+$
            type: string
          - type: 'null'
          description: معرف المستأجر
          title: Tenant Id
        weather:
          $ref: '#/components/schemas/WeatherInput'
          description: بيانات الطقس
      required:
      - field_id
      - crop_type
      - growth_stage
      - weather
      title: VirtualSensorActionRequest
      type: object
    VirtualSoilMoistureResponse:
      description: Virtual soil moisture estimation response
      properties:
        available_water:
          description: Remaining available water (mm)
          title: Available Water
          type: number
        calculation_id:
          title: Calculation Id
          type: string
        days_since_irrigation:
          title: Days Since Irrigation
          type: integer
        estimated_moisture:
          description: Estimated soil moisture (m³/m³)
          title: Estimated Moisture
          type: number
        moisture_percentage:
          description: Available water depletion (%)
          title: Moisture Percentage
          type: number
        status:
          title: Status
          type: string
        status_ar:
          title: Status Ar
          type: string
        total_available_water:
          description: Total available water capacity (mm)
          title: Total Available Water
          type: number
        total_et_loss:
          description: Total ET loss since irrigation (mm)
          title: Total Et Loss
          type: number
        urgency:
          $ref: '#/components/schemas/UrgencyLevel'
      required:
      - calculation_id
      - estimated_moisture
      - moisture_percentage
      - days_since_irrigation
      - total_et_loss
      - available_water
      - total_available_water
      - status
      - status_ar
      - urgency
      title: VirtualSoilMoistureResponse
      type: object
    WeatherInput:
      description: Weather data input for ET0 calculation
      properties:
        altitude:
          default: 0
          description: Altitude above sea level (m)
          maximum: 5000.0
          minimum: -500.0
          title: Altitude
          type: number
        calculation_date:
          description: Date for calculation
          format: date
          title: Calculation Date
          type: string
        humidity:
          description: Relative humidity (%)
          maximum: 100.0
          minimum: 0.0
          title: Humidity
          type: number
        latitude:
          description: Latitude (degrees)
          maximum: 90.0
          minimum: -90.0
          title: Latitude
          type: number
        longitude:
          anyOf:
          - maximum: 180.0
            minimum: -180.0
            type: number
          - type: 'null'
          description: Longitude (degrees)
          title: Longitude
        solar_radiation:
          anyOf:
          - maximum: 130.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: Solar radiation (MJ/m²/day). Max 1500 W/m² peak ≈ 130 MJ/m²/day
          title: Solar Radiation
        sunshine_hours:
          anyOf:
          - maximum: 24.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: Sunshine hours
          title: Sunshine Hours
        temperature_max:
          description: Maximum temperature (°C)
          maximum: 60.0
          minimum: -60.0
          title: Temperature Max
          type: number
        temperature_min:
          description: Minimum temperature (°C)
          maximum: 60.0
          minimum: -60.0
          title: Temperature Min
          type: number
        wind_speed:
          description: Wind speed at 2m height (m/s). Max 400 km/h = 111.12 m/s
          maximum: 111.12
          minimum: 0.0
          title: Wind Speed
          type: number
      required:
      - temperature_max
      - temperature_min
      - humidity
      - wind_speed
      - latitude
      title: WeatherInput
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: "\n    محرك المستشعرات الافتراضية - سهول\n\n    Software-based sensor calculations for smart irrigation management.\n    Provides evapotranspiration calculations, soil moisture estimation,\n    and irrigation recommendations without physical sensors.\n\n    Based on FAO-56 Penman-Monteith methodology.\n    "
  title: Sahool Virtual Sensors Engine
  version: 16.0.0
openapi: 3.1.0
paths:
  /health:
    get:
      description: Health check endpoint with dependency status
      operationId: health_check_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health Check
  /healthz:
    get:
      description: Health check endpoint with dependency status
      operationId: health_check_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health Check
  /metrics:
    get:
      description: Prometheus metrics endpoint
      operationId: prometheus_metrics_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Prometheus Metrics
  /readyz:
    get:
      description: Kubernetes readiness probe - is the service ready to accept traffic?
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
  /v1/crops:
    get:
      description: Get list of supported crops with Kc values
      operationId: get_supported_crops_v1_crops_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Get Supported Crops
  /v1/crops/{crop_type}/kc:
    get:
      description: Get Kc values for a specific crop
      operationId: get_crop_kc_values_v1_crops__crop_type__kc_get
      parameters:
      - in: path
        name: crop_type
        required: true
        schema:
          title: Crop Type
          type: string
      - in: query
        name: growth_stage
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/GrowthStage'
          - type: 'null'
          title: Growth Stage
      - in: query
        name: days_in_stage
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Days In Stage
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Crop Kc Values
  /v1/et0/calculate:
    post:
      description: 'Calculate reference evapotranspiration (ET0) using Penman-Monteith.

        حساب التبخر-نتح المرجعي باستخدام بنمان-مونتيث'
      operationId: calculate_et0_v1_et0_calculate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeatherInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ET0Response'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Calculate Et0
  /v1/etc/calculate:
    post:
      description: 'Calculate crop evapotranspiration (ETc = ET0 × Kc).

        حساب التبخر-نتح للمحصول'
      operationId: calculate_crop_etc_v1_etc_calculate_post
      parameters:
      - description: Crop type
        in: query
        name: crop_type
        required: true
        schema:
          description: Crop type
          title: Crop Type
          type: string
      - description: Current growth stage
        in: query
        name: growth_stage
        required: true
        schema:
          $ref: '#/components/schemas/GrowthStage'
          description: Current growth stage
      - description: Field area in hectares
        in: query
        name: field_area_hectares
        required: false
        schema:
          default: 1.0
          description: Field area in hectares
          exclusiveMinimum: 0
          title: Field Area Hectares
          type: number
      - description: Days in current stage
        in: query
        name: days_in_stage
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Days in current stage
          title: Days In Stage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeatherInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropETcResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Calculate Crop Etc
  /v1/info:
    get:
      description: Get service information
      operationId: service_info_v1_info_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Service Info
  /v1/irrigation-methods:
    get:
      description: Get irrigation methods with efficiencies
      operationId: get_irrigation_methods_v1_irrigation_methods_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Get Irrigation Methods
  /v1/irrigation/quick-check:
    get:
      description: 'Quick irrigation check without full weather data.

        فحص سريع للري بدون بيانات الطقس الكاملة'
      operationId: quick_irrigation_check_v1_irrigation_quick_check_get
      parameters:
      - description: Crop type
        in: query
        name: crop_type
        required: true
        schema:
          description: Crop type
          title: Crop Type
          type: string
      - description: Growth stage
        in: query
        name: growth_stage
        required: true
        schema:
          $ref: '#/components/schemas/GrowthStage'
          description: Growth stage
      - description: Soil type
        in: query
        name: soil_type
        required: false
        schema:
          $ref: '#/components/schemas/SoilType'
          default: loam
          description: Soil type
      - description: Days since last irrigation
        in: query
        name: days_since_irrigation
        required: true
        schema:
          description: Days since last irrigation
          minimum: 0
          title: Days Since Irrigation
          type: integer
      - description: Average temperature (°C)
        in: query
        name: temperature
        required: true
        schema:
          description: Average temperature (°C)
          maximum: 60
          minimum: -60
          title: Temperature
          type: number
      - description: Relative humidity (%)
        in: query
        name: humidity
        required: false
        schema:
          default: 50
          description: Relative humidity (%)
          maximum: 100
          minimum: 0
          title: Humidity
          type: number
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Quick Irrigation Check
  /v1/irrigation/recommend:
    post:
      description: 'Get complete irrigation recommendation.

        الحصول على توصية ري شاملة'
      operationId: get_irrigation_recommendation_v1_irrigation_recommend_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IrrigationRecommendationInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IrrigationRecommendation'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Irrigation Recommendation
  /v1/irrigation/recommend-with-action:
    post:
      description: 'الحصول على توصية ري مع ActionTemplate


        Field-First: ينتج قالب إجراء للتطبيق المحمول

        Badge: تقدير افتراضي (بدون حساس)'
      operationId: get_irrigation_recommendation_with_action_v1_irrigation_recommend_with_action_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualSensorActionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Irrigation Recommendation With Action
  /v1/quick-check-with-action:
    get:
      description: 'فحص سريع مع ActionTemplate


        للبيئات الريفية بدون IoT'
      operationId: quick_check_with_action_v1_quick_check_with_action_get
      parameters:
      - description: معرف الحقل - Field identifier
        in: query
        name: field_id
        required: true
        schema:
          description: معرف الحقل - Field identifier
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9_\-]+$
          title: Field Id
          type: string
      - description: معرف المزارع
        in: query
        name: farmer_id
        required: false
        schema:
          anyOf:
          - maxLength: 100
            minLength: 1
            pattern: ^[a-zA-Z0-9_\-]+$
            type: string
          - type: 'null'
          description: معرف المزارع
          title: Farmer Id
      - description: نوع المحصول
        in: query
        name: crop_type
        required: true
        schema:
          description: نوع المحصول
          title: Crop Type
          type: string
      - description: مرحلة النمو
        in: query
        name: growth_stage
        required: true
        schema:
          $ref: '#/components/schemas/GrowthStage'
          description: مرحلة النمو
      - description: نوع التربة
        in: query
        name: soil_type
        required: false
        schema:
