components:
  schemas:
    ChillHoursRequest:
      description: Chill hours calculation request
      properties:
        base_temp_c:
          default: 7.2
          description: Base temp for simple model
          maximum: 15.0
          minimum: 0.0
          title: Base Temp C
          type: number
        field_id:
          maxLength: 100
          title: Field Id
          type: string
        hourly_temps:
          description: List of hourly temperatures °C
          items:
            type: number
          title: Hourly Temps
          type: array
        model:
          $ref: '#/components/schemas/ChillModel'
          default: utah
          description: 'Model: simple, utah, or dynamic'
        tenant_id:
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
      required:
      - tenant_id
      - field_id
      - hourly_temps
      title: ChillHoursRequest
      type: object
    ChillModel:
      enum:
      - simple
      - utah
      - dynamic
      title: ChillModel
      type: string
    DroughtIndexRequest:
      description: Drought index calculation request
      properties:
        correlation_id:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Correlation Id
        days:
          default: 30
          description: Period in days
          maximum: 365
          minimum: 1
          title: Days
          type: integer
        et0_mm:
          description: Total ET0 mm
          minimum: 0.0
          title: Et0 Mm
          type: number
        field_id:
          default: ''
          maxLength: 100
          title: Field Id
          type: string
        precipitation_mm:
          description: Total precipitation mm
          minimum: 0.0
          title: Precipitation Mm
          type: number
        tenant_id:
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
      required:
      - tenant_id
      - precipitation_mm
      - et0_mm
      title: DroughtIndexRequest
      type: object
    ETRequest:
      description: Evapotranspiration calculation request
      properties:
        correlation_id:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Correlation Id
        field_id:
          default: ''
          maxLength: 100
          title: Field Id
          type: string
        humidity_pct:
          maximum: 100.0
          minimum: 0.0
          title: Humidity Pct
          type: number
        solar_radiation_mj:
          default: 15.0
          maximum: 50.0
          minimum: 0.0
          title: Solar Radiation Mj
          type: number
        temp_c:
          maximum: 60.0
          minimum: -50.0
          title: Temp C
          type: number
        tenant_id:
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
        wind_speed_kmh:
          maximum: 400.0
          minimum: 0.0
          title: Wind Speed Kmh
          type: number
      required:
      - tenant_id
      - temp_c
      - humidity_pct
      - wind_speed_kmh
      title: ETRequest
      type: object
    FrostRiskRequest:
      description: Frost risk assessment request
      properties:
        cloud_cover_pct:
          default: 0
          description: Cloud cover %
          maximum: 100.0
          minimum: 0.0
          title: Cloud Cover Pct
          type: number
        correlation_id:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Correlation Id
        dew_point_c:
          anyOf:
          - maximum: 50.0
            minimum: -50.0
            type: number
          - type: 'null'
          description: Dew point °C
          title: Dew Point C
        field_id:
          default: ''
          maxLength: 100
          title: Field Id
          type: string
        humidity_pct:
          description: Humidity %
          maximum: 100.0
          minimum: 0.0
          title: Humidity Pct
          type: number
        temp_c:
          description: Temperature °C
          maximum: 60.0
          minimum: -50.0
          title: Temp C
          type: number
        tenant_id:
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
        wind_speed_kmh:
          description: Wind speed km/h
          maximum: 400.0
          minimum: 0.0
          title: Wind Speed Kmh
          type: number
      required:
      - tenant_id
      - temp_c
      - humidity_pct
      - wind_speed_kmh
      title: FrostRiskRequest
      type: object
    GDDRequest:
      description: Growing Degree Days calculation request
      properties:
        base_temp_c:
          default: 10.0
          maximum: 30.0
          minimum: 0.0
          title: Base Temp C
          type: number
        correlation_id:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Correlation Id
        field_id:
          default: ''
          maxLength: 100
          title: Field Id
          type: string
        temp_max_c:
          maximum: 60.0
          minimum: -50.0
          title: Temp Max C
          type: number
        temp_min_c:
          maximum: 60.0
          minimum: -50.0
          title: Temp Min C
          type: number
        tenant_id:
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
        upper_temp_c:
          default: 30.0
          maximum: 50.0
          minimum: 20.0
          title: Upper Temp C
          type: number
      required:
      - tenant_id
      - temp_max_c
      - temp_min_c
      title: GDDRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HeatStressRequest:
      description: Heat stress assessment request
      properties:
        correlation_id:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Correlation Id
        field_id:
          default: ''
          maxLength: 100
          title: Field Id
          type: string
        humidity_pct:
          description: Humidity %
          maximum: 100.0
          minimum: 0.0
          title: Humidity Pct
          type: number
        solar_radiation_mj:
          default: 15.0
          description: Solar radiation MJ/m²/day
          maximum: 50.0
          minimum: 0.0
          title: Solar Radiation Mj
          type: number
        temp_c:
          description: Temperature °C
          maximum: 60.0
          minimum: -50.0
          title: Temp C
          type: number
        tenant_id:
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
        wind_speed_kmh:
          default: 10.0
          description: Wind speed km/h
          maximum: 400.0
          minimum: 0.0
          title: Wind Speed Kmh
          type: number
      required:
      - tenant_id
      - temp_c
      - humidity_pct
      title: HeatStressRequest
      type: object
    IrrigationRequest:
      properties:
        correlation_id:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Correlation Id
        field_id:
          maxLength: 100
          title: Field Id
          type: string
        humidity_pct:
          maximum: 100.0
          minimum: 0.0
          title: Humidity Pct
          type: number
        precipitation_mm:
          default: 0
          maximum: 500.0
          minimum: 0.0
          title: Precipitation Mm
          type: number
        temp_c:
          maximum: 60.0
          minimum: -60.0
          title: Temp C
          type: number
        tenant_id:
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
        wind_speed_kmh:
          maximum: 400.0
          minimum: 0.0
          title: Wind Speed Kmh
          type: number
      required:
      - tenant_id
      - field_id
      - temp_c
      - humidity_pct
      - wind_speed_kmh
      title: IrrigationRequest
      type: object
    LocationRequest:
      properties:
        correlation_id:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Correlation Id
        field_id:
          default: ''
          maxLength: 100
          title: Field Id
          type: string
        lat:
          maximum: 90.0
          minimum: -90.0
          title: Lat
          type: number
        lon:
          maximum: 180.0
          minimum: -180.0
          title: Lon
          type: number
        tenant_id:
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
      required:
      - tenant_id
      - lat
      - lon
      title: LocationRequest
      type: object
    SprayWindowRequest:
      description: Spray window assessment request
      properties:
        correlation_id:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Correlation Id
        field_id:
          default: ''
          maxLength: 100
          title: Field Id
          type: string
        humidity_pct:
          maximum: 100.0
          minimum: 0.0
          title: Humidity Pct
          type: number
        precipitation_probability:
          default: 0
          maximum: 100.0
          minimum: 0.0
          title: Precipitation Probability
          type: number
        temp_c:
          maximum: 60.0
          minimum: -50.0
          title: Temp C
          type: number
        tenant_id:
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
        wind_speed_kmh:
          maximum: 400.0
          minimum: 0.0
          title: Wind Speed Kmh
          type: number
      required:
      - tenant_id
      - temp_c
      - humidity_pct
      - wind_speed_kmh
      title: SprayWindowRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WeatherAssessRequest:
      properties:
        correlation_id:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Correlation Id
        field_id:
          maxLength: 100
          title: Field Id
          type: string
        humidity_pct:
          anyOf:
          - maximum: 100.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Humidity Pct
        precipitation_mm:
          anyOf:
          - maximum: 500.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Precipitation Mm
        temp_c:
          maximum: 60.0
          minimum: -60.0
          title: Temp C
          type: number
        tenant_id:
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
        uv_index:
          anyOf:
          - maximum: 20.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Uv Index
        wind_speed_kmh:
          anyOf:
          - maximum: 400.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Wind Speed Kmh
      required:
      - tenant_id
      - field_id
      - temp_c
      title: WeatherAssessRequest
      type: object
    WeatherGraphGenerateRequest:
      properties:
        days:
          default: 14
          maximum: 90
          minimum: 1
          title: Days
          type: integer
        field_id:
          maxLength: 100
          minLength: 1
          title: Field Id
          type: string
        language:
          default: ar
          enum:
          - ar
          - en
          title: Language
          type: string
        lat:
          maximum: 90.0
          minimum: -90.0
          title: Lat
          type: number
        lon:
          maximum: 180.0
          minimum: -180.0
          title: Lon
          type: number
        metric:
          default: combined
          enum:
          - temperature
          - precipitation
          - humidity
          - wind
          - combined
          title: Metric
          type: string
        tenant_id:
          maxLength: 100
          minLength: 1
          title: Tenant Id
          type: string
      required:
      - tenant_id
      - field_id
      - lat
      - lon
      title: WeatherGraphGenerateRequest
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: Agricultural weather assessment, forecasting, and alerts
  title: SAHOOL Weather Core
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/weather/fields/{field_id}/graph:
    post:
      description: "Generate a weather history graph for a field and return its URL.\n\nFarmonaut-style: the API returns a signed URL to a server-rendered\nSVG chart. The client loads it as an <img src=\"...\"> instead of\nreceiving JSON + rendering the chart in Dart/JS. This is much\nlighter on the mobile client and gives identical visuals across\nplatforms.\n\nResponse:\n  {\n    \"success\": true,\n    \"data\": {\n      \"graph_id\": \"...\",\n      \"url\": \"/api/v1/weather/graphs/{id}?tid=...&sig=...\",\n      \"expires_at\": \"2026-04-11T18:30:00Z\",\n      \"metric\": \"combined\",\n      \"days\": 14\n    }\n  }"
      operationId: generate_weather_graph_api_v1_weather_fields__field_id__graph_post
      parameters:
      - in: path
        name: field_id
        required: true
        schema:
          title: Field Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeatherGraphGenerateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Generate Weather Graph
  /api/v1/weather/graphs/{graph_id}:
    get:
      description: 'Serve the rendered SVG for a previously-generated graph.


        The URL is signed with HMAC-SHA256 (stored tenant + graph_id),

        so only clients who went through POST /fields/:id/graph can

        fetch the resulting SVG. No JWT required on this read — the

        signature is the authorisation. Cache-Control: private so

        proxies don''t leak per-tenant graphs.'
      operationId: fetch_weather_graph_api_v1_weather_graphs__graph_id__get
      parameters:
      - in: path
        name: graph_id
        required: true
        schema:
          title: Graph Id
          type: string
      - in: query
        name: tid
        required: true
        schema:
          title: Tid
          type: string
      - in: query
        name: sig
        required: true
        schema:
          title: Sig
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Fetch Weather Graph
  /healthz:
    get:
      description: Health check endpoint (liveness probe)
      operationId: health_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /metrics:
    get:
      description: Prometheus metrics endpoint
      operationId: metrics_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Metrics
  /readyz:
    get:
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
  /weather/agricultural-report:
    post:
      description: 'Comprehensive agricultural weather report

        تقرير الطقس الزراعي الشامل


        Combines current weather, alerts, ET0, GDD, and spray window

        into a single comprehensive report for farmers.'
      operationId: get_agricultural_report_weather_agricultural_report_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Agricultural Report
  /weather/assess:
    post:
      description: 'Assess weather conditions and generate alerts


        Manual weather data input for assessment'
      operationId: assess_weather_assess_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeatherAssessRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Assess
  /weather/chill-hours:
    post:
      description: 'Calculate chill hours/units for fruit trees

        حساب ساعات البرودة للأشجار المثمرة


        Supports multiple chill models:

        - simple: Hours below threshold

        - utah: Utah Chill Unit model (default, more accurate)

        - dynamic: Dynamic model for mild winters


        Returns chill units and which crops'' requirements are satisfied.'
      operationId: calculate_chill_weather_chill_hours_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChillHoursRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Calculate Chill
  /weather/comprehensive-stress-report:
    post:
      description: 'Comprehensive weather stress report

        تقرير الإجهاد الجوي الشامل


        Combines frost risk, heat stress, spray window, and alerts

        into a single comprehensive stress assessment.'
      operationId: get_stress_report_weather_comprehensive_stress_report_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Stress Report
  /weather/current:
    post:
      description: 'Get current weather from API provider


        Uses multi-provider service with automatic fallback:

        - Open-Meteo (free)

        - OpenWeatherMap (if OPENWEATHERMAP_API_KEY set)

        - WeatherAPI (if WEATHERAPI_KEY set)'
      operationId: get_current_weather_weather_current_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Current Weather
  /weather/drought-index:
    post:
      description: 'Calculate drought stress index

        حساب مؤشر الإجهاد الجفافي


        Based on water balance (precipitation vs evapotranspiration).

        Returns irrigation recommendations.'
      operationId: calculate_drought_weather_drought_index_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DroughtIndexRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Calculate Drought
  /weather/evapotranspiration:
    post:
      description: "Calculate Reference Evapotranspiration (ET0)\nحساب التبخر-نتح المرجعي\n\nUses FAO-56 Penman-Monteith equation (simplified).\nEssential for irrigation scheduling.\n\nReturns:\n    ET0 in mm/day with irrigation recommendations"
      operationId: calculate_et_weather_evapotranspiration_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ETRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Calculate Et
  /weather/forecast:
    post:
      description: "Get weather forecast\n\nArgs:\n    days: Number of forecast days (1-16)"
      operationId: get_forecast_weather_forecast_post
      parameters:
      - in: query
        name: days
        required: false
        schema:
          default: 7
          title: Days
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Forecast
  /weather/frost-risk:
    post:
      description: 'Assess frost risk and get protection recommendations

        تقييم خطر الصقيع والحصول على توصيات الحماية


        Evaluates frost risk based on temperature, humidity, wind, and cloud cover.

        Returns protection measures for different risk levels.'
      operationId: assess_frost_risk_weather_frost_risk_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrostRiskRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Assess Frost Risk
  /weather/gdd:
    post:
      description: "Calculate Growing Degree Days (GDD)\nحساب أيام النمو الحراري\n\nGDD predicts crop development stages based on accumulated heat.\nEssential for phenology modeling and harvest prediction.\n\nReturns:\n    Daily GDD with growth rate classification"
      operationId: calculate_gdd_weather_gdd_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GDDRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Calculate Gdd
  /weather/heat-stress:
    post:
      description: 'Calculate heat stress index for crops

        حساب مؤشر الإجهاد الحراري للمحاصيل


        Evaluates heat stress using Temperature-Humidity Index (THI).

        Returns mitigation recommendations for high stress conditions.'
      operationId: assess_heat_stress_weather_heat_stress_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeatStressRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Assess Heat Stress
  /weather/heat-stress/{temp_c}:
    get:
      description: Quick heat stress check for a temperature
      operationId: check_heat_stress_weather_heat_stress__temp_c__get
      parameters:
      - in: path
        name: temp_c
        required: true
        schema:
          title: Temp C
          type: number
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
