components:
  schemas:
    ChatInsightsRequest:
      description: Request to extract chat insights | طلب استخراج رؤى المحادثة
      properties:
        chat_id:
          description: Chat ID | معرف المحادثة
          title: Chat Id
          type: string
        insight_types:
          default:
          - sentiment
          - topic
          - action_items
          description: Types of insights to extract | أنواع الرؤى للاستخراج
          items:
            $ref: '#/components/schemas/InsightType'
          title: Insight Types
          type: array
        language:
          default: en
          description: Output language (en/ar/both) | لغة المخرجات
          title: Language
          type: string
        tenant_id:
          description: Tenant ID | معرف المستأجر
          title: Tenant Id
          type: string
        time_range_hours:
          default: 24
          description: Hours to analyze | ساعات التحليل
          maximum: 168
          minimum: 1
          title: Time Range Hours
          type: integer
      required:
      - chat_id
      - tenant_id
      title: ChatInsightsRequest
      type: object
    ChatInsightsResponse:
      description: Chat insights response | استجابة رؤى المحادثة
      properties:
        chat_id:
          title: Chat Id
          type: string
        generated_at:
          format: date-time
          title: Generated At
          type: string
        insights:
          items:
            $ref: '#/components/schemas/InsightItem'
          title: Insights
          type: array
        overall_sentiment:
          anyOf:
          - maximum: 1.0
            minimum: -1.0
            type: number
          - type: 'null'
          title: Overall Sentiment
        sentiment_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Sentiment Label
        sentiment_label_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Sentiment Label Ar
        time_range_end:
          format: date-time
          title: Time Range End
          type: string
        time_range_start:
          format: date-time
          title: Time Range Start
          type: string
        total_messages_analyzed:
          title: Total Messages Analyzed
          type: integer
      required:
      - chat_id
      - time_range_start
      - time_range_end
      - total_messages_analyzed
      - insights
      - generated_at
      title: ChatInsightsResponse
      type: object
    ChatSummarizeRequest:
      description: Request to summarize a chat | طلب تلخيص المحادثة
      properties:
        chat_id:
          description: Chat ID to summarize | معرف المحادثة للتلخيص
          title: Chat Id
          type: string
        include_participants:
          default: true
          description: Include participant summary | تضمين ملخص المشاركين
          title: Include Participants
          type: boolean
        include_timeline:
          default: false
          description: Include activity timeline | تضمين الجدول الزمني
          title: Include Timeline
          type: boolean
        language:
          default: en
          description: Output language (en/ar/both) | لغة المخرجات
          title: Language
          type: string
        max_messages:
          default: 500
          description: Maximum messages to analyze | الحد الأقصى للرسائل
          maximum: 2000
          minimum: 10
          title: Max Messages
          type: integer
        tenant_id:
          description: Tenant ID | معرف المستأجر
          title: Tenant Id
          type: string
        time_range_hours:
          default: 24
          description: Hours of chat to summarize | ساعات المحادثة للتلخيص
          maximum: 168
          minimum: 1
          title: Time Range Hours
          type: integer
      required:
      - chat_id
      - tenant_id
      title: ChatSummarizeRequest
      type: object
    ChatSummaryResponse:
      description: Chat summary response | استجابة ملخص المحادثة
      properties:
        action_items:
          items:
            type: string
          title: Action Items
          type: array
        action_items_ar:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Action Items Ar
        chat_id:
          title: Chat Id
          type: string
        generated_at:
          format: date-time
          title: Generated At
          type: string
        key_topics:
          items:
            type: string
          title: Key Topics
          type: array
        key_topics_ar:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Key Topics Ar
        participants:
          anyOf:
          - items:
              $ref: '#/components/schemas/ParticipantSummary'
            type: array
          - type: 'null'
          title: Participants
        sentiment_overview:
          anyOf:
          - type: string
          - type: 'null'
          title: Sentiment Overview
        sentiment_overview_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Sentiment Overview Ar
        summary:
          title: Summary
          type: string
        summary_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary Ar
        time_range_end:
          format: date-time
          title: Time Range End
          type: string
        time_range_start:
          format: date-time
          title: Time Range Start
          type: string
        total_messages:
          title: Total Messages
          type: integer
      required:
      - chat_id
      - time_range_start
      - time_range_end
      - total_messages
      - summary
      - key_topics
      - action_items
      - generated_at
      title: ChatSummaryResponse
      type: object
    ContactAddRequest:
      description: Request to add a contact | طلب إضافة جهة اتصال
      properties:
        contact_type:
          $ref: '#/components/schemas/ContactType'
          default: friend
          description: Contact type | نوع جهة الاتصال
        greeting_message:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          description: Friend request message | رسالة طلب الصداقة
          title: Greeting Message
        greeting_message_ar:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          description: Greeting in Arabic | الترحيب بالعربية
          title: Greeting Message Ar
        notes:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          description: Personal notes | ملاحظات شخصية
          title: Notes
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Contact tags | وسوم جهة الاتصال
          title: Tags
        tenant_id:
          description: Tenant ID | معرف المستأجر
          title: Tenant Id
          type: string
        wechat_id:
          description: WeChat ID or phone number | معرف ويتشات أو رقم الهاتف
          title: Wechat Id
          type: string
      required:
      - wechat_id
      - tenant_id
      title: ContactAddRequest
      type: object
    ContactResponse:
      description: Contact response model | نموذج استجابة جهة الاتصال
      properties:
        added_at:
          format: date-time
          title: Added At
          type: string
        avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Avatar Url
        contact_type:
          $ref: '#/components/schemas/ContactType'
        id:
          title: Id
          type: string
        nickname:
          anyOf:
          - type: string
          - type: 'null'
          title: Nickname
        nickname_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Nickname Ar
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        status:
          title: Status
          type: string
        status_ar:
          title: Status Ar
          type: string
        tags:
          items:
            type: string
          title: Tags
          type: array
        wechat_id:
          title: Wechat Id
          type: string
      required:
      - id
      - wechat_id
      - contact_type
      - status
      - status_ar
      - tags
      - added_at
      title: ContactResponse
      type: object
    ContactType:
      description: WeChat contact types
      enum:
      - friend
      - group
      - official_account
      - mini_program
      title: ContactType
      type: string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    InsightItem:
      description: Single insight item | عنصر رؤية واحد
      properties:
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        description:
          title: Description
          type: string
        description_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Description Ar
        insight_type:
          $ref: '#/components/schemas/InsightType'
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        related_messages:
          default: []
          items:
            type: string
          title: Related Messages
          type: array
        title:
          title: Title
          type: string
        title_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Title Ar
      required:
      - insight_type
      - title
      - description
      - confidence
      title: InsightItem
      type: object
    InsightType:
      description: Chat insight types
      enum:
      - sentiment
      - topic
      - action_items
      - questions
      - key_decisions
      title: InsightType
      type: string
    MessageFetchRequest:
      description: Request to fetch messages from a chat | طلب جلب الرسائل من محادثة
      properties:
        after_timestamp:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Fetch messages after this time | جلب الرسائل بعد هذا الوقت
          title: After Timestamp
        before_timestamp:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Fetch messages before this time | جلب الرسائل قبل هذا الوقت
          title: Before Timestamp
        chat_id:
          description: WeChat chat/group ID | معرف المحادثة
          title: Chat Id
          type: string
        limit:
          default: 50
          description: Maximum messages to fetch | الحد الأقصى للرسائل
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
        message_types:
          anyOf:
          - items:
              $ref: '#/components/schemas/MessageType'
            type: array
          - type: 'null'
          description: Filter by message types | تصفية حسب أنواع الرسائل
          title: Message Types
        tenant_id:
          description: Tenant ID | معرف المستأجر
          title: Tenant Id
          type: string
      required:
      - chat_id
      - tenant_id
      title: MessageFetchRequest
      type: object
    MessageFetchResponse:
      description: Response for message fetch | استجابة جلب الرسائل
      properties:
        chat_id:
          title: Chat Id
          type: string
        has_more:
          title: Has More
          type: boolean
        messages:
          items:
            $ref: '#/components/schemas/MessageResponse'
          title: Messages
          type: array
        newest_timestamp:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Newest Timestamp
        oldest_timestamp:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Oldest Timestamp
        total_count:
          title: Total Count
          type: integer
      required:
      - chat_id
      - messages
      - total_count
      - has_more
      title: MessageFetchResponse
      type: object
    MessageResponse:
      description: Message response model | نموذج استجابة الرسالة
      properties:
        chat_id:
          title: Chat Id
          type: string
        content:
          title: Content
          type: string
        content_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Ar
        id:
          title: Id
          type: string
        is_from_self:
          default: false
          title: Is From Self
          type: boolean
        media_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Media Url
        message_type:
          $ref: '#/components/schemas/MessageType'
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        reply_to_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Reply To Id
        sender_id:
          title: Sender Id
          type: string
        sender_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Sender Name
        sender_name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Sender Name Ar
        timestamp:
          format: date-time
          title: Timestamp
          type: string
      required:
      - id
      - chat_id
      - sender_id
      - message_type
      - content
      - timestamp
      title: MessageResponse
      type: object
    MessageSendRequest:
      description: Request to send a message | طلب إرسال رسالة
      properties:
        chat_id:
          description: Target chat/group ID | معرف المحادثة المستهدفة
          title: Chat Id
          type: string
        content:
          description: Message content | محتوى الرسالة
          maxLength: 10000
          minLength: 1
          title: Content
          type: string
        media_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Media URL for non-text messages | رابط الوسائط
          title: Media Url
        message_type:
          $ref: '#/components/schemas/MessageType'
          default: text
          description: Message type | نوع الرسالة
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Additional metadata | بيانات إضافية
          title: Metadata
        reply_to_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Message ID to reply to | معرف الرسالة للرد عليها
          title: Reply To Id
        tenant_id:
          description: Tenant ID | معرف المستأجر
          title: Tenant Id
          type: string
      required:
      - chat_id
      - tenant_id
      - content
      title: MessageSendRequest
      type: object
    MessageSendResponse:
      description: Response for message send | استجابة إرسال الرسالة
      properties:
        chat_id:
          title: Chat Id
          type: string
        content:
          title: Content
          type: string
        id:
          title: Id
          type: string
        message_type:
          $ref: '#/components/schemas/MessageType'
        status:
          title: Status
          type: string
        status_ar:
          title: Status Ar
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
      required:
      - id
      - chat_id
      - message_type
      - content
      - timestamp
      - status
      - status_ar
      title: MessageSendResponse
      type: object
    MessageType:
      description: WeChat message types
      enum:
      - text
      - image
      - voice
      - video
      - location
      - link
      - file
      - mini_program
      title: MessageType
      type: string
    MomentPublishRequest:
      description: Request to publish a moment | طلب نشر لحظة
      properties:
        content:
          description: Moment text content | محتوى النص
          maxLength: 2000
          minLength: 1
          title: Content
          type: string
        content_ar:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          description: Content in Arabic | المحتوى بالعربية
          title: Content Ar
        link_title:
          anyOf:
          - type: string
          - type: 'null'
          description: Link title | عنوان الرابط
          title: Link Title
        link_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Link to attach | رابط للإرفاق
          title: Link Url
        location:
          anyOf:
          - type: string
          - type: 'null'
          description: Location tag | علامة الموقع
          title: Location
        location_ar:
          anyOf:
          - type: string
          - type: 'null'
          description: Location in Arabic | الموقع بالعربية
          title: Location Ar
        media_urls:
          anyOf:
          - items:
              type: string
            maxItems: 9
            type: array
          - type: 'null'
          description: Media URLs (max 9) | روابط الوسائط
          title: Media Urls
        tenant_id:
          description: Tenant ID | معرف المستأجر
          title: Tenant Id
          type: string
        visibility:
          $ref: '#/components/schemas/MomentVisibility'
          default: friends
          description: Visibility setting | إعداد الرؤية
        visible_to:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Specific user IDs if visibility is 'selected' | معرفات المستخدمين المحددين
          title: Visible To
      required:
      - tenant_id
      - content
      title: MomentPublishRequest
      type: object
    MomentResponse:
      description: Moment response model | نموذج استجابة اللحظة
      properties:
        comments_count:
          default: 0
          title: Comments Count
          type: integer
        content:
          title: Content
          type: string
        content_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Ar
        id:
          title: Id
          type: string
        likes_count:
          default: 0
          title: Likes Count
          type: integer
        link_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Link Title
        link_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Link Url
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        location_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Ar
        media_urls:
          items:
            type: string
          title: Media Urls
          type: array
        published_at:
          format: date-time
          title: Published At
          type: string
        status:
          title: Status
          type: string
        status_ar:
          title: Status Ar
          type: string
        visibility:
          $ref: '#/components/schemas/MomentVisibility'
      required:
      - id
      - content
      - media_urls
      - visibility
      - published_at
      - status
      - status_ar
      title: MomentResponse
      type: object
    MomentVisibility:
      description: WeChat moment visibility options
      enum:
      - public
      - friends
      - private
      - selected
      title: MomentVisibility
      type: string
    ParticipantSummary:
      description: Participant summary in chat | ملخص المشارك في المحادثة
      properties:
        key_contributions:
          default: []
          items:
            type: string
          title: Key Contributions
          type: array
        key_contributions_ar:
          default: []
          items:
            type: string
          title: Key Contributions Ar
          type: array
        message_count:
          title: Message Count
          type: integer
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
        sentiment_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Sentiment Score
        user_id:
          title: User Id
          type: string
      required:
      - user_id
      - message_count
      title: ParticipantSummary
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: WeChat messaging and social integration for farmers | تكامل ويتشات للمراسلة والتواصل الاجتماعي للمزارعين
  title: SAHOOL WeChat Integration Service
  version: 16.0.0
openapi: 3.1.0
paths:
  /api/v1/callback:
    get:
      description: 'WeChat server verification handshake (GET).


        WeChat sends this to verify the server URL during configuration.

        توثيق خادم ويتشات عند إعداد عنوان الاستدعاء.'
      operationId: wechat_verify_callback_api_v1_callback_get
      parameters:
      - description: WeChat signature
        in: query
        name: signature
        required: true
        schema:
          description: WeChat signature
          title: Signature
          type: string
      - description: Timestamp
        in: query
        name: timestamp
        required: true
        schema:
          description: Timestamp
          title: Timestamp
          type: string
      - description: Random nonce
        in: query
        name: nonce
        required: true
        schema:
          description: Random nonce
          title: Nonce
          type: string
      - description: Echo string to return on success
        in: query
        name: echostr
        required: true
        schema:
          description: Echo string to return on success
          title: Echostr
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Wechat Verify Callback Api V1 Callback Get
                type: string
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Wechat Verify Callback
      tags:
      - Callback
    post:
      description: 'Receive incoming WeChat messages/events (POST).


        WeChat pushes XML payloads to this endpoint for incoming messages.

        استقبال رسائل وأحداث ويتشات الواردة.'
      operationId: wechat_receive_callback_api_v1_callback_post
      parameters:
      - description: WeChat signature
        in: query
        name: signature
        required: true
        schema:
          description: WeChat signature
          title: Signature
          type: string
      - description: Timestamp
        in: query
        name: timestamp
        required: true
        schema:
          description: Timestamp
          title: Timestamp
          type: string
      - description: Random nonce
        in: query
        name: nonce
        required: true
        schema:
          description: Random nonce
          title: Nonce
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Wechat Receive Callback
      tags:
      - Callback
  /api/v1/chat/insights:
    post:
      description: 'Extract AI-powered insights from a chat conversation.


        استخراج رؤى من المحادثة باستخدام الذكاء الاصطناعي


        - Sentiment analysis

        - Topic extraction

        - Action item detection

        - Question identification

        - Key decision tracking'
      operationId: get_chat_insights_api_v1_chat_insights_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatInsightsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatInsightsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Chat Insights
      tags:
      - Chat Analysis
  /api/v1/chat/summarize:
    post:
      description: 'Generate an AI-powered summary of a chat conversation.


        إنشاء ملخص للمحادثة باستخدام الذكاء الاصطناعي


        - Summarize key topics and discussions

        - Extract action items

        - Analyze participant contributions

        - Support multiple output languages'
      operationId: summarize_chat_api_v1_chat_summarize_post
      requestBody:
        content:
          application/json:
            schema:
