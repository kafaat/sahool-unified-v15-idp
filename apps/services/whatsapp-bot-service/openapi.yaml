components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    InteractiveAction:
      description: إجراء تفاعلي
      properties:
        button:
          anyOf:
          - type: string
          - type: 'null'
          title: Button
        buttons:
          anyOf:
          - items:
              $ref: '#/components/schemas/InteractiveButton'
            type: array
          - type: 'null'
          title: Buttons
        sections:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Sections
      title: InteractiveAction
      type: object
    InteractiveBody:
      description: جسم تفاعلي
      properties:
        text:
          title: Text
          type: string
      required:
      - text
      title: InteractiveBody
      type: object
    InteractiveButton:
      description: زر تفاعلي
      properties:
        reply:
          additionalProperties:
            type: string
          title: Reply
          type: object
        type:
          default: reply
          title: Type
          type: string
      required:
      - reply
      title: InteractiveButton
      type: object
    InteractiveFooter:
      description: تذييل تفاعلي
      properties:
        text:
          title: Text
          type: string
      required:
      - text
      title: InteractiveFooter
      type: object
    InteractiveHeader:
      description: رأس تفاعلي
      properties:
        image:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Image
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        type:
          default: text
          title: Type
          type: string
      title: InteractiveHeader
      type: object
    InteractiveType:
      description: نوع الرسالة التفاعلية
      enum:
      - button
      - list
      - button_reply
      - list_reply
      title: InteractiveType
      type: string
    MessageType:
      description: نوع الرسالة
      enum:
      - text
      - image
      - audio
      - video
      - document
      - location
      - contacts
      - sticker
      - interactive
      - button
      - reaction
      - order
      - unknown
      title: MessageType
      type: string
    SendImageContent:
      description: محتوى صورة للإرسال
      properties:
        caption:
          anyOf:
          - type: string
          - type: 'null'
          title: Caption
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        link:
          anyOf:
          - type: string
          - type: 'null'
          title: Link
      title: SendImageContent
      type: object
    SendInteractiveContent:
      description: محتوى تفاعلي للإرسال
      properties:
        action:
          $ref: '#/components/schemas/InteractiveAction'
        body:
          $ref: '#/components/schemas/InteractiveBody'
        footer:
          anyOf:
          - $ref: '#/components/schemas/InteractiveFooter'
          - type: 'null'
        header:
          anyOf:
          - $ref: '#/components/schemas/InteractiveHeader'
          - type: 'null'
        type:
          $ref: '#/components/schemas/InteractiveType'
      required:
      - type
      - body
      - action
      title: SendInteractiveContent
      type: object
    SendLocationContent:
      description: محتوى موقع للإرسال
      properties:
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        latitude:
          title: Latitude
          type: number
        longitude:
          title: Longitude
          type: number
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      required:
      - latitude
      - longitude
      title: SendLocationContent
      type: object
    SendMessageRequest:
      description: 'Request to send a message via WhatsApp.

        طلب إرسال رسالة عبر واتساب.'
      properties:
        context:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Context
        image:
          anyOf:
          - $ref: '#/components/schemas/SendImageContent'
          - type: 'null'
        interactive:
          anyOf:
          - $ref: '#/components/schemas/SendInteractiveContent'
          - type: 'null'
        location:
          anyOf:
          - $ref: '#/components/schemas/SendLocationContent'
          - type: 'null'
        template:
          anyOf:
          - $ref: '#/components/schemas/SendTemplateContent'
          - type: 'null'
        text:
          anyOf:
          - $ref: '#/components/schemas/SendTextContent'
          - type: 'null'
        to:
          description: Recipient phone number | رقم هاتف المستلم
          title: To
          type: string
        type:
          $ref: '#/components/schemas/MessageType'
          default: text
          description: Message type
      required:
      - to
      title: SendMessageRequest
      type: object
    SendMessageResponse:
      description: 'Response after sending a message.

        استجابة بعد إرسال رسالة.'
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        error_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Ar
        message_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Message Id
        success:
          title: Success
          type: boolean
      required:
      - success
      title: SendMessageResponse
      type: object
    SendTemplateComponent:
      description: مكون قالب
      properties:
        parameters:
          items:
            additionalProperties: true
            type: object
          title: Parameters
          type: array
        type:
          title: Type
          type: string
      required:
      - type
      - parameters
      title: SendTemplateComponent
      type: object
    SendTemplateContent:
      description: محتوى قالب للإرسال
      properties:
        components:
          anyOf:
          - items:
              $ref: '#/components/schemas/SendTemplateComponent'
            type: array
          - type: 'null'
          title: Components
        language:
          additionalProperties:
            type: string
          title: Language
          type: object
        name:
          title: Name
          type: string
      required:
      - name
      - language
      title: SendTemplateContent
      type: object
    SendTemplateRequest:
      description: 'Request to send a template message.

        طلب إرسال رسالة قالب.'
      properties:
        components:
          anyOf:
          - items:
              $ref: '#/components/schemas/SendTemplateComponent'
            type: array
          - type: 'null'
          title: Components
        language_code:
          default: ar
          description: Language code (ar/en)
          title: Language Code
          type: string
        template_name:
          description: Template name | اسم القالب
          title: Template Name
          type: string
        to:
          description: Recipient phone number | رقم هاتف المستلم
          title: To
          type: string
      required:
      - to
      - template_name
      title: SendTemplateRequest
      type: object
    SendTextContent:
      description: محتوى نص للإرسال
      properties:
        body:
          title: Body
          type: string
        preview_url:
          default: false
          title: Preview Url
          type: boolean
      required:
      - body
      title: SendTextContent
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  description: "\n    WhatsApp messaging service for SAHOOL farmers.\n    خدمة رسائل واتساب لمزارعي سهول.\n\n    **Features / الميزات:**\n    - Receive and respond to farmer messages | استقبال والرد على رسائل المزارعين\n    - Forward queries to AI advisory | إحالة الاستفسارات إلى المستشار الذكي\n    - Handle crop images for disease detection | معالجة صور المحاصيل لكشف الأمراض\n    - Interactive menus and buttons | قوائم وأزرار تفاعلية\n    - Bilingual support (Arabic/English) | دعم ثنائي اللغة (عربي/إنجليزي)\n    - Session context management | إدارة سياق الجلسات\n\n    **Supported Message Types / أنواع الرسائل المدعومة:**\n    - Text messages | رسائل نصية\n    - Image messages | رسائل صور\n    - Location messages | رسائل مواقع\n    - Interactive button responses | ردود الأزرار التفاعلية\n    "
  title: SAHOOL WhatsApp Bot Service
  version: 16.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: 'Root endpoint with service information.

        نقطة الجذر مع معلومات الخدمة.'
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
      tags:
      - Root
  /api/v1/mark-read:
    post:
      description: 'Mark a message as read.

        وضع علامة مقروء على الرسالة.'
      operationId: mark_message_as_read_api_v1_mark_read_post
      parameters:
      - description: Message ID to mark as read
        in: query
        name: message_id
        required: true
        schema:
          description: Message ID to mark as read
          title: Message Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Mark Message As Read
      tags:
      - WhatsApp Webhook
  /api/v1/send:
    post:
      description: 'Send a message to a WhatsApp user.

        إرسال رسالة إلى مستخدم واتساب.


        Supports:

        - Text messages | رسائل نصية

        - Image messages | رسائل صور

        - Location messages | رسائل مواقع

        - Interactive buttons | أزرار تفاعلية'
      operationId: send_message_api_v1_send_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Send Message
      tags:
      - WhatsApp Webhook
  /api/v1/send-template:
    post:
      description: 'Send a template message to a WhatsApp user.

        إرسال رسالة قالب إلى مستخدم واتساب.


        Template messages are pre-approved messages that can be sent

        outside the 24-hour messaging window.

        رسائل القوالب هي رسائل معتمدة مسبقا يمكن إرسالها

        خارج نافذة الرسائل لمدة 24 ساعة.'
      operationId: send_template_message_api_v1_send_template_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTemplateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Send Template Message
      tags:
      - WhatsApp Webhook
  /healthz:
    get:
      description: 'Health check endpoint (liveness probe).

        نقطة فحص الصحة (فحص الحياة).'
      operationId: health_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
      tags:
      - Health
  /readyz:
    get:
      description: 'Kubernetes readiness probe - is the service ready to accept traffic?

        فحص جاهزية Kubernetes - هل الخدمة جاهزة لاستقبال الحركة؟'
      operationId: readiness_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Readiness
      tags:
      - Health
  /webhook:
    get:
      description: 'WhatsApp webhook verification endpoint.

        نقطة التحقق من webhook لواتساب.


        Meta sends this request when you configure the webhook URL.

        يرسل Meta هذا الطلب عند تكوين رابط webhook.'
      operationId: verify_webhook_webhook_get
      parameters:
      - in: query
        name: hub.mode
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Hub.Mode
      - in: query
        name: hub.verify_token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Hub.Verify Token
      - in: query
        name: hub.challenge
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Hub.Challenge
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Verify Webhook
      tags:
      - WhatsApp Webhook
    post:
      description: 'Receive incoming WhatsApp messages and status updates.

        استقبال رسائل واتساب الواردة وتحديثات الحالة.


        This endpoint:

        1. Verifies X-Hub-Signature-256 HMAC (Meta webhook security)

        2. Validates the webhook payload

        3. Extracts messages from the payload

        4. Processes messages asynchronously via background tasks

        5. Returns 200 OK immediately (WhatsApp requirement)'
      operationId: receive_webhook_webhook_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Receive Webhook
      tags:
      - WhatsApp Webhook
