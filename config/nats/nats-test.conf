# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL NATS Server Configuration - TESTING (No Auth, No TLS)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Configuration Files:
#   nats.conf          - Development: Authentication enabled, NO TLS.
#   nats-secure.conf   - Production: TLS enforced, mTLS, encryption at rest.
#   nats-test.conf     - Testing (this file): Simple credentials, no TLS,
#                        reduced resource limits. Used by docker-compose.test.yml.
#
# This config uses hardcoded test credentials for CI/CD and local testing.
# Do NOT use in development or production environments.
#
# ═══════════════════════════════════════════════════════════════════════════════

server_name: sahool-nats-test
listen: 0.0.0.0:4222
http_port: 8222

# JetStream Configuration
jetstream {
    store_dir: /data
    max_memory_store: 256MB
    max_file_store: 1GB
}

# Simple Authentication for Testing
# SECURITY: Password uses bcrypt hash to eliminate NATS "Plaintext passwords detected" warning.
# To regenerate: python3 -c "import bcrypt; print(bcrypt.hashpw(b'YOUR_PASSWORD', bcrypt.gensalt(rounds=11)).decode())"
authorization {
    users = [
        {
            user: "test_user"
            # nosemgrep: generic.secrets.security.detected-bcrypt-hash
            password: "$2b$11$ADRzU83P5oWAdmUY8cfCEu3YCqpWe679smiZ7RemowQrHGed/iWLi"
        }
    ]
}

# Logging
debug: false
trace: false
logtime: true

# Performance Limits
max_connections: 100
max_payload: 1MB
