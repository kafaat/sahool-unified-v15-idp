# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL NATS Server Configuration - DEVELOPMENT (No TLS)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Configuration Files:
#   nats.conf          - Development (this file): Authentication enabled, NO TLS.
#                        Used by docker-compose.yml for local development.
#   nats-secure.conf   - Production (TLS enforced): mTLS, encryption at rest,
#                        rate limiting, hardened security (score 9.5/10).
#                        Used by docker-compose.prod.yml.
#   nats-test.conf     - Testing (no auth): Minimal config with simple credentials,
#                        no TLS, reduced resource limits. Used by docker-compose.test.yml.
#
# WARNING: Do NOT use this file (nats.conf) in production. Credentials are
#          transmitted in plaintext without TLS. Production MUST use nats-secure.conf.
#
# ═══════════════════════════════════════════════════════════════════════════════

# Server Configuration
server_name: sahool-nats
listen: 0.0.0.0:4222

# HTTP Monitoring
http_port: 8222

# JetStream Configuration
jetstream {
    store_dir: /data

    # Memory limits
    max_memory_store: 1GB
    max_file_store: 10GB

    # Domain for multi-cluster setup (optional)
    # domain: sahool
}

# ─────────────────────────────────────────────────────────────────────────────
# Authentication & Authorization
# ─────────────────────────────────────────────────────────────────────────────

# User Authentication
# SECURITY: Passwords use bcrypt hashes to eliminate the NATS "Plaintext passwords
# detected" warning. Usernames are injected via environment variables.
#
# To generate a new bcrypt hash:
#   python3 -c "import bcrypt; print(bcrypt.hashpw(b'YOUR_PASSWORD', bcrypt.gensalt(rounds=11)).decode())"
#   OR: nats server passwd
#
# IMPORTANT: The bcrypt hashes below correspond to the passwords in .env.example.
# If you change passwords in .env, you MUST regenerate and update these hashes.
# For PRODUCTION, use nats-secure.conf with NKey authentication instead.
#
# Current bcrypt hashes correspond to these .env.example defaults:
#   NATS_ADMIN_PASSWORD=sahool_nats_adm1n_2026!secure
#   NATS_PASSWORD=sahool_nats_d3v_2026!secure
#   NATS_MONITOR_PASSWORD=sahool_nats_m0n_2026!secure
authorization {
    # Default permissions for all authenticated users
    # SECURITY: Restricted to sahool.* subjects only (not all subjects)
    default_permissions = {
        publish = {
            # Only allow publishing to SAHOOL platform subjects
            allow = [
                "sahool.>",           # All SAHOOL events
                "_INBOX.>",           # Request-reply patterns
            ]
            # Explicitly deny system subjects
            deny = [
                "$SYS.>",             # System subjects
                "$JS.API.STREAM.DELETE.>",  # Prevent stream deletion
                "$JS.API.CONSUMER.DELETE.>", # Prevent consumer deletion
            ]
        }
        subscribe = {
            # Only allow subscribing to SAHOOL platform subjects
            allow = [
                "sahool.>",           # All SAHOOL events
                "_INBOX.>",           # Request-reply patterns
            ]
            deny = [
                "$SYS.>",             # System subjects (admin only)
            ]
        }
    }

    # Service-specific users with granular permissions
    # SECURITY: All passwords are bcrypt-hashed (cost=11) to satisfy NATS security requirements
    users = [
        # Admin user - full access to all operations
        # Password: see NATS_ADMIN_PASSWORD in .env (default: sahool_nats_adm1n_2026!secure)
        {
            user: $NATS_ADMIN_USER
            password: "$2b$11$ZMLsC63pr2pi6yvNrrOlbuVySFqYwIOrDqEQix83dA7gPEA2W8WTy"
            permissions = {
                publish = {
                    allow = [">"]
                }
                subscribe = {
                    allow = [">"]
                }
            }
        },

        # Application services user - standard access
        # Password: see NATS_PASSWORD in .env (default: sahool_nats_d3v_2026!secure)
        {
            user: $NATS_USER
            password: "$2b$11$yahIlu7zoJPFyaasYqf2BuNmgpSDe237NJ7KJ7joubDOlfF2.ajwu"
            permissions = {
                publish = {
                    allow = [
                        "sahool.>",           # All SAHOOL events
                        "field.>",            # Field operations
                        "weather.>",          # Weather events
                        "iot.>",              # IoT sensor data
                        "notification.>",     # Notifications
                        "marketplace.>",      # Marketplace events
                        "billing.>",          # Billing events
                        "chat.>",             # Chat messages
                        "alert.>",            # Alert events
                        "_INBOX.>",           # Request-reply patterns
                        "$JS.API.>",          # JetStream API (stream/consumer management)
                    ]
                }
                subscribe = {
                    allow = [
                        "sahool.>",
                        "field.>",
                        "weather.>",
                        "iot.>",
                        "notification.>",
                        "marketplace.>",
                        "billing.>",
                        "chat.>",
                        "alert.>",
                        "_INBOX.>",
                        "$JS.API.>",          # JetStream API responses
                    ]
                }
            }
        },

        # Read-only monitoring user
        # Password: see NATS_MONITOR_PASSWORD in .env (default: sahool_nats_m0n_2026!secure)
        {
            user: $NATS_MONITOR_USER
            password: "$2b$11$6E0Az5/5KDukr9NHIcjstOo1vG0UEzvUs5jQPlemB/LyDLcMTz9bq"
            permissions = {
                publish = {
                    # No publish permissions
                    deny = [">"]
                }
                subscribe = {
                    # Can subscribe to all subjects for monitoring
                    allow = [">"]
                }
            }
        }
    ]
}

