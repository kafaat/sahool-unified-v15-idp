# SAHOOL JetStream Streams — OBSOLETE STATIC CONFIG
# ═══════════════════════════════════════════════════════════════════════════════
#
# ⚠️  DO NOT APPLY THIS FILE.
#
# The subjects and stream names in the previous revision of this YAML
# (`sahool.events.>`, `sahool.health.>`, `sahool.audit.>`) do NOT match the
# subjects that services actually publish in production. Services now
# publish on tenant-scoped subjects (`sahool.tenant.<tenant_id>.<domain>.
# <action>`) and the real stream definitions live in Python:
#
#     shared/events/streams.py
#         STREAMS = [BUSINESS, TENANT, SYSTEM, HEALTH, AUDIT, ...]
#
# Applying the previous YAML would bind streams to the wrong subject
# filters and break delivery. The file is kept as a tombstone rather than
# deleted so that anyone searching the repo for `SAHOOL_EVENTS` lands here
# with a pointer to the real source.
#
# To deploy the real streams: run the setup script that reads
# shared/events/streams.py, or apply each STREAM's `StreamConfig` via
# `nats str add --config=-` in CI.
#
# ═══════════════════════════════════════════════════════════════════════════════

streams: []
