x-logging:
  driver: json-file
  options:
    max-size: 50m
    max-file: '3'
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sahool-postgres
    command:
      - postgres
      - -c
      - max_connections=300
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sahool}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/core/postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp
      - /run/postgresql
    ports:
      - 127.0.0.1:5432:5432
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-sahool}
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    networks:
      - sahool-network
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: sahool-pgbouncer
    entrypoint:
      - sh
      - /entrypoint-custom.sh
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${POSTGRES_USER:-sahool}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-sahool}
      PGBOUNCER_CONFIG: /etc/pgbouncer/pgbouncer.ini
      USERLIST_FILE: /etc/pgbouncer/runtime/userlist.txt
      POOL_MODE: transaction
      MAX_DB_CONNECTIONS: 250
      DEFAULT_POOL_SIZE: 30
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      MAX_CLIENT_CONN: 800
      CLIENT_IDLE_TIMEOUT: 900
      SERVER_IDLE_TIMEOUT: 600
      QUERY_TIMEOUT: 120
      QUERY_WAIT_TIMEOUT: 30
      ADMIN_USERS: pgbouncer_admin
      STATS_USERS: pgbouncer_stats
    volumes:
      - ./infrastructure/core/pgbouncer/entrypoint.sh:/entrypoint-custom.sh
      - ./infrastructure/core/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/certs:/etc/pgbouncer/certs:ro
      - type: tmpfs
        target: /etc/pgbouncer/runtime
        tmpfs:
          size: 1048576
      - ./infrastructure/core/pgbouncer/healthcheck.sh:/healthcheck.sh:ro
    ports:
      - 127.0.0.1:6432:6432
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - export POSTGRES_USER="$DB_USER" POSTGRES_PASSWORD="$DB_PASSWORD" && sh /healthcheck.sh
          || nc -z localhost 6432
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - sahool-network
  redis:
    image: redis:7.4-alpine
    container_name: sahool-redis
    entrypoint:
      - sh
      - -c
      - '# Inject password and maxmemory into config at runtime

        cp /usr/local/etc/redis/redis.conf /tmp/redis.conf

        echo "" >> /tmp/redis.conf

        echo "requirepass $$REDIS_PASSWORD" >> /tmp/redis.conf

        echo "maxmemory 512mb" >> /tmp/redis.conf

        exec redis-server /tmp/redis.conf

        '
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis-secure.conf:/usr/local/etc/redis/redis.conf:ro
      - ./config/certs:/etc/redis/certs:ro
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    networks:
      - sahool-network
  vault:
    image: hashicorp/vault:1.17
    container_name: sahool-vault
    hostname: vault
    ports:
      - 127.0.0.1:8200:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:?VAULT_DEV_TOKEN must be set - do
        not use default tokens}
      VAULT_DEV_LISTEN_ADDRESS: 127.0.0.1:8200
      VAULT_LOG_LEVEL: info
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
    healthcheck:
      test:
        - CMD
        - vault
        - status
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    networks:
      - sahool-network
  nats:
    image: nats:2.10.24-alpine
    container_name: sahool-nats
    command:
      - -c
      - /etc/nats/nats.conf
    environment:
      NATS_USER: ${NATS_USER:?NATS_USER is required}
      NATS_PASSWORD: ${NATS_PASSWORD:?NATS_PASSWORD is required}
      NATS_ADMIN_USER: ${NATS_ADMIN_USER:?NATS_ADMIN_USER is required}
      NATS_ADMIN_PASSWORD: ${NATS_ADMIN_PASSWORD:?NATS_ADMIN_PASSWORD is required}
      NATS_MONITOR_USER: ${NATS_MONITOR_USER:?NATS_MONITOR_USER is required}
      NATS_MONITOR_PASSWORD: ${NATS_MONITOR_PASSWORD:?NATS_MONITOR_PASSWORD is required}
      NATS_CLUSTER_USER: ${NATS_CLUSTER_USER:?NATS_CLUSTER_USER is required}
      NATS_CLUSTER_PASSWORD: ${NATS_CLUSTER_PASSWORD:?NATS_CLUSTER_PASSWORD is required}
      NATS_SYSTEM_USER: ${NATS_SYSTEM_USER:?NATS_SYSTEM_USER is required}
      NATS_SYSTEM_PASSWORD: ${NATS_SYSTEM_PASSWORD:?NATS_SYSTEM_PASSWORD is required}
      NATS_JETSTREAM_KEY: ${NATS_JETSTREAM_KEY:?NATS_JETSTREAM_KEY is required}
    volumes:
      - nats_data:/data
      - ./config/nats/nats-secure.conf:/etc/nats/nats-secure.conf:ro
      - ./config/nats/nats.conf:/etc/nats/nats.conf:ro
      - ./config/certs:/etc/nats/certs:ro
    ports:
      - 127.0.0.1:4222:4222
      - 127.0.0.1:8222:8222
      - 127.0.0.1:6222:6222
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:8222/healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    networks:
      - sahool-network
  nats-prometheus-exporter:
    image: natsio/prometheus-nats-exporter:0.14.0
    container_name: sahool-nats-prometheus-exporter
    restart: unless-stopped
    command:
      - -varz
      - -connz
      - -routez
      - -subz
      - -jsz=all
      - -healthz
      - http://nats:8222
    ports:
      - 127.0.0.1:7777:7777
    environment:
      - NATS_EXPORTER_LISTEN_ADDRESS=:7777
      - NATS_EXPORTER_LISTEN_PATH=/metrics
      - LOG_LEVEL=info
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://localhost:7777/metrics
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    networks:
      - sahool-network
  mqtt:
    image: eclipse-mosquitto:2.0.20
    container_name: sahool-mqtt
    environment:
      - MQTT_USER=${MQTT_USER:-sahool_iot}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?MQTT_PASSWORD is required}
    volumes:
      - ./infrastructure/core/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf.orig:ro
      - ./infrastructure/core/mqtt/acl:/mosquitto/config/acl.source:ro
      - ./infrastructure/core/mqtt/init-mqtt.sh:/init-mqtt.sh:ro
      - mqtt_passwd:/mosquitto/config
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    entrypoint:
      - /bin/sh
      - /init-mqtt.sh
    command: []
    ports:
      - 127.0.0.1:1883:1883
      - 127.0.0.1:9001:9001
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_sub -h localhost -u $$MQTT_USER -P $$MQTT_PASSWORD -t '$$SYS/broker/uptime'
          -C 1 -W 5
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    networks:
      - sahool-network
  mongo:
    profiles:
      - community
    image: mongo:6.0
    container_name: sahool-mongo
    volumes:
      - mongo_data:/data/db
      - mongo_configdb:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-sahool}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --oplogSize
      - '128'
    healthcheck:
      test:
        - CMD
        - mongosh
        - --eval
        - db.adminCommand('ping')
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    networks:
      - sahool-network
  mongo-init-replica:
    profiles:
      - community
    image: mongo:6.0
    container_name: sahool-mongo-init-replica
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - "echo \"Initializing MongoDB replica set...\"\nmongosh --host mongo:27017\
        \ -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase\
        \ admin --eval '\n  try {\n    rs.status();\n    print(\"Replica set already\
        \ initialized\");\n  } catch(e) {\n    rs.initiate({ _id: \"rs0\", members:\
        \ [{ _id: 0, host: \"mongo:27017\" }] });\n    print(\"Replica set initialized\
        \ successfully\");\n  }\n'\necho \"MongoDB replica set ready.\"\n"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-sahool}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    networks:
      - sahool-network
  rocketchat:
    profiles:
      - community
    image: registry.rocket.chat/rocketchat/rocket.chat:7.5
    container_name: sahool-rocketchat
    environment:
      MONGO_URL: mongodb://${MONGO_USER:-sahool}:${MONGO_PASSWORD:?MONGO_PASSWORD
        is required}@mongo:27017/rocketchat?authSource=admin&replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://${MONGO_USER:-sahool}:${MONGO_PASSWORD:?MONGO_PASSWORD
        is required}@mongo:27017/local?authSource=admin&replicaSet=rs0
      ROOT_URL: ${ROCKETCHAT_URL:-http://localhost:3100}
      PORT: '3000'
      DEPLOY_METHOD: docker
      DEPLOY_PLATFORM: sahool
      ADMIN_USERNAME: ${ROCKETCHAT_ADMIN_USER:-rc_admin}
      ADMIN_PASS: ${ROCKETCHAT_ADMIN_PASSWORD:?ROCKETCHAT_ADMIN_PASSWORD is required}
      ADMIN_EMAIL: ${ROCKETCHAT_ADMIN_EMAIL:-admin@sahool.io}
      OVERWRITE_SETTING_Language: ${ROCKETCHAT_LANGUAGE:-ar}
      OVERWRITE_SETTING_Show_Setup_Wizard: completed
      OVERWRITE_SETTING_API_Enable_Rate_Limiter: 'true'
      OVERWRITE_SETTING_API_Enable_Rate_Limiter_Limit_Time_Default: '60000'
      OVERWRITE_SETTING_API_Enable_Rate_Limiter_Limit_Calls_Default: '30'
      OVERWRITE_SETTING_FileUpload_MaxFileSize: '10485760'
      OVERWRITE_SETTING_FileUpload_MediaTypeWhiteList: image/jpeg,image/png,image/gif,application/pdf,audio/mpeg,audio/ogg,video/mp4
      OVERWRITE_SETTING_Accounts_RegistrationForm: Disabled
      OVERWRITE_SETTING_Site_Name: "SAHOOL Community | \u0645\u062C\u062A\u0645\u0639\
        \ \u0633\u0647\u0648\u0644"
      OVERWRITE_SETTING_Layout_Home_Title: "\u0645\u0631\u062D\u0628\u0627\u064B \u0628\
        \u0643 \u0641\u064A \u0645\u062C\u062A\u0645\u0639 \u0627\u0644\u0645\u0632\
        \u0627\u0631\u0639\u064A\u0646"
    volumes:
      - rocketchat_uploads:/app/uploads
    ports:
      - 127.0.0.1:3100:3000
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/api/v1/info
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    networks:
      - sahool-network
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: sahool-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - ETCD_AUTH_TOKEN=simple
      - ETCDCTL_API=3
      - ETCDCTL_ENDPOINTS=http://127.0.0.1:2379
      - ETCD_ROOT_USERNAME=${ETCD_ROOT_USERNAME:?ETCD_ROOT_USERNAME required. Run
        'make dev' or copy .env.example to .env}
      - ETCD_ROOT_PASSWORD=${ETCD_ROOT_PASSWORD:?ETCD_ROOT_PASSWORD required. Run
        'make dev' or copy .env.example to .env}
    volumes:
      - etcd_data:/etcd-data
      - ./infrastructure/core/etcd/init-auth.sh:/scripts/init-auth.sh:ro
    command: /usr/local/bin/etcd --advertise-client-urls=http://etcd:2379 --listen-client-urls=http://etcd:2379,http://127.0.0.1:2379
      --data-dir=/etcd-data
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/etcdctl
        - endpoint
        - health
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      etcd-perms-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2G
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - sahool-network
  etcd-perms-init:
    image: alpine:3.20
    container_name: sahool-etcd-perms-init
    volumes:
      - etcd_data:/etcd-data
    entrypoint:
      - /bin/sh
      - -c
    command:
      - chmod 700 /etcd-data && chown -R 0:0 /etcd-data && echo 'etcd-data permissions
        fixed to 0700'
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
    networks:
      - sahool-network
  etcd-init:
    profiles:
      - etcd-auth
    build:
      context: .
      dockerfile: docker/Dockerfile.etcd-init
    image: sahool/etcd-init:v3.5.18
    container_name: sahool-etcd-init
    environment:
      - ETCDCTL_API=3
      - ETCDCTL_ENDPOINTS=http://etcd:2379
      - ETCD_ROOT_USERNAME=${ETCD_ROOT_USERNAME:?ETCD_ROOT_USERNAME required. Run
        'make dev' or copy .env.example to .env}
      - ETCD_ROOT_PASSWORD=${ETCD_ROOT_PASSWORD:?ETCD_ROOT_PASSWORD required. Run
        'make dev' or copy .env.example to .env}
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - ./infrastructure/core/etcd/init-auth.sh:/scripts/init-auth.sh:ro
    entrypoint:
      - /bin/sh
    command:
      - /scripts/init-auth.sh
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    networks:
      - sahool-network
  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: sahool-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required. Run 'make dev'
        or copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required. Run
        'make dev' or copy .env.example to .env}
      MINIO_OPTS: ${MINIO_OPTS:-}
      MINIO_BROWSER: ${MINIO_BROWSER:-off}
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE:-jwt}
      MINIO_DOMAIN: ${MINIO_DOMAIN:-minio.sahool.local}
      MINIO_API_REQUESTS_MAX: ${MINIO_API_REQUESTS_MAX:-1000}
      MINIO_API_REQUESTS_DEADLINE: ${MINIO_API_REQUESTS_DEADLINE:-10s}
      MINIO_REGION: ${MINIO_REGION:-me-south-1}
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@localhost:9000
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9090:9090
    volumes:
      - minio_data:/minio_data
      - ${MINIO_CERTS_DIR:-./docker/minio-certs}:/root/.minio/certs:ro
    command: minio server /minio_data --console-address ":9090"
    healthcheck:
      test:
        - CMD-SHELL
        - mc ready local
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    networks:
      - sahool-network
    labels:
      com.sahool.service: object-storage
      com.sahool.description: MinIO S3-compatible object storage with TLS and SSE
      com.sahool.security.tls: enabled
      com.sahool.security.encryption: sse-s3
  kong:
    image: kong:3.9.0
    container_name: sahool-kong
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong-core.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_PLUGINS: bundled,cors,rate-limiting,jwt,acl,prometheus
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      KONG_DNS_RESOLVER: 127.0.0.11:53
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_CACHE_TTL: 300
      KONG_DNS_STALE_TTL: 30
      KONG_DNS_ERROR_TTL: 30
      KONG_DNS_NO_SYNC: 'on'
      KONG_DNS_NOT_FOUND_TTL: 30
      KONG_NGINX_WORKER_PROCESSES: '4'
      KONG_NGINX_WORKER_CONNECTIONS: 4096
      KONG_NGINX_KEEPALIVE_TIMEOUT: 60s
