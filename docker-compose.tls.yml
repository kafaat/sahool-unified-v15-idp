# ═══════════════════════════════════════════════════════════════════════════════
# Docker Compose TLS Configuration Override
# Adds TLS/SSL encryption for internal service communication
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.tls.yml up
#
# Or set in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.tls.yml
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL with TLS
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/certs/server.crt
      -c ssl_key_file=/var/lib/postgresql/certs/server.key
      -c ssl_ca_file=/var/lib/postgresql/certs/ca.crt
      -c ssl_min_protocol_version=TLSv1.2
      -c ssl_prefer_server_ciphers=on
    volumes:
      - ./config/certs/postgres:/var/lib/postgresql/certs:ro

  # ─────────────────────────────────────────────────────────────────────────────
  # PgBouncer with TLS (full enforcement)
  # SECURITY: Overrides pgbouncer.ini defaults (allow) to enforce TLS for all
  # client and server connections. All 728+ connections will require TLS.
  # ─────────────────────────────────────────────────────────────────────────────
  pgbouncer:
    # Override pgbouncer.ini with TLS-enforced version.
    # The base pgbouncer.ini uses allow/prefer; this overlay mounts a
    # production config that sets server_tls_sslmode=require and
    # client_tls_sslmode=require with cert/key paths.
    volumes:
      - ./infrastructure/core/pgbouncer/pgbouncer-tls.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/certs/pgbouncer:/etc/pgbouncer/certs:ro

  # ─────────────────────────────────────────────────────────────────────────────
  # Etcd with TLS (manual certificates)
  # SECURITY: Overrides auto-TLS with proper CA-signed certificates.
  # Generate certs first: ./infrastructure/core/etcd/generate-certs.sh
  # ─────────────────────────────────────────────────────────────────────────────
  etcd:
    environment:
      # Disable auto-TLS in favor of manual certificates
      - ETCD_AUTO_TLS=false
      - ETCD_PEER_AUTO_TLS=false
      # Client TLS (etcd ↔ clients like Milvus)
      - ETCD_CERT_FILE=/etc/etcd/certs/server.pem
      - ETCD_KEY_FILE=/etc/etcd/certs/server-key.pem
      - ETCD_TRUSTED_CA_FILE=/etc/etcd/certs/ca.pem
      - ETCD_CLIENT_CERT_AUTH=false
      # Peer TLS (etcd ↔ etcd, for future multi-node clusters)
      - ETCD_PEER_CERT_FILE=/etc/etcd/certs/server.pem
      - ETCD_PEER_KEY_FILE=/etc/etcd/certs/server-key.pem
      - ETCD_PEER_TRUSTED_CA_FILE=/etc/etcd/certs/ca.pem
      # Healthcheck with proper CA verification
      - ETCDCTL_CACERT=/etc/etcd/certs/ca.pem
      - ETCDCTL_INSECURE_SKIP_TLS_VERIFY=false
    volumes:
      - ./infrastructure/core/etcd/certs:/etc/etcd/certs:ro

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis with TLS
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    command: [
      "redis-server",
      "/usr/local/etc/redis/redis.conf",
      "--appendonly", "yes",
      "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
      "--maxmemory", "512mb",
      "--maxmemory-policy", "allkeys-lru",
      "--tcp-keepalive", "60",
      # TLS Configuration
      "--tls-port", "6379",
      "--port", "0",
      "--tls-cert-file", "/etc/redis/certs/server.crt",
      "--tls-key-file", "/etc/redis/certs/server.key",
      "--tls-ca-cert-file", "/etc/redis/certs/ca.crt",
      "--tls-auth-clients", "optional",
      "--tls-protocols", "TLSv1.2 TLSv1.3",
      "--tls-prefer-server-ciphers", "yes",
      "--tls-session-caching", "yes"
    ]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cert /etc/redis/certs/server.crt --key /etc/redis/certs/server.key --cacert /etc/redis/certs/ca.crt -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/certs/redis:/etc/redis/certs:ro
    environment:
      - REDIS_TLS_ENABLED=yes

  # ─────────────────────────────────────────────────────────────────────────────
  # NATS with TLS
  # Uses nats-secure.conf which enforces mTLS, TLS 1.2+, and modern cipher suites
  # ─────────────────────────────────────────────────────────────────────────────
  nats:
    command: [ "-c", "/etc/nats/nats-secure.conf" ]
    volumes:
      - ./config/nats/nats-secure.conf:/etc/nats/nats-secure.conf:ro
      - ./config/certs/nats:/etc/nats/certs:ro

  # ─────────────────────────────────────────────────────────────────────────────
  # Kong with TLS
  # ─────────────────────────────────────────────────────────────────────────────
  kong:
    environment:
      # Enable SSL for proxy
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_SSL_CERT: /etc/kong/certs/server.crt
      KONG_SSL_CERT_KEY: /etc/kong/certs/server.key
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./config/certs/kong:/etc/kong/certs:ro

# ═══════════════════════════════════════════════════════════════════════════════
# Notes:
# ═══════════════════════════════════════════════════════════════════════════════
#
# 1. Certificate Generation:
#    Before using this configuration, generate certificates:
#    ./config/certs/generate-internal-tls.sh
#    ./infrastructure/core/etcd/generate-certs.sh
#
# 2. Service Connection Updates:
#    Application services need to be updated to use TLS connections:
#    - PostgreSQL: sslmode=prefer or sslmode=require in connection string
#    - Redis: Use rediss:// instead of redis:// (TLS port)
#    - NATS: Use nats+tls:// or configure TLS in client
#    - Kong: Access via https://kong:8443 for TLS
#    - Etcd: Clients must use https://etcd:2379 (auto-TLS by default, CA-signed with overlay)
#    - PgBouncer: Clients should use sslmode=require in connection string
#
# 3. Client Certificates:
#    For full mTLS (mutual TLS), clients need:
#    - CA certificate to verify server
#    - Client certificate and key for authentication
#    All certificates are in config/certs/<service>/ directory
#
# 4. Development vs Production:
#    - Development: Use ssl_mode=prefer (allows fallback to non-TLS)
#    - Production: Use ssl_mode=require or ssl_mode=verify-full
#
# 5. Certificate Rotation:
#    Certificates expire after 825 days (~2.25 years)
#    Regenerate before expiration:
#    ./config/certs/generate-internal-tls.sh --force
#
# ═══════════════════════════════════════════════════════════════════════════════
