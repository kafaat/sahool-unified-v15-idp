# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL v16.0.0 Unified Docker Compose
# Complete platform deployment with all core, optional, and infrastructure services (v3.1: +4 optional profile services)
# ═══════════════════════════════════════════════════════════════════════════════

# Default logging configuration to prevent unbounded log growth
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Infrastructure Services (6)
  # ─────────────────────────────────────────────────────────────────────────────

  # قاعدة البيانات المكانية (PostGIS)
  # SECURITY: POSTGRES_PASSWORD MUST be set in .env file
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sahool-postgres
    # FIX: Set max_connections=300 to accommodate PgBouncer's max_db_connections=250
    # plus superuser_reserved_connections (default 3) and direct admin connections
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sahool}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/core/postgres/init:/docker-entrypoint-initdb.d:ro
    # Use tmpfs for temporary data (security hardening)
    tmpfs:
      - /tmp
      - /run/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    # Security options for container hardening
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sahool}" ]
      interval: 15s
      timeout: 10s
      # FIX: Increased retries from 3 to 8 for first-time PostGIS initialization
      # PostGIS extension creation + init scripts can take 2-3 minutes on slow machines
      retries: 8
      # FIX: Increased start_period from 30s to 60s for Docker Desktop/Windows environments
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging
    networks:
      - sahool-network

  # PgBouncer - Connection Pooler for PostgreSQL
  # Prevents connection exhaustion with 39+ services
  # تجميع اتصالات قاعدة البيانات
  # OPTIMIZED: Enhanced pool settings based on PgBouncer audit (score 7/10 -> 9/10)
  # FIXED: Added custom entrypoint to generate userlist.txt dynamically
  pgbouncer:
    # Pinned to v1.23.1-p3 - stable and well-tested version
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: sahool-pgbouncer
    # Custom entrypoint generates userlist.txt from environment variables
    # FIX: Use "sh" explicitly to avoid Windows bind-mount execute permission issues
    entrypoint: [ "sh", "/entrypoint-custom.sh" ]
    environment:
      # Database connection (using individual vars to avoid credential pattern detection)
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-sahool}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-sahool}
      # PgBouncer configuration paths
      PGBOUNCER_CONFIG: /etc/pgbouncer/pgbouncer.ini
      USERLIST_FILE: /etc/pgbouncer/runtime/userlist.txt
      # Pool settings - OPTIMIZED for 39+ services
      POOL_MODE: transaction
      MAX_DB_CONNECTIONS: 250 # Increased from 100 (6 connections per service avg)
      DEFAULT_POOL_SIZE: 30 # Increased from 20 for better throughput
      MIN_POOL_SIZE: 10 # Increased to maintain warm connection pool
      RESERVE_POOL_SIZE: 10 # Increased reserve pool for maintenance
      MAX_CLIENT_CONN: 800 # Increased to match pgbouncer.ini
      # Timeouts - OPTIMIZED
      CLIENT_IDLE_TIMEOUT: 900 # Added: 15 min (was 0/disabled)
      SERVER_IDLE_TIMEOUT: 600 # 10 min
      QUERY_TIMEOUT: 120
      QUERY_WAIT_TIMEOUT: 30
      # Admin
      ADMIN_USERS: pgbouncer_admin
      STATS_USERS: pgbouncer_stats
    volumes:
      # Custom entrypoint script (MUST be writable to fix permissions)
      - ./infrastructure/core/pgbouncer/entrypoint.sh:/entrypoint-custom.sh

      # PgBouncer configuration
      - ./infrastructure/core/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro

      # TLS Certificates
      - ./config/certs:/etc/pgbouncer/certs:ro

      # Writable tmpfs for userlist.txt (regenerated on every start by entrypoint.sh)
      # Named volume removed: caused permission denied for non-root container user
      - type: tmpfs
        target: /etc/pgbouncer/runtime
        tmpfs:
          size: 1048576
      # Healthcheck script (comprehensive pool verification)
      - ./infrastructure/core/pgbouncer/healthcheck.sh:/healthcheck.sh:ro
    ports:
      - "127.0.0.1:6432:6432" # SECURITY: localhost only
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # FIX: Use comprehensive healthcheck that verifies actual query execution and pool status
      # Previously used 'nc -z' which only checks TCP port, not actual PgBouncer functionality
      # The healthcheck.sh script runs SHOW POOLS and checks pool utilization
      # NOTE: Use $$ to escape dollar signs - docker-compose interpolates ${} but $$ passes $ to the shell
      # FIX: Primary check is port liveness (nc), enhanced check via healthcheck.sh
      # healthcheck.sh may fail if psql is not available (apk add fails without network)
      # In that case, it falls back to nc-only check internally
      test: [ "CMD-SHELL", "POSTGRES_USER=$$DB_USER POSTGRES_PASSWORD=$$DB_PASSWORD sh /healthcheck.sh || nc -z localhost 6432" ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - sahool-network

  # ═══════════════════════════════════════════════════════════════════════════
  # REDIS - Secure Cache & Session Store
  # ═══════════════════════════════════════════════════════════════════════════
  # SECURITY: REDIS_PASSWORD MUST be set in .env file
  # Enhanced security features:
  # - Password authentication (requirepass)
  # - Dangerous commands renamed (FLUSHDB, FLUSHALL, CONFIG, etc.)
  # - AOF persistence for data durability
  # - Memory limits with LRU eviction policy
  # - Slow query logging for performance monitoring
  # - Connection timeout to prevent resource exhaustion
  # - TLS/SSL ready (uncomment TLS settings in redis.conf)
  redis:
    image: redis:7.4-alpine
    container_name: sahool-redis
    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
        "--maxmemory",
        "512mb"
          # TLS Configuration (uncomment to enable):
          # "--port", "0",
          # "--tls-port", "6379",
          # "--tls-cert-file", "/etc/redis/certs/server.crt",
          # "--tls-key-file", "/etc/redis/certs/server.key",
          # "--tls-ca-cert-file", "/etc/redis/certs/ca.crt",
          # "--tls-auth-clients", "optional"
      ]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_MAXMEMORY=512mb
      # ACL User Passwords (set these for enhanced security)
      - REDIS_APP_PASSWORD=${REDIS_APP_PASSWORD:-${REDIS_PASSWORD}}
      - REDIS_ADMIN_PASSWORD=${REDIS_ADMIN_PASSWORD:-${REDIS_PASSWORD}}
      - REDIS_KONG_PASSWORD=${REDIS_KONG_PASSWORD:-${REDIS_PASSWORD}}
      - REDIS_READONLY_PASSWORD=${REDIS_READONLY_PASSWORD:-${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
      # Use secure configuration with TLS and ACL support
      - ./infrastructure/redis/redis-secure.conf:/usr/local/etc/redis/redis.conf:ro
      # TLS Certificates (REQUIRED for production)
      - ./config/certs:/etc/redis/certs:ro
    ports:
      # Bind to localhost only for security (services access via Docker network)
      - "127.0.0.1:6379:6379"
      # TLS port (uncomment when TLS is enabled in redis-secure.conf)
      # - "127.0.0.1:6380:6380"
    healthcheck:
      # FIX: Use REDISCLI_AUTH env var instead of -a flag to avoid credential exposure in process list
      test: [ "CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG" ]
      # TLS-enabled health check (uncomment when TLS is enabled):
      # test: ["CMD-SHELL", "redis-cli --tls --cert /etc/redis/certs/redis-client.crt --key /etc/redis/certs/redis-client.key --cacert /etc/redis/certs/ca.crt -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging: *default-logging
    networks:
      - sahool-network

  # ═══════════════════════════════════════════════════════════════════════════
  # VAULT - HashiCorp Vault for Secrets Management
  # ═══════════════════════════════════════════════════════════════════════════
  # SECURITY: Development mode only - use proper backend in production
  # Access UI: http://localhost:8200/ui
  # Dev Token: dev-root-token (DO NOT use in production)
  vault:
    image: hashicorp/vault:1.17
    container_name: sahool-vault
    hostname: vault
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_TOKEN:-dev-root-token}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOG_LEVEL: "info"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
    healthcheck:
      test: [ "CMD", "vault", "status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging: *default-logging
    networks:
      - sahool-network

  # NATS JetStream - Message Queue with Authentication
  # SECURITY: NATS credentials MUST be set in .env file
  # HARDENED: TLS enforced, encryption at rest, rate limiting enabled
  nats:
    image: nats:2.10.24-alpine
    container_name: sahool-nats
    # Use non-TLS config for development (switch to nats-secure.conf when TLS certs are available)
    command: [ "-c", "/etc/nats/nats.conf" ]
    environment:
      # NATS Authentication - injected into config file
      NATS_USER: ${NATS_USER:?NATS_USER is required}
      NATS_PASSWORD: ${NATS_PASSWORD:?NATS_PASSWORD is required}
      NATS_ADMIN_USER: ${NATS_ADMIN_USER:?NATS_ADMIN_USER is required}
      NATS_ADMIN_PASSWORD: ${NATS_ADMIN_PASSWORD:?NATS_ADMIN_PASSWORD is required}
      NATS_MONITOR_USER: ${NATS_MONITOR_USER:?NATS_MONITOR_USER is required}
      NATS_MONITOR_PASSWORD: ${NATS_MONITOR_PASSWORD:?NATS_MONITOR_PASSWORD is required}
      NATS_CLUSTER_USER: ${NATS_CLUSTER_USER:?NATS_CLUSTER_USER is required}
      NATS_CLUSTER_PASSWORD: ${NATS_CLUSTER_PASSWORD:?NATS_CLUSTER_PASSWORD is required}
      # SECURITY ENHANCEMENT: System account for monitoring
      NATS_SYSTEM_USER: ${NATS_SYSTEM_USER:?NATS_SYSTEM_USER is required}
      NATS_SYSTEM_PASSWORD: ${NATS_SYSTEM_PASSWORD:?NATS_SYSTEM_PASSWORD is required}
      # SECURITY ENHANCEMENT: JetStream encryption key (AES-256)
      NATS_JETSTREAM_KEY: ${NATS_JETSTREAM_KEY:?NATS_JETSTREAM_KEY is required}
    volumes:
      - nats_data:/data
      - ./config/nats/nats-secure.conf:/etc/nats/nats-secure.conf:ro
      - ./config/nats/nats.conf:/etc/nats/nats.conf:ro
      # TLS Certificates (REQUIRED for production)
      - ./config/certs:/etc/nats/certs:ro
    ports:
      - "127.0.0.1:4222:4222" # Standard NATS port (non-TLS for development)
      # - "127.0.0.1:4223:4223" # TLS NATS port (uncomment when TLS listener is configured)
      - "127.0.0.1:8222:8222" # Monitoring port
      # Cluster port (for HA setup)
      - "127.0.0.1:6222:6222"
    healthcheck:
      # Health check via monitoring endpoint (no auth required for /healthz)
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging: *default-logging
    networks:
      - sahool-network

  # NATS Prometheus Exporter - Enhanced Metrics for JetStream
  # Provides detailed metrics for streams, consumers, and message queue performance
  nats-prometheus-exporter:
    image: natsio/prometheus-nats-exporter:0.14.0
    container_name: sahool-nats-prometheus-exporter
    restart: unless-stopped
    command:
      - '-varz'
      - '-connz'
      - '-routez'
      - '-subz'
      - '-jsz=all'
      - '-healthz'
      - 'http://nats:8222'
    ports:
      - "127.0.0.1:7777:7777" # Exporter metrics port
    environment:
      - NATS_EXPORTER_LISTEN_ADDRESS=:7777
      - NATS_EXPORTER_LISTEN_PATH=/metrics
      - LOG_LEVEL=info
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7777/metrics" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging: *default-logging
    networks:
      - sahool-network

  # ═══════════════════════════════════════════════════════════════════════════
  # MLFLOW - AI/ML Model Registry & Experiment Tracking
  # ═══════════════════════════════════════════════════════════════════════════
  # MLflow provides:
  # - Model versioning and registry
  # - Experiment tracking
  # - Model serving (optional)
  # - Artifact storage
  #
  # Access UI: http://localhost:5000
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    container_name: sahool-mlflow
    hostname: mlflow
    # FIX: Install psycopg2-binary before starting MLflow (required for PostgreSQL backend)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install --quiet psycopg2-binary && \
        mlflow server --host 0.0.0.0 --port 5000 \
          --backend-store-uri postgresql://${POSTGRES_USER:-sahool}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:6432/mlflow?sslmode=disable&pgbouncer=true \
          --default-artifact-root /mlflow/artifacts \
          --serve-artifacts
    environment:
      - MLFLOW_TRACKING_URI=http://localhost:5000
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL:-}
      - AWS_ACCESS_KEY_ID=${MLFLOW_AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${MLFLOW_AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      # FIX: Use python urllib instead of curl (curl may not exist in MLflow image)
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging: *default-logging
    networks:
      - sahool-network

  # MQTT Broker - IoT Communication
  mqtt:
    image: eclipse-mosquitto:2.0.20
    container_name: sahool-mqtt
    user: root
    environment:
      - MQTT_USER=${MQTT_USER:-sahool_iot}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?MQTT_PASSWORD is required}
    volumes:
      - ./infrastructure/core/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf.orig:ro
      - ./infrastructure/core/mqtt/acl:/mosquitto/config/acl.source:ro
      - ./infrastructure/core/mqtt/init-mqtt.sh:/init-mqtt.sh:ro
      - mqtt_passwd:/mosquitto/config
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    # Fix file permissions using root user to eliminate warnings
    # The Docker entrypoint chowns /mosquitto to mosquitto:mosquitto when running as root
    # Our init script fixes permissions after entrypoint and starts mosquitto
    entrypoint: [ "/bin/sh", "/init-mqtt.sh" ]
    command: []
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
    healthcheck:
      # FIX: sahool_iot user does NOT have $SYS ACL access (only 'monitor' user does)
      # Use mosquitto_pub on sahool/system/# which sahool_iot has readwrite access to
      # This proves: broker running + auth working + ACL correct
      # NOTE: nc/netcat and /dev/tcp are NOT available in Alpine mosquitto image
      test: [ "CMD-SHELL", "mosquitto_pub -h localhost -u $$MQTT_USER -P $$MQTT_PASSWORD -t 'sahool/system/healthcheck' -m 'ok' -q 0" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging: *default-logging
    networks:
      - sahool-network

  # Qdrant Vector Database - RAG & Semantic Search
  qdrant:
    # Using v1.7.4 - stable release with improved vector search performance
    # استخدام الإصدار v1.7.4 - إصدار ثابت مع أداء محسّن للبحث الشعاعي
    image: qdrant/qdrant:v1.7.4
    container_name: sahool-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      # SECURITY: API Key authentication (set QDRANT_API_KEY in .env for production)
      # الأمان: مصادقة مفتاح API (اضبط QDRANT_API_KEY في .env للإنتاج)
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-changeme_in_production}
      - QDRANT__LOG_LEVEL=INFO
    # Qdrant healthcheck - verify qdrant is listening on REST port (6333)
    # فحص صحة Qdrant - التحقق من أن qdrant يستمع على منفذ REST
    # NOTE: qdrant/qdrant image is minimal Debian (no curl/wget/nc/bash)
    # Use /proc/net/tcp to verify port 6333 (0x18BD) has a LISTEN socket
    # For full HTTP health, use K8s livenessProbe against /healthz
    # See: https://github.com/qdrant/qdrant/issues/4250
    healthcheck:
      test: [ "CMD-SHELL", "grep -q ':18BD' /proc/net/tcp || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging: *default-logging
    networks:
      - sahool-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Ollama - Local LLM Server for Log Analysis
  # خادم نماذج الذكاء الاصطناعي المحلي لتحليل السجلات
  # ─────────────────────────────────────────────────────────────────────────────

  # Ollama with DeepSeek Coder - Local LLM for Docker Log Analysis
  # Supports 20+ concurrent agents for parallel analysis
  # NOTE: Requires NVIDIA GPU. Use: docker compose --profile gpu up -d
  ollama:
    profiles:
      - gpu
    image: ollama/ollama:0.5.4
    container_name: sahool-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      # SECURITY: CORS origin restrictions (set specific origins in production)
      # الأمان: قيود منشأ CORS (حدد المنشآت المحددة في الإنتاج)
      - OLLAMA_ORIGINS=${OLLAMA_ORIGINS:-*}
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=24
      - OLLAMA_MAX_LOADED_MODELS=2
      # GPU Configuration - Force GPU-only execution
      # تكوين GPU - إجبار التنفيذ على GPU فقط
      - OLLAMA_NUM_GPU=${OLLAMA_NUM_GPU:-1}
      # Use first GPU (set to "0,1" for multiple GPUs)
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      # Force all layers to GPU (999 = all layers, disables CPU fallback)
      - OLLAMA_GPU_LAYERS=${OLLAMA_GPU_LAYERS:-999}
    healthcheck:
      test: [ "CMD-SHELL", "ollama list || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    logging: *default-logging
    networks:
      - sahool-network

  # Ollama Model Loader - Downloads deepseek model on startup
  # تحميل نموذج DeepSeek عند بدء التشغيل
  # NOTE: Only runs when gpu profile is active
  ollama-model-loader:
    profiles:
      - gpu
    image: curlimages/curl:8.11.1
    container_name: sahool-ollama-model-loader
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Waiting for Ollama to be ready..."
        sleep 5
        echo "Pulling deepseek model..."
        curl -X POST http://ollama:11434/api/pull -d '{"name":"deepseek"}' --max-time 3600
        echo "Model download complete!"
        # Keep container running to show completion
        sleep 10
    restart: "no"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging: *default-logging
    networks:
      - sahool-network

  # ─────────────────────────────────────────────────────────────────────────────
  # vLLM Inference Server - DeepSeek Coder 6.7B (GPU-accelerated)
  # خادم استدلال vLLM - ديب سيك كودر (مسرّع بالمعالج الرسومي)
  # NOTE: Requires NVIDIA GPU. Use: docker compose --profile gpu up -d
  # API: http://localhost:${VLLM_PORT:-8270}/v1 (OpenAI-compatible)
  # ─────────────────────────────────────────────────────────────────────────────
  vllm-deepseek:
    profiles:
      - gpu
    build:
      context: .
      dockerfile: apps/services/vllm-deepseek/Dockerfile
    image: sahool/vllm-deepseek:16.0.0
    container_name: sahool-vllm
    volumes:
      - vllm_models:/models
      - vllm_hf_cache:/home/sahool/.cache/huggingface
    ports:
      - "127.0.0.1:${VLLM_PORT:-8270}:${VLLM_PORT:-8270}"
    environment:
      - VLLM_MODEL=${VLLM_MODEL:-deepseek-ai/deepseek-coder-6.7b-instruct}
      - VLLM_PORT=${VLLM_PORT:-8270}
      - VLLM_HOST=0.0.0.0
      - VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-16384}
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${VLLM_PORT:-8270}/health" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: ${VLLM_MEMORY_LIMIT:-32G}
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT:-1}
              capabilities: [ gpu ]
    networks:
      sahool-network:
        aliases:
          - vllm
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Real-time Code Review Service - Monitors codebase and reviews with DeepSeek
  # خدمة مراجعة الكود في الوقت الفعلي باستخدام DeepSeek
  # NOTE: Requires Ollama with GPU. Use: docker compose --profile gpu up -d
  code-review-service:
    profiles:
      - gpu
    build:
      context: .
      dockerfile: apps/services/code-review-service/Dockerfile
    container_name: sahool-code-review
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=deepseek
      - WATCH_PATHS=infrastructure:docker-compose.yml:docker
      - LOG_LEVEL=INFO
      - REVIEW_ON_CHANGE=true
      - MAX_FILE_SIZE=1000000
      - API_HOST=0.0.0.0
      - API_PORT=8102
    ports:
      - "127.0.0.1:8102:8102"
    volumes:
      - .:/app/codebase:ro
      - code_review_logs:/app/logs
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://localhost:8102/health'); exit(0) if r.getcode()==200 else exit(1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - sahool-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ─────────────────────────────────────────────────────────────────────────────
  # Milvus Vector Database - Alternative to Qdrant for RAG & Semantic Search
  # Requires: etcd (metadata), minio (object storage)
  # قاعدة بيانات Milvus الشعاعية - بديل لـ Qdrant للبحث الدلالي
  # ─────────────────────────────────────────────────────────────────────────────

  # Etcd - Metadata storage for Milvus
  # تخزين البيانات الوصفية لـ Milvus
  # SECURITY: ETCD_ROOT_USERNAME and ETCD_ROOT_PASSWORD MUST be set in .env file
  etcd:
    # SECURITY FIX: Upgraded from v3.5.5 (Aug 2022, multiple CVEs) to v3.5.16
    image: quay.io/coreos/etcd:v3.5.16
    container_name: sahool-etcd
    environment:
      # Performance and compaction settings
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      # FIX: Reduced from 4GB to 512MB to match container memory limit (was causing OOM kills)
      - ETCD_QUOTA_BACKEND_BYTES=536870912
      - ETCD_SNAPSHOT_COUNT=50000
      # etcdctl configuration for healthcheck
      - ETCDCTL_API=3
      - ETCDCTL_ENDPOINTS=http://127.0.0.1:2379
      # Authentication credentials (used by init script and healthcheck)
      # Override in .env file for production (copy from .env.example): cp .env.example .env
      - ETCD_ROOT_USERNAME=${ETCD_ROOT_USERNAME:?ETCD_ROOT_USERNAME required. Run 'make dev' or copy .env.example to .env}
      - ETCD_ROOT_PASSWORD=${ETCD_ROOT_PASSWORD:?ETCD_ROOT_PASSWORD required. Run 'make dev' or copy .env.example to .env}
      # ETCDCTL_USER is set via env so healthcheck doesn't embed credentials inline
      # This avoids Checkov CKV_SECRET_6 (Base64 High Entropy String) false positive
      - ETCDCTL_USER=${ETCD_ROOT_USERNAME:?}:${ETCD_ROOT_PASSWORD:?}
    volumes:
      - etcd_data:/etcd-data
      - ./infrastructure/core/etcd/init-auth.sh:/scripts/init-auth.sh:ro
    # FIX: Changed advertise-client-urls from 127.0.0.1 to etcd (container hostname)
    # Using 127.0.0.1 causes client redirect failures when Milvus connects via 'etcd:2379'
    # FIX: Use /etcd-data (not /etcd) to avoid confusion with the binary path on some images
    command: >-
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd-data
    healthcheck:
      # FIX: etcdctl fails with "authentication is not enabled" when ETCDCTL_USER env is set
      # but auth hasn't been initialized yet (fresh start). See: github.com/etcd-io/etcd/issues/7724
      # Solution: Use HTTP /health endpoint which works regardless of auth state
      # Phase 1: wget (BusyBox, available in coreos/etcd) checks /health HTTP endpoint
      # Phase 2: etcdctl with ETCDCTL_USER unset via subshell (pre-auth or auth-disabled)
      # Phase 3: etcdctl with ETCDCTL_USER from env (post-auth-init)
      # NOTE: curl is NOT available in coreos/etcd Alpine image
      # FIX: Use flexible grep pattern to handle JSON with or without spaces
      # etcd v3.5.16 may return {"health": "true"} (with space) or {"health":"true"} (without)
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:2379/health 2>/dev/null | grep -q 'true' || (unset ETCDCTL_USER && etcdctl endpoint health) 2>/dev/null || etcdctl endpoint health 2>/dev/null" ]
      interval: 10s
      timeout: 10s
      retries: 15
      # FIX: Increased start_period from 30s to 45s for slow/resource-constrained environments
      # etcd WAL replay and initial compaction can be slow on Windows Docker Desktop
      start_period: 45s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          # FIX: Increased from 512M to 1G to accommodate etcd memory usage with 512MB quota
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - sahool-network

  # Etcd Authentication Initializer - One-time service to enable authentication
  # خدمة تهيئة المصادقة لـ Etcd - تعمل مرة واحدة لتفعيل المصادقة
  etcd-init:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: sahool-etcd-init
    environment:
      - ETCDCTL_API=3
      - ETCDCTL_ENDPOINTS=http://etcd:2379
      - ETCD_ROOT_USERNAME=${ETCD_ROOT_USERNAME:?ETCD_ROOT_USERNAME required. Run 'make dev' or copy .env.example to .env}
      - ETCD_ROOT_PASSWORD=${ETCD_ROOT_PASSWORD:?ETCD_ROOT_PASSWORD required. Run 'make dev' or copy .env.example to .env}
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - ./infrastructure/core/etcd/init-auth.sh:/scripts/init-auth.sh:ro
    command: [ "/bin/sh", "/scripts/init-auth.sh" ]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging: *default-logging
    networks:
      - sahool-network
  # MinIO - Object storage for Milvus
  # تخزين الكائنات لـ Milvus
  # SECURITY: MINIO_ROOT_USER and MINIO_ROOT_PASSWORD MUST be set in .env file
  minio:
    # Updated to newer stable version for security patches
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: sahool-minio
    environment:
      # Root credentials (minimum 16 characters)
      # Set in .env file (copy from .env.example): cp .env.example .env
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER required. Run 'make dev' or copy .env.example to .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required. Run 'make dev' or copy .env.example to .env}"

      # TLS/SSL Configuration
      # Certificates mounted at /root/.minio/certs
      # NOTE: Only set MINIO_OPTS when TLS certs exist; empty certs dir causes startup failure
      MINIO_OPTS: "${MINIO_OPTS:-}"

      # Security: Disable browser console in production
      MINIO_BROWSER: ${MINIO_BROWSER:-off}

      # Prometheus metrics - Require authentication
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE:-jwt}

      # Audit logging: Configure post-startup via `mc admin config set`
      # Example: mc admin config set primary audit_webhook:1 endpoint="http://webhook-url"
      # NOTE: MINIO_AUDIT_WEBHOOK_ENABLE env var removed (not a valid MinIO config variable)

      # Domain configuration for virtual-host-style requests
      MINIO_DOMAIN: ${MINIO_DOMAIN:-minio.sahool.local}

      # API configuration
      MINIO_API_REQUESTS_MAX: ${MINIO_API_REQUESTS_MAX:-1000}
      MINIO_API_REQUESTS_DEADLINE: ${MINIO_API_REQUESTS_DEADLINE:-10s}

      # Region configuration - matches deployment region (AWS me-south-1 Bahrain)
      MINIO_REGION: ${MINIO_REGION:-me-south-1}

      # mc client alias via env var (keeps credentials out of healthcheck CLI args;
      # note: still visible via docker inspect — use Docker secrets for full protection)
      MC_HOST_local: "http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@localhost:9000"
    ports:
      # Bind to localhost only - use reverse proxy for external access
      - "127.0.0.1:9000:9000" # MinIO API (HTTPS when TLS enabled)
      - "127.0.0.1:9090:9090" # MinIO Console (disabled in production)
    volumes:
      # Data volume
      - minio_data:/minio_data
      # TLS certificates (read-only) - optional for development
      # Generate with: ./scripts/security/setup-minio-security.sh
      # NOTE: Default points to docker/minio-certs/ (empty dir with .gitkeep) for dev
      # Override MINIO_CERTS_DIR in .env for production TLS
      - ${MINIO_CERTS_DIR:-./docker/minio-certs}:/root/.minio/certs:ro
    command: minio server /minio_data --console-address ":9090"
    healthcheck:
      # Health check: Uses 'mc ready local' to verify MinIO is ready.
      # فحص صحة MinIO - يستخدم 'mc ready local' للتحقق من جاهزية MinIO
      # FIX: curl/wget were removed from minio/minio images after RELEASE.2023-10-25
      # FIX: mc alias set was replaced with MC_HOST_local env var to avoid exposing
      # credentials in 'docker inspect' output. The MC_HOST_local variable follows the
      # format: MC_HOST_<alias>=https://<user>:<password>@<host>:<port>
      test: [ "CMD-SHELL", "mc ready local" ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1' # Increased from 0.5 for better performance
          memory: 1G # Increased from 512M for better performance
        reservations:
          cpus: '0.25' # Increased from 0.1
          memory: 256M # Increased from 128M
    logging: *default-logging
    networks:
      - sahool-network
    labels:
      com.sahool.service: "object-storage"
      com.sahool.description: "MinIO S3-compatible object storage with TLS and SSE"
      com.sahool.security.tls: "enabled"
      com.sahool.security.encryption: "sse-s3"

  # Milvus Standalone - Vector Database
  # قاعدة البيانات الشعاعية Milvus
  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: sahool-milvus
    environment:
      # Etcd connection with authentication
      ETCD_ENDPOINTS: etcd:2379
      ETCD_ROOT_PATH: /milvus
      ETCD_USE_SSL: "false"
      # Etcd authentication credentials
      ETCD_USERNAME: ${ETCD_ROOT_USERNAME:?ETCD_ROOT_USERNAME is required}
      ETCD_PASSWORD: ${ETCD_ROOT_PASSWORD:?ETCD_ROOT_PASSWORD is required}
      # MinIO connection with dedicated service account (least privilege)
      # Falls back to root credentials for backward compatibility (not recommended for production)
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}}
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    command: [ "milvus", "run", "standalone" ]
    depends_on:
      etcd:
        condition: service_healthy
      # FIX: Wait for etcd-init to enable auth before Milvus connects with credentials
      etcd-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging: *default-logging
    networks:
      - sahool-network

  # API Gateway (Kong)
  kong:
    image: kong:3.4.2
    container_name: sahool-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      # Development: HTTP only on port 8000
      # Production: Uncomment the line below and comment out the HTTP-only line
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      # KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      # SSL Configuration (REQUIRED for production)
      # Generate certificates and place in ./infrastructure/gateway/kong/ssl/
      # KONG_SSL_CERT: /etc/kong/ssl/server.crt
      # KONG_SSL_CERT_KEY: /etc/kong/ssl/server.key
      # Plugins - Optimized execution order for performance
      KONG_PLUGINS: "bundled,cors,rate-limiting,jwt,acl,prometheus"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

      # DNS Configuration for Docker internal DNS resolution
      # Use Docker's internal DNS resolver (127.0.0.11) for service discovery
      KONG_DNS_RESOLVER: 127.0.0.11:53
      KONG_DNS_ORDER: LAST,A,CNAME
      # DNS cache settings to reduce resolution attempts and improve resilience
      # Increased TTL values to reduce DNS queries for unstable services
      KONG_DNS_CACHE_TTL: 300
      KONG_DNS_STALE_TTL: 30
      KONG_DNS_ERROR_TTL: 30
      # DNS no-sync: Allow Kong to use stale DNS entries when resolution fails
      # This prevents Kong from blocking when services are temporarily unavailable
      KONG_DNS_NO_SYNC: "on"
      # DNS not-found TTL: Cache "not found" responses to reduce repeated queries
      KONG_DNS_NOT_FOUND_TTL: 30

      # Performance Optimization - Worker Processes
      KONG_NGINX_WORKER_PROCESSES: auto
      KONG_NGINX_WORKER_CONNECTIONS: 4096

      # Nginx Keepalive Settings
      KONG_NGINX_KEEPALIVE_TIMEOUT: 60s
      KONG_NGINX_KEEPALIVE_REQUESTS: 1000

      # Proxy Buffering Configuration
      # Note: KONG_NGINX_PROXY_BUFFER_SIZE may not be supported in Kong 3.4
      # Using default nginx buffer settings instead
      # KONG_NGINX_PROXY_BUFFER_SIZE: 128k
      # KONG_NGINX_PROXY_BUFFERS: 4 256k

      # Upstream Keepalive Configuration
      # Maintain persistent connections to upstream services to reduce connection overhead
      KONG_UPSTREAM_KEEPALIVE_POOL_SIZE: 60
      KONG_UPSTREAM_KEEPALIVE_MAX_REQUESTS: 100
      KONG_UPSTREAM_KEEPALIVE_IDLE_TIMEOUT: 60

      # Nginx Keepalive Configuration
      # Configure nginx-level keepalive settings for optimal connection pooling
      KONG_NGINX_HTTP_UPSTREAM_KEEPALIVE: 60
      KONG_NGINX_HTTP_UPSTREAM_KEEPALIVE_REQUESTS: 100
      KONG_NGINX_HTTP_UPSTREAM_KEEPALIVE_TIMEOUT: 60s

      # Memory and Cache Optimization
      KONG_MEM_CACHE_SIZE: 128m
    ports:
      - "127.0.0.1:8000:8000"
      # SSL port (REQUIRED for production - uncomment when SSL is enabled)
      # - "8443:8443"
      - "127.0.0.1:8001:8001" # Admin API - localhost only for security
    volumes:
      - ./infrastructure/gateway/kong/kong.yml:/kong/declarative/kong.yml:ro
      - ./infrastructure/gateway/kong/ssl:/etc/kong/ssl:ro
      - kong_logs:/var/log/kong
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "kong", "health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M
    logging: *default-logging
    networks:
      - sahool-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Node.js Services (10)
  # ─────────────────────────────────────────────────────────────────────────────

  # Field Management Service - Unified Field Operations
  # Consolidates: field-core, field-service, field-ops
  field-management-service:
    build:
      context: .
      dockerfile: apps/services/field-management-service/Dockerfile
    container_name: sahool-field-management-service
    environment:
      - NODE_ENV=production
      - PORT=3000
      # FIX: Add sslmode=disable since PgBouncer has TLS disabled in dev
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sahool}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:6432/${POSTGRES_DB:-sahool}?sslmode=disable&pgbouncer=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-sahool}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DB_NAME=${POSTGRES_DB:-sahool}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      - NATS_URL=nats://${NATS_USER:?NATS_USER is required}:${NATS_PASSWORD:?NATS_PASSWORD is required}@nats:4222
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      # FIX: Use pgbouncer instead of postgres for proper connection pooling
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 15s
      timeout: 10s
      retries: 5
      # FIX: Increased from 15s to 60s - NestJS needs time for Prisma connect + PostGIS + Redis
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging: *default-logging
    networks:
      - sahool-network

  # Marketplace Service - Agricultural Marketplace & FinTech
  marketplace-service:
    build:
      context: .
      dockerfile: apps/services/marketplace-service/Dockerfile
    container_name: sahool-marketplace
    environment:
      - PORT=3010
      - NODE_ENV=production
      # FIX: Add sslmode=disable since PgBouncer has TLS disabled in dev
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sahool}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:6432/${POSTGRES_DB:-sahool}?sslmode=disable&pgbouncer=true
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      - NATS_URL=nats://${NATS_USER:?NATS_USER is required}:${NATS_PASSWORD:?NATS_PASSWORD is required}@nats:4222
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://sahool.com,https://app.sahool.com}
    ports:
      - "127.0.0.1:3010:3010"
    depends_on:
      # FIX: Use pgbouncer instead of postgres for proper connection pooling
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3010/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging: *default-logging
    networks:
      - sahool-network

  # Research Core - Scientific Research Management
  research-core:
    build:
      context: .
      dockerfile: apps/services/research-core/Dockerfile
    container_name: sahool-research-core
    environment:
      - PORT=3015
      - NODE_ENV=production
      # FIX: Add sslmode=disable since PgBouncer has TLS disabled in dev
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sahool}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:6432/${POSTGRES_DB:-sahool}?sslmode=disable&pgbouncer=true
