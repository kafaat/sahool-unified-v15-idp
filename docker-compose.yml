          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging: *default-logging
    networks:
      - sahool-network

  # WhatsApp Bot Service - WhatsApp messaging integration
  # خدمة روبوت واتساب - تكامل رسائل واتساب
  # ACTIVATED: Removed from optional profile (Phase 0 improvement plan)
  whatsapp-bot-service:
    build:
      context: .
      dockerfile: apps/services/whatsapp-bot-service/Dockerfile
    container_name: sahool-whatsapp-bot-service
    environment:
      - PORT=8240
      - NATS_URL=nats://${NATS_USER:?NATS_USER is required}:${NATS_PASSWORD:?NATS_PASSWORD is required}@nats:4222
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sahool}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:6432/${POSTGRES_DB:-sahool}?sslmode=disable&pgbouncer=true
      - LLM_ORCHESTRATOR_URL=http://llm-orchestrator-service:8164
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    ports:
      - "127.0.0.1:8240:8240"
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      # FIX: Add missing dependency - whatsapp-bot-service references LLM_ORCHESTRATOR_URL
      llm-orchestrator-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8240/healthz')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging: *default-logging
    networks:
      - sahool-network

  # Digital Twin Engine - L3 simulation + optimization + decision support
  # محرك التوأم الرقمي - محاكاة L3 + تحسين + دعم القرار
  digital-twin-engine:
    build:
      context: .
      dockerfile: apps/services/digital-twin-engine/Dockerfile
    container_name: sahool-digital-twin-engine
    environment:
      - PORT=8253
      - NATS_URL=nats://${NATS_USER:?NATS_USER is required}:${NATS_PASSWORD:?NATS_PASSWORD is required}@nats:4222
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    ports:
      - "127.0.0.1:8253:8253"
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8253/healthz')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging: *default-logging
    networks:
      - sahool-network

