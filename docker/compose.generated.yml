services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sahool-postgres
    environment:
    - POSTGRES_USER=${POSTGRES_USER:-sahool}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sahool_dev}
    - POSTGRES_DB=${POSTGRES_DB:-sahool}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - ${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-sahool}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
    - sahool-network
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    container_name: sahool-redis
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
    ports:
    - ${REDIS_PORT:-6379}:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - sahool-network
    restart: unless-stopped
  nats:
    image: nats:2.10.24-alpine
    container_name: sahool-nats
    command:
    - --jetstream
    - --store_dir
    - /data
    volumes:
    - nats_data:/data
    ports:
    - ${NATS_PORT:-4222}:4222
    - 8222:8222
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:8222/healthz
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - sahool-network
    restart: unless-stopped
  mqtt:
    image: eclipse-mosquitto:2
    container_name: sahool-mqtt
    volumes:
    - mqtt_data:/mosquitto/data
    - mqtt_log:/mosquitto/log
    ports:
    - ${MQTT_PORT:-1883}:1883
    - 9001:9001
    networks:
    - sahool-network
    restart: unless-stopped
  crop-growth-model:
    build:
      context: ./apps/services/crop-growth-model
      dockerfile: Dockerfile
    container_name: sahool-crop-growth-model
    ports:
    - 3023:3023
    environment:
    - NODE_ENV=${NODE_ENV:-development}
    - PORT=3023
    - DATABASE_URL=${DATABASE_URL}
    - REDIS_URL=${REDIS_URL}
    - NATS_URL=${NATS_URL:-nats://nats:4222}
    healthcheck:
      test:
      - CMD
      - curl
