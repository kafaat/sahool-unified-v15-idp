    restart: unless-stopped
    labels:
    - sahool.service=iot-sensor-hub
    - sahool.port=8251
    - sahool.category=integration
    - traefik.enable=true
    - traefik.http.routers.iot-sensor-hub.rule=PathPrefix(`/api/v1/iot/sensor/hub`)
  demo-data:
    build:
      context: ./apps/services/demo-data
      dockerfile: Dockerfile
    container_name: sahool-demo-data
    ports:
    - 8261:8261
    environment:
    - NODE_ENV=${NODE_ENV:-development}
    - PORT=8261
    - DATABASE_URL=${DATABASE_URL}
    - REDIS_URL=${REDIS_URL}
    - NATS_URL=${NATS_URL:-nats://nats:4222}
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8261/healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
    - sahool-network
    restart: unless-stopped
    labels:
    - sahool.service=demo-data
    - sahool.port=8261
    - sahool.category=core
    - traefik.enable=true
    - traefik.http.routers.demo-data.rule=PathPrefix(`/api/v1/demo/data`)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sahool-web
    ports:
    - 3000:3000
    environment:
    - NODE_ENV=${NODE_ENV:-development}
    - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:8000}
    networks:
    - sahool-network
    restart: unless-stopped
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: sahool-admin
    ports:
    - 3001:3001
    environment:
    - NODE_ENV=${NODE_ENV:-development}
    - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:8000}
    networks:
    - sahool-network
    restart: unless-stopped
  mobile:
    build:
      context: ./apps/mobile
      dockerfile: Dockerfile
    container_name: sahool-mobile
    ports:
    - 3000:3000
    environment:
    - NODE_ENV=${NODE_ENV:-development}
    - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:8000}
    networks:
    - sahool-network
    restart: unless-stopped
networks:
  sahool-network:
    driver: bridge
volumes:
  postgres_data: {}
  redis_data: {}
  nats_data: {}
  mqtt_data: {}
  mqtt_log: {}
