version: '3.8'
services:
  iot-service:
    build:
      context: ../../apps/services/iot-service
      dockerfile: Dockerfile
    ports:
    - 8117:8117
    environment:
    - PORT=8117
    - NODE_ENV=production
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8117/healthz
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '400'
          memory: 512Mi
  ground-vision-service:
    build:
      context: ../../apps/services/ground-vision-service
      dockerfile: Dockerfile
    ports:
    - 8182:8182
    environment:
    - PORT=8182
    - ENVIRONMENT=production
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8182/healthz
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1000'
          memory: 2Gi
    depends_on:
    - vegetation-analysis-service
    - weather-service
    - iot-service
  satellite-service:
    build:
      context: ../../archive/deprecated-services/satellite-service
      dockerfile: Dockerfile
    ports:
    - 9190:9190
