    build:
      context: ../../apps/services/marketplace-service
      dockerfile: Dockerfile
    ports:
    - 3010:3010
    environment:
    - PORT=3010
    - NODE_ENV=production
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3010/healthz
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
