version: '3.8'
services:
  crop-growth-model:
    build:
      context: ../../apps/services/crop-growth-model
      dockerfile: Dockerfile
    ports:
    - 3023:3023
    environment:
    - PORT=3023
    - NODE_ENV=production
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3023/healthz
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512Mi
    depends_on:
    - redis
  yield-prediction:
    build:
      context: ../../apps/services/yield-prediction
