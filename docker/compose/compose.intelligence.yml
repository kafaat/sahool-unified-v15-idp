version: '3.8'
services:
  disaster-assessment:
    build:
      context: ../../apps/services/disaster-assessment
      dockerfile: Dockerfile
    ports:
    - 3020:3020
    environment:
    - PORT=3020
    - NODE_ENV=production
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3020/healthz
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256Mi
    depends_on:
    - weather-service
    - vegetation-analysis-service
