# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SAHOOL Dead Letter Queue (DLQ) Management Service
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Provides DLQ management API and monitoring for failed messages.
#
# Usage (overlay - requires main compose file which provides nats):
#   docker-compose -f docker-compose.yml -f docker/docker-compose.dlq.yml up -d
#
# Endpoints:
#   - API: http://localhost:8190/docs
#   - Health: http://localhost:8190/health
#   - Stats: http://localhost:8190/dlq/stats
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:
  # ────────────────────────────────────────────────────────────────────────────
  # DLQ Management Service
  # ────────────────────────────────────────────────────────────────────────────
  dlq-service:
    image: python:3.11-slim
    container_name: sahool-dlq-service
    working_dir: /app
    volumes:
      - ../shared:/app/shared:ro
      - ../requirements:/app/requirements:ro
    command: >
      sh -c "
      pip install -q fastapi uvicorn nats-py pydantic aiohttp &&
      cd /app/shared/events &&
      uvicorn dlq_service:app --host 0.0.0.0 --port 8190 --reload
      "
    ports:
      - "8190:8190"
    environment:
      # NATS connection
      NATS_URL: nats://${NATS_USER:-sahool_app}:${NATS_PASSWORD}@nats:4222

      # DLQ configuration
      DLQ_ENABLED: "true"
      DLQ_MAX_RETRIES: "3"
      DLQ_INITIAL_DELAY: "1.0"
      DLQ_MAX_DELAY: "60.0"
      DLQ_STREAM_NAME: "SAHOOL_DLQ"
      DLQ_MAX_AGE_DAYS: "30"
      DLQ_MAX_MESSAGES: "100000"
      DLQ_ALERT_THRESHOLD: "100"

      # Service metadata
      SERVICE_NAME: dlq-service
      SERVICE_VERSION: "1.0.0"

      # Logging
      LOG_LEVEL: INFO

    networks:
      - sahool-network
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8190/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    labels:
      com.sahool.service: "dlq-management"
      com.sahool.description: "Dead Letter Queue Management API"

  # ────────────────────────────────────────────────────────────────────────────
  # DLQ Monitor (Background Task)
  # ────────────────────────────────────────────────────────────────────────────
  dlq-monitor:
    image: python:3.11-slim
    container_name: sahool-dlq-monitor
    working_dir: /app
    volumes:
      - ../shared:/app/shared:ro
      - ../requirements:/app/requirements:ro
    command: >
      sh -c "
      pip install -q nats-py pydantic aiohttp &&
      cd /app/shared/events &&
      python dlq_monitoring.py
      "
    environment:
      # NATS connection
      NATS_URL: nats://${NATS_USER:-sahool_app}:${NATS_PASSWORD}@nats:4222

      # DLQ configuration
      DLQ_ENABLED: "true"
      DLQ_STREAM_NAME: "SAHOOL_DLQ"
      DLQ_ALERT_ENABLED: "true"
      DLQ_ALERT_THRESHOLD: "100"
      DLQ_ALERT_CHECK_INTERVAL: "300"

      # Alert integrations (optional)
      # SLACK_WEBHOOK_URL: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
      # ALERT_EMAIL: alerts@sahool.com

      # Logging
      LOG_LEVEL: INFO

    networks:
      - sahool-network
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Verifies dlq_monitoring module is importable; does not check if monitoring loop is active.
      # TODO: Add HTTP health endpoint to dlq_monitoring for a more meaningful check.
      test: ["CMD-SHELL", "python -c 'import shared.events.dlq_monitoring as m; print(\"ok\")' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    labels:
      com.sahool.service: "dlq-monitor"
      com.sahool.description: "DLQ Monitoring and Alerting"

# ──────────────────────────────────────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────────────────────────────────────
networks:
  sahool-network:
    external: true
