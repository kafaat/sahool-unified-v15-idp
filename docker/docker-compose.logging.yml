# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Log Aggregation Stack - Loki + Promtail
# مكدس تجميع السجلات لمنصة سهول
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker/docker-compose.logging.yml up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:
  loki:
    image: grafana/loki:2.9.4
    container_name: sahool-loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../infrastructure/monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sahool-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  promtail:
    image: grafana/promtail:2.9.4
    container_name: sahool-promtail
    volumes:
      - ../infrastructure/monitoring/loki/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - sahool-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

volumes:
  loki-data:
    name: sahool-loki-data

networks:
  sahool-network:
    name: sahool-network
    external: true
