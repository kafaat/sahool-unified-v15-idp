# SAHOOL MQTT Broker Configuration
# Eclipse Mosquitto

# Listener for MQTT protocol
listener 1883
protocol mqtt

# Listener for WebSocket (for web clients)
listener 9001
protocol websockets

# Disable anonymous connections even in development
# Use password_file for authentication
allow_anonymous false
password_file /mosquitto/config/passwd

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Connection settings
# Rate limiting: max 100 concurrent connections in development
max_connections 100
max_inflight_messages 20
max_queued_messages 1000

# Keep alive
max_keepalive 120

# Maximum publish packet size (1MB) - using non-deprecated directive name
max_packet_size 1048576
