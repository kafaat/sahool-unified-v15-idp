                  depth_cm: 20
                - timestamp: "2025-12-12T08:00:00Z"
                  value: 28.8
                  depth_cm: 20
              calibration_method: linear
      responses:
        '200':
          description: Calibration completed | اكتملت المعايرة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualSensorCalibrateResponse'
        '400':
          description: Invalid request or insufficient data | طلب غير صالح أو بيانات غير كافية
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /virtual-sensors/{fieldId}/readings:
    get:
      tags:
        - Virtual Sensors
      summary: Get sensor readings
      description: |
        Get virtual sensor readings for a field over a time period.

        الحصول على قراءات المستشعر الافتراضي للحقل خلال فترة زمنية.
      operationId: getVirtualSensorReadings
      parameters:
        - name: fieldId
          in: path
          required: true
          description: Field identifier | معرف الحقل
          schema:
            type: string
        - name: sensor_type
          in: query
          description: Filter by sensor type | تصفية حسب نوع المستشعر
          schema:
            $ref: '#/components/schemas/VirtualSensorType'
        - name: start_date
          in: query
          description: Start date for readings | تاريخ البداية للقراءات
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: End date for readings | تاريخ النهاية للقراءات
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Maximum number of readings | الحد الأقصى لعدد القراءات
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        '200':
          description: Sensor readings retrieved | تم استرجاع قراءات المستشعر
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualSensorReadingsResponse'
        '404':
          description: Field not found | الحقل غير موجود
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
