    # ==================== Virtual Sensors Schemas ====================
    VirtualSensorComputeRequest:
      type: object
      required:
        - field_id
        - sensor_type
      properties:
        tenant_id:
          type: string
          description: Tenant identifier | معرف المستأجر
        field_id:
          type: string
          description: Field identifier | معرف الحقل
        sensor_type:
          $ref: '#/components/schemas/VirtualSensorType'
        geometry:
          $ref: '#/components/schemas/GeoJSONPolygon'
        location:
          type: object
          properties:
            latitude:
              type: number
