  /vegetation/indices:
    get:
      tags:
        - Vegetation Analysis
      summary: List available indices
      description: |
        Get list of all available vegetation indices with descriptions and formulas.

        الحصول على قائمة بجميع مؤشرات الغطاء النباتي المتاحة مع الأوصاف والصيغ.
      operationId: listVegetationIndices
      responses:
        '200':
          description: List of available indices | قائمة المؤشرات المتاحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableIndicesResponse'
              example:
                indices:
                  - code: NDVI
                    name_en: Normalized Difference Vegetation Index
                    name_ar: مؤشر الفرق المعياري للغطاء النباتي
                    description_en: Measures vegetation greenness and health
                    description_ar: يقيس اخضرار وصحة الغطاء النباتي
                    range:
                      min: -1
                      max: 1
                    formula: (NIR - RED) / (NIR + RED)
                    bands_required: [NIR, RED]
                    use_cases: [crop_health, irrigation_planning, yield_estimation]
                  - code: LAI
                    name_en: Leaf Area Index
                    name_ar: مؤشر مساحة الأوراق
                    description_en: Ratio of leaf area to ground area
                    description_ar: نسبة مساحة الأوراق إلى مساحة الأرض
                    range:
                      min: 0
                      max: 10
                    formula: Empirical from NDVI
                    bands_required: [NIR, RED]
                    use_cases: [canopy_cover, biomass_estimation, irrigation]
                  - code: EVI
                    name_en: Enhanced Vegetation Index
                    name_ar: مؤشر الغطاء النباتي المحسن
                    description_en: Improved vegetation index with atmospheric correction
                    description_ar: مؤشر غطاء نباتي محسن مع تصحيح جوي
                    range:
                      min: -1
                      max: 1
                    formula: 2.5 * (NIR - RED) / (NIR + 6*RED - 7.5*BLUE + 1)
                    bands_required: [NIR, RED, BLUE]
                    use_cases: [dense_vegetation, tropical_regions]
                  - code: SAVI
                    name_en: Soil Adjusted Vegetation Index
                    name_ar: مؤشر الغطاء النباتي المعدل للتربة
                    description_en: NDVI adjusted for soil brightness
                    description_ar: NDVI معدل لسطوع التربة
                    range:
                      min: -1
                      max: 1
                    formula: ((NIR - RED) / (NIR + RED + L)) * (1 + L)
                    bands_required: [NIR, RED]
                    use_cases: [sparse_vegetation, early_growth]
                  - code: GNDVI
                    name_en: Green Normalized Difference Vegetation Index
                    name_ar: مؤشر NDVI الأخضر
                    description_en: NDVI using green band instead of red
                    description_ar: NDVI باستخدام النطاق الأخضر بدلاً من الأحمر
                    range:
                      min: -1
                      max: 1
                    formula: (NIR - GREEN) / (NIR + GREEN)
                    bands_required: [NIR, GREEN]
                    use_cases: [chlorophyll_content, nitrogen_status]
                  - code: NDWI
                    name_en: Normalized Difference Water Index
                    name_ar: مؤشر الفرق المعياري للمياه
                    description_en: Measures water content in vegetation
                    description_ar: يقيس محتوى الماء في الغطاء النباتي
                    range:
                      min: -1
                      max: 1
                    formula: (GREEN - NIR) / (GREEN + NIR)
                    bands_required: [NIR, GREEN]
                    use_cases: [water_stress, irrigation_management]

