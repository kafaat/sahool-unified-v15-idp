          type: string
          example: رطوبة التربة
        reading:
          type: object
          properties:
            value:
              type: number
              example: 35.5
            unit:
              type: string
              example: "%"
            status:
              type: string
              enum: [optimal, low, high, critical]
            status_ar:
              type: string
              example: مثالي
            quality:
              type: string
              enum: [high, medium, low]
              description: Reading quality/confidence | جودة/ثقة القراءة
        interpretation:
          type: object
          properties:
            description_en:
              type: string
              example: Soil moisture is at optimal level for wheat growth
            description_ar:
              type: string
              example: رطوبة التربة في المستوى الأمثل لنمو القمح
            threshold_status:
              type: string
              enum: [below_threshold, within_range, above_threshold]
            action_required:
              type: boolean
            recommended_action_en:
              type: string
            recommended_action_ar:
              type: string
        computed_at:
          type: string
          format: date-time
        method:
          type: string
          description: Computation method used | طريقة الحساب المستخدمة
