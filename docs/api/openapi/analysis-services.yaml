openapi: 3.0.3
info:
  title: SAHOOL Analysis Services API
  description: |
    Remote Sensing, Vegetation Analysis, and Field Intelligence Services for the SAHOOL Platform
    خدمات التحليل والاستشعار عن بعد والذكاء الحقلي في منصة سهول

    This API provides comprehensive analysis capabilities:
    - **Vegetation Analysis** (تحليل الغطاء النباتي): Full vegetation health analysis using satellite data
    - **NDVI Processing** (معالجة NDVI): Normalized Difference Vegetation Index computation
    - **Satellite Imagery** (صور الأقمار الصناعية): Multi-source satellite data acquisition (Sentinel-2, Landsat, MODIS)
    - **Indicators Service** (خدمة المؤشرات): Compute field health indicators including LAI estimation
    - **Field Intelligence** (الذكاء الحقلي): Comprehensive field analysis and insights
    - **Virtual Sensors** (المستشعرات الافتراضية): Compute and calibrate virtual sensor readings

    ## Services Architecture | هيكل الخدمات

    | Service | Port | Base Paths | Description |
    |---------|------|------------|-------------|
    | vegetation-analysis-service | 8090 | /api/v1/vegetation, /api/v1/satellite, /api/v1/ndvi | Vegetation and satellite analysis |
    | indicators-service | 8091 | /api/v1/indicators | Field indicators computation |
    | field-intelligence | 8120 | /api/v1/field-intelligence, /api/v1/field-core | Field analytics and insights |
    | virtual-sensors | 8119 | /api/v1/virtual-sensors | Virtual sensor computation |

    ## Data Sources | مصادر البيانات
    - Sentinel-2 (10m resolution, 5-day revisit) - القمر الصناعي سنتينل-2
    - Landsat-8/9 (30m resolution, 16-day revisit) - القمر الصناعي لاندسات
    - MODIS (250m resolution, daily) - نظام موديس

    ## Vegetation Indices | مؤشرات الغطاء النباتي
    - NDVI (Normalized Difference Vegetation Index) - مؤشر الفرق المعياري للغطاء النباتي
    - LAI (Leaf Area Index) - مؤشر مساحة الأوراق
    - NDWI (Normalized Difference Water Index) - مؤشر الفرق المعياري للمياه
    - EVI (Enhanced Vegetation Index) - مؤشر الغطاء النباتي المحسن
    - SAVI (Soil Adjusted Vegetation Index) - مؤشر الغطاء النباتي المعدل للتربة
    - GNDVI (Green Normalized Difference Vegetation Index) - مؤشر NDVI الأخضر

    ## Authentication | المصادقة
    All endpoints require authentication via Bearer token in the Authorization header.
    جميع النقاط الطرفية تتطلب المصادقة عبر رمز Bearer في ترويسة التفويض.

    ## Rate Limiting | حدود الاستخدام
    - 50 requests per minute per user for analysis endpoints
    - 500 requests per minute for cached time-series data
    - 100 requests per minute for virtual sensor readings

    ## Caching | التخزين المؤقت
    Analysis results are cached for 24 hours. Use the `Cache-Control` header to control caching behavior.
    يتم تخزين نتائج التحليل مؤقتاً لمدة 24 ساعة.
  version: 16.0.0
  contact:
    name: SAHOOL Platform Support
    email: support@sahool.io
    url: https://sahool.io
  license:
    name: Proprietary
    url: https://sahool.io/terms

servers:
  - url: https://api.sahool.io/api/v1
    description: Production server | خادم الإنتاج
  - url: https://staging-api.sahool.io/api/v1
    description: Staging server | خادم التجريب
  - url: http://localhost:8090/api/v1
    description: Local development - vegetation-analysis-service
  - url: http://localhost:8091/api/v1
    description: Local development - indicators-service
  - url: http://localhost:8119/api/v1
    description: Local development - virtual-sensors
  - url: http://localhost:8120/api/v1
    description: Local development - field-intelligence

tags:
  - name: Vegetation Analysis
    description: |
      Full vegetation analysis and health assessment
      تحليل الغطاء النباتي الكامل وتقييم الصحة النباتية
  - name: Satellite Imagery
    description: |
      Multi-source satellite data acquisition and processing
      الحصول على بيانات الأقمار الصناعية ومعالجتها من مصادر متعددة
  - name: Indicators
    description: |
      Field health indicators computation and monitoring
      حساب ومراقبة مؤشرات صحة الحقل
  - name: Field Intelligence
    description: |
      Comprehensive field analysis and actionable insights
      تحليل شامل للحقل ورؤى قابلة للتنفيذ
  - name: Virtual Sensors
    description: |
      Virtual sensor computation, calibration, and readings
      حساب ومعايرة وقراءات المستشعرات الافتراضية
  - name: Health Check
    description: |
      Service health and status endpoints
      نقاط التحقق من صحة وحالة الخدمات

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer token authentication
        مصادقة رمز JWT Bearer

  schemas:
    # ==================== Enums ====================
    VegetationIndex:
      type: string
      enum:
        - NDVI
        - LAI
        - NDWI
        - EVI
        - SAVI
        - GNDVI
        - NDMI
        - NDRE
        - MSAVI
        - OSAVI
      description: |
        Available vegetation indices
        مؤشرات الغطاء النباتي المتاحة

    SatelliteSource:
      type: string
      enum:
        - sentinel-2
        - landsat-8
        - landsat-9
        - modis
      description: |
        Available satellite data sources
        مصادر بيانات الأقمار الصناعية المتاحة

    VirtualSensorType:
      type: string
      enum:
        - soil_moisture
        - evapotranspiration
        - canopy_temperature
        - leaf_wetness
        - crop_water_stress
        - nitrogen_status
        - chlorophyll_content
        - biomass
      description: |
        Types of virtual sensors
        أنواع المستشعرات الافتراضية

    HealthStatus:
      type: string
      enum:
        - excellent
        - good
        - moderate
        - stressed
        - critical
      description: |
        Vegetation health status classification
        تصنيف حالة صحة الغطاء النباتي

    IndicatorType:
      type: string
      enum:
        - vegetation_health
        - water_stress
        - nutrient_status
        - growth_rate
        - canopy_cover
        - biomass
        - yield_potential
        - pest_risk
      description: |
        Types of field indicators
        أنواع مؤشرات الحقل

    # ==================== Common Schemas ====================
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: INVALID_REQUEST
          description: Error code | رمز الخطأ
        message:
          type: string
          example: Invalid coordinates provided
          description: Error message | رسالة الخطأ
        message_ar:
          type: string
          example: الإحداثيات المقدمة غير صالحة
          description: Arabic error message | رسالة الخطأ بالعربية
        details:
          type: object
          description: Additional error details | تفاصيل الخطأ الإضافية
        request_id:
          type: string
          format: uuid
          description: Request tracking ID | معرف تتبع الطلب

    GeoJSONPolygon:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
      example:
        type: Polygon
        coordinates:
          - [[44.1910, 15.3694], [44.1920, 15.3694], [44.1920, 15.3704], [44.1910, 15.3704], [44.1910, 15.3694]]

    DateRange:
      type: object
      required:
        - start_date
        - end_date
      properties:
        start_date:
          type: string
          format: date
          example: "2025-11-01"
          description: Start date | تاريخ البداية
        end_date:
          type: string
          format: date
          example: "2025-12-14"
          description: End date | تاريخ النهاية

    IndexStatistics:
      type: object
      properties:
        mean:
          type: number
          description: Mean value | القيمة المتوسطة
        min:
          type: number
          description: Minimum value | القيمة الدنيا
        max:
          type: number
          description: Maximum value | القيمة القصوى
        std:
          type: number
          description: Standard deviation | الانحراف المعياري
        median:
          type: number
          description: Median value | القيمة الوسطى

    # ==================== Vegetation Analysis Schemas ====================
    VegetationAnalyzeRequest:
      type: object
      required:
        - field_id
      properties:
        tenant_id:
          type: string
          description: Tenant identifier | معرف المستأجر
          example: tenant_123
        field_id:
          type: string
          description: Field identifier | معرف الحقل
          example: field_demo
        geometry:
          $ref: '#/components/schemas/GeoJSONPolygon'
        indices:
          type: array
          items:
            $ref: '#/components/schemas/VegetationIndex'
          default: [NDVI, LAI, EVI, SAVI]
          description: Indices to compute | المؤشرات للحساب
        satellite:
          $ref: '#/components/schemas/SatelliteSource'
        date:
          type: string
          format: date
          description: Analysis date (defaults to latest available) | تاريخ التحليل
        cloud_cover_max:
          type: number
          minimum: 0
          maximum: 100
          default: 20
          description: Maximum acceptable cloud coverage percentage | الحد الأقصى لنسبة الغطاء السحابي
        correlation_id:
          type: string
          description: Correlation ID for tracing | معرف الارتباط للتتبع

    VegetationAnalyzeResponse:
      type: object
      required:
        - field_id
        - analysis_date
        - indices
        - health_assessment
        - metadata
      properties:
        field_id:
          type: string
          example: field_demo
        analysis_date:
          type: string
          format: date-time
          description: Analysis timestamp | وقت التحليل
        indices:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/IndexStatistics'
          description: Computed vegetation indices | مؤشرات الغطاء النباتي المحسوبة
          example:
            NDVI:
              mean: 0.72
              min: 0.45
              max: 0.89
              std: 0.08
            LAI:
              mean: 3.8
              min: 2.1
              max: 5.2
              std: 0.6
        health_assessment:
          type: object
          properties:
            overall_status:
              $ref: '#/components/schemas/HealthStatus'
            overall_status_ar:
              type: string
              example: جيد
              description: Arabic health status | حالة الصحة بالعربية
            vigor_score:
              type: number
              minimum: 0
              maximum: 100
              example: 78
              description: Vegetation vigor score (0-100) | درجة حيوية الغطاء النباتي
            water_stress_level:
              type: string
              enum: [none, low, moderate, high, severe]
              example: low
              description: Water stress level | مستوى الإجهاد المائي
            water_stress_level_ar:
              type: string
              example: منخفض
            nitrogen_status:
              type: string
              enum: [deficient, low, adequate, high, excessive]
              example: adequate
              description: Nitrogen status | حالة النيتروجين
            nitrogen_status_ar:
              type: string
              example: كافي
        anomalies:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: water_stress
              severity:
                type: string
                enum: [low, medium, high, critical]
              zone:
                type: string
                example: zone_A
              description_en:
                type: string
                example: Possible water stress in zone A
              description_ar:
                type: string
                example: إجهاد مائي محتمل في المنطقة أ
        recommendations:
          type: array
          items:
            type: object
            properties:
              priority:
                type: string
                enum: [low, medium, high, critical]
              action_en:
                type: string
                example: Check irrigation system in zone A
              action_ar:
                type: string
                example: تحقق من نظام الري في المنطقة أ
              timeframe:
                type: string
                example: within 48 hours
        metadata:
          type: object
          properties:
            scene_date:
              type: string
              format: date-time
              example: "2025-12-14T10:00:00Z"
            data_source:
              $ref: '#/components/schemas/SatelliteSource'
            cloud_cover_pct:
              type: number
              example: 5.2
            quality_score:
              type: number
              minimum: 0
              maximum: 1
              example: 0.95
            processing_time_ms:
              type: integer
              example: 1250
        event_id:
          type: string
          description: NATS event ID if published | معرف حدث NATS إذا تم النشر
        published:
          type: boolean
          description: Whether event was published to NATS | هل تم نشر الحدث إلى NATS

    NDVIComputeRequest:
      type: object
      required:
        - field_id
      properties:
        tenant_id:
          type: string
          description: Tenant identifier | معرف المستأجر
          example: tenant_123
        field_id:
          type: string
          description: Field identifier | معرف الحقل
          example: field_demo
        geometry:
          $ref: '#/components/schemas/GeoJSONPolygon'
        satellite:
          $ref: '#/components/schemas/SatelliteSource'
        date:
          type: string
          format: date
          description: Analysis date | تاريخ التحليل
        include_trends:
          type: boolean
          default: true
          description: Include 7-day and 30-day trends | تضمين اتجاهات 7 و 30 يوماً
        correlation_id:
          type: string

    NDVIComputeResponse:
      type: object
      required:
        - field_id
        - ndvi
        - health
        - metadata
      properties:
        field_id:
          type: string
          example: field_demo
        ndvi:
          type: object
          required:
            - mean
            - min
            - max
            - std
          properties:
            mean:
              type: number
              minimum: -1
              maximum: 1
              example: 0.72
              description: Mean NDVI | متوسط NDVI
            min:
              type: number
              minimum: -1
              maximum: 1
              example: 0.45
            max:
              type: number
              minimum: -1
              maximum: 1
              example: 0.89
            std:
              type: number
              minimum: 0
              example: 0.08
        trends:
          type: object
          properties:
            trend_7d:
              type: number
              description: 7-day trend (-1 to 1, negative=declining) | اتجاه 7 أيام
              example: 0.05
            trend_30d:
              type: number
              description: 30-day trend | اتجاه 30 يوماً
              example: 0.12
            trend_status:
              type: string
              enum: [improving, stable, declining]
            trend_status_ar:
              type: string
              example: تحسن
        health:
          type: object
          required:
            - status_en
            - status_ar
          properties:
            status_en:
              $ref: '#/components/schemas/HealthStatus'
            status_ar:
              type: string
              example: جيد
        metadata:
          type: object
          properties:
            scene_date:
              type: string
              format: date-time
            data_source:
              $ref: '#/components/schemas/SatelliteSource'
            cloud_cover_pct:
              type: number
            quality_score:
              type: number
        event_id:
          type: string
        published:
          type: boolean

    VegetationTimeseriesRequest:
      type: object
      required:
        - field_id
        - start_date
        - end_date
      properties:
        field_id:
          type: string
          description: Field identifier | معرف الحقل
        start_date:
          type: string
          format: date
          example: "2025-01-01"
        end_date:
          type: string
          format: date
          example: "2025-12-14"
        indices:
          type: array
          items:
            $ref: '#/components/schemas/VegetationIndex'
          default: [NDVI, LAI, EVI]
          description: Indices to include in time series | المؤشرات لتضمينها في السلسلة الزمنية
        interval:
          type: string
          enum: [daily, weekly, monthly]
          default: weekly
          description: Data aggregation interval | فترة تجميع البيانات
        satellite:
          type: string
          enum: [sentinel-2, landsat-8, landsat-9, modis, all]
          default: all

    VegetationTimeseriesResponse:
      type: object
      required:
        - field_id
        - start_date
        - end_date
        - data_points
        - statistics
      properties:
        field_id:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        data_points:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              values:
                type: object
                additionalProperties:
                  type: number
                example:
                  NDVI: 0.72
                  LAI: 3.8
                  EVI: 0.65
              quality:
                type: string
                enum: [high, medium, low]
              cloud_cover:
                type: number
              satellite:
                $ref: '#/components/schemas/SatelliteSource'
        statistics:
          type: object
          additionalProperties:
            type: object
            properties:
              mean:
                type: number
              min:
                type: number
              max:
                type: number
              std:
                type: number
              trend:
                type: number
                description: Linear trend coefficient | معامل الاتجاه الخطي
        trends:
          type: object
          properties:
            overall_trend:
              type: string
              enum: [improving, stable, declining]
            overall_trend_ar:
              type: string
              example: تحسن
            trend_description_en:
              type: string
              example: Vegetation health is improving steadily
            trend_description_ar:
              type: string
              example: صحة الغطاء النباتي تتحسن بشكل مطرد
        cached:
          type: boolean
          description: Whether data was served from cache | هل البيانات من ذاكرة التخزين المؤقت

    AvailableIndicesResponse:
      type: object
      required:
        - indices
      properties:
        indices:
          type: array
          items:
            type: object
            properties:
              code:
                $ref: '#/components/schemas/VegetationIndex'
              name_en:
                type: string
                example: Normalized Difference Vegetation Index
              name_ar:
                type: string
                example: مؤشر الفرق المعياري للغطاء النباتي
              description_en:
                type: string
                example: Measures vegetation greenness and health
              description_ar:
                type: string
                example: يقيس اخضرار وصحة الغطاء النباتي
              range:
                type: object
                properties:
                  min:
                    type: number
                  max:
                    type: number
              formula:
                type: string
                example: (NIR - RED) / (NIR + RED)
              bands_required:
                type: array
                items:
                  type: string
                example: [NIR, RED]
              use_cases:
                type: array
                items:
                  type: string
                example: [crop_health, irrigation_planning, yield_estimation]

    # ==================== Satellite Imagery Schemas ====================
    SatelliteImageryRequest:
      type: object
      required:
        - field_id
      properties:
        field_id:
          type: string
          example: field_123
        geometry:
          $ref: '#/components/schemas/GeoJSONPolygon'
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 15.3694
          description: Center latitude (if no geometry provided) | خط العرض المركزي
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: 44.1910
          description: Center longitude (if no geometry provided) | خط الطول المركزي
        satellite:
          $ref: '#/components/schemas/SatelliteSource'
        start_date:
          type: string
          format: date
          example: "2025-11-01"
        end_date:
          type: string
          format: date
          example: "2025-12-14"
        cloud_cover_max:
          type: number
          minimum: 0
          maximum: 100
          default: 20
          description: Maximum acceptable cloud coverage percentage | الحد الأقصى لنسبة الغطاء السحابي

    SatelliteBand:
      type: object
      required:
        - band_name
        - wavelength_nm
        - resolution_m
        - value
      properties:
        band_name:
          type: string
          example: NIR
          description: Band name | اسم النطاق
        band_name_ar:
          type: string
          example: تحت الحمراء القريبة
        wavelength_nm:
          type: string
          example: 842nm
          description: Wavelength in nanometers | الطول الموجي بالنانومتر
        resolution_m:
          type: integer
          example: 10
          description: Spatial resolution in meters | الدقة المكانية بالأمتار
        value:
          type: number
          example: 0.45
          description: Reflectance value | قيمة الانعكاس

    SatelliteImageryResponse:
      type: object
      required:
        - imagery_id
        - field_id
        - satellite
        - acquisition_date
        - bands
      properties:
        imagery_id:
          type: string
          format: uuid
          description: Unique imagery identifier | معرف الصورة الفريد
        field_id:
          type: string
        satellite:
          $ref: '#/components/schemas/SatelliteSource'
        acquisition_date:
          type: string
          format: date-time
          description: Image acquisition timestamp | وقت التقاط الصورة
        cloud_cover_percent:
          type: number
          minimum: 0
          maximum: 100
          description: Cloud coverage percentage | نسبة الغطاء السحابي
        sun_elevation:
          type: number
          description: Sun elevation angle at acquisition | زاوية ارتفاع الشمس
        bands:
          type: array
          items:
            $ref: '#/components/schemas/SatelliteBand'
        scene_id:
          type: string
          example: S2A_MSIL2A_20251214T074251_N0509_R092_T38RDU_20251214T113045
          description: Original scene identifier | معرف المشهد الأصلي
        tile_id:
          type: string
          example: 38RDU
          description: Tile identifier | معرف القطعة
        processing_level:
          type: string
          example: L2A
          description: Processing level | مستوى المعالجة
        thumbnail_url:
          type: string
          format: uri
          description: Thumbnail image URL | رابط الصورة المصغرة

    SatelliteAnalyzeRequest:
      type: object
      required:
        - field_id
        - geometry
      properties:
        field_id:
          type: string
          description: Field identifier | معرف الحقل
        geometry:
          $ref: '#/components/schemas/GeoJSONPolygon'
        date:
          type: string
          format: date
          description: Analysis date (defaults to most recent available) | تاريخ التحليل
        satellite:
          type: string
          enum: [sentinel-2, landsat-8, landsat-9, modis, auto]
          default: auto
          description: Satellite source (auto selects best available) | مصدر القمر الصناعي
        cloud_cover_max:
          type: number
          default: 20
          description: Maximum cloud coverage | الحد الأقصى للغطاء السحابي
        indices:
          type: array
          items:
            $ref: '#/components/schemas/VegetationIndex'
          default: [NDVI, LAI, EVI, SAVI, NDWI]
        include_zones:
          type: boolean
          default: true
          description: Include zone-based analysis | تضمين التحليل القطاعي

    SatelliteAnalyzeResponse:
      type: object
      required:
        - field_id
        - analysis_date
        - satellite
        - imagery
        - indices
        - health_score
        - health_status
      properties:
        field_id:
          type: string
        analysis_date:
          type: string
          format: date-time
        satellite:
          $ref: '#/components/schemas/SatelliteSource'
        imagery:
          $ref: '#/components/schemas/SatelliteImageryResponse'
        indices:
          type: object
