              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
          description: Point location for sensor reading | موقع نقطة قراءة المستشعر
        date:
          type: string
          format: date-time
          description: Date/time for computation (defaults to now) | التاريخ/الوقت للحساب
        crop_type:
          type: string
          example: wheat
        growth_stage:
          type: string
          enum: [germination, seedling, vegetative, flowering, fruiting, maturity]
        input_data:
          type: object
          description: Additional input data for computation | بيانات إدخال إضافية للحساب
          additionalProperties: true

