openapi: 3.0.3
info:
  title: SAHOOL IoT Services API
  description: |
    IoT and Sensor Management API for the SAHOOL Agricultural Platform
    واجهة برمجة تطبيقات إدارة إنترنت الأشياء والمستشعرات لمنصة سهول الزراعية

    This API provides comprehensive IoT device management, sensor data collection,
    real-time monitoring, and multi-protocol gateway support for agricultural fields.

    توفر هذه الواجهة إدارة شاملة لأجهزة إنترنت الأشياء، وجمع بيانات المستشعرات،
    والمراقبة في الوقت الفعلي، ودعم بوابة متعددة البروتوكولات للحقول الزراعية.

    ## Services | الخدمات

    This specification covers three interconnected services:
    تغطي هذه المواصفات ثلاث خدمات مترابطة:

    ### IoT Service (Port 8117) | خدمة إنترنت الأشياء
    Core device management, sensor readings, and command execution.
    إدارة الأجهزة الأساسية، وقراءات المستشعرات، وتنفيذ الأوامر.

    ### IoT Gateway (Port 8106) | بوابة إنترنت الأشياء
    Multi-protocol ingestion supporting MQTT, HTTP, CoAP, and LoRaWAN.
    استيعاب متعدد البروتوكولات يدعم MQTT و HTTP و CoAP و LoRaWAN.

    ### WebSocket Gateway (Port 8081) | بوابة WebSocket
    Real-time event streaming for field updates, alerts, and sensor readings.
    بث الأحداث في الوقت الفعلي لتحديثات الحقول والتنبيهات وقراءات المستشعرات.

    ## Features | الميزات

    - Device registration and lifecycle management | تسجيل الأجهزة وإدارة دورة حياتها
    - Real-time sensor data collection | جمع بيانات المستشعرات في الوقت الفعلي
    - Multi-protocol IoT gateway | بوابة إنترنت الأشياء متعددة البروتوكولات
    - WebSocket-based real-time updates | تحديثات في الوقت الفعلي عبر WebSocket
    - Device command and control | أوامر الأجهزة والتحكم بها
    - Battery and connectivity monitoring | مراقبة البطارية والاتصال

    ## Arabic Support | دعم اللغة العربية
    جميع واجهات API تدعم اللغة العربية بالكامل
  version: 16.0.0
  contact:
    name: SAHOOL Platform Support | دعم منصة سهول
    email: support@sahool.sa
  license:
    name: Proprietary

servers:
  - url: https://api.sahool.sa/api/v1
    description: Production server | خادم الإنتاج
  - url: https://staging-api.sahool.sa/api/v1
    description: Staging server | خادم التجربة
  - url: http://localhost:8117/api/v1
    description: Local IoT Service | خدمة إنترنت الأشياء المحلية
  - url: http://localhost:8106/api/v1
    description: Local IoT Gateway | بوابة إنترنت الأشياء المحلية
  - url: ws://localhost:8081
    description: Local WebSocket Gateway | بوابة WebSocket المحلية

tags:
  - name: Devices
    description: |
      IoT device management and registration
      إدارة وتسجيل أجهزة إنترنت الأشياء
  - name: Device Data
    description: |
      Sensor data submission and retrieval
      إرسال واسترجاع بيانات المستشعرات
  - name: Device Commands
    description: |
      Device command and control operations
      عمليات أوامر الأجهزة والتحكم بها
  - name: IoT Gateway
    description: |
      Multi-protocol data ingestion and device provisioning
      استيعاب البيانات متعدد البروتوكولات وتوفير الأجهزة
  - name: WebSocket
    description: |
      Real-time event streaming via WebSocket
      بث الأحداث في الوقت الفعلي عبر WebSocket
  - name: Health
    description: |
      Service health and readiness endpoints
      نقاط نهاية صحة الخدمة والجاهزية

security:
  - BearerAuth: []

paths:
  # =============================================================================
  # IoT Service Endpoints (Port 8117, /api/v1/iot)
  # نقاط نهاية خدمة إنترنت الأشياء
  # =============================================================================

  /iot/devices:
    get:
      tags:
        - Devices
      summary: List all devices | عرض جميع الأجهزة
      description: |
        Retrieve a paginated list of all registered IoT devices with optional filtering.
        استرجاع قائمة مرقمة بجميع أجهزة إنترنت الأشياء المسجلة مع إمكانية التصفية.
      operationId: listDevices
      parameters:
        - name: fieldId
          in: query
          description: |
            Filter devices by field ID
            تصفية الأجهزة حسب معرف الحقل
          schema:
            type: string
            example: "field-001"
        - name: type
          in: query
          description: |
            Filter by device type
            تصفية حسب نوع الجهاز
          schema:
            $ref: '#/components/schemas/DeviceType'
        - name: status
          in: query
          description: |
            Filter by device status
            تصفية حسب حالة الجهاز
          schema:
            $ref: '#/components/schemas/DeviceStatus'
        - name: page
          in: query
          description: Page number (1-indexed) | رقم الصفحة
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page | عدد العناصر في الصفحة
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          description: |
            Search by device name or serial number
            البحث بالاسم أو الرقم التسلسلي
          schema:
            type: string
      responses:
        '200':
          description: List of devices retrieved successfully | تم استرجاع قائمة الأجهزة بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  total:
                    type: integer
                    description: Total number of devices | العدد الإجمالي للأجهزة
                    example: 45
              examples:
                success:
                  summary: Successful response | استجابة ناجحة
                  value:
                    data:
                      - id: "dev-001"
                        name: "Soil Moisture Sensor A1"
                        nameAr: "مستشعر رطوبة التربة أ1"
                        type: "soil_moisture"
                        fieldId: "field-001"
                        serialNumber: "SM-2024-001"
                        status: "online"
                        lastSeen: "2026-01-24T10:30:00Z"
                        batteryLevel: 85
                        config:
                          reportInterval: 300
                          threshold:
                            min: 20
                            max: 80
                        createdAt: "2025-06-15T08:00:00Z"
                        updatedAt: "2026-01-24T10:30:00Z"
                    pagination:
                      page: 1
                      limit: 20
                      totalPages: 3
                    total: 45
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Devices
      summary: Register a new device | تسجيل جهاز جديد
      description: |
        Register a new IoT device in the system. The device will be assigned a unique ID.
        تسجيل جهاز إنترنت الأشياء جديد في النظام. سيتم تعيين معرف فريد للجهاز.
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
            examples:
              soilMoisture:
                summary: Soil moisture sensor | مستشعر رطوبة التربة
                value:
                  name: "Soil Moisture Sensor B2"
                  nameAr: "مستشعر رطوبة التربة ب2"
                  type: "soil_moisture"
                  fieldId: "field-001"
                  serialNumber: "SM-2024-002"
                  config:
                    reportInterval: 300
                    threshold:
                      min: 20
                      max: 80
              weatherStation:
                summary: Weather station | محطة طقس
                value:
                  name: "Weather Station North"
                  nameAr: "محطة الطقس الشمالية"
                  type: "weather_station"
                  fieldId: "field-002"
                  serialNumber: "WS-2024-001"
                  config:
                    reportInterval: 600
                    sensors:
                      - temperature
                      - humidity
                      - wind_speed
                      - rainfall
      responses:
        '201':
          description: Device registered successfully | تم تسجيل الجهاز بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Device'
                  message:
                    type: string
                    example: "Device registered successfully"
                  messageAr:
                    type: string
                    example: "تم تسجيل الجهاز بنجاح"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Device with this serial number already exists | الجهاز بهذا الرقم التسلسلي موجود بالفعل
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "CONFLICT"
                message: "Device with serial number SM-2024-002 already exists"
                messageAr: "الجهاز بالرقم التسلسلي SM-2024-002 موجود بالفعل"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /iot/devices/{deviceId}:
    get:
      tags:
        - Devices
      summary: Get device by ID | الحصول على جهاز بالمعرف
      description: |
        Retrieve detailed information about a specific device.
        استرجاع معلومات تفصيلية عن جهاز معين.
      operationId: getDeviceById
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
      responses:
        '200':
          description: Device retrieved successfully | تم استرجاع الجهاز بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Devices
      summary: Update device | تحديث الجهاز
      description: |
        Update device configuration and metadata.
        تحديث إعدادات الجهاز والبيانات الوصفية.
      operationId: updateDevice
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
            example:
              name: "Soil Moisture Sensor B2 Updated"
              nameAr: "مستشعر رطوبة التربة ب2 محدث"
              config:
                reportInterval: 600
                threshold:
                  min: 25
                  max: 75
      responses:
        '200':
          description: Device updated successfully | تم تحديث الجهاز بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Device'
                  message:
                    type: string
                    example: "Device updated successfully"
                  messageAr:
                    type: string
                    example: "تم تحديث الجهاز بنجاح"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Devices
      summary: Delete device | حذف الجهاز
      description: |
        Remove a device from the system. This will also delete all associated readings.
        إزالة جهاز من النظام. سيؤدي هذا أيضًا إلى حذف جميع القراءات المرتبطة.
      operationId: deleteDevice
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
      responses:
        '204':
          description: Device deleted successfully | تم حذف الجهاز بنجاح
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /iot/devices/{deviceId}/data:
    post:
      tags:
        - Device Data
      summary: Submit sensor data | إرسال بيانات المستشعر
      description: |
        Submit sensor readings from a device. Supports batch submission of multiple readings.
        إرسال قراءات المستشعر من جهاز. يدعم الإرسال الدفعي لقراءات متعددة.
      operationId: submitDeviceData
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorDataSubmission'
            examples:
              singleReading:
                summary: Single sensor reading | قراءة مستشعر واحدة
                value:
                  deviceId: "dev-001"
                  readings:
                    - type: "soil_moisture"
                      value: 45.5
                      unit: "%"
                  timestamp: "2026-01-24T10:30:00Z"
              multipleReadings:
                summary: Multiple readings (weather station) | قراءات متعددة (محطة طقس)
                value:
                  deviceId: "dev-002"
                  readings:
                    - type: "temperature"
                      value: 28.5
                      unit: "°C"
                    - type: "humidity"
                      value: 65.0
                      unit: "%"
                    - type: "wind_speed"
                      value: 12.3
                      unit: "km/h"
                    - type: "rainfall"
                      value: 0.0
                      unit: "mm"
                  timestamp: "2026-01-24T10:30:00Z"
      responses:
        '201':
          description: Sensor data submitted successfully | تم إرسال بيانات المستشعر بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  readingsProcessed:
                    type: integer
                    description: Number of readings processed | عدد القراءات المعالجة
                    example: 4
                  message:
                    type: string
                    example: "Sensor data submitted successfully"
                  messageAr:
                    type: string
                    example: "تم إرسال بيانات المستشعر بنجاح"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /iot/devices/{deviceId}/commands:
    post:
      tags:
        - Device Commands
      summary: Send device command | إرسال أمر للجهاز
      description: |
        Send a command to a device for execution. Commands are queued and executed asynchronously.
        إرسال أمر إلى جهاز للتنفيذ. يتم وضع الأوامر في قائمة الانتظار وتنفيذها بشكل غير متزامن.
      operationId: sendDeviceCommand
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCommand'
            examples:
              reboot:
                summary: Reboot device | إعادة تشغيل الجهاز
                value:
                  command: "reboot"
                  parameters: {}
              setInterval:
                summary: Set report interval | تعيين فترة التقرير
                value:
                  command: "set_interval"
                  parameters:
                    interval: 300
              calibrate:
                summary: Calibrate sensor | معايرة المستشعر
                value:
                  command: "calibrate"
                  parameters:
                    type: "soil_moisture"
                    referenceValue: 50.0
              openValve:
                summary: Open irrigation valve | فتح صمام الري
                value:
                  command: "open_valve"
                  parameters:
                    duration: 1800
                    flowRate: 10.5
      responses:
        '202':
          description: Command queued for execution | تم وضع الأمر في قائمة الانتظار للتنفيذ
          content:
            application/json:
              schema:
                type: object
                properties:
                  commandId:
                    type: string
                    description: Unique command ID for tracking | معرف الأمر الفريد للتتبع
                    example: "cmd-uuid-12345"
                  status:
                    type: string
                    enum: [queued, pending, executing]
                    example: "queued"
                  message:
                    type: string
                    example: "Command queued for execution"
                  messageAr:
                    type: string
                    example: "تم وضع الأمر في قائمة الانتظار للتنفيذ"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          description: Device is offline | الجهاز غير متصل
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "DEVICE_OFFLINE"
                message: "Device is currently offline. Command will be queued."
                messageAr: "الجهاز غير متصل حاليًا. سيتم وضع الأمر في قائمة الانتظار."

  /iot/devices/{deviceId}/readings:
    get:
      tags:
        - Device Data
      summary: Get device readings | الحصول على قراءات الجهاز
      description: |
        Retrieve historical sensor readings from a device with optional time range filtering.
        استرجاع قراءات المستشعر التاريخية من جهاز مع إمكانية تصفية النطاق الزمني.
      operationId: getDeviceReadings
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
        - name: startDate
          in: query
          description: |
            Start date for readings (ISO 8601)
            تاريخ البداية للقراءات
          schema:
            type: string
            format: date-time
            example: "2026-01-20T00:00:00Z"
        - name: endDate
          in: query
          description: |
            End date for readings (ISO 8601)
            تاريخ النهاية للقراءات
          schema:
            type: string
            format: date-time
            example: "2026-01-24T23:59:59Z"
        - name: type
          in: query
          description: |
            Filter by reading type
            تصفية حسب نوع القراءة
          schema:
            type: string
            example: "soil_moisture"
        - name: interval
          in: query
          description: |
            Data aggregation interval
            فترة تجميع البيانات
          schema:
            type: string
            enum: [raw, 1h, 6h, 1d, 1w]
            default: raw
        - name: limit
          in: query
          description: Maximum number of readings | الحد الأقصى لعدد القراءات
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Device readings retrieved successfully | تم استرجاع قراءات الجهاز بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SensorReading'
                  deviceId:
                    type: string
                    example: "dev-001"
                  count:
                    type: integer
                    example: 100
                  timeRange:
                    type: object
                    properties:
                      start:
                        type: string
                        format: date-time
                      end:
                        type: string
                        format: date-time
              examples:
                success:
                  value:
                    data:
                      - deviceId: "dev-001"
                        readings:
                          - type: "soil_moisture"
                            value: 45.5
                            unit: "%"
                        timestamp: "2026-01-24T10:30:00Z"
                        quality: "good"
                      - deviceId: "dev-001"
                        readings:
                          - type: "soil_moisture"
                            value: 44.8
                            unit: "%"
                        timestamp: "2026-01-24T10:25:00Z"
                        quality: "good"
                    deviceId: "dev-001"
                    count: 2
                    timeRange:
                      start: "2026-01-24T10:00:00Z"
                      end: "2026-01-24T11:00:00Z"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /iot/devices/{deviceId}/status:
    get:
      tags:
        - Devices
      summary: Get device status | الحصول على حالة الجهاز
      description: |
        Get the current status of a device including connectivity, battery, and health information.
        الحصول على الحالة الحالية للجهاز بما في ذلك الاتصال والبطارية ومعلومات الصحة.
      operationId: getDeviceStatus
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
      responses:
        '200':
          description: Device status retrieved successfully | تم استرجاع حالة الجهاز بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusResponse'
              example:
                deviceId: "dev-001"
                name: "Soil Moisture Sensor A1"
                nameAr: "مستشعر رطوبة التربة أ1"
                status: "online"
                lastSeen: "2026-01-24T10:30:00Z"
                batteryLevel: 85
                signalStrength: 92
                firmware:
                  version: "2.1.0"
                  updateAvailable: true
                  latestVersion: "2.2.0"
                health:
                  status: "healthy"
                  issues: []
                uptime: 604800
                lastReading:
                  value: 45.5
                  unit: "%"
                  timestamp: "2026-01-24T10:30:00Z"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =============================================================================
  # IoT Gateway Endpoints (Port 8106, /api/v1/iot-gateway)
  # نقاط نهاية بوابة إنترنت الأشياء
  # =============================================================================

  /iot-gateway/ingest:
    post:
      tags:
        - IoT Gateway
      summary: Ingest data from any protocol | استيعاب البيانات من أي بروتوكول
      description: |
        Universal data ingestion endpoint supporting multiple IoT protocols.
        Normalizes data from MQTT, HTTP, CoAP, and LoRaWAN into a unified format.

        نقطة نهاية استيعاب البيانات الشاملة التي تدعم بروتوكولات إنترنت الأشياء المتعددة.
        تقوم بتوحيد البيانات من MQTT و HTTP و CoAP و LoRaWAN في تنسيق موحد.
      operationId: ingestData
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayIngestRequest'
            examples:
              mqtt:
                summary: MQTT payload | حمولة MQTT
                value:
                  protocol: "mqtt"
                  deviceId: "dev-001"
                  topic: "sahool/field-001/soil_moisture"
                  payload:
                    value: 45.5
                    unit: "%"
                    timestamp: "2026-01-24T10:30:00Z"
                  metadata:
                    qos: 1
                    retain: false
              http:
                summary: HTTP payload | حمولة HTTP
                value:
                  protocol: "http"
                  deviceId: "dev-002"
                  payload:
                    readings:
                      - type: "temperature"
                        value: 28.5
                        unit: "°C"
                      - type: "humidity"
                        value: 65.0
                        unit: "%"
                    timestamp: "2026-01-24T10:30:00Z"
              lorawan:
                summary: LoRaWAN payload | حمولة LoRaWAN
                value:
                  protocol: "lorawan"
