  # =============================================================================
  # WebSocket Gateway Endpoints (Port 8081, /ws)
  # نقاط نهاية بوابة WebSocket
  # =============================================================================

  /ws:
    get:
      tags:
        - WebSocket
      summary: WebSocket connection for real-time events | اتصال WebSocket للأحداث في الوقت الفعلي
      description: |
        Establish a WebSocket connection for receiving real-time events.

        إنشاء اتصال WebSocket لتلقي الأحداث في الوقت الفعلي.

        ## Connection | الاتصال

        Connect to `ws://localhost:8081/ws` or `wss://ws.sahool.sa/ws` for production.

        اتصل بـ `ws://localhost:8081/ws` أو `wss://ws.sahool.sa/ws` للإنتاج.

        ## Authentication | المصادقة

        Pass JWT token as query parameter: `/ws?token=<jwt_token>`

        مرر رمز JWT كمعامل استعلام: `/ws?token=<jwt_token>`

        ## Available Channels | القنوات المتاحة

        Subscribe to receive events on specific channels:
        اشترك لتلقي الأحداث على قنوات محددة:

        | Channel | Description | الوصف |
        |---------|-------------|-------|
        | `field.updates` | Field data updates | تحديثات بيانات الحقل |
        | `alert.created` | New alerts | تنبيهات جديدة |
        | `sensor.reading` | Real-time sensor readings | قراءات المستشعر في الوقت الفعلي |
        | `device.status` | Device status changes | تغييرات حالة الجهاز |
        | `irrigation.event` | Irrigation events | أحداث الري |

        ## Message Format | تنسيق الرسالة

        ### Subscribe to channel | الاشتراك في قناة
        ```json
        {
          "type": "subscribe",
          "channel": "sensor.reading",
          "payload": {
            "fieldId": "field-001",
            "deviceIds": ["dev-001", "dev-002"]
          }
        }
        ```

        ### Unsubscribe from channel | إلغاء الاشتراك من قناة
        ```json
        {
          "type": "unsubscribe",
          "channel": "sensor.reading"
        }
        ```

        ### Incoming event message | رسالة الحدث الواردة
        ```json
        {
          "type": "event",
          "channel": "sensor.reading",
          "payload": {
            "deviceId": "dev-001",
            "fieldId": "field-001",
            "readings": [
              {
                "type": "soil_moisture",
                "value": 45.5,
                "unit": "%"
              }
            ],
            "timestamp": "2026-01-24T10:30:00Z"
          }
        }
        ```

        ### Ping/Pong for keepalive | نبض/استجابة للحفاظ على الاتصال
        ```json
        {
          "type": "ping"
        }
        ```
        Response | الاستجابة:
        ```json
        {
          "type": "pong",
          "timestamp": "2026-01-24T10:30:00Z"
        }
        ```

        ## Error Handling | معالجة الأخطاء

        Error messages follow this format | تتبع رسائل الخطأ هذا التنسيق:
        ```json
        {
          "type": "error",
          "channel": "sensor.reading",
          "payload": {
            "code": "INVALID_CHANNEL",
            "message": "Channel does not exist",
            "messageAr": "القناة غير موجودة"
          }
        }
        ```
      operationId: websocketConnect
      parameters:
        - name: token
          in: query
          required: true
          description: JWT authentication token | رمز مصادقة JWT
          schema:
            type: string
        - name: channels
          in: query
          description: |
            Comma-separated list of channels to auto-subscribe
            قائمة القنوات المفصولة بفواصل للاشتراك التلقائي
          schema:
            type: string
            example: "sensor.reading,alert.created"
      responses:
        '101':
          description: |
            WebSocket connection established
            تم إنشاء اتصال WebSocket
        '401':
          description: |
            Invalid or expired token
            رمز غير صالح أو منتهي الصلاحية

  # =============================================================================
  # Health Endpoints
  # نقاط نهاية الصحة
  # =============================================================================

  /healthz:
    get:
      tags:
        - Health
      summary: Liveness probe | فحص الحياة
      description: |
        Check if the service is alive and running.
        التحقق من أن الخدمة حية وتعمل.
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Service is alive | الخدمة حية
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  service:
                    type: string
                    example: "iot-service"
                  version:
                    type: string
                    example: "16.0.0"

  /readyz:
    get:
      tags:
        - Health
      summary: Readiness probe | فحص الجاهزية
      description: |
        Check if the service is ready to accept traffic.
        التحقق من أن الخدمة جاهزة لقبول حركة المرور.
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Service is ready | الخدمة جاهزة
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  database:
                    type: boolean
                    example: true
                  nats:
                    type: boolean
                    example: true
                  redis:
                    type: boolean
                    example: true
        '503':
          description: Service is not ready | الخدمة غير جاهزة
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  database:
                    type: boolean
                    example: false
                  nats:
                    type: boolean
                    example: true

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT authentication token
        رمز مصادقة JWT

  parameters:
    DeviceIdPath:
      name: deviceId
      in: path
      required: true
      description: |
        Unique device identifier
        معرف الجهاز الفريد
      schema:
        type: string
        example: "dev-001"

  schemas:
    # =============================================================================
    # Enums | التعدادات
    # =============================================================================

    DeviceType:
      type: string
      description: |
        Type of IoT device
        نوع جهاز إنترنت الأشياء
      enum:
        - soil_moisture
        - weather_station
        - irrigation_controller
        - camera
        - flow_meter
        - ph_sensor
        - ec_sensor
      x-enum-descriptions:
        soil_moisture: "Soil moisture sensor | مستشعر رطوبة التربة"
        weather_station: "Weather station | محطة الطقس"
        irrigation_controller: "Irrigation controller | وحدة تحكم الري"
        camera: "Field camera | كاميرا الحقل"
        flow_meter: "Water flow meter | عداد تدفق المياه"
        ph_sensor: "pH sensor | مستشعر الحموضة"
        ec_sensor: "Electrical conductivity sensor | مستشعر التوصيلية الكهربائية"

    DeviceStatus:
      type: string
      description: |
        Current status of the device
        الحالة الحالية للجهاز
      enum:
        - online
        - offline
        - error
        - maintenance
      x-enum-descriptions:
        online: "Device is connected and operational | الجهاز متصل ويعمل"
        offline: "Device is not connected | الجهاز غير متصل"
        error: "Device has encountered an error | واجه الجهاز خطأ"
        maintenance: "Device is under maintenance | الجهاز تحت الصيانة"

    Protocol:
      type: string
      description: |
        IoT communication protocol
        بروتوكول اتصال إنترنت الأشياء
      enum:
        - mqtt
        - http
        - coap
        - lorawan
      x-enum-descriptions:
        mqtt: "MQTT protocol | بروتوكول MQTT"
        http: "HTTP/HTTPS protocol | بروتوكول HTTP/HTTPS"
        coap: "CoAP protocol | بروتوكول CoAP"
        lorawan: "LoRaWAN protocol | بروتوكول LoRaWAN"

    WebSocketMessageType:
      type: string
      description: |
        Type of WebSocket message
        نوع رسالة WebSocket
      enum:
        - subscribe
        - unsubscribe
        - event
        - ping
        - pong
        - error
        - ack

    WebSocketChannel:
      type: string
      description: |
        WebSocket subscription channel
        قناة اشتراك WebSocket
      enum:
        - field.updates
        - alert.created
        - sensor.reading
        - device.status
        - irrigation.event
      x-enum-descriptions:
        field.updates: "Field data updates | تحديثات بيانات الحقل"
        alert.created: "New alerts | تنبيهات جديدة"
        sensor.reading: "Real-time sensor readings | قراءات المستشعر في الوقت الفعلي"
        device.status: "Device status changes | تغييرات حالة الجهاز"
        irrigation.event: "Irrigation events | أحداث الري"

    # =============================================================================
    # Core Models | النماذج الأساسية
    # =============================================================================

    Device:
      type: object
      description: |
        IoT device representation
        تمثيل جهاز إنترنت الأشياء
      required:
        - id
        - name
        - type
        - fieldId
        - serialNumber
        - status
      properties:
        id:
          type: string
          description: Unique device identifier | معرف الجهاز الفريد
          example: "dev-001"
        name:
          type: string
          description: Device name | اسم الجهاز
          example: "Soil Moisture Sensor A1"
        nameAr:
          type: string
          description: Device name in Arabic | اسم الجهاز بالعربية
          example: "مستشعر رطوبة التربة أ1"
        type:
          $ref: '#/components/schemas/DeviceType'
        fieldId:
          type: string
          description: Associated field ID | معرف الحقل المرتبط
          example: "field-001"
        serialNumber:
          type: string
          description: Device serial number | الرقم التسلسلي للجهاز
          example: "SM-2024-001"
        status:
          $ref: '#/components/schemas/DeviceStatus'
        lastSeen:
          type: string
          format: date-time
          description: Last communication timestamp | آخر طابع زمني للاتصال
          example: "2026-01-24T10:30:00Z"
        batteryLevel:
          type: integer
          description: Battery level percentage (0-100) | نسبة مستوى البطارية
          minimum: 0
          maximum: 100
          example: 85
        config:
          type: object
          description: Device configuration | إعدادات الجهاز
          additionalProperties: true
          example:
            reportInterval: 300
            threshold:
              min: 20
              max: 80
        location:
          $ref: '#/components/schemas/GeoLocation'
        firmware:
          type: string
          description: Firmware version | إصدار البرنامج الثابت
          example: "2.1.0"
        metadata:
          type: object
          description: Additional metadata | بيانات وصفية إضافية
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp | طابع زمني الإنشاء
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp | طابع زمني آخر تحديث

    SensorReading:
      type: object
      description: |
        Sensor reading data
        بيانات قراءة المستشعر
      required:
        - deviceId
        - readings
        - timestamp
      properties:
        deviceId:
          type: string
          description: Device ID that produced the reading | معرف الجهاز الذي أنتج القراءة
          example: "dev-001"
        readings:
          type: array
          description: Array of sensor readings | مصفوفة قراءات المستشعر
          items:
            type: object
            required:
              - type
              - value
              - unit
            properties:
              type:
                type: string
                description: Reading type | نوع القراءة
                example: "soil_moisture"
              value:
                type: number
                description: Reading value | قيمة القراءة
                example: 45.5
              unit:
                type: string
                description: Unit of measurement | وحدة القياس
                example: "%"
        timestamp:
          type: string
          format: date-time
          description: Reading timestamp | طابع زمني القراءة
          example: "2026-01-24T10:30:00Z"
        quality:
          type: string
          description: Data quality indicator | مؤشر جودة البيانات
          enum: [good, fair, poor, unknown]
          example: "good"
        metadata:
          type: object
          description: Additional reading metadata | بيانات وصفية إضافية للقراءة
          additionalProperties: true

    DeviceCommand:
      type: object
      description: |
        Command to be sent to a device
        الأمر المراد إرساله إلى الجهاز
      required:
        - command
      properties:
        command:
          type: string
          description: |
            Command name to execute
            اسم الأمر المراد تنفيذه
          example: "calibrate"
          enum:
            - reboot
            - calibrate
            - set_interval
            - update_firmware
            - open_valve
            - close_valve
            - take_photo
            - reset
        parameters:
          type: object
          description: |
            Command parameters
            معاملات الأمر
          additionalProperties: true
          example:
            type: "soil_moisture"
            referenceValue: 50.0

    WebSocketMessage:
      type: object
      description: |
        WebSocket message format
        تنسيق رسالة WebSocket
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/WebSocketMessageType'
        channel:
          $ref: '#/components/schemas/WebSocketChannel'
        payload:
          type: object
          description: |
            Message payload (varies by message type)
            حمولة الرسالة (تختلف حسب نوع الرسالة)
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
          description: Message timestamp | طابع زمني الرسالة
        messageId:
          type: string
          description: Unique message identifier | معرف الرسالة الفريد

    # =============================================================================
    # Request/Response Models | نماذج الطلب/الاستجابة
    # =============================================================================

    CreateDeviceRequest:
      type: object
      description: |
        Request to create/register a new device
        طلب إنشاء/تسجيل جهاز جديد
      required:
        - name
        - type
        - fieldId
        - serialNumber
      properties:
        name:
          type: string
          description: Device name | اسم الجهاز
          example: "Soil Moisture Sensor B2"
        nameAr:
          type: string
          description: Device name in Arabic | اسم الجهاز بالعربية
          example: "مستشعر رطوبة التربة ب2"
        type:
          $ref: '#/components/schemas/DeviceType'
        fieldId:
          type: string
          description: Associated field ID | معرف الحقل المرتبط
          example: "field-001"
        serialNumber:
          type: string
          description: Device serial number | الرقم التسلسلي للجهاز
          example: "SM-2024-002"
        config:
          type: object
          description: Initial device configuration | إعدادات الجهاز الأولية
          additionalProperties: true
        location:
          $ref: '#/components/schemas/GeoLocation'
        metadata:
          type: object
          description: Additional metadata | بيانات وصفية إضافية
          additionalProperties: true

    UpdateDeviceRequest:
      type: object
      description: |
        Request to update an existing device
        طلب تحديث جهاز موجود
      properties:
        name:
          type: string
          description: Updated device name | اسم الجهاز المحدث
        nameAr:
          type: string
          description: Updated device name in Arabic | اسم الجهاز المحدث بالعربية
        fieldId:
          type: string
          description: Updated field ID | معرف الحقل المحدث
        status:
          $ref: '#/components/schemas/DeviceStatus'
        config:
          type: object
          description: Updated configuration | الإعدادات المحدثة
          additionalProperties: true
        location:
          $ref: '#/components/schemas/GeoLocation'
        metadata:
          type: object
          description: Updated metadata | البيانات الوصفية المحدثة
          additionalProperties: true

    SensorDataSubmission:
      type: object
      description: |
        Sensor data submission payload
        حمولة إرسال بيانات المستشعر
      required:
        - deviceId
        - readings
        - timestamp
      properties:
        deviceId:
          type: string
          description: Device ID | معرف الجهاز
          example: "dev-001"
        readings:
          type: array
          description: Array of sensor readings | مصفوفة قراءات المستشعر
          items:
            type: object
            required:
              - type
              - value
              - unit
            properties:
              type:
                type: string
                example: "soil_moisture"
              value:
                type: number
                example: 45.5
              unit:
                type: string
                example: "%"
        timestamp:
          type: string
          format: date-time
          description: Reading timestamp | طابع زمني القراءة
          example: "2026-01-24T10:30:00Z"
        metadata:
          type: object
          additionalProperties: true

    DeviceStatusResponse:
      type: object
      description: |
        Device status response
        استجابة حالة الجهاز
      properties:
        deviceId:
          type: string
          example: "dev-001"
        name:
          type: string
          example: "Soil Moisture Sensor A1"
        nameAr:
          type: string
          example: "مستشعر رطوبة التربة أ1"
        status:
          $ref: '#/components/schemas/DeviceStatus'
        lastSeen:
          type: string
          format: date-time
        batteryLevel:
          type: integer
          minimum: 0
          maximum: 100
        signalStrength:
          type: integer
          description: Signal strength (0-100) | قوة الإشارة
          minimum: 0
          maximum: 100
        firmware:
          type: object
          properties:
            version:
              type: string
              example: "2.1.0"
            updateAvailable:
              type: boolean
              example: true
            latestVersion:
              type: string
              example: "2.2.0"
        health:
          type: object
          properties:
            status:
              type: string
              enum: [healthy, degraded, unhealthy]
            issues:
              type: array
              items:
                type: string
        uptime:
          type: integer
          description: Uptime in seconds | وقت التشغيل بالثواني
        lastReading:
          type: object
          properties:
            value:
              type: number
            unit:
              type: string
            timestamp:
              type: string
              format: date-time

    GatewayIngestRequest:
      type: object
      description: |
        IoT Gateway data ingestion request
        طلب استيعاب بيانات بوابة إنترنت الأشياء
      required:
        - protocol
        - deviceId
        - payload
      properties:
        protocol:
          $ref: '#/components/schemas/Protocol'
        deviceId:
          type: string
          description: Device identifier | معرف الجهاز
          example: "dev-001"
        topic:
          type: string
          description: MQTT topic (for MQTT protocol) | موضوع MQTT
          example: "sahool/field-001/soil_moisture"
        payload:
          type: object
          description: Protocol-specific payload | الحمولة الخاصة بالبروتوكول
          additionalProperties: true
        metadata:
          type: object
          description: Protocol-specific metadata | البيانات الوصفية الخاصة بالبروتوكول
          additionalProperties: true

    DeviceProvisionRequest:
      type: object
      description: |
        Device provisioning request
        طلب توفير الجهاز
      required:
        - name
        - type
        - fieldId
        - protocol
        - serialNumber
      properties:
        name:
          type: string
          description: Device name | اسم الجهاز
          example: "New Soil Sensor"
        nameAr:
          type: string
          description: Device name in Arabic | اسم الجهاز بالعربية
          example: "مستشعر تربة جديد"
        type:
          $ref: '#/components/schemas/DeviceType'
        fieldId:
          type: string
          description: Field ID | معرف الحقل
          example: "field-001"
        protocol:
          $ref: '#/components/schemas/Protocol'
        serialNumber:
          type: string
          description: Device serial number | الرقم التسلسلي للجهاز
          example: "SM-2024-NEW"
        lorawanConfig:
          type: object
          description: LoRaWAN-specific configuration | إعدادات LoRaWAN
          properties:
            devEUI:
              type: string
              example: "0004A30B001C5F42"
            appKey:
              type: string
              example: "2B7E151628AED2A6ABF7158809CF4F3C"
            activationMode:
              type: string
              enum: [OTAA, ABP]
              example: "OTAA"

    DeviceProvisionResponse:
      type: object
      description: |
        Device provisioning response
        استجابة توفير الجهاز
      properties:
        deviceId:
          type: string
          description: Assigned device ID | معرف الجهاز المعين
          example: "dev-new-001"
        name:
          type: string
          example: "New Soil Sensor"
        nameAr:
          type: string
          example: "مستشعر تربة جديد"
        protocol:
          $ref: '#/components/schemas/Protocol'
        credentials:
          type: object
          description: Device credentials | بيانات اعتماد الجهاز
          additionalProperties: true
        config:
          type: object
          description: Protocol configuration | إعدادات البروتوكول
          additionalProperties: true
        message:
          type: string
          example: "Device provisioned successfully"
        messageAr:
          type: string
          example: "تم توفير الجهاز بنجاح"

    ProtocolInfo:
      type: object
      description: |
        Protocol information
        معلومات البروتوكول
      properties:
        name:
          type: string
          example: "mqtt"
        nameAr:
          type: string
          example: "MQTT"
        description:
          type: string
          example: "Message Queuing Telemetry Transport"
        descriptionAr:
          type: string
          example: "بروتوكول نقل القياس عن بعد لقائمة الرسائل"
        enabled:
          type: boolean
          example: true
        config:
          type: object
          description: Protocol-specific configuration | إعدادات خاصة بالبروتوكول
          additionalProperties: true

    # =============================================================================
    # Supporting Models | النماذج الداعمة
    # =============================================================================

    GeoLocation:
      type: object
      description: |
        Geographic location
        الموقع الجغرافي
      properties:
        latitude:
          type: number
          format: double
          description: Latitude | خط العرض
          example: 15.3694
        longitude:
          type: number
          format: double
          description: Longitude | خط الطول
          example: 44.191
        altitude:
          type: number
          format: double
          description: Altitude in meters | الارتفاع بالأمتار
          example: 350.5

    Pagination:
      type: object
      description: |
        Pagination information
        معلومات ترقيم الصفحات
      properties:
        page:
          type: integer
          description: Current page number | رقم الصفحة الحالية
          example: 1
        limit:
          type: integer
          description: Items per page | عدد العناصر في الصفحة
          example: 20
        totalPages:
          type: integer
          description: Total number of pages | العدد الإجمالي للصفحات
          example: 5

    Error:
      type: object
      description: |
        Error response
        استجابة الخطأ
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code | رمز الخطأ
          example: "NOT_FOUND"
        message:
          type: string
          description: Error message in English | رسالة الخطأ بالإنجليزية
          example: "Device not found"
        messageAr:
          type: string
          description: Error message in Arabic | رسالة الخطأ بالعربية
          example: "الجهاز غير موجود"
        details:
          type: object
          description: Additional error details | تفاصيل الخطأ الإضافية
          additionalProperties: true
        requestId:
          type: string
          description: Request ID for tracking | معرف الطلب للتتبع
          example: "req-uuid-12345"

  responses:
    BadRequestError:
      description: |
        Bad request - Invalid input data
        طلب غير صالح - بيانات إدخال غير صالحة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "BAD_REQUEST"
            message: "Invalid device type provided"
            messageAr: "نوع الجهاز المقدم غير صالح"

    UnauthorizedError:
      description: |
        Unauthorized - Missing or invalid authentication token
        غير مصرح - رمز المصادقة مفقود أو غير صالح
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "UNAUTHORIZED"
            message: "Authentication token is required"
            messageAr: "رمز المصادقة مطلوب"

    NotFoundError:
      description: |
        Resource not found
        المورد غير موجود
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "NOT_FOUND"
            message: "Device not found"
            messageAr: "الجهاز غير موجود"

    InternalServerError:
      description: |
        Internal server error
        خطأ داخلي في الخادم
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "INTERNAL_SERVER_ERROR"
            message: "An unexpected error occurred"
            messageAr: "حدث خطأ غير متوقع"
