openapi: 3.0.3
info:
  title: SAHOOL Marketplace Services API
  description: |
    Agricultural Marketplace, Community, Research, and Disaster Assessment API for the SAHOOL Platform
    واجهة برمجة تطبيقات السوق الزراعي والمجتمع والبحث وتقييم الكوارث لمنصة سهول

    This API provides comprehensive marketplace and community functionality including:
    - Product management (seeds, fertilizers, equipment, etc.) | إدارة المنتجات (البذور، الأسمدة، المعدات، إلخ)
    - Order creation and tracking | إنشاء وتتبع الطلبات
    - Community posts and discussions | المنشورات والنقاشات المجتمعية
    - Agricultural research trials | التجارب البحثية الزراعية
    - Disaster risk assessment | تقييم مخاطر الكوارث

    ## Services | الخدمات

    | Service | Port | Base Path | Description |
    |---------|------|-----------|-------------|
    | marketplace-service | 3010 | /api/v1/marketplace | Agricultural marketplace | السوق الزراعي |
    | community-chat | 8097 | /api/v1/community | Community posts and discussions | المجتمع والنقاشات |
    | research-core | 3015 | /api/v1/research | Research trials management | إدارة التجارب البحثية |
    | disaster-assessment | 3020 | /api/v1/disaster | Disaster risk assessment | تقييم مخاطر الكوارث |

    Arabic Support: جميع واجهات API تدعم اللغة العربية بشكل كامل
  version: 16.0.0
  contact:
    name: SAHOOL Platform Support
    email: support@sahool.sa
  license:
    name: Proprietary

servers:
  - url: https://api.sahool.sa/api/v1
    description: Production server | خادم الإنتاج
  - url: https://staging-api.sahool.sa/api/v1
    description: Staging server | خادم التجريب
  - url: http://localhost:3010/api/v1
    description: Local marketplace-service | خدمة السوق المحلية
  - url: http://localhost:8097/api/v1
    description: Local community-chat | خدمة المجتمع المحلية
  - url: http://localhost:3015/api/v1
    description: Local research-core | خدمة البحث المحلية
  - url: http://localhost:3020/api/v1
    description: Local disaster-assessment | خدمة تقييم الكوارث المحلية

tags:
  - name: Products
    description: |
      Product listing and management
      إدارة وعرض المنتجات
  - name: Categories
    description: |
      Product category operations
      عمليات فئات المنتجات
  - name: Orders
    description: |
      Order creation and management
      إنشاء وإدارة الطلبات
  - name: Community
    description: |
      Community posts and discussions
      المنشورات والنقاشات المجتمعية
  - name: Research
    description: |
      Agricultural research trials management
      إدارة التجارب البحثية الزراعية
  - name: Disaster
    description: |
      Disaster risk assessment and management
      تقييم وإدارة مخاطر الكوارث

security:
  - BearerAuth: []

paths:
  # ============================================
  # MARKETPLACE SERVICE - Port 3010
  # /api/v1/marketplace
  # ============================================

  /marketplace/products:
    get:
      tags:
        - Products
      summary: Get all products | جلب جميع المنتجات
      description: |
        Retrieve a list of products with optional filtering and sorting.
        جلب قائمة المنتجات مع إمكانية التصفية والترتيب.
      operationId: getProducts
      parameters:
        - name: category
          in: query
          description: |
            Filter by product category
            تصفية حسب فئة المنتج
          schema:
            $ref: '#/components/schemas/ProductCategory'
        - name: search
          in: query
          description: |
            Search by product name or description
            البحث بالاسم أو الوصف
          schema:
            type: string
        - name: minPrice
          in: query
          description: |
            Minimum price filter
            الحد الأدنى للسعر
          schema:
            type: number
            format: float
        - name: maxPrice
          in: query
          description: |
            Maximum price filter
            الحد الأقصى للسعر
          schema:
            type: number
            format: float
        - name: status
          in: query
          description: |
            Filter by product status
            تصفية حسب حالة المنتج
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - name: sellerId
          in: query
          description: |
            Filter by seller ID
            تصفية حسب معرف البائع
          schema:
            type: string
        - name: sortBy
          in: query
          description: Sort order | ترتيب النتائج
          schema:
            type: string
            enum: [price_asc, price_desc, name, newest, rating]
            default: newest
        - name: page
          in: query
          description: Page number (1-based) | رقم الصفحة
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page | عدد العناصر في الصفحة
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Products retrieved successfully | تم جلب المنتجات بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              examples:
                success:
                  value:
                    data:
                      - id: "prod-001"
                        name: "Organic Wheat Seeds"
                        nameAr: "بذور قمح عضوية"
                        description: "High-quality organic wheat seeds for optimal yield"
                        descriptionAr: "بذور قمح عضوية عالية الجودة لإنتاجية مثالية"
                        category: "seeds"
                        price: 150
                        currency: "SAR"
                        unit: "kg"
                        unitAr: "كجم"
                        status: "available"
                        stock: 500
                        imageUrl: "https://cdn.sahool.sa/products/wheat-seeds.jpg"
                        sellerId: "seller-001"
                        sellerName: "مؤسسة البذور الزراعية"
                        sellerRating: 4.5
                        location:
                          city: "Riyadh"
                          cityAr: "الرياض"
                          region: "Central"
                          regionAr: "الوسطى"
                        tags: ["organic", "wheat", "seeds"]
                        createdAt: "2026-01-01T00:00:00Z"
                        updatedAt: "2026-01-15T10:30:00Z"
                    pagination:
                      page: 1
                      limit: 20
                      total: 150
                      totalPages: 8
        '400':
          $ref: '#/components/responses/BadRequestError'

    post:
      tags:
        - Products
      summary: Create a new product | إنشاء منتج جديد
      description: |
        Create a new product listing in the marketplace.
        إنشاء منتج جديد في السوق.
      operationId: createProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            example:
              name: "NPK Fertilizer 20-20-20"
              nameAr: "سماد NPK 20-20-20"
              description: "Balanced NPK fertilizer for all crops"
              descriptionAr: "سماد NPK متوازن لجميع المحاصيل"
              category: "fertilizer"
              price: 85
              currency: "SAR"
              unit: "bag (25kg)"
              unitAr: "كيس (25 كجم)"
              stock: 200
              imageUrl: "https://cdn.sahool.sa/products/npk-fertilizer.jpg"
              location:
                city: "Jeddah"
                cityAr: "جدة"
                region: "Western"
                regionAr: "الغربية"
              tags: ["fertilizer", "NPK", "nutrients"]
              specifications:
                nitrogen: "20%"
                phosphorus: "20%"
                potassium: "20%"
      responses:
        '201':
          description: Product created successfully | تم إنشاء المنتج بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /marketplace/products/{productId}:
    get:
      tags:
        - Products
      summary: Get product by ID | جلب المنتج بالمعرف
      description: |
        Retrieve detailed information about a specific product.
        جلب معلومات تفصيلية عن منتج محدد.
      operationId: getProductById
      parameters:
        - name: productId
          in: path
          required: true
          description: Product ID | معرف المنتج
          schema:
            type: string
      responses:
        '200':
          description: Product retrieved successfully | تم جلب المنتج بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Products
      summary: Update product | تحديث المنتج
      description: |
        Update product information (seller only).
        تحديث معلومات المنتج (للبائع فقط).
      operationId: updateProduct
      security:
        - BearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          description: Product ID | معرف المنتج
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Product updated successfully | تم تحديث المنتج بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Products
      summary: Delete product | حذف المنتج
      description: |
        Remove a product listing (seller only).
        حذف منتج من السوق (للبائع فقط).
      operationId: deleteProduct
      security:
        - BearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          description: Product ID | معرف المنتج
          schema:
            type: string
      responses:
        '204':
          description: Product deleted successfully | تم حذف المنتج بنجاح
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /marketplace/categories:
    get:
      tags:
        - Categories
      summary: Get all categories | جلب جميع الفئات
      description: |
        Retrieve all product categories with product counts.
        جلب جميع فئات المنتجات مع عدد المنتجات في كل فئة.
      operationId: getCategories
      responses:
        '200':
          description: Categories retrieved successfully | تم جلب الفئات بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
              examples:
                success:
                  value:
                    data:
                      - id: "seeds"
                        name: "Seeds"
                        nameAr: "البذور"
                        description: "Agricultural seeds and planting materials"
                        descriptionAr: "البذور الزراعية ومواد الزراعة"
                        count: 45
                      - id: "fertilizer"
                        name: "Fertilizer"
                        nameAr: "الأسمدة"
                        description: "Organic and chemical fertilizers"
                        descriptionAr: "الأسمدة العضوية والكيميائية"
                        count: 32
                      - id: "pesticide"
                        name: "Pesticide"
                        nameAr: "المبيدات"
                        description: "Pest and disease control products"
                        descriptionAr: "منتجات مكافحة الآفات والأمراض"
                        count: 28
                      - id: "equipment"
                        name: "Equipment"
                        nameAr: "المعدات"
                        description: "Agricultural machinery and tools"
                        descriptionAr: "الآلات والأدوات الزراعية"
                        count: 56
                      - id: "produce"
                        name: "Produce"
                        nameAr: "المنتجات الزراعية"
                        description: "Fresh agricultural produce"
                        descriptionAr: "المنتجات الزراعية الطازجة"
                        count: 120
                      - id: "livestock"
                        name: "Livestock"
                        nameAr: "الماشية"
                        description: "Farm animals and poultry"
                        descriptionAr: "حيوانات المزرعة والدواجن"
                        count: 35

  /marketplace/orders:
    get:
      tags:
        - Orders
      summary: Get user orders | جلب طلبات المستخدم
      description: |
        Retrieve orders for the authenticated user.
        جلب طلبات المستخدم الحالي.
      operationId: getUserOrders
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by order status | تصفية حسب حالة الطلب
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: dateFrom
          in: query
          description: Start date filter (ISO 8601) | تاريخ البداية
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: End date filter (ISO 8601) | تاريخ النهاية
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: Page number | رقم الصفحة
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page | عدد العناصر في الصفحة
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Orders retrieved successfully | تم جلب الطلبات بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Orders
      summary: Create order | إنشاء طلب
      description: |
        Create a new order from selected products.
        إنشاء طلب جديد من المنتجات المختارة.
      operationId: createOrder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              items:
                - productId: "prod-001"
                  quantity: 10
                - productId: "prod-002"
                  quantity: 5
              shippingAddress:
                name: "أحمد السعود"
                nameEn: "Ahmed Al-Saud"
                phone: "+966501234567"
                addressLine1: "123 طريق الملك فهد"
                addressLine1En: "123 King Fahd Road"
                city: "الرياض"
                cityEn: "Riyadh"
                region: "الوسطى"
                regionEn: "Central"
                postalCode: "11564"
                country: "المملكة العربية السعودية"
              notes: "يرجى التوصيل صباحاً | Please deliver in the morning"
      responses:
        '201':
          description: Order created successfully | تم إنشاء الطلب بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /marketplace/orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get order by ID | جلب الطلب بالمعرف
      description: |
        Retrieve detailed information about a specific order.
        جلب معلومات تفصيلية عن طلب محدد.
      operationId: getOrderById
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: Order ID | معرف الطلب
          schema:
            type: string
      responses:
        '200':
          description: Order retrieved successfully | تم جلب الطلب بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ============================================
  # COMMUNITY CHAT SERVICE - Port 8097
  # /api/v1/community
  # ============================================

  /community/posts:
    get:
      tags:
        - Community
      summary: Get community posts | جلب المنشورات المجتمعية
      description: |
        Retrieve community posts with optional filtering.
        جلب المنشورات المجتمعية مع إمكانية التصفية.
      operationId: getCommunityPosts
      parameters:
        - name: category
          in: query
          description: Filter by post category | تصفية حسب فئة المنشور
          schema:
            $ref: '#/components/schemas/PostCategory'
        - name: authorId
          in: query
          description: Filter by author ID | تصفية حسب معرف الكاتب
          schema:
            type: string
        - name: search
          in: query
          description: Search in post content | البحث في محتوى المنشورات
          schema:
            type: string
        - name: sortBy
          in: query
          description: Sort order | ترتيب النتائج
          schema:
            type: string
            enum: [newest, popular, most_commented]
            default: newest
        - name: page
          in: query
          description: Page number | رقم الصفحة
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page | عدد العناصر في الصفحة
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Posts retrieved successfully | تم جلب المنشورات بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommunityPost'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              examples:
                success:
                  value:
                    data:
                      - id: "post-001"
                        title: "Best practices for wheat irrigation"
                        titleAr: "أفضل ممارسات ري القمح"
                        content: "I've found that drip irrigation works best for wheat..."
                        contentAr: "وجدت أن الري بالتنقيط يعمل بشكل أفضل للقمح..."
                        category: "advice"
                        authorId: "user-001"
                        authorName: "Mohammed Al-Rashid"
                        authorNameAr: "محمد الراشد"
                        authorAvatar: "https://cdn.sahool.sa/avatars/user-001.jpg"
                        likesCount: 45
                        commentsCount: 12
                        tags: ["wheat", "irrigation", "drip"]
                        images: []
                        createdAt: "2026-01-20T10:00:00Z"
                        updatedAt: "2026-01-20T10:00:00Z"
                    pagination:
                      page: 1
                      limit: 20
                      total: 150
                      totalPages: 8
        '400':
          $ref: '#/components/responses/BadRequestError'

    post:
      tags:
        - Community
      summary: Create community post | إنشاء منشور مجتمعي
      description: |
        Create a new community post.
        إنشاء منشور جديد في المجتمع.
      operationId: createCommunityPost
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
            example:
              title: "Question about tomato disease"
              titleAr: "سؤال عن مرض الطماطم"
              content: "My tomato plants have yellow spots on leaves. What could be the cause?"
              contentAr: "نباتات الطماطم لدي بها بقع صفراء على الأوراق. ما السبب المحتمل؟"
              category: "question"
              tags: ["tomato", "disease", "leaves"]
              images: ["https://cdn.sahool.sa/uploads/tomato-issue.jpg"]
      responses:
        '201':
          description: Post created successfully | تم إنشاء المنشور بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CommunityPost'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /community/posts/{postId}:
    get:
      tags:
        - Community
      summary: Get post by ID | جلب المنشور بالمعرف
      description: |
        Retrieve detailed information about a specific post.
        جلب معلومات تفصيلية عن منشور محدد.
      operationId: getCommunityPostById
      parameters:
        - name: postId
          in: path
          required: true
          description: Post ID | معرف المنشور
          schema:
            type: string
      responses:
        '200':
          description: Post retrieved successfully | تم جلب المنشور بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CommunityPost'
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostComment'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Community
      summary: Update post | تحديث المنشور
      description: |
        Update a community post (author only).
        تحديث منشور مجتمعي (للكاتب فقط).
      operationId: updateCommunityPost
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Post ID | معرف المنشور
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: Post updated successfully | تم تحديث المنشور بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CommunityPost'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Community
      summary: Delete post | حذف المنشور
      description: |
        Delete a community post (author or admin only).
        حذف منشور مجتمعي (للكاتب أو المدير فقط).
      operationId: deleteCommunityPost
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Post ID | معرف المنشور
          schema:
            type: string
      responses:
        '204':
          description: Post deleted successfully | تم حذف المنشور بنجاح
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /community/posts/{postId}/comments:
    post:
      tags:
        - Community
      summary: Add comment to post | إضافة تعليق على المنشور
      description: |
        Add a comment to a community post.
        إضافة تعليق على منشور مجتمعي.
      operationId: addPostComment
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Post ID | معرف المنشور
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  description: Comment content | محتوى التعليق
                  minLength: 1
                  maxLength: 2000
                contentAr:
