  # ============================================
  # RESPONSES
  # ============================================

  responses:
    BadRequestError:
      description: |
        Bad request - Invalid input data
        طلب غير صالح - بيانات الإدخال غير صحيحة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "BAD_REQUEST"
            message: "Invalid input data provided"
            messageAr: "البيانات المدخلة غير صالحة"

    UnauthorizedError:
      description: |
        Unauthorized - Missing or invalid authentication token
        غير مصرح - رمز المصادقة مفقود أو غير صالح
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "UNAUTHORIZED"
            message: "Authentication token is required"
            messageAr: "رمز المصادقة مطلوب"

    ForbiddenError:
      description: |
        Forbidden - Insufficient permissions
        محظور - صلاحيات غير كافية
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "FORBIDDEN"
            message: "You don't have permission to perform this action"
            messageAr: "ليس لديك صلاحية لتنفيذ هذا الإجراء"

    NotFoundError:
      description: |
        Resource not found
        المورد غير موجود
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "NOT_FOUND"
            message: "The requested resource was not found"
            messageAr: "المورد المطلوب غير موجود"
