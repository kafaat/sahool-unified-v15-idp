      description: |
        JWT authentication token
        رمز مصادقة JWT

  schemas:
    # ============================================
    # ENUMS
    # ============================================

    ProductCategory:
      type: string
      enum:
        - seeds
        - fertilizer
        - pesticide
        - equipment
        - produce
        - livestock
      description: |
        Product category | فئة المنتج
        - seeds: البذور
        - fertilizer: الأسمدة
        - pesticide: المبيدات
        - equipment: المعدات
        - produce: المنتجات الزراعية
        - livestock: الماشية

    ProductStatus:
      type: string
      enum:
        - available
        - out_of_stock
        - discontinued
      description: |
        Product availability status | حالة توفر المنتج
        - available: متوفر
        - out_of_stock: نفد من المخزون
        - discontinued: متوقف

    OrderStatus:
      type: string
      enum:
        - pending
        - confirmed
        - shipped
        - delivered
        - cancelled
      description: |
        Order processing status | حالة معالجة الطلب
        - pending: قيد الانتظار
        - confirmed: مؤكد
        - shipped: تم الشحن
        - delivered: تم التسليم
        - cancelled: ملغي

    PostCategory:
      type: string
      enum:
        - question
        - advice
        - success_story
        - marketplace
        - weather
        - pest
      description: |
        Community post category | فئة المنشور المجتمعي
        - question: سؤال
        - advice: نصيحة
        - success_story: قصة نجاح
        - marketplace: سوق
        - weather: طقس
        - pest: آفات

    DisasterType:
      type: string
      enum:
        - flood
        - drought
        - frost
        - hail
        - pest
        - disease
        - fire
      description: |
        Disaster type | نوع الكارثة
        - flood: فيضان
        - drought: جفاف
        - frost: صقيع
        - hail: برد
        - pest: آفات
        - disease: مرض
        - fire: حريق

