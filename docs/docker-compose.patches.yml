# PATCH 10: virtual-sensors - Add nats-py to requirements
# -----------------------------------------------------------------------------
# This is a Dockerfile/requirements.txt change, not docker-compose:
# ADD to apps/services/virtual-sensors/requirements.txt:
# nats-py>=2.7.0

# -----------------------------------------------------------------------------
# PATCH 11: ground-vision-service - Increase healthcheck start_period
# -----------------------------------------------------------------------------
ground-vision-service:
  healthcheck:
    # CHANGE start_period from 15s to 60s (GPU model loading takes time):
    start_period: 60s
    timeout: 15s
    retries: 5

# -----------------------------------------------------------------------------
# PATCH 12: crop-intelligence-service - Increase healthcheck start_period
# -----------------------------------------------------------------------------
crop-intelligence-service:
  healthcheck:
    # CHANGE start_period from 20s to 45s (ML model loading):
    start_period: 45s

# -----------------------------------------------------------------------------
# PATCH 13: milvus - Increase healthcheck start_period
# -----------------------------------------------------------------------------
milvus:
  healthcheck:
    # Keep at 90s (already set) - VERIFY this is correct
    start_period: 90s

# -----------------------------------------------------------------------------
# PATCH 14: mlflow - Add proper database waiting
# -----------------------------------------------------------------------------
mlflow:
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    # Increase start_period for pip install + server startup:
    start_period: 60s

