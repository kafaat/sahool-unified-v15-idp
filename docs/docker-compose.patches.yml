# -----------------------------------------------------------------------------
# PATCH 9: marketplace-service - Split NATS credentials
# -----------------------------------------------------------------------------
# NOTE: This requires CODE CHANGE in the service, not just docker-compose
marketplace-service:
  environment:
    # ADD separate NATS credentials:
    - NATS_SERVERS=nats://nats:4222
    - NATS_USER=${NATS_USER}
    - NATS_PASSWORD=${NATS_PASSWORD}
    # KEEP for backwards compatibility but update code to parse separately:
    - NATS_URL=nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222

