# -----------------------------------------------------------------------------
# PATCH 4: edge-orchestrator-service - Add pgbouncer dependency
# -----------------------------------------------------------------------------
edge-orchestrator-service:
  depends_on:
    # ADD these if missing:
    pgbouncer:
      condition: service_healthy
    nats:
      condition: service_healthy
    redis:
      condition: service_healthy

# -----------------------------------------------------------------------------
# PATCH 5: provider-config - Add sslmode=disable
# -----------------------------------------------------------------------------
provider-config:
  environment:
    # BEFORE:
    # - DATABASE_URL=postgresql://${POSTGRES_USER:-sahool}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-sahool}
    # AFTER:
    - DATABASE_URL=postgresql://${POSTGRES_USER:-sahool}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-sahool}?sslmode=disable

# -----------------------------------------------------------------------------
# PATCH 6: field-chat - Fix DB scheme for asyncpg
# -----------------------------------------------------------------------------
field-chat:
  environment:
    # BEFORE:
    # - DATABASE_URL=postgresql://${POSTGRES_USER:-sahool}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-sahool}
    # AFTER (use asyncpg scheme):
    - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sahool}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-sahool}?ssl=disable

# -----------------------------------------------------------------------------
# PATCH 7: ndvi-engine (deprecated) - Add sslmode and use pgbouncer
# -----------------------------------------------------------------------------
ndvi-engine:
  environment:
    # BEFORE:
    # - DATABASE_URL=postgresql://${POSTGRES_USER:-sahool}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sahool}
    # AFTER (use pgbouncer with sslmode):
    - DATABASE_URL=postgresql://${POSTGRES_USER:-sahool}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-sahool}?sslmode=disable
  depends_on:
    # CHANGE from postgres to pgbouncer:
    pgbouncer:
      condition: service_healthy
    nats:
      condition: service_healthy

