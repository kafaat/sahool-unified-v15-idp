# -----------------------------------------------------------------------------
# PATCH 1: ai-agents-service - Add sslmode=disable
# -----------------------------------------------------------------------------
# LOCATION: apps/services/ai-agents-service section
# CHANGE: DATABASE_URL environment variable

ai-agents-service:
  environment:
    # BEFORE:
    # - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sahool}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-sahool}
    # AFTER (add sslmode=disable):
    - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sahool}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-sahool}?ssl=disable

# -----------------------------------------------------------------------------
# PATCH 2: crm-service - Add sslmode=disable
# -----------------------------------------------------------------------------
crm-service:
  environment:
    # BEFORE:
    # - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sahool}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-sahool}
    # AFTER:
    - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sahool}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-sahool}?ssl=disable

# -----------------------------------------------------------------------------
# PATCH 3: lowcode-engine - Add sslmode=disable
