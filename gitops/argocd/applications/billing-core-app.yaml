apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: billing-core
  namespace: argocd
spec:
  project: sahool
  source:
    repoURL: https://github.com/kafaat/sahool-unified-v15-idp
    targetRevision: main
    path: gitops/sahool/services/billing-core
  destination:
    server: https://kubernetes.default.svc
    namespace: sahool
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    # automated sync disabled for production safety - use manual sync
    # automated:
    #   prune: true
    #   selfHeal: true
