apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sahool-idp-root
  namespace: argocd
spec:
  project: sahool
  source:
    repoURL: https://github.com/kafaat/sahool-unified-v15-idp
    targetRevision: main
    path: gitops/idp/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    # automated sync disabled for production safety - use manual sync
    # automated:
      # prune: true
      # selfHeal: true
