apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-core
  namespace: sahool
  annotations:
    checkov.io/skip1: CKV_K8S_43=Internal billing-core image; digest pinning managed by GitOps release pipeline
    checkov.io/skip2: CKV_K8S_40=Service runs as UID 1000 (non-root) per application requirement
  labels: { app: billing-core }
spec:
  replicas: 2
  selector: { matchLabels: { app: billing-core } }
  template:
    metadata:
      labels: { app: billing-core }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: billing-core
          image: REPLACE_WITH_IMAGE_REPO/billing-core:0.1.0
          imagePullPolicy: Always
          ports: [{ containerPort: 8087 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet: { path: /readyz, port: 8087 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet: { path: /healthz, port: 8087 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
