    health_endpoint: "https://api.sahool.app/agents/audit-agent/health"

    security:
      scheme: "bearer"
      requires_authentication: true
      requires_admin: true

    metadata:
      tags: ["security", "audit", "compliance", "threat-detection", "self-healing"]
      organization: "SAHOOL"
      license: "MIT"
      priority: "high"

    status: "active"

  # ═══════════════════════════════════════════════════════════════════════════
  # CODE FIX AGENT - وكيل إصلاح الكود
  # ═══════════════════════════════════════════════════════════════════════════
  code-fix-agent:
    name: "Code Fix Agent"
    name_ar: "وكيل إصلاح الكود"
    version: "16.0.0"
    category: intelligence
    type: autonomous
    owner: "data-team@sahool.io"
    description: "AI-powered code analysis, bug fixing, implementation, and test generation"
    description_ar: "تحليل الكود وإصلاح الأخطاء وتنفيذ الميزات وتوليد الاختبارات بالذكاء الاصطناعي"

    capabilities:
      - name: "analyze_code"
        description: "Comprehensive code analysis for bugs, security, performance, and style"
        description_ar: "تحليل شامل للكود للأخطاء والأمان والأداء والأسلوب"
        input_schema:
          type: object
          required: ["code", "language"]
          properties:
            code: { type: string }
            language: { type: string, enum: ["python", "typescript", "dart"] }
            file_path: { type: string }
        output_schema:
          type: object
          properties:
            issues: { type: array }
            metrics: { type: object }
            suggestions: { type: array }

      - name: "fix_code"
        description: "Automatically fix detected issues in code"
        description_ar: "إصلاح المشاكل المكتشفة في الكود تلقائياً"
        input_schema:
          type: object
          required: ["code", "errors"]
          properties:
            code: { type: string }
            errors: { type: array }
            strategy: { type: string, enum: ["minimal", "comprehensive", "refactor"] }
        output_schema:
          type: object
          properties:
            fixed_code: { type: string }
            changes: { type: array }
            confidence: { type: number }

      - name: "review_pr"
        description: "Review pull request changes and provide feedback"
        description_ar: "مراجعة تغييرات طلب السحب وتقديم الملاحظات"
        input_schema:
          type: object
          required: ["diff"]
          properties:
            diff: { type: string }
            context_files: { type: array }
        output_schema:
          type: object
          properties:
            comments: { type: array }
            approval_status: { type: string }
            suggestions: { type: array }

      - name: "generate_tests"
        description: "Generate unit tests for code"
        description_ar: "توليد اختبارات الوحدة للكود"
        input_schema:
          type: object
          required: ["code", "language"]
          properties:
            code: { type: string }
            language: { type: string }
            framework: { type: string }
            coverage_target: { type: number }
        output_schema:
          type: object
          properties:
            tests: { type: array }
            coverage_estimate: { type: number }

      - name: "implement_feature"
        description: "Implement feature from specification"
        description_ar: "تنفيذ ميزة من المواصفات"
        input_schema:
          type: object
          required: ["specification"]
          properties:
            specification: { type: object }
            target_files: { type: array }
            design_patterns: { type: array }
        output_schema:
          type: object
          properties:
            implementation: { type: object }
            tests: { type: array }
            documentation: { type: string }

    skills:
      - skill_id: "code_analysis"
        name: "Code Analysis"
        name_ar: "تحليل الكود"
        level: "expert"
        keywords: ["analysis", "bugs", "security", "performance", "linting"]

      - skill_id: "code_generation"
        name: "Code Generation"
        name_ar: "توليد الكود"
        level: "expert"
        keywords: ["generation", "implementation", "refactoring", "patterns"]

      - skill_id: "testing"
        name: "Test Generation"
        name_ar: "توليد الاختبارات"
        level: "advanced"
        keywords: ["testing", "unit-tests", "coverage", "pytest", "vitest"]

      - skill_id: "code_review"
        name: "Code Review"
        name_ar: "مراجعة الكود"
        level: "expert"
        keywords: ["review", "pr", "feedback", "best-practices"]

      - skill_id: "auto_fix"
        name: "Auto-Fix Engine"
        name_ar: "محرك الإصلاح التلقائي"
        level: "expert"
        keywords: ["auto-fix", "diagnostics", "ruff", "eslint", "bandit"]

    # Model configuration with Ollama support
    model_config:
      primary:
        provider: "ollama"
        model: "deepseek-coder:6.7b"
        endpoint: "${OLLAMA_BASE_URL:-http://localhost:11434}"
        context_length: 16384
        temperature: 0.0
      fallback:
        provider: "anthropic"
        model: "claude-sonnet-4-20250514"
        context_length: 200000

    # Integration with shared auto-fix module
    auto_fix_integration:
      module: "shared.ai.auto_fix"
      classes:
        - AutoFixEngine
        - CodeDiagnostics
        - CodeFixer
      default_strategy: "safe"
      audit_enabled: true

    # UltraRAG Integration with Tri-RAG for code knowledge
    rag_integration:
      enabled: true
      provider: "CodeRAGProvider"
      module: "shared.ai.ultrarag.providers"
      strategy: "tri_rag"
      config:
        dense_weight: 0.5
        sparse_weight: 0.3
        kg_weight: 0.2
        kg_max_hops: 2
      capabilities:
        - analyze_code
        - find_fix_pattern
        - security_scan
        - get_best_practices

    dependencies:
      - git-service
      - ci-cd-pipeline
      - auto-fix-engine

    endpoint:
      url: "https://api.sahool.app/agents/code-fix/invoke"
      method: "POST"

    health_endpoint: "https://api.sahool.app/agents/code-fix/health"

    security:
      scheme: "bearer"
      requires_authentication: true
      requires_developer_role: true

    metadata:
      tags: ["code", "development", "ai", "automation", "testing", "review", "tri-rag"]
      organization: "SAHOOL"
      license: "MIT"
      priority: "high"

    status: "active"

