# ─────────────────────────────────────────────────────────────────────────────
# Agent Orchestration Rules
# ─────────────────────────────────────────────────────────────────────────────

orchestration:
  supervisor:
    description: "Multi-agent orchestration supervisor / مشرف تنسيق متعدد الوكلاء"
    routing_strategy: "capability-based"
    max_concurrent_agents: 5
    timeout_seconds: 300

  collaboration_patterns:
    field_analysis:
      description: "Complete field analysis workflow"
      agents:
        - field-analyst-agent
        - satellite-analyst-agent
        - weather-advisor-agent
      execution: "parallel"

    disease_diagnosis:
      description: "Disease diagnosis and treatment"
      agents:
        - disease-expert-agent
        - weather-advisor-agent
      execution: "sequential"

    yield_optimization:
      description: "Yield prediction and optimization"
      agents:
        - yield-predictor-agent
        - fertilizer-advisor-agent
        - irrigation-advisor-agent
        - crop-growth-monitor-agent
      execution: "parallel"

    # ═══════════════════════════════════════════════════════════════════════
    # Code Quality Workflows - سير عمل جودة الكود
    # ═══════════════════════════════════════════════════════════════════════

    code_review:
      description: "Comprehensive code review workflow / سير عمل مراجعة الكود الشامل"
      description_ar: "سير عمل مراجعة الكود الشامل"
      agents:
        - code-review-agent
      execution: "parallel"
      subagents:
        - security-scanner
        - test-analyzer
        - performance-analyzer
      tasks:
        - review_code
        - security_scan
        - test_coverage_analysis
        - performance_analysis
        - export_report
      trigger: "event"
      event_types:
        - pull_request_opened
        - pull_request_updated
        - code_push

    code_quality_ci:
      description: "Code quality check for CI/CD / فحص جودة الكود للتكامل المستمر"
      description_ar: "فحص جودة الكود للتكامل المستمر"
      agents:
        - code-review-agent
        - code-fix-agent
      execution: "sequential"
      tasks:
        - review_code
        - generate_tests
        - fix_code
      trigger: "event"
      event_types:
        - ci_pipeline_started

    # ═══════════════════════════════════════════════════════════════════════
    # Security & Audit Workflows - سير عمل الأمان والتدقيق
    # ═══════════════════════════════════════════════════════════════════════

    security_audit:
      description: "Complete security audit workflow / سير عمل التدقيق الأمني الكامل"
      description_ar: "سير عمل التدقيق الأمني الشامل"
      agents:
        - audit-agent
      execution: "sequential"
      tasks:
        - validate_integrity
        - analyze_audit_logs
        - detect_anomalies
        - assess_compliance
        - recommend_fixes
      trigger: "scheduled"
      schedule: "0 2 * * *"  # Daily at 2 AM

    threat_response:
      description: "Threat detection and response / كشف التهديدات والاستجابة"
      description_ar: "كشف التهديدات والاستجابة الفورية"
      agents:
        - audit-agent
      execution: "sequential"
      tasks:
        - detect_anomalies
        - recommend_fixes
      trigger: "event"
      event_types:
        - security_alert
        - anomaly_detected
        - integrity_violation

    compliance_check:
      description: "Periodic compliance assessment / تقييم الامتثال الدوري"
      description_ar: "فحص الامتثال الدوري"
      agents:
        - audit-agent
      execution: "sequential"
      tasks:
        - assess_compliance
      trigger: "scheduled"
      schedule: "0 0 * * 0"  # Weekly on Sunday

    cross_agent_audit:
      description: "Audit all agent activities / تدقيق جميع أنشطة الوكلاء"
      description_ar: "تدقيق أنشطة جميع وكلاء النظام"
      agents:
        - audit-agent
        - field-analyst-agent
        - disease-expert-agent
        - yield-predictor-agent
      execution: "parallel"
      coordinator: "audit-agent"
      tasks:
        - collect_agent_logs
        - analyze_agent_behavior
        - detect_agent_anomalies

# ─────────────────────────────────────────────────────────────────────────────
# Service Level Objectives (SLOs)
# ─────────────────────────────────────────────────────────────────────────────

slos:
  availability:
    target: "99.9%"
    measurement_window: "30d"

  response_time:
    p50: "200ms"
    p95: "1s"
    p99: "3s"

  error_rate:
    target: "<0.1%"

  health_check:
    interval: "60s"
    timeout: "5s"
    failure_threshold: 3

# ─────────────────────────────────────────────────────────────────────────────
# Compliance & Governance
# ─────────────────────────────────────────────────────────────────────────────

compliance:
  data_privacy:
    - "GDPR compliant"
    - "Data minimization"
    - "Encrypted at rest and in transit"

  security:
    - "Bearer token authentication"
    - "API key management"
    - "Rate limiting enabled"
    - "Audit logging"

  ethics:
    - "Transparent AI decisions"
    - "Bias monitoring"
    - "Farmer data ownership"

# ─────────────────────────────────────────────────────────────────────────────
# Monitoring & Observability
# ─────────────────────────────────────────────────────────────────────────────

monitoring:
  metrics:
    - agent_invocation_count
    - agent_response_time
    - agent_error_rate
    - agent_health_status

  alerts:
    - name: "agent_unhealthy"
      condition: "health_status == unhealthy"
      severity: "critical"

    - name: "high_error_rate"
      condition: "error_rate > 5%"
      severity: "warning"

    - name: "slow_response"
      condition: "p95_response_time > 5s"
      severity: "warning"

  logging:
    level: "INFO"
    format: "json"
    retention: "30d"
