# ============================================================================
# 🔐 SAHOOL Platform Credentials Template
# قالب اعتمادات منصة سهول
# ============================================================================
#
# IMPORTANT: Copy this file to credentials.yaml and fill in your credentials.
# NEVER commit credentials.yaml to version control!
#
# ملاحظة: انسخ هذا الملف إلى credentials.yaml واملأ بياناتك.
# لا تقم أبداً بإضافة credentials.yaml إلى Git!
# ============================================================================

version: "1.0"
last_updated: "2024-01-01"

# =============================================================================
# Sentinel Hub - Earth Observation Data
# =============================================================================
# Get credentials at: https://www.sentinel-hub.com/
# Free tier includes 30,000 processing units/month

sentinel_hub:
  # OAuth2 Client Credentials
  # Inject at deploy time via environment or secrets manager
  client_id: "${SENTINEL_HUB_CLIENT_ID}"
  client_secret: "${SENTINEL_HUB_CLIENT_SECRET}"

  # Optional: Instance ID for custom configurations
  instance_id: null

  # Default settings
  max_cloud_coverage: 30.0
  default_resolution: 10  # meters

# =============================================================================
# Database Connections
# =============================================================================

databases:
  # PostgreSQL for main data
  postgresql:
    host: "localhost"
    port: 5432
    database: "sahool"
    username: "sahool_user"
    # Inject at deploy time via environment or secrets manager
    password: "${POSTGRES_PASSWORD}"
    ssl_mode: "prefer"

  # TimescaleDB for time series
  timescaledb:
    host: "localhost"
    port: 5433
    database: "sahool_timeseries"
    username: "sahool_ts"
    # Inject at deploy time via environment or secrets manager
    password: "${TIMESCALEDB_PASSWORD}"

  # Redis for caching
  redis:
    host: "localhost"
    port: 6379
    password: null
    db: 0

# =============================================================================
# Message Queue - NATS
# =============================================================================

nats:
  url: "nats://localhost:4222"
  username: null
  password: null
  cluster_id: "sahool-cluster"

# =============================================================================
# Object Storage - MinIO/S3
# =============================================================================

storage:
  endpoint: "localhost:9000"
  # Inject at deploy time via environment or secrets manager
  access_key: "${MINIO_ACCESS_KEY}"
  secret_key: "${MINIO_SECRET_KEY}"
  bucket: "sahool-data"
  use_ssl: false

# =============================================================================
# External APIs
# =============================================================================

external_apis:
  # Weather API (e.g., OpenWeatherMap)
  weather:
    provider: "openweathermap"
    # Inject at deploy time via environment or secrets manager
    api_key: "${OPENWEATHER_API_KEY}"
    base_url: "https://api.openweathermap.org/data/2.5"

  # SMS Gateway
  sms:
    provider: "twilio"
    # Inject at deploy time via environment or secrets manager
    account_sid: "${TWILIO_ACCOUNT_SID}"
    auth_token: "${TWILIO_AUTH_TOKEN}"
    from_number: "+1234567890"

  # Push Notifications
  firebase:
    project_id: "sahool-platform"
    credentials_file: "./firebase-credentials.json"

# =============================================================================
# Security
# =============================================================================

security:
  # JWT Configuration
  jwt:
    # Inject at deploy time - minimum 32 characters required
    secret_key: "CHANGE_ME_BEFORE_DEPLOY"
    algorithm: "HS256"
    access_token_expire_minutes: 30
    refresh_token_expire_days: 7

  # Encryption keys
  encryption:
    # Inject at deploy time - must be exactly 32 bytes
    key: "CHANGE_ME_BEFORE_DEPLOY"
    algorithm: "AES-256-GCM"
