# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Event Catalog
# كتالوج أحداث نظام سهول
#
# This catalog defines all events in the SAHOOL platform.
# Each event must be documented with schema, producers, and consumers.
# ═══════════════════════════════════════════════════════════════════════════════

version: "2.1.0"
last_updated: "2026-04-20"

# Versioning history
# v2.1.0  (2026-04-20) — align event keys to actual NATS subjects in
#                        shared/events/subjects.py:
#                          sahool.ndvi.calculated        → sahool.satellite.ndvi.computed
#                          sahool.ndvi.anomaly_detected  → sahool.satellite.ndvi.anomaly
#                          sahool.ndvi.trend_changed     → sahool.satellite.ndvi.trend
#                          sahool.crop_health.assessment → sahool.crop.health_assessed
#                          sahool.crop_health.disease_detected → sahool.crop.disease_detected
#                        Add missing categories: iot, advisory, terrain.
#                        Add missing events: iot sensor, advisory tenant-scoped,
#                          terrain leveling/drainage recommendations.
# v2.0.0  (2026-04-13) — migrate all event keys to `sahool.<domain>.<action>`
#                        convention to match shared/events/subjects.py and the
#                        @sahool/shared-events TS package. Replace stale
#                        producer/consumer service names with their current
#                        equivalents (see CLAUDE.md §Deprecated Services):
#                          field-service          → field-management-service
#                          ndvi-processor         → vegetation-analysis-service
#                          satellite-service      → vegetation-analysis-service
#                          crop-health-service    → crop-intelligence-service
#                          advisor-service        → advisory-service
#                          irrigation-service     → irrigation-smart
# v1.0.0  (2024-12-19) — initial catalog.

# ─────────────────────────────────────────────────────────────────────────────
# Event Categories
# ─────────────────────────────────────────────────────────────────────────────
categories:
  field: "Field management events / أحداث إدارة الحقول"
  satellite: "Satellite & NDVI analysis events / أحداث الأقمار الصناعية وتحليل NDVI"
  alert: "Alert and notification events / أحداث التنبيهات"
  weather: "Weather data events / أحداث الطقس"
  irrigation: "Irrigation events / أحداث الري"
  crop: "Crop health and lifecycle events / أحداث صحة المحاصيل ودورة حياتها"
  yield: "Yield prediction events / أحداث توقع الإنتاج"
  iot: "IoT sensor events / أحداث مستشعرات إنترنت الأشياء"
  advisory: "Agricultural advisory events / أحداث الاستشارات الزراعية"
  terrain: "Terrain analysis and recommendation events / أحداث تحليل التضاريس"
  system: "System events / أحداث النظام"

# ─────────────────────────────────────────────────────────────────────────────
# Events Definitions
# ─────────────────────────────────────────────────────────────────────────────
events:
  # ═══════════════════════════════════════════════════════════════════════════
  # FIELD EVENTS
  # ═══════════════════════════════════════════════════════════════════════════
  sahool.field.created:
    category: field
    description: "Emitted when a new field is created / يُرسل عند إنشاء حقل جديد"
    schema:
      $ref: "./schemas/field-created.json"
      properties:
        field_id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        area_hectares: { type: number }
        crop_type: { type: string }
    producers:
      - field-management-service
    consumers:
      - vegetation-analysis-service
      - alert-service
      - analytics-service
    examples:
      - field_id: "fld_abc123"
        tenant_id: "tnt_xyz789"
        name: "حقل القمح الشمالي"
        area_hectares: 15.5
        crop_type: "wheat"

  sahool.field.updated:
    category: field
    description: "Emitted when field details are updated / يُرسل عند تحديث بيانات الحقل"
    schema:
      properties:
        field_id: { type: string }
        changes: { type: object }
        updated_at: { type: string }
    producers:
      - field-management-service
    consumers:
      - vegetation-analysis-service
      - alert-service
    examples:
      - field_id: "fld_abc123"
        changes:
          crop_type: "barley"

  sahool.field.deleted:
    category: field
    description: "Emitted when a field is deleted / يُرسل عند حذف حقل"
    schema:
      properties:
        field_id: { type: string }
        tenant_id: { type: string }
        deleted_at: { type: string }
    producers:
      - field-management-service
    consumers:
      - vegetation-analysis-service
      - alert-service
      - analytics-service

  # Canonical name uses dot-tokens to match shared/events/subjects.py
  # (`SAHOOL_FIELD_BOUNDARY_CHANGED = "sahool.field.boundary.changed"`).
  # Previous key was `sahool.field.boundary_updated` which never matched
  # any publisher and would have wired consumers to a dead subject.
  sahool.field.boundary.changed:
    category: field
    description: "Emitted when field boundary is updated / يُرسل عند تحديث حدود الحقل"
    schema:
      properties:
        field_id: { type: string }
        boundary: { type: object }
        area_hectares: { type: number }
    producers:
      - field-management-service
    consumers:
      - vegetation-analysis-service

  # ═══════════════════════════════════════════════════════════════════════════
  # SATELLITE / NDVI EVENTS
  # ═══════════════════════════════════════════════════════════════════════════
  # Keys match SAHOOL_NDVI_COMPUTED / SAHOOL_NDVI_ANOMALY / SAHOOL_SATELLITE_NDVI_TREND
  # constants in shared/events/subjects.py.
  sahool.satellite.ndvi.computed:
    category: satellite
    description: "Emitted when NDVI is calculated for a field / يُرسل عند حساب NDVI للحقل"
    schema:
      $ref: "./schemas/ndvi-calculated.json"
      properties:
        field_id: { type: string }
        timestamp: { type: string }
        statistics: { type: object }
    producers:
      - vegetation-analysis-service
    consumers:
      - alert-service
      - analytics-service
      - crop-intelligence-service
      - agro-rules
      - frontend-sse
    examples:
      - field_id: "fld_abc123"
        timestamp: "2024-12-19T10:30:00Z"
        statistics:
          mean: 0.65
          min: 0.45
          max: 0.82
          std: 0.08

  sahool.satellite.ndvi.anomaly:
    category: satellite
    description: "Emitted when NDVI anomaly is detected / يُرسل عند اكتشاف شذوذ في NDVI"
    schema:
      properties:
        field_id: { type: string }
        anomaly_type: { type: string }
        previous_value: { type: number }
        current_value: { type: number }
    producers:
      - vegetation-analysis-service
    consumers:
      - alert-service
      - notification-service
      - agro-rules
    examples:
      - field_id: "fld_abc123"
        anomaly_type: "sudden_drop"
        previous_value: 0.72
        current_value: 0.45
        drop_percent: 37.5

  sahool.satellite.ndvi.trend:
    category: satellite
    description: "Emitted when NDVI trend changes / يُرسل عند تغير اتجاه NDVI"
    schema:
      properties:
        field_id: { type: string }
        trend: { type: string }
        period_days: { type: integer }
    producers:
      - analytics-service
    consumers:
      - alert-service
      - advisory-service

  # ═══════════════════════════════════════════════════════════════════════════
  # ALERT EVENTS
  # ═══════════════════════════════════════════════════════════════════════════
  sahool.alert.created:
    category: alert
    description: "Emitted when a new alert is created / يُرسل عند إنشاء تنبيه جديد"
    schema:
      $ref: "./schemas/alert-created.json"
      properties:
        alert_id: { type: string }
        field_id: { type: string }
        type: { type: string }
        severity: { type: string }
    producers:
      - alert-service
    consumers:
      - notification-service
      - frontend-sse
    examples:
      - alert_id: "alt_def456"
        field_id: "fld_abc123"
        type: "ndvi_low"
        severity: "warning"
        message: "NDVI dropped below threshold"

  sahool.alert.dismissed:
    category: alert
    description: "Emitted when an alert is dismissed / يُرسل عند رفض تنبيه"
    schema:
      properties:
        alert_id: { type: string }
        dismissed_by: { type: string }
    producers:
      - alert-service
    consumers:
      - analytics-service
      - frontend-sse

  sahool.alert.resolved:
    category: alert
    description: "Emitted when an alert is resolved / يُرسل عند حل تنبيه"
    schema:
      properties:
        alert_id: { type: string }
        resolved_at: { type: string }
    producers:
      - alert-service
    consumers:
      - analytics-service
      - notification-service

  # ═══════════════════════════════════════════════════════════════════════════
  # WEATHER EVENTS
  # ═══════════════════════════════════════════════════════════════════════════
  sahool.weather.updated:
    category: weather
    description: "Emitted when weather data is updated / يُرسل عند تحديث بيانات الطقس"
    schema:
      $ref: "./schemas/weather-updated.json"
      properties:
        location: { type: object }
        temperature: { type: number }
        humidity: { type: number }
    producers:
      - weather-service
    consumers:
      - irrigation-smart
      - alert-service
      - frontend-sse
    examples:
      - location:
          lat: 24.7136
          lng: 46.6753
        temperature: 35
        humidity: 45
        wind_speed: 12

  sahool.weather.forecast_updated:
    category: weather
    description: "Emitted when weather forecast is updated / يُرسل عند تحديث توقعات الطقس"
    schema:
      properties:
        location: { type: object }
        forecast: { type: array }
    producers:
      - weather-service
    consumers:
      - irrigation-smart
      - advisory-service

  sahool.weather.alert:
    category: weather
    description: "Emitted for severe weather alerts / يُرسل لتنبيهات الطقس الشديد"
    schema:
      properties:
        alert_type: { type: string }
        severity: { type: string }
        location: { type: object }
    producers:
      - weather-service
    consumers:
      - alert-service
      - notification-service

  # ═══════════════════════════════════════════════════════════════════════════
  # IRRIGATION EVENTS
  # ═══════════════════════════════════════════════════════════════════════════
  sahool.irrigation.scheduled:
    category: irrigation
    description: "Emitted when irrigation is scheduled / يُرسل عند جدولة الري"
    schema:
      properties:
        field_id: { type: string }
        scheduled_at: { type: string }
        duration_minutes: { type: integer }
    producers:
      - irrigation-smart
    consumers:
      - notification-service
      - frontend-sse

  sahool.irrigation.completed:
    category: irrigation
    description: "Emitted when irrigation is completed / يُرسل عند اكتمال الري"
    schema:
      properties:
        field_id: { type: string }
        completed_at: { type: string }
        water_used_liters: { type: number }
    producers:
      - irrigation-smart
    consumers:
      - analytics-service
      - field-management-service

  sahool.irrigation.recommendation:
    category: irrigation
    description: "Emitted with irrigation recommendations / يُرسل مع توصيات الري"
    schema:
      properties:
        field_id: { type: string }
        recommendation: { type: object }
    producers:
      - advisory-service
    consumers:
      - irrigation-smart
      - notification-service

  # ═══════════════════════════════════════════════════════════════════════════
  # CROP EVENTS
  # ═══════════════════════════════════════════════════════════════════════════
  # Keys match SAHOOL_CROP_HEALTH_ASSESSED / SAHOOL_CROP_DISEASE_DETECTED
  # in shared/events/subjects.py.
  sahool.crop.health_assessed:
    category: crop
    description: "Emitted with crop health assessment / يُرسل مع تقييم صحة المحصول"
    schema:
      properties:
        field_id: { type: string }
        health_score: { type: number }
        assessment_date: { type: string }
    producers:
      - crop-intelligence-service
    consumers:
      - alert-service
      - advisory-service
      - analytics-service

  sahool.crop.disease_detected:
    category: crop
    description: "Emitted when crop disease is detected / يُرسل عند اكتشاف مرض في المحصول"
    schema:
      properties:
        field_id: { type: string }
        disease_type: { type: string }
        confidence: { type: number }
    producers:
      - crop-intelligence-service
    consumers:
      - alert-service
      - notification-service
      - advisory-service

  # ═══════════════════════════════════════════════════════════════════════════
  # YIELD EVENTS
  # ═══════════════════════════════════════════════════════════════════════════
  sahool.yield.predicted:
    category: yield
    description: "Emitted with yield prediction / يُرسل مع توقع الإنتاج"
    schema:
      properties:
        field_id: { type: string }
        predicted_yield_kg: { type: number }
        confidence: { type: number }
    producers:
      - yield-prediction-service
    consumers:
      - analytics-service
      - frontend-sse

  sahool.yield.actual_recorded:
    category: yield
    description: "Emitted when actual yield is recorded / يُرسل عند تسجيل الإنتاج الفعلي"
    schema:
      properties:
        field_id: { type: string }
        actual_yield_kg: { type: number }
        harvest_date: { type: string }
    producers:
      - field-management-service
    consumers:
      - yield-prediction-service
      - analytics-service

  # ═══════════════════════════════════════════════════════════════════════════
  # IOT EVENTS
  # ═══════════════════════════════════════════════════════════════════════════
  # Keys match SAHOOL_IOT_SENSOR_READING / SAHOOL_IOT_THRESHOLD in subjects.py.
  sahool.iot.sensor.reading:
    category: iot
    description: "Emitted when an IoT sensor reports a reading / يُرسل عند إرسال قراءة من مستشعر"
    schema:
      properties:
        sensor_id: { type: string }
        field_id: { type: string }
        sensor_type: { type: string }
        value: { type: number }
        unit: { type: string }
        timestamp: { type: string }
    producers:
      - iot-gateway
      - iot-service
    consumers:
      - irrigation-smart
      - agro-rules
      - virtual-sensors
      - ground-vision-service

  sahool.iot.threshold:
    category: iot
    description: "Emitted when an IoT sensor crosses a threshold / يُرسل عند تجاوز الحد"
    schema:
      properties:
        sensor_id: { type: string }
        field_id: { type: string }
        threshold_type: { type: string }
        value: { type: number }
        threshold: { type: number }
    producers:
      - iot-gateway
      - iot-sensor-hub
    consumers:
      - alert-service
      - agro-rules

  # ═══════════════════════════════════════════════════════════════════════════
  # ADVISORY EVENTS (tenant-scoped)
  # ═══════════════════════════════════════════════════════════════════════════
  # Published on sahool.tenant.{tenant_id}.advisory.{action} by advisory-service.
  # The task-automation hook subscribes with wildcard sahool.tenant.*.advisory.*
  # and creates FieldOps tasks for each recommendation.
  sahool.tenant.{tenant_id}.advisory.recommendation_issued:
    category: advisory
    description: "Agricultural recommendation issued for a tenant / توصية زراعية لمستأجر"
    schema:
      required: [tenant_id, field_id, actions, severity, confidence]
      properties:
        tenant_id: { type: string }
        field_id: { type: string }
        actions: { type: array }
        severity: { type: string }
        confidence: { type: number }
    producers:
      - advisory-service
    consumers:
      - advisory-service (task_automation hook → FieldOps)
    notes: >
      tenant_id is embedded in the subject token; consumers subscribe via
      sahool.tenant.*.advisory.recommendation_issued wildcard.

  sahool.tenant.{tenant_id}.advisory.fertilizer_plan_issued:
    category: advisory
    description: "Fertilizer plan issued / خطة التسميد"
    schema:
      required: [tenant_id, field_id, plan, crop]
      properties:
        tenant_id: { type: string }
        field_id: { type: string }
        plan: { type: array }
        crop: { type: string }
    producers:
      - advisory-service
    consumers:
      - advisory-service (task_automation hook → FieldOps)

  sahool.tenant.{tenant_id}.advisory.nutrient_assessment_issued:
    category: advisory
    description: "Nutrient deficiency assessment issued / تقييم نقص العناصر الغذائية"
    schema:
      required: [tenant_id, field_id, nutrient, severity]
      properties:
        tenant_id: { type: string }
        field_id: { type: string }
        nutrient: { type: string }
        severity: { type: string }
        corrections: { type: array }
    producers:
      - advisory-service
    consumers:
      - advisory-service (task_automation hook → FieldOps)

  # ═══════════════════════════════════════════════════════════════════════════
  # TERRAIN EVENTS
  # ═══════════════════════════════════════════════════════════════════════════
  # Keys match SAHOOL_TERRAIN_LEVELING_RECOMMENDED / SAHOOL_TERRAIN_DRAINAGE_RECOMMENDED
  # in shared/events/subjects.py.
  sahool.terrain.leveling_recommended:
    category: terrain
    description: "Field leveling recommended after terrain analysis / يُنصح بتسوية الأرض"
    schema:
      properties:
        field_id: { type: string }
        tenant_id: { type: string }
        cut_fill_volume_m3: { type: number }
        slope_percent: { type: number }
        estimated_cost: { type: number }
    producers:
      - terrain-core-service
      - leveling-optimizer-service
    consumers:
      - agro-rules

  sahool.terrain.drainage_recommended:
    category: terrain
    description: "Drainage improvement recommended / يُنصح بتحسين الصرف"
    schema:
      properties:
        field_id: { type: string }
        tenant_id: { type: string }
        drainage_type: { type: string }
        priority: { type: string }
    producers:
      - terrain-core-service
      - hydrology-service
    consumers:
      - agro-rules

  sahool.terrain.high_erosion_risk:
    category: terrain
    description: "High erosion risk detected / خطر تآكل مرتفع"
    schema:
      properties:
        field_id: { type: string }
        tenant_id: { type: string }
        risk_level: { type: string }
    producers:
      - terrain-core-service
    consumers:
      - alert-service
      - agro-rules

  # ═══════════════════════════════════════════════════════════════════════════
  # SYSTEM EVENTS
  # ═══════════════════════════════════════════════════════════════════════════
  sahool.system.service_health:
    category: system
    description: "Emitted with service health status / يُرسل مع حالة صحة الخدمة"
    schema:
      properties:
        service_name: { type: string }
        status: { type: string }
        timestamp: { type: string }
    producers:
      - all-services
    consumers:
      - monitoring-service

  sahool.system.error:
    category: system
    description: "Emitted when system error occurs / يُرسل عند حدوث خطأ في النظام"
    schema:
      properties:
        service_name: { type: string }
        error_type: { type: string }
        message: { type: string }
    producers:
      - all-services
    consumers:
      - monitoring-service
      - alert-service
