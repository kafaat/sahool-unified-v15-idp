apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-disruption-budget
  annotations:
    policies.kyverno.io/title: Require PodDisruptionBudget
    policies.kyverno.io/category: SAHOOL Governance
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment
    policies.kyverno.io/description: >-
      كل Deployment في الإنتاج يجب أن يكون له PodDisruptionBudget لضمان التوفر.
      Production Deployments with 2+ replicas must have a PodDisruptionBudget (PDB)
      to ensure availability during voluntary disruptions (node upgrades, scaling).
spec:
  # Audit mode — logs violations without blocking (transition to Enforce after review)
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-pdb-for-production
      match:
        any:
          - resources:
              kinds:
                - Deployment
              namespaces:
                - "production"
                - "sahool-production"
      preconditions:
        all:
          # Only check deployments with 2+ replicas
          - key: "{{ request.object.spec.replicas || `1` }}"
            operator: GreaterThanOrEquals
            value: 2
          # Only check production lifecycle
          - key: "{{ request.object.metadata.labels.\"sahool.io/lifecycle\" || 'unknown' }}"
            operator: AnyIn
            value:
              - "production"
      context:
        - name: pdbcount
          apiCall:
            urlPath: "/apis/policy/v1/namespaces/{{request.namespace}}/poddisruptionbudgets"
            jmesPath: "items[?spec.selector.matchLabels.app == '{{request.object.metadata.labels.app}}'] | length(@)"
      validate:
        message: >-
          يجب إنشاء PodDisruptionBudget لـ Deployment {{request.object.metadata.name}}.
          Production Deployment {{request.object.metadata.name}} with {{request.object.spec.replicas}}
          replicas must have a PodDisruptionBudget. Create a PDB with minAvailable or
          maxUnavailable to ensure availability during voluntary disruptions.
        deny:
          conditions:
            any:
              - key: "{{ pdbcount }}"
                operator: Equals
                value: 0
