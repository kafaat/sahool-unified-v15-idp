apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: SAHOOL Governance
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      يُسمح فقط بسحب الصور من سجلات معتمدة.
      Container images must be pulled from approved registries only.
      This prevents supply chain attacks from untrusted image sources.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: restrict-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          الصورة {{ element.image }} ليست من سجل معتمد.
          Image {{ element.image }} is not from an approved registry.
          Allowed registries: docker.io, ghcr.io, gcr.io, nvidia (for GPU services).
          Contact the platform team to add a new approved registry.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                all:
                  - key: "{{ element.image }}"
                    operator: AnyNotIn
                    value:
                      - "docker.io/*"
                      - "ghcr.io/*"
                      - "gcr.io/*"
                      - "nvcr.io/*"
                      - "nvidia/*"
                      - "registry.k8s.io/*"
                      - "quay.io/*"
          - list: "request.object.spec.initContainers || []"
            deny:
              conditions:
                all:
                  - key: "{{ element.image }}"
                    operator: AnyNotIn
                    value:
                      - "docker.io/*"
                      - "ghcr.io/*"
                      - "gcr.io/*"
                      - "nvcr.io/*"
                      - "nvidia/*"
                      - "registry.k8s.io/*"
                      - "quay.io/*"
