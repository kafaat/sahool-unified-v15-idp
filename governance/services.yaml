        - wechat_contacts_total
        - wechat_moments_published_total
        - wechat_chat_summaries_generated_total
      alerts:
        - "WeChatAPIError"
        - "WeChatRateLimitExceeded"
        - "WeChatMessageDeliveryFailed"

