# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Services Registry - سجل الخدمات المعتمدة
# Single Source of Truth for all microservices
# ═══════════════════════════════════════════════════════════════════════════════

version: "3.4.0"
last_updated: "2026-03-10"

# ─────────────────────────────────────────────────────────────────────────────
# Event Architecture Layers
# ─────────────────────────────────────────────────────────────────────────────

event_architecture:
  layers:
    acquisition:
      description: "Data ingestion layer - طبقة جمع البيانات"
      services: [iot-service, iot-gateway, weather-service, virtual-sensors, ground-vision-service, edge-orchestrator-service, astronomical-calendar, iot-sensor-hub]
      rules:
        - "No business logic"
        - "Only ingestion + normalization"
        - "Produces raw/normalized events"

    intelligence:
      description: "Feature extraction & AI layer - طبقة الذكاء"
      services: [vegetation-analysis-service, indicators-service, lai-estimation, crop-intelligence-service, disaster-assessment, agro-rules, ndvi-processor, field-intelligence, skills-service, ai-agents-service, ai-agents-core, code-fix-agent, code-review-agent, knowledge-graph, yolo26-vision-service, terrain-core-service, hydrology-service, soil-analysis-service, pest-detection-service, digital-twin-engine, vllm-deepseek]  # ndvi-processor is deprecated → vegetation-analysis-service
      rules:
        - "Consumes from Acquisition"
        - "Produces computed features/assessments"
        - "No direct user interaction"

    decision:
      description: "Advisory & planning layer - طبقة القرار"
      services: [crop-growth-model, advisory-service, irrigation-smart, yield-prediction-service, ai-advisor, leveling-optimizer-service, drone-service, llm-orchestrator-service, fertigation-engine, irrigation-cycle-engine]  # yield-engine deprecated in favor of yield-prediction-service
      rules:
        - "Consumes from Intelligence"
        - "Produces recommendations/plans"
        - "Domain logic here"

    business:
      description: "Business operations layer - طبقة الأعمال"
      services: [notification-service, marketplace-service, billing-core, chat-service, research-core, mcp-server, task-service, equipment-service, ws-gateway, audit-service, crm-service, lowcode-engine, wechat-service, field-management-service, user-service, alert-service, inventory-service, provider-config, agent-registry, code-review-service, globalgap-compliance, logistics-service, cooperative-service, traceability-service, supply-chain-service, whatsapp-bot-service, copilot-api, ai-chat-assistant, ussd-gateway, demo-data]  # community-chat and field-chat removed (deprecated → chat-service)
      rules:
        - "Consumes from Decision"
        - "User-facing operations"
        - "No raw data processing"

  events_registry: "packages/shared/events/index.json"
  transport: "nats"
  subject_pattern: "sahool.{domain}.{action}"  # Global subjects (no tenant segment). Example tenant-scoped format (if needed): sahool.tenant.{tenant_id}.{domain}.{action}

# ─────────────────────────────────────────────────────────────────────────────
# Source of Truth
# ─────────────────────────────────────────────────────────────────────────────

source_of_truth:
  services_root: "apps/services"
  web_root: "apps/web"
  admin_root: "apps/admin"
  mobile_root: "apps/mobile"
  packages_root: "packages"
  shared_root: "shared"
  knowledge_base: "docs/knowledge-base"
  ai_knowledge_module: "shared/ai/knowledge"

# ─────────────────────────────────────────────────────────────────────────────
# Service Categories
# ─────────────────────────────────────────────────────────────────────────────

categories:
  core:
    description: "Core platform services"
    description_ar: "خدمات المنصة الأساسية"

  crop:
    description: "Crop management and modeling"
    description_ar: "إدارة ونمذجة المحاصيل"

  analytics:
    description: "Data analytics and predictions"
    description_ar: "تحليل البيانات والتنبؤات"

  integration:
    description: "External integrations and IoT"
    description_ar: "التكاملات الخارجية وإنترنت الأشياء"

  community:
    description: "Community and marketplace"
    description_ar: "المجتمع والسوق"

# ─────────────────────────────────────────────────────────────────────────────
# Approved Services (v15.3 → v16)
