      - REDIS_URL
      - NATS_URL
      - WECHAT_APP_ID
      - WECHAT_APP_SECRET
      - WECHAT_TOKEN
      - WECHAT_ENCODING_AES_KEY
    resources:
      cpu: "300m"
      memory: "384Mi"
      replicas: 1
