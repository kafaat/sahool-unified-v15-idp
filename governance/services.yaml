  # WECHAT SERVICE - خدمة ويتشات
  # WeChat integration for farmer communication and engagement
  # ═══════════════════════════════════════════════════════════════════════════
  wechat-service:
    name: "WeChat Service"
    name_ar: "خدمة ويتشات"
    description: "WeChat integration for farmer communication, messaging, and social engagement"
    description_ar: "تكامل ويتشات للتواصل مع المزارعين والرسائل والتفاعل الاجتماعي"
    type: python
    category: community
    layer: business
    path: "apps/services/wechat-service"
    port: 8133
    protocol: http
    health_endpoint: "/healthz"
    readiness_endpoint: "/readyz"
    status: active
    version: "1.0.0"
    events:
      produces:
        - WeChatMessageReceived.v1
        - WeChatMessageSent.v1
        - WeChatContactAdded.v1
        - WeChatMomentPublished.v1
        - WeChatChatSummarized.v1
      consumes:
        - NotificationQueued.v1
        - AlertTriggered.v1
        - AdvisoryGenerated.v1
    database:
      type: postgresql
      name: sahool_wechat
      schema: "wechat"
    cache:
      type: redis
      purpose: "message queue, session cache, contact cache"
      ttl: 3600
    dependencies:
      - redis
      - nats
    modules:
      - id: messaging
        name: "Messaging"
        name_ar: "الرسائل"
        endpoint: "/messages"
        description: "Send and receive WeChat messages"

      - id: contacts
        name: "Contact Management"
        name_ar: "إدارة جهات الاتصال"
        endpoint: "/contacts"
        description: "Manage WeChat contacts and groups"

      - id: moments
        name: "Moments Publishing"
        name_ar: "نشر اللحظات"
        endpoint: "/moments"
        description: "Publish and manage WeChat Moments"

      - id: chat-summary
        name: "Chat Summarization"
        name_ar: "تلخيص المحادثات"
        endpoint: "/summary"
        description: "AI-powered chat summarization for farmer interactions"

    environment:
      - DATABASE_URL
      - REDIS_URL
      - NATS_URL
      - WECHAT_APP_ID
      - WECHAT_APP_SECRET
      - WECHAT_TOKEN
      - WECHAT_ENCODING_AES_KEY
    resources:
      cpu: "300m"
      memory: "384Mi"
      replicas: 1
      autoscaling:
        enabled: true
        min_replicas: 1
        max_replicas: 3
        target_cpu: 75
    monitoring:
      metrics:
        - wechat_messages_sent_total
        - wechat_messages_received_total
        - wechat_contacts_total
        - wechat_moments_published_total
        - wechat_chat_summaries_generated_total
      alerts:
        - "WeChatAPIError"
        - "WeChatRateLimitExceeded"
        - "WeChatMessageDeliveryFailed"

