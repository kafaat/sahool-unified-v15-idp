# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Services Registry - سجل الخدمات المعتمدة
# Single Source of Truth for all microservices
# ═══════════════════════════════════════════════════════════════════════════════

version: "3.1.0"
last_updated: "2026-01-23"

# ─────────────────────────────────────────────────────────────────────────────
# Event Architecture Layers
# ─────────────────────────────────────────────────────────────────────────────

event_architecture:
  layers:
    acquisition:
      description: "Data ingestion layer - طبقة جمع البيانات"
      services: [satellite-service, iot-service, iot-gateway, weather-advanced, weather-service, weather-core, virtual-sensors, ussd-gateway]
      rules:
        - "No business logic"
        - "Only ingestion + normalization"
        - "Produces raw/normalized events"

    intelligence:
      description: "Feature extraction & AI layer - طبقة الذكاء"
      services: [indicators-service, lai-estimation, crop-health-ai, crop-health, disaster-assessment, agro-rules, crop-intelligence-service, ndvi-processor, ndvi-engine, field-intelligence, vegetation-analysis-service, skills-service, ai-agents-service, ai-agents-core, code-fix-agent, code-review-agent, knowledge-graph]
      rules:
        - "Consumes from Acquisition"
        - "Produces computed features/assessments"
        - "No direct user interaction"

    decision:
      description: "Advisory & planning layer - طبقة القرار"
      services: [crop-growth-model, fertilizer-advisor, irrigation-smart, yield-engine, yield-prediction, advisory-service, ai-advisor, agro-advisor]
      rules:
        - "Consumes from Intelligence"
        - "Produces recommendations/plans"
        - "Domain logic here"

    business:
      description: "Business operations layer - طبقة الأعمال"
      services: [notification-service, marketplace-service, billing-core, community-chat, chat-service, research-core, mcp-server, task-service, equipment-service, ws-gateway, audit-service, crm-service, lowcode-engine, wechat-service, field-management-service, field-core, field-ops, field-service, user-service, alert-service, inventory-service, field-chat, provider-config, agent-registry, code-review-service, globalgap-compliance, logistics-service]
      rules:
        - "Consumes from Decision"
        - "User-facing operations"
        - "No raw data processing"

  events_registry: "packages/shared/events/index.json"
  transport: "nats"
  subject_pattern: "sahool.{tenant_id}.{event_type}"

# ─────────────────────────────────────────────────────────────────────────────
# Source of Truth
# ─────────────────────────────────────────────────────────────────────────────

source_of_truth:
  services_root: "apps/services"
  web_root: "apps/web"
  admin_root: "apps/admin"
  mobile_root: "apps/mobile"
  packages_root: "packages"
  shared_root: "shared"

# ─────────────────────────────────────────────────────────────────────────────
# Service Categories
# ─────────────────────────────────────────────────────────────────────────────

categories:
  core:
    description: "Core platform services"
    description_ar: "خدمات المنصة الأساسية"

  crop:
    description: "Crop management and modeling"
    description_ar: "إدارة ونمذجة المحاصيل"

  analytics:
    description: "Data analytics and predictions"
    description_ar: "تحليل البيانات والتنبؤات"

  integration:
    description: "External integrations and IoT"
    description_ar: "التكاملات الخارجية وإنترنت الأشياء"

  community:
    description: "Community and marketplace"
    description_ar: "المجتمع والسوق"

