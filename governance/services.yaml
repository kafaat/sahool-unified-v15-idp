    modules:
      - id: cameras
        name: "Camera Registry"
        name_ar: "سجل الكاميرات"
        endpoint: "/api/v1/cameras"
      - id: frames
        name: "Frame Processing"
        name_ar: "معالجة الإطارات"
        endpoint: "/api/v1/frames"
      - id: detections
        name: "Operation Detection"
        name_ar: "كشف العمليات"
        endpoint: "/api/v1/detections"
      - id: timeline
        name: "Crop Timeline"
        name_ar: "الخط الزمني للمحصول"
        endpoint: "/api/v1/timeline"
      - id: anomalies
        name: "Anomaly Detection"
        name_ar: "كشف الشذوذ"
        endpoint: "/api/v1/anomalies"
    database:
      type: postgresql
      name: sahool_ground_vision
    dependencies:
      - vegetation-analysis-service
      - weather-service
      - iot-service
    environment:
      - PORT
      - DATABASE_URL
      - NATS_URL
      - SAM_CHECKPOINT_PATH
      - YOLO_MODEL_PATH
      - MLLM_PROVIDER
      - ANTHROPIC_API_KEY
      - OLLAMA_BASE_URL
      - CHANGE_DETECTION_THRESHOLD
    resources:
