# ─────────────────────────────────────────────────────────────────────────────
# API Gateway Configuration
# ─────────────────────────────────────────────────────────────────────────────

gateway:
  type: kong
  config_path: "infra/kong/kong.yml"
  global_rate_limit:
    minute: 60
    hour: 2000
  authentication:
    type: jwt
    algorithm: RS256

# ─────────────────────────────────────────────────────────────────────────────
# Infrastructure Dependencies
# ─────────────────────────────────────────────────────────────────────────────

infrastructure:
  databases:
    postgresql:
      version: "15"
      host: "${POSTGRES_HOST:-localhost}"
      port: 5432
    timescaledb:
      version: "2.11"
      host: "${TIMESCALE_HOST:-localhost}"
      port: 5432
    redis:
      version: "7"
      host: "${REDIS_HOST:-localhost}"
      port: 6379

  message_brokers:
    mqtt:
      host: "${MQTT_HOST:-localhost}"
      port: 1883
    rabbitmq:
      host: "${RABBITMQ_HOST:-localhost}"
      port: 5672

  observability:
    prometheus:
      port: 9090
    grafana:
      port: 3003  # Changed from 3000 to avoid conflict with field-management-service and web dashboard
    loki:
      port: 3100

# ─────────────────────────────────────────────────────────────────────────────
# Infrastructure Services (Docker Compose)
# خدمات البنية التحتية (دوكر كومبوز)
# These are system-level services that support the application microservices.
# They are NOT application services and are managed separately in docker-compose.yml.
# ─────────────────────────────────────────────────────────────────────────────

infrastructure_services:
  postgres:
    name: "PostgreSQL + PostGIS"
    name_ar: "قاعدة بيانات PostgreSQL مع PostGIS"
    description: "Primary relational database with geospatial extensions"
    image: "postgis/postgis:16-3.4"
    port: 5432
    category: database
    profile: default
    resources:
      cpu: "2"
      memory: "2G"

  pgbouncer:
    name: "PgBouncer"
    name_ar: "مجمع اتصالات PgBouncer"
    description: "Connection pooling for PostgreSQL (transaction mode, 250 max connections)"
    image: "edoburu/pgbouncer:v1.23.1-p3"
    port: 6432
    category: database
    profile: default
    depends_on: [postgres]

  redis:
    name: "Redis"
    name_ar: "ريديس"
    description: "In-memory cache for sessions, rate limiting, and pub/sub"
    image: "redis:7.4-alpine"
    port: 6379
    category: cache
    profile: default
    resources:
      cpu: "1"
      memory: "768M"

  nats:
    name: "NATS"
    name_ar: "ناتس"
    description: "Event bus with JetStream for event-driven architecture"
    image: "nats:2.10.24-alpine"
    ports: [4222, 8222, 6222]
    category: messaging
    profile: default
    resources:
      cpu: "1"
      memory: "512M"

  nats-prometheus-exporter:
    name: "NATS Prometheus Exporter"
    name_ar: "مصدر مقاييس NATS لـ Prometheus"
    description: "Metrics exporter for NATS JetStream monitoring"
    image: "natsio/prometheus-nats-exporter:0.14.0"
    port: 7777
    category: monitoring
    profile: default
    depends_on: [nats]

  vault:
    name: "HashiCorp Vault"
    name_ar: "خزنة هاشيكورب"
    description: "Secrets management (dev mode in development)"
    image: "hashicorp/vault:1.17"
    port: 8200
    category: security
    profile: default

  kong:
    name: "Kong API Gateway"
    name_ar: "بوابة API كونغ"
    description: "API gateway with authentication, rate limiting, and 105 routes"
    image: "kong:3.4"
    ports: [8000, 8001]
    category: gateway
    profile: default

  mqtt:
    name: "Mosquitto MQTT Broker"
    name_ar: "وسيط MQTT موسكيتو"
    description: "IoT message broker for sensor data ingestion"
    image: "eclipse-mosquitto:2"
    ports: [1883, 9001]
    category: messaging
    profile: default

  qdrant:
    name: "Qdrant Vector Database"
    name_ar: "قاعدة بيانات Qdrant الشعاعية"
    description: "Vector database for RAG and semantic search"
    image: "qdrant/qdrant:v1.7.4"
    ports: [6333, 6334]
    category: database
    profile: default
    resources:
      cpu: "1"
      memory: "1G"

  etcd:
    name: "etcd"
    name_ar: "إتسد"
    description: "Distributed key-value store for Milvus service discovery"
    image: "quay.io/coreos/etcd:v3.5.18"
    port: 2379
    category: database
    profile: default

  etcd-init:
    name: "etcd Auth Initializer"
    name_ar: "مهيئ مصادقة إتسد"
    description: "One-time service to enable etcd authentication"
    image: "sahool/etcd-init:v3.5.18"
    category: init
    profile: etcd-auth
    depends_on: [etcd]

  minio:
    name: "MinIO Object Storage"
    name_ar: "تخزين كائنات MinIO"
    description: "S3-compatible object storage with TLS and SSE encryption"
    image: "minio/minio:RELEASE.2024-05-28T17-19-04Z"
    ports: [9000, 9090]
    category: storage
    profile: default
    resources:
      cpu: "1"
      memory: "1G"

  milvus:
    name: "Milvus Vector Database"
    name_ar: "قاعدة بيانات Milvus الشعاعية"
    description: "Distributed vector database for large-scale AI embeddings"
    image: "milvusdb/milvus:v2.5.27"
    ports: [19530, 9091]
    category: database
    profile: default
    depends_on: [etcd, minio]
    resources:
      cpu: "2"
      memory: "4G"

  mlflow:
    name: "MLflow"
    name_ar: "إم إل فلو"
    description: "AI/ML model registry and experiment tracking"
    image: "ghcr.io/mlflow/mlflow:v2.15.1"
    port: 5000
    category: ml
    profile: default
    depends_on: [postgres]

  ollama:
    name: "Ollama LLM Server"
    name_ar: "خادم نماذج أولاما"
    description: "Local LLM hosting (requires NVIDIA GPU, 16GB+ VRAM)"
    image: "ollama/ollama:0.5.4"
    port: 11434
    category: ai
    profile: gpu

  ollama-model-loader:
    name: "Ollama Model Loader"
    name_ar: "محمل نماذج أولاما"
    description: "Downloads and caches LLM models for Ollama"
    category: ai
    profile: gpu
    depends_on: [ollama]

# ─────────────────────────────────────────────────────────────────────────────
# Shared Packages
# ─────────────────────────────────────────────────────────────────────────────

packages:
  sahool-eo:
    name: "SAHOOL EO"
    name_ar: "حزمة الاستشعار عن بعد"
    description: "eo-learn integration for Earth Observation"
    path: "packages/sahool-eo"
    version: "1.0.0"
    type: python
    dependencies:
      required:
        - numpy>=1.21.0
        - scipy>=1.7.0
        - pyyaml>=6.0
      optional:
        - eo-learn>=1.4.0
        - sentinelhub>=3.9.0
        - s2cloudless>=1.7.0
    features:
      - "Sentinel-2 data fetching"
      - "Cloud masking (SCL + s2cloudless)"
      - "Vegetation indices (NDVI, EVI, LAI, NDWI, SAVI)"
      - "Field monitoring workflows"
      - "Yield prediction workflows"
      - "Time series analysis"
    external_credentials:
      - name: "Sentinel Hub"
        env_vars: ["SENTINEL_HUB_CLIENT_ID", "SENTINEL_HUB_CLIENT_SECRET"]
        url: "https://www.sentinel-hub.com/"
        required: false

  shared-events:
    name: "Shared Events"
    name_ar: "الأحداث المشتركة"
    description: "Event schemas for event-driven architecture"
    path: "packages/shared/events"
    version: "1.0.0"
    type: json-schema

# ─────────────────────────────────────────────────────────────────────────────
# Deployment Environments
# ─────────────────────────────────────────────────────────────────────────────

environments:
  development:
    replicas: 1
    resources_multiplier: 0.5
    debug: true

  staging:
    replicas: 1
    resources_multiplier: 0.75
    debug: false

  production:
    replicas: 2
    resources_multiplier: 1.0
    debug: false
    autoscaling:
      enabled: true
      min_replicas: 2
      max_replicas: 10
      target_cpu: 70

# ─────────────────────────────────────────────────────────────────────────────
# Governance Rules
# ─────────────────────────────────────────────────────────────────────────────

governance:
  rules:
    - id: GOV-001
      rule: "New services MUST be in apps/services/"
      enforce: true

    - id: GOV-002
      rule: "No services in kernel/, kernel-services-v15.3/, or root"
      enforce: true

    - id: GOV-003
      rule: "All services MUST have /health endpoint"
      enforce: true

    - id: GOV-004
      rule: "All services MUST have Dockerfile"
      enforce: true

    - id: GOV-005
      rule: "Frontend apps MUST be in apps/{web,admin,mobile}"
      enforce: true

    # ═══════════════════════════════════════════════════════════════════════════
    # AUDIT & COMPLIANCE GOVERNANCE RULES
    # ═══════════════════════════════════════════════════════════════════════════
    - id: GOV-006
      rule: "All services MUST implement audit logging for security-relevant operations"
      description: |
        Services must log authentication, authorization, data changes, and administrative
        actions using the shared audit module (shared/security/audit.py or packages/shared-audit).
      enforce: true
      category: audit

    - id: GOV-007
      rule: "All CRITICAL operations MUST be logged to the audit trail"
      description: |
        Operations classified as CRITICAL (login/logout, permission changes, data deletion,
        financial transactions, security config changes) must be logged with full context.
      enforce: true
      category: audit

    - id: GOV-008
      rule: "Audit logs MUST support hash chain integrity verification"
      description: |
        New audit entries must include prev_hash and entry_hash fields to enable
        tamper detection and compliance verification.
      enforce: true
      category: audit

    - id: GOV-009
      rule: "Audit logs MUST be retained for minimum 90 days"
      description: |
        Audit log retention must comply with regulatory requirements:
        - GDPR: 90+ days
        - SOC 2: 1 year
        - ISO 27001: 1 year
        Archival strategy must be documented.
      enforce: true
      category: compliance

    - id: GOV-010
      rule: "Compliance reports MUST be generated monthly"
      description: |
        Automated compliance reports must be generated monthly for each tenant,
        including hash chain validation status and audit statistics.
      enforce: false
      category: compliance
