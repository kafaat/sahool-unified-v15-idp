apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "audit-retention-worker.fullname" . }}
  labels:
    {{- include "audit-retention-worker.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  {{- with .Values.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        {{- include "audit-retention-worker.labels" . | nindent 8 }}
    spec:
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      backoffLimit: {{ .Values.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "audit-retention-worker.selectorLabels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ include "audit-retention-worker.serviceAccountName" . }}
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: worker
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              {{- if .Values.retention.dryRun }}
              args: ["--dry-run"]
              {{- end }}
              env:
                - name: AUDIT_RETENTION_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.databaseUrlSecretName }}
                      key: {{ .Values.secrets.databaseUrlSecretKey }}
                - name: AUDIT_RETENTION_DEFAULT_DAYS
                  value: {{ .Values.retention.defaultDays | quote }}
                {{- range $category, $days := .Values.retention.perCategoryDays }}
                - name: AUDIT_RETENTION_{{ $category | upper }}_DAYS
                  value: {{ $days | quote }}
                {{- end }}
                - name: LOG_LEVEL
                  value: "INFO"
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
