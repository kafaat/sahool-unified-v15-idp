{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "billing-core.fullname" . }}
  labels:
    {{- include "billing-core.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "billing-core.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound traffic on service port
    - ports:
        - port: 8089
          protocol: TCP
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL (via PgBouncer)
    - ports:
        - port: 5432
          protocol: TCP
        - port: 6432
          protocol: TCP
    # NATS
    - ports:
        - port: 4222
          protocol: TCP
    # Redis
    - ports:
        - port: 6379
          protocol: TCP
{{- end }}
