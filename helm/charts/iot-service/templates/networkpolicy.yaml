{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iot-service.fullname" . }}
  labels:
    {{- include "iot-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iot-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound traffic from sahool platform pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sahool
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL (via PgBouncer)
    - ports:
        - port: 5432
          protocol: TCP
        - port: 6432
          protocol: TCP
    # NATS
    - ports:
        - port: 4222
          protocol: TCP
    # Redis
    - ports:
        - port: 6379
          protocol: TCP
{{- end }}
