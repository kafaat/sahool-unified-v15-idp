apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "irrigation-smart.fullname" . }}-config
  labels:
    {{- include "irrigation-smart.labels" . | nindent 4 }}
data:
  SERVICE_NAME: "irrigation-smart"
  SERVICE_VERSION: {{ .Chart.AppVersion | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | default "INFO" | quote }}
  LOG_FORMAT: "json"

  # Infrastructure
  {{- if .Values.nats.url }}
  NATS_URL: {{ .Values.nats.url | quote }}
  {{- else }}
  NATS_URL: "nats://nats:4222"
  {{- end }}

  {{- if .Values.redis.url }}
  REDIS_URL: {{ .Values.redis.url | quote }}
  {{- else }}
  REDIS_URL: "redis://redis:6379"
  {{- end }}

  # Feature Flags
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "false"
  METRICS_PORT: "8094"
