{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "weather-service.serviceAccountName" . }}
  labels:
    {{- include "weather-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# SECURITY: Disable K8s API token auto-mount (least privilege)
automountServiceAccountToken: false
{{- end }}
