# SAHOOL Infrastructure Values
# ═══════════════════════════════════════════════════════════════════════════════

environment: staging

# External Secrets Operator Configuration
# When enabled, secrets are managed by External Secrets Operator
# When disabled, placeholder secrets are created (for development only)
externalSecrets:
  enabled: false

# Namespace configuration
namespace:
  create: true
  name: sahool-staging

# PostgreSQL Configuration
postgresql:
  enabled: true
  image:
    repository: postgis/postgis
    tag: "16-3.4"
  auth:
    username: sahool
    database: sahool
    existingSecret: sahool-postgresql-secret  # checkov:skip=CKV_SECRET_6:Reference to K8s Secret name, not a hardcoded secret
    secretKeys:
      adminPasswordKey: postgres-password  # checkov:skip=CKV_SECRET_6:Key name within K8s Secret, not a password value
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi

# Redis Configuration
redis:
  enabled: true
  image:
    repository: redis
    tag: "7.4-alpine"
  auth:
    enabled: true
    existingSecret: sahool-redis-secret  # checkov:skip=CKV_SECRET_6:Reference to K8s Secret name, not a hardcoded secret
    existingSecretPasswordKey: redis-password  # checkov:skip=CKV_SECRET_6:Key name within K8s Secret, not a password value
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi

# NATS Configuration
nats:
  enabled: true
  image:
    repository: nats
    tag: "2.10.24-alpine"
  jetstream:
    enabled: true
    memStorage:
      enabled: true
      size: 2Gi
    fileStorage:
      enabled: true
      size: 10Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 512Mi

# Qdrant Vector Database Configuration
qdrant:
  enabled: false
  image:
    repository: qdrant/qdrant
    tag: "v1.10.1"
  apiKeyRequired: true
  persistence:
    enabled: true
    size: 10Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

# Rocket.Chat Community Platform
rocketchat:
  enabled: false
  image:
    repository: registry.rocket.chat/rocketchat/rocket.chat
    tag: "7.5"
  admin:
    username: rc_admin
    email: admin@sahool.io
    existingSecret: sahool-rocketchat-secret  # checkov:skip=CKV_SECRET_6:Reference to K8s Secret name, not a hardcoded secret
    secretKeys:
      passwordKey: admin-password  # checkov:skip=CKV_SECRET_6:Key name within K8s Secret, not a password value
  settings:
    language: ar
    siteName: "SAHOOL Community | مجتمع سهول"
    registrationForm: Disabled
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  mongodb:
    image:
      repository: mongo
      tag: "6.0"
    auth:
      existingSecret: sahool-mongodb-secret  # checkov:skip=CKV_SECRET_6:Reference to K8s Secret name, not a hardcoded secret
      secretKeys:
        rootPasswordKey: root-password  # checkov:skip=CKV_SECRET_6:Key name within K8s Secret, not a password value
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 1500m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 512Mi
