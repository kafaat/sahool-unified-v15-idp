{{- /*
WARNING: If security.jwt.secretKey is not set, randAlphaNum generates a NEW
random secret on every helm upgrade, invalidating all existing JWT tokens.
In production, ALWAYS set security.jwt.secretKey via --set or values file,
or use External Secrets Operator (see values.yaml externalSecrets list).
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sahool.fullname" . }}-secrets
  labels:
    {{- include "sahool.labels" . | nindent 4 }}
  {{- if .Values.security.jwt.keepOnUninstall | default true }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  jwt-secret-key: {{ required "security.jwt.secretKey must be set — random generation invalidates tokens on upgrade" .Values.security.jwt.secretKey | b64enc | quote }}
