{{- if .Values.vpa.enabled }}
{{/*
Vertical Pod Autoscaler (VPA) Resources for SAHOOL Platform
Automatically adjusts CPU and memory requests/limits based on actual usage
This template dynamically creates VPAs for all enabled services with VPA configuration
*/}}

{{- range $serviceName, $service := .Values.services }}
{{- if and $service.enabled (default false $service.vpa.enabled) }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "sahool.fullname" $ }}-{{ $service.name }}-vpa
  labels:
    {{- include "sahool.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
    sahool.io/autoscaler: vpa
    sahool.io/package: {{ $service.package }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "sahool.fullname" $ }}-{{ $service.name }}
  updatePolicy:
    updateMode: {{ $service.vpa.updateMode | default $.Values.vpa.updateMode | default "Initial" }}
  resourcePolicy:
    containerPolicies:
      - containerName: {{ $service.name }}
        minAllowed:
          cpu: {{ $service.resources.requests.cpu }}
          memory: {{ $service.resources.requests.memory }}
        maxAllowed:
          cpu: {{ $service.resources.limits.cpu }}
          memory: {{ $service.resources.limits.memory }}
        controlledResources:
          - cpu
          - memory
        controlledValues: {{ $service.vpa.controlledValues | default $.Values.vpa.controlledValues | default "RequestsAndLimits" }}
{{- end }}
{{- end }}
{{- end }}
