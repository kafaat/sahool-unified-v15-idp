# ===============================================================================
# SAHOOL Helm Chart - Production Environment Values
# v16.0.0
# ===============================================================================

global:
  imageRegistry: "ghcr.io/sahool"
  imagePullSecrets:
    - name: ghcr-registry-secret
  storageClass: "ssd-retain"  # Use SSD storage class for production
  environment: "production"

# Deploy Enterprise tier for production
packageTier: "enterprise"

# -------------------------------------------------------------------------------
# Infrastructure - Production Configuration (High Availability)
# -------------------------------------------------------------------------------

infrastructure:
  postgresql:
    enabled: true
    auth:
      username: sahool_prod
      database: sahool_prod
      existingSecret: "sahool-postgresql-secret-prod"  # checkov:skip=CKV_SECRET_6:Reference to K8s Secret name, not a hardcoded secret
    primary:
      persistence:
        enabled: true
        size: 100Gi
        storageClass: "ssd-retain"
      resources:
        limits:
          cpu: 4000m
          memory: 8Gi
        requests:
          cpu: 1000m
          memory: 4Gi
    readReplicas:
      replicaCount: 2  # Read replicas for production
      persistence:
        enabled: true
        size: 100Gi
      resources:
        limits:
          cpu: 2000m
          memory: 4Gi
        requests:
          cpu: 500m
          memory: 2Gi

  redis:
    enabled: true
    auth:
      existingSecret: "sahool-redis-secret-prod"  # checkov:skip=CKV_SECRET_6:Reference to K8s Secret name, not a hardcoded secret
    master:
      persistence:
        enabled: true
        size: 10Gi
        storageClass: "ssd-retain"
      resources:
        limits:
          cpu: 1000m
          memory: 2Gi
        requests:
          cpu: 250m
          memory: 1Gi
    replica:
      replicaCount: 2
      persistence:
        enabled: true
        size: 10Gi
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 512Mi

  nats:
    enabled: true
    cluster:
      enabled: true
      replicas: 3  # Clustered NATS for HA
    jetstream:
      enabled: true
      memStorage:
        enabled: true
        size: 4Gi
      fileStorage:
        enabled: true
        size: 50Gi
        storageClass: "ssd-retain"
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi

  kong:
    enabled: true
    replicaCount: 3  # Multiple Kong instances for HA
    database: postgres
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi

  qdrant:
    enabled: true  # Enable for Enterprise AI features
    apiKeyRequired: true
    replicaCount: 2
    persistence:
      enabled: true
      size: 50Gi
      storageClass: "ssd-retain"
    resources:
      limits:
        cpu: 4000m
        memory: 8Gi
      requests:
        cpu: 1000m
        memory: 4Gi

# -------------------------------------------------------------------------------
# Services - All Tiers Enabled for Enterprise
# -------------------------------------------------------------------------------

services:
  # STARTER PACKAGE
  fieldCore:
    enabled: true
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10

  weatherCore:
