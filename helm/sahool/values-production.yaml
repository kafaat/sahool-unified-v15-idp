    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4

  agroAdvisor:
    enabled: true
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 8

  notificationService:
    enabled: true
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10

  # PROFESSIONAL PACKAGE
  satelliteService:
    enabled: true
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 8

  ndviEngine:
    enabled: true
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 8

  cropHealthAi:
    enabled: true
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 6

  irrigationSmart:
    enabled: true
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4

  virtualSensors:
    enabled: true
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4

  yieldEngine:
    enabled: true
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4

  fertilizerAdvisor:
    enabled: true
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4

  inventoryService:
    enabled: true
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 8

  # ENTERPRISE PACKAGE
  aiAdvisor:
    enabled: true
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 8

  iotGateway:
    enabled: true
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 12

  researchCore:
    enabled: true
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4

  marketplaceService:
    enabled: true
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10

  billingCore:
    enabled: true
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 6
    pdb:
      enabled: true
      minAvailable: 2  # Critical service - ensure high availability

  disasterAssessment:
    enabled: true
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4

  cropGrowthModel:
    enabled: true
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4

  laiEstimation:
    enabled: true
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4

  # VISION & TERRAIN SERVICES (Enterprise)
  yolo26VisionService:
    enabled: true
    replicaCount: 2
    autoscaling:
