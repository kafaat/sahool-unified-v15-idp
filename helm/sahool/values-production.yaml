# -------------------------------------------------------------------------------
# Ingress - Production Domain with Enhanced Security
# -------------------------------------------------------------------------------

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://sahool.ag,https://www.sahool.ag"
  hosts:
    - host: api.sahool.ag
      paths:
        # Starter Package Routes
        - path: /api/v1/fields
          pathType: Prefix
          service: field-core
          port: 3000
        - path: /api/v1/weather
          pathType: Prefix
          service: weather-core
          port: 8108
        - path: /api/v1/calendar
          pathType: Prefix
          service: astronomical-calendar
          port: 8111
        - path: /api/v1/advisory
          pathType: Prefix
          service: agro-advisor
          port: 8105
        - path: /api/v1/notifications
          pathType: Prefix
          service: notification-service
          port: 8110
        # Professional Package Routes
        - path: /api/v1/satellite
          pathType: Prefix
          service: satellite-service
          port: 8090
        - path: /api/v1/ndvi
          pathType: Prefix
          service: ndvi-engine
          port: 8107
        - path: /api/v1/crop-health
          pathType: Prefix
          service: crop-health-ai
          port: 8095
        - path: /api/v1/inventory
          pathType: Prefix
          service: inventory-service
          port: 8116
        # Enterprise Package Routes
        - path: /api/v1/ai-advisor
          pathType: Prefix
          service: ai-advisor
          port: 8112
        - path: /api/v1/iot
          pathType: Prefix
          service: iot-gateway
          port: 8106
        - path: /api/v1/marketplace
          pathType: Prefix
          service: marketplace-service
          port: 3010
        - path: /api/v1/billing
          pathType: Prefix
          service: billing-core
          port: 8089
        - path: /api/v1/research
          pathType: Prefix
          service: research-core
          port: 3015
        # Vision & Terrain Services Routes
        - path: /api/v1/vision
          pathType: Prefix
          service: yolo26-vision-service
          port: 8150
        - path: /api/v1/terrain
          pathType: Prefix
          service: terrain-core-service
          port: 8185
        - path: /api/v1/hydrology
          pathType: Prefix
          service: hydrology-service
          port: 8165
        - path: /api/v1/leveling
          pathType: Prefix
          service: leveling-optimizer-service
          port: 8170
        - path: /api/v1/edge
          pathType: Prefix
          service: edge-orchestrator-service
          port: 8190
  tls:
    - secretName: sahool-tls-prod
      hosts:
        - api.sahool.ag

# -------------------------------------------------------------------------------
# Network Policy - Strict in Production
# -------------------------------------------------------------------------------

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

# -------------------------------------------------------------------------------
# Monitoring - Enabled in Production
# -------------------------------------------------------------------------------

monitoring:
  enabled: true
  prometheus:
    enabled: true
    scrapeInterval: 15s
    retention: 30d
    persistence:
      enabled: true
      size: 100Gi
      storageClass: "ssd-retain"
    resources:
      limits:
        cpu: 4000m
        memory: 8Gi
      requests:
        cpu: 1000m
        memory: 4Gi
  grafana:
    enabled: true
    # CKV_SECRET_6: adminPassword must be provided via existing secret, not inline
    existingSecret: "sahool-grafana-admin-secret"  # checkov:skip=CKV_SECRET_6:Reference to K8s Secret name, not a hardcoded secret
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "ssd-retain"
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi

# -------------------------------------------------------------------------------
# ConfigMap - Production Environment Variables
# -------------------------------------------------------------------------------

configMap:
  commonEnv:
    LOG_LEVEL: "info"
    NODE_ENV: "production"
    TZ: "Asia/Riyadh"
    ENVIRONMENT: "production"

# -------------------------------------------------------------------------------
# Features - Production Configuration
# -------------------------------------------------------------------------------

features:
  enableSecurity: true
  enableAuditLogging: true
  enableRateLimiting: true
  enableMetrics: true
  enableTracing: true
  enableCaching: true

# -------------------------------------------------------------------------------
# Backup - Enabled in Production
# -------------------------------------------------------------------------------

backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: 90  # Keep backups for 90 days
  storageClass: "ssd-retain"
  size: 200Gi
