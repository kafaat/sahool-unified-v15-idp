# ===============================================================================
# SAHOOL Helm Chart - Staging Environment Values
# v16.0.0
# ===============================================================================

global:
  imageRegistry: "ghcr.io/sahool"
  imagePullSecrets:
    - name: ghcr-registry-secret
  storageClass: "standard"
  environment: "staging"

# Deploy Professional tier for staging
packageTier: "professional"

# -------------------------------------------------------------------------------
# Replica counts for staging (lower than production)
# -------------------------------------------------------------------------------

replicaCount: 1

# -------------------------------------------------------------------------------
# Infrastructure - Staging Configuration
# -------------------------------------------------------------------------------

infrastructure:
  postgresql:
    enabled: true
    auth:
      username: sahool_staging
      database: sahool_staging
      existingSecret: "sahool-postgresql-secret-staging"  # checkov:skip=CKV_SECRET_6:Reference to K8s Secret name, not a hardcoded secret
    primary:
      persistence:
        enabled: true
        size: 10Gi
      resources:
        limits:
          cpu: 1000m
          memory: 2Gi
        requests:
          cpu: 250m
          memory: 512Mi

  redis:
    enabled: true
    auth:
      existingSecret: "sahool-redis-secret-staging"  # checkov:skip=CKV_SECRET_6:Reference to K8s Secret name, not a hardcoded secret
    master:
      persistence:
        enabled: true
        size: 2Gi
      resources:
        limits:
          cpu: 250m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 128Mi

  nats:
    enabled: true
    jetstream:
      memStorage:
        size: 512Mi
      fileStorage:
        size: 5Gi
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi

  kong:
    enabled: true
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi

  qdrant:
    enabled: false

# -------------------------------------------------------------------------------
# Services - Enable Professional Package
# -------------------------------------------------------------------------------

services:
  # Starter Services
  fieldCore:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false

  weatherCore:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false

  astronomicalCalendar:
    enabled: true
    replicaCount: 1

  agroAdvisor:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false

  notificationService:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false

  # Professional Services - Enabled
  satelliteService:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false

  ndviEngine:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false

  cropHealthAi:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false

  irrigationSmart:
    enabled: true
    replicaCount: 1

  virtualSensors:
    enabled: true
    replicaCount: 1

  yieldEngine:
    enabled: true
    replicaCount: 1

  fertilizerAdvisor:
    enabled: true
    replicaCount: 1

  inventoryService:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false

  # Enterprise Services - Disabled in Staging
  aiAdvisor:
    enabled: false

  iotGateway:
    enabled: false

  researchCore:
    enabled: false

  marketplaceService:
    enabled: false

  billingCore:
    enabled: false

  disasterAssessment:
    enabled: false

  cropGrowthModel:
    enabled: false

  laiEstimation:
    enabled: false

  # Vision & Terrain Services - Disabled in Staging (Enterprise)
  yolo26VisionService:
    enabled: false

  terrainCoreService:
    enabled: false

  hydrologyService:
    enabled: false

  levelingOptimizerService:
    enabled: false

  edgeOrchestratorService:
    enabled: false

# -------------------------------------------------------------------------------
# Ingress - Staging Domain
# -------------------------------------------------------------------------------

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rate-limit: "50"
  hosts:
    - host: staging-api.sahool.ag
      paths:
        - path: /api/v1/fields
          pathType: Prefix
          service: field-core
          port: 3000
        - path: /api/v1/weather
          pathType: Prefix
          service: weather-core
          port: 8108
        - path: /api/v1/calendar
          pathType: Prefix
          service: astronomical-calendar
          port: 8111
        - path: /api/v1/advisory
          pathType: Prefix
          service: agro-advisor
          port: 8105
        - path: /api/v1/notifications
          pathType: Prefix
          service: notification-service
          port: 8110
        - path: /api/v1/satellite
          pathType: Prefix
          service: satellite-service
          port: 8090
        - path: /api/v1/ndvi
          pathType: Prefix
          service: ndvi-engine
          port: 8107
        - path: /api/v1/crop-health
          pathType: Prefix
          service: crop-health-ai
          port: 8095
        - path: /api/v1/inventory
          pathType: Prefix
          service: inventory-service
          port: 8116
  tls:
    - secretName: sahool-tls-staging
      hosts:
        - staging-api.sahool.ag

# -------------------------------------------------------------------------------
# Monitoring - Disabled in Staging
# -------------------------------------------------------------------------------

monitoring:
  enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false

# -------------------------------------------------------------------------------
# ConfigMap - Staging Environment Variables
# -------------------------------------------------------------------------------

configMap:
  commonEnv:
    LOG_LEVEL: "debug"
    NODE_ENV: "staging"
    TZ: "Asia/Riyadh"
    ENVIRONMENT: "staging"

# -------------------------------------------------------------------------------
# Features - More permissive for staging
# -------------------------------------------------------------------------------

features:
  enableSecurity: true
  enableAuditLogging: true
  enableRateLimiting: true
  enableMetrics: true
  enableTracing: true
  enableCaching: true

# -------------------------------------------------------------------------------
# Backup - Disabled in Staging
# -------------------------------------------------------------------------------

backup:
  enabled: false
