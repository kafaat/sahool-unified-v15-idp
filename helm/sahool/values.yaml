    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: api.sahool.ag
      paths:
        # Starter Package Routes
        - path: /api/v1/fields
          pathType: Prefix
          service: field-core
          port: 3000
        - path: /api/v1/weather
          pathType: Prefix
          service: weather-core
          port: 8108
        - path: /api/v1/calendar
          pathType: Prefix
          service: astronomical-calendar
          port: 8111
        - path: /api/v1/advisory
          pathType: Prefix
          service: agro-advisor
          port: 8105
        - path: /api/v1/notifications
          pathType: Prefix
          service: notification-service
          port: 8110
        # Professional Package Routes
        - path: /api/v1/satellite
          pathType: Prefix
          service: satellite-service
          port: 8090
        - path: /api/v1/ndvi
          pathType: Prefix
          service: ndvi-engine
          port: 8107
        - path: /api/v1/crop-health
          pathType: Prefix
          service: crop-health-ai
          port: 8095
        - path: /api/v1/inventory
          pathType: Prefix
          service: inventory-service
          port: 8116
        # Enterprise Package Routes
        - path: /api/v1/ai-advisor
          pathType: Prefix
          service: ai-advisor
          port: 8112
        - path: /api/v1/iot
          pathType: Prefix
          service: iot-gateway
          port: 8106
        - path: /api/v1/marketplace
          pathType: Prefix
          service: marketplace-service
          port: 3010
        - path: /api/v1/billing
          pathType: Prefix
          service: billing-core
          port: 8089
        # Vision & Terrain Services Routes (Enterprise)
        - path: /api/v1/vision
          pathType: Prefix
          service: yolo26-vision-service
          port: 8150
        - path: /api/v1/terrain
          pathType: Prefix
          service: terrain-core-service
          port: 8185
        - path: /api/v1/hydrology
          pathType: Prefix
          service: hydrology-service
          port: 8165
        - path: /api/v1/leveling
          pathType: Prefix
          service: leveling-optimizer-service
          port: 8170
        - path: /api/v1/edge
          pathType: Prefix
          service: edge-orchestrator-service
          port: 8190
  tls:
    - secretName: sahool-tls-prod
      hosts:
        - api.sahool.ag

# ─────────────────────────────────────────────────────────────────────────────
# Network Policies
# ─────────────────────────────────────────────────────────────────────────────

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: sahool
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sahool
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # SECURITY: Restrict egress to sahool namespace only (prevent lateral movement)
    # الأمان: تقييد الخروج على نطاق sahool فقط (منع التنقل الجانبي)
    - to:
        - namespaceSelector:
            matchLabels:
              name: sahool
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 4222  # NATS
    # DNS resolution (kube-system namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 53    # DNS TCP
        - protocol: UDP
          port: 53    # DNS UDP

# ─────────────────────────────────────────────────────────────────────────────
# Security Configuration
# ─────────────────────────────────────────────────────────────────────────────

security:
  jwt:
    algorithm: HS256
    issuer: sahool-platform
    audience: sahool-api
    accessExpireMinutes: 30
    refreshExpireDays: 7
    existingSecret: "sahool-jwt-secret"

  rbac:
    enabled: true
    rules:
      - apiGroups: [""]
        resources: ["pods", "services", "configmaps"]
        verbs: ["get", "list", "watch"]

  podSecurityPolicy:
    enabled: false

  mtls:
    enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# Monitoring & Observability
# ─────────────────────────────────────────────────────────────────────────────

monitoring:
  enabled: false
  prometheus:
    enabled: false
    scrapeInterval: 30s
    retention: 15d
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi
  grafana:
    enabled: false
    adminPassword: ""  # Set via secret
    persistence:
      enabled: true
      size: 5Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

# ─────────────────────────────────────────────────────────────────────────────
# Vertical Pod Autoscaler (VPA)
# ─────────────────────────────────────────────────────────────────────────────

vpa:
  enabled: true
  # Update mode: "Off", "Initial", "Recreate", or "Auto"
  # - Off: Only provides recommendations, doesn't update pods
  # - Initial: Only applies recommendations when pods are created
  # - Recreate: Updates running pods by evicting and recreating them
  # - Auto: Same as Recreate, automatically updates running pods
  # SECURITY: Default is "Initial" for safety. Stateful services use "Off"
  updateMode: "Initial"
  # controlledValues: "RequestsAndLimits" or "RequestsOnly"
  # Determines whether VPA updates both requests and limits or only requests
  controlledValues: "RequestsAndLimits"

# ─────────────────────────────────────────────────────────────────────────────
# Configuration Management
# ─────────────────────────────────────────────────────────────────────────────

configMap:
  # Common environment variables for all services
  commonEnv:
    LOG_LEVEL: "info"
    NODE_ENV: "production"
    TZ: "Asia/Riyadh"

# ─────────────────────────────────────────────────────────────────────────────
# Secrets Configuration
# ─────────────────────────────────────────────────────────────────────────────

secrets:
  # External secrets to be created manually or via External Secrets Operator
  externalSecrets:
    - sahool-postgresql-secret
    - sahool-redis-secret
    - sahool-jwt-secret
    - sahool-tls-prod
    - sahool-api-keys

# ─────────────────────────────────────────────────────────────────────────────
# Feature Flags
# ─────────────────────────────────────────────────────────────────────────────

features:
  enableSecurity: true
  enableAuditLogging: true
  enableRateLimiting: true
  enableMetrics: true
  enableTracing: false
  enableCaching: true

# ─────────────────────────────────────────────────────────────────────────────
# Backup & Disaster Recovery
# ─────────────────────────────────────────────────────────────────────────────

backup:
  enabled: false
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: 30  # days
  storageClass: "standard"
  size: 50Gi
