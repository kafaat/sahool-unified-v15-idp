# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Helm Chart Values - منصة سهول الزراعية
# v16.0.0
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# Global Settings
# ─────────────────────────────────────────────────────────────────────────────

global:
  imageRegistry: "ghcr.io/sahool"
  imagePullSecrets: []
  storageClass: "standard"
  environment: "development"  # development, staging, production

# Deployment Package Tier (controls which services are enabled)
# Options: starter, professional, enterprise
packageTier: "starter"

# ─────────────────────────────────────────────────────────────────────────────
# Common Configuration
# ─────────────────────────────────────────────────────────────────────────────

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

# Default replica count for services
replicaCount: 1

image:
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}
  name: "sahool-sa"
  # SECURITY: Disable auto-mounting K8s API token - services don't need cluster API access
  automountServiceAccountToken: false

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Default resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# ─────────────────────────────────────────────────────────────────────────────
# Infrastructure Dependencies
# ─────────────────────────────────────────────────────────────────────────────

infrastructure:
  postgresql:
    enabled: true
    image:
      repository: postgis/postgis
      tag: "16-3.4"
    auth:
      username: sahool
      database: sahool
      existingSecret: "sahool-postgresql-secret"
    primary:
      persistence:
        enabled: true
        size: 20Gi
        storageClass: ""
      resources:
        limits:
          cpu: 2000m
          memory: 4Gi
        requests:
          cpu: 500m
          memory: 1Gi
    # VPA Configuration for PostgreSQL (Stateful Database)
    # CRITICAL: "Off" mode - VPA only provides recommendations, never auto-updates
    # Prevents disruption to database connections and ensures data consistency
    vpa:
      enabled: true
      updateMode: "Off"  # Never auto-update database pods
      controlledValues: "RequestsOnly"  # Only update requests, preserve limits

  redis:
    enabled: true
    image:
      repository: redis
      tag: "7.4-alpine"
    auth:
      enabled: true
      existingSecret: "sahool-redis-secret"
    master:
      persistence:
        enabled: true
        size: 5Gi
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi
    # VPA Configuration for Redis (Stateful Cache/Data Store)
    # CRITICAL: "Off" mode - VPA only provides recommendations, never auto-updates
    # Prevents disruption to cache connections and session data
    vpa:
      enabled: true
      updateMode: "Off"  # Never auto-update Redis pods
      controlledValues: "RequestsOnly"  # Only update requests, preserve limits

  nats:
    enabled: true
    image:
      repository: nats
      tag: "2.10.24-alpine"
    jetstream:
      enabled: true
      memStorage:
        enabled: true
        size: 2Gi
      fileStorage:
        enabled: true
        size: 10Gi
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 200m
        memory: 512Mi
    # VPA Configuration for NATS (Stateful Message Broker with JetStream)
    # CRITICAL: "Off" mode - VPA only provides recommendations, never auto-updates
    # Prevents disruption to message streams and persistent message storage
    vpa:
      enabled: true
      updateMode: "Off"  # Never auto-update NATS pods
      controlledValues: "RequestsOnly"  # Only update requests, preserve limits

  kong:
    enabled: true
    image:
      repository: kong
      tag: "3.4"
    database: postgres
    admin:
      # SECURITY: Admin API disabled - access via kubectl exec or port-forward only
      enabled: false
      http:
        enabled: false
        servicePort: 8001
    proxy:
      enabled: true
      http:
        enabled: true
        servicePort: 8000
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 200m
        memory: 512Mi
    # VPA Configuration for Kong (API Gateway with PostgreSQL connection)
    # "Initial" mode - Only applies recommendations when pods are created
    # Safe for services with persistent database connections
    vpa:
      enabled: true
      updateMode: "Initial"  # Only update on pod creation
      controlledValues: "RequestsAndLimits"

  qdrant:
    enabled: false  # Only for Enterprise
    image:
      repository: qdrant/qdrant
      tag: "v1.10.1"
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
    # VPA Configuration for Qdrant (Stateful Vector Database)
    # CRITICAL: "Off" mode - VPA only provides recommendations, never auto-updates
    # Prevents disruption to vector database and AI embeddings
    vpa:
      enabled: true
      updateMode: "Off"  # Never auto-update Qdrant pods
      controlledValues: "RequestsOnly"  # Only update requests, preserve limits

