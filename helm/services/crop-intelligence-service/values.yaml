# SAHOOL Crop Intelligence Service - crop health, digital twin, fertilizer & soil
# Version: 16.0.0

replicaCount: 2

image:
  repository: ghcr.io/kafaat/sahool/crop-intelligence-service
  tag: "16.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 8095

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 1536Mi

environment: staging
deploymentSlot: blue

# Environment variables
env:
  LOG_LEVEL: "INFO"
  CALIBRATION_ENABLED: "true"
  ASSIMILATION_ENABLED: "true"

secrets:
  jwtSecret: ""

database:
  url: ""

nats:
  url: ""

redis:
  url: ""

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 1

# VPA Configuration
vpa:
  enabled: true
  updateMode: "Initial"
  controlledValues: "RequestsAndLimits"

# Health probes
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12  # ~70s max startup for calibration/assimilation init

nodeSelector: {}

tolerations: []

affinity: {}

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8095"
  prometheus.io/path: "/metrics"

# Security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Network Policy
networkPolicy:
  enabled: false
