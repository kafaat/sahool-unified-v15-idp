{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "terrain-core-service.fullname" . }}
  labels:
    {{- include "terrain-core-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "terrain-core-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from sahool platform pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sahool
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    # Allow traffic from Kong API gateway
    - from:
        - podSelector:
            matchLabels:
              app: kong
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL
    - to: []
      ports:
        - protocol: TCP
          port: 5432
    # Redis
    - to: []
      ports:
        - protocol: TCP
          port: 6379
    # NATS
    - to: []
      ports:
        - protocol: TCP
          port: 4222
{{- end }}
