# SAHOOL Terrain Core Service - DEM processing and terrain analysis
# Version: 16.0.0

replicaCount: 2

image:
  repository: ghcr.io/kafaat/sahool/terrain-core-service
  tag: "16.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 8185

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

environment: staging
deploymentSlot: blue

# Environment variables
env:
  LOG_LEVEL: "INFO"
  DEM_DATA_PATH: "/data/dem"
  TILE_CACHE_SIZE: "1000"
  MAX_RESOLUTION: "30"
  COORDINATE_SYSTEM: "EPSG:4326"

secrets:
  jwtSecret: ""

database:
  url: ""

nats:
  url: ""

redis:
  url: ""

# Persistent storage for DEM data
storage:
  demData:
    enabled: true
    size: 100Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  tileCache:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 1

# VPA Configuration
vpa:
  enabled: true
  updateMode: "Initial"
  controlledValues: "RequestsAndLimits"

# Health probes
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

nodeSelector: {}

tolerations: []

affinity: {}

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8185"
  prometheus.io/path: "/metrics"

# Security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Network Policy
networkPolicy:
  enabled: true
