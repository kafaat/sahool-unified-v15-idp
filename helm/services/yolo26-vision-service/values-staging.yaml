# SAHOOL YOLOv26 Vision Service - Staging Environment Values
# Version: 16.0.0

environment: staging
deploymentSlot: blue

replicaCount: 1

image:
  tag: "16.0.0-staging"

# Reduced GPU resources for staging
gpu:
  enabled: true
  count: 1

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
    nvidia.com/gpu: 1
  requests:
    cpu: 500m
    memory: 2Gi
    nvidia.com/gpu: 1

env:
  LOG_LEVEL: "DEBUG"
  MODEL_PATH: "/models/yolo26"
  INFERENCE_BATCH_SIZE: "2"
  CONFIDENCE_THRESHOLD: "0.4"
  NMS_THRESHOLD: "0.4"
  ENABLE_TENSORRT: "true"
  ENVIRONMENT: "staging"

# Smaller model storage for staging
modelStorage:
  enabled: true
  size: 10Gi
  storageClass: "standard"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 85

pdb:
  enabled: true
  minAvailable: 1

vpa:
  enabled: true
  updateMode: "Initial"
