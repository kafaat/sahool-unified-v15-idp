# SAHOOL YOLOv26 Vision Service - GPU-accelerated computer vision
# Version: 16.0.0

replicaCount: 2

image:
  repository: ghcr.io/kafaat/sahool/yolo26-vision-service
  tag: "16.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 8150

# GPU Configuration
gpu:
  enabled: true
  count: 1
  # NVIDIA GPU type (optional, for node selection)
  # type: "nvidia-tesla-t4"

resources:
  limits:
    cpu: 4000m
    memory: 8Gi
    nvidia.com/gpu: 1
  requests:
    cpu: 1000m
    memory: 4Gi
    nvidia.com/gpu: 1

# Non-GPU resources (when gpu.enabled is false)
resourcesNonGpu:
  limits:
    cpu: 4000m
    memory: 8Gi
  requests:
    cpu: 1000m
    memory: 4Gi

environment: staging
deploymentSlot: blue

# Environment variables
env:
  LOG_LEVEL: "INFO"
  MODEL_PATH: "/models/yolo26"
  INFERENCE_BATCH_SIZE: "4"
  CONFIDENCE_THRESHOLD: "0.5"
  NMS_THRESHOLD: "0.4"
  ENABLE_TENSORRT: "true"

secrets:
  jwtSecret: ""
  modelRegistryToken: ""

database:
  url: ""

nats:
  url: ""

redis:
  url: ""

# Model storage configuration
modelStorage:
  enabled: true
  size: 20Gi
  storageClass: ""
  accessMode: ReadWriteOnce

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Scale based on GPU utilization (requires DCGM exporter)
  targetGPUUtilizationPercentage: 75

# Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 1

# VPA Configuration
vpa:
  enabled: true
  updateMode: "Initial"
  controlledValues: "RequestsAndLimits"

# Health probes
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startup:
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 30

# Node selection for GPU nodes
nodeSelector:
  # accelerator: nvidia-gpu
  {}

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"

affinity: {}

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8150"
  prometheus.io/path: "/metrics"

# Security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Network Policy
networkPolicy:
  enabled: true
