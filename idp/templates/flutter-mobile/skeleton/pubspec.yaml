name: ${{ values.name }}
description: ${{ values.description }}

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^6.0.0

  # Local Database (Offline Support)
  {%- if values.has_offline_support %}
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.18
  {%- endif %}

  # Security
  flutter_secure_storage: ^9.0.0

  # Utils
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  intl: ^0.19.0
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.6.2
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  mockito: ^5.4.4
  {%- if values.has_offline_support %}
  drift_dev: ^2.24.0
  {%- endif %}

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/i18n/
