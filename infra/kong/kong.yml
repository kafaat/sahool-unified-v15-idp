      - leveling
      - optimization
    connect_timeout: 15000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: leveling-analyze-route
        paths:
          - /api/v1/leveling/analyze
        strip_path: false
        methods:
          - POST
      - name: leveling-plan-route
        paths:
          - /api/v1/leveling/plan
        strip_path: false
        methods:
          - GET
      - name: leveling-base-route
        paths:
          - /api/v1/leveling
        strip_path: true
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
      - name: acl
        config:
          allow:
            - professional-users
            - enterprise-users
      - name: rate-limiting
        config:
          minute: 30
          hour: 1500
          policy: redis
          redis_host: redis
          redis_port: 6379
          redis_password: ${REDIS_PASSWORD}
          redis_database: 1
          redis_timeout: 2000
          fault_tolerant: true
      - name: response-transformer
        config:
          add:
