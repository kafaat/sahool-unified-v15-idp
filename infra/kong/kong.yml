              - "X-Service: leveling-optimizer-service"

  # ============================================================================
  # Edge API - Edge Orchestrator Service
  # خدمة تنسيق الحافة - إدارة الأجهزة والمهام الطرفية
  # Rate limit: 60 req/min
  # ============================================================================
  - name: edge-orchestrator-service
    host: edge-orchestrator-upstream
    tags:
      - professional
      - edge
      - orchestration
    connect_timeout: 10000
    write_timeout: 30000
    read_timeout: 30000
    routes:
      - name: edge-devices-route
        paths:
          - /api/v1/edge/devices
        strip_path: false
        methods:
          - GET
      - name: edge-jobs-route
        paths:
          - /api/v1/edge/jobs
        strip_path: false
        methods:
          - POST
      - name: edge-base-route
        paths:
          - /api/v1/edge
        strip_path: true
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
      - name: acl
        config:
          allow:
            - professional-users
            - enterprise-users
      - name: rate-limiting
        config:
          minute: 60
          hour: 3000
          policy: redis
          redis_host: redis
          redis_port: 6379
          redis_password: ${REDIS_PASSWORD}
          redis_database: 1
          redis_timeout: 2000
          fault_tolerant: true
      - name: response-transformer
        config:
          add:
            headers:
              - "X-Service: edge-orchestrator-service"

  # ============================================================================
  # نقاط فحص الصحة - Health Check Endpoints
  # ============================================================================
  - name: health-check
    url: http://kong:8000
    routes:
      - name: health-route
        paths:
          - /health
          - /ping
        strip_path: false
        methods:
          - GET
    plugins:
      - name: request-termination
        config:
          status_code: 200
          message: "SAHOOL Platform is healthy"

  - name: root-endpoint
    url: http://kong:8000
    routes:
      - name: root-route
        paths:
          - /
        strip_path: false
        methods:
          - GET
    plugins:
      - name: request-termination
        config:
          status_code: 200
          content_type: "application/json"
          body: '{"platform":"SAHOOL","version":"16.0.0","description":"National Agricultural Intelligence Platform","status":"operational","endpoints":{"/health":"Health check","/ping":"Ping check","/api/v1":"API Gateway"},"documentation":"https://github.com/kafaat/sahool-unified-v15-idp"}'

# ============================================================================
# الإضافات العامة - Global Plugins
# ============================================================================

plugins:
  # CORS للسماح بالطلبات من المتصفحات
  # Origins are explicitly listed. Wildcard ('*') is NOT used because it
  # cannot be combined with credentials:true and exposes the API to any origin.
  - name: cors
    config:
      origins:
        - "https://app.sahool.com"
        - "https://admin.sahool.com"
        - "https://api.sahool.com"
        - "https://dashboard.sahool.com"
        - "https://mobile.sahool.com"
        # localhost origins are intentionally omitted from this file.
        # Use a separate development-only Kong config or override KONG_CORS_ORIGINS
        # in your local docker-compose to add localhost entries for local testing.
        # Adding localhost here with credentials:true would allow any page running
        # on a developer machine to make credentialed cross-origin requests to the API.
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Auth-Token
        - X-Correlation-Id
      exposed_headers:
        - X-Request-ID
        - X-Correlation-Id
        - X-RateLimit-Limit-Minute
        - X-RateLimit-Remaining-Minute
      # credentials:true is safe now because origins are explicit (no wildcard).
      credentials: true
      max_age: 3600

  # تحديد حجم الطلب لمنع هجمات الحمولة الكبيرة
  # Request size limiting to prevent large payload attacks
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
      require_content_length: false

  # تسجيل الطلبات
  - name: file-log
    config:
      path: /var/log/kong/access.log
      reopen: true

  # Prometheus للمراقبة
  - name: prometheus

  # Security Headers
  # NOTE: X-XSS-Protection is deprecated in modern browsers — Content-Security-Policy
  # is the correct mitigation for XSS.  HSTS preload flag is omitted until the domain
  # is submitted to the HSTS preload list (https://hstspreload.org).
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Content-Type-Options: nosniff"
          - "X-Frame-Options: DENY"
          - "Referrer-Policy: strict-origin-when-cross-origin"
          - "Permissions-Policy: geolocation=(), microphone=(), camera=()"
          - "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.sahool.app wss://api.sahool.app"
          - "Strict-Transport-Security: max-age=31536000; includeSubDomains"

  # معرف الطلب
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid#counter
      echo_downstream: true

# ============================================================================
# مستهلكو الخدمة - Service Consumers
# ============================================================================

consumers:
  # المستخدمون الأساسيون - Starter Users
  - username: starter-user-sample
    custom_id: starter-001
