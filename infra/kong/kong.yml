  # ============================================================================
  # Leveling API - Land Leveling Optimizer Service
  # خدمة تحسين تسوية الأراضي - تحليل وتخطيط التسوية
  # Rate limit: 30 req/min
  # ============================================================================
  - name: leveling-optimizer-service
    host: leveling-optimizer-upstream
