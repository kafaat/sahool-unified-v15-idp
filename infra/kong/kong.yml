# ============================================================================
# NOTE: This file should mirror /infra/kong/kong.yml
# The canonical configuration is in /infra/kong/kong.yml
# ============================================================================

_format_version: "3.0"
_transform: true

# ============================================================================
# تكوين Kong API Gateway لمنصة سهول الزراعية
# SAHOOL Platform Kong API Gateway Configuration
# ============================================================================
# يوفر هذا التكوين:
# - إدارة جميع الخدمات الـ 39 المصغرة
# - تحديد المعدل حسب باقة الاشتراك
# - مصادقة JWT
# - التحكم في الوصول ACL
# - فحوصات الصحة
# ============================================================================

# ============================================================================
# الخوادم النهائية - Upstreams
# ============================================================================

upstreams:
  - name: field-management-upstream
    algorithm: round-robin
    slots: 10000
    targets:
      - target: field-management-service:3000
        weight: 100
    healthchecks:
      active:
        type: http
        http_path: /healthz
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200, 201, 204]
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
          timeouts: 3
          http_statuses: [500, 502, 503, 504]
      passive:
        healthy:
          http_statuses: [200, 201, 204]
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          tcp_failures: 3

