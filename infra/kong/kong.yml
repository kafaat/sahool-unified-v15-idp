      passive:
        healthy:
          http_statuses: [200, 201, 204]
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          tcp_failures: 3

  # ============================================================================
  # Edge Orchestrator - Edge Computing Management
  # خدمة تنسيق الحافة
  # ============================================================================
  - name: edge-orchestrator-upstream
    algorithm: round-robin
    slots: 10000
    targets:
      - target: edge-orchestrator-service:8180
        weight: 100
    healthchecks:
      active:
        type: http
        http_path: /healthz
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200, 201, 204]
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
          timeouts: 3
          http_statuses: [500, 502, 503, 504]
      passive:
        healthy:
          http_statuses: [200, 201, 204]
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          tcp_failures: 3

