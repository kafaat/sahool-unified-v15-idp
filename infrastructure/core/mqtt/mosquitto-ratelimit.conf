# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL MQTT Rate Limiting Configuration
# إعدادات تحديد معدل MQTT
#
# Include this file in mosquitto.conf via: include_dir /mosquitto/config/conf.d/
# ═══════════════════════════════════════════════════════════════════════════════

# Maximum number of QoS 1 and 2 messages currently inflight per client
max_inflight_messages 20

# Maximum number of QoS 1 and 2 messages to hold in a per-client queue
max_queued_messages 1000

# Maximum publish packet size (1MB)
max_packet_size 1048576

# Per-listener connection rate limiting
# Maximum new connections per second (0 = unlimited)
# Prevents MQTT flood attacks
max_connections 1000

# Message expiry interval for queued messages (seconds)
# Messages older than this are discarded
# 3600 = 1 hour
message_expiry_interval 3600
