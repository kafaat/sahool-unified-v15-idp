# Mosquitto Configuration for SAHOOL IoT Gateway
# إعدادات Mosquitto لبوابة إنترنت الأشياء سهول

# ═══════════════════════════════════════════════════════════════════════════════
# SECURITY CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════

# SECURITY: Disable anonymous access
# In production, all clients MUST authenticate
allow_anonymous false

# Password file for authentication (created via: mosquitto_passwd -c /mosquitto/config/passwd sahool_iot)
# Mount this file in docker-compose or create at container startup
password_file /mosquitto/config/passwd

# ═══════════════════════════════════════════════════════════════════════════════
# LISTENER CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════

# MQTT listener (port 1883)
listener 1883
protocol mqtt

# WebSocket listener for web clients (port 9001)
listener 9001
protocol websockets

# ═══════════════════════════════════════════════════════════════════════════════
# TLS CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════

# SECURITY WARNING: TLS is currently DISABLED. All MQTT traffic is unencrypted.
# For production, generate TLS certificates and uncomment the listeners below.
# Generate certs: openssl req -new -x509 -days 365 -keyout server.key -out server.crt
# Mount certs in docker-compose.yml: ./certs:/mosquitto/certs:ro
#
# TLS MQTT listener (port 8883) - Uncomment for production with TLS certs mounted
# listener 8883
# protocol mqtt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# cafile /mosquitto/certs/ca.crt
# require_certificate false
# tls_version tlsv1.2

# TLS WebSocket listener (port 9443) - Uncomment for production with TLS certs mounted
# listener 9443
# protocol websockets
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# cafile /mosquitto/certs/ca.crt
# require_certificate false
# tls_version tlsv1.2

# ═══════════════════════════════════════════════════════════════════════════════
# $SYS TOPIC UPDATES
# ═══════════════════════════════════════════════════════════════════════════════

# Publish $SYS/broker/uptime every 3 seconds (default: 10).
# Aligned with the docker-compose healthcheck -W timeout so the
# subscriber always receives at least one message within the wait window.
sys_interval 3

# ═══════════════════════════════════════════════════════════════════════════════
# PERSISTENCE
# ═══════════════════════════════════════════════════════════════════════════════

persistence true
persistence_location /mosquitto/data/

# ═══════════════════════════════════════════════════════════════════════════════
# LOGGING
# ═══════════════════════════════════════════════════════════════════════════════

log_dest stdout
log_type error
log_type warning
log_type notice
# log_type information  # Disabled in production for performance

# ═══════════════════════════════════════════════════════════════════════════════
# CONNECTION & MESSAGE LIMITS
# ═══════════════════════════════════════════════════════════════════════════════

max_connections 1000
max_inflight_messages 20
max_packet_size 1048576
# message_size_limit deprecated - using max_packet_size instead

# ═══════════════════════════════════════════════════════════════════════════════
# ACL (Access Control List) - Fine-grained topic permissions
# ═══════════════════════════════════════════════════════════════════════════════

# Enable ACL-based topic permissions for security
acl_file /mosquitto/config/acl
