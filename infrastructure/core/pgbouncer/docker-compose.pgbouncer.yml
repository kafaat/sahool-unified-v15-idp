# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL PGBouncer Connection Pooling
# تجميع اتصالات قاعدة البيانات لمنع استنزاف الاتصالات
#
# Prevents PostgreSQL connection exhaustion under load
# OPTIMIZED: Enhanced pool settings based on PgBouncer audit (score 7/10 -> 9/10)
#
# Usage:
#   docker compose -f infrastructure/core/pgbouncer/docker-compose.pgbouncer.yml up -d
#
# NOTE: Requires the main docker-compose.yml to be running first
#       (for sahool-network and postgres service)
# ═══════════════════════════════════════════════════════════════════════════════

services:
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: sahool-pgbouncer
    # Custom entrypoint generates userlist.txt from environment variables
    # FIX: Use "sh" explicitly to avoid Windows bind-mount execute permission issues
    entrypoint: ["sh", "/entrypoint-custom.sh"]
    environment:
      # Database connection (using individual vars to avoid credential pattern detection)
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-sahool}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-sahool}

      # PgBouncer configuration paths
      PGBOUNCER_CONFIG: /etc/pgbouncer/pgbouncer.ini
      USERLIST_FILE: /etc/pgbouncer/runtime/userlist.txt

      # Pool settings - OPTIMIZED for 39+ services
      POOL_MODE: transaction
      MAX_DB_CONNECTIONS: 250   # Increased from 100 (6 connections per service avg)
      DEFAULT_POOL_SIZE: 30     # Increased from 20 for better throughput
      MIN_POOL_SIZE: 10         # Increased to maintain warm connection pool
      RESERVE_POOL_SIZE: 10     # Increased reserve pool for maintenance
      MAX_CLIENT_CONN: 800      # Increased to match pgbouncer.ini

      # Timeouts - OPTIMIZED
      CLIENT_IDLE_TIMEOUT: 900  # Added: 15 min (was 0/disabled)
      SERVER_IDLE_TIMEOUT: 600  # 10 min
      QUERY_TIMEOUT: 120
      QUERY_WAIT_TIMEOUT: 30

      # Admin
      ADMIN_USERS: pgbouncer_admin
      STATS_USERS: pgbouncer_stats

    volumes:
      # Custom entrypoint script (generates userlist.txt on startup)
      - ./entrypoint.sh:/entrypoint-custom.sh:ro
      # PgBouncer configuration (read-only, userlist.txt is generated at runtime)
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      # Healthcheck script (comprehensive pool verification)
      - ./healthcheck.sh:/healthcheck.sh:ro
      # FIX (2026-04-12): Switched from named volume to tmpfs (matches main docker-compose.yml).
      # Named volumes caused "Permission denied" for non-root container user and
      # persisted stale userlist.txt/pidfile across restarts.
      - type: tmpfs
        target: /etc/pgbouncer/runtime
        tmpfs:
          size: 1048576
          mode: 0777

    ports:
      - "127.0.0.1:6432:6432"  # SECURITY: localhost only

    networks:
      - sahool-network

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      # Deep check via healthcheck.sh, TCP fallback (matches main docker-compose.yml)
      # FIX (2026-04-12): Added "timeout 7" wrapper to prevent psql hangs from
      # consuming Docker's healthcheck timeout and killing the nc -z fallback.
      test: ["CMD-SHELL", "export POSTGRES_USER=\"$DB_USER\" POSTGRES_PASSWORD=\"$DB_PASSWORD\" && timeout 7 sh /healthcheck.sh || nc -z localhost 6432"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 45s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

    restart: unless-stopped

networks:
  sahool-network:
    name: sahool-network
    external: true
