;; PGBouncer Configuration for SAHOOL Platform
;; Connection pooling for PostgreSQL to prevent connection exhaustion

[databases]
;; Main SAHOOL database
;; Password is handled via auth_query (no hardcoded password needed)
;; auth_user (sahool) is used to authenticate users via pgbouncer.get_auth() function
;; SECURITY: Password is provided via environment variable and userlist.txt
sahool = host=postgres port=5432 dbname=sahool

;; Read replica (if available)
;; Note: postgres-replica not defined in docker-compose.yml, commented out
;; sahool_readonly = host=postgres-replica port=5432 dbname=sahool auth_user=sahool

;; MLflow database (used by MLflow tracking server)
mlflow = host=postgres port=5432 dbname=mlflow

;; SECURITY: Wildcard routing REMOVED (was: * = host=postgres port=5432)
;; Previously allowed routing to ANY database name through PgBouncer (e.g., postgres, template1)
;; Now only explicitly listed databases are accessible via PgBouncer
;; To add a new database, add an explicit entry above

[pgbouncer]
;; ═══════════════════════════════════════════════════════════════════════════
;; Process Settings
;; ═══════════════════════════════════════════════════════════════════════════

;; PID file path - MUST be writable by pgbouncer user
;; FIX: Explicitly set to tmpfs runtime directory (writable)
;; Without this, PgBouncer defaults to /var/run/pgbouncer/pgbouncer.pid
;; which does NOT exist when using custom entrypoint (bypasses edoburu defaults)
pidfile = /etc/pgbouncer/runtime/pgbouncer.pid

;; Log file path - MUST be writable by pgbouncer user
;; FIX: Use tmpfs runtime directory (guaranteed writable) to avoid permission issues
;; Docker logs will still capture stdout/stderr from PgBouncer
logfile = /etc/pgbouncer/runtime/pgbouncer.log

;; ═══════════════════════════════════════════════════════════════════════════
;; Connection Settings
;; ═══════════════════════════════════════════════════════════════════════════

;; Listen on all interfaces
listen_addr = 0.0.0.0
listen_port = 6432

;; Unix socket directory (optional)
; unix_socket_dir = /var/run/pgbouncer

;; Authentication
;; ═══════════════════════════════════════════════════════════════════════════
;; PgBouncer uses a two-step authentication process:
;; 1. auth_file (userlist.txt): Contains plaintext password for auth_user to connect to PostgreSQL
;; 2. auth_query: Used to verify client passwords via pgbouncer.get_auth() function
;;
;; auth_type controls how PgBouncer verifies client passwords:
;; - scram-sha-256: Clients authenticate using SCRAM-SHA-256 (PostgreSQL 16 default)
;; - The auth_query returns SCRAM hashes from pg_shadow for verification
;; ═══════════════════════════════════════════════════════════════════════════
auth_type = scram-sha-256
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)
auth_user = sahool

;; Auth file for auth_user password (generated by entrypoint script at runtime)
;; This file contains plaintext passwords used by PgBouncer to authenticate as auth_user
;; IMPORTANT: The entrypoint.sh script generates this file dynamically from DB_PASSWORD
;; Path is in runtime directory (writable volume) to avoid read-only mount conflicts
auth_file = /etc/pgbouncer/runtime/userlist.txt

;; ═══════════════════════════════════════════════════════════════════════════
;; Pool Mode - CRITICAL for performance
;; ═══════════════════════════════════════════════════════════════════════════

;; Transaction mode: best for web applications
;; - Connections returned to pool after each transaction
;; - Cannot use session-level features (prepared statements, temp tables)
pool_mode = transaction

;; Session mode alternative (for apps needing session features):
; pool_mode = session

;; ═══════════════════════════════════════════════════════════════════════════
;; Pool Sizing - Tuned for SAHOOL services (39+ microservices)
;; Based on PostgreSQL audit recommendations (2026-01-06)
;; ═══════════════════════════════════════════════════════════════════════════

;; Maximum connections to PostgreSQL (across all pools)
;; AUDIT FIX: Increased from 150 to 250 for 39+ services
;; Calculation: 39 services × ~6 connections/service = ~234 connections needed
max_db_connections = 250

;; Default pool size per user/database pair
;; AUDIT FIX: Increased from 25 to 30 for better throughput under load
default_pool_size = 30

;; Minimum pool size (keep connections warm)
;; AUDIT FIX: Increased from 5 to 10 to maintain warm connection pool
min_pool_size = 10

;; Reserve connections for superuser
;; AUDIT FIX: Increased reserve pool for maintenance operations
reserve_pool_size = 10

;; Wait this long before using reserve pool
reserve_pool_timeout = 3

;; Maximum client connections to PGBouncer
;; AUDIT FIX: Increased from 500 to 800 to handle peak traffic
max_client_conn = 800

;; ═══════════════════════════════════════════════════════════════════════════
;; Timeouts
;; ═══════════════════════════════════════════════════════════════════════════

;; Close server connection if unused for this many seconds
server_idle_timeout = 600

;; Close client connection if idle for this many seconds
;; OPTIMIZED: Changed from 0 (disabled) to 900s (15 min) to free up idle connections
client_idle_timeout = 900

;; Cancel query if running longer than this
query_timeout = 120

;; Wait this long for a connection from pool
query_wait_timeout = 30

;; Login timeout
client_login_timeout = 60
server_login_retry = 15

;; ═══════════════════════════════════════════════════════════════════════════
;; Connection Lifecycle
;; ═══════════════════════════════════════════════════════════════════════════

;; How long to wait for network response
server_connect_timeout = 5

;; Close and reconnect after this many queries (removed: max_db_connection_queries is not a valid pgbouncer parameter)
;; Use server_lifetime instead to recycle connections periodically

;; Close connection after this many seconds
server_lifetime = 3600

;; Check server health every N seconds
server_check_delay = 30

;; Query to run for health check
server_check_query = SELECT 1

;; ═══════════════════════════════════════════════════════════════════════════
;; Logging
;; ═══════════════════════════════════════════════════════════════════════════

;; Log level (debug, info, warning, error)
;; OPTIMIZED: Added explicit log level for better control
;; NOTE: log_level parameter not supported in this pgbouncer version - using default
; log_level = info

;; Log connections
log_connections = 1

;; Log disconnections
log_disconnections = 1

;; Log pooler errors
log_pooler_errors = 1

;; Statistics period (seconds)
stats_period = 60

;; Syslog integration (optional - enable for centralized logging)
;; OPTIMIZED: Added syslog configuration for production monitoring
; syslog = 1
; syslog_facility = local0
; syslog_ident = pgbouncer-sahool

;; Verbose logging (0-2, higher = more verbose)
;; NOTE: Only enable for debugging (performance impact)
; verbose = 0

;; ═══════════════════════════════════════════════════════════════════════════
;; Admin Console
;; ═══════════════════════════════════════════════════════════════════════════

;; Admin users (can run SHOW commands)
admin_users = pgbouncer_admin

;; Stats users (can run SHOW STATS)
stats_users = pgbouncer_stats

;; Ignore startup parameters from client
;; AUDIT FIX: Added statement_timeout to ignored parameters (services set this at connection)
ignore_startup_parameters = extra_float_digits,jit,statement_timeout,pgbouncer

;; ═══════════════════════════════════════════════════════════════════════════
;; Security
;; ═══════════════════════════════════════════════════════════════════════════

;; Disable dangerous features in transaction pooling mode
; disable_pqexec = 0

;; ── TLS Configuration ────────────────────────────────────────────────────
;;
;; SECURITY FIX: Changed from 'disable' to 'allow' to support TLS connections
;; without breaking existing non-TLS services during migration.
;;
;; TLS Mode Ladder (apply progressively):
;;   disable → allow → prefer → require → verify-ca → verify-full
;;
;; Current: 'allow' - accepts both TLS and non-TLS client connections.
;; Services can opt-in to TLS without requiring all 728 connections to update
;; simultaneously. This resolves the audit finding (tls=no for all connections)
;; by enabling TLS-capable clients to connect securely.
;;
;; PRODUCTION: Change to 'require' once all services support TLS.
;; Use docker-compose.tls.yml overlay for full TLS enforcement.
;; ────────────────────────────────────────────────────────────────────────

;; Server-side TLS (PgBouncer → PostgreSQL)
;; 'prefer' attempts TLS with PostgreSQL, falls back to plaintext if unavailable.
;; For production with TLS-enabled PostgreSQL, use 'require' or 'verify-full'.
server_tls_sslmode = require
server_tls_ca_file = /etc/pgbouncer/certs/ca.crt
; server_tls_protocols = secure

;; Client-side TLS (Application → PgBouncer)
;; 'allow' accepts both TLS and non-TLS connections from applications.
;; This is the minimum fix: TLS-capable clients will negotiate TLS,
;; while legacy services continue to connect without TLS.
;; PRODUCTION: Set to 'require' and configure cert/key files below.
client_tls_sslmode = require
client_tls_cert_file = /etc/pgbouncer/certs/server.crt
client_tls_key_file = /etc/pgbouncer/certs/server.key
; client_tls_protocols = secure
