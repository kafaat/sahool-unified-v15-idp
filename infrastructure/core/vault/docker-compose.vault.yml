# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Vault Development Setup
# HashiCorp Vault for secrets management
# ═══════════════════════════════════════════════════════════════════════════════
#
# Usage:
#   docker compose -f infra/vault/docker-compose.vault.yml up -d
#
# Access:
#   - UI: http://localhost:8200/ui
#   - CLI: export VAULT_ADDR=http://localhost:8200
#          export VAULT_TOKEN=$VAULT_DEV_ROOT_TOKEN_ID
#
# WARNING: This is a DEVELOPMENT configuration only!
#          Do NOT use in production.
#

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: sahool-vault
    hostname: vault
    ports:
      - "8200:8200"
    environment:
      # Development mode settings
      # Inject at deploy time via .env file or environment variable
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_ROOT_TOKEN_ID:-CHANGE_ME_BEFORE_DEPLOY}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOG_LEVEL: "info"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sahool-network

  # Initialize Vault with SAHOOL secrets structure
  vault-init:
    image: hashicorp/vault:1.17
    container_name: sahool-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      # Inject at deploy time - must match VAULT_DEV_ROOT_TOKEN_ID
      VAULT_TOKEN: "${VAULT_DEV_ROOT_TOKEN_ID:-CHANGE_ME_BEFORE_DEPLOY}"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "🔐 Initializing SAHOOL Vault secrets..."

        # Database credentials - inject via environment variables at deploy time
        vault kv put secret/database/postgres \
          username=sahool \
          password=$${VAULT_POSTGRES_PASSWORD:-CHANGE_ME_BEFORE_DEPLOY} \
          host=postgres \
          port=5432 \
          database=sahool

        # JWT secrets - inject via environment variables at deploy time
        vault kv put secret/auth/jwt \
          secret_key=$${VAULT_JWT_SECRET:-CHANGE_ME_BEFORE_DEPLOY} \
          algorithm=HS256 \
          access_token_expire_minutes=30 \
          refresh_token_expire_days=7

        # NATS credentials - inject via environment variables at deploy time
        vault kv put secret/messaging/nats \
          url=nats://nats:4222 \
          user=sahool \
          password=$${VAULT_NATS_PASSWORD:-CHANGE_ME_BEFORE_DEPLOY}

        # Redis credentials - inject via environment variables at deploy time
        vault kv put secret/cache/redis \
          url=redis://redis:6379 \
          password=$${VAULT_REDIS_PASSWORD:-CHANGE_ME_BEFORE_DEPLOY}

        # External API keys - inject via environment variables at deploy time
        vault kv put secret/external/openweather \
          api_key=$${OPENWEATHER_API_KEY:-CHANGE_ME_BEFORE_DEPLOY}

        vault kv put secret/external/sentinel \
          api_key=$${SENTINEL_API_KEY:-CHANGE_ME_BEFORE_DEPLOY}

        echo "✅ Vault initialized with development secrets!"
    networks:
      - sahool-network

networks:
  sahool-network:
    name: sahool-network
    external: true
