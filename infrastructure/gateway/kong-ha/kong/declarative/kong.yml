# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Kong Gateway - High Availability Declarative Configuration
# تكوين Kong للتوفر العالي
# Synced with: infrastructure/gateway/kong/kong.yml
# Full sync completed: 2026-02-19
# Total services: 79 (aligned with primary kong.yml)
# ═══════════════════════════════════════════════════════════════════════════════

# ==============================================================================
# Global Plugins (applies to all routes/services)
# الإضافات العالمية (تُطبق على جميع المسارات والخدمات)
# ==============================================================================
plugins:
  # CORS Configuration - Environment-based security
  # تكوين CORS - أمان يعتمد على البيئة
  - name: cors
    config:
      origins:
        - "*"  # Replace with specific domains in production
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Authorization
        - Content-Length
        - Content-Type
        - Date
        - X-Request-Id
        - X-Correlation-Id
      exposed_headers:
        - X-Request-Id
        - X-Correlation-Id
        - X-RateLimit-Limit-Minute
        - X-RateLimit-Remaining-Minute
      # SECURITY FIX: credentials cannot be true with wildcard origin
      credentials: false
      max_age: 3600
      preflight_continue: false

  # Prometheus metrics for monitoring
  - name: prometheus
    config: {}

  # Request correlation ID for distributed tracing
  # معرف ارتباط الطلب للتتبع الموزع
  - name: correlation-id
    config:
      header_name: X-Correlation-Id
      generator: uuid#counter
      echo_downstream: true

  # Request size limiting to prevent large payload attacks
  # تحديد حجم الطلب لمنع هجمات الحمولة الكبيرة
  - name: request-size-limiting
    config:
      allowed_payload_size: 10  # MB
      size_unit: megabytes
      require_content_length: false

  # Security Headers - Added for all responses
  # رؤوس الأمان - مضافة لجميع الاستجابات
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Content-Type-Options: nosniff"
          - "X-Frame-Options: DENY"
          - "X-XSS-Protection: 1; mode=block"
          - "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload"
          - "Referrer-Policy: strict-origin-when-cross-origin"
          - "Permissions-Policy: geolocation=(), microphone=(), camera=()"
      remove:
        headers:
          - "Server"
          - "X-Powered-By"

  # Bot Detection - Block malicious bots and scrapers
  # كشف الروبوتات - حظر الروبوتات الخبيثة
  - name: bot-detection
    config:
      deny:
        - "sqlmap"
        - "Nikto"
        - "masscan"
        - "ZmEu"
        - "dirbuster"
        - "gobuster"
        - "nuclei"
        - "nmap"
      allow:
        - "Googlebot"
        - "bingbot"

