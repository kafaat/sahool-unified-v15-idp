    read_timeout: 60000
    write_timeout: 60000
    retries: 2
    routes:
      - name: leveling-analyze-route
        paths: ["/api/v1/leveling/analyze"]
        strip_path: false
        methods: ["POST"]
      - name: leveling-plan-route
        paths: ["/api/v1/leveling/plan"]
        strip_path: false
        methods: ["GET"]
      - name: leveling-base-route
        paths: ["/api/v1/leveling"]
        strip_path: true
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
      - name: rate-limiting
        config:
          minute: 30
          hour: 1500
          policy: redis
          redis_host: redis
          redis_port: 6379
          redis_password: ${REDIS_PASSWORD}
          redis_database: 1
          redis_timeout: 2000
          fault_tolerant: true

  # Edge API - Edge Orchestrator Service
  - name: edge-orchestrator-service
    url: http://edge-orchestrator-service:8180
    connect_timeout: 10000
    read_timeout: 30000
    write_timeout: 30000
    retries: 2
    routes:
      - name: edge-devices-route
        paths: ["/api/v1/edge/devices"]
        strip_path: false
        methods: ["GET"]
      - name: edge-jobs-route
        paths: ["/api/v1/edge/jobs"]
        strip_path: false
        methods: ["POST"]
      - name: edge-base-route
        paths: ["/api/v1/edge"]
        strip_path: true
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
      - name: rate-limiting
        config:
          minute: 60
          hour: 3000
          policy: redis
          redis_host: redis
          redis_port: 6379
          redis_password: ${REDIS_PASSWORD}
          redis_database: 1
          redis_timeout: 2000
          fault_tolerant: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Platform Endpoints - نقاط المنصة
  # ─────────────────────────────────────────────────────────────────────────────

  - name: root-endpoint
    url: http://kong:8000
    routes:
      - name: root-route
        paths: ["/"]
        strip_path: false
        methods: ["GET"]
    plugins:
      - name: request-termination
        config:
          status_code: 200
          content_type: "application/json"
          body: '{"platform":"SAHOOL","version":"16.0.0","description":"National Agricultural Intelligence Platform - منصة سهول الزراعية الوطنية","status":"operational","mode":"high-availability"}'

  - name: health-check
    url: http://kong:8000
    routes:
      - name: health-route
        paths: ["/health", "/ping"]
        strip_path: false
        methods: ["GET"]
    plugins:
      - name: request-termination
        config:
          status_code: 200
          message: "SAHOOL Platform is healthy (HA Mode)"

