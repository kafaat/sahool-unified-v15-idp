          - /api/v1/field
          - /api/field-ops
        strip_path: true
        preserve_host: true
    plugins:
      - name: rate-limiting
        config:
          minute: 1000
          hour: 50000
          policy: redis
          redis_host: redis
          redis_port: 6379
          redis_password: ${REDIS_PASSWORD}
          redis_database: 1
          redis_timeout: 2000
          fault_tolerant: true
          hide_client_headers: false
      - name: request-transformer
