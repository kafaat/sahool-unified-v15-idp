services:
- name: health-endpoints-bypass
  url: http://kong:8000
  routes:
  - name: health-no-ratelimit
    paths:
    - /health
    - /healthz
    - /readyz
    - /ping
    strip_path: false
    protocols:
    - http
    - https
  plugins:
  - name: rate-limiting
    enabled: false
- name: starter-package-ratelimit
  url: http://kong:8000
  routes:
  - name: starter-api-routes
    paths:
    - /api/v1/starter
    strip_path: false
    protocols:
    - http
    - https
  plugins:
  - name: rate-limiting
    config:
      minute: 30
      hour: 500
      policy: redis
      redis_host: redis
      redis_port: 6379
          redis_password: ${REDIS_PASSWORD}
      fault_tolerant: true
      error_message: Starter tier rate limit exceeded. Upgrade to Professional for higher limits. تم تجاوز حد الباقة الأساسية.
