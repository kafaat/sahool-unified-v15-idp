# ==============================================================================
# Kong Rate Limiting Tiers Configuration - تكوين مستويات تحديد المعدل
# SAHOOL Platform - منصة سهول
# ==============================================================================
# This file defines route-specific rate limiting for subscription tiers.
# Uses standard rate-limiting plugin (Kong OSS compatible).
#
# Tier Overview:
# - Starter:      30 req/min,   500 req/hour
# - Professional: 60 req/min,  2000 req/hour
# - Enterprise:  120 req/min,  5000 req/hour
# - Research:    120 req/min, 10000 req/hour
# - Internal:   1000 req/min, 50000 req/hour
# ==============================================================================

_format_version: '3.0'
_transform: true
plugins:
- name: rate-limiting
  enabled: true
  config:
    minute: 30
    hour: 500
    day: 10000
    policy: redis
    redis_host: redis
    redis_port: 6379
          redis_password: ${REDIS_PASSWORD}
    redis_database: 0
    fault_tolerant: true
    hide_client_headers: false
    error_code: 429
    error_message: Rate limit exceeded. Please upgrade your subscription tier. تم تجاوز حد المعدل. يرجى ترقية مستوى اشتراكك.
- name: rate-limiting
  service: yolo26-vision-service
  config:
    minute: 60
    hour: 3000
    policy: redis
    redis_host: redis
    redis_port: 6379
          redis_password: ${REDIS_PASSWORD}
    fault_tolerant: true
    error_message: Vision API rate limit exceeded. الحد الأقصى لطلبات خدمة الرؤية. Upgrade to Enterprise for higher limits.
