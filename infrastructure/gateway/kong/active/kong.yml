  # `/alerts`, `/alerts/rules`, `/alerts/{id}/resolve`, etc — no /api/v1
  # prefix. With strip_path: true AND service path `/alerts`, Kong
  # converts /api/v1/alerts/{id}/resolve → strip → /{id}/resolve →
  # prepend /alerts → /alerts/{id}/resolve (matches backend).
  path: /alerts
  plugins:
  - name: jwt
    config:
      claims_to_verify:
      - exp
  routes:
  - name: alert-service-route
    paths:
    # Primary path used by the web contract (ALERT_ENDPOINTS).
    - /api/v1/alerts
    # Legacy alias kept so callers of /api/v1/alert-management still
    # reach this service during the rollout. Remove in v17 once all
    # consumers switch to /api/v1/alerts.
    - /api/v1/alert-management
    strip_path: true
    protocols:
    - http
    - https
    strip_path: true
    protocols:
    - http
    - https
