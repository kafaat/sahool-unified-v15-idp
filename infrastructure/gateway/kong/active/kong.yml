- name: field-intelligence
  host: field-intelligence
  port: 8120
  protocol: http
  routes:
  - name: field-intelligence-route
    paths:
    # Global /intelligence/* + /field-intelligence/{id} aggregate. The
    # /api/v1/fields/{id}/intelligence/* endpoints need regex routing (Kong
    # "~/..." syntax) to win over field-management-service's /api/v1/fields
    # prefix; tracked separately. For now the aggregate route is the
    # primary server-side entry — web can call /field-intelligence/{id}
    # instead of the per-sub-resource paths.
    - /api/v1/intelligence
    - /api/v1/field-intelligence
    strip_path: false  # backend router mounts at /api/v1/... — preserve full path
    protocols:
    - http
    - https
  plugins:
  - name: jwt
    config:
      run_on_preflight: false
      claims_to_verify:
      - exp
