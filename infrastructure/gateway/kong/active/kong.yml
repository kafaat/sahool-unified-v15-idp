    - POST
    - PUT
    - PATCH
    - DELETE
    strip_path: false
    protocols:
    - http
    - https
  plugins:
  - name: jwt
    config:
      run_on_preflight: false
      claims_to_verify:
      - exp
  - name: rate-limiting
    config:
      minute: 60
      hour: 2000
      policy: local
      fault_tolerant: true
