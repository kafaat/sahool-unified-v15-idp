_format_version: '3.0'
_transform: true
plugins:
- name: cors
  config:
    origins:
    - https://app.sahool.io
    - https://admin.sahool.io
    - https://sahool.io
    - http://localhost:3000
    - http://localhost:3001
    - http://localhost:3002
    - http://localhost:8080
    methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
    headers:
    - Accept
    - Accept-Version
    - Authorization
    - Content-Length
    - Content-Type
    - Date
    - X-Request-Id
    - X-Correlation-Id
    exposed_headers:
    - X-Request-Id
    - X-Correlation-Id
    - X-RateLimit-Limit-Minute
    - X-RateLimit-Remaining-Minute
    credentials: true
    max_age: 3600
    preflight_continue: false
- name: prometheus
  config: {}
- name: correlation-id
  config:
    header_name: X-Correlation-Id
    generator: uuid#counter
    echo_downstream: true
