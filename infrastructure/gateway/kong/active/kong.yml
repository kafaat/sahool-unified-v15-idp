- name: vegetation-analysis-service
  host: vegetation-analysis-service
  port: 8090
  protocol: http
  # Backend routes mount at /v1/* (analyze, boundaries, etc).
  # Kong strips the /api/v1/<tail> route prefix then prepends `/v1`
  # so the upstream request matches the backend's `/v1/*` handlers.
  path: /v1
  routes:
  - name: vegetation-analysis-service-route
    paths:
    - /api/v1/vegetation
    - /vegetation
    strip_path: true
    protocols:
    - http
    - https
  - name: satellite-route
    paths:
    - /api/v1/satellite
    - /satellite
    strip_path: true
    protocols:
    - http
    - https
  - name: ndvi-route
    paths:
    - /api/v1/ndvi
    - /ndvi
    strip_path: true
    protocols:
    - http
    - https
  plugins:
  - name: jwt
    config:
      run_on_preflight: false
      claims_to_verify:
      - exp
  - name: proxy-cache
    config:
      response_code:
      - 200
      request_method:
      - GET
      content_type:
      - application/json
      cache_ttl: 1800
      strategy: memory
# indicators-service has an inconsistent backend route layout that a
# single service.path rewrite cannot cover. Split into two Kong services
# sharing the same upstream host, differing only in `path`:
#   * indicators-service-definitions — upstream `/v1/indicators/*`
#     (only /v1/indicators/definitions lives here; longest-prefix match
#     wins for this specific sub-path so the other routes below aren't
#     affected).
#   * indicators-service          — upstream `/v1/*` for the remaining
#     contract endpoints (dashboard, alerts, trends, field) whose
#     backend handlers live at /v1/<resource>/*, NOT /v1/indicators/<resource>.
- name: indicators-service-definitions
  host: indicators-service
  port: 8091
  protocol: http
  # Route only the /definitions sub-path here so upstream becomes
  # /v1/indicators/definitions (matches backend exactly).
  path: /v1/indicators
  plugins:
  - name: jwt
    config:
      claims_to_verify:
      - exp
  routes:
  - name: indicators-service-definitions-route
    paths:
    - /api/v1/indicators/definitions
    strip_path: true
    protocols:
    - http
    - https
- name: indicators-service
  host: indicators-service
  port: 8091
  protocol: http
  # Backend's remaining /v1/* endpoints (dashboard/{tenant_id},
  # alerts/{tenant_id}, trends/{field_id}/{indicator_id},
  # field/{field_id}/indicators). Kong strips /api/v1/indicators then
  # prepends /v1 so the upstream request matches the backend.
  # Longest-prefix routing means requests to /api/v1/indicators/definitions
  # fall to the -definitions service above before reaching this one.
  path: /v1
  plugins:
  - name: jwt
    config:
      claims_to_verify:
      - exp
  routes:
  - name: indicators-service-route
    paths:
    - /api/v1/indicators
    - /indicators
    strip_path: true
    protocols:
    - http
    - https
- name: weather-service
  host: weather-service
  port: 8092
  protocol: http
  # Kong upstream path: backend routes live at /weather/X (no /api/v1 prefix).
  # With `path: /weather` and `strip_path: true`, a request to
  # /api/v1/weather/current becomes: strip "/api/v1/weather" → "/current",
  # prepend service.path "/weather" → "/weather/current", which matches
  # @app.post("/weather/current") in the backend.
  path: /weather
  routes:
  # Legacy "double weather" prefix used by the current web contract
  # WEATHER_ENDPOINTS.KONG_CURRENT / KONG_FORECAST / KONG_AGRICULTURAL_REPORT
  # in packages/shared-types/src/contracts/api-endpoints.ts. With the
  # service.path prepend above, a naive single prefix would produce
  # "/weather/weather/current" upstream (404). This more-specific route
  # strips the full /api/v1/weather/weather so the remainder ("/current")
  # gets "/weather" prepended once → /weather/current ✓. Kong picks this
  # route over the single-prefix one below via longest-prefix match.
  - name: weather-service-legacy-route
    paths:
    - /api/v1/weather/weather
    strip_path: true
    protocols:
    - http
    - https
    methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
  - name: weather-service-route
    paths:
    - /api/v1/weather
    strip_path: true
    protocols:
    - http
    - https
    methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
  plugins:
  - name: proxy-cache
    config:
      response_code:
      - 200
      request_method:
      - GET
      content_type:
      - application/json
      cache_ttl: 900
      strategy: memory
  - name: jwt
    config:
      claims_to_verify:
      - exp
- name: advisory-service
  host: advisory-service
  port: 8093
  protocol: http
  routes:
  - name: advisory-service-route
    paths:
    # Backend declares @app.post("/api/v1/advisory/..."), /api/v1/disease/...,
    # /api/v1/fertilizer/..., /api/v1/crops, /api/v1/loans/..., /api/v1/actions
    # and /api/v1/nutrient — all with the /api/v1 prefix already. Route every
    # top-level namespace it owns through the same upstream.
    - /api/v1/advisory
    - /api/v1/disease
    - /api/v1/fertilizer
    - /api/v1/nutrient
    - /api/v1/loans/crop-loan-verification
    - /api/v1/crop-catalog
    strip_path: false  # backend routes already carry /api/v1 — don't strip
    protocols:
    - http
    - https
  plugins:
  - name: jwt
    config:
      run_on_preflight: false
      claims_to_verify:
      - exp
