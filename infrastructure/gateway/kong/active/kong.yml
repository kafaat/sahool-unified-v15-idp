- name: field-intelligence
  host: field-intelligence
  port: 8120
  protocol: http
  routes:
  - name: field-intelligence-route
    paths:
    # Global /intelligence/* + /field-intelligence/{id} aggregate. The
    # /api/v1/fields/{id}/intelligence/* endpoints need regex routing (Kong
    # "~/..." syntax) to win over field-management-service's /api/v1/fields
    # prefix; tracked separately. For now the aggregate route is the
    # primary server-side entry — web can call /field-intelligence/{id}
    # instead of the per-sub-resource paths.
    - /api/v1/intelligence
    - /api/v1/field-intelligence
    strip_path: false  # backend router mounts at /api/v1/... — preserve full path
    protocols:
    - http
    - https
  # INTELLIGENCE_ENDPOINTS (packages/shared-types/src/contracts/api-endpoints.ts)
  # mounts the field-scoped score/zones/alerts/recommendations under
  # /api/v1/fields/{fieldId}/intelligence/*. Without this regex route
  # those requests match the broader /api/v1/fields prefix on
  # field-management-service and 404 there. Backend's FastAPI router is
  # already prefixed /api/v1 (see src/main.py include_router), so
  # strip_path: false forwards the full path.
  - name: field-intelligence-fields-route
    paths:
    - ~/^/api/v1/fields/[^/]+/intelligence(/.*)?$
    strip_path: false
    # Beat the field-management-service-route (implicit regex_priority 0).
    regex_priority: 100
    protocols:
    - http
    - https
  # Non-field-scoped intelligence endpoints: create-task, best-days,
  # validate-date. Backend routes are mounted under /api/v1/intelligence.
  - name: field-intelligence-root-route
    paths:
    - /api/v1/intelligence
    strip_path: false
    protocols:
    - http
    - https
  plugins:
  - name: jwt
    config:
      run_on_preflight: false
      claims_to_verify:
      - exp
