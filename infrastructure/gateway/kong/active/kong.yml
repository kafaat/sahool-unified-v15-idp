- name: alert-service
  host: alert-service
  port: 8113
  protocol: http
  # Web calls /api/v1/alerts/* (ALERT_ENDPOINTS in packages/shared-types/
  # src/contracts/api-endpoints.ts); backend declares @app.get("/alerts/...")
  # with no /api/v1 prefix. Kong strips /api/v1/alerts and prepends
  # service.path "/alerts" so /api/v1/alerts/{id}/resolve becomes
  # "/alerts/{id}/resolve" on the backend — matches exactly.
  #
  # Legacy /api/v1/alert-management alias kept so in-flight clients don't
  # break; new callers should use /api/v1/alerts.
  path: /alerts
  plugins:
  - name: jwt
    config:
      claims_to_verify:
      - exp
  routes:
  - name: alert-service-route
    paths:
    - /api/v1/alerts
    - /api/v1/alert-management
    strip_path: true
    protocols:
    - http
    - https
