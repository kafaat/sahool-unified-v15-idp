  # Schedules CRUD (new): backend mounts at /api/v1/irrigation/schedules;
  # strip_path:false preserves the full path. Must come BEFORE the legacy
  # /api/v1/irrigation route because Kong does longest-prefix match and
  # the schedules prefix is more specific.
  - name: irrigation-smart-schedules-route
    paths:
    - /api/v1/irrigation/schedules
    strip_path: false
    protocols:
    - http
    - https
  # Legacy /v1/* routes (calculate, crops, methods, water-balance, ...)
  # live at /v1/X in the backend with no /api prefix, so Kong must strip
  # the /api/v1/irrigation match and forward /X.
  - name: irrigation-smart-route
    paths:
    - /api/v1/irrigation
    - /irrigation
    strip_path: true
    protocols:
    - http
    - https
