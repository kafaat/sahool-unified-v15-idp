_format_version: '3.0'
_transform: true
plugins:
- name: cors
  config:
    origins:
    - https://app.sahool.io
    - https://admin.sahool.io
    - https://sahool.io
    - http://localhost:3000
    - http://localhost:3001
    - http://localhost:3002
    - http://localhost:8080
    methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
    headers:
    - Accept
    - Accept-Version
    - Authorization
    - Content-Length
    - Content-Type
    - Date
    - X-Request-Id
    - X-Correlation-Id
    exposed_headers:
    - X-Request-Id
    - X-Correlation-Id
    - X-RateLimit-Limit-Minute
    - X-RateLimit-Remaining-Minute
    credentials: true
    max_age: 3600
    preflight_continue: false
- name: prometheus
  config: {}
- name: correlation-id
  config:
    header_name: X-Correlation-Id
    generator: uuid#counter
    echo_downstream: true
services:
- name: field-management-service
  host: field-management-service
  port: 3000
  protocol: http
  routes:
  - name: field-management-service-route
    paths:
    - /api/v1/fields
    - /api/v1/field
    - /field
    # /api/v1/crops — CROP_ENDPOINTS (web contract). Backend's
    # CropSeasonsController accepts this spelling as an alias alongside
    # /crop-seasons; MUST be listed here (not on crop-intelligence) so
    # the longest-prefix match doesn't route /api/v1/crops → /api/v1/crop
    # on crop-intelligence-service.
    - /api/v1/crops
    # /api/v1/crop-seasons — canonical spelling used by mobile builds
    # and the field-management crop rotation module.
    - /api/v1/crop-seasons
    # /api/v1/seasons — shorter alias kept in sync with the controller.
    - /api/v1/seasons
    # /api/v1/dashboard — DASHBOARD_ENDPOINTS (web home screen). Four
    # sub-paths (summary/stats/recent-activity/weather/alerts) are
    # served by DashboardController in this service; aggregates Field
    # + Task counts from Prisma so the UI gets real numbers.
    - /api/v1/dashboard
    methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    strip_path: false
    protocols:
    - http
    - https
  plugins:
  - name: jwt
    config:
      run_on_preflight: false
      claims_to_verify:
      - exp
  - name: rate-limiting
    config:
      minute: 60
      hour: 2000
      policy: local
      fault_tolerant: true
