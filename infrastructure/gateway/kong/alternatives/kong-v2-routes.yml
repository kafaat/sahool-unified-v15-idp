# ============================================================================
# Kong API Gateway V2 Routes Configuration
# SAHOOL Platform API v2 Versioning
# ============================================================================
# This configuration adds v2 routes alongside existing v1 routes.
# All v1 routes carry deprecation warning headers.
#
# IMPORTANT — LOADING CONSTRAINTS
# 1. This file MUST NOT be loaded alongside kong.yml in DB-less mode because
#    the v1 service names / route paths in this file duplicate those already
#    defined in kong.yml, which will cause Kong to reject the configuration.
#    Use `deck sync` (DB mode) or load this file INSTEAD OF the v1 sections
#    of kong.yml.
# 2. All service `url` entries use direct host:port addresses.  The upstream
#    objects defined in infra/kong/kong.yml are intentionally NOT referenced
#    here to keep this file self-contained and compatible with kong.yml.
# ============================================================================

_format_version: "3.0"
_transform: true

# ============================================================================
# API v2 Services Configuration
# ============================================================================
# Each service has both v1 (deprecated) and v2 (current) routes.
# ============================================================================

services:
  # ============================================================================
  # User Service - v1 (Deprecated) & v2 (Current)
  # ============================================================================
  - name: user-service-v1
    url: http://user-service:3025
    tags:
      - v1
      - deprecated
      - user-service
    routes:
      - name: user-service-v1-route
        paths:
          - /api/v1/users
          - /api/v1/auth
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
      - name: acl
        config:
          allow:
            - starter-users
            - professional-users
            - enterprise-users
      - name: rate-limiting
        config:
          minute: 50  # Reduced for deprecated endpoints
          hour: 2000
          policy: redis
          redis_host: redis
          redis_port: 6379
          redis_password: ${REDIS_PASSWORD}
          redis_database: 1
          redis_timeout: 2000
          fault_tolerant: true
      - name: response-transformer
        config:
          add:
            headers:
              - "X-API-Version: 1"
              - "X-API-Deprecated: true"
              - "X-API-Deprecation-Date: 2025-06-30"
              - "X-API-Sunset-Date: 2026-06-30"
              - "X-API-Deprecation-Info: https://docs.sahool.app/api/deprecation/v1"
              - "Link: </api/v2/users>; rel=\"successor-version\""
              - "Warning: 299 - \"API version 1 is deprecated and will be removed on 2026-06-30\""
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid

  - name: user-service-v2
    url: http://user-service:3025
    tags:
      - v2
      - current
      - user-service
    routes:
      - name: user-service-v2-route
        paths:
          - /api/v2/users
          - /api/v2/auth
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
      - name: acl
        config:
          allow:
            - starter-users
            - professional-users
            - enterprise-users
      - name: rate-limiting
        config:
          minute: 100
          hour: 5000
          policy: redis
          redis_host: redis
          redis_port: 6379
          redis_password: ${REDIS_PASSWORD}
          redis_database: 1
          redis_timeout: 2000
          fault_tolerant: true
      - name: response-transformer
        config:
          add:
            headers:
              - "X-API-Version: 2"
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid

