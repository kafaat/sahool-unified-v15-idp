# ============================================================================
# Global Plugins (Apply to all routes)
# ============================================================================
plugins:
  # CORS Configuration
  - name: cors
    config:
      origins:
        - "https://sahool.app"
        - "https://www.sahool.app"
        - "https://admin.sahool.app"
        - "https://api.sahool.app"
        - "http://localhost:3000"
        - "http://localhost:5173"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-Type
        - Date
        - Authorization
        - X-Auth-Token
        - X-API-Version
        - X-Request-ID
      exposed_headers:
        - X-Request-ID
        - X-API-Version
        - X-API-Deprecated
        - X-API-Deprecation-Date
        - X-API-Sunset-Date
        - Link
      credentials: true
      max_age: 3600

  # Request ID generation
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  # Security headers
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Content-Type-Options: nosniff"
          - "X-Frame-Options: DENY"
          - "X-XSS-Protection: 1; mode=block"
          - "Strict-Transport-Security: max-age=31536000"

