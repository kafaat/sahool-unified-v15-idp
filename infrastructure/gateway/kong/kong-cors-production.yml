# ==============================================================================
# Kong CORS Configuration - Production
# تكوين CORS لـ Kong - الإنتاج
# ==============================================================================
# This file provides production-ready CORS configuration
# Replace the CORS plugin in kong.yml with this configuration for production
# ==============================================================================

_format_version: "3.0"

plugins:
  # CORS Configuration - Production (Strict)
  # تكوين CORS - الإنتاج (صارم)
  - name: cors
    config:
      # Production: Specific allowed origins only
      # الإنتاج: الأصول المسموح بها فقط
      origins:
        - "https://app.sahool.com"
        - "https://admin.sahool.com"
        - "https://mobile.sahool.com"
        - "https://api.sahool.com"
        - "https://portal.sahool.com"
        # Add your production domains here
        # أضف نطاقات الإنتاج هنا
      
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      
      headers:
        - Accept
        - Accept-Version
        - Authorization
        - Content-Length
        - Content-Type
        - Date
        - X-Request-Id
        - X-Correlation-Id
        - X-Tenant-Id
        - X-API-Key
      
      exposed_headers:
        - X-Request-Id
        - X-Correlation-Id
        - X-RateLimit-Limit-Minute
        - X-RateLimit-Remaining-Minute
        - X-RateLimit-Limit-Hour
        - X-RateLimit-Remaining-Hour
      
      # PRODUCTION: Enable credentials with specific origins
      # الإنتاج: تفعيل الاعتمادات مع أصول محددة
      credentials: true
      
      # Cache preflight requests for 24 hours
      # تخزين طلبات preflight لمدة 24 ساعة
      max_age: 86400
      
      preflight_continue: false

# ==============================================================================
# Usage Instructions | تعليمات الاستخدام
# ==============================================================================
#
# For production deployment:
# 1. Copy the CORS plugin configuration above
# 2. Replace the CORS plugin in kong.yml with this configuration
# 3. Update origins list with your actual production domains
# 4. Set credentials: true for cookie-based authentication
# 5. Reload Kong: docker compose exec kong-dbless kong reload
#
# Environment Variable Method (Preferred):
# Set KONG_CORS_ORIGINS in your .env file:
# KONG_CORS_ORIGINS="https://app.sahool.com,https://admin.sahool.com"
#
# Then use in kong.yml:
# origins: ${KONG_CORS_ORIGINS:-*}
# credentials: ${KONG_CORS_CREDENTIALS:-false}
#
# ==============================================================================
