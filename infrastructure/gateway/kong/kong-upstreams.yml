# ==============================================================================
# Kong Upstreams Configuration - تكوين خوادم المنبع
# SAHOOL Platform - منصة سهول
# ==============================================================================
# This file defines load balancing, health checks, circuit breakers,
# and retry policies for all upstream services.
# يحدد هذا الملف موازنة التحميل وفحوصات الصحة وقواطع الدائرة
# وسياسات إعادة المحاولة لجميع الخدمات.
# ==============================================================================

_format_version: "3.0"
_transform: true

upstreams:
  # ============================================================================
  # Core Services - الخدمات الأساسية
  # High availability with aggressive health checks
  # توفر عالي مع فحوصات صحة صارمة
  # ============================================================================

  # Field Management Service - خدمة إدارة الحقول
  - name: field-management-service-upstream
    algorithm: round-robin
    hash_on: none
    hash_fallback: none
    slots: 10000
    healthchecks:
      active:
        # Active health checks - فحوصات صحة نشطة
        type: http
        http_path: /healthz
        https_verify_certificate: false
        timeout: 5
        concurrency: 10
        healthy:
          http_statuses: [200, 201, 204]
          interval: 5
          successes: 2
        unhealthy:
          http_failures: 3
          http_statuses: [429, 500, 502, 503, 504]
          interval: 5
          timeouts: 3
          tcp_failures: 3
      passive:
        # Passive health checks (circuit breaker) - فحوصات صحة سلبية (قاطع الدائرة)
        type: http
        healthy:
          http_statuses: [200, 201, 202, 204, 301, 302]
          successes: 5
        unhealthy:
          http_failures: 5
          http_statuses: [429, 500, 502, 503, 504]
          timeouts: 5
          tcp_failures: 5
    targets:
      - target: field-management-service:3000
        weight: 100
        tags:
          - core
          - tier-1

  # User Service - خدمة المستخدمين
  - name: user-service-upstream
    algorithm: round-robin
    slots: 10000
    healthchecks:
