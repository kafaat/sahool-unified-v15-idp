            - "192.168.0.0/16"   # Private network
            - "127.0.0.1/32"     # Localhost
          status: 403
          message: "Access denied. Billing API is restricted. الوصول مرفوض. API الفوترة محظور."
      # Strict rate limiting for billing operations
      # تحديد صارم للمعدل لعمليات الفوترة
      - name: rate-limiting
        config:
          minute: 20
          hour: 200
          policy: redis
