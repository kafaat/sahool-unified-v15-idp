        protocols: ["http", "https"]
        methods: ["GET"]
      - name: leveling-base-route
        paths: ["/api/v1/leveling"]
        strip_path: true
        protocols: ["http", "https"]
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
      - name: acl
        config:
          allow:
            - professional-users
            - enterprise-users
      - name: rate-limiting
        config:
          minute: 30
          hour: 1500
          policy: local
          fault_tolerant: true
      - name: response-transformer
        config:
          add:
            headers:
              - "X-Service: leveling-optimizer-service"
      # REMOVED: http-log plugin (logging-service does not exist)

