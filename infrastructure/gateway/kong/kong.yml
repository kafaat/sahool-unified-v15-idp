_format_version: "3.0"
_transform: true

# ------------------------------------------------------------------------------
# Kong Declarative Config (DB-less)
# Generated from docker-compose.yml
# Fix applied: service.name + service.host (docker DNS) + service.port (internal)
# Only includes services that actually exist in docker-compose.yml
# ------------------------------------------------------------------------------

# ==============================================================================
# Global Plugins (applies to all routes/services)
# الإضافات العالمية (تُطبق على جميع المسارات والخدمات)
# ==============================================================================
plugins:
  # CORS Configuration - Environment-based security
  # تكوين CORS - أمان يعتمد على البيئة
  # PRODUCTION: Set KONG_CORS_ORIGINS to specific domains
  # DEVELOPMENT: Uses wildcard (*)
  # الإنتاج: عيّن KONG_CORS_ORIGINS للنطاقات المحددة
  # التطوير: يستخدم حرف البدل (*)
  - name: cors
    config:
      # SECURITY: In production, set environment variable KONG_CORS_ORIGINS to:
      # "https://app.sahool.com,https://admin.sahool.com,https://mobile.sahool.com"
      # For development, "*" is used
      origins:
        - "*"  # Replace with ${KONG_CORS_ORIGINS:-*} in production
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Authorization
        - Content-Length
        - Content-Type
        - Date
        - X-Request-Id
        - X-Correlation-Id
      exposed_headers:
        - X-Request-Id
        - X-Correlation-Id
        - X-RateLimit-Limit-Minute
        - X-RateLimit-Remaining-Minute
      # SECURITY FIX: credentials cannot be true with wildcard origin
      # Set to false for development, true only with specific origins in production
      credentials: false
      max_age: 3600
      preflight_continue: false

  # Prometheus metrics for monitoring
  - name: prometheus
    config: {}

  # Request correlation ID for distributed tracing
  # معرف ارتباط الطلب للتتبع الموزع
  - name: correlation-id
    config:
      header_name: X-Correlation-Id
      generator: uuid#counter
      echo_downstream: true

  # Request size limiting to prevent large payload attacks
  # تحديد حجم الطلب لمنع هجمات الحمولة الكبيرة
  - name: request-size-limiting
    config:
      allowed_payload_size: 10  # MB
      size_unit: megabytes
      require_content_length: false

  # Security Headers - Added for all responses
  # رؤوس الأمان - مضافة لجميع الاستجابات
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Content-Type-Options: nosniff"
          - "X-Frame-Options: DENY"
          - "X-XSS-Protection: 1; mode=block"
          - "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload"
          - "Referrer-Policy: strict-origin-when-cross-origin"
          - "Permissions-Policy: geolocation=(), microphone=(), camera=()"
      remove:
        headers:
          - "Server"
          - "X-Powered-By"

  # Bot Detection - Block malicious bots and scrapers
  # كشف الروبوتات - حظر الروبوتات الخبيثة
  - name: bot-detection
    config:
      deny:
        - "sqlmap"
        - "Nikto"
        - "masscan"
        - "ZmEu"
        - "dirbuster"
        - "gobuster"
        - "nuclei"
        - "nmap"
      allow:
        - "Googlebot"
        - "bingbot"

# ------------------------------------------------------------------------------
# Services + Routes
# NOTE:
# - host MUST be the docker-compose service key (not container_name)
# - port is the container listen port (your PORT env var)
# - Only services that exist in docker-compose.yml are included
# ------------------------------------------------------------------------------

services:
  # -----------------------------
  # Node.js services
  # -----------------------------
  - name: field-management-service
    host: field-management-service
    port: 3000
    protocol: http
    routes:
      - name: field-management-service-route
        paths: ["/api/v1/fields", "/api/v1/field", "/field"]
        strip_path: true
        protocols: ["http", "https"]
    plugins:
      # JWT Authentication - Field data is sensitive (geospatial, crop, ownership)
      # مصادقة JWT - بيانات الحقول حساسة (جغرافية مكانية، محاصيل، ملكية)
      - name: jwt
        config:
          claims_to_verify:
            - exp
      # Rate limiting for field management operations
      # تحديد المعدل لعمليات إدارة الحقول
      - name: rate-limiting
        config:
          minute: 60
          hour: 2000
          policy: local
          fault_tolerant: true

  # User Service - Public Authentication Routes (no JWT required)
  # مسارات المصادقة العامة - لا تتطلب رمز JWT
  - name: user-service-public
    host: user-service
    port: 3025
    protocol: http
    routes:
      - name: user-service-auth-public
        paths:
          - /api/v1/auth/login
          - /api/v1/auth/register
          - /api/v1/auth/forgot-password
          - /api/v1/auth/reset-password
          - /api/v1/auth/send-otp
          - /api/v1/auth/verify-otp
          - /api/v1/auth/refresh
        strip_path: false
        protocols: ["http", "https"]
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          hour: 500
          policy: local
          fault_tolerant: true

  # User Service - Protected Routes (requires JWT in production)
  # مسارات المستخدمين المحمية
  - name: user-service
    host: user-service
    port: 3025
    protocol: http
    routes:
      - name: user-service-protected
        paths:
          - /api/v1/auth/logout
          - /api/v1/auth/logout-all
          - /api/v1/auth/me
          - /api/v1/users
        strip_path: false
        protocols: ["http", "https"]
    plugins:
      # JWT Authentication - Protected user routes require authentication
      # مصادقة JWT - المسارات المحمية للمستخدمين تتطلب مصادقة
      - name: jwt
        config:
          claims_to_verify:
            - exp
      - name: rate-limiting
        config:
          minute: 100
          hour: 2000
          policy: local
          fault_tolerant: true

  # User Service - Health endpoints (no auth, no rate limit)
  # نقاط فحص الصحة
  - name: user-service-health
    host: user-service
    port: 3025
    protocol: http
    routes:
