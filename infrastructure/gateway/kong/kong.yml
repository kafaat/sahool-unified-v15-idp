        strip_path: false
        protocols: ["http", "https"]
        methods: ["GET"]
      - name: edge-jobs-route
        paths: ["/api/v1/edge/jobs"]
        strip_path: false
        protocols: ["http", "https"]
        methods: ["POST"]
      - name: edge-base-route
        paths: ["/api/v1/edge"]
        strip_path: true
        protocols: ["http", "https"]
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
      - name: acl
        config:
          allow:
            - professional-users
            - enterprise-users
      - name: rate-limiting
        config:
          minute: 60
          hour: 3000
          policy: local
          fault_tolerant: true
      - name: response-transformer
        config:
