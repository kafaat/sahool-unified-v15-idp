_format_version: "3.0"
_transform: true

# ------------------------------------------------------------------------------
# Kong Declarative Config (DB-less)
# Generated from docker-compose.yml
# Fix applied: service.name + service.host (docker DNS) + service.port (internal)
# Only includes services that actually exist in docker-compose.yml
# ------------------------------------------------------------------------------

# ==============================================================================
# Global Plugins (applies to all routes/services)
# الإضافات العالمية (تُطبق على جميع المسارات والخدمات)
# ==============================================================================
plugins:
  # CORS Configuration - Configured for development
  # Note: In production, replace origins with specific allowed domains
  # ملاحظة: في الإنتاج، استبدل الأصول بالنطاقات المسموح بها فقط
  - name: cors
    config:
      # SECURITY: In production, specify exact origins instead of wildcard
      # Example: ["https://app.sahool.com", "https://admin.sahool.com"]
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Authorization
        - Content-Length
        - Content-Type
        - Date
        - X-Request-Id
        - X-Correlation-Id
      exposed_headers:
        - X-Request-Id
        - X-Correlation-Id
        - X-RateLimit-Limit-Minute
        - X-RateLimit-Remaining-Minute
      # SECURITY FIX: credentials cannot be true with wildcard origin
      # Set to false for development, true only with specific origins in production
      credentials: false
      max_age: 3600
      preflight_continue: false

  # Prometheus metrics for monitoring
  - name: prometheus
    config: {}

  # Request correlation ID for distributed tracing
  # معرف ارتباط الطلب للتتبع الموزع
  - name: correlation-id
    config:
      header_name: X-Correlation-Id
      generator: uuid#counter
      echo_downstream: true

  # Request size limiting to prevent large payload attacks
  # تحديد حجم الطلب لمنع هجمات الحمولة الكبيرة
  - name: request-size-limiting
    config:
      allowed_payload_size: 10  # MB
      size_unit: megabytes
      require_content_length: false

# ------------------------------------------------------------------------------
# Services + Routes
# NOTE:
# - host MUST be the docker-compose service key (not container_name)
# - port is the container listen port (your PORT env var)
# - Only services that exist in docker-compose.yml are included
# ------------------------------------------------------------------------------

services:
  # -----------------------------
  # Node.js services
  # -----------------------------
  - name: field-management-service
    host: field-management-service
    port: 3000
    protocol: http
    routes:
      - name: field-management-service-route
        paths: ["/api/v1/fields", "/api/v1/field", "/field"]
        strip_path: true
        protocols: ["http", "https"]

  # User Service - Public Authentication Routes (no JWT required)
  # مسارات المصادقة العامة - لا تتطلب رمز JWT
  - name: user-service-public
    host: user-service
    port: 3025
    protocol: http
    routes:
      - name: user-service-auth-public
        paths:
          - /api/v1/auth/login
          - /api/v1/auth/register
          - /api/v1/auth/forgot-password
          - /api/v1/auth/reset-password
          - /api/v1/auth/send-otp
          - /api/v1/auth/verify-otp
          - /api/v1/auth/refresh
        strip_path: false
        protocols: ["http", "https"]
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          hour: 500
          policy: local
          fault_tolerant: true

  # User Service - Protected Routes (requires JWT in production)
  # مسارات المستخدمين المحمية
  - name: user-service
    host: user-service
    port: 3025
    protocol: http
    routes:
      - name: user-service-protected
        paths:
          - /api/v1/auth/logout
          - /api/v1/auth/logout-all
          - /api/v1/auth/me
          - /api/v1/users
        strip_path: false
        protocols: ["http", "https"]
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          hour: 2000
          policy: local
          fault_tolerant: true

