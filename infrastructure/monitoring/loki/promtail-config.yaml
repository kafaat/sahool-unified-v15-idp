# SAHOOL Promtail Configuration
# إعدادات Promtail لمنصة سهول

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: sahool
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s

scrape_configs:
  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=sahool*"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
    pipeline_stages:
      # Try to parse JSON logs (structured logging from Python/Node services)
      - json:
          expressions:
            level: level
            message: msg
            service: service
            timestamp: timestamp
            request_id: request_id
            tenant_id: tenant_id
      - labels:
          level:
          service:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02T15:04:05.000Z"
            - "2006-01-02 15:04:05"
      # Drop debug logs in production
      - match:
          selector: '{level="debug"}'
          stages:
            - drop:
                expression: ".*"
                older_than: 1h

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log

  # MQTT broker logs
  - job_name: mqtt
    static_configs:
      - targets:
          - localhost
        labels:
          job: mqtt
          service: mosquitto
          __path__: /var/log/mosquitto/*.log
    pipeline_stages:
      - regex:
          expression: "^(?P<timestamp>\\d{10}): (?P<message>.*)$"
      - timestamp:
          source: timestamp
          format: Unix
