# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Platform - Prometheus Configuration
# إعدادات Prometheus لمنصة سهول الزراعية
# ═══════════════════════════════════════════════════════════════════════════════
# Version: 1.0.0
# Date: 2025-12-25
# Services: 39 microservices + infrastructure

global:
  scrape_interval: 15s        # معدل جمع البيانات - Data collection interval
  evaluation_interval: 15s    # معدل تقييم القواعد - Rule evaluation interval
  scrape_timeout: 10s         # مهلة جمع البيانات - Scrape timeout
  external_labels:
    cluster: 'sahool-platform'
    environment: '${ENVIRONMENT:-production}'
    platform: 'agriculture'
    region: 'yemen'

# Alertmanager configuration - إعدادات مدير التنبيهات
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Alert rules - قواعد التنبيهات
rule_files:
  - /etc/prometheus/alerts/*.yml
  - /etc/prometheus/rules/*.yml

# ═══════════════════════════════════════════════════════════════════════════════
# Scrape Configurations - إعدادات جمع البيانات
# All 39 SAHOOL Services + Infrastructure
# ═══════════════════════════════════════════════════════════════════════════════

scrape_configs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Prometheus Self-Monitoring - مراقبة Prometheus ذاتياً
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          tier: 'monitoring'
          component: 'prometheus'

  # ─────────────────────────────────────────────────────────────────────────────
  # Infrastructure Services - خدمات البنية التحتية
  # ─────────────────────────────────────────────────────────────────────────────

  # PostgreSQL Database - قاعدة البيانات المكانية
  # NOTE: PostgreSQL does not natively expose /metrics on port 5432.
  # Use postgres_exporter (e.g., wrouesnel/postgres_exporter) to expose metrics.
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: /metrics
    scrape_interval: 30s

  # Redis Cache - ذاكرة التخزين المؤقت
  # NOTE: Redis does not natively expose Prometheus metrics on port 6379.
  # Use redis_exporter (e.g., oliver006/redis_exporter) to expose metrics.
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # NATS Message Queue - نظام الرسائل
  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
        labels:
          tier: 'infrastructure'
          component: 'message-queue'
          service: 'nats'
          description: 'NATS JetStream Message Queue'
          description_ar: 'نظام الرسائل NATS JetStream'
    metrics_path: /metrics
    scrape_interval: 15s

  # NATS Prometheus Exporter - Enhanced JetStream Metrics
  - job_name: 'nats-exporter'
    static_configs:
      - targets: ['nats-prometheus-exporter:7777']
        labels:
          tier: 'monitoring'
          component: 'metrics-exporter'
          service: 'nats-exporter'
          description: 'NATS Prometheus Exporter'
          description_ar: 'مُصدِّر مقاييس NATS'
    metrics_path: /metrics
    scrape_interval: 15s

  # Qdrant Vector Database - قاعدة البيانات المتجهة
