  # ─────────────────────────────────────────────────────────────────────────────
  # File-Based Service Discovery - اكتشاف الخدمات من ملفات
  # For dynamic service registration in Kubernetes/Docker environments
  # ─────────────────────────────────────────────────────────────────────────────

  # Dynamic services from file (for Kubernetes/Docker Compose)
  - job_name: 'sahool-services-dynamic'
    file_sd_configs:
      - files:
          - '/etc/prometheus/sd/services/*.json'
          - '/etc/prometheus/sd/services/*.yml'
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [service]
        target_label: job
        replacement: '${1}'

  # ─────────────────────────────────────────────────────────────────────────────
  # Blackbox Exporter - مصدر الصندوق الأسود
  # For endpoint probing and certificate monitoring
  # ─────────────────────────────────────────────────────────────────────────────

  # HTTP endpoint probing
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'https://api.sahool.io/health'
          - 'https://admin.sahool.io/health'
        labels:
          probe_type: 'http'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'

  # TLS certificate monitoring
  - job_name: 'blackbox-tls'
    metrics_path: /probe
    params:
      module: [tcp_connect_tls]
    static_configs:
      - targets:
          - 'api.sahool.io:443'
          - 'admin.sahool.io:443'
        labels:
          probe_type: 'tls'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'
