# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Platform - Prometheus Configuration
# إعدادات Prometheus لمنصة سهول الزراعية
# ═══════════════════════════════════════════════════════════════════════════════
# Version: 2.0.0
# Date: 2026-01-23
# Services: 50+ microservices + infrastructure
# Changes:
#   - Fixed exporter ports for PostgreSQL and Redis
#   - Added missing services from governance/services.yaml
#   - Marked deprecated services
#   - Added recording rules reference
#   - Improved label consistency

global:
  scrape_interval: 15s        # معدل جمع البيانات - Data collection interval
  evaluation_interval: 15s    # معدل تقييم القواعد - Rule evaluation interval
  scrape_timeout: 10s         # مهلة جمع البيانات - Scrape timeout
  external_labels:
    cluster: 'sahool-platform'
    environment: '${ENVIRONMENT:-production}'
    platform: 'agriculture'
    region: 'yemen'

# Alertmanager configuration - إعدادات مدير التنبيهات
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Alert rules - قواعد التنبيهات
rule_files:
  - /etc/prometheus/alerts/*.yml
  - /etc/prometheus/rules/*.yml

# ═══════════════════════════════════════════════════════════════════════════════
# Scrape Configurations - إعدادات جمع البيانات
# All 39 SAHOOL Services + Infrastructure
# ═══════════════════════════════════════════════════════════════════════════════

scrape_configs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Prometheus Self-Monitoring - مراقبة Prometheus ذاتياً
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          tier: 'monitoring'
          component: 'prometheus'

  # ─────────────────────────────────────────────────────────────────────────────
  # Infrastructure Services - خدمات البنية التحتية
  # ─────────────────────────────────────────────────────────────────────────────

  # PostgreSQL Database - قاعدة البيانات المكانية
  # Uses postgres_exporter on port 9187
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          tier: 'infrastructure'
          component: 'database'
          service: 'postgres'
          language: 'sql'
          description: 'PostGIS Spatial Database'
          description_ar: 'قاعدة البيانات المكانية PostGIS'
    metrics_path: /metrics
    scrape_interval: 30s

  # Redis Cache - ذاكرة التخزين المؤقت
  # Uses redis_exporter on port 9121
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          tier: 'infrastructure'
          component: 'cache'
          service: 'redis'
          language: 'c'
          description: 'Redis Cache & Session Store'
          description_ar: 'ذاكرة التخزين المؤقت والجلسات'
    metrics_path: /metrics
    scrape_interval: 30s

  # NATS Message Queue - نظام الرسائل
  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
        labels:
          tier: 'infrastructure'
          component: 'message-queue'
          service: 'nats'
          description: 'NATS JetStream Message Queue'
          description_ar: 'نظام الرسائل NATS JetStream'
    metrics_path: /metrics
    scrape_interval: 15s

  # NATS Prometheus Exporter - Enhanced JetStream Metrics
  - job_name: 'nats-exporter'
    static_configs:
      - targets: ['nats-prometheus-exporter:7777']
        labels:
          tier: 'monitoring'
          component: 'metrics-exporter'
          service: 'nats-exporter'
          description: 'NATS Prometheus Exporter'
          description_ar: 'مُصدِّر مقاييس NATS'
    metrics_path: /metrics
    scrape_interval: 15s

  # Qdrant Vector Database - قاعدة البيانات المتجهة
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
        labels:
          tier: 'infrastructure'
          component: 'vector-db'
          service: 'qdrant'
          description: 'Qdrant Vector Database for AI/RAG'
          description_ar: 'قاعدة البيانات المتجهة للذكاء الاصطناعي'
    metrics_path: /metrics
    scrape_interval: 30s

  # MQTT Broker - وسيط MQTT للأجهزة
  - job_name: 'mqtt'
    static_configs:
      - targets: ['mqtt:9001']
        labels:
          tier: 'infrastructure'
