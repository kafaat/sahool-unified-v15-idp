# ═══════════════════════════════════════════════════════════════════════════════
# SAHOOL Platform — Audit Service Alert Rules
# قواعد تنبيهات خدمة التدقيق
# ═══════════════════════════════════════════════════════════════════════════════
# Purpose:
#   Catch the worst-case scenario for an audit pipeline — working plumbing
#   that nobody feeds. A compliance audit trail with zero writes is worse
#   than no audit trail at all because it masks the gap.
#
# Prerequisites — audit-service must expose:
#   * audit_writes_total{tenant_id="..."} counter
#     Incremented on every successful write through AuditStore.write().
#   * audit_chain_valid{tenant_id="..."} gauge (0/1)
#     Set by a periodic validate_chain() job; 0 means tampering detected.
#   * audit_store_backend{kind="postgres"|"in_memory"} gauge (1)
#     Labels the backend currently serving the store.
#
# Version: 1.0.0
# Added:   2026-04-17 (P0 from audit-service audit report)
# ═══════════════════════════════════════════════════════════════════════════════

groups:
  # ───────────────────────────────────────────────────────────────────────────
  # Pipeline health — detect "Potemkin audit" (wired but not fed).
  # ───────────────────────────────────────────────────────────────────────────
  - name: sahool_audit_pipeline
    interval: 60s
    rules:
      - alert: AuditServiceNotReceivingWrites
        # Aggregate by tenant_id so the alert fires per-tenant (and the
        # tenant label survives into notifications / Alertmanager routing).
        # Stripping tenant_id with a bare `sum(...)` would mask a single
        # tenant going dark behind the aggregate of everyone else.
        expr: |
          sum by (tenant_id) (rate(audit_writes_total[5m])) == 0
          and on() max(up{job="audit-service"}) == 1
        for: 10m
        labels:
          severity: warning
          category: compliance
          platform: sahool
          runbook: docs/operations/audit-runbook.md
        annotations:
          summary: "Audit service is running but receiving zero writes for 10m"
          summary_ar: "خدمة التدقيق تعمل لكن لا تستقبل كتابات لمدة 10 دقائق"
          description: |
            audit-service is alive (up == 1) but audit_writes_total is flat.
            This usually means one of:
              * A caller service was recently rewritten without calling
                shared/audit_trail.log_action().
              * A regression silenced audit-emitting middleware.
              * NATS subscribers disconnected without a retry loop.
            Compliance frameworks (GDPR, SOC 2, GlobalGAP) require an
            unbroken log — reaching this alert means the log has a gap.
          runbook_url: https://sahool.io/runbooks/audit-no-writes

      - alert: AuditServiceWriteRateBelowBaseline
        # Per-tenant baseline comparison. Each tenant's 5-minute rate is
        # compared to its own 1-hour rolling average so a quiet tenant
        # doesn't look anomalous next to a busy one. The `> 0.01` guard
        # excludes tenants with essentially no traffic (would divide by
        # near-zero). Preserving `tenant_id` on the output series is
        # required for the notification template and for Alertmanager to
        # group / route per tenant.
        expr: |
          (
            sum by (tenant_id) (rate(audit_writes_total[5m]))
            /
            sum by (tenant_id) (rate(audit_writes_total[1h]))
          ) < 0.2
          and
          sum by (tenant_id) (rate(audit_writes_total[1h])) > 0.01
        for: 15m
        labels:
          severity: info
          category: compliance
          platform: sahool
        annotations:
          summary: "Audit write rate dropped below 20% of 1h baseline"
          summary_ar: "معدل كتابة التدقيق انخفض تحت 20% من الخط الأساس لساعة"

  # ───────────────────────────────────────────────────────────────────────────
  # Data integrity — hash chain must stay valid.
  # ───────────────────────────────────────────────────────────────────────────
  - name: sahool_audit_integrity
    interval: 5m
    rules:
      - alert: AuditHashChainBroken
        # `by (tenant_id)` keeps the tenant label on the output series so
        # {{ $labels.tenant_id }} in the summary/description below actually
        # resolves. A bare `min(audit_chain_valid)` would drop all labels
        # and the notification would say "tenant "" has a broken chain".
        expr: min by (tenant_id) (audit_chain_valid) == 0
        for: 2m
        labels:
          severity: critical
          category: security
          platform: sahool
          runbook: docs/operations/audit-runbook.md
        annotations:
          summary: "Audit hash chain validation failed for tenant {{ $labels.tenant_id }}"
          summary_ar: "فشل التحقق من سلسلة التجزئة للمستأجر {{ $labels.tenant_id }}"
          description: |
            A scheduled validate_chain() run recomputed the SHA-256 chain
            for tenant {{ $labels.tenant_id }} and found a mismatch.
            Possible causes:
              * Row-level tampering (row UPDATE'd outside the service).
              * A bug in the hash computation (e.g. HMAC secret rotated
                without re-hashing).
              * Data loss / corruption (truncated rows).
            This is a compliance-grade incident; page the on-call
            immediately and freeze new writes until the chain is re-anchored.
          runbook_url: https://sahool.io/runbooks/audit-chain-broken

  # ───────────────────────────────────────────────────────────────────────────
  # Backend posture — in-memory mode in prod is always a bug.
  # ───────────────────────────────────────────────────────────────────────────
  - name: sahool_audit_backend
    interval: 5m
    rules:
      - alert: AuditServiceRunningOnInMemoryBackend
        expr: |
          max(audit_store_backend{kind="in_memory"}) == 1
          and on() (env{env="production"} == 1 or env{env="staging"} == 1)
        for: 5m
        labels:
          severity: critical
          category: compliance
          platform: sahool
        annotations:
          summary: "audit-service is using the in-memory backend in non-dev"
          summary_ar: "خدمة التدقيق تعمل على التخزين المؤقت في بيئة غير التطوير"
          description: |
            The in-memory backend is a fallback for CI and unit tests only.
            Writes are lost on restart; compliance requirements are not
            satisfied. Check DATABASE_URL, network reachability to
            PgBouncer, and the audit_service_schema_migrations table.

  # ───────────────────────────────────────────────────────────────────────────
  # Retention pipeline — worker must run on schedule; chain re-anchors are
  # legitimate but operators should be notified on first occurrence per tenant.
  # ───────────────────────────────────────────────────────────────────────────
  - name: sahool_audit_retention
    interval: 5m
    rules:
      - alert: AuditRetentionJobStalled
        # audit_retention_last_run_timestamp_seconds is pushed by the
        # nightly CronJob on every successful completion. If the delta
        # against `time()` exceeds 25h the worker has missed a run —
        # audit_log will grow unbounded until the job is restored.
        expr: time() - audit_retention_last_run_timestamp_seconds > 25 * 3600
        for: 5m
        labels:
          severity: warning
          category: compliance
          platform: sahool
          runbook: docs/operations/audit-runbook.md
        annotations:
          summary: "Audit retention worker hasn't completed in > 25 hours"
          summary_ar: "عامل الاحتفاظ لم يُكمل التشغيل منذ أكثر من 25 ساعة"
          description: |
            The audit-retention-worker CronJob has not pushed a completion
            timestamp in over 25 hours. Expected cadence is nightly (<24h
            between runs). Without retention the audit_log table will grow
            unbounded and breach storage budgets.
            Check:
              * kubectl get cronjob audit-retention-worker -n audit
              * kubectl logs -l job-name=audit-retention-worker --tail=200
              * The audit_retention DB role + DSN secret in Vault.
              * Pushgateway reachability from the worker pod.
          runbook_url: https://sahool.io/runbooks/audit-retention-stalled

      - alert: AuditRetentionFirstRunDetected
        # audit_chain_retention_gaps_crossed is a per-tenant gauge that
        # becomes non-zero the first time retention truncates a tenant's
        # chain. This is expected behaviour — the alert exists so operators
        # confirm validate_chain() still returns valid:true afterwards.
        # Routes to a low-noise informational channel, never pages.
        expr: audit_chain_retention_gaps_crossed > 0
        for: 5m
        labels:
          severity: info
          category: compliance
          platform: sahool
        annotations:
          summary: "Retention has truncated chain for tenant {{ $labels.tenant_id }} (gaps={{ $value }})"
          summary_ar: "تمّ تقطيع السلسلة بواسطة الاحتفاظ للمستأجر {{ $labels.tenant_id }}"
