version: "3.8"

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # Prometheus - Metrics Collection
  # ═══════════════════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: sahool-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - sahool-observability
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Grafana - Visualization
  # ═══════════════════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:10.3.0
    container_name: sahool-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.sahool.io
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - sahool-observability
    depends_on:
      - prometheus
      - loki
      - tempo

  # ═══════════════════════════════════════════════════════════════════════════
  # Loki - Log Aggregation
  # ═══════════════════════════════════════════════════════════════════════════
  loki:
    image: grafana/loki:2.9.0
    container_name: sahool-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - sahool-observability

  # ═══════════════════════════════════════════════════════════════════════════
  # Tempo - Distributed Tracing
  # ═══════════════════════════════════════════════════════════════════════════
  tempo:
    image: grafana/tempo:2.3.0
    container_name: sahool-tempo
    command: -config.file=/etc/tempo.yaml
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    networks:
      - sahool-observability

  # ═══════════════════════════════════════════════════════════════════════════
  # Promtail - Log Shipper
  # ═══════════════════════════════════════════════════════════════════════════
  promtail:
    image: grafana/promtail:2.9.0
    container_name: sahool-promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - sahool-observability
    depends_on:
      - loki

  # ═══════════════════════════════════════════════════════════════════════════
  # NATS Exporter - NATS Metrics for Prometheus
  # ═══════════════════════════════════════════════════════════════════════════
  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.14.0
    container_name: sahool-nats-exporter
    command:
      - -varz
      - -connz
      - -routez
      - -subz
      - -jsz=all
      - -http_port=7777
      - http://nats:8222
    ports:
      - "7777:7777"
    networks:
      - sahool-observability

  # ═══════════════════════════════════════════════════════════════════════════
  # OpenTelemetry Collector
  # ═══════════════════════════════════════════════════════════════════════════
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: sahool-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "55679:55679"  # zpages
    networks:
      - sahool-observability

networks:
  sahool-observability:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
