[project]
name = "sahool-unified"
version = "16.0.0"
description = "SAHOOL - Smart Agricultural Platform for Yemen & Middle East"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Proprietary"}
authors = [
    {name = "KAFAAT Team", email = "dev@kafaat.io"}
]

[project.optional-dependencies]
base = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.41.0",
    "pydantic>=2.10.0,<3.0.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "aiohttp>=3.13.3",  # Security fixes for CVE-2025-53643 and CVE-2025-69223
    "tenacity>=8.2.0,<10.0.0",  # Retry with backoff (used by globalgap, vision services)
]
infrastructure = [
    "asyncpg==0.31.0",
    "tortoise-orm==0.25.4",
    "aerich==0.9.2",
    "nats-py==2.14.0",
    "redis>=7.1.0,<8.0.0",
    "python-jose[cryptography]==3.5.0",  # CVE-2024-33663, CVE-2024-33664
    "PyJWT>=2.10.1,<3.0.0",  # CVE-2024-53861 (issuer validation bypass) fixed in 2.10.1
    "passlib[bcrypt]==1.7.4",
    # Security: minimum versions to fix known CVEs
    "cryptography>=44.0.1,<47.0.0",  # CVE-2024-12797 fixed in 44.0.1, CVE-2026-26007 fixed in 46.0.5
    "setuptools>=78.1.1",    # PYSEC-2025-49, GHSA-cx63-2mw6-8hw5
    "wheel>=0.46.2",         # GHSA-8rrh-rw8j-w5fx
]
observability = [
    "prometheus-client==0.24.1",
    "opentelemetry-api==1.40.0",
    "opentelemetry-sdk==1.40.0",
    "opentelemetry-instrumentation-fastapi==0.61b0",
    "structlog==24.4.0",
]
testing = [
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
    "pytest-cov>=6.0.0",
    "pytest-mock==3.15.1",
    "pytest-xdist==3.8.0",
]
ml = [
    "Pillow==12.1.1",  # CVE-2026-25990 (OOB write in PSD handler) fixed in 12.1.1
    "numpy>=1.26.0,<2.5.0",  # Pinned <2.5.0 for TensorFlow 2.20 compatibility (NumPy 2.5+ breaks TF)
    "tensorflow-cpu==2.21.0",
]
dev = [
    "ruff==0.15.5",
    "pre-commit==4.5.1",
    "black==24.10.0",
    "isort==5.13.2",
]

[tool.ruff]
line-length = 120  # Increased for AI/RAG services with long descriptions
target-version = "py311"
exclude = [
    "archive/",
    "idp/templates/",
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM","N","W","C4","C90"]  # Added C90 for complexity
ignore = [
    "B008",  # Depends/Query in FastAPI function defaults is standard pattern
    "B904",  # Exception chaining - not critical, best effort fixed
    "E501",  # Line too long - handled by formatter (line-length = 120)
    "C901",  # Function too complex - allowed up to 20 for AI/RAG services
    "B007",  # Loop control variable not used - often intentional
    "B006",  # Mutable default argument - sometimes intentional
    "N814",  # CamelCase imported as constant - common pattern
    "N815",  # Variable in class scope mixedCase - existing codebase style
    "N806",  # Variable should be lowercase - false positives
    "N805",  # First arg should be self - sometimes intentional (classmethods)
    "N999",  # Invalid module name - directory structure is intentional
    "N818",  # Exception naming - existing codebase style
    "N802",  # Function name should be lowercase - some patterns are intentional
    "N803",  # Argument name should be lowercase - math variables like X, Y
    "B905",  # zip() without strict - Python 3.10+ only
    "E712",  # Comparison to True/False - SQLAlchemy filter pattern
    "E741",  # Ambiguous variable name - sometimes intentional (l, O, I)
    "E722",  # Bare except - sometimes needed for catch-all
    "E721",  # Type comparison using == - sometimes intentional
    "B018",  # Useless expression - sometimes intentional for documentation
    "B026",  # Star-arg unpacking - valid pattern in some cases
    "B027",  # Empty method in ABC without @abstractmethod - optional hooks pattern
    # Non-essential style rules - relaxed for productivity
    "SIM102", # Nested if statements - style preference
    "SIM103", # Return condition directly - sometimes less clear
    "SIM116", # Dictionary instead of if statements - style preference
    "SIM105", # Use contextlib.suppress - explicit try-except often clearer
    "SIM108", # Ternary operator - readability preference
    "SIM115", # Context manager for files - not always needed
    "SIM117", # Multiple context managers - style preference
    "SIM210", # True if else False - sometimes clearer
    "SIM222", # Use True instead of or True - edge cases
    "E731",   # Lambda assignment - sometimes cleaner
    "F841",   # Unused variable - often intentional placeholders
    "UP035",  # Deprecated typing imports - backwards compat
    "I001",   # Import sorting - auto-formatter handles this
]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
# Complexity threshold for AI/RAG services with decision logic
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E402", "B017", "F401", "F821", "F841", "N801", "N817"]
"**/__init__.py" = ["F401"]
"**/main.py" = ["E402", "F401", "F821"]  # Allow imports after sys.path modifications
"**/examples/*" = ["F401", "F821", "E402"]  # Example code may have unused imports
"**/example*.py" = ["F401", "F821", "E402"]  # Example files
"**/*_example*.py" = ["F401", "F821", "E402"]  # Example files with prefix
"archive/**" = ["F401", "F841", "F821", "E402"]  # Legacy archive code
"legacy/**" = ["F401", "F841", "F821", "E402"]  # Legacy code
"**/seeds/*" = ["F401"]  # Seed files
"**/migrations/*" = ["F401", "E402"]  # Migration files
"scripts/**" = ["F401", "E402"]  # Scripts may have conditional imports
"**/services/*/src/*" = ["F401", "E402"]  # Services may have conditional imports
"apps/kernel/**" = ["F401", "E402"]  # Kernel modules
"shared/auth/*" = ["F401", "F821", "E402"]  # Auth module examples
"shared/a2a/*" = ["F401", "F821"]  # A2A optional dependencies
"shared/libs/*" = ["F401"]  # Shared libs
"shared/observability/*" = ["F401"]  # Observability optional deps
"shared/events/*" = ["SIM103"]  # Event handlers style
"shared/contracts/__init__.py" = ["F403", "F405"]  # Star imports needed for re-exports
"shared/contracts/events/*" = ["E402"]  # Module imports after docstring
"shared/lowcode/*" = ["F402"]  # Loop variable shadowing is intentional
"shared/mcp/*" = ["F401"]  # Optional conditional imports
"shared/ai/__init__.py" = ["E402", "F401"]  # Complex module with conditional imports
"shared/ai/grpo_trainer.py" = ["F401"]  # Conditional torch import
"shared/ai/observability.py" = ["F401", "F811"]  # Re-exports and conditional pytest
"shared/service_enhancements/*" = ["E402"]  # Services may have conditional imports
"**/verify*.py" = ["F401", "F821"]  # Verification scripts
"**/test_*.py" = ["F401", "F821", "E402"]  # Test files outside tests folder
"apps/services/vegetation-analysis-service/test_*.py" = ["E402"]  # Tests with path manipulation
"apps/services/edge-orchestrator-service/**" = ["SIM102"]  # Nested if for clarity
"apps/mobile/**/scripts/*" = ["F401"]  # Mobile scripts
"apps/mobile/**/test/*" = ["F401", "F402"]  # Mobile test simulations
"apps/services/shared/**" = ["F401"]  # Services shared code
"packages/sahool-eo/**" = ["N999", "N803"]  # Package naming and scientific notation vars
"tools/**" = ["E402"]  # Tools may have sys.path modifications

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
testpaths = ["tests", "apps/services"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::DeprecationWarning:tortoise.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore:cannot collect test class '.*' because it has a __init__ constructor:pytest.PytestCollectionWarning",
]
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (API, database)",
    "smoke: Smoke tests (import verification)",
    "slow: Slow running tests (deselect with '-m \"not slow\"')",
    "e2e: End-to-end workflow tests (requires full stack)",
    "health: Health check tests",
    "api: API endpoint tests",
    "dataflow: Data flow tests",
    "workflow: Workflow tests",
    "security: Security tests",
    "snapshot: Snapshot tests",
    "arabic: Tests with Arabic content",
    "evaluation: Agent evaluation suite tests",
    "golden: Tests using golden dataset",
    "english: Tests for English language support",
    "latency: Tests for latency measurement",
    "safety: Tests for safety checking",
    "fixops: FixOps auto-fix engine tests",
    "llm: Tests for LLM provider functionality",
    "guardrails: Tests for AI safety guardrails",
]

[tool.coverage.run]
source = ["shared", "apps/kernel", "apps/services"]
branch = true
omit = [
    "**/tests/*",
    "**/__pycache__/*",
    "**/migrations/*",
    "**/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 0
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "coverage_html"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
exclude = [
    "archive/",
    "tests/",
    ".venv/",
]
