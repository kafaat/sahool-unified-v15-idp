# ═══════════════════════════════════════════════════════════════════════════════
# Trusted Agricultural Knowledge Sources
# مصادر المعرفة الزراعية الموثوقة
# ═══════════════════════════════════════════════════════════════════════════════
#
# Credibility Levels (مستويات المصداقية):
#   5 = International organizations (منظمات دولية)
#   4 = Government/University (حكومات/جامعات)
#   3 = Local research centers (مراكز بحثية محلية)
#   2 = Specialized websites (مواقع متخصصة)
#   1 = Community/blogs (مجتمعات/مدونات)
#
# ═══════════════════════════════════════════════════════════════════════════════

sources:
  # ─── Level 5: International Organizations (منظمات دولية) ─────────────────

  - name: "FAO - Food and Agriculture Organization"
    name_ar: "منظمة الأغذية والزراعة (الفاو)"
    url_patterns:
      - "fao.org"
      - "agris.fao.org"
      - "aims.fao.org"
    credibility: 5
    domains: [crops, soil, irrigation, fertilizer, pest_disease, weather, general]
    languages: [en, ar, fr, es]
    region_coverage: [global]
    notes: "Primary reference for AGROVOC concepts and global best practices"

  - name: "ICARDA - International Center for Agricultural Research in the Dry Areas"
    name_ar: "المركز الدولي للبحوث الزراعية في المناطق الجافة (إيكاردا)"
    url_patterns:
      - "icarda.org"
    credibility: 5
    domains: [crops, irrigation, soil, general]
    languages: [en, ar]
    region_coverage: [mena, central_asia, global]
    notes: "Key reference for dryland agriculture, wheat, barley, lentils"

  - name: "CGIAR - Consultative Group on International Agricultural Research"
    name_ar: "المجموعة الاستشارية للبحوث الزراعية الدولية"
    url_patterns:
      - "cgiar.org"
      - "worldagroforestry.org"
      - "ciat.cgiar.org"
      - "irri.org"
    credibility: 5
    domains: [crops, soil, irrigation, weather, general]
    languages: [en]
    region_coverage: [global]
    notes: "Network of 15 research centers, open-access data"

  - name: "WHO/CODEX - Food Safety Standards"
    name_ar: "منظمة الصحة العالمية / الدستور الغذائي"
    url_patterns:
      - "who.int"
      - "codexalimentarius.org"
    credibility: 5
    domains: [pest_disease, fertilizer, general]
    languages: [en, ar, fr]
    region_coverage: [global]
    notes: "Pesticide MRLs, food safety guidelines"

  - name: "USDA - United States Department of Agriculture"
    name_ar: "وزارة الزراعة الأمريكية"
    url_patterns:
      - "usda.gov"
      - "ars.usda.gov"
      - "nrcs.usda.gov"
    credibility: 5
    domains: [crops, soil, irrigation, fertilizer, pest_disease, weather, remote_sensing]
    languages: [en]
    region_coverage: [global]
    notes: "Soil taxonomy, crop databases, NRCS soil surveys"

  # ─── Level 4: Government/University (حكومات/جامعات) ──────────────────────

  - name: "MEWA - Ministry of Environment, Water and Agriculture (Saudi Arabia)"
    name_ar: "وزارة البيئة والمياه والزراعة - المملكة العربية السعودية"
    url_patterns:
      - "mewa.gov.sa"
    credibility: 4
    domains: [crops, irrigation, soil, general]
    languages: [ar, en]
    region_coverage: [saudi_arabia, gcc]
    notes: "Saudi agricultural regulations, water policy, crop guidelines"

  - name: "Ministry of Agriculture - Yemen"
    name_ar: "وزارة الزراعة والري - اليمن"
    url_patterns:
      - "agriculture.gov.ye"
      - "mai.gov.ye"
    credibility: 4
    domains: [crops, irrigation, soil, general]
    languages: [ar]
    region_coverage: [yemen]
    notes: "Yemen crop guidelines, regional adaptation"

  - name: "ACSAD - Arab Center for the Studies of Arid Zones and Dry Lands"
    name_ar: "المركز العربي لدراسات المناطق الجافة والأراضي القاحلة (أكساد)"
    url_patterns:
      - "acsad.org"
    credibility: 4
    domains: [crops, irrigation, soil, weather, general]
    languages: [ar, en]
    region_coverage: [arab_world, mena]
    notes: "Dryland agriculture, water management, soil reclamation"

  - name: "King Saud University - Agriculture"
    name_ar: "جامعة الملك سعود - كلية الزراعة"
    url_patterns:
      - "ksu.edu.sa"
    credibility: 4
    domains: [crops, soil, irrigation, pest_disease]
    languages: [ar, en]
    region_coverage: [saudi_arabia, gcc]
    notes: "Saudi agricultural research, extension bulletins"

  - name: "King Abdulaziz University"
    name_ar: "جامعة الملك عبدالعزيز"
    url_patterns:
      - "kau.edu.sa"
    credibility: 4
    domains: [crops, soil, irrigation, remote_sensing]
    languages: [ar, en]
    region_coverage: [saudi_arabia, gcc]

  - name: "Sana'a University - Agriculture"
    name_ar: "جامعة صنعاء - كلية الزراعة"
    url_patterns:
      - "su.edu.ye"
    credibility: 4
    domains: [crops, soil, irrigation]
    languages: [ar]
    region_coverage: [yemen]

  - name: "UAE Ministry of Climate Change and Environment"
    name_ar: "وزارة التغير المناخي والبيئة - الإمارات"
    url_patterns:
      - "moccae.gov.ae"
    credibility: 4
    domains: [crops, irrigation, weather, general]
    languages: [ar, en]
    region_coverage: [uae, gcc]

  - name: "ESA - European Space Agency (Sentinel)"
    name_ar: "وكالة الفضاء الأوروبية"
    url_patterns:
      - "esa.int"
      - "sentinel.esa.int"
      - "scihub.copernicus.eu"
      - "copernicus.eu"
    credibility: 4
    domains: [remote_sensing]
    languages: [en]
    region_coverage: [global]
    notes: "Sentinel-2 satellite data for NDVI, LAI, water stress"

  # ─── Level 3: Local Research Centers (مراكز بحثية محلية) ──────────────────

  - name: "AREA - Agricultural Research and Extension Authority (Yemen)"
    name_ar: "الهيئة العامة للبحوث والإرشاد الزراعي - اليمن"
    url_patterns:
      - "area.gov.ye"
    credibility: 3
    domains: [crops, soil, irrigation, pest_disease]
    languages: [ar]
    region_coverage: [yemen]
    notes: "Yemen field trials, local crop varieties, extension materials"

  - name: "NCARE - National Center for Agricultural Research (Jordan)"
    name_ar: "المركز الوطني للبحوث الزراعية - الأردن"
    url_patterns:
      - "ncare.gov.jo"
    credibility: 3
    domains: [crops, irrigation, soil]
    languages: [ar, en]
    region_coverage: [jordan, mena]

  - name: "ARC - Agricultural Research Center (Egypt)"
    name_ar: "مركز البحوث الزراعية - مصر"
    url_patterns:
      - "arc.sci.eg"
    credibility: 3
    domains: [crops, soil, irrigation, pest_disease, fertilizer]
    languages: [ar, en]
    region_coverage: [egypt, mena]
    notes: "Major reference for wheat, cotton, rice in Arab region"

  - name: "KACST - King Abdulaziz City for Science and Technology"
    name_ar: "مدينة الملك عبدالعزيز للعلوم والتقنية"
    url_patterns:
      - "kacst.edu.sa"
    credibility: 3
    domains: [remote_sensing, irrigation, general]
    languages: [ar, en]
    region_coverage: [saudi_arabia]

  # ─── Level 2: Specialized Websites (مواقع متخصصة) ─────────────────────────

  - name: "CropIn - Agricultural Intelligence"
    name_ar: "كروب إن - الذكاء الزراعي"
    url_patterns:
      - "cropin.com"
    credibility: 2
    domains: [crops, remote_sensing, general]
    languages: [en]
    region_coverage: [global]
    notes: "500+ crop knowledge graph, 103 countries"

  - name: "AgriExpo - Agricultural Equipment"
    name_ar: "أجري إكسبو"
    url_patterns:
      - "agriexpo.online"
    credibility: 2
    domains: [irrigation, general]
    languages: [en, ar]
    region_coverage: [global]

  - name: "ScienceDirect - Agricultural Sciences"
    name_ar: "ساينس دايركت - العلوم الزراعية"
    url_patterns:
      - "sciencedirect.com"
    credibility: 2
    domains: [crops, soil, irrigation, fertilizer, pest_disease, weather, remote_sensing]
    languages: [en]
    region_coverage: [global]
    notes: "Peer-reviewed, requires validation of specific claims"

  - name: "Springer Nature - Agriculture"
    name_ar: "سبرينجر نيتشر - الزراعة"
    url_patterns:
      - "springer.com"
      - "nature.com"
    credibility: 2
    domains: [crops, soil, irrigation, remote_sensing, general]
    languages: [en]
    region_coverage: [global]

  - name: "الشبكة العربية للزراعة المستدامة"
    name_ar: "الشبكة العربية للزراعة المستدامة"
    url_patterns:
      - "arasannet.org"
    credibility: 2
    domains: [crops, soil, irrigation, general]
    languages: [ar]
    region_coverage: [arab_world]

  # ─── New Sources from Research (added 2026-03) ──────────────────────────────

  - name: "FAO AGROVOC Thesaurus"
    name_ar: "مكنز الفاو الزراعي (أجروفوك)"
    url_patterns:
      - "agrovoc.fao.org"
    credibility: 5
    domains: [crops, soil, irrigation, fertilizer, pest_disease, weather, general, smart_agriculture]
    languages: [en, ar, fr, es, zh]
    region_coverage: [global]
    notes: "41,400+ concepts, 1,219,000+ terms, 42 languages. SKOS-XL Linked Open Data."

  - name: "CGIAR Crop Ontology"
    name_ar: "أنطولوجيا المحاصيل - CGIAR"
    url_patterns:
      - "cropontology.org"
      - "bigdata.cgiar.org"
    credibility: 5
    domains: [crops, soil, general]
    languages: [en]
    region_coverage: [global]
    notes: "Crop Ontology (CO), Agronomy Ontology (AgrO), Socio-Economic Ontology"

  - name: "World Bank - Digital Agriculture"
    name_ar: "البنك الدولي - الزراعة الرقمية"
    url_patterns:
      - "worldbank.org"
      - "openknowledge.worldbank.org"
    credibility: 5
    domains: [general, smart_agriculture]
    languages: [en, ar]
    region_coverage: [global]
    notes: "Digital Agriculture Roadmap 2025, mobile apps for agriculture studies"

  - name: "arXiv - Agricultural AI Research"
    name_ar: "أركايف - أبحاث الذكاء الاصطناعي الزراعي"
    url_patterns:
      - "arxiv.org"
    credibility: 3
    domains: [crops, pest_disease, remote_sensing, smart_agriculture]
    languages: [en]
    region_coverage: [global]
    notes: "Pre-prints. Key refs: AgriRegion (2512.10114), CRAG (2401.15884), AgroAskAI (2512.14910)"

  - name: "Frontiers - Plant Science"
    name_ar: "فرونتيرز - علوم النبات"
    url_patterns:
      - "frontiersin.org"
    credibility: 3
    domains: [crops, pest_disease, soil, general]
    languages: [en]
    region_coverage: [global]
    notes: "Crop GraphRAG (2026), C3PO ontology, peer-reviewed open access"

  - name: "MDPI - Agriculture"
    name_ar: "MDPI - الزراعة"
    url_patterns:
      - "mdpi.com"
    credibility: 3
    domains: [crops, irrigation, remote_sensing, smart_agriculture]
    languages: [en]
    region_coverage: [global]
    notes: "AGRARIAN architecture (2025), Digital Twins review, open access"

  - name: "Farmonaut - Agriculture Technology"
    name_ar: "فارمونوت - تقنية الزراعة"
    url_patterns:
      - "farmonaut.com"
    credibility: 2
    domains: [smart_agriculture, remote_sensing]
    languages: [en]
    region_coverage: [global]
    notes: "Middle East agriculture 2025, robotics market data"

  - name: "ThingsBoard - IoT Platform"
    name_ar: "ثينجز بورد - منصة إنترنت الأشياء"
    url_patterns:
      - "thingsboard.io"
    credibility: 2
    domains: [smart_agriculture]
    languages: [en]
    region_coverage: [global]
    notes: "Open-source IoT platform for smart farming"

  - name: "XAG - Agricultural Drones"
    name_ar: "XAG - طائرات زراعية مسيرة"
    url_patterns:
      - "xa.com"
    credibility: 2
    domains: [smart_agriculture]
    languages: [en, zh]
    region_coverage: [global, china]
    notes: "Autonomous agricultural drones, swarm capability"

  - name: "Taylor & Francis - Agricultural Engineering"
    name_ar: "تايلور وفرانسيس - الهندسة الزراعية"
    url_patterns:
      - "tandfonline.com"
    credibility: 3
    domains: [irrigation, smart_agriculture]
    languages: [en]
    region_coverage: [global]
    notes: "Digital twins for smart irrigation (2025)"

  - name: "PMC - Agricultural Research"
    name_ar: "المكتبة المركزية الطبية - البحوث الزراعية"
    url_patterns:
      - "pmc.ncbi.nlm.nih.gov"
      - "pubmed.ncbi.nlm.nih.gov"
    credibility: 3
    domains: [pest_disease, crops, smart_agriculture]
    languages: [en]
    region_coverage: [global]
    notes: "RDW-YOLO, RS-YOLO, AI+IoT edge devices for crop protection"

  # ─── Precision Farming Sources (الزراعة الدقيقة) ────────────────────────────

  - name: "ISPA - International Society of Precision Agriculture"
    name_ar: "الجمعية الدولية للزراعة الدقيقة"
    url_patterns:
      - "ispag.org"
      - "precisionag.com"
    credibility: 4
    domains: [precision_farming, smart_agriculture, remote_sensing]
    languages: [en]
    region_coverage: [global]
    notes: "Precision Agriculture journal, VRA, site-specific management"

  - name: "John Deere - Precision Agriculture"
    name_ar: "جون دير - الزراعة الدقيقة"
    url_patterns:
      - "deere.com"
      - "stellarsupport.deere.com"
    credibility: 2
    domains: [precision_farming, smart_agriculture]
    languages: [en, ar]
    region_coverage: [global]
    notes: "GPS guidance, variable rate technology, yield mapping"

  - name: "Trimble Agriculture"
    name_ar: "تريمبل للزراعة"
    url_patterns:
      - "agriculture.trimble.com"
      - "trimble.com"
    credibility: 2
    domains: [precision_farming, smart_agriculture]
    languages: [en]
    region_coverage: [global]
    notes: "RTK guidance, water management, farm management software"

  # ─── Digital Twin Sources (التوأم الرقمي) ──────────────────────────────────

  - name: "FAO - Digital Agriculture"
    name_ar: "الفاو - الزراعة الرقمية"
    url_patterns:
      - "fao.org/digital-agriculture"
      - "fao.org/3"
    credibility: 5
    domains: [digital_twin, smart_agriculture, general]
    languages: [en, ar]
    region_coverage: [global]
    notes: "FAO Digital Agriculture Roadmap, digital twin guidelines for food systems"

  - name: "IEEE - Digital Twin Agriculture"
    name_ar: "IEEE - التوأم الرقمي الزراعي"
    url_patterns:
      - "ieee.org"
      - "ieeexplore.ieee.org"
    credibility: 4
    domains: [digital_twin, smart_agriculture, precision_farming]
    languages: [en]
    region_coverage: [global]
    notes: "Digital twin architectures, IoT-enabled farm simulation, edge computing"

  - name: "Wageningen University - Digital Twins"
    name_ar: "جامعة فاخنينغن - التوائم الرقمية"
    url_patterns:
      - "wur.nl"
      - "edepot.wur.nl"
    credibility: 4
    domains: [digital_twin, precision_farming, crops, soil]
    languages: [en]
    region_coverage: [global]
    notes: "Leading research on crop digital twins, greenhouse simulation, soil modeling"

  # ─── Mechanized Irrigation Sources (الري الميكانيكي) ─────────────────────────

  - name: "Valley Irrigation (Valmont Industries)"
    name_ar: "فالي للري (فالمونت إندستريز)"
    url_patterns:
      - "valleyirrigation.com"
      - "valmont.com/agriculture"
      - "agsense365.com"
    credibility: 3
    domains: [irrigation, precision_farming, smart_agriculture]
    languages: [en, ar]
    region_coverage: [global, mena, saudi_arabia]
    notes: "World leader in center pivot irrigation, LEPA/LESA, VRI, AgSense 365 telemetry"

  - name: "Lindsay Corporation (Zimmatic)"
    name_ar: "ليندسي كوربوريشن (زيماتيك)"
    url_patterns:
      - "lindsay.com"
      - "zimmatic.com"
      - "fieldnet.com"
    credibility: 3
    domains: [irrigation, precision_farming]
    languages: [en]
    region_coverage: [global]
    notes: "Zimmatic pivots, FieldNET remote management, GPS guidance"

  - name: "Reinke Manufacturing"
    name_ar: "رينكي للتصنيع"
    url_patterns:
      - "reinke.com"
    credibility: 2
    domains: [irrigation, precision_farming]
    languages: [en]
    region_coverage: [global]
    notes: "Center pivot and lateral move irrigation systems, electrogator"

  - name: "Irrigation Association"
    name_ar: "جمعية الري"
    url_patterns:
      - "irrigation.org"
    credibility: 4
    domains: [irrigation, precision_farming, smart_agriculture]
    languages: [en]
    region_coverage: [global]
    notes: "Industry standards, certification, best practices for mechanized irrigation"
